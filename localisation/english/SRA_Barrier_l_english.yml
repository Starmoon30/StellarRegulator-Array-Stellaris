 decision_SRA_Barrier_Guard_fleet:0 "Redeploy Defense Array"
 decision_SRA_Barrier_Guard_fleet_desc:0 "Redeploy the defense array. Note that the Celestial Formation Battle Fortress will be disabled when receiving fatal damage and will complete self-repair after 180 days. However, if you lose the Celestial Formation Universal Central Hub at that time, the Battle Fortress will self-destruct or transfer ownership to the new system controller."
 decision_SRA_Barrier_Guard_fleet_flag:0 "Defense Array Redeployment Cooldown"

 pc_SRA_Barrier_Main_Station:0 "Celestial Formation Universal Central Hub"
 pc_SRA_Barrier_Main_Station_adj:0 "Celestial Formation Universal Central Hub"
 pc_SRA_Barrier_Main_Station_desc:0 "The production hub of the Celestial Formation, possessing comprehensive production capabilities ranging from resource generation and military manufacturing to scientific research. It is also responsible for controlling the Battle Fortress and auxiliary defense arrays."
 mod_pc_SRA_Barrier_Main_Station_habitability:0 "Celestial Formation Universal Central Hub Habitability"
 trait_pc_SRA_Barrier_Main_Station_preference:0 "Celestial Formation Universal Central Hub Preference"
 trait_pc_SRA_Barrier_Main_Station_preference_desc:0 "$trait_pc_arctic_preference_desc$\nBut currently, this may be a serious accident. Obviously, no species should be designed to adapt to such a highly artificial and variable environment. Perhaps some malevolent force defined the environment type habitable for these species."

 pc_SRA_Barrier_ringworld_habitable:0 "Celestial Formation Universal Ring World"
 pc_SRA_Barrier_ringworld_habitable_adj:0 "Celestial Formation Universal Ring World"
 pc_SRA_Barrier_ringworld_habitable_desc:0 "The auxiliary Ring World of the Celestial Formation, possessing production capabilities identical to the Central Hub, though it cannot control the Battle Fortress."
 mod_pc_SRA_Barrier_ringworld_habitable_habitability:0 "Celestial Formation Universal Ring World Habitability"
 trait_pc_SRA_Barrier_ringworld_habitable_preference:0 "Celestial Formation Universal Ring World Preference"
 trait_pc_SRA_Barrier_ringworld_habitable_preference_desc:0 "$trait_pc_arctic_preference_desc$\nBut currently, this may be a serious accident. Obviously, no species should be designed to adapt to such a highly artificial and variable environment. Perhaps some malevolent force defined the environment type habitable for these species."
 SRA_Barrier_megastructure_0:0 "§BCelestial Formation§!"
 SRA_Barrier_megastructure_0_MEGASTRUCTURE_DETAILS:0 "A massive stellar system fortress that requires clearing the entire star system to build."
 SRA_Barrier_megastructure_0_DESC:0 "The Celestial Formation Stellar System Fortress is designed to provide fleet supplies on the front lines of war, collect and process surrounding resources, rapidly assemble ships, and directly participate in frontal combat, providing powerful fire support and combat system support for the fleet. §BThis super stellar system megastructure can provide unimaginable output and self-sustain a series of highly advanced defense facilities.§! §RIt will clear all planets in the star system and drain the star. The colony requires 20 years to gradually reach full power operation.§!"
 SRA_Barrier_megastructure_1:0 "Celestial Formation Construction Initiated"
 SRA_Barrier_megastructure_1_DESC:0 "The pre-arranged automated construction system builds the entire Celestial Formation Stellar System Fortress while automatically colonizing the constructed colonies and deploying defense arrays. §RThe colony requires 20 years to gradually reach full power operation.§!"
 SRA_Barrier_megastructure_2:0 "Celestial Formation Ring World Segment"
 SRA_Barrier_megastructure_2_DESC:0 "A Ring World segment of the Celestial Formation."
 SRA_Barrier_megastructure_3:0 "Celestial Formation Ring World Segment"
 SRA_Barrier_megastructure_3_DESC:0 "A Ring World segment of the Celestial Formation."
 SRA_Barrier_megastructure_4:0 "Celestial Formation"
 SRA_Barrier_megastructure_4_DESC:0 "The Celestial Formation can maintain a massive navy and provide vast amounts of resources. It also possesses a huge shipyard capable of building starships in formation."
 SRA_Barrier_megastructure_ruined:0 "Ruined Celestial Formation"
 SRA_Barrier_megastructure_ruined_DESC:0 "This Celestial Formation Battle Fortress was destroyed in a battle, but there is still a possibility of repair."
 SRA_Barrier_megastructure_repair:0 "Repair Celestial Formation"
 SRA_Barrier_megastructure_repair_DESC:0 "Repair the Celestial Formation Battle Fortress and reset all colonies."

 SRA_Barrier_Guard_Station_megastructure_0:0 "§BStellar Guardians§!"
 SRA_Barrier_Guard_Station_megastructure_0_MEGASTRUCTURE_DETAILS:0 "Stellar Guardians Guard Fortress, accompanied by a defense fleet."
 SRA_Barrier_Guard_Station_megastructure_0_DESC:0 "The Stellar Guardians Guard Fortress is designed to provide extra combat capabilities for the Celestial Formation and can command a guard fleet to coordinate in battle."