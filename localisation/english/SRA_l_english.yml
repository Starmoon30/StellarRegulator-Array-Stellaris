 SRA_SR:0 "\"Appearance\""
 SRA_trait_SR:0 "§B['concept_SRA_Stellarcrystal_Fractal'] Construct§!"
 SRA_trait_SR_desc:0 "§BThis species is formed from ['concept_SRA_Stellarcrystal_Fractal'], possessing physical qualities unattainable by conventional species, capable of adapting to almost all environments.§!"
 SRA_trait_mind_network:0 "§BStarlight Consciousness Network§!"
 SRA_trait_mind_network_desc:0 "§BThe consciousness of this species is linked together by the Stellarcrystal network. Countless thoughts, one thought, interwoven into eternity. Thus, every individual can call upon the knowledge and wisdom of the entire collective, yet retain the advantages of independent individuals.§!"
 SRA_trait_mind_entity:0 "§BDiffused Consciousness Entity§!"
 SRA_trait_mind_entity_desc:0 "§BThe consciousness of this species is not limited to within matter. Its consciousness can diffuse into space, perceive and understand everything, and reshape reality according to its thoughts.§!"
 SRA_trait_material_energy_conversion:0 "§BMass-Energy Mastery§!"
 SRA_trait_material_energy_conversion_desc:0 "§BThe structure of this species allows it to absorb and manipulate energy and matter in any form, shaping it into needed things, obtaining energy for action, or constructing various structures.§!"
 SRA_trait_foldable_structure:0 "§BHyperdimensional Folded Structure§!"
 SRA_trait_foldable_structure_desc:0 "§BHyperdimensionally folded Stellarcrystal can form incredibly complex structures within small volumes, thereby carrying extremely specialized functions with broad applicability, capable of handling almost all situations.§!"
 SRA_RE_trait_metabyss:0 "§BAnchor of Metabyss§!"
 SRA_RE_trait_metabyss_desc:0 "§BThis entity is a shape molded by the Abyss, a shell simulating the species of this world, unexplainable by common sense.§!"


 bombardment_SRA_doom1:0 "Star-Casting Protocol"
 bombardment_SRA_doom1_name:0 "Star-Casting Orbital Bombardment" 
 bombardment_SRA_doom1_desc:0 "§R\"We cast the sea of stars with cold fractals, shaping the world into our mirror image.\"§!\n-Causes §Rirreparable§! damage to §YArmies§!\n-Causes §Rirreparable§! damage to the §YPlanet§!\n-Causes §Rirreparable§! damage to §YPops§!\n-Once planetary devastation reaches 100%, the planet will be §BAstronomical Fabrication§!-ized.\n-Uncolonized habitable planets will be directly §BAstronomical Fabrication§!-ized upon entering orbit."


 bombardment_SRA_doom2:0 "Oblivion"
 bombardment_SRA_doom2_name:0 "Oblivion Orbital Bombardment" 
 bombardment_SRA_doom2_desc:0 "§R\"Dust to dust, earth to earth.\"§!\n-Causes §Rirreparable§! damage to §YArmies§!\n-Causes §Rirreparable§! damage to the §YPlanet§!\n-Causes §Rirreparable§! damage to §YPops§!\n-Once planetary devastation reaches 100%, the planet will be §Rcompletely destroyed§!."

 sm_SRA_workforce_starbase_building:0 "§BStellarRegulator - Comprehensive Enhancement Facility§!"
 sm_SRA_workforce_starbase_building_desc:0 "§BThis facility enhances the comprehensive job efficiency of the planet where the $SRA_orbital_ring$ is located, increasing the efficiency of all jobs.§!"
 sm_SRA_databan_starbase_building:0 "§BStellarRegulator - Research Enhancement Facility§!"
 sm_SRA_databan_starbase_building_desc:0 "§BThis facility enhances the research efficiency of the planet where the $SRA_orbital_ring$ is located, increasing the efficiency of $job_SRA_databan_specialist$.§!"
 sm_SRA_foundry_starbase_building:0 "§BStellarRegulator - Construction Enhancement Facility§!"
 sm_SRA_foundry_starbase_building_desc:0 "§BThis facility enhances the construction efficiency of the planet where the $SRA_orbital_ring$ is located, increasing the efficiency of $job_SRA_foundry_specialist$.§!"
 sm_SRA_alloys_starbase_building:0 "§BStellarRegulator - Forging Enhancement Facility§!"
 sm_SRA_alloys_starbase_building_desc:0 "§BThis facility enhances the forging efficiency of the planet where the $SRA_orbital_ring$ is located, increasing the efficiency of $job_SRA_alloys_specialist$.§!"

 sm_SRA_nano_shipyard:0 "§BStellarRegulator - Mass-Energy Construction Framework§!"
 sm_SRA_nano_shipyard_desc:0 "§BThanks to the SRA's advanced mass-energy manipulation technology, we can directly construct ships in space using military materials, enabling the starbase to rapidly produce large numbers of ships.§!"
 sm_SRA_T3_shipyard:0 "Starlight Ship Assembly Framework"
 sm_SRA_T3_shipyard_desc:0 "Thanks to ['concept_SRA_Composite_Crystal_Lattice'] technology, the ship production process has achieved high automation and modularity, allowing massive work to proceed simultaneously, thereby optimizing shipbuilding efficiency."
 sm_SRA_starbase_turret:0 "§BStellarRegulator - Dragon Claw Sentry§!"
 sm_SRA_starbase_turret_desc:0 "§BThis starbase module is based on SRA modular technology, adding extra turrets and armor to the starbase, and allowing the starbase to command more defense platforms.§!"

 mod_relay_bypass_ship_windup_mult:0 "Hyper Relay Windup Time"


