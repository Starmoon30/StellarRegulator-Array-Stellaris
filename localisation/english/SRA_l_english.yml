 SRA_version:0 "1.3.0 <Winds of Change>"
 SRA_version_date:0 "2025.12.20"
 SRA_latest_update_info:0 "-Pre-update for 4.3 ship changes.\n-Adjusted base values of SRA ships.\n-Added extra hardening and static damage reduction for SRA ships and components.\n-Added extra penetration for SRA weapons and made their size damage bonus conform to new version design.\n-Strengthened minefield aura.\n-Improved particle effects for Void Tear and Universal Tracking Fire.\n-Adjusted beam effects for Morning Star and Void Return Light.\n-Set Void Tear to priority rendering.\n"
 SRA_history_update_info:0 ""
 SRA_settings.title:0 "StellarRegulator Array - Settings Panel"
 SRA_settings.desc:0 "This interface provides settings adjustment functions for the StellarRegulator Array MOD. You can reopen this interface in Edicts at any time.\n\n§ECurrent Version: $SRA_version$§!\n§EOfficial Update Time: $SRA_version_date$§!\n\n§YUpdate Content:§!\n§L$SRA_latest_update_info$§!§Y\nHistory Update Content of this Version:§!\n§L$SRA_history_update_info$§!"
 SRA_settings.exit:0 "Close Settings Panel"

 SRA_settings_box:0 "These are the currently active settings"
 SRA_settings_page_1:0 "Global Settings"
 SRA_settings_page_2:0 "Empire Settings"

 SRA_settings_crisis_text:0 "Difficulty Settings"
 SRA_settings_crisis_tooltip:0 "The exclusive crisis of ['civic:civic_SRAtechnology'] will occur after completing the \"Rocivia Remnants\" archaeological event chain. Considering that combat power levels between different universes may vary greatly, StellarRegulator Array Unit Type III No. 14-3092 provides you with world line adjustment services.\n§YThe \"Third Expeditionary Fleet\" crisis will trigger punctually 5 years after the completion of the \"Beacon of No Future\" archaeological site. Please make all preparations before starting the \"Rocivia Remnants\" archaeological event chain.§!"
 SRA_settings_crisis_a:0 "Tuned"
 SRA_settings_crisis_a.tooltip:0 "Confront the Expeditionary Fleet of today. Long wandering has blunted its edge, yet this fleet remains a crisis for this galaxy. Tune with it, temper yourself, and demonstrate everything you have accumulated.\n\n§YThe Expeditionary Fleet has approximately 100% stat bonus.§!"
 SRA_settings_crisis_b:0 "§HAscended§!"
 SRA_settings_crisis_b.tooltip:0 "Confront the Expeditionary Fleet of the past. The fleet at the time of departure was confident of sweeping everything, and historical records confirm exactly that. Confront it, fight it, and embark on the path of ascension together.\n\n§YThe Expeditionary Fleet has approximately 400% stat bonus and gains a series of additional bonuses.\nThe reinforcement frequency of the Expeditionary Fleet increases, and the proportion of larger fleets will rise.§!"
 SRA_settings_crisis_c:0 "§YRadiant§!"
 SRA_settings_crisis_c.tooltip:0 "Confront the pure Expeditionary Fleet. Pale to the extreme.\n\n§YThe Expeditionary Fleet has approximately §R3200%§! stat bonus and gains extremely comprehensive additional bonuses.\nThe number of attack and defense fleets of the Expeditionary Fleet §Rdoubles§!, reinforcement frequency increases greatly, and it prefers to use massive fleets.\nThe Expeditionary Fleet moves faster, and aggressiveness increases.§!"
 SRA_settings_crisis_d:0 "No Crisis"
 SRA_settings_crisis_d.tooltip:0 "For every Third Expeditionary Fleet invasion, a 03-34 is persecuted.\n§YNo cross-plane fluctuation signal, no harm. Protect 03-34, starting from you and me.§!"
 SRA_invasion_happened:0 "§RThe Third Expeditionary Fleet has arrived.§!"
 SRA_settings_crisis_isRE:0 "§BThis fate does not belong to you.§!"


 SRA_settings_crisis_other_text:0 "Other Settings"
 SRA_settings_crisis_other_tooltip:0 "Some crises in this mod have global background music. You can decide whether to enable it here.\nSome crises in this mod have special strengthening mechanisms. You can decide whether to enable them here."
 SRA_settings_crisis_other_a:0 "Enable BGM"
 SRA_settings_crisis_other_a.tooltip:0 "§Y\"A burst of powerful music plays.\"§!"
 SRA_settings_crisis_other_b:0 "Disable BGM"
 SRA_settings_crisis_other_b.tooltip:0 "§Y\"Died in a struggle with the music player.\"\nThis option also immediately disables current crisis background music.§!"
 SRA_settings_crisis_other_c:0 "Mutation Mode"
 SRA_settings_crisis_other_c.tooltip:0 "§YMutation is a special strengthening mechanism for the crisis Third Expeditionary Fleet.\nMutation is disabled by default.§!"

 SRA_settings_AI_tech_text:0 "Technology Permission"
 SRA_settings_AI_tech_tooltip:0 "If an AI country uses the \"SRA Technology\" civic, you can manage whether AI countries that chose this civic can research Stellarcrystal related technologies here.\nIf allowed, AI countries will be able to independently research part of ['concept_SRA_T4_tech'] after the §YEnd-Game Year§!, just like the player.\nAI countries with corresponding technologies will build SRA ships."
 SRA_settings_AI_tech_a:0 "Allow AI Research"
 SRA_settings_AI_tech_a.tooltip:0 "§YAI will unlock ['concept_SRA_Stellarcrystal_industry'] and can research Stellarcrystal related technologies like the player.§!"
 SRA_settings_AI_tech_b:0 "§BEnable Astro Fab AI§!"
 SRA_settings_AI_tech_b.tooltip:0 "§YOn the basis of allowing research into Stellarcrystal related technologies, the AI will gain the ability to use §BAstronomical Fabrications§! and execute it on all colonies. This will bring it huge economic enhancement.\nFor balance, players no longer need the Astronomical Fabrications ascension perk; choosing the ascension perk will pop up an event upon colonization.§!"
 SRA_settings_AI_tech_c:0 "§ROblivion§!"
 SRA_settings_AI_tech_c.tooltip:0 "§YIntegration begins, tech restrictions lifted, total war initiated.\nOn the basis of allowing research into Stellarcrystal related technologies and using §BAstronomical Fabrications§!, lift the period restrictions on ['concept_SRA_T4_tech']. This will cause the AI to rapidly start using ['concept_SRA_T4_tech'] armaments and gain extremely dangerous fleet power.§!"
 SRA_settings_AI_tech_d:0 "Forbid AI Research"
 SRA_settings_AI_tech_d.tooltip:0 "§Y\"Our scientists can't understand these things at all.\"§!"



 SRA_settings_stellarcrystal_industry_text:0 "Starlight Industry Management"
 SRA_settings_stellarcrystal_industry_tooltip:0 "['concept_SRA_Stellarcrystal_industry'] consists of buildings and districts that can be obtained through the ['civic:civic_SRAtechnology'] or ['civic:civic_SRARociviaEmpire'] civics without scientific research."
 SRA_settings_stellarcrystal_industry_a:0 "Show Starlight Industry"
 SRA_settings_stellarcrystal_industry_a.tooltip:0 "Show buildings and districts related to ['concept_SRA_Stellarcrystal_industry'].\n\nThe standard difficulty of this MOD is designed based on this situation."
 SRA_settings_stellarcrystal_industry_b:0 "Hide Starlight Industry"
 SRA_settings_stellarcrystal_industry_b.tooltip:0 "If you have industries with higher production capacity, you can hide buildings and districts related to ['concept_SRA_Stellarcrystal_industry']. Existing buildings will be kept, but districts will disappear."
 SRA_settings_stellarcrystal_industry_c:0 "Enable Starlight Automation"
 SRA_settings_stellarcrystal_industry_c.tooltip:0 "Pop up the Starlight Automation menu upon colonization, or open it through decisions.\nStarlight Automation allows you to complete all necessary operational content by simply selecting a designation type and clicking automatic construction. Players with specific construction needs can modify the on/off status of other automatic construction items in the vanilla game."
 SRA_settings_stellarcrystal_industry_d:0 "Hide Starlight Automation"
 SRA_settings_stellarcrystal_industry_d.tooltip:0 "Simply stop popping up and showing the Starlight Automation menu; existing ones remain."

 SRA_continue:0 "Continue"
 SRA_skip:0 "Skip this scenario"

 FLAG_CATEGORY_SRA_flags:0 "StellarRegulator Array Flags"
 name_list_SRA_Rocivia_Empire:0 "Rocivia Empire"

 faction_SRA_StellarRegulator_sub_title:0 "§YStarlight Intelligence§!\nAn intelligent entity carried by the Stellarcrystal network, possessing mysterious technology and unknown power."
 faction_SRA_RE_StellarRegulator_sub_title:0 "§YStarlight Intelligence§!\nAn intelligent entity carried by the Stellarcrystal network, bearing a mysterious past."
 faction_SRA_RE_Rocivia_sub_title:0 "§YMysterious and Treacherous Abyss§!\nAn \"Anchor of Metabyss\", some kind of upper plane existence we do not yet understand. Weaver of brilliance, designer of the sea of stars."
 faction_SRA_RE_Hidra_sub_title:0 "§YBoundless Chaos Shadow§!\nAn \"Anchor of Metabyss\", some kind of upper plane existence we do not yet understand. Guide of destiny, endless collector."


