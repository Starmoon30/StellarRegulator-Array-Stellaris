l_english:
 SRA_Cruiser:0 "SRA Cruiser"
 SRA_Cruiser_cap: "$SRA_Cruiser$"
 SRA_Cruiser_plural:0 "SRA Cruisers"
 SRA_Cruiser_desc:0 "§BFrigates, destroyers, cruisers-the so-called non-capital ships. All missions that do not require massive guns and heavy armor are handled by the Cruiser Units.§!\nAs the vanguard, scout, and escort, this 5,000-meter-long warship combines low consumption and high flexibility with just the right amount of firepower. This allows widely dispersed Cruiser Units to quickly sweep away targets with poor resistance capabilities. Wherever you go, the Cruiser Units are always the most numerous."
 SHIP_GRAPHICS_SRA_CRUISER_DESC: "$SRA_Cruiser_desc$"
 SRA_Cruiser_MID:0 "SRA Cruiser"
 #SRA_Cruiser_BOW:0 "审判执行阵列"
 #SRA_Cruiser_MID:0 "联合攻击模块"
 #SRA_Cruiser_STERN:0 "核心拦截系统"
 SRA_Executor:0 "SRA Executor"
 SRA_Executor_cap: "$SRA_Executor$"
 SRA_Executor_plural:0 "SRA Executors"
 SRA_Executor_desc:0 "§BHeavy artillery capital ship, firepower platform.§!\nThe 15-kilometer hull is fully armed. The specially supplemented energy storage array, combined with the Specialized Annihilation Main Weapon set on the central axis, strives to erase hostile targets of any scale. Executor clusters deployed on important battlefronts are often invincible."
 SHIP_GRAPHICS_SRA_EXECUTOR_DESC: "$SRA_Executor_desc$"
 SRA_Executor_MID:0 "SRA Executor"
 #SRA_Executor_BOW:0 "审判执行阵列"
 #SRA_Executor_MID1:0 "侦搜歼灭阵列"
 #SRA_Executor_MID2:0 "火力支援阵列"
 #SRA_Executor_MID3:0 "联合攻击模块"
 #SRA_Executor_STERN:0 "核心拦截系统"
 SRA_Adjudicator:0 "SRA Adjudicator"
 SRA_Adjudicator_cap: "$SRA_Adjudicator$"
 SRA_Adjudicator_plural:0 "SRA Adjudicators"
 SRA_Adjudicator_desc:0 "§BA product of fusing a comprehensive support ship and a fleet flagship, based on the need for a certain degree of distributed host deployment and battlefield command.§!\nThis 45-kilometer-long giant ship carries a massive scale of computing units. It can complete combat tasks and calculate the next decision in complex spatial environments where connection interruptions may occur. In addition, its weapon configuration is also quite generous."
 SHIP_GRAPHICS_SRA_ADJUDICATOR_DESC: "$SRA_Adjudicator_desc$"
