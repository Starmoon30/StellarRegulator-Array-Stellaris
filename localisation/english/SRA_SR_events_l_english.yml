 skill_SRA_governor_delegate_tt:"§EFederation Delegate Effect:§!$TABBED_NEW_LINE$- $MOD_FEDERATION_COHESION_ADD$: §G+1§!\n\n§E[global_event_country.GetGalCommunityOrGalImperium] Representative Effect:§!$TABBED_NEW_LINE$- $MOD_DIPLO_WEIGHT_MULT$: §G+10%§!"
