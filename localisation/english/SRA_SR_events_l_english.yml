 leader_trait_SRA_ruler:0 "§BSRA - Supreme Control Module§!"
 leader_trait_SRA_ruler_desc:0 "§BA wise and efficient design, created by a spark of inspiration. The capabilities she demonstrates dwarf all rulers. But is entrusting all national affairs to an unknown artificial intelligence a deliberate judgment or a seed of disaster?§!§RYou know, you can only trust her now.§!"
 leader_trait_SRA_gov:0 "§BSRA - Sector Administration Module§!"
 leader_trait_SRA_gov_custom_subtitle:0 "§BCelestial Holder§!\n[This.GetClassTexticon][This.GetClass]"
 leader_trait_SRA_gov_desc:0 "§B\"We unanimously agree that handing over our country's overall construction planning to a selfless and excellent artificial intelligence is undoubtedly a correct decision. History has proven countless times that most leaders cannot coordinate all information, cannot perceive social laws, cannot get rid of selfishness, and cannot cross the constraints of party strife. The era of incompetent people planning the future for us must be ended.\" - \"Improvement and Restart of the Pan-Galactic Planning and Adjustment System\"§!"
 leader_trait_SRA_sci:0 "§BSRA - Scientific Exploration Module§!"
 leader_trait_SRA_sci_custom_subtitle:0 "§BAbyssal Contemplation§!\n[This.GetClassTexticon][This.GetClass]"
 leader_trait_SRA_sci_desc:0 "§B\"Intelligence, knowledge, and inspiration are the three cornerstones of scientific progress. After we successfully piled intelligence and knowledge onto artificial intelligence, inspiration became the final problem. For now, the research composite thinking model constructed based on a large number of personality samples performs well. It can think about problems from almost all angles, and even explore the unknown with accurate intuition-if it really exists.\" - \"Development Record of Research Intelligent Model by the Third Research Center\"§!"
 leader_trait_SRA_adm:0 "§BSRA - Fleet Command Module§!"
 leader_trait_SRA_adm_custom_subtitle:0 "§BBlade Adjudication§!\n[This.GetClassTexticon][This.GetClass]"
 leader_trait_SRA_adm_desc:0 "§B\"All war records and exercise archives have been input. It has learned all our tactics and strategies so far, and constantly fights with itself to optimize decision-making. It has surpassed everyone, and will go even further. We believe that the commander of the war should also be the planner of the war. Only by understanding why we fight can we know how to fight.\" - \"SRA Design Record\"§!"
 leader_trait_SRA_gen:0 "§BSRA - Planetary Tactics Module§!"
 leader_trait_SRA_gen_custom_subtitle:0 "§BWorld Purging§!\n[This.GetClassTexticon][This.GetClass]"
 leader_trait_SRA_gen_desc:0 "§B\"Although ground combat has retreated to the second line, we cannot deny that it is still an indispensable part of war and outside war. For such combat tasks that are more complex than space combat, until today, our country is still waiting for an integrated supernatural army, a legion with perfect cooperation, fearlessness of sacrifice, and absolute efficiency, a set of war machines capable of coping with any battlefield, a mechanical legion as efficient as orbital cleaning and as precise as point erasure.\" - \"Forging Legion: Third Research Center Project Initiation Report\"§!"



##########################字体颜色代码
#紫色M = { 163 53 238 } M = Magenta. Indicator for "Rare Techs".
#暗金L = { 195 176 145 } L = Lore text, not relevant game info, just fun to know backstory info.
#绿色G = { 41 225 38 } G = Green, used for numbers that are positive modifiers.
#红色R = { 252 86 70 } R = Red, used for numbers that are negative modifier or warnings.
#深蓝B = { 51 167 255 } B = Blue, used in special cases for text.
#金黄Y = { 247 252 52 } Y = Yellow, to be used for stuff that is sub optimal or for certain highlights.
#橙黄H = { 251 170 41 } H = Highlight, Orange in Game.
#蓝青色C = { 33 232 208 } C = Cyan, Used for Concept Text that generates another tooltip.
#橙黄K = { 251 170 41 } K = Header for Concepts. Currently identical to H.
#黄色I = { 247 252 52 } I = Highlights for Concepts. Currently identical to Y.
#白色T = { 255 255 255 } T = Text, standard for all text, to be used if ALL text needs tweaking.
#绿青色E = { 135 255 207 } E = Standard green, used with large chunks of texts, such as events and advisor.
#土黄S = { 228 156 42 } S = Subtitle highlight (light green in this case).
#白色W = { 255 255 255 } W = White.
