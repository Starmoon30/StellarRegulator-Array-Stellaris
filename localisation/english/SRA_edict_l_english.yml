 edict_SRA_Spear_Of_Galaxy_Zenith_Menu:0 "Open Spear_of_Galaxy_Zenith Control Panel"
 edict_SRA_Spear_Of_Galaxy_Zenith_Menu_desc:0 "§BFleet support mothership, combat fire platform, and super flagship designed during the late Third Expedition. Used for large-scale fleet battles, fortifications assaults, long-range fire support, and single-ship thrusts.\nThe only StellarRegulator Array combat vessel equipped with a Spacetime Phase Engine, which frees fleets supported by the Spear_of_Galaxy_Zenith from needing power supply from Expeditionary Fortresses and Expeditionary Beacons. At the same time, the Spacetime Phase Engine can provide extra support for the Spear_of_Galaxy_Zenith, creating huge advantages in battle.§!"

 edict_SRA_Weapon_Adjust:0 "Open SRA Tuned Weapon Adjustment Interface"
 edict_SRA_Weapon_Adjust_desc:0 "You can adjust the damage of your \"SRA Weapons\" arbitrarily, because the Lord does not care."