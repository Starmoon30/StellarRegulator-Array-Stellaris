 edict_SRA_Diplomacy_1_desc:0 "\"Tribute is the advanced form of alliance.\"\n§YIncreases opinion of all countries by§! §G+1000§!\n\nAdditionally, activating it immediately gives you §G+100§! §YCurrent Intel§! on all countries, and your Federation immediately gains §G+20000§! XP.\n§YCheat Edict§!"
