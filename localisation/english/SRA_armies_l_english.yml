 #Annihilating Fabrications
 SRA_Eliminater:0 "§BAnnihilating Fabrications§!"
 SRA_Eliminater_desc:0 "Annihilating Fabrications, or StellarRegulator Planetary Purge Units, are the collective term for a series of advanced war machines forged by ['concept_SRA_Stellarcrystal_Fractal']. As the ultimate solution for ground warfare, this collection can destroy all resistance with unimaginable speed.\nIn most cases, Annihilating Fabrications appear as massive suspended combat platforms, mainly equipped with plane-tearing weapons, erasure weapons, and pulse energy beams. Considering complex ground combat situations and alien life forms, they can also construct specialized weapons such as electromagnetic pulses and neutron plumes to efficiently clear any resistors. If needed, Annihilating Fabrications can also reorganize into combat machines of any size to systematically purge diverse fortifications."
 SRA_Eliminater_Attacker:0 "§BAnnihilating Fabrications - Assault§!"
 SRA_Eliminater_Attacker_desc:0 "Annihilating Fabrications, or StellarRegulator Planetary Purge Units, are the collective term for a series of advanced war machines forged by ['concept_SRA_Stellarcrystal_Fractal']. As the ultimate solution for ground warfare, this collection can destroy all resistance with unimaginable speed.\nIn most cases, Annihilating Fabrications appear as massive suspended combat platforms, mainly equipped with plane-tearing weapons, erasure weapons, and pulse energy beams. Considering complex ground combat situations and alien life forms, they can also construct specialized weapons such as electromagnetic pulses and neutron plumes to efficiently clear any resistors. If needed, Annihilating Fabrications can also reorganize into combat machines of any size to systematically purge diverse fortifications.\nThis unit of Annihilating Fabrications is currently undertaking a ground offensive mission."
 SRA_Eliminater_Defender:0 "§BAnnihilating Fabrications - Defense§!"
 SRA_Eliminater_Defender_desc:0 "Annihilating Fabrications, or StellarRegulator Planetary Purge Units, are the collective term for a series of advanced war machines forged by ['concept_SRA_Stellarcrystal_Fractal']. As the ultimate solution for ground warfare, this collection can destroy all resistance with unimaginable speed.\nIn most cases, Annihilating Fabrications appear as massive suspended combat platforms, mainly equipped with plane-tearing weapons, erasure weapons, and pulse energy beams. Considering complex ground combat situations and alien life forms, they can also construct specialized weapons such as electromagnetic pulses and neutron plumes to efficiently clear any resistors. If needed, Annihilating Fabrications can also reorganize into combat machines of any size to systematically purge diverse fortifications.\nThis unit of Annihilating Fabrications is currently undertaking a ground defense mission."

 SRA_T3_Machine_Army:0 "Starlight Horizon Vanguard"
 SRA_T3_Machine_Army_desc:0 "Massive war machines created by ['concept_SRA_Composite_Crystal_Lattice'] technology, possessing an event horizon singularity core and loaded with countless devastating weapons. Their control over gravity and space allows them to deflect all attacks and easily tear apart everything in their path."
 SRA_T3_Machine_Army_Defender:0 "Starlight Horizon Vanguard - Defense"
 SRA_T3_Machine_Army_Defender_desc:0 "Massive war machines created by ['concept_SRA_Composite_Crystal_Lattice'] technology, possessing an event horizon singularity core and loaded with countless devastating weapons. Their control over gravity and space allows them to deflect all attacks and easily tear apart everything in their path.\nThis unit of Starlight Horizon Vanguards is currently undertaking a ground defense mission."

 SRA_Hunter_Of_Chaos:0 "§RMetabyss Hunter§!"
 SRA_Hunter_Of_Chaos_desc:0 "Warriors fight against the boundless darkness, willing to shoulder a corner of that darkness.\nHunting the abyss with the power of the Metabyss, using self and existence to oppose the scars of chaos, slaughtering disorder, and strangling the end.\nThose who go to their deaths step onto the path of heroes.\n\n\n\n\n§RAll things sprout and return to their roots; from here, all endeavors begin.\nThorns overrun the withered bones; death, too, is a return.§!"
 SRA_Solar_Knight_Defender:0 "§YSolar Knight§!"
 SRA_Solar_Knight_Defender_desc:0 "The blade of the brilliant sun burns eternally, vowing to burn away all darkness.\nAs a borderless Metabyss countermeasure organization established long before the space age, the Solar Knights have extraordinary experience and insight in fighting constructs. They undertake Metabyss defense work throughout the entire territory of the Stellariens and are always ready to fight to the end on the front lines."
 SRA_Hunter_Of_Chaos_Attacker:0 "§RDisorder Hunter§!"
 SRA_Hunter_Of_Chaos_Attacker_desc:0 "Warriors fight against the boundless darkness, and finally become a corner of that darkness.\nHow can one hunt the eternal abyss? Opposing the scars of chaos will inevitably obliterate self and existence, spreading disorder and extending the end.\nThose who go to their deaths step onto the path of pain.\n\n\n\n\n§RCalamity and tribulation descend upon the earth; the souls of travelers are muddied.\nDeeds and actions dissipate from the world; thoughts and worries return to the void.§!"
 SRA_Machine_Army_Of_Chaos_Attacker:0 "§RConstructed Crystal Husk§!"
 SRA_Machine_Army_Of_Chaos_Attacker_desc:0 "Created from the abyss by a single will, wandering, lost, bringing everything seen into eternity.\nEvery step taken by such a creation is a blasphemy against reality, devouring all things only for more, displaying disorder and chaos, annihilating reality and truth."

 NAME_SRA_army_Hidra:0 "§RSigh§!"
 SRA_army_Hidra:0 "§RFragment of the Abyssal Dragon§!"
 SRA_army_Hidra_desc:0 "What is this...\n\n§EDamage Reduction 1000%/-§!"