###############################

 SRA_SD_Story_event.1.desc:0 "...That is to say, the past that was about to be lost has been excavated, and the \"Great Tear\" fifty years ago did not put an end to her story.\nHmm, what incredible news. Luckily only the two of us know. We can arrange what information should be made public as needed."
 SRA_SD_Story_event.2.desc:0 "How do you plan to dispose of her."
 SRA_SD_Story_event.3.desc:0 "\"Dispose,\" this wording seems to have a somewhat unfriendly tendency.\nPerhaps we should carefully judge... who our little Sleeping Beauty is right now.\nAnd then make arrangements by category."
 SRA_SD_Story_event.4.desc:0 "I guess you are going to arbitrarily judge that she is \"still within controllable range, her ability value is huge, and should be utilized under proper supervision\"."
 SRA_SD_Story_event.5.desc:0 "I can't sentence little Irrica's old lover to death, unless the first thing she does upon waking up is to sentence me to death. I sincerely hope this doesn't happen.\nLet's assume for now she is still the way we prefer. If that's really the case, I think she can direct our future development."
 SRA_SD_Story_event.6.desc:0 "Sounds like a bad plan."
 SRA_SD_Story_event.7.desc:0 "We are all living on this tower, are there any worse plans?\nFifty years ago this place was recognized as a dead land, a desperate situation of no return. Who would have thought that today we rely on this tower to explore other worlds?"
 SRA_SD_Story_event.8.desc:0 "As long as you are happy, I have no objections.\nBut you'd better prepare first how to adapt your plan into something Cuthbertus can accept, otherwise that child's objection might be more than a little loud."
 SRA_SD_Story_event.9.desc:0 "Hmph, I am already prepared.\nOur \"Bard of Metarbor\" lady will act as my \"Special Commissioner\". I am merely \"appropriately referencing\" her views. After all, even Cuthbertus cannot deny that Her Excellency the Bard's unique perspective is indeed one of a kind."
 SRA_SD_Story_event.10.desc:0 "You have already made a decision, so I won't say more. But...\n\nShe seems to be waking up."
 SRA_SD_Story_event.11.desc:0 "What?\nCough cough, then let me ask her.\n\n§YThis girl in a white dress straightened her clothes, conjured a chair to sit down, and looked at you with eager eyes.§!\n\nDo you still remember who I am?"
 SRA_SD_Story_event.11.a:0 "...Do we know each other?"
 SRA_SD_Story_event.11.b:0 "...Are you... Miss Magician?"
 SRA_SD_Story_event.11.c:0 "§RRocivia!!!§!"
 SRA_SD_Story_event.12.desc:0 "Oh, oh, this is really.\nI think we should know each other, but it seems a re-introduction is needed.\nHello, \"Bard of Metarbor,\" I am the Magician Rocivia, the current Director of the Department of Metabyss Affairs, your guide in the past and future."
 SRA_SD_Story_event.13.desc:0 "What a nostalgic title, glad you are back.\nBut I'd better re-introduce myself, after all, a lot has happened while you were away.\nHello, \"Bard of Metarbor,\" I am the Magician Rocivia, the current Director of the Department of Metabyss Affairs, your guide in the past and future."
 SRA_SD_Story_event.14.desc:0 "Prophecy fulfilled!\n\n§YShe dodges your attack.§!\n\nThis timeline is wrong, cut it, cut it!"
 SRA_SD_Story_event.15.desc:0 "You noticed another person standing beside this girl claiming to be Rocivia.\nThat was a quiet and gentle girl. She was draped in tattered clothes, and the wings behind her were incomplete. The twisted horns and the relatively intact tail implied her identity.\nThe deathly aura chilling to the bone was tightly wrapped around her, but you were surprisingly not unfamiliar with it.\nShe is...\nYou vaguely almost grasped that name, but it floated away from your hand like a feather."
 SRA_SD_Story_event.16.desc:0 "§YShe seemed to perceive your thoughts.§!\n\nHello, Your Excellency the Bard.\nEzernal is just a friend you were not very familiar with in the past, no need to mind."
 SRA_SD_Story_event.17.desc:0 "Ezernal, the Dragon who lost colors, the Skeleton of the Black Dragon, the \"Dragon of Finale\".\nThe oldest legendary Fallen Dragon, who has been stationed under the Lonely Mountain since hundreds of years ago, facing that hideous rift alone.\nYou recalled these words, you recalled that she once sang softly in the lightless night, teaching you how to call up the ashes of the dead.\n...\nBut other than that, you have no memory, like a notebook rudely torn apart, leaving only a few remaining pages.\n\nBut why is she standing here? Why did the reclusive giant dragon appear in the territory of civilization?\nPerhaps Miss Rocivia will have the answer."
 SRA_SD_Story_event.18.desc:0 "Ezernal is just providing me with some help for personal reasons, she does not belong to the Department of Metabyss Affairs.\nShe discovered you during a Metabyss exploration mission and brought you back.\n\n§YShe notices your puzzled expression and smiles.§!\n\nYes, exploring the Metabyss. Things have become very different over these years. You and I are right above the Metabyss right now, inside a tower that is still clueless.\nSince the \"Great Tear\" occurred, the structure of the entire civilization has been shattered and reorganized. Now, the divided nations unite under a unified banner, re-pioneering and building the shattered Core Ring, incorporating the Lonely Mountain itself into the territory.\nThis quietly appearing tower is both a base for exploring the Metabyss downwards and a door to explore other worlds upwards.\nSounds incredible, but that's the fact. Fifty years ago people were trembling under the power of the Metabyss, now the Metabyss itself has been included in the plan.\nBut this also comes with a price."
 SRA_SD_Story_event.19.desc:0 "This tower is safe; there is almost no erosion inside. But elsewhere, just breathing the air may subject one to the influence of the Metabyss, let alone working beside those scars, or even fighting creatures of the Metabyss.\n\n...I will send you a summary of the specific situation later. In short, everyone is dying."
 SRA_SD_Story_event.20.desc:0 "But maybe you can change all this.\n\nI seemed to have told you the same thing last time. Cough cough, anyway, you will act as my direct subordinate, dealing with some tricky Metabyss problems, like you did in the past.\nRefusal is not allowed, otherwise I will use some means not suitable for public announcement to make you obedient."
 SRA_SD_Story_event.20.a:0 "Sounds like I'm going to turn the tide, even though I actually know nothing."
 SRA_SD_Story_event.20.b:0 "Hope I'm doing good deeds."
 SRA_SD_Story_event.20.c:0 "What means?"
 SRA_SD_Story_event.21.desc:0 "Brainwashing, cognitive modification, drug manipulation, etc., or I can make you listen to the wailing of the dying all day long and say it's all your fault.\nOh, I can also find your teammates from back then to beg you, otherwise I will torture them, and torture you.\n\nAnyway, very stereotypical bad operations, do you want to experience them?"
 SRA_SD_Story_event.21.a:0 "...Pass."
 SRA_SD_Story_event.22.desc:0 "Glad we reached an agreement. I haven't done anything bad so far, hope I won't have to in the future either."
 SRA_SD_Story_event.23.desc:0 "You will have time to understand slowly, anyway no rush, it's not time for everyone to die yet.\nYou can wander around, find the feeling of the past, practice the skills you mastered, enjoy a three-month vacation, and then come to work overtime with me.\nBut pay attention, don't reveal your identity yet. Eze will accompany you, right Eze?"
 SRA_SD_Story_event.24.desc:0 "§YEzernal nodded with a helpless look.§!"
 SRA_SD_Story_event.25.desc:0 "Then that's it, I'm going to work, see you."


 SRA_SD_Story_event.26.desc:0 "The girl known as the \"Bard of Metarbor\" woke up in confusion. She was in a strange era and could not distinguish her past. But even so, the Bard still chose to witness, think, and act.\nWith the assistance of the Dragon of Finale, the Bard retrieved as much experience and insight accumulated during past journeys as possible. These skills, whether ordinary or rare, once helped her achieve countless feats and helped her face the power of the Metabyss that obliterates all things."
 SRA_SD_Story_event.27.desc:0 "As the Bard knows, this is Stellariens. Ancient poems record that this place is a Remnant Branch of Metarbor, cleverly reflecting the essence of this world.\nUnlike other leaves that have already fallen, this world has not yet detached from the Metabyss that shaped it-this is an unformed world, a blurred and chaotic world. The earth is flat and boundless, the sky is false and endless. Different creatures are created by the Metabyss; weak ones like goblins can survive, strong ones like dragons will also die.\nBecause the Metabyss is so equal, it is the only one when all things have not yet differentiated, it is the destination when the world reaches the end. It eliminates all differences, erases all uniqueness, turning brilliant poems into fragments, never to be found again."
 SRA_SD_Story_event.28.desc:0 "In the days when the Bard was still active, or those times in her memory, the Metabyss was just a rift on this plateau, a pit aptly named, only occasionally releasing its influence, arbitrarily embellishing the earth with its chaotic mist.\nPeople eroded by the mist are like melting colors; everything that was originally clear gradually merges into one. At first, it may be limb alienation, crystal growth, or armor melting into flesh. With the distortion of the body, people's thoughts also blur, perish, and finally turn into turbidity.\nFortunately, the erosion of the Metabyss only happens occasionally, just one of countless natural disasters, perhaps never encountered in a lifetime.\nBut now it's different."
 SRA_SD_Story_event.29.desc:0 "\"The Great Tear,\" an unprecedented disaster. Just like a volcanic eruption, the Metabyss released vast energy far exceeding the sum of the past millennium in a breath, splashing its influence. Mountains cracked, oceans churned, and the entire earth was torn apart by countless rifts, like the roots of an old tree spreading in the soil.\nThis unforeseen catastrophe destroyed most civilizations on the vast land formerly known as the Core Ring, leaving countless pulsating scars, spreading the influence of the Metabyss all the time.\nBut just a few years later, the Department of Metabyss Affairs, established by unifying the nations, announced the plan to return to the Core Ring.\nThe creatures of Stellariens who were unwilling to flee to the Rim Ring united as never before, marching towards the land where the Metabyss is still spreading."
 SRA_SD_Story_event.30.desc:0 "With the unreserved help of a giant dragon who loves books, people's technology has undergone earth-shaking changes in just a few decades. Factories stretching like mountains were built beside the rifts created by the Great Tear, radically utilizing those powers capable of distorting reality. People built brand new cities on the scarred land, rebuilt the Core Ring, and even went further.\nToday, people have climbed the giant tower, touched the sky, explored the vast alien worlds, and also explored the endless Metabyss.\nBravely stepping into the unknown, exciting Great Expedition, creation and transcendence.\nEven if the price is endless sacrifice.\nBut precisely because sacrifice is a foregone conclusion, the footsteps forward are so fearless."
 SRA_SD_Story_event.31.desc:0 "Magician Rocivia, who knew the Bard in the past, appointed the Bard as her deputy in the capacity of Director of the Department of Metabyss Affairs, intending to establish a team capable of handling the trickiest Metabyss hazards.\nWhat will the Bard think? She is like a stranger, everything she once knew is blurred, the world she once lived in has changed. She still holds the mysterious power capable of influencing the Metabyss, but how should this power be used? Rocivia makes the Bard feel familiar yet strange; she seems to have never truly known this magician. What is her purpose, and is she trustworthy?\nThe story has just begun."


 SRA_SD_Story_event.32.desc:0 "§RYOU§! were awakened by the howling wind, finding yourself in ruins.\nAncient stones collapsed, magnificent halls shattered, fake sunlight sprinkled from not far away, illuminating stone tablets engraved with text.\n\nOf course, you are not ignorant."
 SRA_SD_Story_event.33.desc:0 "Here, although I dare not say without a doubt, it is mostly likely the Metabyss. Specifically, this is probably the first or second layer of the Surface Metabyss, the Reproduction Layer and the Fabrication Layer.\nAs the layers most contacted at this stage, or the only two layers that can be reached normally, the structure of these two areas is almost identical to the conventional world outside the Metabyss. This is the terminal stage of differentiation, where the Metabyss blends with external information, evolving into countless fleeting replicas of the outside world.\nThe Fabrication Layer merely piles up a series of things together, while the Reproduction Layer often uses some far-reaching events as blueprints to incompletely reproduce the scene at that time."
 SRA_SD_Story_event.34.desc:0 "You tapped the staff at your waist unhurriedly, confirming the small pouch hanging on your coat. Although you are sure you didn't foolishly wear a full set of outdoor clothes when sleeping, now you are indeed in formal attire, even bringing the material bag.\nIt counts as a good thing. You whispered and danced your fingers, completing the spell architecture built in your mind, letting them collapse like a touched domino tower, thereby displaying the prepared formula.\nCarefully preparing defense and amplification spell effects to arm yourself fully on the magical level, you then walked to the stone tablet not far away and began to examine the damaged text on it.\nThis seems not to be important information, a story fragment created in Elvish, telling of a mage who desired power and obtained a powerful weapon but died because of it."
 SRA_SD_Story_event.34.a:0 "Probe the arcane traces on it."
 SRA_SD_Story_event.34.b:0 "Recall the metaphor of this story."
 SRA_SD_Story_event.35.desc:0 "You cast a spell, letting the power to pry into the slightest magic traces appear in your eyes, finding another record under the fable-like text.\nThe so-called \"Mage's Weapon\" is buried under this temple. If a formidable enemy comes one day, the legion can call upon it themselves."
 SRA_SD_Story_event.36.desc:0 "You searched your memory, remembering that one of the ancient customs of elves is to leave a series of narrative texts when preserving important magic items. Intended to remind visitors who can understand these symbols to access the items preserved here, in case of unexpected ['concept_SRA_SD_Abyss_Erosion']."
 SRA_SD_Story_event.37.desc:0 "You blinked lightly, dyeing everything you saw with a pale blue color. The magic veins buried at the beginning of construction traveled through the entire ruin like leaf veins, leaving traces even after many years.\nFollowing the blue thin lines lit up in the gray-white vision, you walked down the stairs.\nScenes in the Reproduction Layer are often based on a relatively complete event. Completing it will shatter this bubble, allowing the tide of the Metabyss to surge here again, giving the explorers trapped in it a chance to blur existence and jump back to the present world.\nYou have to go and see."
 SRA_SD_Story_event.38.desc:0 "You drew a rapier poured like filthy blood from mid-air, splitting the surging Metabyss waves, cutting off the shambling monsters pieced together by rubble, and shattering the floating constructs carved from crystals.\nThe fabricated reality shattered as you deepened. The surging Metabyss energy shaped one mindless construct after another, intending to liberate the intangible essence bound in tangible flesh with tangible shells built from intangible essence.\nYou didn't think about various guesses about this phenomenon, focusing on destroying the enemies existing in front of you, and further deepening into this ruin.\nMost constructs in ancient ruins have failed. You had to cut open some blocked doors or leap over collapsed corridors.\nFinally, after killing an unknown number of constructs emerging from walls or simply from the air, you arrived at a small room that is probably the end.\nInside was a small magic device with a constant stasis spell effect, obviously used to preserve objects for an extremely long time.\nThere should have been some verification and defense means here, but now there are only cracks and fragments. You walked forward and opened the box.\nInside was an indescribable strange creation, a metal frame fixing several lenses, with absolutely no apparent function."
 SRA_SD_Story_event.38.a:0 "Pick it up."
 SRA_SD_Story_event.39.desc:0 "Found you.\n\n§YYour Director said with a smile as always.§!\n\nAlthough the search started as soon as you disappeared, your location was only captured now. It seems your actions destroyed the closure of the reproduction scene constructed by the Metabyss.\n\n§YShe looked at the creation in your hand.§!\n\n...Annihilation Rumble. You got it again.\nThis is probably not a coincidence. The Metabyss is reproducing your journey, reshaping your existence in some way.\nThe ultimate goal is unknown, but you should have realized that every step you take in this illusion makes you more complete. The power you once dominated is at your disposal again, the things you once obtained... have also returned to your hands.\nThis seems to be a good thing."
 SRA_SD_Story_event.39.desc:0 "Found you.\n\n§YYour Director said with a smile as always.§!\n\nAlthough the search started as soon as you disappeared, your location was only captured now. It seems your actions destroyed the closure of the reproduction scene constructed by the Metabyss.\n\n§YShe looked at the creation in your hand.§!\n\n...Annihilation Rumble. You got it again.\nThis is probably not a coincidence. The Metabyss is reproducing your journey, reshaping your existence in some way.\nThe ultimate goal is unknown, but you should have realized that every step you take in this illusion makes you more complete. The power you once dominated is at your disposal again, the things you once obtained... have also returned to your hands.\nThis seems to be a good thing."
 SRA_SD_Story_event.39.a:0 "Sounds good."
 SRA_SD_Story_event.39.b:0 "Sounds disturbing."
 SRA_SD_Story_event.40.desc:0 "Hmm, who knows? We might as well reserve guesses, get out of here first, and return to a more familiar and stable world.\nThe reality here is quite weak. You can try to open a passage yourself, or let me use some stable means."
 SRA_SD_Story_event.40.a:0 "Better let you do it."
 SRA_SD_Story_event.40.b:0 "Cast §RMetabyss Prayer§!"
 SRA_SD_Story_event.41.desc:0 "§YRocivia waved the staff in her hand, carving an angular passage in mid-air, then shattering it.\nIt looked like scratching glass and then breaking it.\nYou couldn't see traces of spellcasting, you could only see a crack appearing in front of you, and on the other side was the reality you were familiar with.\nYou stepped into it.§!\n\nWelcome back to reality, my cute little Bard.\n\n§YShe bowed quite exaggeratedly.§!"
 SRA_SD_Story_event.42.desc:0 "§YYou conceived your wish, then wove it into a command.\nThe weave of the Metabyss twisted in your will, stretching its veins, declaring its power. Then, just as you prayed, in the moment thoughts flashed, you returned to the solid and reliable real world.§!\n\nOh, this is really...\n\n§YShe seemed to want to say something, but didn't say it.§!"
 SRA_SD_Story_event.43.desc:0 "How do you feel about this unplanned journey? Although looking at you, I can guess dealing with things here wasn't difficult. The past you was famous for being good at solving ['concept_SRA_SD_Abyss_Erosion'] hazards, but after all, the last time you dealt with Metabyss constructs was fifty years ago."



