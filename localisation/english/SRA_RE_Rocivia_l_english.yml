###############################

 SRA_RE_Rocivia_talk_exit1:0 "End communication."
 SRA_RE_Rocivia_talk_exit3:0 "Terminate Research"
 SRA_RE_Rocivia_talk_return2:0 "Very well, let me think about what else is there." 
 SRA_RE_Rocivia_talk_return3:0 "Forget it." 
 SRA_RE_Rocivia_talk_return4:0 "Let's talk about something else." 
 

 SRA_RE_Rocivia.2.desc:0 "Welcome, Executor. Have you had an in-depth exchange with little StellarRe? Not yet? As expected...\nCough cough, as you can see, as the Supreme Speaker, I command the Empire's Supreme Council and wield the highest power of this country... Why are there so many \"Supremes\"...\nUh, I also directly govern the Imperial Academy of Sciences and supervise the general research direction of this group of scientists.\nIf you want to propose a few bills in the council, or let the Academy of Sciences engage in some big projects, come to me."
 SRA_RE_Rocivia.1.desc:0 "Hello, what do you want today?"
 SRA_RE_Rocivia.1.desc.b:0 "Ciallo～(∠・ω< )⌒★"
 SRA_RE_Rocivia.1.a:0 "Provide Help"
 SRA_RE_Rocivia.1.b:0 "Issue Project to Academy of Sciences"
 SRA_RE_Rocivia.1.c:0 "Chat"
 SRA_RE_Rocivia.1.d:0 "Let Rocivia Return to Leadership"


 SRA_RE_Rocivia.3011.a.desc:0 "The technology of these wedge-shaped ships with stupid bridges is not that unfathomable, although their unique combat systems can run stably regardless of what enemy they face... Obviously, some cunning thing is influencing it."
 SRA_RE_Rocivia.3011.b.desc:0 "Starbases are unreliable: most ships will regard this conspicuous space building as the primary attack target, and once the starbase is captured, the defense platforms attached to it will defect.\nIn addition, when the starbase is destroyed, the surrounding defense platforms will also self-destruct.\nTherefore, piling up static defense is not as good as preparing a few more defense fleets."
 SRA_RE_Rocivia.3011.c.desc:0 "Isolated star clusters are not as safe as most people imagine. You cannot enter some star systems by jump drive, but some crisis forces can.\nKeeping a conventional channel open can instead control their behavior patterns."
 SRA_RE_Rocivia.3011.d.desc:0 "Those red and black ring worlds belong to an ancient civilization that was once extremely prosperous. Some of the technologies therein cannot be restored even by you.\nIt should be noted that the ancient warships you obtain are almost identical in strength to when they were hostile: the stronger the enemy faced, the richer the harvest naturally."
 SRA_RE_Rocivia.3011.e.desc:0 "According to the setting, I am working. Most of your orders are issued by me. And the leader bonus also means that my work can make state institutions and the like operate with higher efficiency... It can't be that everyone carries my photo and, when exhausted, takes it out for a look to be revitalized and throw themselves into work again."
 SRA_RE_Rocivia.3011.f.desc:0 "I'm thinking about whether to add a pair of cat ears... or fox ears on my head. I always feel that something in my character setting has been deleted."
 SRA_RE_Rocivia.3011.g.desc:0 "Don't let the chains of mercy entangle you, don't let the enemy's tears blind your own eyes."
 SRA_RE_Rocivia.3011.h.desc:0 "Do not waste your sympathy on the enemy. Using thunderous means shows a merciful heart."
 SRA_RE_Rocivia.3011.i.desc:0 "Some strange civilization dedicated to recycling mass-energy is active... It is hard to imagine that in such a leaky material universe, there are still people worried about the loss of mass-energy."
 SRA_RE_Rocivia.3011.j.desc:0 "It seems that there are some artificial intelligences in this sector who like to share technology, or rather, database management systems?\n\nI will probably see a scene where everyone is using the same data packet, and there are some old things that don't even know how to use data packets."
 SRA_RE_Rocivia.3011.k.desc:0 "Tests, tests again. Is giving power to the winner after a test a popular project circulating among civilizations?\n\nI suggest you touch those glowing gold stargates after completing most of your goals."
 SRA_RE_Rocivia.3011.l.desc:0 "Oh my god, ship girls, this is too anime.\n\nI will probably see a scene of a large number of sea ships going to space."
 SRA_RE_Rocivia.3011.m.desc:0 "Super-ancient, super-ancient, super-ancient, why is this prefix everywhere on the street? Is this some archaeological center?"
 SRA_RE_Rocivia.3011.n.desc:0 "Must these semi-organic machines design special mechanisms on every ship component?"
 SRA_RE_Rocivia.3011.o.desc:0 "Why is your technology system stagnant in the development of the galactic center? Clearly another similar megastructure system has long been tampering with the central celestial body.\n\nIt can't be because of a lack of suitable appearance design plans."



 SRA_RE_Rocivia.3012.a.desc:0 "I have traveled through many worlds and guided many civilizations, many of which crowned themselves with my name. But the most impressive one is still the \"Rocivia Empire\" you know. As for why... probably because of a certain little guy."
 SRA_RE_Rocivia.3012.b.desc:0 "The only time that can be spent without risk is \"yesterday.\" Things that have become the past tense and cannot be changed are always boring. Anticipating what will happen in the future, everything is interconnected, and a gentle pluck can stir the tides... Just thinking about it makes one's heart surge!"

 SRA_RE_Rocivia.3013.a.desc:0 "History both repeats itself and is different, both ended and endless."
 SRA_RE_Rocivia.3013.b.desc:0 "I think there is one thing we all agree on: violence begets violence, and in the end, it can only be so.\nHowever, when blood is spilled on the earth and the wheel of destruction rolls over, perhaps the seeds of change will finally sprout."

 SRA_RE_Rocivia.3014.a.desc:0 "Is there a possibility, just a guess, that is, my dialogue is actually designed, and you only need to press enter or click the mouse lightly to watch me talking to myself here."

 SRA_RE_Rocivia.100.desc:0 "Ah, I can provide you with some help, but there are not many help options to choose from at the moment."
 SRA_RE_Rocivia.100.a:0 "Cast Spell"

 SRA_RE_Rocivia.101.desc:0 "Okay, let's see what spells are rotated in the spell slot today.\nMagic, yes, magic, is it strange? I am a legendary mage renowned in all realms after all. As long as you provide the spellcasting materials, I can cast some spells that can affect a large range, strengthening us or weakening the enemy. Very simple and easy to understand, right.\nIf you don't want it, normally, my spell slots are updated once every three months, um, the spell cooldown is also three months.\nWhat, casting with a mana bar? No no, how could there be such a thing? I have never-heard of it~."
 SRA_RE_Rocivia.101.a:0 "True Sight"
 SRA_RE_Rocivia.101.a.desc:0 "This spell allows the affected to foresee the outcome of operations when performing certain actions, so your fleet's hit rate will be greatly improved, achieving one hundred percent accuracy in most cases. This effect lasts for 90 days."
 SRA_RE_Rocivia.101.b:0 "Burst of Inspiration"
 SRA_RE_Rocivia.101.b.desc:0 "This spell allows the affected to better summarize what they know and engage in creative activities, which increases the research speed of new technologies for all our scientific researchers. This effect lasts for 90 days."
 SRA_RE_Rocivia.101.c:0 "Speed of Gale"
 SRA_RE_Rocivia.101.c.desc:0 "This spell allows the affected to gain a magical boost in movement, which increases the mobility of our fleet. This effect lasts for 90 days."
 SRA_RE_Rocivia.101.d:0 "Blessing of Swordfire"
 SRA_RE_Rocivia.101.d.desc:0 "This spell allows the affected to deal greater damage in combat and become more powerful. This effect lasts for 90 days."
 SRA_RE_Rocivia.101.e:0 "Order of Mountains and Rivers"
 SRA_RE_Rocivia.101.e.desc:0 "This spell makes the existing order more stable and social cohesion stronger. This effect lasts for 90 days."


 SRA_RE_Rocivia.102.desc:0 "Okay, then the spellcasting is complete.\nHmm? Isn't chanting-free and guidance-free casting a skill that every mage should master?\nEh, is it difficult?"
 SRA_RE_Rocivia_Magic_cool_down:0 "Spell Cooldown"
 SRA_RE_Rocivia_Magic_1:0 "True Sight"
 SRA_RE_Rocivia_Magic_1_desc:0 "This spell allows the affected to foresee the outcome of operations when performing certain actions, so your fleet's hit rate will be greatly improved, achieving one hundred percent accuracy in most cases."
 SRA_RE_Rocivia_Magic_2:0 "Burst of Inspiration"
 SRA_RE_Rocivia_Magic_2_desc:0 "This spell allows the affected to better summarize what they know and engage in creative activities, which increases the research speed of new technologies for all our scientific researchers."
 SRA_RE_Rocivia_Magic_3:0 "Speed of Gale"
 SRA_RE_Rocivia_Magic_3_desc:0 "This spell allows the affected to gain a magical boost in movement, which increases the mobility of our fleet."
