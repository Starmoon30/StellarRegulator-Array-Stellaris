# 突变列表
#################相关数值有更改，请参阅代码内的实际数值
# 1101即时正义：在进入战斗时，远征舰队有概率获得舰队增援。（1%，难度递增1%）
# 1102时空涌动：在进入战斗时，远征舰队有概率获得大幅度攻击速度加成。（5%概率，200%攻速，10天，难度递增5%，200%，5天）
# 2101复仇协议：每一支被摧毁的远征舰队都会使所有远征舰队获得一段时间的战斗增益。（10%伤害，90天，难度递增10%，45天）
# 1103镜像对手：在进入战斗时，远征舰队有概率复制对方的舰队司令。（20%，难度递增20%）
# 2102阴魂不散：任何一支远征舰队在被摧毁后都有概率在原地召唤一支援军。（2%，难度递增2%）
# 3101时空陷阱：远征舰队存在时，所有敌对势力的舰队在进入恒星系时有概率被大幅度减速一段时间。（5%概率，亚光速航速-50%，5天，难度递增5%，-50%，5天）
# 2103乘胜追击：任何一支远征舰队在战斗胜利后都有概率获得一段时间的战斗增益。（20%概率，10%伤害&攻速，30天，难度递增20%概率，10%，30天）
# 2104向我集结：任何一支远征舰队在战斗胜利后都有概率召唤一支援军。（3%，难度递增3%）
# 4101星海大盗：每隔随机的一段时间，远征舰队将窃走玩家的一部分资源。
# 1104金属疲劳：与远征舰队交战过的玩家舰队有概率大幅度增加自身维护费一段时间。（15%概率，+200%维护费，180天，难度递增15%概率，+200%，90天）
# 3201拿钱办事：远征舰队存在时，玩家舰队每次进入恒星系和进入战斗都有概率消耗资源。（5%概率，难度递增5%）
# 4201后方紧吃：远征舰队存在时，玩家的造船费用将每隔随机的一段时间随机提升一段时间。（每180到360天触发一次，+50%，持续180天，难度递增+50%，180天）
# 5301战争赔款：玩家摧毁任何一个远行航标都将被扣除巨量资源，且所有岗位产出减少一段时间。（-10%产出，720天）
# 5201黑暗收获：每当远征舰队摧毁一个星球，使所有远征舰队获得一段时间的战斗增益，并且有概率使远征舰队获得增援。（增援1，加成20%伤害＆攻速，180天，难度递增1，20%，90天）
# 2201力量展示：玩家舰队被远征舰队摧毁时，有概率使玩家受到一段时间的战斗减益。（10%概率，-10%伤害/攻速，60天，难度递增10%，-10%，60天）
# 5202绝对仇恨：每当一个远行航标被摧毁，使所有远征舰队获得永久战斗增益。（10%的当前难度buff）
# 4301时空冻结：每隔随机的一段时间，远征舰队将对所有玩家释放时空冻结。（720天，波动180天，难度递增减少120天冷却）
# 4302星穹之矛：远征舰队获得一艘星穹之矛，星穹之矛将随机释放时空冻结和奇点爆发，随机召唤增援舰队。星穹之矛需要被击毁多次才能被彻底摧毁，被摧毁后将在一段时间后重新部署。（冷却参考原版，加一半浮动，击毁5次，复活720天，难度递增5/10次，-180天）（每次进入交战检测是否开启奇点爆发）
# 1201相位变换：在进入战斗时，远征舰队有概率完全压制对方的命中能力，持续一段时间。（5%概率，-4000%，70%/20%/10%持续1/2/3天，难度递增5%概率，持续天数-30%/+20%/+10%）
# 1301斩首行动：在进入战斗时，远征舰队有概率直接杀死对方的舰队司令。（2%概率，难度递增2%）
# 2202荣耀协议：任何一支远征舰队在被摧毁后都有概率发生具有群体伤害的爆炸。（生成持续一天的光环船，雷场8000双穿伤害，3%概率，难度递增3%概率）
# 2105因果报应：摧毁远征舰队的舰队将随机受到减益，持续一段时间。（-5%伤害/攻速，持续30天，难度递增-5%，15天）
# 2301空间裂痕：任何一支远征舰队在被摧毁后都有概率在原地产生一个空间风暴，持续一段时间。（生成信标，持续30天，此后转化为雷场800000双穿的空间风暴，持续30天，1%概率，难度递增1%概率）
# 2203适者生存：每摧毁一支远征舰队，玩家对远征舰队的伤害都有概率下降一段时间。（30%概率，-10%对国家伤害，持续60天，难度递增15%概率，-10%伤害）
# 4303航道堵塞：远征舰队存在时，玩家舰队的超空间航速大幅度减缓，进入超空间的时间大幅度延长。（-30%超空间航速，+100%超空间充能，难度递增-30%，+100%）
# 4304天界轰炸：远征舰队将在玩家舰队的周围随机部署信标，一段时间后将在信标位置打开一个跨星系打击虫洞进行对舰队打击。
# 3202危机四伏：远征舰队存在时，玩家舰队在进入恒星系时有概率遭遇埋伏的远征舰队。（1%概率，难度递增1%）
# 4305星界封锁：远征舰队存在时，玩家舰队将无法跃迁。（-2000%跃迁范围）
# 2302发配边疆：摧毁远征舰队的玩家舰队有概率被传送到随机位置。（1%概率，难度递增1%）
