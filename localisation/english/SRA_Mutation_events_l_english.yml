 SRA_Mutation.1.name:0 "StellarRegulator Array - Select Mutation Level"
 SRA_Mutation.1.desc:0 "Mutation is a special enhancement mechanism for the crisis Third Expeditionary Fleet.\nMutation is disabled by default.\nCrisis difficulty affects the effect and trigger probability of mutations.\nRandom mutation selects each mutation with a probability of 20%. Selecting random mutation will not remove previously selected mutations.\nPlease note: Some mutations may affect performance.\n§YBeta testing.§!"
 SRA_Mutation.1.a:0 "Save Current Settings"
 SRA_Mutation.1.b.1:0 "Enable Mutation"
 SRA_Mutation.1.b.1.desc:0 "Click this button to enable mutation and start subsequent judgments of relevant triggers.\n§YPlease activate before the crisis begins.§!"
 SRA_Mutation.1.b.2:0 "Disable Mutation"
 SRA_Mutation.1.b.2.desc:0 "Click this button to disable mutation. Relevant triggers will no longer perform subsequent judgments."
 SRA_Mutation.1.c:0 "Browse Current Settings"
 SRA_Mutation.1.d:0 "Customize Mutation"
 SRA_Mutation.1.e:0 "Random Mutation: Vengeance"
 SRA_Mutation.1.e.desc:0 "My blade thirsts for blood.\nRandomly enable mutations. Scope includes Instant Justice, Spacetime Surge, Vengeance Protocol, Mirror Opponent, Lingering Spirit, Spacetime Trap, Pursuit of Victory, Rally to Me, Galaxy Pirate, Metal Fatigue, Karma, Step by Step."
 SRA_Mutation.1.f:0 "Random Mutation: Death"
 SRA_Mutation.1.f.desc:0 "All things will eventually submit.\nRandomly enable mutations. Adds Mercenary Work, Rear Supply Consumption, Dark Harvest, Display of Power, Absolute Hatred, Phase Shift, Glory Protocol, Survival of the Fittest, Perilous Situation, Instant Rebirth to the scope of 'Vengeance'."
 SRA_Mutation.1.g:0 "Random Mutation: Calamity"
 SRA_Mutation.1.g.desc:0 "Have you enjoyed the trip to hell?\nRandomly enable mutations. Adds War Reparations, Spacetime Freeze, Spear_of_Galaxy_Zenith, Decapitation Strike, Space Rift, Lane Blockage, Celestial Bombardment, Astral Blockade, Exile to Frontier, Passive Sabotage, Shadow Raid, Destined Rival, Sword of Divine Punishment, Chain of Sin, First Blood, Gestalt Disintegration to the scope of 'Death'."
 SRA_Mutation.1.h:0 "Logistics Crisis"
 SRA_Mutation.1.h.desc:0 "Troops and horses have not moved, but provisions go... wait, where are my provisions?\nEnable the following mutations: Galaxy Pirate, Metal Fatigue, Mercenary Work, Rear Supply Consumption, War Reparations, Passive Sabotage."
 SRA_Mutation.1.i:0 "Apocalyptic Catastrophe"
 SRA_Mutation.1.i.desc:0 "Pure power.\nEnable the following mutations: Instant Justice, Spacetime Surge, Vengeance Protocol, Mirror Opponent, Lingering Spirit, Pursuit of Victory, Rally to Me, Karma, Dark Harvest, Display of Power, Absolute Hatred, Phase Shift, Survival of the Fittest, Step by Step, Instant Rebirth."
 SRA_Mutation.1.j:0 "Sky Curtain Killing Intent"
 SRA_Mutation.1.j.desc:0 "The world is in chaos, leaving no room to breathe.\nEnable the following mutations: Spacetime Trap, Perilous Situation, Spacetime Freeze, Spear_of_Galaxy_Zenith, Lane Blockage, Celestial Bombardment, Astral Blockade, Shadow Raid, Sword of Divine Punishment."
 SRA_Mutation.1.z:0 "Ultimate Darkness"
 SRA_Mutation.1.z.desc:0 "Ascend the Abyss.\nEnable the following mutations: Instant Justice, Spacetime Surge, Vengeance Protocol, Mirror Opponent, Lingering Spirit, Spacetime Trap, Pursuit of Victory, Rally to Me, Galaxy Pirate, Metal Fatigue, Karma, Mercenary Work, Rear Supply Consumption, Dark Harvest, Display of Power, Absolute Hatred, Phase Shift, Glory Protocol, Survival of the Fittest, Perilous Situation, War Reparations, Spacetime Freeze, Spear_of_Galaxy_Zenith, Decapitation Strike, Space Rift, Lane Blockage, Celestial Bombardment, Astral Blockade, Exile to Frontier, Passive Sabotage, Shadow Raid, Destined Rival, Sword of Divine Punishment, Chain of Sin, Step by Step, First Blood, Instant Rebirth, Gestalt Disintegration."

 #1xx编号的事件为预设

 SRA_Mutation.2.name:0 "Browse Current Settings"
 SRA_Mutation.2.desc:0 "Click to remove the corresponding mutation."
 SRA_Mutation.2.a:0 "Return to Main Interface"
 SRA_Mutation.2.b:0 "Instant Justice"
 SRA_Mutation.2.b.desc:0 "When entering combat, the Expeditionary Fleet has a probability of receiving fleet reinforcements."
 SRA_Mutation.2.c:0 "Spacetime Surge"
 SRA_Mutation.2.c.desc:0 "When entering combat, the Expeditionary Fleet has a probability of gaining a significant attack speed bonus."
 SRA_Mutation.2.d:0 "Vengeance Protocol"
 SRA_Mutation.2.d.desc:0 "Every destroyed Expeditionary Fleet will grant all Expeditionary Fleets a combat buff for a period of time."
 SRA_Mutation.2.e:0 "Mirror Opponent"
 SRA_Mutation.2.e.desc:0 "When entering combat, the Expeditionary Fleet has a probability of copying the opponent's admiral."
 SRA_Mutation.2.f:0 "Lingering Spirit"
 SRA_Mutation.2.f.desc:0 "Any Expeditionary Fleet has a probability of summoning reinforcements at its location after being destroyed."
 SRA_Mutation.2.g:0 "Spacetime Trap"
 SRA_Mutation.2.g.desc:0 "When the Expeditionary Fleet exists, all hostile fleets entering the star system have a probability of being significantly slowed down for a period of time."
 SRA_Mutation.2.h:0 "Pursuit of Victory"
 SRA_Mutation.2.h.desc:0 "Any Expeditionary Fleet has a probability of gaining a combat buff for a period of time after winning a battle."
 SRA_Mutation.2.i:0 "Rally to Me"
 SRA_Mutation.2.i.desc:0 "Any Expeditionary Fleet has a probability of summoning reinforcements after winning a battle."
 SRA_Mutation.2.j:0 "Galaxy Pirate"
 SRA_Mutation.2.j.desc:0 "Every random period of time, the Expeditionary Fleet will steal a portion of the player's resources."
 SRA_Mutation.2.k:0 "Metal Fatigue"
 SRA_Mutation.2.k.desc:0 "Player fleets that have engaged the Expeditionary Fleet have a probability of significantly increasing their upkeep for a period of time."
 SRA_Mutation.2.l:0 "Mercenary Work"
 SRA_Mutation.2.l.desc:0 "When the Expeditionary Fleet exists, player fleets have a probability of consuming resources every time they enter a star system or enter combat."
 SRA_Mutation.2.m:0 "Rear Supply Consumption"
 SRA_Mutation.2.m.desc:0 "When the Expeditionary Fleet exists, the player's shipbuilding cost will randomly increase for a period of time every random period of time."
 SRA_Mutation.2.n:0 "War Reparations"
 SRA_Mutation.2.n.desc:0 "Players will be deducted a massive amount of resources when destroying any Expeditionary Beacon, and all output will be reduced for a period of time."
 SRA_Mutation.2.o:0 "Dark Harvest"
 SRA_Mutation.2.o.desc:0 "Whenever the Expeditionary Fleet destroys a planet, all Expeditionary Fleets gain a combat buff for a period of time, and there is a probability of the Expeditionary Fleet receiving reinforcements."
 SRA_Mutation.2.p:0 "Display of Power"
 SRA_Mutation.2.p.desc:0 "When a player fleet is destroyed by the Expeditionary Fleet, there is a probability that the player will suffer a combat debuff for a period of time.\n§YThis modifier updates every 5.00 £time£.§!"
 SRA_Mutation.2.q:0 "Absolute Hatred"
 SRA_Mutation.2.q.desc:0 "Whenever an Expeditionary Beacon is destroyed, all Expeditionary Fleets gain a permanent combat buff."
 SRA_Mutation.2.r:0 "Spacetime Freeze"
 SRA_Mutation.2.r.desc:0 "Every random period of time, the Expeditionary Fleet will cast Spacetime Freeze on all players."
 SRA_Mutation.2.s:0 "Spear_of_Galaxy_Zenith"
 SRA_Mutation.2.s.desc:0 "The Expeditionary Fleet obtains a Spear_of_Galaxy_Zenith.\n\n- The Spear_of_Galaxy_Zenith possesses passive subsystems §B\"Latent Silence\"§!, §B\"Eternal Flow\"§!, §B\"World Annihilation\"§!, §B\"Dawn Triumph\"§!, §B\"Star Core Overload\"§!, §B\"Apocalyptic Catastrophe\"§!, §B\"Falling Legend\"§!.\n- The Spear_of_Galaxy_Zenith will release §B\"Comet Glare Approach\"§!, §B\"Celestial Formation Guard\"§!, §B\"Event Horizon\"§! every period of time, and warp to the next target star system.\n- The Spear_of_Galaxy_Zenith will release §B\"Explosive Bloom\"§!, §B\"Dark Distant Echo\"§!, §B\"Pale Starfall\"§!, §B\"Singularity Outbreak\"§! during engagement.\n- After being destroyed, the Spear_of_Galaxy_Zenith will redeploy after a period of time.\n\n§RWhen the Spear_of_Galaxy_Zenith exists, the spatial isolation barrier of Expeditionary Beacons and Fortresses will not be lifted!§!"
 SRA_Mutation.2.t:0 "Phase Shift"
 SRA_Mutation.2.t.desc:0 "When entering combat, the Expeditionary Fleet has a probability of completely suppressing the opponent's tracking capability for a period of time."
 SRA_Mutation.2.u:0 "Decapitation Strike"
 SRA_Mutation.2.u.desc:0 "When entering combat, the Expeditionary Fleet has a probability of directly killing the opponent's admiral."
 SRA_Mutation.2.v:0 "Glory Protocol"
 SRA_Mutation.2.v.desc:0 "Any Expeditionary Fleet has a probability of causing an explosion with area damage after being destroyed."
 SRA_Mutation.2.w:0 "Karma"
 SRA_Mutation.2.w.desc:0 "Fleets that destroy the Expeditionary Fleet will randomly receive debuffs lasting for a period of time."
 SRA_Mutation.2.x:0 "Space Rift"
 SRA_Mutation.2.x.desc:0 "Any Expeditionary Fleet has a probability of generating a space storm at its location after being destroyed, dealing extremely high damage to all fleets within it for a period of time."
 SRA_Mutation.2.y:0 "Survival of the Fittest"
 SRA_Mutation.2.y.desc:0 "For every Expeditionary Fleet destroyed, the player's damage to the Expeditionary Fleet has a probability of decreasing for a period of time.\n§YThis modifier updates every 5.00 £time£.§!"
 SRA_Mutation.2.z:0 "Lane Blockage"
 SRA_Mutation.2.z.desc:0 "When the Expeditionary Fleet exists, the hyperspace speed of player fleets is significantly slowed, and the time to enter hyperspace is significantly extended."
 SRA_Mutation.2.aa:0 "Celestial Bombardment"
 SRA_Mutation.2.aa.desc:0 "The Expeditionary Fleet will randomly deploy beacons around player fleets. After a period of time, an interstellar strike wormhole will be opened at the beacon location to strike the fleet."
 SRA_Mutation.2.ab:0 "Perilous Situation"
 SRA_Mutation.2.ab.desc:0 "When the Expeditionary Fleet exists, player fleets have a probability of encountering ambushing Expeditionary Fleets when entering a star system."
 SRA_Mutation.2.ac:0 "Astral Blockade"
 SRA_Mutation.2.ac.desc:0 "When the Expeditionary Fleet exists, player fleets will be unable to jump drive."
 SRA_Mutation.2.ad:0 "Exile to Frontier"
 SRA_Mutation.2.ad.desc:0 "Player fleets that destroy the Expeditionary Fleet have a probability of being teleported to a random location."
 SRA_Mutation.2.ae:0 "Passive Sabotage"
 SRA_Mutation.2.ae.desc:0 "When the Expeditionary Fleet exists, the player's shipbuilding speed will randomly decrease for a period of time every random period of time."
 SRA_Mutation.2.af:0 "Shadow Raid"
 SRA_Mutation.2.af.desc:0 "Every period of time, a batch of Expeditionary Fleets will warp directly to your capital."
 SRA_Mutation.2.ag:0 "Destined Rival"
 SRA_Mutation.2.ag.desc:0 "All non-player factions will suffer devastating strikes when engaging the Expeditionary Fleet."
 SRA_Mutation.2.ah:0 "Sword of Divine Punishment"
 SRA_Mutation.2.ah.desc:0 "Every period of time, a batch of Expeditionary Fleets will warp directly near a random fleet of yours."
 SRA_Mutation.2.ai:0 "Malignant Heart Plague"
 SRA_Mutation.2.ai.desc:0 "Player fleets that destroy the Expeditionary Fleet have a probability of being infected, constantly losing hull points over an extremely long period of time."
 SRA_Mutation.2.aj:0 "Chain of Sin"
 SRA_Mutation.2.aj.desc:0 "Fleets that destroy the Expeditionary Fleet within 2.00 £time£ will take damage dependent on difficulty."
 SRA_Mutation.2.ak:0 "Step by Step"
 SRA_Mutation.2.ak.desc:0 "The Expeditionary Fleet has a probability of establishing a defense station at the location after destroying a target."
 SRA_Mutation.2.al:0 "First Blood"
 SRA_Mutation.2.al.desc:0 "Certain Expeditionary Fleets can only be truly destroyed after they have destroyed enemy fleets."
 SRA_Mutation.2.am:0 "Fleeting Time"
 SRA_Mutation.2.am.desc:0 "When the Expeditionary Fleet exists, issuing orders to fleets while paused will incur a penalty.\n§YExperimental technology, does not trigger reliably.§!"
 SRA_Mutation.2.an:0 "Breath Holding"
 SRA_Mutation.2.an.desc:0 "When the Expeditionary Fleet exists, issuing orders to fleets in the galaxy view will incur a penalty."
 SRA_Mutation.2.ao:0 "Evolutionary Overlord"
 SRA_Mutation.2.ao.desc:0 "Fleets that destroy the Expeditionary Fleet will have a probability of devolving into a lower form."
 SRA_Mutation.2.ap:0 "Instant Rebirth"
 SRA_Mutation.2.ap.desc:0 "The Expeditionary Fleet gains extremely high daily regeneration capabilities."
 SRA_Mutation.2.aq:0 "Gestalt Disintegration"
 SRA_Mutation.2.aq.desc:0 "Every period of time, a random design of your designable ships will be marked. The Expeditionary Fleet will generate a fleet containing ONLY one ship using this design to act for 720.00 £time£, and self-destruct when the countdown ends, clearing the mark.\nOnce any marked ship is destroyed, all other ships with the marked design are immediately destroyed."


