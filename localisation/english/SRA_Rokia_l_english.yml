 faction_SRA_Rokia_sub_title:0 "§RCrimson Dark Star§!\nA mysterious intelligent entity guiding dangerous chaotic energy, trying to find her own place among the stars." 
 leader_trait_SRA_Rokia_sci:0 "§RCrimson Dark Star§!"
 leader_trait_SRA_Rokia_sci_desc:0 "§RWandering in the lost dust world, endless intellect flows in this body. Treading on the path of thorns, illusionary abyss shadows linger at fingertips.§!"
 leader_trait_SRA_Rokia_1_ruler:0 "§RCrimson Dark Star§!"
 leader_trait_SRA_Rokia_1_ruler_desc:0 "§RWandering in the lost dust world, endless intellect flows in this body. Treading on the path of thorns, illusionary abyss shadows linger at fingertips.§!"
 leader_trait_SRA_Rokia_ruler:0 "§RCrimson Dark Star§!"
 leader_trait_SRA_Rokia_ruler_desc:0 "After tricking the galaxy's most ambitious civilization into completing the plan for her, the entire universe will eventually turn into boundless Abyssal chaos. In this sense, as long as there is no unpredictable external interference, she can enjoy the days of holding everything in her hands, pursue some personal interests, or simply rest, until urged by fate to set off again."
 SRA_Rokia_1_catch_phrase:0 "Because this world has long been reshaped, everything is false."
 SRA_Rokia_1_backstory:0 "\nRokia, a mysterious intelligent entity, an unknowable other."
 SRA_Rokia_2_catch_phrase:0 "Because that origin never existed, everything is real."
 SRA_Rokia_2_backstory:0 "\nRokia Rocivia, a wandering stranger. A named concept, a divided infinity, a shaped void.\nOne day, she will arrive at the hometown she has never met."

 SRA_Rokia_talk_return3:0 "Let me think about it." 
 SRA_Rokia_talk_return4:0 "Let's talk about something else." 
 SRA_Rokia_talk_exit1:0 "End transmission."

 SRA_Rokia_1:0 "Rokia"
 SRA_Rokia_2:0 "Rokia Rocivia"


 SRA_Rokia.100.a:0 "Issue Command"
 SRA_Rokia.100.b:0 "Chat"

 SRA_Rokia.200.desc:0 "Speak, what do you want?"
 SRA_Rokia.200.a:0 "Redeploy Crimson Dark Star."
#闲聊
#无表情
 SRA_Rokia_talk.3011.1.desc:0 "Truth is always meaningless, the crown is always tyrannical, the living always justify, the dead always speak wildly."
 SRA_Rokia_talk.3011.2.desc:0 "Life is self-tolerance.\nLife is consuming everything.\nLife is becoming bait for each other, regardless of good or evil.\nLife is fairness, life is inequality.\nLife is eternity."
 SRA_Rokia_talk.3011.3.desc:0 "When the first spark ignites from the creation of genes, a parasite is born. It spreads and diffuses among suitable hosts one after another, interacts and fights, grows, expands, becomes an incomparably huge collective in its name, crosses all tangible and intangible shackles, vows to encompass everything, and achieve eternity.\nThis is civilization. It struggles in bloated self, hyperplasia and extinction, survival and survival."
#微笑
 SRA_Rokia_talk.3012.1.desc:0 "People speak but do not say, people listen but do not hear; it was so in the past, and will be so in the future."
 SRA_Rokia_talk.3012.2.desc:0 "I wonder, how much of all this in your hands did you create yourself?"
 SRA_Rokia_talk.3012.3.desc:0 "Out of my little remaining kindness, I remind you, letting me leave too many traces here may not be a good thing. Of course, you never care, right."
#闭眼
 SRA_Rokia_talk.3013.1.desc:0 "Fate bares its fangs and claws; bottomless abyss lies by the roadside, filled with blood-like future."
 SRA_Rokia_talk.3013.2.desc:0 "Memento mori... Where does your path extend, where do your footsteps lead?" #人终有一死
 SRA_Rokia_talk.3013.3.desc:0 "Forgetting the past loses the wisdom sufficient to face the future, but immersing in repeated rumination of the past only invites ignorance..."
 SRA_Rokia_talk.3013.4.desc:0 "May you find peace in the world of the living."
 SRA_Rokia_talk.3013.5.desc:0 "Time disordered, nightmare babbling... I may not belong here.\n\nWill there be a world worthy of being called an ending left for me?"
#闭眼微笑
 SRA_Rokia_talk.3014.1.desc:0 "I earnestly hope you can listen to my advice, draw a conclusion to the story here, instead of replaying the drama again and again."
 SRA_Rokia_talk.3014.2.desc:0 "How far will she allow me to go? If the previous story has indeed ended, has the lead actor of the play changed? Maybe I should talk to her directly... although she definitely won't say."

#耀红黑星存在4001
 SRA_Rokia_talk.4001.1:0 "Alright, hurry up and order. I want to go for a walk, or not, actually didn't want to go out that much. Okay, still want to a bit. Forget it, up to you."
 SRA_Rokia_talk.4001.2:0 "I am releasing dangerous chaotic energy to pollute the space environment. If you are willing to let me find some targets, I can also pollute things like enemy hulls."
 SRA_Rokia_talk.4001.3:0 "Good morning, Executor! Hope you like this ethereal and dreamlike feeling, because I added some wonderful little things to your breakfast out of boredom, the kind with unknown side effects for now. Or you can let me go do something, lest your lunch has some wonderful big things added."
#耀红黑星战斗4002
 SRA_Rokia_talk.4002.1:0 "Hello, I am conducting space combat. Or, using a little accurate, appropriate word-\n§RI am slaughtering.§!"
 SRA_Rokia_talk.4002.2:0 "Hmm, communication?\nAlright, this little game is almost played out; time to wrap up."
 SRA_Rokia_talk.4002.3:0 "I can see them, touch them. They are so fragile; just a gentle caress, and they fall apart."
 SRA_Rokia_talk.4002.4:0 "God, Executor, the enemy is attacking your research specialist, you'd better save her quickly!\nOr forget it? You decide."
#耀红黑星使用荒芜驱驰4003
 SRA_Rokia_talk.4003.1:0 "Yes, I am watching, watching the hustle and bustle on the surface, coming and going, watching dying people do dying things... Well, maybe I should consider less about time spans?"
 SRA_Rokia_talk.4003.2:0 "Research Specialist Rokia used evil and terrible black magic to increase the industrial output of the planet where she is located during assistance research tasks. Hmm, just write it like this. Who cares if they believe it or not, what can they do to me?"
 SRA_Rokia_talk.4003.3:0 "Monitor thinking patterns, then provide some inspiration where needed; research capability goes up, how great."
 SRA_Rokia_talk.4003.4:0 "Just a gaze. I heard some powerful psionic entities can make the entire civilization prosperous like this, even better."
 SRA_Rokia_talk.4003.5:0 "Report: Current planetary industry operation is very stable, all production running at high efficiency, no social problems affecting output and development. Regarding the previously submitted anomaly accident and psionic usage traces report, after investigation confirmed, pure fabrication."
#耀红黑星探索恒星系4004
 SRA_Rokia_talk.4004.1:0 "Starry sky, so vast, who knows what secrets are hidden on the other side."
 SRA_Rokia_talk.4004.2:0 "I can't wait to meet those cute space creatures. Oh, thinking of those Ether Drakes with wonderful scales, Dimensional Horrors from another dimension, Tiyanki with extraordinary vitality, lively Space Amoebas, and so many interesting lives, I can't wait to-\n§RCrush them one by one.§!"
#耀红黑星研究异常4005
 SRA_Rokia_talk.4005.1:0 "I am researching anomalies! Hmm... not very anomalous to me, still have to be treated as anomalies for you."
 SRA_Rokia_talk.4005.2:0 "Advance, conquer, until the unknown end!"







