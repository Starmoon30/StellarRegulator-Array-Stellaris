 pc_SRA_chaos_star:0 "§RRemnant Star of Illusionary Abyss§!" 
 pc_SRA_chaos_star_desc:0 "§RTaboo words of chaotic dust breath, silencing thousands of living beings§!"

 sc_SRA_chaos_star_tooltip:0 "\n§RTaboo words of chaotic dust breath, silencing thousands of living beings§!"

