 SRA_planet_killer_4_buff_desc:0 "§RWhat worse could happen?§!"


 # event chins
 SRA_chaos_ascension_chain_title:0 "§RCrossing the Abyss of Chaos§!"
 SRA_chaos_ascension_chain_desc:0 "Who will give everything, who will achieve eternity."
 SRA_chaos_ascension_leader:0 "§RSublimation of Intellect§!"
 SRA_chaos_ascension_ship:0 "§RBlooming of Power§!"
 SRA_chaos_ascension_pop:0 "§RDedication of Collective§!"
