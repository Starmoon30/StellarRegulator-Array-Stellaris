 SRA_Weapon_Adjust.2.name:0 "SRA Tuned Weapon Adjustment"
 SRA_Weapon_Adjust.2.desc:0 "This interface allows you to adjust the damage and fire rate of your \"SRA Tuned Weapon\". Current Damage Bonus: §Y[Root.SRA_Weapon_Adjust_0]%§!, Fire Rate Bonus: §Y[Root.SRA_Weapon_Adjust_1]%§!."
