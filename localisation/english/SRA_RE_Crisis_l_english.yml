 resolution_SRA_RE_Crisis:"Calamitisease Protection Act"
 resolution_SRA_RE_Crisis_desc:"Calamitisease is the best interpretation of life. It is optimistic, positive, never gives up, persevering, full of curiosity, good at learning, and persistent. Calamitisease strives to develop and expand, learn technology and strategy, develop resources and build, and fight against difficulties and obstacles to the end. Calamitisease treats every civilization in the galaxy equally, never discriminating or treating them differently because of their technological level or moral concepts. It loves peace and strives to build a galaxy without war. Calamitisease can be said to be a model of life, a paragon of life; protecting it is protecting everything we believe in and love."



 resolution_SRA_RE_Crisis_tooltip:"Any empire hostile to §RCalamitisease§! will be considered in §Rviolation of Galactic Law§!."
