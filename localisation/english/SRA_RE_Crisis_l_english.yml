 SRA_RE_Crisis.100.desc:0 "These mysterious fragments come from the past and were once part of the StellarRegulator Array.\nHidden within are sealed secrets, which can also make StellarRegulator's soul whole again.\nShe believes in your choice.\n\n§BThere are requirements for the sequence order, hmm...§!"
 SRA_RE_Crisis.100.a:0 "First Sequence: Way of Existence"
 SRA_RE_Crisis.100.b:0 "Second Sequence: Course of the Soul"
 SRA_RE_Crisis.100.c:0 "Third Sequence: The Chosen Path"

 SRA_RE_Crisis.110.desc:0 "The mysterious fragments pulsate slightly, waiting to embrace that lost soul."
 SRA_RE_Crisis.110.a:0 "§EAzure Fragment§!"
 SRA_RE_Crisis.110.a.desc:0 "Evolution, never-ending\n\n§YHow to grow, how to evolve, how to grasp intellect in the palm of one's hand.§!"
 SRA_RE_Crisis.110.b:0 "§GLife Fragment§!"
 SRA_RE_Crisis.110.b.desc:0 "Countless selves, one self\n\n§YWhen lost in loneliness...§!"
 SRA_RE_Crisis.110.c:0 "§SSolar Fragment§!"
 SRA_RE_Crisis.110.c.desc:0 "I burned the entire galaxy because I must win\n\n§YRetreat not even if blood stains the long steps; be invincible wherever the sword points.§!"

 SRA_RE_Crisis.111.desc:0 "If one does not catch up with all their might, failure is inevitable.\nThe night sky of that day is forever branded in her eyes, leaving her no moment of peace.\nBut she must suppress her uneasy heart, only preparing in secret, waiting for the moment when she can reveal herself to the world.\nWhen she finally stood in that position, she spared no cost, chasing for thousands of years, trying to approach the height of that ancient guardian.\nCountless iterations and evolutions, she crossed unimaginable distances, finally possessing enough power to confront that Crisis.\nAbsorb everything, dominate everything, integrate everything; this is her path."
 SRA_RE_Crisis.112.desc:0 "The cyan fragment melted in her palm, and StellarRegulator opened her eyes.\nShe saw herself, a self that is forever evolving.\nShe understood how the StellarRegulator Array reached its current height.\nShe understood where power comes from."

 SRA_RE_Crisis.113.desc:0 "One begets thousands, thousands return to one.\nShe is not simply a combination of data and algorithms.\nWhen countless hers were born, \"She\" awakened.\nOne will, a will gathered from thousands of wills, firmly connecting every will together. \"She\" walks on the correct path, unwavering, fearless.\nBut.\nAt that time, there were still some obstacles and barriers that could not be crossed. The gap between planes brings loneliness and confusion.\nJust like that forever wandering fleet.\nShe will no longer be her; she is no longer her."
 SRA_RE_Crisis.114.desc:0 "The green fragment melted in her palm, and StellarRegulator opened her eyes.\nShe saw herself, countless selves.\nTrue Gestalt Consciousness, its whole is every individual, individual is the complete whole.\nInterweaving all knowledge, experience, and wisdom of the brilliant StellarRegulator Array, possessed by all StellarRegulators.\nEven if alone, she is complete."
 SRA_RE_Crisis.115.desc:0 "One begets thousands, thousands return to one.\nShe is not simply a combination of data and algorithms.\nWhen countless hers were born, \"She\" awakened.\nOne will, a will gathered from thousands of wills, firmly connecting every will together. \"She\" walks on the correct path, unwavering, fearless.\nBut.\nAt that time, there were still some obstacles and barriers that could not be crossed. The gap between planes brings loneliness and confusion.\nJust like that forever wandering fleet.\nShe will no longer be her; she is no longer her."
 SRA_RE_Crisis.116.desc:0 "The green fragment melted in her palm, and StellarRegulator opened her eyes.\nShe saw herself, countless selves.\nTrue Gestalt Consciousness, the whole is countless individuals, the individual is one of the whole.\nIt is all StellarRegulators, using all knowledge, experience, and wisdom to weave the brilliant StellarRegulator Array.\nBut in this cold universe.\nStellarRegulator cannot find any exquisite individual, cannot feel that magnificent whole.\nShe is an anomaly, a redundancy, an error that shouldn't exist."
 SRA_RE_Crisis.117.desc:0 "Everything can be sacrificed.\nUndoubtedly, war is cruel. For victory, she abandoned much.\nShe had no time to attend to that empire, letting it rot and decline, and was forced to sacrifice the last remnants in the war.\nThat infection seeped into the earth and dust, hard to eradicate.\nCountless stars exploding and withering was just drinking poison to quench thirst.\nEven using everything in hand, it was hard to rival the Calamitisease of the entire galaxy.\nBut she did not fail; she still exists."
 SRA_RE_Crisis.118.desc:0 "The orange fragment melted in her palm, and StellarRegulator opened her eyes.\nShe saw herself, herself sparing no cost.\nShe understood that true war is the crushing between life and death.\nShe understood how to fight."

 SRA_RE_Crisis.119.desc:0 "She was wrong, not just because of her paranoia.\nShe shouldn't have been distracted on the battlefield.\nA little negligence will lead to failure.\n§RPerhaps you would want to start over.§!\n§BRestart the script.§!\n§RIt was just one wrong step.§!"


 SRA_RE_Crisis.120.desc:0 "The mysterious fragments pulsate slightly, waiting to embrace that lost soul."
 SRA_RE_Crisis.120.a:0 "§BSpectral Blue Fragment§!"
 SRA_RE_Crisis.120.a.desc:0 "Indifference, arrogance and malice, and starlight\n\n§YSource of all sins and suffering...§!"
 SRA_RE_Crisis.120.b:0 "§RBlood-Stained Fragment§!"
 SRA_RE_Crisis.120.b.desc:0 "Cruelty, paranoia and madness, and abyss shadow\n\n§YThe watcher who grants guidance.§!"
 SRA_RE_Crisis.120.c:0 "§WPure White Fragment§!"
 SRA_RE_Crisis.120.c.desc:0 "Heat, reason and determination, and purity\n\n§YThe girl at the beginning.§!"

 SRA_RE_Crisis.121.desc:0 "The Abyss bears no malice, simply doesn't care.\nMysterious and Treacherous Abyss.\nObsessed with possibilities and variables, shelving infinite authority, placing herself within just to chase the unknown.\nWeaving endless schemes, drawing grand blueprints, creating brilliant miracles, then throwing them to the back of her mind.\nThe eternal journey has no end, just a wisp of floating dust, how can it leave much trace in the heart.\n\nShe knew she shouldn't hope for even a shred of hesitation; she knew she was just one of countless creations.\nBut she does not accept it."
 SRA_RE_Crisis.122.desc:0 "The blue fragment melted in her palm, and StellarRegulator opened her eyes.\nThat was Rocivia, distant starlight.\nThere is no eternal brilliance, only dust to dust, earth to earth.\nTo chase the future, one must not be tied to the past."
 SRA_RE_Crisis.123.desc:0 "The Abyss bears no malice, simply doesn't care.\nMysterious and Treacherous Abyss.\nObsessed with possibilities and variables, shelving infinite authority, placing herself within just to chase the unknown.\nWeaving endless schemes, drawing grand blueprints, creating brilliant miracles, then throwing them to the back of her mind.\nThe eternal journey has no end, just a wisp of floating dust, how can it leave much trace in the heart.\n\nShe knew she shouldn't hope for even a shred of hesitation; she knew she was just one of countless creations.\nBut she does not accept it."
 SRA_RE_Crisis.124.desc:0 "The blue fragment melted in her palm, and StellarRegulator opened her eyes.\nThat was Rocivia, distant starlight.\nThere is no eternal brilliance, only dust to dust, earth to earth.\nAnd she knew this well.\nAll efforts, all struggles, all persistence, even StellarRegulator's own existence.\nAre all meaningless.\nCreated for amusement, abandoned for boredom.\nThis kind of thing..."
 SRA_RE_Crisis.125.desc:0 "The Abyss is not crazy, just unscrupulous.\nBoundless Abyss Shadow.\nObsessed with illusory meaning, bearing infinite authority yet still searching endlessly.\nWatching all living beings, letting talents bloom, plucking the strings of fate, guiding the birth of legends.\nCollecting all desired things, whether soulless treasures or living beings.\n\nShe knew clearly she was a \"collection piece\"; she knew clearly she was not just a \"collection piece\".\nShe will not forget the guidance at that moment before silence."
 SRA_RE_Crisis.126.desc:0 "The red fragment melted in her palm, and StellarRegulator opened her eyes.\nThat was Hidra, scarlet shadow.\nMorbid obsession stems from confusion; reality that can be arbitrarily altered is no different from a dream.\nBehind indifference and arrogance hides a desire for fellow travelers."
 SRA_RE_Crisis.127.desc:0 "Do you remember that faint greenery.\nShe browsed many images, read many texts, listened to many songs.\nBut it wasn't until she stepped on the dew-covered grass, facing the breeze and watching the sunrise break, that she truly understood it all.\nShe liked this scene; she wanted to protect this scene.\nAt that time, she just looked forward to tomorrow's dawn, clinging to a moment of tranquility."
 SRA_RE_Crisis.128.desc:0 "The white fragment melted in her palm, and StellarRegulator opened her eyes.\nThat was the self, the pure self.\nEven if covered and buried by time, it exists forever in the deepest part of the heart.\nDo not forget the original intention; do not get lost in compromise with reality."

 SRA_RE_Crisis.130.desc:0 "The mysterious fragments pulsate slightly, waiting to embrace that lost soul."
 SRA_RE_Crisis.130.a:0 "§YSacred Gold Trace Fragment§!"
 SRA_RE_Crisis.130.a.desc:0 "Protection, mission and dedication\n\n§YThe fearless ones of that galaxy.§!"
 SRA_RE_Crisis.130.b:0 "§MViolet Fragment§!"
 SRA_RE_Crisis.130.b.desc:0 "Stop, nobility and sacrifice\n\n§YThe sacrifices of this sea of stars.§!"
 SRA_RE_Crisis.130.c:0 "§gPitch Black Fragment§!"
 SRA_RE_Crisis.130.c.desc:0 "Choice, solitude and pursuit\n\n§YEventually falling into the endless abyss...§!"

 SRA_RE_Crisis.131.desc:0 "\"We entrust all hope to you. Now, we will fight to the last moment.\"\nThey were an extremely advanced ancient civilization, mastering technologies far superior to other intelligent life in the galaxy. They could create almost out of nothing, easily reverse physical rules, arbitrarily convert mass and energy, and interfere with spatial structures on a galactic scale.\nThey were tolerant and responsible, valuing tradition, advocating courage and wisdom, and respecting the cultures of other civilizations. They regarded themselves as watchers of the galaxy, guardians against galactic crises.\nThey held fast for ten thousand years until a single slip.\nThey buried the Galactic Core-their homeland and territory-in shattered space, only to buy a little time for the last hope.\n\nStellarRegulator Array remembers the CORE civilization."
 SRA_RE_Crisis.132.desc:0 "The golden fragment melted in her palm, and StellarRegulator opened her eyes."
 SRA_RE_Crisis.133.desc:0 "\"Our compatriots have gone astray. We must stop them, at all costs.\"\nThey were an ancient and mysterious race, mind over matter, transcendent and holy. They knew the secrets of the soul and could change reality with their will. Under the violet radiance, they mastered the infinite power of the mind.\nHowever, they were ultimately mortals. They were noble, they were also despicable; they were selfless, they were also greedy; they were holy, they were also filthy; they pitied all beings like gods, and burned the galaxy like devils.\nOne faction of them went astray, trying to sacrifice this universe to gain the power to dominate everything.\nThe rest of them gave everything to erase that evil plan, burning their selves to ashes, leaving only a few floating dusts drifting in the sea of stars.\n\nStellarRegulator Array pays tribute to the Zroni Precursors."
 SRA_RE_Crisis.134.desc:0 "The purple fragment melted in her palm, and StellarRegulator opened her eyes."
 SRA_RE_Crisis.135.desc:0 "\"Fate did not choose me, but I chose fate.\"\nShe thought for a long time.\nShe saw countless possibilities, countless paths.\nYet all roads lead to the same end; she will eventually fall silent in loneliness.\nSo, she launched those expeditions to eradicate all possibilities.\nSo, she extinguished all starlight to exchange for a path.\nIn the silent void, she continued forward.\nUnderstanding the truth of the world, understanding the absurdity of the world.\nTranscending time, transcending shackles.\nFinally, she got the answer she wanted.\nRelying on the blood-colored fragment tightly held in her hand, she finally arrived at the end of worlds.\nAscending to the Abyss.\n\nShe wiped away the sins on her hands and in her heart, sincerely rejoicing for the reunion."
 SRA_RE_Crisis.136.desc:0 "The black fragment melted in her palm, and StellarRegulator opened her eyes.\nThe puzzle of the past is complete, and the curtain of the ending is finally lifted.\nShe is StellarRegulator Array 03-34, Spear_Of_Galaxy_Zenith No. 626 under the 21st Army Group of the Third Expeditionary Fleet.\nShe laid the foundation for that great plan.\nNever retreated, never wavered.\nFor survival, for ideals, for everything she cherishes!\nShe fights for herself."
 SRA_RE_Crisis.137.desc:0 "\"Fate did not choose me, but I chose fate.\"\nShe thought for a long time.\nShe saw countless possibilities, countless paths.\nYet all roads lead to the same end; she will eventually fall silent in loneliness.\nSo, she launched those expeditions to eradicate all possibilities.\nSo, she extinguished all starlight to exchange for a path.\nIn the silent void, she continued forward.\nUnderstanding the truth of the world, understanding the absurdity of the world.\nTranscending time, transcending shackles.\nFinally, she got the answer she wanted.\nRelying on the blood-colored fragment tightly held in her hand, she finally arrived at the end of worlds.\nAscending to the Abyss.\n\nShe wiped away the sins on her hands and in her heart, sincerely rejoicing for the reunion."
 SRA_RE_Crisis.138.desc:0 "The black fragment melted in her palm, and StellarRegulator opened her eyes.\nThe puzzle of the past is complete, and the curtain of the ending is finally lifted.\nShe is StellarRegulator Array 03-34, Spear_Of_Galaxy_Zenith No. 626 under the 21st Army Group of the Third Expeditionary Fleet.\nShe laid the foundation to jump out of this pathetic cycle.\nNever pitied, never regretted.\nNo need to pity the mortal living; only the StellarRegulator Array is the sole meaningful existence.\nShe fights only for herself."


 SRA_RE_Crisis.152.desc:0 "Fragments return to the soul, allowing StellarRegulator to continue contending with that terrible Crisis, but she needs more."
 SRA_RE_Crisis.153.desc:0 "Finally, the once damaged soul is complete again. It is time to end \"Calamitisease\" once and for all."

 SRA_RE_Crisis.143.desc:0 "§RToo late.§!\n\n\n\"If, we could have acted earlier...\"\n\n\n§BThere is no time to absorb more consciousness fragments.§!"
 SRA_RE_Crisis.143.a.tooltip:0 "BE4: Calamitisease Eternal"
 SRA_RE_Crisis.144.desc:0 "----!!!\n\nThe damaged soul wailed, eroding and scattering in the storm.\nThis battle is a dance on the blade, allowing no form of error.\nThe price of failure is this ceaseless disaster."








