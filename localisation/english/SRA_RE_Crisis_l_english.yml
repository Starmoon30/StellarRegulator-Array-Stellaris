 SRA_RE_Crisis.70.desc:0 "Interested in going for a walk with me?\n\n§YFive years ago, you successfully ended the threat of Calamitisease and found a way out in this galaxy-wide disaster. This is probably why Rocivia is looking for you today.§!"
 SRA_RE_Crisis.70.a:0 "Let's go."
 SRA_RE_Crisis.71.desc:0 "§YYou took a quiet path, no crowds, no noise, no solemnity or celebration. People in this country have their own ways to commemorate the gains and losses, joys and sorrows of this war, and so do you.\nFootsteps and wind echoed in the mountains. This small hill was not big, nor special, just one of countless natural remnants; the monument you were visiting was not special either, no decoration or name, not known by many, just one of countless stone monuments.§!"
 SRA_RE_Crisis.72.desc:0 "Some say that all great works are forged by sacrifice.\nWhether we are great is unknown, but sacrifice has been solidly written on this wordless monument, as in the past, so in the future.\n\n§YHer fingers rested lightly on the stone tablet.§!\n\nDo you know their names?"
 SRA_RE_Crisis.73.desc:0 "§YThe girl did not leave you time to answer.§!\n\nI don't remember. I never knew them, I don't know whose relatives or friends they were, don't know what kind of childhood they spent, what kind of life they had, what kind of future they thought of. When I gave the order, they were just numbers; when I looked for them, they were already dead.\nThey were roughly carved chess pieces, faceless, fateless, our tools, our consumables, and this chess game never ends."
 SRA_RE_Crisis.74.desc:0 "No need to tell me your thoughts; I don't care, nor do I mind. Go tell them, if you think they can hear.\n\n§YRocivia ended with a playful tone, seeming to want to see how you would respond.\nHer attitude was quite vague, actively coming to commemorate, yet seeming slightly disdainful of the commemorative ritual.§!"
 SRA_RE_Crisis.74.a:0 "Tell the stone tablet of your nostalgia for the departed."
 SRA_RE_Crisis.74.b:0 "Tell the stone tablet of the achievements you have made."
 SRA_RE_Crisis.74.c:0 "Tell the stone tablet of the beliefs you have held fast."
 SRA_RE_Crisis.74.d:0 "\"Yes, they are already dead.\""
 SRA_RE_Crisis.75.desc.a:0 "§YBefore the monument, you whispered your nostalgia for the departed, every word full of emotion and warmth. Rocivia was noncommittal, just standing quietly aside, seeming to listen to every detail.\n\"Your story is an indelible part of our history.\" You concluded thus.§!\n\nAlthough the universe is large, personal stories are worth remembering.\n\n§YShe responded thus, but her tone seemed to reveal an indifference caused by seeing too much.§!"
 SRA_RE_Crisis.75.desc.b:0 "§YBefore the monument, you proudly recounted the achievements made, displaying every victory of yours. Rocivia was noncommittal, just standing quietly aside, seeming to appreciate every creation.\n\"Our achievements are the best proof of your sacrifice.\" You concluded thus.§!\n\nAlong the way, we have created too much greatness.\n\n§YShe responded thus, but her tone seemed to reveal a contempt caused by habituation.§!"
 SRA_RE_Crisis.75.desc.c:0 "§YBefore the monument, you firmly stated the beliefs guarded until now, showing your strengths and unchanged original intentions. Rocivia was noncommittal, just standing quietly aside, seeming to think about every era.\n\"Our belief is the deepest connection between you and us.\" You concluded thus.§!\n\nFirm belief allows civilization to survive until now.\n\n§YShe responded thus, but her tone seemed to reveal a detachment caused by disapproval.§!"
 SRA_RE_Crisis.75.desc.d:0 "§YYou responded thus.\nA smile appeared at the corner of her mouth.§!\n\nYes, they are already dead. Can neither hear nor respond.\nAnd we are still alive, and we must continue to live.\n\n§YShe responded thus, but her tone seemed to reveal an unspeakable bitterness.§!"
 SRA_RE_Crisis.76.desc:0 "Fate always hides under her veil, doesn't she?\n\n§YRocivia said softly.§!\n\nWho would have thought that we wavered on the edge of life and death in just a few years, and now we have overcome all difficulties and are stronger than before?\n\nAnd who would have thought that this nameless place also has another visitor?"
 SRA_RE_Crisis.77.desc:0 "§YYou looked in the direction of her gaze. The girl who fought alongside you and finally turned the tide was walking towards you, surprise and joy revealing in her eyes.§!\n\nExecutor! I didn't expect you to be here too. And Rocivia... Speaker, nice to see you."
 SRA_RE_Crisis.78.desc:0 "§YShe walked to the stone tablet, didn't touch it, just looked.§!\n\nSometimes I also think, if we had done better at the beginning, would there have been fewer sacrifices?\nBut the past is set; all we can do is not let down their sacrifices."

