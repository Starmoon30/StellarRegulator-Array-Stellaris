 SRA_RE_Crisis.2.name:0 "Cosmic Malady"
 SRA_RE_Crisis.2.desc:0 "We only discovered something was wrong when it was too late! At some point, the stasis field of the CORE Precursors stopped working. Calamitisease has broken free from its shackles and begun to ravage the entire galaxy!\nWe must immediately assemble the fleet to contain this catastrophe.\nBut I fear we cannot stand alone. Should we inform other civilizations of this news?"
 SRA_RE_Crisis.2.a:0 "We must get the entire galaxy ready for battle."
 SRA_RE_Crisis.2.b:0 "We don't need the help of those trash."
 SRA_RE_Crisis.3.name:0 "Cosmic Malady"
 SRA_RE_Crisis.3.desc:0 " [SRA_RE_player.GetName] sent us an urgent notification. A dangerous hive mind organism named \"Calamitisease\" has leaked from an ancient planet. We must now prepare fleets to face this galactic disaster."
 SRA_RE_Crisis.3.a:0 "Alright, prepare for battle!"
 SRA_RE_Crisis.3.b:0 "Damn fools, playing with fire and dragging us into it."
 SRA_RE_Crisis.4.name:0 "Cosmic Malady"
 SRA_RE_Crisis.4.desc:0 " Observation stations report that a dangerous hive mind organism named \"Calamitisease\" has leaked from an ancient planet occupied by [SRA_RE_player.GetName]. We must now prepare fleets to face this galactic disaster."
 SRA_RE_Crisis.4.a:0 "Damn fools, playing with fire and dragging us into it."
 SRA_RE_Crisis.4.b:0 "Tsk, all fleets enter combat readiness!"


 resolution_category_SRA_RE_Crisis:"Sanctity of Calamitisease"
