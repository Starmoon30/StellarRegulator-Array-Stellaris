 SRA_RE_Crisis_chain_1_title:0 "Calamitisease"
 SRA_RE_Crisis_chain_1_desc:0 "A terrifying biological disaster has spread throughout the galaxy. They replicate various technologies, hide in every corner, and ceaselessly manufacture fleets.\nWe must survive until we find a way out.\n§RCalamitisease will infect the star system where its fleet is destroyed, turning it into a new breeding Abyss!\nAccumulating fleet wreckage in the same star system may cause unforeseen consequences!§!\n\n\n\n\n\n\n\n\n\n§RCalamitisease Fleets§! spawned in star systems polluted by Calamitisease §Rpermanently§! gain per §Rlayer of pollution§!:\n$MOD_SHIP_SHIELD_MULT$: §G+100%§!\n$MOD_SHIP_ARMOR_MULT$: §G+100%§!\n$MOD_SHIP_HULL_MULT$: §G+100%§!\n$MOD_SHIP_FIRE_RATE_MULT$: §G+100%§!\n$MOD_SHIP_WEAPON_DAMAGE$: §G+100%§!\n\n§ROther fleets§! fighting in star systems polluted by Calamitisease gain per §Rlayer of pollution§! for §R1800.00£time£§!:\n$MOD_SHIP_EVASION_MULT$: §R-1%§!\n$MOD_SHIP_ACCURACY_MULT$: §R-1%§!\n$MOD_SHIP_TRACKING_MULT$: §R-1%§!\n$MOD_SHIP_SHIELD_HARDENING_ADD$: §R-10%§!\n$MOD_SHIP_ARMOR_HARDENING_ADD$: §R-10%§!\n$MOD_SHIP_SHIELD_REDUCTION$: §R2%§!\n$MOD_SHIP_ARMOR_REDUCTION$: §R2%§!"

