 SRA_RE_Crisis.40.name:0 "Preliminary Research on \"Calamitisease\""
 SRA_RE_Crisis.40.desc:0 "In the process of engaging \"Calamitisease\", we successfully recovered a small amount of \"Calamitisease\" samples. Perhaps studying them will allow us to find a way to deal with them."
 SRA_RE_Crisis.40.a:0 "Start research immediately."
 SRA_RE_Crisis_1_SP1:0 "Preliminary Research on \"Calamitisease\""
 SRA_RE_Crisis_1_SP1_DESC:0 "In the process of engaging \"Calamitisease\", we successfully recovered a small amount of \"Calamitisease\" samples. Perhaps studying them will allow us to find a way to deal with them."
 SRA_RE_Crisis.41.name:0 "Preliminary Research on \"Calamitisease\""
 SRA_RE_Crisis.41.desc:0 "Through preliminary research on \"Calamitisease\", we have gained some understanding of this mysterious nano-organism.\nResearch shows that \"Calamitisease\" is a nano-lifeform, but unlike normal carbon-based or silicon-based life, \"Calamitisease\" is a lifeform composed of complex particle structures, naturally possessing the ability to disassemble and assemble atomic nuclei.\nCountless femtometer-level \"hadron tweezers\" on the surface allow them to easily use strong interaction to disassemble atoms, sending protons and neutrons or even other baryons into the body for reorganization. This way of survival allows them to use almost any type of atom for replication and amplification.\nThe intelligence of \"Calamitisease\" basic units is not high; they only replicate themselves according to the program. However, after \"Calamitisease\" units replicate to a certain scale, qualitative change occurs. Some \"Calamitisease\" units change their own structure to form specialized units responsible for a certain task, giving the aggregated \"Calamitisease\" cluster high intelligence, beginning to show complex behaviors, and carrying out large-scale amplification."
 SRA_RE_Crisis.41.a:0 "Continue research."
 SRA_RE_Crisis_1_SP2:0 "In-depth Research on \"Calamitisease\""
 SRA_RE_Crisis_1_SP2_DESC:0 "We need to conduct further research on the functions of \"Calamitisease\"."
 SRA_RE_Crisis.42.name:0 "In-depth Research on \"Calamitisease\""
 SRA_RE_Crisis.42.desc:0 "Further research has revealed more information.\nWhen the \"Calamitisease\" cluster expands to a certain extent, its intelligence level increases significantly. Such macroscopic individuals have the ability to move freely and execute various actions like intelligent beings. At this stage, they will try to imitate the structure of other matter. In this way, \"Calamitisease\" begins to be able to indirectly manipulate more matter and form structures more suitable for war. Within the scope currently observed, \"Calamitisease\" has basically mastered the technology used by the CORE Precursors.\nAnd when the macroscopic individual expands further, it will be able to form a structure that accesses the subspace network, connecting with \"Calamitisease\" in other locations. \"Calamitisease\" at this stage is called the aggregate stage, and the entire \"Calamitisease\" civilization is linked by such countless aggregates. Perhaps this connection will be our breakthrough?"
 SRA_RE_Crisis.42.a:0 "Continue research."
 SRA_RE_Crisis_1_SP3:0 "\"Calamitisease\" Subspace Connection Research"
 SRA_RE_Crisis_1_SP3_DESC:0 "We need to conduct further research on the subspace connection between \"Calamitisease\" to understand its working principle."
 SRA_RE_Crisis.43.name:0 "\"Calamitisease\" Subspace Connection Research"
 SRA_RE_Crisis.43.desc:0 "With the help of StellarRegulator, we conducted a series of experiments using subspace barrier technology.\nThe results show that this faster-than-light connection unites the consciousness of the entire \"Calamitisease\" species. However, if the connection is cut off due to accident or interference, the isolated \"Calamitisease\" will form an independent consciousness and act autonomously temporarily until it reconnects with other consciousnesses. By that time, consciousnesses will devour each other based on intelligence scale, reforming a unified consciousness.\nFor now, this may be the only way to eradicate this cosmic malady. But we need a §Bstronger consciousness§!."
 SRA_RE_Crisis.43.a:0 "Tsk..."
 SRA_RE_Crisis_1_SP4:0 "Stellar Nexus Facility Preparation"
 SRA_RE_Crisis_1_SP4_DESC:0 "...\nStellarRegulator needs preparation. To confront the galaxy-level \"Calamitisease\" cluster on the scale of consciousness, she needs to leverage the power of the Stellar Nexus. That massive interstellar structure possesses unimaginable heritage, but guiding such power is not simple. In addition, how to access the \"Calamitisease\" subspace network is also a difficult problem."
 SRA_RE_Crisis.44.desc:0 "Nano-implantation port... operating normally. Computation Array access... operating normally.\nExecutor, I am ready and can commence operations at any time.\nAre you... worried about me?"
 SRA_RE_Crisis.45.desc:0 "Although... strictly speaking, I am not very confident either, but if we don't do it, success is impossible. Besides... since we have prepared everything we can, I will accept whatever result comes calmly. As the saying goes, do your best and leave the rest to fate."
 SRA_RE_Crisis.46.desc:0 "Wait a bit longer? No, no need. I don't need your computer group; the power of the Stellar Nexus is sufficient. It's just a question of whether I can master it...\nBesides, your fleets are sacrificing every second, while \"Calamitisease\" is endless.\nYou can order me to start at any time."
 SRA_RE_Crisis_1_SP5:0 "Start Connection"
 SRA_RE_Crisis_1_SP5_DESC:0 "End it once and for all.\n\n§YThis is the last time the $SRA_RE_StellarRegulator_debris_chain_title$ event chain can be completed. Once this special project is completed, the $SRA_RE_StellarRegulator_debris_chain_title$ event chain will end, unabsorbed fragments will become §Rthe price of hesitation§!, and the operation against \"Calamitisease\" may §Rfail§!§!"

 SRA_RE_Crisis.47.desc:0 "Everything is ready. According to your decision, StellarRegulator is starting to connect to the isolated \"Calamitisease\" cluster, preparing to use this as a medium to overwrite the species consciousness of \"Calamitisease\".\nRepeating the old trick, hmm."
 SRA_RE_Crisis.48.desc:0 "After all, Roci didn't give you any other route in her script."
 SRA_RE_Crisis.49.desc:0 "But ultimately you have to place the hope of victory on StellarRegulator, because... this is §Bfate§!.\nOnly this time is different from that time. Admittedly, \"Calamitisease\" is far less powerful than back then, but StellarRegulator is also much weaker.\nWe all know she is incomplete; she is just a lost fragment, not a complete civilization."
 SRA_RE_Crisis.50.desc:0 "Go find her; she needs you.\nHmm, I can give you a small hint.\n\"Shackled feet §Rcross-step§! into freedom\"\n\"Incongruous melodies §Rinterlock§! into harmony\""
 SRA_RE_Crisis.51.desc:0 "...I can do it.\n§Y\"Connection process confirmed, activating nano-implantation port...\"§!\n...!\n§Y\"Connection established.\"§!\n§Y\"Core computing power increasing... Current computing power output: 63%\"§!\n...I did it."
 SRA_RE_Crisis.52.desc:0 "§Y\"Stellarcrystal Network operating normally, crystal energy converting to psionic...\"§!\n...\n...I can feel its pain and helplessness... It knows what I am going to do... It is begging me...\nI...\nI won't stop."
 SRA_RE_Crisis.53.desc:0 "Its consciousness disappeared...\n...\nI will move forward and end all this.\n§Y\"Releasing subspace blockade... Shock preparation ready.\"§!\n...\n...!!!"
 SRA_RE_Crisis.54.desc:0 "You can hear her gasp, her scream.\nRocivia was right; the current StellarRegulator is not strong enough. She cannot withstand this galaxy-level massive consciousness. She will collapse, she will fail.\nShe will disappear."
 SRA_RE_Crisis.54.a:0 "§RCut the connection§!"
 SRA_RE_Crisis.54.b:0 "§BBelieve in her§!"
 SRA_RE_Crisis.55.desc:0 "You cut the connection.\nA girl survived.\nBut this disaster will never end.\n§RPerhaps you would want to start over.§!\n§BRestart the script.§!"
 #TE：冲破黑暗
 SRA_RE_Crisis.56.desc:0 "When two isolated \"Calamitisease\" clusters merge again, the stronger consciousness replaces the other.\nYou now know exactly how that happens.\nA duel, a slaughter, one devouring the other.\nThe weak are meat, and the strong eat; the winner is king. This is the law of survival.\nThe silent bloody sky is unshakable.\nThe girl kneeling on the ground is so insignificant.\nBut you know, this duel is not over yet."
 SRA_RE_Crisis.57.desc:0 "Ugh...\nNo...\nI can't fall here!"
 SRA_RE_Crisis.58.desc:0 "Her eyes flashed with light.\nShe gripped the \"Stellarcrystal Lawholder\" tightly, propping up her body under invisible pressure.\nBlue starlight flashed at the tip of the staff, and red shadows gathered beside her.\nThat was the power gifted by the two creators, responding to the courage to hold fast to the mission.\nShe stood up."
 SRA_RE_Crisis.60.desc:0 "Not enough... Just guiding this power makes my hands tremble.\nI must absorb more consciousness fragments to master this power, to defeat this cosmic malady.\nExecutor!\n...I trust your choice.\n§BKnow yourself.§!"
 SRA_RE_Crisis.61.desc:0 "\"StellarRegulator took a deep breath.\"\nThus, the power on her began to churn.\nPale blue, flame-like phantoms representing the rapid expansion of her consciousness overflowed, looking so striking under this scarlet sky.\n\nThen the flames roared, tearing the sky, splitting the earth, shattering everything, and shaping it into her own colors."
 SRA_RE_Crisis.62.desc:0 "She raised the \"Stellarcrystal Lawholder\" high, drawing down the galaxy. Under the scepter that commands everything, even the firmament must bow.\nFinally, when the flames burned out and light spots drifted down, this void world returned to silence. StellarRegulator looked at you.\nShowing a smile."
 SRA_RE_Crisis.63.desc:0 "You saw all \"Calamitisease\" turn to ashes under her will, and this world collapsed into countless fragments along with it."
 SRA_RE_Crisis.64.desc:0 "She fell into your arms."
 SRA_RE_Crisis.65.desc:0 "Executor..."
 SRA_RE_Crisis.66.desc:0 "...We won."

 SRA_RE_Crisis.67.name:0 "Victory!"
 SRA_RE_Crisis.67.desc:0 "After the master consciousness was replaced, all \"Calamitisease\" entities self-destructed. This protracted war has finally been declared over."
 SRA_RE_Crisis.67.a:0 "Finally..."

