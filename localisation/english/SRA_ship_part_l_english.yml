 SRA_Aura_1_DESC:0 "§BAC-LOTT <Book of Law> Reality Constraint System is a StellarRegulator technology device used to forcefully mandate basic rules within the range of action in unstable environments, aiming to maintain basic behavioral capabilities as much as possible.\nThis modified version expands the range of action to achieve a certain degree of advantage.§!"
