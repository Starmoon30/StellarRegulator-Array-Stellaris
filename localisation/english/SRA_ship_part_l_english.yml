 SRA_SD_ship_Part_Shield:0 "Disintegration Barrier"
 SRA_SD_ship_Part_Shield_DESC:0 "This spell device projects a normally invisible shield for the ship to protect it from harm in all forms of attack.\nThe Disintegration Barrier will intercept any attempt to shoot objects or spells into the barrier, and disintegrate objects touching its outer surface into essence usable for reinforcing the hull. Thus, this component is considered capable of strengthening armor and hull."
