 SRA_Return_To_Calamitisease_Ship_Aura:0 "§RCrimson Dark Star - Plague Heart Malignant Colonization§!"
 SRA_Return_To_Calamitisease_Ship_Aura_DESC:0 "§RCalamity is dyed with the color of the Abyss, intending to return all things to one body.§!\n\n§Y-Every 8.00 £time£, §RHeart of Calamitisease§! will randomly select a hostile fleet in the star system and apply 8.00 £time£ of §RSilent Mourning§! to it.\n-Whenever a fleet is destroyed, §RHeart of Calamitisease§! will summon a group of §RBoundless Abyss Shadows§! that can exist for 64.00 £time£ at the location of the destroyed fleet.\n-Whenever it is about to be destroyed, §RHeart of Calamitisease§! will lose 20 ascension progress, enter a protected state, and release a group of §RBoundless Abyss Shadows§!. Destroying this group of §RBoundless Abyss Shadows§! ends the protected state of §RHeart of Calamitisease§!. When this group of §RBoundless Abyss Shadows§! is destroyed, it will apply a negative effect within the star system, the intensity of which decreases rapidly with the existence time of the §RBoundless Abyss Shadows§!.§!"
 SRA_Return_To_Calamitisease_Ship_Aura_1:0 "§RSilent Mourning§!"

 SRA_Return_To_Calamitisease_Ship_Aura2:0 "§RCrimson Dark Star - Boundless Echo§!"
 SRA_Return_To_Calamitisease_Ship_Aura2_DESC:0 "§RYou sing, you harmonize, and thus all sounds fall silent.§!\n\n§Y-Every 8.00 £time£, §RHeart of Calamitisease§! will randomly select a hostile fleet in the star system and apply 8.00 £time£ of §RSilent Mourning§! to it.\n-Whenever it is about to be destroyed, §RHeart of Calamitisease§! will enter stasis state for 16.00 £time£, then §Rfully recover§!.§!"

