 d_SRA_SD_star_chaos:0 "§RMetabyss§!"
 d_SRA_SD_star_chaos_desc:0 "Lonely Mountain, Barren Spring, Eye of the Earth... We have countless names for that location, that abyss.\nThis scar on the mountains and plains is shrouded in black mist and blood color all day long, wandered by crystal creations and disordered beings, hiding endless secrets.\nFrom the origin of history to the present era.\nWe have walked to this day, never a moment without struggle.\nThe blood of warriors was frozen, the bones of soldiers were burned, the souls of heroes were extinguished.\nWe have walked to now, never a moment without sacrifice.\nWe came from the desolate and cold border to the current ring belt, climbed the Tower of the Firmament, broke through the ethereal starry sky; we have experienced much.\nBut we have never lifted the veil, never truly known the Metabyss.\n\n§YThe £job_SRA_SD_chaos_explorer£ $job_SRA_SD_chaos_explorer_plural$ jobs provided by this rare feature will increase with the increase of £mod_planet_max_districts_add£ $MOD_PLANET_MAX_DISTRICTS_ADD$ provided by $d_SRA_SD_star_babel$."
 d_SRA_SD_star_babel:0 "§YTower of the Firmament§!"
 d_SRA_SD_star_babel_desc:0 "Tower reaching the sky.\nThe tower that quietly appeared after ['concept_SRA_SD_The_Rips'], sitting directly on the Lonely Mountain, the center of the Metabyss. The massive base spans the bottomless pit, erected on the mountains.\nThe giant tower is built of incomprehensible materials, inlaid with blood-colored crystals rolling with mist.\nFor some reason, the Metabyss does not erode this high tower, and because of this, it has an unparalleled status in today's civilized world.\nIt pierced the firmament.\nThe starry sky accessible from nowhere else can be reached directly by climbing the tower.\nWe ascend the tower and step into the galaxy.\n\nToday, within the giant tower is a massive aerospace base, leveraging the unique gravity environment and unique geographical advantages, shouldering the great journey of exploring worlds outside the sky.\n\n§YModifiers such as £mod_planet_max_districts_add£ $MOD_PLANET_MAX_DISTRICTS_ADD$ provided by this rare feature can be increased infinitely, but each increase requires filling £job_SRA_SD_chaos_explorer£ $job_SRA_SD_chaos_explorer_plural$ jobs and consuming all pops in these jobs.§!"
 d_SRA_SD_star_department_of_abyss:0 "§BDepartment of Metabyss Affairs§!"
 d_SRA_SD_star_department_of_abyss_desc:0 "The Department of Metabyss Affairs has full authority to handle all command and mobilization related to Metabyss exploration, development, and related hazard control.\nTo survive in this era, the civilized world entrusts power to wise men and warriors. This is a wise choice, whether for inhabitants under the firmament or empires above the sea of stars.\n\n\n\n§BIf civilization is stupid enough to be destroyed by the Metabyss, the Department of Affairs doesn't mind doing it instead.§!"
 d_SRA_SD_star_lapis_lazuli:0 "§CLapis Lazuli Chamber of Commerce§!"
 d_SRA_SD_star_lapis_lazuli_desc:0 "A huge web of domination, infiltrating every corner in the name of a chamber of commerce.\nSelling goods, selling intelligence, selling existence and non-existence, selling civilization and order. It expands, it evolves.\nBut ultimately, all this is just to offer everything she needs when an eccentric, inhumanly cold painter frowns."
 d_SRA_SD_star_emerald_tower:0 "§EEmerald Tower Society§!"
 d_SRA_SD_star_emerald_tower_desc:0 "A massive academic cluster and organization established around the Emerald Tower Library. Seekers of knowledge cross the mountains of the past here, redrawing the boundaries of wisdom and knowledge.\n\"Except for the order of the library, only truth is allowed here.\"\n\nAt first, there was only a high tower by the stream.\nA group of young people came here seeking knowledge, but were expelled by the tower master for their selfless noise.\nSo they built their own dwellings in front of the tower, discussing day and night over borrowed books.\nA city of scholars was born here."
 d_SRA_SD_star_forest_of_moon_shadow:0 "§GMoon Shadow Forest§!"
 d_SRA_SD_star_forest_of_moon_shadow_desc:0 "Children of nature created by moonshine and breeze, walking on thorns and vegetation.\nThe most agile hunters, the sharpest guides, the most diligent farmers.\nElves offer loyalty to the Moon Shadow, and the Blade of Moon Shadow serves you.\n\n§GThe spirituality of the earth cannot cross the firmament, so it is willing to watch the mountains for the children out of the cage.§!"
 d_SRA_SD_star_isolated_island:0 "§gIsolated Island§!"
 d_SRA_SD_star_isolated_island_desc:0 "Barren, dead silent.\n\"No more sorrow, no more dreams.\"\nThis isolated island refuses life, refuses evolution, refuses waves of fate.\nSince the Black Dragon accepted the power that deprived all colors and bound itself here, this place where an uninvited guest claiming to be a god once descended has had no future at all.\nThe Dragon of Finale drew a period to all variables, declaring the end in this place of origin, bidding farewell to this world and all worlds.\n\nEven if the dragon shadow is no longer here today, this world will no longer bear undeserved suffering."
 d_SRA_SD_star_the_borderland:0 "§gThe Borderland§!"
 d_SRA_SD_star_the_borderland_desc:0 "Layered, twisted and wrinkled massive mountains, continuous, towering into the clouds.\nA ring of mountains tens of kilometers high surrounds our land, its width surpassing the scale of any other geographical feature.\nOne speculation is that an unimaginable continental expansion event occurred in a certain era, proliferating land plates from the Metabyss at a speed possibly tens of thousands or even hundreds of millions of times faster, causing the original continental structure to be pushed and squeezed, finally stacking into the Borderland we see today. But obviously, our surface composition is unlikely to withstand such pressure; the entire world should have melted into a sea of magma with this event, rather than just a super-large-scale orogeny occurring.\nRegardless, the Borderland delineates the scope of the central area of our civilization; the world outside the border is rarely mentioned.\nAnd it provides almost inexhaustible mineral resources."
 d_SRA_SD_star_the_under_furnaces:0 "§RNinefold Furnaces§!"
 d_SRA_SD_star_the_under_furnaces_desc:0 "Molten Cave, Hell, Nine Hells, Netherworld, Underground World, or other names are all normal for this underground demon world.\nA massive cavity layer averaging 20 kilometers deep under the surface of Stellariens, filled with flowing magma. Surface mountains are huge stone pillars here, supporting this massive underground world together with other magical forces.\nThe air filled with sulfur smell is maintained at 50 to 60 degrees, possibly due to the characteristics of widely growing plants like cold light flowers absorbing heat energy, or the result of heat exchange in some thinner submarine strata.\nMagma wells up in the mountains here, then flows down from the cracks in the upper strata, forming a unique magma waterfall landscape. In this special environment, extremely active Everburning Ore crystallizes in patches at the top of the Ninefold Furnaces and emits high-intensity light sufficient for illumination in some areas with smaller height ranges. Ice-blue thermophilic plants grow widely here, and diverse magical creatures are active in magma lakes and on the surface. The abundant energy here makes the predator-prey relationship relatively weak, while mutual fighting has become the main reason restricting population size.\nPossessing extremely rich mineral deposits and inexhaustible energy, under the social thought advocating force, the Ninefold Furnaces has a developed military industry and technology, with unique advantages in forging and smelting. The artisan class is the first choice for demons who do not want to participate in ubiquitous fighting. In addition, there are also communities established by some scholars who chose to study their own spell abilities.\nNow, the extraction of magma heat energy has become the most important energy source for the entire Stellariens, and high-quality materials produced by the Ninefold Furnaces also occupy a huge share in corresponding fields."



 planet_SRA_SD_old_home_planet:0 "Lost Outpost"
 planet_SRA_SD_old_home_planet_desc:0 "The first exploration team landed on this planet in chaotic spacetime, establishing our first foothold in ['concept_SRA_SD_barren_space'].\nIt seems many outsiders think this is our home planet?"
 planet_SRA_SD_1_start_system_2:0 "Blossoming Metarbor"
 planet_SRA_SD_1_start_system_2_desc:0 "This planet behaves quite strangely; it seems not to be negatively affected by the terrible power in the system, maintaining vitality.\nIs this a good omen?"
 planet_SRA_SD_1_start_system_3:0 "Omen of Havoc"
 planet_SRA_SD_1_start_system_3_desc:0 "This planet was likely once a colony of another civilization, but has been destroyed along with the massive sensor facility on it.\nIt is likely the first victim of our arrival in this universe."
 planet_SRA_SD_1_start_system_4:0 "Shattered Archipelago"
 planet_SRA_SD_1_start_system_4_desc:0 "Continental structures thrown out of our home during ['concept_SRA_SD_The_Rips'] float in the stars; the power that destroyed it reshaped it into a new form."
 d_planet_SRA_SD_1_start_system_4_1:0 "§RShattered Furnace§!"
 d_planet_SRA_SD_1_start_system_4_1_desc:0 "This land, directly exiled from Stellariens by terrifying Metabyss power, is still shrouded in suffocating crimson fog today. Reality eroded at all times resonates with every will on it, revealing mysteries beyond the frontier of cognition.\n\n§YOutput and upkeep of this rare feature, as well as provided $mod_planet_researchers_produces_mult$ and $mod_planet_researchers_upkeep_mult$, increase with the number of £pop£ pops on this planet.§!" #\n§R此星球在£pop£人口数量大于20时会发生随机恶性事件，恶性事件的频率和危害会随人口数量的提升而提升。§!
 d_planet_SRA_SD_1_start_system_4_2:0 "§RCity of Porphyry§!"
 d_planet_SRA_SD_1_start_system_4_2_desc:0 "A massive city established deep in $d_SRA_SD_star_the_under_furnaces$ a thousand years ago, a metropolis flowing with lava layered in the underground world. Although completely destroyed by ['concept_SRA_SD_Abyss_Erosion'], the will remaining on it still repels the influence of the Metabyss.\n\n§YThis rare feature counteracts the $mod_planet_researchers_produces_mult$ and $mod_planet_researchers_upkeep_mult$ modifiers of the $d_planet_SRA_SD_1_start_system_4_1$ rare feature.§!"


