 ###########深渊事务司



 SRA_SD_event.19.name:0 "Emerald Tower Literature Restoration"
 SRA_SD_event.19.desc:0 "Based on literature in the Emerald Tower, we can localize and reproduce known ancient space technology systems. Based on Stellariens' unique rules and action systems, using unique materials to restore various parameters required by most technologies.\nThis method can easily acquire most technologies of conventional interstellar civilizations, but making new progress on this basis requires more effort and accumulation.\nIf chosen, it is expected to take decades to establish a complete scientific and technological theoretical system."
 SRA_SD_event.19.a:0 "This will give us a huge advantage."
 SRA_SD_event.19.a.tooltip:0 "§EEffect:§!\n§YImmediately gain vast majority of technologies.§!\n\n§PPenalty:§!\n$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$: §R-400%§!, lasts §Y40.00 Years§!."
 SRA_SD_event.19.b:0 "Better keep feet on the ground."
 SRA_SD_event_19_buff:0 "Emerald Tower Literature Restoration"
 SRA_SD_event_19_buff_desc:0 "We need to re-establish the scientific research system."


 SRA_SD_event.20.name:0 "§BDepartment of Metabyss Affairs§!"
 SRA_SD_event.20.desc:0 "\"We seek, we struggle, we are the border of civilization, we are the defense line of living beings.\"\n\nThe Department of Metabyss Affairs is an institution overseeing Metabyss control and development affairs. Based on survival needs, it can mobilize all types of resources to combat the threat of the Metabyss. You can issue relevant decisions here."
 SRA_SD_event.20.a:0 "Start exploring Metabyss"
 SRA_SD_event.20.a.tooltip:0 "Each exploration consumes §Y5 Pops§! to start. These warriors will march fearlessly into the unknown, even if the outcome may be no return.\nExploration takes several years. During this period, the exploration team will feed back results multiple times, maybe gains, maybe disasters. All this depends on exploration investment, ['concept_SRA_SD_chaos_star_habitable_vitality'], our technological level, and ultimately, the arrangement of fate.\n\nThe existence and ability of the Lost Presbyter, as well as the attitude of the Dragon of Metabyss, will have unknowable impacts on exploration."
 SRA_SD_event.20.b:0 "Start hunting Metabyss"
 SRA_SD_event.20.b.tooltip:0 "This will lead to a ground battle. Metabyss creations will confront our defense armies head-on. This can cause ['concept_SRA_SD_chaos_star_habitable_vitality'] to drop to a certain extent, provided we survive.\nThe intensity of Metabyss invasion is mainly based on current ['concept_SRA_SD_chaos_star_habitable_vitality'], and unfortunately grows with our technology. Although they won't completely catch up with our development, we can only obey fate's decision.\nHunting will create a period of safety, during which Metabyss invasion will not occur naturally.\n\n§RBe careful, we cannot afford the price of failure.§!"
 SRA_SD_event.20.c:0 "Catalyze Metabyss"
 SRA_SD_event.20.c.tooltip:0 "Perform a series of §Rhighly dangerous§! rituals to §Yincrease§! ['concept_SRA_SD_chaos_star_habitable_vitality'], which can cause ['concept_SRA_SD_chaos_star_habitable_vitality'] to §Ydouble directly§!, but will bring a series of §Rdangerous secondary effects§!. The $councilor_SRA_SD_lost_presbyter$ presiding over the ritual may §Rlose their life§!."
 SRA_SD_event.20.d:0 "Emergency Pressure Relief"
 SRA_SD_event.20.d.tooltip:0 "Perform a series of §Rhighly dangerous§! rituals to §Ydecrease§! ['concept_SRA_SD_chaos_star_habitable_vitality'], which can cause ['concept_SRA_SD_chaos_star_habitable_vitality'] to §Yhalve directly§!, but will bring a series of §Rdangerous secondary effects and cause widespread destruction§!."
 SRA_SD_event_20_d_buff:0 "Disaster Torrent"
 SRA_SD_event_20_d_buff_desc:0 "To weaken the chaos churning in the Metabyss, we bore its erosion with our homeland."



 SRA_SD_event.21.name:0 "Treading Metabyss"
 SRA_SD_event.21.desc:0 "Indeed, the Metabyss is a distortion of the world we live in, smearing all colors black, letting everything be worn away.\nBut precisely because of this, it is so rich, possessing everything and endless.\n\"Every star in the night sky is embedded in the Metabyss.\"\nEven just climbing the Lonely Mountain, one can pluck jewels of the sea of stars...\nWe tread the Metabyss, we explore the Metabyss, we draw power to fight the Metabyss from the Metabyss, we create tomorrow with yesterday."
 SRA_SD_event.21.a:0 "We press forward"
 SRA_SD_event.22.name:0 "Hunting Metabyss"
 SRA_SD_event.22.desc:0 "The Metabyss diffuses, flaunting its existence, venting its authority.\nThat red and black mist spreads up and down the Lonely Mountain, advancing ceaselessly, obliterating all traces of civilization or nature.\n\"Wind and snow smear the faces of warriors, mist swallows the names of heroes.\"\nWhether eroding living beings or dead things, the Metabyss will extend its influence and threaten our survival. Therefore, we must hunt the Metabyss, hunt disordered creations, and disorder itself."
 SRA_SD_event.22.a:0 "We are fearless"


 SRA_SD_event.23.name:0 "§RAbrupt Stop§!"
 SRA_SD_event.23.desc:0 "A chaos terminated the story; the narrator fell silent.\n\n\nOr?"
 SRA_SD_event.23.a:0 "§REnd here.§!"
 SRA_SD_event.23.b:0 "§YStill have future.§!"
 SRA_SD_event.23.b.tooltip:0 "You are unwilling to let the story break off carelessly here. Even if adding some plots not quite commendable, it should continue.\n\n\n§YClear all armies on the planet and add some weird guards.§!"

 SRA_SD_event.95.name:0 "§RWind and Snow Obscure Eyes§!"
 SRA_SD_event.95.desc:0 "[Root.GetName] saw §Rinsurmountable deep darkness§!.\n\nThe Metabyss whispered to erase all differences, melting reality into uniform chaos. [Root.GetName]'s form vanished, face blurred, speech silenced, will withered, reduced to an empty shell under Metabyss erosion, a shadow."
 SRA_SD_event.95.a:0 "§R[Root.GetName] ceases to exist.§!"
 SRA_SD_event.96.name:0 "§RShallow Sea Softly Sings§!"
 SRA_SD_event.96.desc:0 "§RYou§! are different from them.\n§RYou§! can understand every word coming from that mist, §RYou§! can feel every pulsation flickering in the Metabyss. §RIt§! never hurt §Ryou§!, §RIt§! listens to §Ryour§! wishes, §RIt§! responds to §Ryour§! requests, §RIt§! bestows special generosity on §Ryou§!."
 SRA_SD_event.96.a:0 "§RYou§! may gain something."
 SRA_SD_event.97.name:0 "§RLamp Will Extinguish§!"
 SRA_SD_event.97.desc:0 "Fate comes from the end, lowering its curtain. [Root.GetName] is exhausted and scarred. Metabyss erosion distorted [Root.GetHisHer] body, wearing away [Root.GetHisHer] will. At this moment, [Root.GetName] has not fallen yet; but then, no one knows."
 SRA_SD_event.97.a:0 "§R[Root.GetName]'s will is being tested!§!"
 SRA_SD_event.98.name:0 "§YLamp Never Extinguishes§!"
 SRA_SD_event.98.desc:0 "Although once driven to desperation by the sinister curse of the Metabyss, [Root.GetName]'s story did not end there. With determination and will, [Root.GetName] stood tall in the storm, becoming stronger."
 SRA_SD_event.98.a:0 "§Y[Root.GetName] defeated Metabyss erosion!§!"


 SRA_powerword_death:0 "Power Word: Kill"
 SRA_powerword_death_desc:0 "You force your target to succumb to death with powerful will."
 SRA_powerword_death_2:0 "Corrupting Magic"
 SRA_powerword_death_2_desc:0 "Minus your saves"
