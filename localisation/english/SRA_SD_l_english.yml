 ###遗珍
 SRA_SD_First_Murder:0 "§RBlood of First Slaughter§!"
 SRA_SD_First_Murder_desc:0 "This bloodstone was picked up by one person and stabbed into another in an era so distant it is unknowable.\nThat was the first plunder, first conquest, first murder.\nIt hunted giant beasts as large as mountains, slaughtered livestock as gentle as clouds. It was lost and unearthed again and again, becoming spearheads of countless long poles, infiltrating blood of countless living beings, dyed red, dyed black, broken and honed, until it completely lost everything it once had as a stone, turned into pure blood debt condensation, indelible.\n\nWhen forged into an arrow, the caused wound is soaked in hatred; strength flows out like blood until withering.\nWhen forged into a spear, the caused wound is soaked in killing intent; flesh turns into sharp blades breaking out of the body until drying up.\nIf the holder soaks it in tears of ecstasy and despair after slaughtering everything known, this item is immediately destroyed."
 SRA_SD_First_Murder_modifier:0 "§RThis bloodstone flickers, longing for the next slaughter.§!\n\n§YHolding this relic allows you to make a §Rchoice§!.§!"
 SRA_SD_First_Murder_effect:0 "§RBlood of First Slaughter calls for slaughter.§!\n\nAll countries §Rhostile§! to you:\nRuler §Rdies immediately§!\n$MOD_PLANET_STABILITY_ADD$: §R-100%§!\nLasts 3600.00£time£\n\n§YThis is not a wise move.§!"
 SRA_SD_First_Murder_debuff:0 "§RSlaughter Curse§!"
 SRA_SD_First_Murder_debuff_desc:0 "This country is eroded by the Blood of First Slaughter; chaos will be everywhere."

 SRA_SD_Fire_of_Lightkeeper:0 "§YFire of Fog Chaser§!"
 SRA_SD_Fire_of_Lightkeeper_desc:0 "The lantern used by \"Lightkeeper\" Norandan in the past was both his fire source and his illumination.\nLegend has it that before he ascended the Lonely Mountain, he managed lights for his tribe, dispelling night and mist.\nLater he walked to the Lonely Mountain, lifting the lantern to draw fire, dispelling shadows of the Metabyss, bringing guidance of gods to mankind.\n\nThe flame in this item never extinguishes; the emitted light can suppress Metabyss activities. Entranced people staring at this item can regain their original intention.\nIf the holder personally extinguishes the flame in a world submerged in despair, this item is immediately destroyed."
 SRA_SD_Fire_of_Lightkeeper_modifier:0 "§YThis lantern is noncommittal about today.§!"
 SRA_SD_Fire_of_Lightkeeper_effect:0 "§YFire of Fog Chaser ignites faith.§!\n\n"
 SRA_SD_Fire_of_Lightkeeper_effect_2:0 "Metabyss negative impact §Greduced§!\n\n§YThis is not a wise move.§!"
 SRA_SD_Fire_of_Lightkeeper_buff:0 "§YFire of Fog Chaser§!"
 SRA_SD_Fire_of_Lightkeeper_buff_desc:0 "The Lightkeeper used this fire to illuminate the forms of gods, and also cast shadows in the distance."

 SRA_SD_Annihilating_Growl:0 "§RAnnihilating Growl§!"
 SRA_SD_Annihilating_Growl_desc:0 "Some kind of relatively controllable reusable devastating weapon.\nAnnihilating Growl is a creation from several geological eras ago. It likely completely modified Stellariens' landforms, and even cleansed life on the entire world.\nWhen activated, it emits a modulated pulse beam, lysing substances meeting specified criteria. Most released energy will convert into similar pulses and spread around; diffusion speed is determined by the user's will.\nThe scope of \"specified criteria\" remains unknown; existing records give some cases.\n\nUsable criteria include at least:\nObject type, object main use, object main composition, linear distance from hit target, object current relative speed, presence of life in object.\n\nInvalid criteria include at least:\nObject ownership, object state of matter, object volume, connection status with hit target, object \"good or bad\", object color.\n\nThe above criteria are all based on the user's cognition.\n\nWhen the user issues a command conflicting with unknown criteria, this item immediately attempts to destroy the user. If it fails, this item is immediately destroyed.\nIt is currently known that commands not defining linear distance from the hit target will cause conflicts with criteria, but the maximum distance has not been tested."
 SRA_SD_Annihilating_Growl_modifier:0 "§RThis relic is waiting for you.§!"
 SRA_SD_Annihilating_Growl_effect:0 "§RActivate Annihilating Growl§!"


 SRA_SD_Arcane_relic:0 "§BPivot Balance Mountain Arcane Projection System§!"
 SRA_SD_Arcane_relic_desc:0 "This massive arcane structure erected on the ruins of Pivot Balance Mountain is used to provide arcane casting amplification effects for all our ships active in ['concept_SRA_SD_barren_space'].\n\nPivot Balance Mountain was once just a nameless small hill, but since Lord Tara began his great cause of conquest here, a history of strife began. The hegemony of Pivot Balance Mountain territory was destroyed by dragon fire, and layers of arcane facilities on Pivot Balance Mountain were melted into waste rock. But these traces overlapped, drawing out new power, and subsequently becoming the arcane energy focus today step by step.\nAfter ['concept_SRA_SD_The_Rips'], the Emerald Tower Society recovered this land and purified the ['concept_SRA_SD_Abyss_Erosion'] shrouded over it, introducing endless arcane energy echoing here into the resonance of crystal clusters, transmitting to every crystal unit taken from the Pivot Balance Mountain array, giving gifts to countless cruise ships isolated in ['concept_SRA_SD_barren_space']."
 SRA_SD_Arcane_relic_modifier:0 "§BProvides ['concept_SRA_SD_Arcane'] weapon modifier equal to Energy Weapon Modifier * 50% + Explosive Weapon Modifier * 50%, for this is the phenomenon of shaping.§!\n\n"
 SRA_SD_Arcane_relic_effect:0 "§BIncreases your ['concept_SRA_SD_Arcane'] weapon modifier by the value of the current modifier for 1800.00£time£. As the cost of overloading the array, your ship maintenance costs will rise year-on-year.§!"
 SRA_SD_Arcane_relic_buff_A:0 "§BArcane Overload§!"
 SRA_SD_Arcane_relic_buff_B:0 "§BArcane Overload§!"

 SRA_SD_Divine_relic:0 "§YNorandan Manuscript§!"
 SRA_SD_Divine_relic_desc:0 "This myth relic from the beginning of our era resonates with our Divine arts array to strengthen the Divine arts casting effect of all our ships active in ['concept_SRA_SD_barren_space'].\n\nThis scroll written by \"Lightkeeper\" Norandan records what he saw and heard during his travels. Legend has it that he embarked on the Myth path this way. This manuscript thus condensed the influence of gods starting from him, and could expand to serve as a symbol for all Divine arts casting.\nSome researchers believe that these texts actually record a secret in cipher that will shock the world. Those who solve it can obtain the true origin and rules of Myth power, thereby controlling and even creating gods. This is the reason why this manuscript has such powerful power. Regardless, no one has truly solved this secret as they say."
 SRA_SD_Divine_relic_modifier:0 "§YProvides ['concept_SRA_SD_Divine'] weapon modifier equal to Strike Craft Modifier * 25% + Kinetic Weapon Modifier * 50%, for this is the thing of recasting.§!\n\n"
 SRA_SD_Divine_relic_effect:0 "§YIncreases your ['concept_SRA_SD_Divine'] weapon modifier by the value of the current modifier for 1800.00£time£. As the cost of the over-limit ritual, your ship maintenance costs will rise year-on-year.§!"
 SRA_SD_Divine_relic_buff_A:0 "§YOver-limit Ritual§!"
 SRA_SD_Divine_relic_buff_B:0 "§YOver-limit Ritual§!"
