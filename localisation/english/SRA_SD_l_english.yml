 SRA_SD_event.1.name:0 "§YMoment of Sublimation§!"
 SRA_SD_event.1.desc:0 "In an instant, like a spark falling on firewood, everything [this.GetName] has experienced along the way turned into an endless source of power. [this.GetHimHer] stepped out of mortal dust, renewed, casting the glorious journey into legend, gathering Myth power in one body.\n§Y[this.GetName]§! transcended [this.GetHisHer] fate and became a §YMyth existence§!.\n\n§YHow will [this.GetHimHer] choose [this.GetHisHer] first authority?§!"
 SRA_SD_event.2.name:0 "§YAscent§!"
 SRA_SD_event.2.desc:0 "Lights grow brighter, legends shine more, [this.GetName] overcomes the Metabyss, [this.GetHisHer] Myth power advances further."
 SRA_SD_event.2.a:0 "A great moment."
 SRA_SD_event.3.name:0 "§YPromotion§!"
 SRA_SD_event.3.desc:0 "Lights grow brighter, legends shine more, [this.GetName] overcomes the Metabyss, [this.GetHisHer] Myth power advances further. [this.GetHimHer] realized [this.GetHeShe] can touch power in new fields.\n\n§YHow will [this.GetHimHer] choose [this.GetHisHer] new authority?§!"
 SRA_SD_event.4.name:0 "§YPeak Reached§!"
 SRA_SD_event.4.desc:0 "Finally, [this.GetName] walked to the last step of [this.GetHisHer] §YMyth path§!. [this.GetHisHer] might has reached perfection, [this.GetHisHer] great achievements are unparalleled in the world. Throughout the long river of history, how many people can reach such a state and see such scenery?\n\n[this.GetName] is now physically and mentally perfect, transcendent above things. [this.GetHisHer] will is tough; it can drive all things, it will shape all things; [this.GetHisHer] body is exquisite; it has become one, it will be one forever.\n\nAt this moment, [this.GetHimHer] will gaze at [this.GetHisHer] last authority. §YWhat choice will [this.GetHimHer] make?§!"



