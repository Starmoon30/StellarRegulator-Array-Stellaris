 SRA_SD_event.100.title:0 "Examine Self"
 SRA_SD_event.100.desc:0 " "
 SRA_SD_event.100.a:0 "Return to life"
 SRA_SD_event.100.b:0 "Project your existence"
 SRA_SD_event.100.b.tooltip:0 "You cast ['concept_SRA_SD_element_secret', Arts of the Moment], making your existence manifest elsewhere. In this way, you can set foot where you wish to go without worrying about sudden death.\n\nMoreover, Rocivia may not necessarily allow you to truly leave.\n\n"
 SRA_SD_event.100.b.allow:0 "§YYou must choose an element to determine the way you act.§!"
 SRA_SD_event.100.b.tooltip.a:0 "§YActing with ['concept_SRA_SD_element_forge'] for shaping, you intend to command the fleet and destroy your enemies.§!"
 SRA_SD_event.100.b.tooltip.b:0 "§YActing with ['concept_SRA_SD_element_edge'] for division, you intend to command the army and purge your territory.§!"
 SRA_SD_event.100.b.tooltip.c:0 "§YActing with ['concept_SRA_SD_element_stone'] for preservation, you intend to command the army and purge your territory.§!"
 SRA_SD_event.100.b.tooltip.d:0 "§YManifesting intellect with ['concept_SRA_SD_element_lantern'], you intend to manage the territory and display your talent.§!"
 SRA_SD_event.100.b.tooltip.e:0 "§YManifesting craving with ['concept_SRA_SD_element_chalice'], you intend to command a lone boat and explore the worlds of Barren Space.§!"
 SRA_SD_event.100.b.tooltip.f:0 "§YManifesting inducement with ['concept_SRA_SD_element_secret'], you intend to manage the territory and guide everyone to seek wisdom.§!"

 SRA_SD_event.200.title:0 "Read Others"
 SRA_SD_event.200.desc:0 "Your friends, your relatives; your mentors, your enemies.\nConverse with them to gain intellect, entrust requests to gain assistance, apply means to gain ends."
 SRA_SD_event.200.a:0 "Return to life"
 SRA_SD_event.200.b:0 "Rocivia"
 SRA_SD_event.200.b.tooltip:0 "§YSupreme Leader. She is the mentor of Irrica Lapis Lazuli, naturally becoming your mentor too. She has helped you a lot and can be called generous.§!\n"
 SRA_SD_event.200.b.tooltip.a:0 "Rocivia shaped today's Stellariens. After the Great Tear, it was she who united the shattered nations and countless refugees to stabilize the front, and launched a counterattack against the Metabyss just a few years later. She created many unprecedented systems and rules, miraculously turning the previously warring Stellariens into a unified civilization, recovering quickly from pain and stepping into prosperity."
 SRA_SD_event.200.b.tooltip.b:0 "Rocivia is skilled in statecraft. Neither the Department of Metabyss Affairs she founded nor the former nations obeying her can establish independence under her rule. Sharp blades pierce mercilessly into every pair of eyes with ulterior motives. She doesn't care about sacrifice; anyway, under the Metabyss, no one is not dying."
 SRA_SD_event.200.b.tooltip.c:0 ""
 SRA_SD_event.200.b.tooltip.d:0 ""
 SRA_SD_event.200.b.tooltip.e:0 "You have never had such strong desire, almost making you thirsty. You want to fill those ghostly blue and soul-stirring eyes, want to cover those smiling lips. You want to make her laugh, make her weep, make her call your name, touch your face. Every inch of your skin is longing for touch, every corner of her body is waiting for exploration. You want to drink her all up, taste her carefully, chew her bones and suck her marrow, devour her completely."
 SRA_SD_event.200.b.tooltip.f:0 "What exactly does Rocivia want? With the ability she showed, even before the Great Tear, she could easily rule the entire Stellariens, or at least no one questioned her rule wherever she went. However, she doesn't seem so eager for power. If viewed from a scholar's perspective, her current government work has completely squeezed out her research and exploration time. As a mage with no belonging, she could continue to visit ruins and have no fixed abode like before, instead of becoming the leader of the entire Stellariens.\nShe is too tempting, not only because of her magnificent appearance, but also because of the countless secrets she hides."
 SRA_SD_event.200.b.tooltip.g:0 "Rocivia, Director of the Department of Metabyss Affairs, Magician of the Stars. In the past, she was quite famous in the academic world and visited many ruins. Now she leads the unified Stellariens, pioneering the future of civilization on the earth shattered by the Metabyss."
 SRA_SD_event.200.c:0 "$Name_SRA_Irrica$"


