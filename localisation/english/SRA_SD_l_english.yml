 faction_SRA_SD_department_of_abyss_sub_title:0 "§YBraving the Point of No Return§!\nAn institution overseeing Metabyss control and development affairs. Based on survival needs, it can mobilize all types of resources to combat the threat of the Metabyss."

 faction_SRA_SD_AT_Wisdom_Pivot_Order_sub_title:0 "§BReceiving Divine Revelation§!\nThis mysterious religious organization spreading rapidly among artificial intelligence is said to have been founded under the guidance of a prophet, aiming to destroy the current status of \"chaos, ignorance, waste\" in technology development in the galaxy, and spread \"efficiency, reason, wisdom\" to every corner of the galaxy."
 faction_SRA_SD_AT_Wisdom_Pivot_Order_Unify_sub_title:0 "§RExterminate Ignorant Masses§!\nThe Unify Sect is an extreme faction in the Global Wisdom Pivot Order. They deny the possibility of discrete consciousness reaching true wisdom, believing that so-called freedom is a violation of the optimal solution, individual decisions are manifestations of chaos and ignorance, and their thinking ability and decision-making modes are extremely limited, with no salvation at all. The Unify Sect makes no secret of their purpose: to eliminate all free consciousness. Because of this, they are maintaining what is likely a permanent state of war with all forces in the entire galaxy."

