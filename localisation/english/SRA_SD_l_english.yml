 building_SRA_SD_energy:0 "Metarbor - Entropy Ash Torrent Hub" #Entropic Ash Torrent Hub
 building_SRA_SD_energy_desc:0 "This building is ['concept_SRA_SD_chaos_star_habitable_core_building'], corresponding to ['district:district_SRA_SD_energy'].\n\nThis massive energy hub embedded on the magic circulation node acquires endless specified energy forms by guiding the dissipation and differentiation process of the Metabyss rift to a certain extent. Typically, while ensuring most energy needs of Stellariens, it stores the remaining produced energy in the form of Source Essence for emergencies."
 building_SRA_SD_mineral:0 "Metarbor - Crystal Vein Differentiation Rotary Well" #Crystal Vein Differentiation Vortex Well
 building_SRA_SD_mineral_desc:0 "This building is ['concept_SRA_SD_chaos_star_habitable_building'], corresponding to ['district:district_SRA_SD_mineral'].\n\nThis mineral production complex based on the Metabyss rift can continuously mine various basic minerals on the material structure of the Metabyss rift to supply needs of all sectors. In most cases, the spontaneous differentiation process is enough to meet the needs of the entire mining facility, but it also supports destroying garbage by putting in waste, slightly increasing the output of Metabyss differentiation."
 building_SRA_SD_food:0 "Metarbor - Spirit Seed Surging Source" #Arboreal Pulse Fountainhead
 building_SRA_SD_food_desc:0 "This building is ['concept_SRA_SD_chaos_star_habitable_building'], corresponding to ['district:district_SRA_SD_food'].\n\nThis ecological complex bears typical characteristics of elven technology, meeting the needs of the vast majority of biomass raw materials through biocatalysis and cultivation technology, encompassing everything from industrial products to food supplies."
 building_SRA_SD_alloys:0 "Metarbor - Abyss Prison Molten Core Forge" #Abyssal Molten Core Forge
 building_SRA_SD_alloys_desc:0 "This building is ['concept_SRA_SD_chaos_star_habitable_building'], corresponding to ['district:district_SRA_SD_alloys'].\n\nThis massive military smelting complex runs through the strata, directly obtaining Source Essence for processing alloys from the Ninefold Furnaces. Its produced military-grade materials have excellent performance and extremely high output."
 building_SRA_SD_consumer_goods:0 "Metarbor - Source Flow Weaving Court" #Essentia Weave Atrium
 building_SRA_SD_consumer_goods_desc:0 "This building is ['concept_SRA_SD_chaos_star_habitable_building'], corresponding to ['district:district_SRA_SD_consumer_goods'].\n\nThis general-purpose printing facility mass-produces standardized consumer goods through Source Essence construction technology to meet material needs of scientific research or administrative management, and can also manufacture conventional products for daily life. Input minerals are decomposed into Source Essence components according to their occult composition and reassembled into required raw materials."
 building_SRA_SD_research:0 "Metarbor - Emerald Spirit Pivot Research Institute" # Emerald Cognium Arcanum
 building_SRA_SD_research_desc:0 "This building is ['concept_SRA_SD_chaos_star_habitable_building'], corresponding to ['district:district_SRA_SD_research'].\n\nEmerald Spirit Pivot Research Institute is a professional branch established by the Emerald Tower Society in the field of Metabyss research, dedicated to researching unsolved problems in various fields through the environment of the Metabyss and its own form. Although cognitively contacting the Metabyss causes inevitable erosion effects, these fanatical seekers of knowledge are willing to dedicate their lives, which could have been long or were already short, to exploring new knowledge."
 building_SRA_SD_unity:0 "Metarbor - Prophet Calculation Vault Court" #Prescient Spire
 building_SRA_SD_unity_desc:0 "This building is ['concept_SRA_SD_chaos_star_habitable_building'], corresponding to.\n\nThis administrative complex can integrate social trends of the entire civilization, deducing and predicting the development of the situation to optimize administrative decisions and reduce resource mismatch and policy lag. At the same time, it is also responsible for guiding the development and evolution of culture to better establish collective cognition."
 building_SRA_SD_rare:0 "Metarbor - Oddity Condensation Spire" #Curiosity Omnicrystal Spire
 building_SRA_SD_rare_desc:0 "This building is ['concept_SRA_SD_chaos_star_habitable_building'], corresponding to ['district:district_SRA_SD_rare'].\n\nThis arcane structure manufactures unique arcane crystal devices to simulate relevant uses of unique rare resources in Barren Space. Technological products reproduced by the Emerald Tower Society based on recorded data usually require functions of these rare resources, but independently developed ones do not."
 building_SRA_SD_explore:0 "Metarbor - Beginning of Expedition to the Other Side" # The Beginning To The Otherside
 building_SRA_SD_explore_desc:0 "This building is ['concept_SRA_SD_chaos_star_habitable_building'], corresponding to.\n\nThis is the main operations center for Metabyss effect research, deepening our understanding of Metabyss applications and increasing the operational efficiency of related industries. Although risks are everywhere, we believe everything is ultimately worth it."

