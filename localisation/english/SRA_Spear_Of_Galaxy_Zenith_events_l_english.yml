# 船尾水晶 防御系统 被动
 SRA_SOGZ_menu_sub_1_1_custom_tooltip:0 "§BLatent Time Silence§!\n\n§CDefense Array Passive§!\n§YSystem Energy Configuration Cost 0§!\n\nConfigure Crystal Projection Array, tune protection systems of fleets in star system, introduce Starlight energy into shields and armor, significantly strengthening their special performance, enhancing resistance to weakening and penetration effects.\n\nFriendly ships in star system:\n$MOD_SHIP_SHIELD_REDUCTION$: §G-100%§!\n$MOD_SHIP_ARMOR_REDUCTION$: §G-100%§!\n$MOD_SHIP_SHIELD_HARDENING_ADD$: §G+800%§!\n$MOD_SHIP_ARMOR_HARDENING_ADD$: §G+800%§!"
 SRA_SOGZ_menu_sub_1_2_custom_tooltip:0 "§BFlowing Time Endless§!\n\n§CDefense Array Passive§!\n§YSystem Energy Configuration Cost 100§!\n\nConfigure Crystal Projection Array, infiltrate Phase Energy into all parts of Spear_Of_Galaxy_Zenith hull; will no longer directly emergency jump when about to be destroyed; can choose to consume 10 points of Phase Energy to instantly repair to full state on the spot, and will not be destroyed again within 5.00£time£, or choose to temporarily enter stasis state, deciding after 30.00£time£."
 SRA_SOGZ_menu_sub_1_3_custom_tooltip:0 "§BEternal Time Flow§!\n\n§CDefense Array Passive§!\n§YSystem Energy Configuration Cost 200§!\n\nConfigure Crystal Projection Array, charge hulls of fleets in star system, making parts enter semi-energized state; nearly energized armor and hull structure can rapidly repair vast majority of damage, meanwhile shield field can also recover at high speed.\n\nFriendly ships in star system:\n$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$: §G+256000§!\n$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$: §G+256000§!\n$MOD_SHIP_HULL_REGEN_ADD_STATIC$: §G+256000§!\n\nIn addition, whenever Spear_Of_Galaxy_Zenith is about to be destroyed, it will enter stasis state for 10.00£time£ and release several teams of Celestial Garrison; Celestial Garrison will fight for 180.00£time£. Spear_Of_Galaxy_Zenith cannot activate this effect again within 5.00£time£ after leaving stasis state."
#船头:投送模块 主动
 SRA_SOGZ_menu_sub_2_1_custom_tooltip:0 "§BBanner of Universe§!\n\n§CDelivery Module Active§!\n§YSystem Energy Configuration Cost 0§!\n\nConfigure Bow Guidance Beacon, calculate routes and specify maneuver logic for fleets in the entire star system, optimizing their relevant performance. At the same time, activate jump delivery system, allowing all our ships to jump.\n\nCost: §Y25 Phase Energy§!\nCooldown: 180.00£time£\nDuration: 180.00£time£\nFriendly ships within empire:\nJump capability: §GUnlocked§!\n$MOD_SHIP_SPEED_MULT$: §G+200%§!\n$MOD_SHIP_EVASION_MULT$: §G+100%§!\n$MOD_SHIP_WINDUP_MULT$: §G-200%§!\n$MOD_SHIP_FTL_JUMPDRIVE_RANGE_MULT$: §G+800%§!\n$MOD_SHIP_JUMPDRIVE_COOLDOWN_MULT$: §G-200%§!"
 SRA_SOGZ_menu_sub_2_1_Buff:0 "§BBanner of Universe§!"
 SRA_SOGZ_menu_sub_2_2_custom_tooltip:0 "§BComet Approach§!\n\n§CDelivery Module Active§!\n§YSystem Energy Configuration Cost 100§!\n\nConfigure Bow Guidance Beacon, guide a prepared fleet to immediately reinforce Spear_Of_Galaxy_Zenith's location. Multiple fleet types exist for selection; fleet type affects resources to pay and subsequent cooldown time.\n\nCost: §Y25 Phase Energy§!\nCooldown: Variable"
 SRA_SOGZ_menu_sub_2_3_custom_tooltip:0 "§BCelestial Formation Guard§!\n\n§CDelivery Module Active§!\n§YSystem Energy Configuration Cost 200§!\n\nConfigure Bow Guidance Beacon, immediately deploy Celestial Formation Guard Fleet and fortress reserved in Spacetime Phase Engine's internal space to Spear_Of_Galaxy_Zenith's location.\n\nCost: §Y200 Phase Energy§!\nCooldown: 360.00£time£"
# 前浮翼 进攻系统 被动
 SRA_SOGZ_menu_sub_3_1_custom_tooltip:0 "§BWorld Extinction§!\n\n§CJoint Attack Passive§!\n§YSystem Energy Configuration Cost 0§!\n\nConfigure Float-Wing Offensive Matrix, amplify weapon systems of fleets in star system, strengthening their damage capability against various targets.\n\nFriendly ships in star system:\n$MOD_SHIP_SHIELD_DAMAGE_MULT$: §G+50%§!\n$MOD_SHIP_ARMOR_DAMAGE_MULT$: §G+50%§!\n$MOD_SHIP_HULL_DAMAGE_MULT$: §G+50%§!"
 SRA_SOGZ_menu_sub_3_2_custom_tooltip:0 "§BNether Sea Navigation§!\n\n§CJoint Attack Passive§!\n§YSystem Energy Configuration Cost 100§!\n\nConfigure Float-Wing Offensive Matrix, tune weapon systems of fleets in star system, making them specialized in hull structure destruction; as a cost, damage effects on shields and armor will basically disappear, need to be used with penetrating weapons.\n\nFriendly ships in star system:\n$MOD_SHIP_SHIELD_DAMAGE_MULT$: §R-200%§!\n$MOD_SHIP_ARMOR_DAMAGE_MULT$: §R-200%§!\n$MOD_SHIP_HULL_DAMAGE_MULT$: §G+400%§!"
 SRA_SOGZ_menu_sub_3_3_custom_tooltip:0 "§BDawn Triumph§!\n\n§CJoint Attack Passive§!\n§YSystem Energy Configuration Cost 200§!\n\nConfigure Float-Wing Offensive Matrix, extra Stellarcrystal energy will be introduced into Spear_Of_Galaxy_Zenith weapon system, re-coding weapon array ballistic logic, making all weapons forcibly drop dimensions the moment they hit the enemy; massive energy released during drop will bypass ship shields and armor to hit the hull directly.\n\nFriendly ships in star system:\n$MOD_SHIP_SHIELD_PENETRATION_MULT$: §G+800%§!\n$MOD_SHIP_ARMOR_PENETRATION_MULT$: §G+800%§!"
#后浮翼：打击模块 主动
 SRA_SOGZ_menu_sub_4_1_custom_tooltip:0 "§BExplosive Blossom§!\n\n§CFire Support Active§!\n§YSystem Energy Configuration Cost 0§!\n\nConfigure Strike Suppression Module, allowing Spear_Of_Galaxy_Zenith to conduct covering strikes on enemy fleets, causing massive damage to all enemies in the star system.\n\nCost: §Y50 Phase Energy§!\nCooldown: 120.00£time£\nDuration: 25.00£time£\nEnemy ships in star system:\nTake §R8000§! damage every 1.00£time£"
 SRA_SOGZ_menu_sub_4_2_custom_tooltip:0 "§BDark Sea Distant Sound§!\n\n§CFire Support Active§!\n§YSystem Energy Configuration Cost 100§!\n\nConfigure Strike Suppression Module, allowing Spear_Of_Galaxy_Zenith to conduct explosive energy suppression on the star system, weakening all enemy ships' defense structures and destroying their penetration resistance.\n\nCost: §Y50 Phase Energy§!\nCooldown: 180.00£time£\nDuration: 30.00£time£\nEnemy ships in star system:\n$MOD_SHIP_SHIELD_REDUCTION$: §R80%§!\n$MOD_SHIP_ARMOR_REDUCTION$: §R80%§!\n$MOD_SHIP_SHIELD_HARDENING_ADD$: §R-200%§!\n$MOD_SHIP_ARMOR_HARDENING_ADD$: §R-200%§!"
 SRA_SOGZ_menu_sub_4_3_custom_tooltip:0 "§BPale Star Fall§!\n\n§CFire Support Active§!\n§YSystem Energy Configuration Cost 200§!\n\nConfigure Strike Suppression Module, allowing Spear_Of_Galaxy_Zenith to place a highly compressed Phase Energy star in the center of the star system, exploding after a short delay, causing devastating blows to all hostile fleets in the entire star system.\n\nCost: §Y50 Phase Energy§!\nCooldown: 180.00£time£\nDelay: 5.00£time£\nDuration: 30.00£time£\nEnemy ships in star system:\nTake §Rimmeasurable§! damage every 1.00£time£"
#歼星框架  能量调谐系统 被动
 SRA_SOGZ_menu_sub_5_1_custom_tooltip:0 "§BStar Core Overload§!\n\n§CEnergy Tuning Passive§!\n§YSystem Energy Configuration Cost 0§!\n\nConfigure Energy Tuning System, optimize system configuration, improve efficiency and preparation speed.\n\n§BDelivery Module§! System Cooldown: §G-100%§!\n§BFire Support§! System Cooldown: §G-75%§!\n§BSpacetime Phase§! System Cooldown: §G-50%§!"
 SRA_SOGZ_menu_sub_5_2_custom_tooltip:0 "§BDoomsday Catastrophe§!\n\n§CEnergy Tuning Passive§!\n§YSystem Energy Configuration Cost 100§!\n\nConfigure Energy Tuning System, redirect weapon energy allocation, significantly improve grand armament efficiency, enhance destruction capability against single targets. At the same time, adjusted energy fluctuation circuits will double Spear_Of_Galaxy_Zenith's Phase Energy charging speed.\n\n§YPhase Energy§! Output: §G+100%§!\nSpear_Of_Galaxy_Zenith:\n§BUniversal Collapse§!: §GFive times fire rate§!"
 SRA_SOGZ_menu_sub_5_3_custom_tooltip:0 "§BFalling Legend§!\n\n§CEnergy Tuning Passive§!\n§YSystem Energy Configuration Cost 200§!\n\nConfigure Energy Tuning System, switch energy supply mode, divert all Phase Energy output to strengthening Spear_Of_Galaxy_Zenith itself, extremely significantly enhancing its attributes.\n\n§YPhase Energy§! Output: §R-100%§!\nSpear_Of_Galaxy_Zenith:\n$MOD_SHIP_SHIELD_MULT$: §G+3200%§!\n$MOD_SHIP_ARMOR_MULT$: §G+3200%§!\n$MOD_SHIP_HULL_MULT$: §G+3200%§!\n$MOD_SHIP_SHIELD_DAMAGE_MULT$: §G+200%§!\n$MOD_SHIP_ARMOR_DAMAGE_MULT$: §G+200%§!\n$MOD_SHIP_HULL_DAMAGE_MULT$: §G+200%§!\n$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$: §G+64000000§!\n$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$: §G+64000000§!\n$MOD_SHIP_HULL_REGEN_ADD_STATIC$: §G+64000000§!\n\n§YCelestial Garrison released by §BEternal Time Flow§! will enjoy this enhancement for 10.00£time£.§!"
#核心水晶 时空相位核心 主动
 SRA_SOGZ_menu_sub_6_1_custom_tooltip:0 "§BNova Termination§!\n\n§CSpacetime Phase Active§!\n§YSystem Energy Configuration Cost 0§!\n\nConfigure Spacetime Phase Engine, allow using Spear_Of_Galaxy_Zenith's powerful weapons assisted by Spacetime Phase Engine to attack target star system. When using Anti-Cluster Strike Mode, project a Phase Space Projection existing for 15 days in target star system and attack all enemies within; when using Galaxy Destruction Mode, use §B\"Nova Termination\"§! to directly destroy target star system.\n\nCost: §Y50 Phase Energy§!\nCooldown: 360.00£time£"
 SRA_SOGZ_menu_sub_6_2_custom_tooltip:0 "§BSingularity Burst§!\n\n§CSpacetime Phase Active§!\n§YSystem Energy Configuration Cost 100§!\n\n$SRA_Spear_Of_Galaxy_Zenith.2.6_2.desc$"
 SRA_SOGZ_menu_sub_6_3_custom_tooltip:0 "§BEvent Horizon§!\n\n§CSpacetime Phase Active§!\n§YSystem Energy Configuration Cost 200§!\n\nConfigure Spacetime Phase Engine, authorize Spacetime Phase Engine to draw energy reserves to complete charging, then consume massive energy to expand its range to the entire system, extremely significantly slowing down all hostile fleets' attack and movement speed, constituting an effect similar to time stop.\n\nCost: §Y100 Phase Energy§!\nCooldown: 360.00£time£\nDuration: 20.00£time£\nEnemy ships in system:\n$MOD_SHIP_DISENGAGE_CHANCE_REDUCTION$: §R1000%§!\n$MOD_SHIP_SPEED_MULT$: §R-4000%§!\n$MOD_SHIP_WEAPON_RANGE_MULT$: §R-4000%§!\n$MOD_SHIP_EVASION_MULT$: §R-4000%§!\n$MOD_SHIP_ACCURACY_MULT$: §R-4000%§!\n$MOD_SHIP_TRACKING_MULT$: §R-4000%§!\n\n§YIneffective against fleets with dynamic adjustment systems§!"


