 casus_belli_cb_SRA_SOGZ:0 "Spear_Of_Galaxy_Zenith"
 war_goal_wg_SRA_SOGZ:0 "$war_goal_wg_colossus$"
 war_goal_wg_SRA_SOGZ_desc:0 "Spear_Of_Galaxy_Zenith dominates the sea of stars, governing fate. Where the spear tip points is the empire's frontier."
 
 casus_belli_cb_SRA_stop_SOGZ:0 "$casus_belli_cb_SRA_SOGZ$"
 war_goal_wg_SRA_stop_SOGZ:0 "$war_goal_wg_end_threat$"
 war_goal_wg_SRA_stop_SOGZ_desc:0 "This civilization possessing unknown advanced technology and inconceivable warships is a threat to the entire galaxy. For the stability of the sea of stars, it must be destroyed."

 SRA_SPEAR_OF_GALAXY_ZENITH:0 "Understand How to Manipulate Spear_Of_Galaxy_Zenith"
 SRA_SPEAR_OF_GALAXY_ZENITH_DESC:0 "Although the jump procedure is ready, we know almost nothing about this super warship. Before it officially arrives and becomes a powerful aid to our fleet, we must master various performances of Spear_Of_Galaxy_Zenith and understand how to manipulate this behemoth."

 SRA_Spear_Of_Galaxy_Zenith.1:0 "Spear_Of_Galaxy_Zenith"
 SRA_Spear_Of_Galaxy_Zenith.1.desc:0 "Spear_Of_Galaxy_Zenith has arrived above your capital and belongs to your command. This is an incomparably powerful weapon, far exceeding any conventional ship."
 SRA_Spear_Of_Galaxy_Zenith.1.a:0 "Very good."
 SRA_Spear_Of_Galaxy_Zenith.2:0 "Spear_Of_Galaxy_Zenith"
 SRA_Spear_Of_Galaxy_Zenith.2.desc:0 "§B\"Spear_Of_Galaxy_Zenith Control System Activated\"§!\nYou can configure various functions of Spear_Of_Galaxy_Zenith and invoke its various systems here. If Spear_Of_Galaxy_Zenith is destroyed and emergency jumps to escape, you can redeploy it here."
 SRA_Spear_Of_Galaxy_Zenith.2.a:0 "Open Configuration Panel"
 SRA_Spear_Of_Galaxy_Zenith.2.2_1:0 "Activate Banner of Universe"
 SRA_Spear_Of_Galaxy_Zenith.2.2_1.desc:0 "Configure Bow Guidance Beacon, calculate routes and specify maneuver logic for fleets in the entire star system, optimizing their relevant performance. At the same time, activate jump delivery system, allowing all our ships to jump.\n\nCost: §Y25 Phase Energy§!\nCooldown: 180.00£time£\nDuration: 180.00£time£\nFriendly ships within empire:\nJump capability: §GUnlocked§!\n$MOD_SHIP_SPEED_MULT$: §G+200%§!\n$MOD_SHIP_EVASION_MULT$: §G+100%§!\n$MOD_SHIP_WINDUP_MULT$: §G-200%§!\n$MOD_SHIP_FTL_JUMPDRIVE_RANGE_MULT$: §G+800%§!\n$MOD_SHIP_JUMPDRIVE_COOLDOWN_MULT$: §G-200%§!"
 SRA_Spear_Of_Galaxy_Zenith.2.2_2:0 "Activate Comet Approach"
 SRA_Spear_Of_Galaxy_Zenith.2.2_2.desc:0 "Configure Bow Guidance Beacon, guide a prepared fleet to immediately reinforce Spear_Of_Galaxy_Zenith's location. Multiple fleet types exist for selection; fleet type affects resources to pay and subsequent cooldown time.\n\nCost: §Y25 Phase Energy§!\nCooldown: Variable"
 SRA_Spear_Of_Galaxy_Zenith.2.2_3:0 "Activate Celestial Formation Guard"
 SRA_Spear_Of_Galaxy_Zenith.2.2_3.desc:0 "Configure Bow Guidance Beacon, immediately deploy Celestial Formation Guard Fleet and fortress reserved in Spacetime Phase Engine's internal space to Spear_Of_Galaxy_Zenith's location. Next batch of fleets needs 360.00£time£ to prepare again.\n\nCost: §Y200 Phase Energy§!\nCooldown: 360.00£time£"
 SRA_Spear_Of_Galaxy_Zenith.2.4_1:0 "Activate Explosive Blossom"
 SRA_Spear_Of_Galaxy_Zenith.2.4_1.desc:0 "Configure Strike Suppression Module, making Spear_Of_Galaxy_Zenith conduct covering strikes on enemy fleets, causing massive damage to all enemies in the star system.\n\nCost: §Y50 Phase Energy§!\nCooldown: 30.00£time£\nDuration: 10.00£time£\nEnemy ships in star system:\nTake §R5000§! damage every 1.00£time£"
 SRA_Spear_Of_Galaxy_Zenith.2.4_2:0 "Activate Dark Sea Distant Sound"
 SRA_Spear_Of_Galaxy_Zenith.2.4_2.desc:0 "Configure Strike Suppression Module, making Spear_Of_Galaxy_Zenith conduct explosive energy suppression on the star system, weakening all enemy ships' defense structures and destroying their penetration resistance.\n\nCost: §Y50 Phase Energy§!\nCooldown: 180.00£time£\nDuration: 30.00£time£\nEnemy ships in star system:\n$MOD_SHIP_SHIELD_REDUCTION$: §R80%§!\n$MOD_SHIP_ARMOR_REDUCTION$: §R80%§!\n$MOD_SHIP_SHIELD_HARDENING_ADD$: §R-200%§!\n$MOD_SHIP_ARMOR_HARDENING_ADD$: §R-200%§!"
 SRA_Spear_Of_Galaxy_Zenith.2.4_3:0 "Activate Pale Star Fall"
 SRA_Spear_Of_Galaxy_Zenith.2.4_3.desc:0 "Configure Strike Suppression Module, making Spear_Of_Galaxy_Zenith place a highly compressed Phase Energy star in the center of the star system, exploding after a short delay, causing devastating blows to all hostile fleets in the entire star system.\n\nCost: §Y50 Phase Energy§!\nCooldown: 180.00£time£\nDelay: 5.00£time£\nDuration: 30.00£time£\nEnemy ships in star system:\nTake §Rimmeasurable§! damage every 1.00£time£"
 SRA_Spear_Of_Galaxy_Zenith.2.6_1:0 "Activate Nova Termination"
 SRA_Spear_Of_Galaxy_Zenith.2.6_1.desc:0 "Configure Spacetime Phase Engine, use Spear_Of_Galaxy_Zenith's powerful weapons assisted by Spacetime Phase Engine to attack target star system. When using Anti-Cluster Strike Mode, project a Phase Space Projection existing for 15 days in target star system and attack all enemies within; when using Galaxy Destruction Mode, use §B\"Nova Termination\"§! to directly destroy target star system.\n\nCost: §Y50 Phase Energy§!\nCooldown: 360.00£time£"
 SRA_Spear_Of_Galaxy_Zenith.2.6_2:0 "Activate Singularity Burst"
 SRA_Spear_Of_Galaxy_Zenith.2.6_2.desc:0 "Configure Spacetime Phase Engine, redirect Spacetime Phase Engine energy output, activate most energy reserves, charge ['concept_SRA_Stellarcrystal_Fractal'] to enter semi-energized state, extremely significantly enhancing weapon output density, and enabling nearly energized hull to rapidly repair almost any type of damage.\n\nCost: §Y100 Phase Energy§!\nCooldown: 360.00£time£\nDuration: 60.00£time£\nSpear_Of_Galaxy_Zenith:\n§YCannot be destroyed§!\n§BUniversal Collapse§!: §GFour times fire rate§!\n$MOD_SHIP_SHIELD_DAMAGE_MULT$: §G+200%§!\n$MOD_SHIP_ARMOR_DAMAGE_MULT$: §G+200%§!\n$MOD_SHIP_HULL_DAMAGE_MULT$: §G+200%§!\n$MOD_SHIP_SHIELD_PENETRATION_MULT$: §G+2000%§!\n$MOD_SHIP_ARMOR_PENETRATION_MULT$: §G+2000%§!\n$MOD_SHIP_DAMAGE_REDUCTION_MULT$: §G+200%§!\n$MOD_SHIP_TARGET_WEIGHT_MULT$: §Y+800%§!"
 SRA_Spear_Of_Galaxy_Zenith.2.6_3:0 "Activate Event Horizon"
 SRA_Spear_Of_Galaxy_Zenith.2.6_3.desc:0 "Configure Spacetime Phase Engine, make Spacetime Phase Engine draw energy reserves to complete charging, then consume massive energy to expand its range to the entire system, extremely significantly slowing down all hostile fleets' attack and movement speed, constituting an effect similar to time stop.\n\nCost: §Y100 Phase Energy§!\nCooldown: 360.00£time£\nDuration: 20.00£time£\nEnemy ships in system:\n$MOD_SHIP_DISENGAGE_CHANCE_REDUCTION$: §R1000%§!\n$MOD_SHIP_SPEED_MULT$: §R-4000%§!\n$MOD_SHIP_WEAPON_RANGE_MULT$: §R-4000%§!\n$MOD_SHIP_EVASION_MULT$: §R-4000%§!\n$MOD_SHIP_ACCURACY_MULT$: §R-4000%§!\n$MOD_SHIP_TRACKING_MULT$: §R-4000%§!\n\n§YIneffective against fleets with dynamic adjustment systems§!"

 SRA_Spear_Of_Galaxy_Zenith.2.e:0 "Redeploy Spear_Of_Galaxy_Zenith"
 SRA_Spear_Of_Galaxy_Zenith.2.e.desc:0 "Repair severely damaged Spear_Of_Galaxy_Zenith and redeploy it to your capital."


 SRA_Spear_Of_Galaxy_Zenith.10:0 "Secondary Control Panel"
 SRA_Spear_Of_Galaxy_Zenith.10.desc:0 "§B\"Spear_Of_Galaxy_Zenith Secondary Control Panel Ready\"§!\nYou can configure various functions of Spear_Of_Galaxy_Zenith here."
 SRA_Spear_Of_Galaxy_Zenith.10.a:0 "Activate Boost Overclock"
 SRA_Spear_Of_Galaxy_Zenith.10.a.desc:0 "After activation, resource consumption of all systems increases to four times, Fleet Jump System and Interstellar Strike System cooldowns are extremely significantly shortened, Singularity Burst Mode cooldown shortened to half.\n§YAlloys required for Fleet Jump System to jump fleets will not increase.§!\n§YTime Freeze System is not affected.§!"
 SRA_Spear_Of_Galaxy_Zenith.10.b:0 "Deactivate Boost Overclock"
 SRA_Spear_Of_Galaxy_Zenith.10.b.desc:0 "Boost Overclock activated, click to deactivate."
 SRA_Spear_Of_Galaxy_Zenith.10.c:0 "Activate Immortality Protocol"
 SRA_Spear_Of_Galaxy_Zenith.10.c.desc:0 "Will no longer directly emergency jump when about to be destroyed; can choose to consume 160000 Energy, 320000 Alloys, 64000 Astral Threads to instantly repair to full state on the spot."
 SRA_Spear_Of_Galaxy_Zenith.10.d:0 "Deactivate Immortality Protocol"
 SRA_Spear_Of_Galaxy_Zenith.10.d.desc:0 "Immortality Protocol activated, click to deactivate."
 SRA_Spear_Of_Galaxy_Zenith.10.e:0 "§B\"Nova Termination\"§! switch to Purge Mode"
 SRA_Spear_Of_Galaxy_Zenith.10.e.desc:0 "Adjust energy output level of Star-Killer Plane-Tearing Weapon §B\"Nova Termination\"§!, converting weapon to Purge Mode that sweeps all intelligent life on the planet."
 SRA_Spear_Of_Galaxy_Zenith.10.f:0 "§B\"Nova Termination\"§! switch to Destruction Mode"
 SRA_Spear_Of_Galaxy_Zenith.10.f.desc:0 "Adjust energy output level of Star-Killer Plane-Tearing Weapon §B\"Nova Termination\"§!, converting weapon to Destruction Mode that directly destroys the planet."
 SRA_Spear_Of_Galaxy_Zenith.10.g:0 "Switch Weapon System to Adjustable Mode"
 SRA_Spear_Of_Galaxy_Zenith.10.g.desc:0 "Switch weapon configuration to Adjustable Mode (i.e., using weapons with §B\"SRA Weapon\"§! tag)."
 SRA_Spear_Of_Galaxy_Zenith.10.h:0 "Switch Weapon System back to Conventional Mode"
 SRA_Spear_Of_Galaxy_Zenith.10.h.desc:0 "Switch weapon configuration back to Conventional Mode."


 SRA_Spear_Of_Galaxy_Zenith.20:0 "Fleet Jump System"
 SRA_Spear_Of_Galaxy_Zenith.20.desc:0 "§B\"Spear_Of_Galaxy_Zenith Fleet Jump System Ready\"§!\nYou can select the fleet type you want to deploy here."
 SRA_Spear_Of_Galaxy_Zenith.20.a:0 "Jump Annihilation Execution Fleet"
 SRA_Spear_Of_Galaxy_Zenith.20.a.desc:0 "Immediately jump an Annihilation Execution Fleet to Spear_Of_Galaxy_Zenith's location, containing 2 SRA Adjudicator Units and 46 SRA Executor Units; afterwards, Fleet Jump System enters 240 days cooldown. §YSpecific design depends on designs in your ship designer; please ensure you possess at least one design.§!"
 SRA_Spear_Of_Galaxy_Zenith.20.b:0 "Jump Battleship Fleet"
 SRA_Spear_Of_Galaxy_Zenith.20.b.desc:0 "Immediately jump a Battleship Fleet to Spear_Of_Galaxy_Zenith's location, containing 2 Titans and 32 Battleships; afterwards, Fleet Jump System enters 240 days cooldown. §YSpecific design depends on designs in your ship designer; please ensure you possess at least one design.§!"
 SRA_Spear_Of_Galaxy_Zenith.20.c:0 "Jump Adjudicator Fleet"
 SRA_Spear_Of_Galaxy_Zenith.20.c.desc:0 "Immediately jump an Adjudicator Fleet to Spear_Of_Galaxy_Zenith's location, containing 2 SRA Adjudicator Units, 16 SRA Executor Units, and 32 SRA Pathfinder Units; afterwards, Fleet Jump System enters 240 days cooldown."


 SRA_Spear_Of_Galaxy_Zenith.32:0 "Spear_Of_Galaxy_Zenith - Immortality Protocol"
 SRA_Spear_Of_Galaxy_Zenith.32.desc:0 "§B\"Immortality Protocol Activation Detected\"§!\nCurrent Spear_Of_Galaxy_Zenith is severely damaged. You can start Immortality Protocol to instantly fully repair Spear_Of_Galaxy_Zenith's damage, or enable Stasis System to isolate Spear_Of_Galaxy_Zenith, waiting 30 days before choosing."
 SRA_Spear_Of_Galaxy_Zenith.32.a:0 "Start Immortality Protocol"
 SRA_Spear_Of_Galaxy_Zenith.32.b:0 "Start Stasis System"
 SRA_Spear_Of_Galaxy_Zenith.32.c:0 "Start Emergency Jump"


 SRA_Spear_Of_Galaxy_Zenith.40:0 "Interstellar Strike System"
 SRA_Spear_Of_Galaxy_Zenith.40.desc:0 "§B\"Spear_Of_Galaxy_Zenith Interstellar Strike System Ready\"§!\nYou can choose how to aim at the target star system here."
 SRA_Spear_Of_Galaxy_Zenith.40.a:0 "Beacon Lock Mode"
 SRA_Spear_Of_Galaxy_Zenith.40.a.desc:0 "An Interstellar Strike Beacon will appear beside Spear_Of_Galaxy_Zenith; jump it to the target star system to locate."
 SRA_Spear_Of_Galaxy_Zenith.40.b:0 "Star System Selector Mode"
 SRA_Spear_Of_Galaxy_Zenith.40.b.desc:0 "Open star system selector interface; can aim at up to five targets."
 SRA_Spear_Of_Galaxy_Zenith.40.c:0 "Target Selector Mode"
 SRA_Spear_Of_Galaxy_Zenith.40.c.desc:0 "After selector opens, select target with mouse in target star system, then click button to lock this target, then enter next step to confirm target and choose attack mode."


 SRA_Spear_Of_Galaxy_Zenith.43:0 "Nova Termination - Target Lock"
 SRA_Spear_Of_Galaxy_Zenith.43.desc:0 "§B\"Spear_Of_Galaxy_Zenith Interstellar Strike System Target Locked\"§!\nYou can choose how to attack the target star system here.\n§RWarning: Destroying certain star systems containing special events or crisis spawn points, destroying fleets with special mechanisms or kill events, may all cause event chain interruptions, inability to end crisis, and other serious problems. Please use this powerful weapon properly to avoid causing galaxy-level logic errors.§!"
 SRA_Spear_Of_Galaxy_Zenith.43.a:0 "Galaxy Destruction Mode"
 SRA_Spear_Of_Galaxy_Zenith.43.a.desc:0 "Use §B\"Nova Termination\"§! to directly destroy the target star system; afterwards, Interstellar Strike System enters 180 days cooldown."
 SRA_Spear_Of_Galaxy_Zenith.43.b:0 "Fleet Purge Mode§!"
 SRA_Spear_Of_Galaxy_Zenith.43.b.desc:0 "Use Anti-Cluster Strike Mode, project a Phase Space Projection existing for 15 days in the target star system and attack all enemies within; afterwards, Interstellar Strike System enters 90 days cooldown."
 SRA_Spear_Of_Galaxy_Zenith.43.c:0 "Cancel Command"


 SRA_Spear_Of_Galaxy_Zenith.50:0 "Nova Termination - Target Selection"
 SRA_Spear_Of_Galaxy_Zenith.50.desc:0 "§B\"Spear_Of_Galaxy_Zenith Interstellar Strike System Selecting Target\"§!\nYou can select the target to attack here.\n§KSelect the target with the mouse within the target star system, keep it selected and click the lock button on this panel to lock this target, then click the confirm target button and select attack mode.§!"
 SRA_Spear_Of_Galaxy_Zenith.50.a:0 "Confirm Target"
 SRA_Spear_Of_Galaxy_Zenith.50.a.desc:0 "Click to lock \"§H[SRA_mini_menu_choose_button_target.GetName]§!\" as target."
 SRA_mini_menu_choose_button_lost_target:0 "Target does not exist"
 SRA_mini_menu_choose_button_duplicate_target:0 "Cannot select duplicate target"

 SRA_Spear_Of_Galaxy_Zenith.51:0 "Nova Termination - Target Lock"
 SRA_Spear_Of_Galaxy_Zenith.51.desc:0 "§B\"Spear_Of_Galaxy_Zenith Interstellar Strike System Target Locked\"§!\nCurrent Target\n\"§H[SRA_mini_menu_choose_button_target.GetName]§!\"\nYou can choose how to attack the target here.\n§RWarning: Destroying certain star systems containing special events, or destroying fleets with special mechanisms, may all cause event chain interruptions, inability to end crisis, and other serious problems. Please use this powerful weapon properly to avoid causing galaxy-level logic errors.§!"
 SRA_Spear_Of_Galaxy_Zenith.51.a:0 "Galaxy Destruction Mode"
 SRA_Spear_Of_Galaxy_Zenith.51.a.desc:0 "Use §B\"Nova Termination\"§! to directly destroy the target star system; afterwards, Interstellar Strike System enters 360 days cooldown."
 SRA_Spear_Of_Galaxy_Zenith.51.b:0 "Fleet Purge Mode"
 SRA_Spear_Of_Galaxy_Zenith.51.b.desc:0 "Use Anti-Cluster Strike Mode, project a Phase Space Projection existing for 15 days at the target location and attack all enemies within target star system; afterwards, Interstellar Strike System enters 360 days cooldown."
 SRA_Spear_Of_Galaxy_Zenith.51.c:0 "Select Next Target"
 SRA_Spear_Of_Galaxy_Zenith.51.c.desc:0 "This will save the current target marker and revert to the selector interface."
 SRA_Spear_Of_Galaxy_Zenith.51.d:0 "Cancel Command"
 SRA_Spear_Of_Galaxy_Zenith.51.d.desc:0 "This will remove all target markers."


