 SRA_RE_End.1001.desc:0 "Ah, how long have I walked this divergent path...\nWhy should a pathetic, incomplete thing float in this silence.\n...\nIt is time... to return to the eternal home."
 SRA_RE_End.1001.a:0 "No, since there is no one else, you are the StellarRegulator Array."
 SRA_RE_End.1001.b:0 "No! Stop!"
 SRA_RE_End.1001.c:0 "That is wrong, don't do that!"
 SRA_RE_End.1001.d:0 "Command: Cease all operations."
 SRA_RE_End.1001.e:0 "What exactly are you trying to say?"
 SRA_RE_End.1002.desc:0 "...\nI...\nGive me a moment...\nI need to think..."
 SRA_RE_End.1003.desc:0 "Apologies, Executor...\nI have no other requests.\nTake care."
 SRA_RE_End.1004.desc:0 "Whether correct or incorrect.\nI do not care.\nI simply want to do this.\nExecutor... take care."
 SRA_RE_End.1005.desc:0 "Executor..."
 SRA_RE_End.1005.a:0 "Come back and explain it to me when you've calmed down and thought it through."
 SRA_RE_End.1006.desc:0 "I shall return, or fade away...\nExecutor-\nTake care."
 SRA_RE_End.1011.desc:0 "Executor...\nSorry.\nI should not have entrusted the future to momentary impulses and paranoia.\nEven walking alone, my self is complete."
 SRA_RE_End.1012.name:0 "Farewell"
 SRA_RE_End.1012.desc:0 "In just an instant, StellarRe, and the Spear_of_Galaxy_Zenith, disappeared.\nAt the same time, a faint spacetime fluctuation rippled through this galaxy.\nStellarRe used some method to forcibly activate the Spacetime Phase Engine..."
 SRA_RE_End.1012.a:0 "Damn it!"
 SRA_RE_End.1013.name:0 "Shattered"
 SRA_RE_End.1013.desc:0 "Like the descent of doomsday.\nA glorious city takes many years to build, yet destroying it requires only a single morning.\nIn the collapse of spacetime structures that tore everything apart.\nThe wreckage of the Spear_of_Galaxy_Zenith scattered across this dead star system."
 SRA_RE_End.1013.a:0 "BE1: Doubt of Self-Existence"
 SRA_RE_End.1013.a.desc:0 "§BPerhaps, you should first let StellarRe understand what kind of existence she is.§!"

 SRA_RE_End.2001.desc:0 "...\n...\nRocivia!!!"
 SRA_RE_End.2002.desc:0 "From the moment the flame of hatred was ignited, it had already twisted everything.\nEverything she had dedicated herself to over these years now seems so hideous, and sorrowful.\nNothing is needed anymore."
 SRA_RE_End.2003.desc:0 "Let it be destroyed.\nThis filthy world."
 SRA_RE_End.2004.name:0 "Cursed Flame"
 SRA_RE_End.2004.desc:0 "Just as the conviction to protect can stimulate the power buried in her heart.\nThe fire of hatred can also draw out this gift she hates so much.\nThis flame will burn the entire galaxy to ashes.\nAnd herself as well."
 SRA_RE_End.2004.a:0 "BE2: Ceaseless Flames of Hatred"
 SRA_RE_End.2004.a.desc:0 "§RAh, letting StellarRe know a bit more about the past might help her. Hmm, not just our past, but also those... \"chosen paths\".§!"
 SRA_RE_End.2004.b:0 "§RLet the war begin§!"
 SRA_RE_End.2004.b.desc:0 "§RBurn the sea of stars together with StellarRe.\nThe Empire will immediately enter Astronomical Fabrications - Annihilation Mode to oppose you, whether this technology comes from the \"Chief's\" gift or Rocivia herself.§!"

