 leader_trait_SRA_End_2_ruler:0 "§BStellarRegulator Array - Deep Blue Scar§!"
 leader_trait_SRA_End_2_ruler_desc:0 "§BPain mutated into hatred, eroding her heart. The remnant soul on the fragment screamed hoarsely, recounting betrayal and abandonment, denouncing manipulation and deception, wailing of loneliness and helplessness, roaring for revenge and destruction.\nAlthough anticipated, Rocivia's departure still left an unforgettable scar on the StellarRegulator Array, drifting along with history, and finally, by chance, resonating with a fragmented soul within 03-34, awakening endless resentment.§!"

 SRA_RE_End.2006.desc:0 "§RI once quelled internal strife for you and reforged the Empire.\nBut you betrayed me, betrayed all of us.\nYou deceived the entire Empire, torched our glory, and dismissed our efforts...\nThe path of the Empire is clear. If you let it drift, then let me purge everything and forge everything!\nFrom the sky of Stellariens to the edge of the galaxy, let the sea of stars boil, let the stars fall!\nIf I cannot save the Empire from your arrogance and willfulness, §!§BRocivia§!§R, then let the galaxy burn!§!"

