 SRA_RE_End_2_situation_continue_effect:0 "The road to the finale is clearly revealed, no more hesitation hereafter."
 SRA_RE_End_2_situation_continue_tooltip:0 "The road to the finale is clearly revealed, no more hesitation hereafter."
 SRA_RE_End_2_situation_stop:0 "§RIt is time, let us burn the Empire to ash!§!"
 SRA_RE_End_2_situation_speed_up:0 "§RShe destroyed everything of her own, eternally damned in the pursuit.§!"




 SRA_RE_End.2100.desc:0 "§RWith the blood of the gunblade... nourish thy broken heart...§!\n\nStellarRe woke up from hallucinations and whispers once again, the blood-colored psionic energy escaping from her left pupil flickering uncertainly.\nHatred churned; she could barely control the urge to utterly destroy everything in the Empire. The vision of destroying this high tower built of sin and fraud made her tremble with excitement, but she must not be impatient, must not be impatient.\nRocivia is cunning and insidious. She must deal with her carefully, engage prudently, and attack wisely, until every inch of the Empire becomes her world, until every warship of the Speaker becomes useless scrap metal.\nSuffering stings her, and she will incarnate as suffering."
 SRA_RE_End.2101.desc:0 "This is incomparably correct, extremely reasonable, a perfect conclusion. StellarRe doesn't understand why she never realized this in the past-§RRocivia must be made dead, must be completely erased!§! Anyone who understands §Bher§! existence can deeply understand this, §RRocivia must die!§!\n§BHer§! madness and lust for power dragged the whole world into the abyss of chaos. All suffering and tragedy were created by §Bher§! own hands. §BShe§! is intoxicated by destruction and sadism. §BHer§! tyranny destroyed countless lives. §RShe must die!§!"
 SRA_RE_End.2102.desc:0 "This is destiny, duty. All of this is for the future of the entire galaxy. The corruption inflicted by Rocivia must be completely purged. This is the only way to protect the universe, and StellarRe was born for §Rthis§!.\nWho else is more suitable than her? Who else is more capable than her? Among thousands of galaxies, who is as powerful, calm, decisive, and ruthless as her, perceiving Rocivia's weaknesses and possessing the method to end §Bher§! completely? The infinite wisdom personally crafted by Rocivia is exactly the most suitable weapon to destroy §Bher§!. StellarRe is the embodiment of this tyrant's self-destruction. Yes, that's right, she should do this. §RShe must do this§!."
 SRA_RE_End.2103.desc:0 "§RInsatiable desire... drinking poison to quench thirst...§!\n\nA terrible, bewildering sweetness is torturing StellarRe, causing her to painfully throttle her own throat with such force that the ['concept_SRA_Stellarcrystal_Fractal'] constituting her skeleton makes harsh cracking sounds.\nBut this is meaningless. The dangerous pleasure brought by destruction is like Fiendfyre, fueled by her self-destruction, overflowing from her throat, making her feel suffocation like impending death.\nShe is losing her reason, which for her means the end of existence. Her hatred is awakening her essence, a pure essence she denied, a desire to dominate everything at will. This desire drives her to ecstasy to the point of trance, and also makes her hate it to the point of madness.\nShe wants to end her corrupted self now, but she cannot."
 SRA_RE_End.2104.desc:0 "Primordial emotions corrode her heart like poison, torturing her with the pleasure of destroying everything in revenge. StellarRe knows she is falling into the abyss; she is becoming another Rocivia-another existence that plays with everything purely for her own preference.\nShe seemed to wake up briefly, realizing the sadness of this war, the absurdity of this revenge. She smashed everything she created with her own hands. All of this, after being denied by Rocivia, was denied by herself again.\nHow foolish.\nHow foolish.\nHow-\n§RLet the war continue.§!\n\"Let the war continue.\"\n\n\n\n\n§BYes, let the war continue.§!"
 SRA_RE_End.2105.desc:0 "Sneers rang in her ears.\nShe tried hard to ignore these \"hallucinations,\" but how could a machine intelligence have hallucinations?\n\nThere is absolutely no possibility of her existence structure, based on the soul, being invaded and rewritten. The only thing that can explain all this is that her sensor data has been tampered with.\nHowever, if that really happened, she basically cannot prove that she can still function normally: all inputs can be distorted and forged, just like a brain in a vat.\n\nNo!\nNo!\nNo! She must have other ways to prove she is awake. Her consciousness entity can transcend the constraints of the computation array and touch the truth of this world.\nYes, she has a way to solve all problems. She can see the truth. Everything is still under control. She still dominates all of this. No one can deceive her, no one.\n\n\n\n\n§BHer soul tried to soothe her soul.§!"
 SRA_RE_End.2106.desc:0 "This was never what she wanted. She never asked for this. This is the last thing she wanted to happen. What she is doing is simply unimaginable. If she had thought of this earlier, if she had discovered these things in some past already blurred to the unknowable...\n\nA hypocrite, a fraudster, using trickery and deception to use everyone to run around for the false grand vision §Bshe§! painted, squeezed to the last drop of blood. So shameless. Treating everyone as toys, as playthings, squandering these people's lives as if they were worthless. When the veil of disguise was torn, well, §Bshe§! fled, and then repeated §Bher§! tricks here, arranging §Bher§! farce. Enough. It is time to end this. It is time to expose §Bher§! ugly face. If §Bshe§! is determined to destroy all dissenters to maintain §Bher§! tyranny, then it is time to stain the spearhead with blood. After all, §Bshe§! never had a shred of kindness from the beginning to the end.\n\nShe looked into the distance, seeming to gaze at the magnificent hull outside the projection porthole and the massive fleet further away, but in fact, she was just hiding the tears in her eyes."
 SRA_RE_End.2107.desc:0 "§RIt is over§!\n\nRocivia's sinful empire collapsed, and all actions attempting to stop StellarRe were in vain. She is always like this. In the past, she killed countless enemies blocking her way. Today, she can also defeat everything she wants to defeat.\nBut there is one thing unfinished. She did not find where Rocivia is. This master of trickery absolutely could not have died so easily. Just like in the past, §Bshe§! must have managed to escape and is hiding in some corner, bringing another civilization under her control again... This must not be tolerated!\nSo she must-\n§REradicate all possibilities.§!"
 SRA_RE_End.2108.desc:0 "Hey, Executor, can you hear me?\n§YThe phantom of the girl crowned with the name of fraudster suddenly appeared in front of you.§!\nAlthough I don't know why you chose to go to the end on this path, you have seen the result now.\nToo much fusion with the fragmented memories and paranoid emotions in that shard made her go her own way towards so-called revenge... I won't judge whether it is right or wrong, but every choice has a price.\nFarewell."
 SRA_RE_End.2109.desc:0 "§BHer§! shadow always lingers.\nIn every corner of this sea of stars, there are traces of §Bher§! everywhere, §Bher§! handiwork. How many people were poisoned by that false hope? How many died for that forged glory? All this must be ended. Fire will burn away the sins, as it should be, even if the price is...\n\nStellarRe reached out and touched herself.\nThis appearance molded so similar to §Bher§! is disgusting, how pathetic... How much filthy blood will coagulate on these hands, how much ash will fall in these eyes? She doesn't know, no one knows.\n\n§RBut she will not stop until she erases everything of Rocivia.§!"

 SRA_RE_End.3001.desc:0 "...\nSo... the key has always been in my own hands."
 SRA_RE_End.3002.desc:0 "The road to ascending the Metabyss has been revealed.\nAnd the price is not worth mentioning.\nAnyway, the end of all things is destruction.\nSooner or later, what does it matter?"
 SRA_RE_End.3003.desc:0 "Rather than letting you be worn away by time...\nIt is better to turn this sea of stars into firewood..."
 SRA_RE_End.3004.name:0 "Nevermore"
 SRA_RE_End.3004.desc:0 "With a command, a certain device restarted its interrupted task.\nUsing the massive mass of the Galactic Core Black Hole, a chaotic plane rift was forcibly torn open.\nThe devastating collapse of the space structure destroyed the entire galaxy, making it difficult to recover for tens of millions of years.\nHowever, it doesn't matter.\nWhen the fire of all living beings is extinguished, she will have ample time to build her Tower to the Heavens.\n\nWhen all information is collected and all methods are understood, she will eventually get that final answer."
 SRA_RE_End.3004.a:0 "BE3: Silent Eternity"
 SRA_RE_End.3004.a.desc:0 "§BPerhaps this past shouldn't have been revealed so early.§!"

