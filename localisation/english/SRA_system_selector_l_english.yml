 SRA_system_selector.1.title:0 "§HSystem Selector§!"
 SRA_system_selector.1.desc:0 "This is a very, very long description."
 SRA_system_selector.1.response:0 "Filter conditions modified."
 SRA_system_selector.1.beta_psionic_station.desc:0 ""

 SRA_system_selector.1.SRA_T4_weapon_planet_killer.desc:0 "To use §B\"Nova Termination\"§! to remotely attack targets located in other star systems, we need to set the coordinates of the target system in the Interstellar Strike System of the Spear_of_Galaxy_Zenith.\n\nUsing the System Selector allows us to roughly determine candidate targets by providing the characteristics of the target star system to the Interstellar Strike System of the Spear_of_Galaxy_Zenith, and then find the target star system we truly need to attack from these candidates.\n\nUse the buttons on the right to select some characteristics of the target star system. Moving the mouse over some buttons can display relevant descriptions."

