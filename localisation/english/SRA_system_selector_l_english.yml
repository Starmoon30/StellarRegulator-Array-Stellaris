 SRA_system_selector.1.eta_hallucination_target.desc:0 ""
 SRA_system_selector.1.sci_constructor_intel_target.desc:0 ""

 SRA_system_selector.2.desc:0 "This is a very, very long description."
 SRA_system_selector.2.response:0 "Star system selection status modified."
 SRA_system_selector.2.beta_psionic_station.desc:0 ""

 SRA_system_selector.2.SRA_T4_weapon_planet_killer.desc:0 "The Interstellar Strike System of the Spear_of_Galaxy_Zenith has locked onto candidate targets. We need to select the target star system we truly need to attack from them.\n\nSince we cannot let the tuning system of §B\"Nova Termination\"§! guide more energy in a short time, the number of targets we can attack at one time is limited. Currently, we can attack at most §Y5§! targets simultaneously.\n\n§YThe attack is expected to arrive in ten days.§!"

