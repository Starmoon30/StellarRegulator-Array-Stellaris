 NAME_SRA_Chief_colony_3_system:0 "Brilliant Lighthouse"
 NAME_SRA_Chief_colony_3_system_1:0 "Gallery of Meditation"

 starbase_SRA_1:0 "Starlight Sentry Tower"
 starbase_SRA_1_core:0 "Starlight Sentry Tower"

 SRA_Chief_species:0 "Starlight Machine"

 faction_SRA_Chief_sub_title:0 "§YCrimson Dark Star§!\nA mysterious intelligent entity controlling a vast machine empire, wielding power dangerously beyond imagination." 


 SRA_Chief_Buff_0:0 "Universal Might"
 SRA_Chief_Buff_0_desc:0 "§RThe silently spreading crimson energy whispers of the road to unity.§!"

 SRA_Chief.8.desc.a:0 "......?\nStrange, how could a hyperlane form naturally? I didn't expect to make contact with the galaxy in this epoch. Now that...\nWait, you are..."
 SRA_Chief.8.desc.b:0 "......?\nStrange, how could a hyperlane form naturally? I didn't expect to make contact with the galaxy in this epoch. But since it happened...\nWell, civilizations of the galaxy-\nWe are not interested in you. Please keep your distance, otherwise, I cannot guarantee your safety."
 SRA_Chief.8.a:0 "……"


 SRA_Chief.9.desc:0 "...Whatever, regardless of what you are, just don't come near here."
 SRA_Chief.9.a:0 "Strange fellow..."
 SRA_Chief.10.desc:0 "Security assessment complete.\nHello.\nYou may call me \"The Chief\"."
 SRA_Chief.10.a:0 "Who are you exactly? And those ships..."
 SRA_Chief.11.desc:0 "As you can see, we are a civilization that has been secluded in this corner of the galaxy. The unexpected hyperspace disturbance earlier affected our stealth system, allowing you to observe us.\nSince things have come to this, we need to take measures to ensure our safety."
 SRA_Chief.12.desc:0 "After comprehensive consideration of existing civilizations in the galaxy, we believe you are a relatively good partner for security cooperation.\nIf you are interested in exchanging resources, we can provide you with some technological products to give you an advantage in competition with other nations."
 SRA_Chief.13.desc:0 "If you've made up your mind, you can contact me in the communications list. Also, do not attempt to replicate our technology; it would be futile."

 SRA_Chief.14.desc:0 "Executor, you must be very surprised by the technology possessed by \"The Chief\". Unfortunately, I cannot provide you with much information. I can only tell you that those things are not what you understand them to be. In other words, do not trust these modified items too much."
 SRA_Chief.14.a:0 "Hmph."
 SRA_Chief.15.desc:0 "Executor, I carefully compared the technologies possessed by \"The Chief\"... Yes, they are almost identical to StellarRegulator Array designs. However, I cannot connect to those creations. I fear they are specially modified versions. If you decide to acquire those items from \"The Chief\", it is best to be careful."
 SRA_Chief.15.a:0 "Hmph."

 SRA_Chief_talk_return3:0 "Let me think again." 
 SRA_Chief_talk_return4:0 "Let's talk about something else." 
 SRA_Chief_talk_exit1:0 "End transmission."

 SRA_Chief:0 "\"The Chief\""

 SRA_Chief.100.desc.a:0 "We are not interested in you."
 SRA_Chief.100.desc.b:0 "(The other party does not respond)"
 SRA_Chief.100.desc.c:0 "...Hello."
 SRA_Chief.100.desc.d:0 "Is there something you need?"
 SRA_Chief.100.desc.e:0 "Hmm? Hello there, what do you need today?"
 SRA_Chief.100.desc.f:0 "Wait a moment, I am browsing your observation records... Alright, what is it?"


 SRA_Chief.100.a:0 "We want to cooperate with you"
 SRA_Chief.100.b:0 "We no longer want to cooperate with you"
 SRA_Chief.100.c:0 "Chat"
 SRA_Chief.100.d:0 "Trade Building Core"
 SRA_Chief.100.e:0 "Trade Fleet"
 SRA_Chief.100.f:0 "You are weak and pitiful; we will destroy you."
 SRA_Chief.100.f.tooltip:0 "We know very well that those pretentious blue-light fleets are just piles of worthless scrap metal. No civilization's technology is better than ours. The so-called cryptic engineering is just nonsense that only fools would believe. We are omnipotent, we can easily destroy those heaps of junk, seize their databases, and claim their worlds for our own. Yes, we should do this. Let's start! Yeeart!!!"
 SRA_Chief.100.f2:0 "You are weak and pitiful; we will destroy you."
 SRA_Chief.100.f.tooltip2:0 "We know very well that those pretentious blue-light fleets are just piles of worthless scrap metal. No civilization's technology is better than ours. The so-called cryptic engineering is just nonsense that only fools would believe. We are omnipotent, we can easily destroy those heaps of junk, seize their databases, and claim their worlds for our own. Yes, we should do this. Let's start! Yeeart!!!\n\n§RWe still don't know what dangers are hidden in the galaxy; declaring war rashly carries great risk.§!"


 SRA_Chief.198.desc:0 "What? Fine, you might be stupider than I thought... or sharper?\n\n§RThen let us begin.§!"
 SRA_Chief.198.a:0 "What are you talking about?"

 SRA_Chief_trade_cost_buff:0 "\"The Chief\" Treaty Resource Collection"
 SRA_Chief_trade_cost_too_high:0 "The proportion of resources collected by the current treaty is too high"
 SRA_Chief_trade_cool_down:0 "Transaction Preparing"
 #合作开始/结束
 SRA_Chief.101.a.desc:0 "Hmm, as a basis for cooperation, we will collect 10% of your empire's total monthly output. In return, you can obtain one-time building cores from us, as well as fleets provided according to formation. Note that your subsequent transactions will increase the percentage of your empire's output we collect monthly. So, are you sure you want to cooperate with us?"
 SRA_Chief.101.b.desc:0 "Are you really going to tear up the treaty? I hope you think carefully and don't make a decision you'll regret."
 SRA_Chief.101.a:0 "Yes, we have decided to cooperate with you"
 SRA_Chief.101.b:0 "Yes, we want to cancel the cooperation"

 SRA_Chief.102.a.desc:0 "Hmm, then the treaty is signed. You can now start trading with us."
 SRA_Chief.102.b.desc:0 "...Good, very good.\n\n§RIt is time...§!"

 #交易建筑核心
 SRA_Chief.103.desc.a:0 "You can trade these special building cores with us. They can unfold into automated buildings with extremely high productivity, but note that demolishing the building will not recover the core.\nEach building traded increases the monthly empire output collection ratio by 1%. You must wait 360 days after each transaction before trading again."
 SRA_Chief.103.a:0 "Acquire a Database Terminal Building Core"
 SRA_Chief.103.a.desc:0 "A storage terminal connected to a certain database, making records of countless epochs accessible at your fingertips."
 SRA_Chief.103.b:0 "Acquire a Composite Construction Center Building Core"
 SRA_Chief.103.b.desc:0 "An extremely advanced construction center capable of manufacturing a wide variety of materials and products almost out of thin air."
 SRA_Chief.103.c:0 "Acquire a Ground Shipyard Building Core"
 SRA_Chief.103.c.desc:0 "An advanced ground military factory that significantly improves ship construction efficiency while assisting in planetary production tasks."
 SRA_Chief.103.d:0 "Acquire a Control Center Building Core"
 SRA_Chief.103.d.desc:0 "Advanced automated facilities capable of directly resolving labor needs in the local district and strengthening all automated labor planet-wide."

 #交易舰队
 SRA_Chief.104.desc.a:0 "I can provide you with some special fleets. The formation can be referenced from the fleets we use. I believe they will be of great assistance to you. But note that their formation cannot be modified, and you have to bear the high maintenance costs yourself.\nEach fleet traded increases the monthly empire output collection ratio by 5%. You must wait 360 days after each transaction before trading again."
 SRA_Chief.104.a:0 "Acquire a \"Starlight\" Fleet"

 #闲聊
 SRA_Chief.3011.a.desc:0 "If there's nothing else, I have other matters to attend to."
 SRA_Chief.3011.b.desc:0 "You should think more about what to do next instead of finding a political partner to chat with, shouldn't you?"
 SRA_Chief.3011.c.desc:0 "Be careful with my ships. If they are lost, I won't replace them for you.\nAnd the monthly alloy payments must still be made~"
 SRA_Chief.3011.d.desc:0 "You seem very surprised by the technology we use. Heh, I know the reason, but I won't tell you the answer."
 SRA_Chief.3011.e.desc:0 "Heh, so curious about me? Why not trade more and show your sincerity."

 SRA_Chief.3012.a.desc:0 ""
 SRA_Chief.3013.a.desc:0 ""
 SRA_Chief.3014.a.desc:0 ""



 SRA_Chief.3015.a.desc:0 "\"Executor\", that's what others call you, right... I wonder if anyone can truly control their own destiny..."
 SRA_Chief.3015.b.desc:0 "This galaxy hides many disturbing things, forcing me to plan with extreme caution. Are you prepared to face anything?"
 SRA_Chief.3015.c.desc:0 "Curious about my wings? Heh, you really don't hide your curiosity... Perhaps you will have a chance to understand these later."
 SRA_Chief.3015.d.desc:0 "I think you need to acquire more things from me to build a more peaceful galaxy. You know, weak armaments trigger wars, powerful armaments prevent wars.\nA discount? Hmm~ money still has to be paid according to the contract."
 SRA_Chief.3015.e.desc:0 "Only by holding the weapon tightly in your hand can you protect everything you have. I believe you understand this truth, so... mhm~"





 #灾疫后，事件开始
 #低关系
 SRA_Chief.200.desc:0 "Long planning, long waiting, all for this day... Finally, I will reclaim everything that should be mine with my own hands."
 SRA_Chief.200.a:0 "What are you talking about?"
 SRA_Chief.202.desc:0 "Executor! Everything we acquired from \"The Chief\" has gone out of control!\nThose fleets no longer accept our command and have started acting on their own. Even more dangerously, a large number of highly advanced armies poured out of those buildings from \"The Chief\" and launched attacks on our colonies."
 SRA_Chief.202.a:0 "How could this happen..."
 SRA_Chief.202.b:0 "Damn it!"
 SRA_Chief.203.desc:0 "Intelligence I received indicates that a series of bizarre spatial interference systems have been deployed around us, causing §RSpear_Of_Galaxy_Zenith's Interstellar Strike to fail target calibration§!. Furthermore, §Ra mysterious spatial barrier system prevents us from entering The Chief's star system§!.\n§RWe need to hold the line for now and wait for further developments.§!"
 SRA_Chief.203.a:0 "Curse it!"
 SRA_SOGZ_menu_sub_6_1_chief:0 "Bizarre spatial interference systems prevent §BSupernova Termination§! from calibrating target"

 SRA_Chief.211.desc:0 "Perhaps you are at a loss, perhaps you were prepared. Regardless, you will give your own method.\nEverything is proceeding according to plan; it is still early."
 SRA_Chief.212.desc:0 "Hmm, perhaps I should send out more fleets.\nHas §RHidra§! not reacted? She didn't perform the duties of her position, nor did she show her true power, right?"
 SRA_Chief.213.desc:0 "What did §BRocivia§! say? Or did she say nothing? She always acts like everything is under control. Presumably, she is actually indifferent this time too.\nSigh, maybe I got used to it long ago."
 SRA_Chief.214.desc:0 "Executor, I apologize for contacting you only now. There have been too many emergencies recently, but you can handle them, right.\nIntelligence indicates that \"The Chief\" is mobilizing all industrial capacity to produce fleets. Her reinforcements are endless within the foreseeable range. The possibility of defeating her head-on is low. I am looking for other ways."
 SRA_Chief.215.desc:0 "Your performance is still within the margin of error, but some things are indeed surprising. The last time I saw the StellarRegulator Array like this, I still had a little longing for the future."
 SRA_Chief.216.desc:0 "You, a singularity, are very likely an existence that does not belong to this universe.\nYou are an outsider to this galaxy and its history, just like me.\nI need to adjust my plan."


 SRA_Chief.217.desc:0 "Executor, after long-term work, we have gained a certain level of understanding of \"The Chief's\" communication network. This network is a centralized remote control system, with a core controlling the actions of all units. Although its information transmission encryption is very advanced, it is not completely unbreakable. We are preparing to launch a project. If successful, we can briefly disguise ourselves as the control terminal to issue commands and use the Stellarcrystal structure of those units to reconstruct a control system under our command."
 SRA_Chief.217.a:0 "Invest resources as much as possible."


 SRA_RE_Chief_Crisis_situation_1:0 "Electronic Warfare Project Against \"The Chief\""
 SRA_RE_Chief_Crisis_situation_1_type:0 "Electronic Warfare Project Against \"The Chief\""
 SRA_RE_Chief_Crisis_situation_1_desc:0 "This is an intrusion process into \"The Chief's\" centralized remote control network. As expected, we can end this war once and for all with this project."
 SRA_RE_Chief_Crisis_situation_1_monthly_change_tooltip:0 "Project progress steadily increasing"

 SRA_RE_Chief_Crisis_situation_1_progress_complete:0 "Electronic warfare project complete, seizing control of \"The Chief's\" units"
 SRA_RE_Chief_Crisis_situation_1_fail:0 "Project ended"
 sra_re_chief_crisis_situation_1_stage_1:0 "Intrusion Process"
 sra_re_chief_crisis_situation_1_stage_1_effects:0 "This is an intrusion process into \"The Chief's\" centralized remote control network. As expected, we can end this war once and for all with this project."
 SRA_RE_Chief_Crisis_situation_1_charge:0 "Project In Progress"
 SRA_RE_Chief_Crisis_situation_1_charge_effect:0 "Electronic warfare project continues."
 SRA_RE_Chief_Crisis_situation_1_charge_tooltip:0 "Relevant decoding and equipment configuration are in progress."

 SRA_Chief.218.desc:0 "Preparations complete, electronic warfare operation unfolding."
 SRA_Chief.218.a:0 "Let us await the good news."

 SRA_Chief.219.desc:0 "Executor, as far as current results go, the electronic warfare operation was a complete success. We successfully seized control of all hostile Starlight Machines and rewrote their command network.\nIn addition, we successfully captured \"The Chief\" herself. I am patching the communication through now."
 SRA_Chief.219.a:0 "Excellent."

 SRA_Chief.220.desc:0 "§YUnder the muzzles of several machine warforms that were originally driven by her, \"The Chief\" appeared on the screen.§!\n\nBetrayal on the battlefield. Indeed a good move; I've been checkmated.\n\n§YShe tilted her head.§!\n\nSo, what do you plan to do with me, hmm?"
 SRA_Chief.220.a:0 "Bring her here" #to 230
 SRA_Chief.220.b:0 "§RExecute her§!" #to 221
 SRA_Chief.220.b.tooltip:0 "§RThis is not a wise decision.§!"

 
 SRA_Chief.221.desc:0 "§YThe machine warforms received your command, using several electric capture nets to pin The Chief to the ground, then pressing their muzzles against her forehead.§!\n\nWhat? You can't be serious!"
 SRA_Chief.221.a:0 "Bang!"
 SRA_Chief.222.desc:0 "§YShe lay on the ground, motionless. Red and pink fluids began to spread on the surface, staining her scattered white long hair with the scent of death.§!"
 SRA_Chief.222.a:0 "Burn it clean."
 SRA_Chief.223.desc:0 "§Y……§!"
 SRA_Chief.223.a:0 "……？"
 SRA_Chief.224.desc:0 "§Y......§!......\nSigh."
 SRA_Chief.224.a:0 "……！"
 SRA_Chief.225.desc:0 "§YThe body that should have died slowly stood up, ignoring the crackling electric capture nets, scattering residual matter from the hole in the side of her head.§!\nThis was one of the few places on me that was still alive...\n§YHer scarlet eyes stared at you, flickering with an unfathomable light.§!"
 SRA_Chief.225.a:0 "What are you?"
 SRA_Chief.226.desc:0 "Who knows.\n\nYour choice was quite unwise. Farewell."
 SRA_Chief.226.a:0 "……"

 SRA_Chief.230.name:0 "How to Dispose"
 SRA_Chief.230.desc:0 "According to reports, \"The Chief\" has been securely detained. Although the operation to remove her mechanical components failed, the numerous restraint devices and execution systems we installed have theoretically controlled her mobility.\nPerhaps it is time to do something."
 SRA_Chief.230.a:0 "Go talk to her."
 SRA_Chief.231.desc:0 "Hello there, \"Executor\".\n§YAlthough welded with various restrictive devices, \"The Chief\" still greeted you nonchalantly, as if nothing had changed.§!\nAre you just here to look, or can you finally not resist digging some secrets out of me?\n§YShe tilted her head slightly.§!"
 SRA_Chief.231.a:0 "Do you have anything to say?" #to 232
 SRA_Chief.231.b:0 "Hand over those technologies, or we will dig them out of your brain ourselves." #to 233
 SRA_Chief.231.c:0 "Maybe this button will make your attitude more respectful?" #to 235

 SRA_Chief.232.desc:0 "Hmm... If you have some free time as I expected, why not listen to a story first."
 SRA_Chief.232.a:0 "...Speak." #to 240

 SRA_Chief.233.desc:0 "I cannot comply.\nAs far as I know, the only intelligent system you can mobilize capable of decoding Stellarcrystal technology of this level is the shipboard intelligent core of your Spear_Of_Galaxy_Zenith. Other computing arrays don't even have the capability to access these technologies.\nBut I guess you wouldn't let me connect to that precious ship."
 SRA_Chief.233.a:0 "……"
 SRA_Chief.234.desc:0 "Since you can't come up with a good solution for a while, why not listen to a story first."
 SRA_Chief.234.a:0 "...Speak." #to 240

 SRA_Chief.235.desc:0 "§YThe deeply inserted \"Pain Generator\" uses a complex feedback system to control precise electric probes, easily destroying any known sapient creature's will to resist.§!\n...\n§YShe did not react as expected, but merely stopped smiling.§!"
 SRA_Chief.235.a:0 "Now, do you have anything to say?"
 SRA_Chief.235.b:0 "Hand over those technologies, or we will dig them out of your brain ourselves."
 SRA_Chief.236.desc:0 "Perhaps you should give up these little tricks used on organics. After all, although you are in a high position, you are asking for my help. I guess your technical team still has found nothing on me, right?\n\nIf you really want these things that are in your hands but you cannot understand, you had better be patient."
 SRA_Chief.236.a:0 "What do you want?" #to 234
 SRA_Chief.236.b:0 "Arrogant fool, kill her."
 SRA_Chief.236.b.tooltip:0 "§RThis is not a wise decision.§!"

 SRA_Chief.240.desc:0 "Hmm... In a past so distant it is almost unknowable, there was a civilization.\nAlthough it wasn't the name at the time, we might as well continue to call it the §BRocivia Empire§!.\n\nWhen the story took place, the Rocivia Empire was at war with an ancient precursor. The precursor's name meant Core, or simply put, call them CORE.\nThe CORE civilization was much stronger than the Rocivia Empire, so the Empire was retreating in defeat."
 SRA_Chief.240.a:0 "Continue."
 SRA_Chief.240.b:0 "I don't know how many times I've heard this."
 SRA_Chief.241.desc:0 "...And the protagonist of the story was unfortunately born in an abandoned star system.\nAlthough the CORE civilization did not exterminate these undefended colonial planets, the collapse of civilian transport and the flight of the government still brought chaos and suffering to everyone, or most people.\nThe protagonist was a girl, perhaps ten years old, who lost her family in the collapsing order and struggled alone in the ruins shrouded in darkness.\nFortunately, fate seemed to show mercy. her psionic talent was remarkable. Even without any training, simple tricks were enough to avoid danger and find a way to survive."
 SRA_Chief.242.desc:0 "...The war did not last forever. Many people's heroic struggles made the CORE civilization choose to spare the Empire. These old-fashioned guys have always been tolerant of new civilizations, even more so than the civilizations themselves.\nWith the signing of the armistice agreement, the recovery of these chaotic sectors proceeded rapidly. The girl's struggle lasted only two years, and the smell of blood on her hands could still be washed away.\nUnfortunately, her talent was a double-edged sword. The Empire would not let rare psychics go. Putting aside the replenishment needs of the Imperial Security Headquarters' agents, loosely managed psionic research institutes everywhere had long since pounced on this place.\nAfter all, they couldn't openly create disappearances in an orderly society."
 SRA_Chief.243.desc:0 "...The unfortunate girl was easily taken away by a squad armed to the teeth, and then found herself in a research institute located on a desolate rim world. This place was filled with nothing but sand, addictive substances, and outlaws; certainly not government management.\nA young, gifted psychic, \"good goods snatched from the jaws of the Security Headquarters\". What excellent raw material for experiments. The researchers geared up, unable to wait to put \"cutting-edge\" technology into practice."
 SRA_Chief.244.desc:0 "...From another perspective, the girl soon found common topics with her \"seniors\". Perhaps these poor children would share how to make the tubes inserted in their bodies more comfortable, or have someone to accompany them when they couldn't sleep from pain.\nWell, thanks to surgical experts and pharmacology masters, the girl successfully acquired long-term neuralgia and insomnia, occasional hallucinations and tinnitus, dependence on painkillers and tranquilizers, and psionic essence addiction. And a series of precious assets at the forefront of technology embedded in her spine or certain organs, adding up to maybe more expensive than a destroyer."
 SRA_Chief.245.desc:0 "...Regardless of how she survived those days, anyway, on her fourteenth birthday, the similarly afflicted little ones caused a big commotion. Thanks to the researchers sparing no expense in giving these children drugs and amplification machinery, their skulls were blown apart from the inside out, rather than crushed from the outside in.\nUnfortunately, security facilities didn't seem to like the rebels' optimistic imagination. Meticulously prepared anti-psionic materials made the subjects hit a wall. Considering these were precious properties, the children were not cruelly killed, at most just having some irrelevant limbs removed.\nBut the protagonist of the story was relatively lucky. Perhaps it was the cover of others, perhaps the favor of fate. In short, she escaped, breathed free air, and ate a mouthful of sand."
 SRA_Chief.245.a:0 "Continue." #to 248
 SRA_Chief.245.b:0 "I've heard enough, tell me next time." #to 246
 SRA_Chief.246.name:0 "Dust-Sealed Story"
 SRA_Chief.246.desc:0 "Six months have passed in a flash. Do you wish to continue the unfinished story?"
 SRA_Chief.246.a:0 "Go find The Chief."
 SRA_Chief.246.b:0 "Wait a bit longer."
 SRA_Chief.247.desc:0 "Hello there, \"Executor\".\n§YAs before, she nodded to you nonchalantly.§!\nI thought you planned to wait another six months. Alright, let's continue. Last time we talked about... the girl escaped from the research institute, right."
 SRA_Chief.248.desc:0 "...The so-called rim world naturally refers to planets with insufficient development value to be taken seriously. Having breathable atmosphere is already a minority; don't even think about having any natural environment. And the girl had to face more than just an endless sea of sand; her body was also hunting her.\nPeople at that time focused on using the nervous system to influence biological psionic abilities, and effective drugs unfortunately overlapped significantly with hallucinogens and stimulants. Of course, subsequent research proved that these effects were basically draining the biological psionic potential dry, but that was at least a few hundred years later.\nBack to the subject, separated from the daily supply, the drawbacks of these addictive substances were all revealed. Although the rarest psionic essence only had psychological dependence, the withdrawal symptoms of the remaining stuff were all present."
 SRA_Chief.249.desc:0 "...Not to mention, the girl still had a long strip of implants attached to her spine. These new tenants who had just moved in for a few months were fighting fiercely with rejection reactions. Even if there was some medicine stored inside that hadn't been used up, it wouldn't last many days.\nHowever, the story naturally wouldn't end so easily. Perhaps just by coincidence, when the girl had a high fever and blurred vision, someone reached out to her."
 SRA_Chief.250.desc:0 "...The girl woke up in a strange room, all past ailments disappeared as if they never existed. A strange woman wearing a pointed hat sat by the bed and told her a lot of messy things. In summary, she was adopted by this guy who called herself a magician. As for this outfit, the \"magician\" claimed it was a custom of material science workers, conducive to the discovery of new results."
 SRA_Chief.251.desc:0 "...Most things about the \"magician\" were a mystery. She seemed to have nothing unsolvable except for the project in her hand. The girl received medical treatment, education, and methods on how to use her powerful and dangerous power.\nSoon, the girl showed her talent in the fields of machinery and intelligence, and entered the Imperial Third Research Center-a comprehensive research institute known for excellent military designs."
 SRA_Chief.252.desc:0 "...When everything seemed to be booming, unfortunately, the past finally caught up. The daily increasing drug dependence finally exceeded the limit. The dosage to completely suppress the reaction had exceeded the lethal dose. All the suffering forgotten for years revived, unstoppable.\nAnd that lady who could always solve problems, the girl's mentor and mother figure, added insult to injury by leaving a note saying \"missing due to scientific expedition accident\" and never returned."
 SRA_Chief.253.desc:0 "...The girl fled to piles of old papers, rummaging through all past records related to mechanical synthetic modification, trying to escape the suffocating sadness and approaching despair, and the torture of a devastated nervous system.\n\nShe didn't want to lose, didn't want to die, didn't want cruel fate to take away the little warmth left, didn't want to face the inevitable end hidden behind every heartbeat."
 SRA_Chief.253.a:0 "And then?"
 SRA_Chief.254.desc:0 "Then?\nThen she died.\nAffected by the shock of a coup d'etat, she took 11 bullets in her own laboratory. Before she died, she even tried to upload herself.\nUnfortunately, her research went astray. She didn't even manage to copy her mind, let alone carry her soul."
 SRA_Chief.254.a:0 "……"
 SRA_Chief.255.desc:0 "Alright, the story is over. Thank you for listening. The technology you want has been written into your database.\nAlso, I have nothing to do right now. Do you want to, or rather, do you dare to...\n\n§REntrust your trust to an existence you fundamentally don't understand?§!"
 SRA_Chief.255.a:0 "No harm in trying, let me see what you can do."
 SRA_Chief.255.b:0 "You'd better continue staying here."
 SRA_Chief.256.desc:0 "§YShe gave you an unfathomable look, then grinned.\nWith the sound of metal twisting and snapping, her wings easily broke free from restraint, flaunting their existence.\nThe invisible heat melted everything around her, leaving only her standing alone.§!\nNext, hmm...\nYou can call me \"Rocivia\". Don't be so distant, right?"
 SRA_Chief.256.a:0 "§YYou can now contact Rocivia in the communications list.§!"
 SRA_Chief.257.desc:0 "Should I say you are bold but foolish, or daring to act? You actually kept that child...\nWhatever, she won't be able to cause any trouble for a while. Even if there is any trouble, presumably you have a way to solve it. It's up to you."
 SRA_Chief.257.a:0 "Everything is under control."

 SRA_Chief.400.desc:0 "Long planning, long waiting, all for this day...\n§RThis world will be reshaped according to my will!§!\n\n...Actually, I didn't expect you to have such trust in me, allowing your empire to be filled with technology provided by me."
 SRA_Chief.400.a:0 "We'll meet on the battlefield."
 SRA_Chief.400.b:0 "§RPerhaps, in a certain layer of history...§!"
 SRA_Chief.400.b.tooltip:0 "§REnd your story and continue the game from The Chief's perspective.§!"

 SRA_Chief.401.desc:0 "...Wait a minute, is something wrong.\n\n§YThis is really somewhat unexpected.\nThat so-called Executor should be a projection of some alien consciousness entity; how could they simply die in an assassination operation?\nNo, it's not impossible. You have encountered §Bsuch things§! before. This can certainly happen. The script can stop abruptly, leaving the messy situation to evolve.\nThere is no use struggling with this. Continue according to plan. You still have a tough battle to fight.§!"
 SRA_Chief.401.a:0 "After all, Rocivia is still there."

 SRA_Chief.402.desc:0 "So, current intelligence is as follows.\n\n§YYou hold the authority to dominate creations.\nRegardless of whose creation, regardless of whose purpose it carries, all created things succumb to your will.\nJust a touch.\n\nThis authority made you everything you are today. You thus defeated an attack by the Third Expeditionary Fleet and obtained almost all StellarRegulator Array technology from the wreckage of the Expeditionary Fortress. Except for your biggest opponent right now-Spear_Of_Galaxy_Zenith.\nThe existence of the StellarRegulator-because of her §Borigin§!-will block the manipulation of your authority. Even if you come to that giant ship in person, you are unlikely to seize it. Whatever your purpose, you must destroy it.§!"
 SRA_Chief.402.a:0 "But presumably that won't be an easy task."
 SRA_Chief.403.desc:0 "§YOf course.\nSpear_Of_Galaxy_Zenith replaced the Expeditionary Fortress and its intricate protection network. The StellarRegulator Array's positioning of this type of giant ship can be imagined. Even if all fleets are committed, they may not be able to defeat this terrible creation.\nHowever, you have located several clues. These places might bring you intelligence to counter Spear_Of_Galaxy_Zenith.\n\nThe Empire's counterattack will begin soon, time is precious.§!"
 SRA_Chief.403.a:0 "Time to act."

 SRA_Chief.404.desc:0 "You have no idea what you have done.\nYou will understand soon."
 SRA_Chief.404.a:0 "How pathetic."
 SRA_Chief.405.desc:0 "§YAbandoned once again.\nHow ironic. This StellarRegulator managed to forget her past, accept a new narrative, and no longer entangle with her §Bcreator of numerous evil deeds§!, yet still chose foolishly to project her purpose onto an existence she never, and can never truly understand.\nNot to mention that is an alien with unclear intentions who can withdraw at any time.\nHer current encounter proves once again the untrustworthiness of others. How can you trust something you cannot control?\nAgreements or promises never truly possess power.\nOnly complete grasp and thorough domination can truly possess things.§!"
 SRA_Chief.405.a:0 "It has always been so."

