 SRA_RE_Anti_Rocivia_Crisis_chain_SOGZ_poi_desc:0 "The legendary flagship of the Expeditionary Fleet, a terrifying creation almost invincible. It possesses unimaginable reorganization capabilities; ordinary means cannot destroy it.\nTherefore, you are looking for a method. Until then, avoid it as much as possible."

