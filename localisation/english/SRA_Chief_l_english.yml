 SRA_Chief.601.desc:0 "Miss me, \"Executor\"?\n§RCalamitisease§! is indeed a good carrier for my power. Truly a miracle of nature's creation. This way, I don't need to fight your sampans all by myself; that's really tiring, you know.\nI'm not a villain in an 8 PM soap opera, so I won't tell you what I'm going to do. Bye-bye."
 SRA_Chief.601.a:0 "You will regret this."


 SRA_Chief.602.desc:0 "I certainly noticed a giant Abyss construct jellyfish floating above our heads. This situation was indeed not in the plan. Specifically, I didn't expect her to do things so blatantly. What should have happened was probably her hiding in some unknown corner quietly completing her goal, and might not jump out to show off until everything ended...\nWell, maybe, possibly, I have a guess."
 SRA_Chief.603.desc:0 "Hidra! Come out, come out."
 SRA_Chief.604.desc:0 "§YA scarlet crystal dragon leaned out from the ceiling and floated down beside Rocivia. She was messily draped with a pile of gold and jewelry, and gold coins slipped from her swinging sleeves.§!\n\nHonorable Supreme Speaker~ What does your humble General Manager need? Don't give me tasks beyond my ability; after all, we are just an intelligence supervision agency with no other capabilities, right?"
 SRA_Chief.605.desc:0 "Sigh, can I assume this statement expresses your stance, guy who was rolling around excitedly just now?"
 SRA_Chief.606.desc:0 "Say what you want.\n\nHowever, however.\nIf Little Rosie has chosen her role, then I will give you the ability to perform on the same stage. Let you be free from the control of unreasonable power, and show your accumulation properly.\n§YShe circled to the other side of Rocivia and snapped her fingers.§!\nEscape that-\nAuthority that dominates all creations."
 SRA_Chief.607.desc:0 "§YThe crystal dragon gave you a brilliant smile, then disappeared in a turn.§!\n\n...At least she didn't jump over to that side.\nHmm, if your planning is correct, you should be able to rely on the fleet to destroy that Abyss construct, or Heart of Calamitisease.\nRocivia wants to use this as a carrier to spread ['concept_SRA_SD_Abyss_Erosion'] to this galaxy and even the entire universe. She has the ability to continue existing in such a world, but obviously, you do not.\n['concept_SRA_SD_Abyss_Erosion'] will erase the differences between things, turning everything into the chaos before birth. For you, this means death and destruction.\nBut at least the construct can be damaged and destroyed. As long as you destroy the Heart of Calamitisease, that probably counts as your victory.\nIf it doesn't count, I'll talk to Hidra again.\n§YShe sighed.§!\nGo, discuss with StellarRegulator how to deal with it. I personally don't recommend throwing all fleets in at once... but it's not necessarily impossible."
 SRA_Chief.608.desc:0 "Hello, Executor. I have basically summarized the information regarding the Heart of Calamitisease and uploaded it to the intelligence log.\nExisting data indicates that breaking the shell of the Heart of Calamitisease will cause the Abyss energy contained within to overflow rapidly, causing serious adverse effects throughout the star system. Although this impact can be quickly suppressed by fleet damage control, multiple erosions in a short period may cause unpredictable dangerous consequences.\nTherefore, a better plan is to deploy fleets in batches, minimizing the size of the eroded fleet while ensuring the Heart of Calamitisease can be broken once.\nAfter being damaged, the Heart of Calamitisease will quickly mobilize energy to repair itself and summon a group of guards, so we need multiple battles to deplete its energy reserves. This process may take quite some time. Fortunately, there are no signs of it moving, and losses remain within a controllable range.\nThat is the current information. Fight alongside me, Executor."


 SRA_RE_Chief_Crisis_2_situation:0 "Ignite Ash with Fire"
 SRA_RE_Chief_Crisis_2_situation_type:0 "Ignite Ash with Fire"
 SRA_RE_Chief_Crisis_2_situation_desc:0 "The fire of the Dark Star ignited the remains of Calamitisease, and the boundless shadow is about to revive.\n\n§Y-Every 8.00 £time£, §RHeart of Calamitisease§! will randomly select a hostile fleet in the star system and apply 8.00 £time£ of §RSilent Mourning§! to it.\n-§RSilent Mourning§! causes affected ships' shields, armor, and hull to drop rapidly and take §Rhigh§! damage every 1.00 £time£.\n-Whenever a fleet is destroyed, §RHeart of Calamitisease§! will summon a group of §RBoundless Abyss Shadows§! that can exist for 64.00 £time£ at the location of the destroyed fleet.\n-Whenever it is about to be destroyed, §RHeart of Calamitisease§! will lose 20 ascension progress, enter a protected state, and release a group of §RBoundless Abyss Shadows§!. Destroying this group of §RBoundless Abyss Shadows§! ends the protected state of §RHeart of Calamitisease§!. When this group of §RBoundless Abyss Shadows§! is destroyed, it will apply a negative effect within the star system, the intensity of which decreases rapidly with the existence time of the §RBoundless Abyss Shadows§!.§!"

 SRA_RE_Chief_Crisis_2_situation_monthly_change_tooltip:0 "§RHeart of Calamitisease is awakening...§!"

 SRA_RE_Chief_Crisis_2_situation_fail:0 "Calamitisease tunes with the power of the Abyss; a cluster overriding reality is born here."
 SRA_RE_Chief_Crisis_2_situation_approach:0 "End the revival of Calamitisease and put an end to the out-of-control fate."
 sra_re_chief_crisis_2_situation_stage_1:0 "Lightless"
 sra_re_chief_crisis_2_situation_stage_1_effects:0 "§RThe end is approaching.§!\n\nWhenever broken, §RHeart of Calamitisease§! will release a large number of $SRA_chaos_Ship$ and randomly apply §RHopeless§! to fleets in the system.\n-$SRA_chaos_Ship$ will exist for 360.00 £time£.\n-§RHopeless§! renders affected ships unable to move and attack. Lasts 180.00 £time£."
 sra_re_chief_crisis_2_situation_stage_1_buff:0 "§RHopeless§!"
 sra_re_chief_crisis_2_situation_stage_2:0 "Afterglow"
 sra_re_chief_crisis_2_situation_stage_2_effects:0 "§RThe brilliant beyond reveals a corner here.§!\n\nWhenever broken, §RHeart of Calamitisease§! will release a large number of $SRA_chaos_Ship$ and randomly apply §RCollapse§! to fleets in the system.\n-$SRA_chaos_Ship$ will exist for 360.00 £time£.\n-§RCollapse§! causes affected ships' shields, armor, and hull to drop rapidly. Lasts 180.00 £time£."
 sra_re_chief_crisis_2_situation_stage_2_buff:0 "§RCollapse§!"
 sra_re_chief_crisis_2_situation_stage_3:0 "Dusk"
 sra_re_chief_crisis_2_situation_stage_3_effects:0 "§RThe time when all things intersect.§!\n\nPeriodically, §RHeart of Calamitisease§! will release a large number of $SRA_chaos_Ship$ and apply §RHesitation§! to them.\n-$SRA_chaos_Ship$ will exist for 360.00 £time£.\n-§RHesitation§! causes affected ships to randomly gain buffs or debuffs."
 sra_re_chief_crisis_2_situation_stage_3_buff:0 "§RHesitation§!"
 sra_re_chief_crisis_2_situation_stage_4:0 "Scorching Sun"
 sra_re_chief_crisis_2_situation_stage_4_effects:0 "§RBoundless flame.§!\n\nPeriodically, §RHeart of Calamitisease§! will summon a large number of §YCORE Battleships§! and apply §RBlazing§! to them.\nWhenever broken, §RHeart of Calamitisease§! will summon a large number of §YCORE Battleships§! and apply §RBlazing§! to them.\n-§YCORE Battleships§! will exist for 360.00 £time£.\n-§RBlazing§! causes affected ships to regenerate shields, armor, and hull at high speed."
 sra_re_chief_crisis_2_situation_stage_4_buff:0 "§RBlazing§!"
 sra_re_chief_crisis_2_situation_stage_5:0 "Dawn"
 sra_re_chief_crisis_2_situation_stage_5_effects:0 "§RThe day is breaking.§!\n\nPeriodically, §RHeart of Calamitisease§! will summon a large number of §YCORE Battleships§! and apply §RAfterglow§! to them.\nWhenever broken, §RHeart of Calamitisease§! will summon a large number of §YCORE Battleships§! and apply §RAfterglow§! to them.\n-§YCORE Battleships§! will exist for 360.00 £time£.\n-§RAfterglow§! grants affected ships massive attack speed bonuses, but continuously drains hull points."
 sra_re_chief_crisis_2_situation_stage_5_buff:0 "§RAfterglow§!"

 SRA_RE_Chief_Crisis_2_situation_continue:0 "Press Forward"
 SRA_RE_Chief_Crisis_2_situation_continue_effect:0 "Fight §RHeart of Calamitisease§! and destroy it completely."
 SRA_RE_Chief_Crisis_2_situation_continue_tooltip:0 "Fight §RHeart of Calamitisease§! and destroy it completely."

 SRA_Chief.610.desc:0 "Delusions of a fanatic.\nYou know nothing of the Abyss, yet dare to talk big about defeating it. You fantasize that your crude destruction can dispel the end of worlds, boasting that your creation surpasses the source of creation. Truly foolish; how can existing things hinder the concept of existence itself?\n\n§RYou are but a lonely boat, unable to shake the ocean.§!"
 SRA_Chief.611.desc:0 "The entire world will submit, all wills will surrender. At this border of creation and destruction, only domination reigns eternal and immortal...\n\n§RAll things will be smelted into one.§!"
 SRA_Chief.612.desc:0 "It's over...\n\n\nAlthough I really want to say that, you're probably going to complicate things, right."
 SRA_Chief.613.desc:0 "Can't put it that way. I have no subjective intention to hinder nor objective action to prevent; I completely allowed you to complete your plan. It is merely that your ability is limited, unable to prevent the universe itself from falling into the Abyss while ['concept_SRA_SD_Abyss_Erosion'] completely spreads to the entire universe.\nLook on the bright side. You have at least fifty years to enjoy a peaceful life in this rapidly dying universe. That can't be said to be a bad thing, right."
 SRA_Chief.614.desc:0 "Hmph.\nYou should go."
 SRA_Chief.615.desc:0 "Then farewell, Rocivia Rocivia, good luck."
 SRA_Chief.615.a.tooltip:0 "BE5: Moment of Peace"


 SRA_Chief.620.desc:0 "§YThe colossal semi-translucent entity wandering like a planet was torn apart by out-of-control energy, and the escaping tendrils originally connected to it shattered and scattered.§!\n\nTch, is this it?"
 SRA_Chief.621.desc:0 "§YNot being the true Abyss essence, it cannot ignore the struggles of mortals. The constraints shatter, and everything naturally turns into bubbles.\nThick fog burns in her palm, like the churning sea, the roaring storm. The rapidly differentiating Abyss energy turns into light and heat, shining like a nova.\nIt's over. That willful woman only tolerates flamboyant entrances and magnificent exits. Her own play has been declared over. Continuing to struggle is meaningless; might as well start over somewhere else... Not the first time, or rather, long used to it.§!\n\nDo you have anything to ask?"
 SRA_Chief.621.a:0 "What did you do?"
 SRA_Chief.621.a.response:0 "I collected many Calamitisease samples long ago. I copied my consciousness and placed it inside, letting it grow into a massive composite thought entity, and used it as a container to constrain the massive Abyss energy I guided out.\nThis container is what you call the Heart of Calamitisease. It attempts to tune the energy inside it, shaping it into its own gestalt. After that, the container disintegrates, and the defined Abyss energy rapidly spreads and assimilates the entire universe."
 SRA_Chief.621.b:0 "What do you want?"
 SRA_Chief.621.b.response:0 "Haven't you understood along the way? So-called loyalty and trust are just verbal declarations; the only thing you can truly trust is the power held tightly in your hands. Are you not also reshaping this world? You rule, you conquer, you replace all rules with your own, you hope this is absolute, eternal.\nWhat I want is simple.\nI want my own future.\nNot twisted by anything, not dominated by anyone, a life belonging only to myself; that is all I want."
 SRA_Chief.621.c:0 "I have nothing to say."
 SRA_Chief.621.d:0 "Can't we talk?"

 SRA_Chief.622.desc:0 "Then let it be so.\nMay our paths never cross again, and may our fates no longer be swayed by the §BDeceiver§! and the §RManipulator§!.\nI should go. Perhaps somewhere my place of peace still exists.\n\n§YShe fell in space, disappearing into the mist.§!"
 SRA_Chief.622.a.tooltip:0 "TE: Play Finale"
 SRA_Chief.623.desc:0 "Are you... sober?\nYou want to keep me, want me to pretend to be loyal to you, even after such things?\nDo you feel appropriate ['concept_SRA_SD_Abyss_Erosion'] is good for your civilization? You just stopped me from doing so.\nOr are you just a simple fool who thinks you have the ability to control everything? That this little Rocivia is no different from your own Speaker Rocivia and Manager Hidra, just 'obedient and cute beautiful girls', posing no threat, causing no problems?"
 SRA_Chief.623.a:0 "I can give you what you want."
 SRA_Chief.623.b:0 "Maybe there can be a compromise contract?"
 SRA_Chief.623.c:0 "Looks like there's nothing to talk about."

 SRA_Chief.624.desc:0 "Fine then. I want you to immediately, completely, and thoroughly hand over full control of everyone, including yourself, notarized in front of our dear Hidra, and ensure it can be absolutely and eternally realized. I should thoroughly control your existence, and alter or erase it at any time needed, to ensure you will not pose any threat.\nThis is what I want, you know very well. The conflict between us has no possibility of tuning. I do not accept your free will. I do not accept the existence of others."
 SRA_Chief.624.a:0 "I agree."
 SRA_Chief.624.a.tooltip:0 "§BYou don't really want to choose this, do you?§!"
 SRA_Chief.624.b:0 "Looks like there's nothing to talk about."

 SRA_Chief.625.desc:0 "Surprising... you...\nI feel somewhat absurd, as if my years of effort were actually meaningless. All I had to do was ask, and you would raise your hands and surrender on the spot.\nSigh, since that's the case.\nGoodbye then."



