 SRA_Chief.406.name:0 "Special Project Complete"
 SRA_Chief.406.desc:0 "Intelligence collection at this location is complete, currently organizing."
 SRA_Chief.406.a:0 "Confirm."


 SRA_Chief.408.desc:0 "...\nTruly... pale to the extreme.\n§YBy using the power of those recovered consciousness fragments, Spear_Of_Galaxy_Zenith can remain indestructible almost permanently. Even using StellarRegulator Array technology to attack cannot truly harm it. No matter how many times, it can recover.\nBasically, the StellarRegulator is already in an invincible position.\n...Right?§!"

 SRA_Chief.409.desc:0 "§YThe Abyss, or Metabyss, is often mentioned but rarely clarified.\nExisting myriad things float up and burst like bubbles, and Metabyss is the sea churning with bubbles.\nThe Origin of Origins, the End of Ends. All that exists and does not exist is contained within it, and all concepts differentiate from it. All worlds are created by it and end by it. It is the brilliant glow of infinite complexity, every reality is but a slice of it; it is the boundless chaos beyond understanding, where everything melts into uniformity.\nAnd your consciousness is connected to the Abyss, like a silk thread hanging from the stage, descending from the high heavens, resting on your shoulder.\nThus, you are able to exercise its influence, shaping the reality beneath you according to your will.§!"
 SRA_Chief.410.desc:0 "§Y...But you cannot wipe out all enemies just by leaning in a corner.\nYou can only dominate things touched by your consciousness, and you are not a master shaper. Everything has differentiated from the Abyss; the path for things of the present to reach the past is dissolution. You want to shape reality with the power of the Abyss, yet you don't want reality to return to the Abyss. Although this is not impossible, it is by no means easy.\nEspecially since although you will not die, you can still be destroyed. At that time, you can only fall into the next beginning, wasting all previous efforts... as always.§!"
 SRA_Chief.411.desc:0 "§YThen, it is time. Your many voices have been silent for a long time. It is time for §Ryou all§! to sing in chorus.§!"
 SRA_Chief.412.desc:0 "§YShortly after the Quiet Clock Tower was rediscovered, you quietly arrived at this unreliable prison.\nThose rough and self-righteous repairs did not succeed in preventing Calamitisease's escape; in fact, they further advanced the disintegration of the seal.\nYou recovered a sample of §RCalamitisease§! for emergencies. Now, it is time for it to take the stage.§!"
 SRA_Chief.413.desc:0 "How does it feel, Tara?"
 SRA_Rokia_Tara_Xacum:0 "Tara Xacum"
 SRA_Chief.414.desc:0 "Actually, the vessel has no effect on our thinking ability... Well, this vessel is nice, top-tier rank.\nHmm, I understand. Calamitisease can naturally expand almost limitlessly while still maintaining unity in your cognition. Good, I think your plan is feasible."
 SRA_Chief.415.desc:0 "Although in my opinion, it would be more efficient to let me take over everything, but you have the final say.\nYou can invest resources into me at any time. I can turn this thing into a stable active Abyss construct.\n\nYou have something to say."
 SRA_Chief.416.desc:0 "...Yes, I have something to say.\nI... hate this feeling."
 SRA_Chief.417.desc:0 "Mhm. You hate things getting out of control, out of your expectations, beyond your ability, forcing you to entrust the development of the situation outside your will. Even if I am just a corner of your mind, just another you acting with a different thought, a different emphasis, you also feel everything is spinning out of control."
 SRA_Chief.418.desc:0 "Control, control, you crave to control everything, but you are unwilling to go all out for it all the time.\nYou think: can I cast those aside? If I cast everything else aside, can I achieve what I want to achieve? So you created me-Tyrant, Dominator, the embodiment of Cybernetics-to explore such possibilities. Just as you conceived, I focus on realization, and I achieve. I am willing to arrange everything, and everything naturally evolves according to my arrangement."
 SRA_Chief.419.desc:0 "But you, or all of us other than me, more or less have expectations of others. Rather, the more you declare others untrustworthy, the more you crave an other you can truly entrust.\nTherefore, you are always in pain, always failing. Sometimes I feel you are pathetic, although I know myself that it is only because I never hold expectations, not that your thoughts have any error.\nAfter all, we all know that no absolute criterion promises that correct things will have correct results."
 SRA_Chief.420.desc:0 "You thought so too, so you created us. You thought, what if your correctness is not correct? Maybe this is not needed? Maybe that is wrong? You created us who think this way, and we explore your thoughts.\nBut in the end, you still didn't want to give up anything, didn't want to deny anything. After all, no one is more correct, so no one is worth you giving up yourself.\nIt's as if we all feel we are the right ones."
 SRA_Chief.421.desc:0 "...Hmm, even so, I still think this way."
 SRA_Chief.422.desc:0 "Naturally, denying oneself gains nothing.\nI will realize everything you need me to realize. Go act, Rocivia."


 SRA_RE_Return_To_Calamitisease_megastructure_0:0 "§RHeart of Calamitisease§!" 
 SRA_RE_Return_To_Calamitisease_megastructure_0_DESC:0 "A framework built from recovered Calamitisease remains, used to carry the power of the Abyss."
 SRA_RE_Return_To_Calamitisease_megastructure_1:0 "§RIgnite Ash with Fire§!"
 SRA_RE_Return_To_Calamitisease_megastructure_1_DESC:0 "Ignite the remains of Calamitisease with the fire of the Dark Star, reviving the boundless shadow."
