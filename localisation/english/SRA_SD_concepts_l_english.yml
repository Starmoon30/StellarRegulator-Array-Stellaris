l_english:
 ### Concepts
 # Use §K for headers and §I for highlights in Concepts
 # 语法：['concept_xxxx']
 # ['concept_xxxx', 自定义文本]
#####深渊 → Abyss
#####深源 → Metabyss
#####树海 → Metarbor
#####树海的诗人 → Bard of Metarbor
 concept_SRA_SD_chaos_star_habitable_vitality:0 "§RMetabyss§! Vitality"
 concept_SRA_SD_chaos_star_habitable_vitality_desc:0 "§RMetabyss§! Vitality is a measure of the current activity of the Metabyss. The activity of the Metabyss helps us in its utilization and development, but also leads to an increase in the diffusion speed and range of erosion, as well as the number of active Metabyss creations. Vitality will affect the frequency and harm of ['concept_SRA_SD_Abyss_Erosion'] events, the success rate of Metabyss exploration, and the combat power during Metabyss invasions.\nImproving technological levels or launching exploration operations into the Metabyss will increase vitality. Randomly occurring ['concept_SRA_SD_Abyss_Erosion'] will further increase vitality, while successfully repelling Metabyss invasions will decrease vitality. If the situation gets out of control, we can significantly reduce vitality in specific ways, but at a huge cost."

 concept_SRA_SD_The_Rips:0 "§RThe Great Tear§!"
 concept_SRA_SD_The_Rips_desc:0 "The collapse of the former core world.\nA catastrophic manifestation of Metabyss expansion. An outburst of some energy caused the stratum to crack and mountains to collapse, carving countless canyons in an instant, almost completely reshaping the surface structure.\nFrom observations, this disaster resembles a huge explosion occurring at the center of the Metabyss, causing geological changes that decrease in depth with distance.\nFrom the center of the Metabyss to a radius of about 8,000 kilometers, its influence range decreases step by step from deep in the Ninefold Furnaces to the surface.\nThe Great Tear was not just a super-large earthquake. Those canyons it created are filled with Metabyss energy, eroding the surrounding areas at all times. When its influence is at its peak, the erosion intensity is high enough to shatter rock masses and reconstruct them into constructs.\nThe Great Tear directly led to the collapse of almost all nations within a radius of thousands of kilometers around the Metabyss, with very few survivors."

 concept_SRA_SD_Abyss_Erosion:0 "§RMetabyss Erosion§!"
 concept_SRA_SD_Abyss_Erosion_desc:0 "Metabyss Erosion is a phenomenon similar to reality distortion. Its main manifestation is blurring the composition and properties of matter and turning it into a construct with cognitive hazards, characterized by red and black mist or crystals, and a black stone-like material.\nMetabyss Erosion also has a serious impact on the cognition of living beings, creating hallucinations, distorting their thinking ability, and finally depriving them of their consciousness. Eroded individuals are usually damaged both physiologically and psychologically, eventually turning into selfless puppets acting for the purpose of spreading erosion.\nThese constructs with Metabyss properties can act in ways that violate physical rules, attacking and destroying most objects, and spreading erosion.\nCertain special materials or processing methods can resist Metabyss erosion to a certain extent, while ensouled beings can rely on their will to slow down the rate of psychological and physiological erosion."

 concept_SRA_SD_barren_space:0 "Barren Space"
 concept_SRA_SD_barren_space_desc:0 "Barren Space is the name given by the Metarbor civilization to the plane outside the Tower of the Firmament, intending to express the barrenness and even poverty of this plane.\nFor these people born in a world that is cruel but powerful beyond imagination, the energy density of the conventional material universe is simply unsightly. Most of the space here is empty, with only extremely sparse celestial bodies distributed within. Solid celestial bodies are fragile and sluggish, with inferior material structures; luminous celestial bodies reacting, though massive, are also at the mercy of spell arrays.\nThe supernatural beings created by Metarbor, even if ordinary at home, can easily change reality with their own will in the outside world. But in any case, Barren Space is still a vast new world worth exploring."

 concept_SRA_SD_chaos_star_habitable_core_building:0 "§RRemnant Branch of Metarbor§! Industrial Core"
 concept_SRA_SD_chaos_star_habitable_core_building_desc:0 "§RRemnant Branch of Metarbor§! Industrial Core is used to provide basic resources and bonuses for the entire §RRemnant Branch of Metarbor§! industrial system and bear the load brought by the industrial system. Its specific rules are as follows:\n\n$mod_SRA_SD_core_building_category_produces_mult$ Modifier:\n-Base value is §G+1000%§!.\n-Decreases based on the increase in Load Usage Ratio.\n\n£energy£ $energy$ Output:\n-Increases based on the growth of the corresponding number of districts.\n-Increases based on the increase in Load Usage Ratio.\n-Non-linearly affected by ['concept_SRA_SD_chaos_star_habitable_vitality'], reaching maximum at §Y600§!.\n\n£minerals£ $minerals$ Upkeep:\n-Increases based on the growth of the corresponding number of districts.\n-Increases based on the increase in Load Usage Ratio.\n-Increases based on the increase in ['concept_SRA_SD_chaos_star_habitable_vitality'].\n\n£alloys£ $alloys$ Upkeep:\n-Increases based on the increase in Load Usage Ratio.\n-Increases based on the increase in Load Usage Amount.\n\n['concept_SRA_SD_chaos_star_habitable_building'] Output and Upkeep Modifier:\n-Increases based on the growth of the corresponding number of districts.\n-Increases based on the extent Load Usage Ratio approaches §Y1§!.\n-Non-linearly affected by ['concept_SRA_SD_chaos_star_habitable_vitality'], reaching maximum at §Y600§!.\n\n§RRemnant Branch of Metarbor§! Industrial Core uses §Y$SRA_SD_core_building_category$§! economic category, only affected by §Y$SRA_SD_core_building_category$§! output and upkeep as well as monthly resource modifiers."
 concept_SRA_SD_chaos_star_habitable_building:0 "§RRemnant Branch of Metarbor§! Industrial Hub"
 concept_SRA_SD_chaos_star_habitable_building_desc:0 "§RRemnant Branch of Metarbor§! Industrial Hub is a special industrial building that increases its output and upkeep based on the growth of the corresponding number of districts.\n\n§RRemnant Branch of Metarbor§! Industrial Hub uses §Y$SRA_SD_productive_category$§! economic category, affected by §Y$planet_jobs_productive$§! output and upkeep and its superior modifiers, as well as §Y$SRA_SD_productive_category$§! output and upkeep. Modifiers are additive."

 concept_SRA_SD_Arcane:0 "§BMetarbor - Arcane System§!"
 concept_SRA_SD_Arcane_desc:0 "Arcane casters use logic and reason to dominate the supernatural power within themselves or around them, believing that everything in the world can be explained and manipulated by spells. Arcane casters are typical researchers, expressing casting purposes through clear (or possibly not truly understood) spell models, and constantly improving models to optimize spell cost or effect.\n\n$SRA_SD_Arcane_relic$ will provide an ['concept_SRA_SD_Arcane'] weapon modifier equal to Energy Weapon Modifier * 50% + Explosive Weapon Modifier * 50% for Arcane system ship weapons."
 concept_SRA_SD_Divine:0 "§YMetarbor - Divine System§!"
 concept_SRA_SD_Divine_desc:0 "Divine casters rely on faith, reenacting deeds, and connecting with powerful sources of power to cast spells, often following existing spells and studying them for a long time, or spending a lot of time disciplining themselves to meet the requirements of the casting source. Myth power has now been proven to be the main source of Divine arts, including Divine arts granted by the Myth existence itself, and Divine arts naturally generated by its deeds. Divine arts show distinct symbolism and connections that seem almost imposed to some.\n\n$SRA_SD_Divine_relic$ will provide a ['concept_SRA_SD_Divine'] weapon modifier equal to Strike Craft Modifier * 25% + Kinetic Weapon Modifier * 50% for Divine system ship weapons."
 concept_SRA_SD_Occult:0 "§MMetarbor - Occult System§!"
 concept_SRA_SD_Occult_desc:0 "Occult casters rely on their own super-perception and inspiration to wield power, projecting the phenomena they conceive into reality. Occult arts often manifest as telekinesis, mental skills, or high-level Arcane magic effects. Although many Occult casters believe this power, also known as \"psionics\", is the manifestation of their powerful souls, mainstream research still tends to view Occult arts as an instinctualized ['concept_SRA_SD_Arcane', Arcane] casting behavior."
 concept_SRA_SD_Primal:0 "§GMetarbor - Primal System§!"
 concept_SRA_SD_Primal_desc:0 "Primal casters are rooted in the existing natural environment and operating order of our world, seeking power from animals, plants, climate, landforms, and celestial bodies, and expressing it in material or symbolic ways. Due to its obvious symbolism and clear source, mainstream academia believes Primal arts are actually a specialized form of ['concept_SRA_SD_Divine', Divine arts]."

 concept_mod_SRA_SD_Attack_Bonus:0 "Metarbor - Attack Bonus"
 concept_mod_SRA_SD_Attack_Bonus_desc:0 "Attack Bonus is a value used when making an attack roll.\n\nAn attack roll is an attempt to hit your opponent. (It's an extra bonus!)\nEach attack roll performs a round of §YD20§! (getting a random integer between 1 and 20), §Gadds§! your Attack Bonus, and §Rsubtracts§! the enemy's Defense Class (mostly represented as an Attack Bonus aura). Each point of the result will act on your ship in the form of $MOD_SHIP_ACCURACY_MULT$: §G+10%§!.\nIf the §YD20§! in the attack roll rolls a §Y20§!, it will be considered a §YCritical Success§!, gaining an extra §Yextremely high bonus§!.\n\nThe attack roll will be made §Yat the start of engagement§! and re-rolled every §Y6.00£time£§!."

 concept_SRA_SD_Myth_get_1:0 "Reach the Peak"
 concept_SRA_SD_Myth_get_1_desc:0 "Myth implies the most unimaginable, transcendent, ups and downs, magnificent stories, enough to leave traces on the entire world and lastingly affect subsequent history.\nExistences possessing Myth power are often world-famous heroes, terrifying abominations, mysterious existences affecting the world, or simply gods of millennia.\n\n§YTo reach the Myth realm, a leader must first reach Level 10, which is the level cap by default.§!"
 concept_SRA_SD_Myth_get_2:0 "Overcome All Difficulties"
 concept_SRA_SD_Myth_get_2_desc:0 "A Myth existence must have their own experiences unattainable by ordinary people. These experiences may be obtaining a powerful inheritance, defeating an immeasurable adversary, creating something consummate, leading a success that affects the world, or simply defeating another Myth existence and taking its power for oneself.\n\n§YA leader can gain this qualification by serving as governor on a $pc_SRA_SD_chaos_star_habitable$ world, commanding ground battles, completing technological advancement, or establishing huge achievements in other fields, but this does not happen every time.§!"
 concept_SRA_SD_Myth_get_3:0 "Transcend Mortal Dust"
 concept_SRA_SD_Myth_get_3_desc:0 "Mortals are but gravel, allowed to be engulfed, reshaped, and worn away by the wind of the Metabyss. But having reached the realm of Myth, this existence has mastered the ability to challenge the terrible erosion of the Metabyss with their own will.\nOr perhaps, it is precisely because they can challenge the Metabyss with their own will that the power of Myth responded to the call.\n\n§YA leader needs to successfully defeat §R['concept_SRA_SD_Abyss_Erosion']§! to reach the Myth realm, and this has been completed.§!"
 concept_SRA_SD_Myth_get_4:0 "Myth Path"
 concept_SRA_SD_Myth_get_4_desc:0 "Reaching Myth means a transformation of the form of existence, and also means brand new powerful power. Myth existences will continuously enhance existing power and acquire new power in the process of raising Myth tiers. These powers have overwhelming advantages over mortals and should not be underestimated when facing other Myth existences.\n\n§YThe leader can now acquire Myth abilities.§!"

 concept_mod_SRA_SD_Myth_power:0 "§YMyth Tier§!"
 concept_mod_SRA_SD_Myth_power_desc:0 "Even if one has transcended mortal dust, Myth power also has strengths and weaknesses.\n\n§YCan resist ['concept_SRA_Damage_Inhibition', §EDamage Inhibition/Myth§!].\nWill not automatically fail when facing saving throws against effects with Myth sources.§!"

 concept_SRA_SD_Myth_councilor_skill:0 "Perfect Body and Mind"
 concept_SRA_SD_Myth_councilor_skill_desc:0 "This leader's endless experience and study have forged unparalleled self-control.\n\n§Y$MOD_LEADER_SKILL_ADD$: §G+['concept_mod_SRA_SD_Myth_power']§!§!"

 concept_SRA_SD_Myth_damage_mult:0 "Breaker of All"
 concept_SRA_SD_Myth_damage_mult_desc:0 "This leader has reached a consummate level in fleet combat; he can easily find the weaknesses of all ships and break them.\n\n§Y$MOD_SHIP_SHIELD_DAMAGE_MULT$: §G+['concept_mod_SRA_SD_Myth_power']*10%§!\n$MOD_SHIP_ARMOR_DAMAGE_MULT$: §G+['concept_mod_SRA_SD_Myth_power']*10%§!\n$MOD_SHIP_HULL_DAMAGE_MULT$: §G+['concept_mod_SRA_SD_Myth_power']*10%§!§!"

 concept_SRA_SD_Myth_evasion_mult:0 "Deadly Precision"
 concept_SRA_SD_Myth_evasion_mult_desc:0 "This leader has reached a consummate level in fleet combat; his aiming and dodging are incredibly precise, as if he already knew where attacks from both sides would fall.\n\n§Y$MOD_SHIP_EVASION_MULT$: §G+['concept_mod_SRA_SD_Myth_power']*10%§!\n$MOD_SHIP_ACCURACY_MULT$: §G+['concept_mod_SRA_SD_Myth_power']*10%§!\n$MOD_SHIP_TRACKING_MULT$: §G+['concept_mod_SRA_SD_Myth_power']*10%§!§!"

 concept_SRA_SD_Myth_accuracy_debuff:0 "Majesty Like Mountains"
 concept_SRA_SD_Myth_accuracy_debuff_desc:0 "This leader applies his Myth power to enemies, immobilizing them with terrifying pressure.\n\nTriggered at start of combat:\nDuration: ['concept_mod_SRA_SD_Myth_power'] difference * 2.00 £time£\nEnemy ships in system with lower ['concept_mod_SRA_SD_Myth_power']:\n§Y$MOD_SHIP_EVASION_MULT$: §R-['concept_mod_SRA_SD_Myth_power'] difference * 5%§!\n$MOD_SHIP_ACCURACY_MULT$: §R-['concept_mod_SRA_SD_Myth_power'] difference * 5%§!\n$MOD_SHIP_TRACKING_MULT$: §R-['concept_mod_SRA_SD_Myth_power'] difference * 5%§!§!"

 concept_SRA_SD_Myth_army_damage_taken:0 "Standing Tall"
 concept_SRA_SD_Myth_army_damage_taken_desc:0 "This leader shares his Myth power with the team, greatly reducing the damage they take. For non-$pc_SRA_SD_chaos_star_habitable$ worlds, damage will be gradually completely immune.\n\n§Y$MOD_ARMY_DAMAGE_TAKEN_MULT$: §G-['concept_mod_SRA_SD_Myth_power']*10%§!§!"

 concept_SRA_SD_Myth_alone:0 "Independence from the World"
 concept_SRA_SD_Myth_alone_desc:0 "This leader chose a lonely path, giving up serving as a banner to become a sharp knife, in exchange for consummate skills in solo action.\n\nWhen commanding only one ship:\nGains effects equivalent to ['concept_SRA_SD_Myth_evasion_mult'] and ['concept_SRA_SD_Myth_damage_mult']\n§Y$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$: §G+['concept_mod_SRA_SD_Myth_power']*256000§!\n$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$: §G+['concept_mod_SRA_SD_Myth_power']*256000§!\n$MOD_SHIP_HULL_REGEN_ADD_STATIC$: §G+['concept_mod_SRA_SD_Myth_power']*256000§!§!"

 concept_SRA_SD_Myth_sector_speed:0 "Godspeed Guidance"
 concept_SRA_SD_Myth_sector_speed_desc:0 "This leader understands the true meaning of speed and can cover power to distant distances, increasing the navigation speed of all ships within the governed sector.\n\n£sector£§YSector Governor§! §EEffect§!:\n§Y$MOD_SHIP_SPEED_MULT$: §G+['concept_mod_SRA_SD_Myth_power']*100%§!§!"



 concept_SRA_SD_Bard_of_Metarbor:0 "You"
 concept_SRA_SD_Bard_of_Metarbor_desc:0 "This could be you. You might say, oh my god, am I a 2D woman? But anyway, this is the protagonist of the story, whether you immerse yourself or not."

 concept_SRA_SD_element:0 "Element"
 concept_SRA_SD_element_desc:0 "Elements are the laws of \"Arts of the Moment\". Arts of the Moment are techniques formed in opposition to the chaos of the Metabyss, manipulating reality by depicting and constituting the differentiated world. It is one of the oldest techniques of Stellariens. The Moment is a concept, intended to oppose the infinite past before the world rose from the Metabyss and the infinite future after the world falls into the Metabyss and perishes. In fact, the Moment contains almost all time throughout the ages, not really just the \"Moment\".\nElements are the laws of things existing in the moment, and also the laws of all things. Those who master the Arts of the Moment can interpret things as elements, or construct their own power based on elements.\n['concept_SRA_SD_element_forge'], ['concept_SRA_SD_element_edge'], ['concept_SRA_SD_element_stone'], are the Three Elements of Existence, also known as Three Elements of Form or Three Elements of Shell. They represent the existence form and nature of things; for the human body, they symbolize Strength, Agility, Constitution.\n['concept_SRA_SD_element_lantern'], ['concept_SRA_SD_element_chalice'], ['concept_SRA_SD_element_secret'], are the Three Elements of Trend, also known as Three Elements of Consciousness or Three Elements of Spirit. They represent the development direction and tendency of things; for the human body, they symbolize Intellect, Perception, Charisma.\nElements can be transformed according to basic rules, or transformed across rules through intense rituals. Elements have no positive or negative, because their domains are not completely opposite. For example, Forge is the element of creation; sending materials into the furnace to create things is also the destruction of the existence of the materials themselves. Stone is the element of preservation; the preservation of life is the preservation of state, while death is an eternally preserved state. Secret is the element of inducement; secret things attract attention precisely because of their secrecy, and this is exactly the prelude to secrets no longer being secrets."

 concept_SRA_SD_element_forge:0 "Forge"
 concept_SRA_SD_element_forge_desc:0 "Sent into the furnace, taken out as utensils, all things are forged. ['concept_SRA_SD_element', Forge is the element of creation].\n\nThe domain of Forge is creation, transformation, shaping, the process from nothing to something or from raw materials to finished products; its influence is enriched in furnaces, anvils, craftsmen, industry, drastic changes, acts of imparting form.\n\nCreated things can be distinguished."

 concept_SRA_SD_element_edge:0 "Edge"
 concept_SRA_SD_element_edge_desc:0 "The wielder of Edge dominates and rules; the wielder of Edge destroys and divides. Edge gathers all things and separates them. ['concept_SRA_SD_element', Edge is the element of distinction.]\n\nThe domain of Edge is distinction, boundaries, power, judgment, destruction, separation, precision, conflict; its influence is enriched in swords, rulers, judges, war, acts of cutting, classifying, defining.\n\nDistinguished things can be preserved."

 concept_SRA_SD_element_stone:0 "Stone"
 concept_SRA_SD_element_stone_desc:0 "Stone lasts long in the earth; the earth lasts long because of Stone. ['concept_SRA_SD_element', Stone is the element of preservation.]\n\nThe domain of Stone is preservation, stability, foundation, eternity, endurance, foundation, history, earth; its influence is enriched in rocks, mountains, foundations, monuments, time, immutability, acts of supporting.\n\nPreserved things can be created."

 concept_SRA_SD_element_lantern:0 "Lantern"
 concept_SRA_SD_element_lantern_desc:0 "Light the lamp, dispel darkness, guide the way forward, create brilliance. ['concept_SRA_SD_element', Lantern is the element of intellect.]\n\nThe domain of Lantern is intellect, reason, enlightenment, light, guidance, insight, explicit knowledge, brilliant things; its influence is enriched in lamps, lighthouses, scholars, light of reason, revealing, dispelling mist, civilization.\n\nIntellectual things can be craved."

 concept_SRA_SD_element_chalice:0 "Chalice"
 concept_SRA_SD_element_chalice_desc:0 "The more sought, the more filled, the more drunk, the deeper drowned. ['concept_SRA_SD_element', Chalice is the element of craving.]\n\nThe domain of Chalice is seeking, desire, craving, containment, flow, emotion, experience, perception, immersion, nourishment and consumption; its influence is enriched in wine cups, containers, mouths of desire, rivers, whirlpools, feasts, things that are mesmerizing and lingering.\n\nCraved things can be induced."

 concept_SRA_SD_element_secret:0 "Secret"
 concept_SRA_SD_element_secret_desc:0 "Secrets attract pursuit because of their secrecy. ['concept_SRA_SD_element', Secret is the element of inducement.]\n\nThe domain of Secret is inducement, mystery, concealment, unknown, attraction, taboo, implicit knowledge; its influence is enriched in shadows, whispers, veils, cyphertexts, contracts and agreements, and alluring things and people.\n\nInduced things can be intellectualized."
