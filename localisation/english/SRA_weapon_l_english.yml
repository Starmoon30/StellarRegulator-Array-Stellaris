 MEDIUM_SRA_T1_weapon_SML_Space_Whale_Weapon_DESC:0 "Experimental energy weapon built using Stellarcrystal Technology, capable of releasing destructive energy beams."
 LARGE_SRA_T1_weapon_SML_Space_Whale_Weapon:0 "Prototype Crystal Energy Discharger" 
 LARGE_SRA_T1_weapon_SML_Space_Whale_Weapon_DESC:0 "Experimental energy weapon built using Stellarcrystal Technology, capable of releasing destructive energy beams."

 SRA_T1_weapon_X_Laser:0 "Prototype Crystal Lance"
 SRA_T1_weapon_X_Laser_DESC:0 "Experimental large beam weapon built using Stellarcrystal Technology, more effective against shields compared to conventional lance weapons."

 SRA_T1_weapon_T_Laser:0 "Focused Prototype Crystal Lance"
 SRA_T1_weapon_T_Laser_DESC:0 "Experimental giant beam weapon built using Stellarcrystal Technology, more effective against shields compared to conventional lance weapons. This model greatly increased power."

 SRA_T1_weapon_H:0 "Prototype Crystal Strike Craft Group"
