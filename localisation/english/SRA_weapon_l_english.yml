###特殊武器###
 SRA_T_weapon_supreme:0 "§BSRA - Universal Collapse§!"
 SRA_T_weapon_supreme_DESC:0 "Damage: §RApprox. 64000000.00§!\nCooldown: §YApprox. 32.00£time£§!\nOn hit: Apply 8.00£time£ of ['modifier:SRA_T_weapon_supreme_buff'] to target's fleet\n§BMain gun of Spear_Of_Galaxy_Zenith. Direct hit from devastating Star-Killer Plane-Tearing Weapon will \"banish\" hit existence and create a dazzling nova; energy release sufficient to shake surrounding celestial bodies, even shattering spatial structure within a certain range.§!\n"

 SRA_Crisis_G_weapon_collision:0 "§BCollision§!"
 SRA_Crisis_G_weapon_collision_DESC:0 "Damage: §RApprox. 20480000.00§!\nCooldown: §YApprox. 6.40£time£§!\n§BHighly active ['concept_SRA_Stellarcrystal_Fractal'] will dissociate contacted matter and absorb it.§!"

 SRA_Crisis_G_weapon_kind_laser:0 "§BSRA - Annihilation of Thousand Stars§!"
 SRA_Crisis_G_weapon_kind_laser_DESC:0 "Damage: §RApprox. 64000000.00§!\nCooldown: §YApprox. 320.00£time£§!\n§BSpecialized Annihilation Main Weapon, directly docking with energy storage array. One fire can deplete nearly all energy reserves. Direct hit from this devastating Star-Killer Plane-Tearing Weapon will \"banish\" hit existence and create a dazzling nova; energy release sufficient to shake surrounding celestial bodies, even shattering spatial structure within a certain range.§!\n"
 SRA_T_weapon_supreme_buff:0 "§BPhase Disintegration§!"
 #歼星

 SRA_T4_weapon_planet_killer:0 "§BSRA - Nova Termination§!"
 SRA_T4_weapon_planet_killer_DESC:0 "§BThis weapon can use directional plane tearing to destroy the plane itself at target coordinates. Directly hit targets will be \"banished\", while massive energy released simultaneously will severely destroy nearby spacetime and tear apart any macroscopic structure.§!§YWill adjust output based on different targets. Its star-killer attack can completely shatter planets and ring worlds, wipe out outer atmosphere of gas giants, completely destroy orbital habitats. If targeting a star, guided energy burst will destroy the entire star system; the star itself will collapse into a black hole in a dazzling supernova explosion.§!"
 SRA_T4_weapon_planet_killer_ACTION:0 "Attack with §B\"Nova Termination\"§!"
 SRA_T4_weapon_planet_killer_ACTION_DESC:0 "Use Star-Killer Plane-Tearing Weapon §B\"Nova Termination\"§! to attack target; damage effect on target depends on target type."
 MESSAGE_DESC_FOR_SRA_T4_weapon_planet_killer:0 "Destroyed"
 FLEETORDER_DESTROY_PLANET_WITH_SRA_T4_weapon_planet_killer:0 "Attack $PLANET|Y$ with Star-Killer Plane-Tearing Weapon §B\"Nova Termination\"§!"
 message_SRA_T4_weapon_pk_weapon_killed_star_desc:0 "$SRA_target_planet|Y$ was completely destroyed by Star-Killer Plane-Tearing Weapon attack from $SRA_attacker|Y$'s $SRA_attacker_ship|Y$; $SRA_target_system|Y$ star system was destroyed in a dazzling supernova explosion."
 message_SRA_T4_weapon_pk_weapon_killed_planet_desc:0 "$SRA_target_planet|Y$ was completely destroyed by Star-Killer Plane-Tearing Weapon attack from $SRA_attacker|Y$'s $SRA_attacker_ship|Y$."
 message_SRA_T4_weapon_pk_weapon_swept_planet_desc:0 "Intelligent life on $SRA_target_planet|Y$ was completely wiped out by Star-Killer Plane-Tearing Weapon attack from $SRA_attacker|Y$'s $SRA_attacker_ship|Y$."

 SRA_T4_weapon_planet_killer_L_Laser:0 "§BSRA - Nova Termination§!"
 SRA_T4_weapon_planet_killer_L_Laserr_DESC:0 "This devastating plane tearing beam originates from activated Star-Killer Plane-Tearing Weapon §B\"Nova Termination\"§!. Phase Space Projection constructed by Spacetime Phase Engine can fire extremely powerful attacks, rapidly obliterating all targets within range."


 SRA_planet_killer.11.name:0 "Annihilate Star"
 SRA_planet_killer.11.desc:0 "As Star-Killer Plane-Tearing Weapon on §H[From.From.GetName]§! completed its task of annihilating the star, brightness of §H[From.GetName]§! instantly increased hundreds of times, then gradually dimmed. Sensors indicate this star has collapsed into a singularity. Most energy overflowing from plane rift completely destroyed §H[From.GetName]§!, while the rest destroyed other celestial bodies in §H[From.solar_system.GetName]§! system together."
 SRA_planet_killer.11.a:0 "It fell silent."
 SRA_planet_killer.11.b:0 "Another monument!"

 SRA_planet_killer.12.name:0 "Destroy Planet"
 SRA_planet_killer.12.desc:0 "As Star-Killer Plane-Tearing Weapon on §H[From.From.GetName]§! completed its task of destroying the planet, §H[From.GetName]§! also broke apart in a violent explosion, becoming one of countless celestial bodies floating in the sea of stars unable to support intelligent life. Whatever wealth it once possessed vanished into ashes with the destruction of §H[From.GetName]§!."
 SRA_planet_killer.12.a:0 "Bloom, then end."
 SRA_planet_killer.12.b:0 "So, where is the next one?"

 SRA_planet_killer.13.name:0 "Sweep World"
 SRA_planet_killer.13.desc:0 "As Star-Killer Plane-Tearing Weapon on §H[From.From.GetName]§! completed its task of sweeping the world, our life sensors can no longer capture any intelligent life signals on §H[From.GetName]§!. Whether organic creatures, rocks, or machines cast in steel, they have all disappeared forever in the gentle wipe of the plane tearing weapon."
 SRA_planet_killer.13.a:0 "So quiet."
 SRA_planet_killer.13.b:0 "Now they finally shut up."

 SRA_requires_no_compact_star_star_killer:0 "§RTarget cannot be a compact celestial body.§!"
 SRA_requires_outside_border_star_killer:0 "§RTarget cannot be within own borders.§!"
 SRA_requires_a_star_star_killer:0 "§RTarget must correspond to configured attack mode.§!"
 SRA_requires_declares_war_star_killer:0 "§RWe need to configure weapon mode first.§!"
 SRA_requires_no_pacifist_star_killer:0 "§ROur §Y$ethic_pacifist$§! governing ethics do not allow us to use this weapon.§!"
 SRA_requires_no_ancient_system:0 "§RAncient defense system prevents us from attacking this star system.§!"
 SRA_requires_no_zeta_crisis_system:0 "§RPsionic activity of Shroud invasion army prevents us from attacking this star system.§!"
 SRA_requires_no_exd_system:0 "§RPsionic activity of Extradimensional Invaders prevents us from attacking this star system.§!"
 SRA_requires_no_contingency_system:0 "§RContingency defense system prevents us from attacking this star system.§!"
 SRA_requires_no_special_system:0 "§RFor some unknown reasons, we cannot attack this target.§!"
 SRA_requires_no_is_cloaked:0 "§RWe need to decloak to use star-killer weapons.§!"



 SRA_Rokia_dragon_weapon_planet_killer_ACTION:0 "Attack with §R\"Desolation Drive\"§!"
 SRA_Rokia_dragon_weapon_planet_killer_ACTION_DESC:0 "Use Star-Killer Weapon §R\"Desolation Drive\"§! to attack target, destroying the resistance will of the entire world, making them directly submit to us."
 FLEETORDER_SRA_Rokia_dragon_weapon_planet_killer_ACTION_DESC:0 "Use Star-Killer Weapon §R\"Desolation Drive\"§! to attack target, destroying the resistance will of the entire world, making them directly submit to us."
 MESSAGE_DESC_FOR_SRA_Rokia_dragon_weapon_planet_killer:0 "Dominated"
 FLEETORDER_DESTROY_PLANET_WITH_SRA_Rokia_dragon_weapon_planet_killer:0 "Directly dominate $PLANET|Y$ with Star-Killer Weapon §R\"Desolation Drive\"§!"
 message_SRA_Rokia_dragon_weapon_planet_killer_desc:0 "Resistance will of intelligent life on $SRA_target_planet|Y$ was destroyed by §R\"Desolation Drive\"§! attack from $SRA_attacker|Y$'s $SRA_attacker_ship|Y$."

 SRA_planet_killer.14.name:0 "Dominate World"
 SRA_planet_killer.14.desc:0 "As §R\"Desolation Drive\"§! on §H[From.From.GetName]§! completed its task, we have received news that §H[From.GetName]§! has been brought under domination. Whether organic creatures, rocks, or machines cast in steel, their resistance consciousness has disappeared forever in the gentle wipe of terrifying power."
 SRA_planet_killer.14.a:0 "Interesting."
 SRA_planet_killer.14.b:0 "They were lucky to escape death."
