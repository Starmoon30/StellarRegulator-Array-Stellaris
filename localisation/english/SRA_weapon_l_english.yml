#####T4
 SRA_T4_weapon_SML_Mass_Drivers:0 "§BSRA - Star Arc Shatterer§!"
 SRA_T4_weapon_SML_Mass_Drivers_DESC:0 "§BThis highly versatile dual-mount rapid-fire cannon is flexible and precise, capable of handling almost all uses. The short bursts of energy beams it fires possess powerful penetration, difficult to block by shields or armor.§!"
 SMALL_SRA_T4_weapon_SML_Mass_Drivers:0 "§BSRA - Star Arc Shatterer§!"
 SMALL_SRA_T4_weapon_SML_Mass_Drivers_DESC:0 "$SRA_T4_weapon_SML_Mass_Drivers_DESC$"
 MEDIUM_SRA_T4_weapon_SML_Mass_Drivers:0 "§BSRA - Star Arc Shatterer§!" 
 MEDIUM_SRA_T4_weapon_SML_Mass_Drivers_DESC:0 "$SRA_T4_weapon_SML_Mass_Drivers_DESC$"
 LARGE_SRA_T4_weapon_SML_Mass_Drivers:0 "§BSRA - Star Arc Shatterer§!" 
 LARGE_SRA_T4_weapon_SML_Mass_Drivers_DESC:0 "$SRA_T4_weapon_SML_Mass_Drivers_DESC$"

 SRA_T4_weapon_L_Particle_Launcher:0 "§BSRA - Void Render§!"
 SRA_T4_weapon_L_Particle_Launcher_DESC:0 "§BThis heavy particle cluster artillery is heavy and powerful. Its projectile causes matter erasure effects with excellent penetration and triggers powerful secondary damage, even briefly affecting the stability of spatial structure itself.§!\n\n§YThis weapon is a specialized Large Weapon, achieving superior performance compared to conventional Large Weapons by maximizing the potential of the Large Weapon slot, at the cost of having no Small/Medium models and high expense.§!"
 SRA_T4_weapon_L_Laser:0 "§BSRA - Spear of Destiny§!"
 SRA_T4_weapon_L_Laser_DESC:0 "§BThis heavy space tearing weapon fires extremely precise death rays, destroying spatial structure along the line instantly upon firing, immediately destroying any hit ordered structure and creating dazzling light bursts.§!\n\n§YThis weapon is a specialized Large Weapon, achieving superior performance compared to conventional Large Weapons by maximizing the potential of the Large Weapon slot, at the cost of having no Small/Medium models and high expense.§!"

 SRA_T4_weapon_X_Laser:0 "§BSRA - Light of Return to Void§!"
 SRA_T4_weapon_X_Laser_DESC:0 "§BThis weapon can destroy spacetime structure in the target direction. Matter along the line will be directly converted to pure energy and cause secondary damage to surroundings; matter not directly hit will be torn to pieces in spacetime turbulence.§!"

 SRA_T4_weapon_T_Laser:0 "§BSRA - Star of Dawn§!"
 SRA_T4_weapon_T_Laser_DESC:0 "§BThis weapon tears a slit in the plane. Matter along the path will disappear into chaotic space outside the plane; meanwhile, massive energy pouring in will cause huge destruction to surroundings. Due to the plane's self-stability, this slit will close quickly, thus not causing long-term plane structural damage.§!"

 SRA_T4_weapon_H:0 "§BSRA - Hunt of Deep Universe§!"
 SRA_T4_weapon_H_DESC:0 "§BThese wandering hunters travel between stars, arming themselves with particle jets and energy missiles. As guards of warships, they are killers attacking from enemy ship weak points, and even more so nightmares of enemy missiles and strike craft.§!"

 SRA_T4_weapon_H_DEM:0 "§BSRA - Instant Flash Light§!"
 SRA_T4_weapon_H_DEM_DESC:0 "§BRather than calling it a strike craft, better to consider it a disposable energy torrent launcher. These specialized drones can be rapidly deployed at the start of engagement and immediately release powerful long-range attacks. Limited by size, this drone basically cannot fire multiple times during engagement, only waiting to be recovered and re-prepared after battle.§!"

 SRA_T4_weapon_G:0 "§BSRA - Universal Tracking Fire§!"
 SRA_T4_weapon_G_DESC:0 "§BMissile system used by StellarRegulator Array. Complex effects occurring after this type of energy torpedo hits the target will cause spatial structure distortion or even tearing within a small range, possessing quite powerful damage capability against various types of targets, and difficult to intercept.§!"

 SRA_T4_weapon_P:0 "§BSRA - Crown of Radiance§!"
 SRA_T4_weapon_P_DESC:0 "§BThis advanced point defense system watches out for any incoming enemy. Pulse beam rapid fire can easily destroy incoming missiles or strike craft, and even has considerable threat capability against warships.§!"

######T3
 SRA_T3_weapon_SML_Plasma:0 "§YLattice - Source Crystal Ravager§!"
 SRA_T3_weapon_SML_Plasma_DESC:0 "§YCSC-191-LMS Lattice Aggregation Launcher\nArtillery group built using ['concept_SRA_Composite_Crystal_Lattice'] technology, releasing unique energy clusters capable of penetrating shields and main armor, directly damaging the hull.§!"
 SMALL_SRA_T3_weapon_SML_Plasma:0 "§YLattice - Source Crystal Ravager§!"
 SMALL_SRA_T3_weapon_SML_Plasma_DESC:0 "§YCSC-191-S Lattice Aggregation Launcher\nArtillery group built using ['concept_SRA_Composite_Crystal_Lattice'] technology, releasing unique energy clusters capable of penetrating shields and main armor, directly damaging the hull.§!"
 MEDIUM_SRA_T3_weapon_SML_Plasma:0 "§YLattice - Source Crystal Ravager§!" 
 MEDIUM_SRA_T3_weapon_SML_Plasma_DESC:0 "§YCSC-191-M Lattice Aggregation Launcher\nArtillery group built using ['concept_SRA_Composite_Crystal_Lattice'] technology, releasing unique energy clusters capable of penetrating shields and main armor, directly damaging the hull.§!"
 LARGE_SRA_T3_weapon_SML_Plasma:0 "§YLattice - Source Crystal Ravager§!" 
 LARGE_SRA_T3_weapon_SML_Plasma_DESC:0 "§YCSC-191-L Lattice Aggregation Launcher\nArtillery group built using ['concept_SRA_Composite_Crystal_Lattice'] technology, releasing unique energy clusters capable of penetrating shields and main armor, directly damaging the hull.§!"

 SRA_T3_weapon_X_Laser:0 "§YLattice - Annihilation Flow Carrier Cannon§!"
 SRA_T3_weapon_X_Laser_DESC:0 "§YCSC-07-X Lattice Tearing Beam\nLarge beam weapon built using ['concept_SRA_Composite_Crystal_Lattice'] technology, capable of causing energy level drop on trajectory, making hit matter structure disintegrate and release large amounts of energy, causing severe secondary damage.§!"

 SRA_T3_weapon_T_Laser:0 "§YLattice - Celestial Shine Flow§!"
 SRA_T3_weapon_T_Laser_DESC:0 "§YCSC-83-T Lattice Tearing Lance\nGiant beam weapon built using ['concept_SRA_Composite_Crystal_Lattice'] technology, capable of causing spatial structure tearing on trajectory. Such attacks will directly annihilate matter and create dazzling light bursts, producing extremely powerful secondary destruction.§!"

 SRA_T3_weapon_H:0 "§YLattice - Derivation Shine Sky Blade§!"
 SRA_T3_weapon_H_DESC:0 "§YCSC-117-H Lattice Strike Craft Group\nStrike craft group built using ['concept_SRA_Composite_Crystal_Lattice'] technology, using miniaturized structure disruption beams to attack enemy hull weak points.§!"

 SRA_T3_weapon_G:0 "§YLattice - Fallen Sun Photovoltaic§!"
 SRA_T3_weapon_G_DESC:0 "§YCSC-38-G §YLattice Particle Missile System§!\nMissile system built using ['concept_SRA_Composite_Crystal_Lattice'] technology, firing missiles composed of high-energy particle clusters, causing severe spatial disruption effects upon impact to destroy hostile ships.§!"

 SRA_T3_weapon_P:0 "§YLattice - Photon Rift Strike§!"
 SRA_T3_weapon_P_DESC:0 "§YCSC-1130-P Lattice Point Defense System\nPoint defense system built using ['concept_SRA_Composite_Crystal_Lattice'] technology, using miniaturized structure disruption beams to precisely intercept incoming missiles and strike craft.§!"

