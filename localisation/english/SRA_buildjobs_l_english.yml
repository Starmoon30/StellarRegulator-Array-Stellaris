 decision_SRA_city_project:0 "§BStreaming Light Star Realm Project§!"
 decision_SRA_city_project_desc:0 "Pluck the bright pearl from the sky and inlay it above the mountains and seas."
 decision_SRA_city_project_effects:0 "Transforms the planet into a §Y$pc_SRA_city$§!, significantly increasing §Yresource production§! and §Yplanetary effects§!, unlocking special £district£ §YStreaming Light Star Realm Districts§! that provide high-quality £job_SRA_world_machine_job£ §YStreaming Light Star Realm Jobs§!. As a cost, the planet's natural resources will be §Runavailable for exploitation§!."

 SRA_buildjobs.200.name:0 "§BStreaming Light Star Realm§!: [Root.GetName] Reshaped"
 SRA_buildjobs.200.desc:0 "Layers of advanced structures have finally completely covered the planet's surface, reaching deep into the core.\n\nOnly a few years have passed since the implementation of this grand plan, but it is already hard to recall what [Root.GetName] looked like before. Whether it was the simple accumulation of gravity or the so-called uncanny workmanship of nature, it is all history now. Looking out, one sees only Starlight configurations stretching for thousands of miles.\n\nThis place was once ruled by pathetic laws of blind idiocy for a long time, but now, it will endure for eons in the form of our supreme design, tempered thousands of times."
 SRA_buildjobs.200.a:0 "Glory everlasting."

