 planet_SRA_orbital_ring_Buff_1:0 "§BCaeliarcus Orbital Ring§!"
 planet_SRA_orbital_ring_Buff_1_desc:0 "§BThe presence of a Caeliarcus Orbital Ring connects the planet's entire industrial system with space, providing immense assistance in transportation and coordination, and expanding industrial distribution patterns.§!"

 pc_SRA_city:0 "§BStreaming Light Star Realm§!"
 pc_SRA_city_adj:0 "§BStreaming Light Star Realm§!"
 pc_SRA_city_desc:0 "A planet seamlessly integrated with the §BCaeliarcus Orbital Ring§!. Meticulously crafted complex structures cover it layer by layer, interlocking like gears. The entire planet is planned with reason and order, closely connected and joined everywhere. Every building is an expression of extreme efficiency, and every corner is a crystallization of design."
