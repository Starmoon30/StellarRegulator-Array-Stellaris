 SRA_orbital_ring_megastructure_0:0 "§BCaeliarcus Orbital Ring§!"
 SRA_orbital_ring_megastructure_0_MEGASTRUCTURE_DETAILS:0 "An advanced orbital ring providing planetary defense and expanded functions. It will replace the conventional orbital ring."
 SRA_orbital_ring_megastructure_0_DESC:0 "The Caeliarcus Orbital Ring is designed to expand the production and construction capabilities of conventional planets, hosting additional industries, and providing planetary defense and military industrial support. §BUnlocks Planetary Decisions.§!"
 SRA_orbital_ring_megastructure_ruined:0 "§BRuined Caeliarcus§!"
 SRA_orbital_ring_megastructure_ruined_DESC:0 "A destroyed Caeliarcus Orbital Ring that can be repaired."
 SRA_orbital_ring_megastructure_repair:0 "§BRepair Caeliarcus§!"
 SRA_orbital_ring_megastructure_repair_DESC:0 "The Caeliarcus Orbital Ring is designed to expand the production and construction capabilities of conventional planets, hosting additional industries, and providing planetary defense and military industrial support. §BUnlocks Planetary Decisions.§!"
 decision_SRA_orbital_ring_repair:0 "§BRebuild Caeliarcus§!"
 decision_SRA_orbital_ring_repair_desc:0 "Rebuild the completely destroyed Caeliarcus Orbital Ring."
