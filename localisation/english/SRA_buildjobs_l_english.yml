 #Astronomical Fabrications
 ap_SRA_world_machine:0 "§BAstronomical Fabrications§!"
 ap_SRA_world_machine_desc:0 "§BThe culmination of technology and the result of striving for perfection, casting the sea of stars into a pure machine of destruction.§!\n"
 ap_SRA_world_machine_custom_tooltip:0 "Unlocks the §BAstronomical Fabrications Transformation§! planetary decision. This basically replaces the entire planet's planning content, reducing the district limit based on planet size and providing automated output.\n§YAstronomical Fabrications require 7200.00 £time£ to reach maximum capacity.§!\n§YA window asking whether to transform will automatically pop up when colonizing a new planet.§!"
 building_SRA_world_machine:0 "§BAstronomical Fabrications - Infinite§!"
 building_SRA_world_machine_desc:0 "This hub indicates that the entire world is controlled by Starlight machinery, with automated production lines spread throughout, all for maximum production efficiency and development. Military industry is prioritized to meet the massive needs of expeditions.\n§YProvides output based on planet size and is treated as $job_foundry$ jobs for related modifiers.§!"
 building_SRA_world_machine_A:0 "§BAstronomical Fabrications - Flux§!"
 building_SRA_world_machine_A_desc:0 "The basic resource output coordination system of Astronomical Fabrications. Almost all resources are planned here to adapt to various maintenance needs.\n§YProvides output based on planet size and is treated as $job_technician$ jobs for related modifiers.§!"
 building_SRA_world_machine_B:0 "§BAstronomical Fabrications - Eternal§!"
 building_SRA_world_machine_B_desc:0 "The scientific output coordination system of Astronomical Fabrications. Research and management needs are handled separately, consuming the vast majority of computing power.\n§YProvides output based on planet size and is treated as $job_researcher$ jobs for related modifiers.§!"
 decision_SRA_world_machine:0 "Initiate §BAstronomical Fabrications§! Transformation"
 decision_SRA_world_machine_desc:0 "Initiate §BAstronomical Fabrications§! transformation. This basically replaces the entire planet's planning content, reducing the district limit based on planet size and providing automated output.\n§YAstronomical Fabrications require 7200.00 £time£ to reach maximum capacity.§!"
 decision_SRA_world_machine_cancel:0 "Destroy §BAstronomical Fabrications§!"
 decision_SRA_world_machine_cancel_desc:0 "Destroy §BAstronomical Fabrications§!, allowing you to continue planning the planet in the conventional way, for whatever reason."

 job_SRA_world_machine_job:0 "Stellarcrystal Stasis Specialist"
 mod_job_SRA_world_machine_job_add:0 "Stellarcrystal Stasis Specialist Job"
 job_SRA_world_machine_job_plural:0 "Stellarcrystal Stasis Specialist Jobs"
 job_SRA_world_machine_job_effect_desc:0 "£job_SRA_world_machine_job£ $job_SRA_world_machine_job_plural$ The only thing they have to do is live."
 job_SRA_world_machine_job_desc:0 "A single drop in the vast ocean of productivity can meet all life's needs. As for the starry sky above, a glance at its flickering changes is enough; after all, those things have nothing to do with them anymore."
 job_SRA_world_machine_drone:0 "Stellarcrystal Stasis Drone"
 mod_job_SRA_world_machine_drone_add:0 "Stellarcrystal Stasis Drone Job"
 job_SRA_world_machine_drone_plural:0 "Stellarcrystal Stasis Drone Jobs"
 job_SRA_world_machine_drone_effect_desc:0 "£job_SRA_world_machine_drone£ $job_SRA_world_machine_drone_plural$ The only thing they have to do is survive."
 job_SRA_world_machine_drone_desc:0 "The survival of the Gestalt has been more reliably guaranteed. Gestalt development is a waste of the productivity that guarantees survival. Therefore, the Gestalt chooses survival over development, and survival is-stasis."
 col_SRA_world_machine:0 "§BAstronomical Fabrications§!"
 col_SRA_world_machine_desc:0 "The entire world is controlled by Starlight machinery, with automated production lines spread throughout, all for maximum production efficiency and development.\n§YProvides output based on planet size and benefits from job output modifiers.§!"

