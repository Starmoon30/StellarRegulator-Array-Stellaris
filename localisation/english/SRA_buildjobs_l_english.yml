 building_SRA_RE_research_institute:0 "Starlight Research Base"
 building_SRA_RE_research_institute_desc:0 "This facility houses a massive number of supercomputers made of Stellarcrystal, with computing power far exceeding any computing device we have developed. The Empire's scientists can use this to solve computational bottlenecks in scientific research. Simultaneously, the redundant computing power of these arrays can assist in domestic administration."
 job_SRA_RE_research_institute_specialist:0 "Starlight Researcher"
 mod_job_SRA_RE_research_institute_specialist_add:0 "Starlight Researcher Job"
 job_SRA_RE_research_institute_specialist_plural:0 "Starlight Researcher Jobs"
 job_SRA_RE_research_institute_specialist_effect_desc:0 "£job_SRA_RE_research_institute_specialist£ $job_SRA_RE_research_institute_specialist_plural$ consume £energy£ §Y$energy$§!£consumer_goods£ §Y$consumer_goods$§! to produce £physics£ §Y$physics_research$§! £society£ §Y$society_research$§! £engineering£ §Y$engineering_research$§! £unity£ §Y$unity$§! for the advancement of our nation."
 job_SRA_RE_research_institute_specialist_desc:0 "These staff members must always have urgent questions to answer and projects to calculate, as the computing power of these arrays is simply too strong."
 job_SRA_RE_research_institute_drone:0 "Starlight Research Drone"
 mod_job_SRA_RE_research_institute_drone_add:0 "Starlight Research Drone Job"
