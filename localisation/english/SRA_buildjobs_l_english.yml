 building_SRA_databank:0 "SRA Database Terminal"
 building_SRA_databank_desc:0 "A storage terminal connected to the StellarRegulator Array database, making records of countless epochs accessible at your fingertips.\n\n§YTechnical license additional content.§!"
 
 building_SRA_foundry:0 "SRA Composite Construction Center"
 building_SRA_foundry_desc:0 "An extremely advanced construction center capable of manufacturing a wide variety of materials and products almost out of thin air.\n\n§YTechnical license additional content.§!"
 #沉溺于不劳而获者啊……你们的未来又在何方？

 SRA_need_building_core:0 "Requires StellarRegulator Building Core"

 holding_SRA_aid_base:0 "SRA Construction Support Port"
 holding_SRA_aid_base_desc:0 "To give our subjects a hand, we built these support ports. Subjects can receive massive resource subsidies from here, and incidentally experience the supreme enjoyment of researching with the Stellarcrystal computing network."

 building_SRA_plane_collector:0 "Cross-Plane Resource Collector"
 building_SRA_plane_collector_desc:0 "A mysterious building capable of collecting vast amounts of unique rare resources we need from other planes.\nWonder who suffered this time; may kindness be with them.\n\n§YTechnical license additional content.§!"
 #矿是用来补偿受害者的。
 
 building_SRA_ground_yards:0 "SRA Ground Shipyards"
 building_SRA_ground_yards_desc:0 "An advanced ground military factory that significantly improves ship construction efficiency while assisting in planetary production tasks.\n\n§YTechnical license additional content.§!"

 building_SRA_control_centre:0 "SRA Control Center"
 building_SRA_control_centre_desc:0 "A large control array responsible for maintaining the normal operation of the entire segment, and also assisting in imperial administrative work."

 building_SRA_produce_centre:0 "SRA Production Center"
 building_SRA_produce_centre_desc:0 "Advanced automated facilities capable of directly resolving labor needs in the local district and strengthening all automated labor planet-wide.\n\n§YTechnical license additional content.§!"

 building_SRA_Fortress:0 "StellarRegulator Streaming Light Forge"
 building_SRA_Fortress_desc:0 "This fully armed military fortress deploys a powerful planetary shield to weaken enemy orbital bombardment. Furthermore, it is an advanced military factory, providing ground defense while assisting in fleet maintenance.\n\n§YConverts all defense armies into §BAnnihilating Fabrications - Defense§!.§!"

 building_SRA_T3_Crystal_Node:0 "Stellarcrystal Network Node"
 building_SRA_T3_Crystal_Node_desc:0 "This towering crystal spire erects an efficient data transmission network, directly resolving labor needs in the local district and strengthening all automated labor planet-wide."

 building_SRA_T3_Storage:0 "Starlight Topology Storage"
 building_SRA_T3_Storage_desc:0 "This building utilizes Stellarcrystal to achieve large-scale space folding effects, greatly enhancing our nation's resource storage capacity."

 building_SRA_T3_Planet_Mobilization:0 "Starlight Mobilization Base"
 building_SRA_T3_Planet_Mobilization_desc:0 "This facility increases the speed of implementing decisions, though it requires high upkeep costs."

 building_SRA_T3_Recovery_Nest:0 "Starlight Recovery Nest"
 building_SRA_T3_Recovery_Nest_desc:0 "This massive structure houses hundreds of millions of recovery pods, capable of replenishing vitality both physically and mentally."

 building_SRA_T3_Singularity_Controller:0 "Starlight Gravitational Singularity Generator"
 building_SRA_T3_Singularity_Controller_desc:0 "This facility generates a micro-gravitational singularity, blurring conventional physical laws and disintegrating spatial structures within a small range to generate a certain amount of collectable Dark Matter and Astral Threads."

 building_SRA_T3_Psychic_Beacon:0 "Stellarcrystal Psychic Beacon"
 building_SRA_T3_Psychic_Beacon_desc:0 "This cloud-piercing crystal spire projects a psionic field enveloping the entire planet, bathing everyone in enlightenment and glory.\n§R\"Finally enlightened, never to be lost.\"§!"

 #星辉产出建筑

 building_SRA_RE_core:0 "Starlight Industry System Core"
 building_SRA_RE_core_desc:0 "This industrial core systematically modifies the planet's district system to provide the massive amounts of energy required by ['concept_SRA_Stellarcrystal_industry'].\nThe specific rules are as follows:\nFor every £district£§YDistrict§! on the planet, this building provides:\n$MOD_PLANET_HOUSING_ADD$: §R-300§!\n$MOD_PLANET_CRIME_ADD$: §G-2§!\n$MOD_PLANET_AMENITIES_ADD$: §G+200§!\n$mod_job_SRA_RE_technician_add$/$mod_job_SRA_RE_technician_drone_add$: §G+100§!\n\nAfter researching ['technology:tech_SRA_T3_Composite_Crystal_Lattice']:\n$mod_job_SRA_RE_technician_add$/$mod_job_SRA_RE_technician_drone_add$: §G+100§!\nIf another ['concept_SRA_Stellarcrystal_industry'] designation exists, these jobs are converted to the corresponding jobs of that designation."

 building_SRA_RE_foundry:0 "Starlight Mass-Energy Conversion Center"
 building_SRA_RE_foundry_desc:0 "By utilizing the property of Stellarcrystal to absorb energy for self-proliferation and simulate other material parameters, we can synthesize various materials from energy to meet our construction and maintenance needs."
 job_SRA_RE_foundry_specialist:0 "Starlight Constructor"
 mod_job_SRA_RE_foundry_specialist_add:0 "Starlight Constructor Job"
 job_SRA_RE_foundry_specialist_plural:0 "Starlight Constructor Jobs"
 job_SRA_RE_foundry_specialist_effect_desc:0 "£job_SRA_RE_foundry_specialist£ $job_SRA_RE_foundry_specialist_plural$ consume £energy£ §Y$energy$§! to construct £minerals£ §Y$minerals$§!£food£ §Y$food$§!£consumer_goods£ §Y$consumer_goods$§!£rare_crystals£ §Y$rare_crystals$§!£exotic_gases£ §Y$exotic_gases$§!£volatile_motes£ §Y$volatile_motes$§!£sr_dark_matter£ §Y$sr_dark_matter$§!£sr_living_metal£ §Y$sr_living_metal$§!£sr_zro£ §Y$sr_zro$§!£nanites£ §Y$nanites$§! £astral_threads£ §Y$astral_threads$§!."
 job_SRA_RE_foundry_specialist_desc:0 "Stellarcrystals can fulfill the role of required matter after structural adjustment, so this can be viewed as producing those materials."
