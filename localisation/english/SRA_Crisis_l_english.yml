# point of interest
 SRA_invasion_1_poi:0 "Expeditionary Fortress"
 SRA_invasion_1_poi_desc_a:0 "The giant space station discovered in the [SRA_first_portal_system.GetName] system is guiding the ships of the Third Expeditionary Fleet to arrive here. If this space station is not destroyed, they will continue to send reinforcements.\n§YAccording to intelligence provided by StellarRegulator, every Expeditionary Beacon or Expeditionary Fortress contains a Spacetime Phase Engine used to power other StellarRegulator Array vessels. However, if the operating mode of this engine is adjusted, it can also maintain an indestructible spacetime isolation barrier.\nAlthough it seems all anchors are currently protected, to sustain the long-term operation of other StellarRegulator Array vessels, at least one anchor must be outputting energy outwards. This means there is inevitably one anchor not protected by the spacetime isolation barrier, and it is the breach point to destroy the entire protection chain.\nAlthough the operational plan is clear, the fleets guarding the anchors also provide powerful spatial isolation barriers for them. We must destroy the guarding fleets to confirm if that anchor is the breach point.§!\n\n§RNote: Whenever an anchor is destroyed, other anchors will IMMEDIATELY begin checking if their defenses are complete. Approximately every 2.00 £time£, they verify the quantity and attempt to replenish defense fleets if insufficient. This process is EXTREMELY DANGEROUS; please take care not to linger in the system where an anchor is located.§!"
 SRA_invasion_1_poi_desc_b:0 "The giant space station discovered in the [SRA_first_portal_system.GetName] system is guiding the ships of the Third Expeditionary Fleet to arrive here. If this space station is not destroyed, they will continue to send reinforcements.\n§YResearch indicates that these anchors are protected by some complex spacetime isolation effect. We need to find a way to lift these barriers. Try launching an attack on each anchor.§!\n\n§RNote: Whenever an anchor is destroyed, other anchors will IMMEDIATELY begin checking if their defenses are complete. Approximately every 2.00 £time£, they verify the quantity and attempt to replenish defense fleets if insufficient. This process is EXTREMELY DANGEROUS; please take care not to linger in the system where an anchor is located.§!"
