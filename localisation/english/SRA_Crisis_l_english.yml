 # event chins
 SRA_invasion_chain_title:0 "Third Expeditionary Fleet"
 SRA_invasion_chain_desc:0 "A fleet from beyond the planes has invaded our galaxy. Controlled by lost StellarRegulator Array Action Units, this fleet intends to purge the entire galaxy and then rebuild the \"Rocivia Empire\".\nThis is a war that will burn through the entire galaxy.\n§YCheck the description of the Expeditionary Fortress for more intelligence.§!"
