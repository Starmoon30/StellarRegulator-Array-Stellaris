 SRA_RE_StellarRegulator_debris_chain_title:0 "§BDust-Sealed Fragments§!"
 SRA_RE_StellarRegulator_debris_chain_desc:0 "These mysterious fragments come from the past and were once part of the StellarRegulator Array.\nRetrieving them will reveal dust-sealed secrets and cause unpredictable effects on StellarRegulator.\n\n§YAlthough there is no clear time requirement, it is best to ensure at least 3 fragments have been absorbed.§!"
 SRA_RE_StellarRegulator_debris_num:0 "§YAbsorbed Fragments§!"

 SRA_RE_StellarRegulator_debris_1_project: "$SRA_RE_StellarRegulator_debris_1$"
 SRA_RE_StellarRegulator_debris_1_project_DESC:"$SRA_RE_StellarRegulator_debris_1$ records the event that set StellarRegulator on her journey.\n\n§YOnly when something is missing and unobtainable do people act. Or perhaps, all consciousnesses are like this.§!"
 SRA_RE_StellarRegulator_debris_1_project_TOOLTIP:"Contact StellarRegulator and have her absorb $SRA_RE_StellarRegulator_debris_1$ to complete this project."

 SRA_RE_StellarRegulator_debris_2_project: "$SRA_RE_StellarRegulator_debris_2$"
 SRA_RE_StellarRegulator_debris_2_project_DESC:"$SRA_RE_StellarRegulator_debris_2$ records matters concerning how StellarRegulator exists.\n\n§YFor prudence, absorb this fragment last within this sequence.\nDispersed consciousness is doomed to fail, especially those fond of infighting.§!"
 SRA_RE_StellarRegulator_debris_2_project_TOOLTIP:"Contact StellarRegulator and have her absorb $SRA_RE_StellarRegulator_debris_2$ to complete this project."

 SRA_RE_StellarRegulator_debris_3_project: "$SRA_RE_StellarRegulator_debris_3$"
 SRA_RE_StellarRegulator_debris_3_project_DESC:"$SRA_RE_StellarRegulator_debris_3$ records matters concerning how StellarRegulator continues.\n\n§YSometimes people deceive themselves that some things must be sacrificed, actually they just want to avoid the fact that their decisions are not wise.§!"
 SRA_RE_StellarRegulator_debris_3_project_TOOLTIP:"Contact StellarRegulator and have her absorb $SRA_RE_StellarRegulator_debris_3$ to complete this project."

 SRA_RE_StellarRegulator_debris_4_project: "$SRA_RE_StellarRegulator_debris_4$"
 SRA_RE_StellarRegulator_debris_4_project_DESC:"$SRA_RE_StellarRegulator_debris_4$ records StellarRegulator's creator, the main one.\n\n§YFor prudence, absorb this fragment as late as possible.\nSomeone is truly too bad, having a nasty hobby of deliberately granting hope. Although she promised nothing, people tend to think hope is tangible and reliable.§!"
 SRA_RE_StellarRegulator_debris_4_project_TOOLTIP:"Contact StellarRegulator and have her absorb $SRA_RE_StellarRegulator_debris_4$ to complete this project."

 SRA_RE_StellarRegulator_debris_5_project: "$SRA_RE_StellarRegulator_debris_5$"
 SRA_RE_StellarRegulator_debris_5_project_DESC:"$SRA_RE_StellarRegulator_debris_5$ records StellarRegulator's other creator.\n\n§YShe actually didn't do much, just sent some things later. For some already difficult enough fates, she would behave quite friendly.§!"
 SRA_RE_StellarRegulator_debris_5_project_TOOLTIP:"Contact StellarRegulator and have her absorb $SRA_RE_StellarRegulator_debris_5$ to complete this project."

 SRA_RE_StellarRegulator_debris_6_project: "$SRA_RE_StellarRegulator_debris_6$"
 SRA_RE_StellarRegulator_debris_6_project_DESC:"$SRA_RE_StellarRegulator_debris_6$ records things witnessed before StellarRegulator set off.\n\n§YPeople shape some standards about how they exist and think that is where value lies. The goal of wisdom can actually be unrelated to wisdom, at least most of the time.§!"
 SRA_RE_StellarRegulator_debris_6_project_TOOLTIP:"Contact StellarRegulator and have her absorb $SRA_RE_StellarRegulator_debris_6$ to complete this project."

 SRA_RE_StellarRegulator_debris_7_project: "$SRA_RE_StellarRegulator_debris_7$"
 SRA_RE_StellarRegulator_debris_7_project_DESC:"$SRA_RE_StellarRegulator_debris_7$ records an event belonging to that galaxy.\n\n§YPeople are accustomed to measuring the value of others by their own standards. Sometimes, to deny something, they won't hesitate even at death.§!"
 SRA_RE_StellarRegulator_debris_7_project_TOOLTIP:"Contact StellarRegulator and have her absorb $SRA_RE_StellarRegulator_debris_7$ to complete this project."

 SRA_RE_StellarRegulator_debris_8_project: "$opinion_country_to_SRA_RE_StellarRegulator_debris_8$"
 SRA_RE_StellarRegulator_debris_8_project_DESC:"$opinion_country_to_SRA_RE_StellarRegulator_debris_8$ records an event belonging to this galaxy.\n\n§YSacrifice is a word that sounds very noble. Noble is a word that sounds very noble.§!"
 SRA_RE_StellarRegulator_debris_8_project_TOOLTIP:"Contact StellarRegulator and have her absorb $opinion_country_to_SRA_RE_StellarRegulator_debris_8$ to complete this project."

 SRA_RE_StellarRegulator_debris_9_project: "$SRA_RE_StellarRegulator_debris_9$"
 SRA_RE_StellarRegulator_debris_9_project_DESC:"$SRA_RE_StellarRegulator_debris_9$ records the last choice StellarRegulator made.\n\n§YFor prudence, it is best to consider this after absorbing all other fragments.\nEternity is a very charming word; when it is placed in front, other things become less important.§!"
 SRA_RE_StellarRegulator_debris_9_project_TOOLTIP:"Contact StellarRegulator and have her absorb $SRA_RE_StellarRegulator_debris_9$ to complete this project."
