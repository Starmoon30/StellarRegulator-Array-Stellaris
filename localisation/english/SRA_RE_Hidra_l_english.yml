 #虚境实体
 SRA_patron_Hidra:"Scar of Crimson"
 SRA_patron_Hidra_article: "$SRA_patron_Hidra$"
 SRA_patron_Hidra_article_cap: "$SRA_patron_Hidra$"
 SRA_patron_Hidra_color: "§L$SRA_patron_Hidra$§!"
 SRA_patron_Hidra_color_article: "§R$SRA_patron_Hidra$§!"
 SRA_patron_Hidra_color_article_cap: "R$SRA_patron_Hidra$§!"
 SRA_patron_Hidra_desc:"A horrifying scar left in §HThe Shroud§! by a single touch. Blood thorns grow, trauma spreads. Perhaps one day, §HThe Shroud§! will §Rwither and die because of this§!."
 code_name_SRA_patron_Hidra:"Horrifying Thing"
 SRA_patron_Hidra_passive_accord_effect:"§RThe moment of glory is approaching.§!"
 SRA_patron_Hidra_passive_accord_modifier:"§RHesitation and bewilderment have ended.§!"

 SRA_patron_Hidra_project_desc_end:0 "Until we know the true name of this entity, we will call it §H$code_name_SRA_patron_Hidra$§!."
 SRA_patron_Hidra_project:0 "Commune with $code_name_SRA_patron_Hidra$"
 SRA_patron_Hidra_project_DESC:0 "$MINOR_PATRON_FC_PROJECT_DESC$\n\n$SRA_patron_Hidra_project_desc_end$"
 SRA_patron_Hidra_project_hive:0 "Commune with $code_name_SRA_patron_Hidra$"
 SRA_patron_Hidra_project_hive_DESC:0 "$MINOR_PATRON_FC_PROJECT_HIVE_DESC$\n\n$SRA_patron_Hidra_project_desc_end$"
 SRA_patron_Hidra_project_machine:0 "Commune with $code_name_SRA_patron_Hidra$"
 SRA_patron_Hidra_project_machine_DESC:0 "$MINOR_PATRON_FC_PROJECT_ROBOT_DESC$\n\n$SRA_patron_Hidra_project_desc_end$"

 SRA_RE_Hidra.500.desc:"The flow of §HThe Shroud§! suddenly became violent, sweeping us into a domain we had never discovered before.\nBlurred and hideous branches are everywhere here, growing and piercing every surface of §HThe Shroud§!. §RThe Shroud is bleeding.§! And we, facing all this, are also overwhelmed by the pain of §HThe Shroud§!. Our psionics shriek and shatter, emitting dying howls.\nJust as we were in despair, §Rsome existence§! cast its gaze upon us.\n\nThe pressure suddenly eased, died out, disappeared without a trace, and we could move freely in §HThe Shroud§! again. However, this scar of §HThe Shroud§! still exists. It is so horrifying, as if the boundless §HThe Shroud§! will weaken and die because of it.\n§RThat existence§! said nothing to us, but what He showed seemed to be a vague kindness? We don't know what He has to do with this scar, but He also carries the same disturbing feeling.\n\nWe are detaching from §HThe Shroud§!. Let's call §Rthis existence§! §R$code_name_SRA_patron_Hidra$§! for now. We may meet again soon."
 SRA_RE_Hidra.500.a:0 "Disturbing."

 SRA_RE_Hidra.501.name:0 "§R$code_name_SRA_patron_Hidra$§!"
 SRA_RE_Hidra.501.desc:0 "§YFollowing the psionic imprint left earlier, we found the existence of §HThe Shroud§! we call §R$code_name_SRA_patron_Hidra$§! again. At this moment, He is not beside that terrible scar, but in a new domain of §HThe Shroud§!. Those crimson branches grow slowly beside Him, but have not torn open new wounds on §HThe Shroud§! yet.\n§R$code_name_SRA_patron_Hidra$§! looked at us, His gaze making us feel deeply uneasy.§!\n\nHello, outsider."
 SRA_RE_Hidra.501.a:0 "You are?"
 SRA_RE_Hidra.502.name:0 "§R$SRA_patron_Hidra$§!"
 SRA_RE_Hidra.502.desc:0 "§Y§R$code_name_SRA_patron_Hidra$§! seemed to chuckle, then the mist shrouding Him gradually dissipated, revealing a figure quite familiar to you.§!\n\nHere, well, other §HThe Shroud§! existences call me §R$SRA_patron_Hidra$§!, let's borrow this title for now.\n\n§Y$Name_SRA_RE_leader_Hidra$, or according to her, §R$SRA_patron_Hidra$§! revealed a malicious smile.§!\n\nThis universe is really interesting. There are so many strange and vast planes that can be traveled at will, unlike some isolated islands that don't even have a higher plane.\n§HThe Shroud§! reflected some of my aspects, or rather, a part of my influence was magnified here. I just touched it lightly, and left such a trauma.\nTo the broad §HThe Shroud§!, this tiny spot is nothing, but since it chose such a nature, maybe there will be interesting scenes one day?\nBut right now, we can pretend nothing happened. You can continue to enjoy your exploration of §HThe Shroud§!, don't mind me."
 SRA_RE_Hidra.502.a:0 "Scared..."
