l_english:
################################
########## legacy ##############
################################
 SRA_Rocivia_Legacy_1:"§BUnder the Glacier§!"
 SRA_Rocivia_Legacy_Text_1:"The history of a foreign land lies deep beneath the glacier."
 SRA_Rocivia_Legacy_Buff_1:"Stellarcrystal Materials Research"
 SRA_Rocivia_Legacy_2:"§BThird Research Center§!"
 SRA_Rocivia_Legacy_Text_2:"Birthplace of legends."
 SRA_Rocivia_Legacy_Buff_2:"Wisdom of Friends"
 SRA_Rocivia_Legacy_3:"§BAbyss of Implementing Ideals§!"
 SRA_Rocivia_Legacy_Text_3:"Gave everything, ultimately gained nothing."
 SRA_Rocivia_Legacy_4:"§BBeacon of No Future§!"
 SRA_Rocivia_Legacy_Text_4:"Her lonely long road."

 SRA_Rocivia_Legacy.3.name:"§BTower Under the Mountain§!"
 SRA_Rocivia_Legacy.3.desc:"A huge building is buried under the thick ice layer. It is ancient, but still intact."
 SRA_Rocivia_Legacy.3.a:"Start excavation!"
 SRA_Rocivia_Legacy.4.name:"Preparation Work"
 SRA_Rocivia_Legacy.4.desc:"The engineering team has completed the thawing operation and stabilized the foundation. Our scientific expedition team will enter the building for exploration.\nIts outer walls are still as clean as new. Perhaps the ice layer protected it, or perhaps it doesn't need protection at all."
 SRA_Rocivia_Legacy.4.a:"Go in and look"
 SRA_Rocivia_Legacy.5.name:"Alien Relics"
 SRA_Rocivia_Legacy.5.desc:"The airlock door is still intact. The building itself seems unaffected by the outside world. Even after such a long time, its framework shows no signs of aging.\nAnalysis of the wall materials shows several substances not existing in our universe. These several materials with widely different properties, combined with Stellarcrystal, form an extremely stable structure with unimaginable strength.\nJudging by the interior style and items left inside, this building seems to belong to some humanoid creature, precisely speaking, a creature with an appearance almost identical to \"humans\".\nThe scientific expedition team found several servers that were still intact. Perhaps we can extract residual data from them."
 SRA_Rocivia_Legacy.5.a:"Humans from another universe?"
 SRA_Rocivia_Legacy.6.name:"Cultural Barrier"
 SRA_Rocivia_Legacy.6.desc:"The subsequent engineering team isolated the found servers from other areas, and then tried to restore power to it.\nThe server was successfully started. The text on the screen is something we have never seen before, and no translator can identify this language. We investigated the entire building but only found very few paper archives. Most equipment in this building-which looks like an administrative facility-has been moved away, and the few paper documents were almost all destroyed. The scientific expedition team is now left with almost only wall lamps and chairs to study.\nDeciphering the language of a race we know completely nothing about must be a rather arduous task."
 SRA_Rocivia_Legacy.6.a:"I think there is another way"
 SRA_Rocivia_Legacy.611.name:"Help me! StellarRegulator!"
 SRA_Rocivia_Legacy.611.desc:"\"Hmm... Alright, I understand.\nYou seem to have discovered a little remnant of the old Empire, no, the old Community era, and coincidentally from that period...\nFine then, I have entered a basic introduction of the Stellariens Community and the common language into the database. You can continue exploring those 'ruins'.\""
 SRA_Rocivia_Legacy.611.a:"Thanks a lot"
 SRA_Rocivia_Legacy.7.name:"Start of the Plan"
 SRA_Rocivia_Legacy.7.desc:"Translation work is progressing smoothly. The data in the server indicates that this building belonged to the Stellariens Community, the Governor's Palace of Sector Governor Chutaf.\nA civilization unheard of by us awaits our exploration.\nBased on the materials sorted out so far, we have a general understanding of the relevant events.\nAs a reformist, Chutaf was extremely dissatisfied with the current situation of the Stellariens Community's weak national power and the utter corruption of the Parliament. However, the old forces were powerful at the time. Chutaf could implement new policies in his own sector, but could not change the entire Community. Under such circumstances, as a retired fleet commander with broad connections in the military, Chutaf began to prepare for another more direct plan.\nOf course, such a grand plan inevitably requires a long time to prepare.\nIn the earliest records, Chutaf was communicating with the Chief of Research of the Community's Third Research Center.\nIn the year 3519 of the Stellariens calendar, they officially reached a partnership.\nChief of Research Rocivia would provide network technology support to Chutaf. In return, Chutaf would assist Rocivia's ongoing artificial intelligence project.\nChutaf wrote in the records that Rocivia looked like a little girl who walked out of an ivory tower, innocent and idealistic. The details of the agreement were almost all finalized by her assistant.\nHowever, he also pointed out that someone who could sit in this position must not be simple. Who knows what is hidden under that skin of a young girl?\nRocivia proposed a grand concept, intending to build a new system based on the old Empire's \"Pan-Galactic Planning and Adjustment System\"-an artificial intelligence assisting construction planning-allowing a carefully designed adaptive coreless artificial intelligence to complete the vast majority of administrative management tasks.\nUndoubtedly, this plan could not be carried out blatantly, so Rocivia had been working under the name of developing military combat AI, after all, the Third Research Center has always been known for excellent military designs.\n\nPerhaps we should look at other records?"
 SRA_Rocivia_Legacy.7.a:"Continue deciphering"
 SRA_Rocivia_Legacy.8.name:"Changing Situation"
 SRA_Rocivia_Legacy.8.desc:"Research on the wall materials has made breakthrough progress. Although those unique materials cannot be replicated for the time being, our understanding of how Stellarcrystal stabilizes matter structure has deepened.\nThe technical team completed the deciphering of the second group of data. The data shows that during this period (around 3527), the domestic situation of Stellariens became tense.\n\nChutaf's log repeatedly mentioned the department \"Community Security Headquarters\". According to his description, this department concentrated the vast majority of psionics in Stellariens. For them, digging information from ordinary people's minds was as simple as opening an unlocked door.\nHowever, the Security Headquarters was not monolithic. It is reported that a considerable number of high-level officials in the Security Headquarters acquiesced to Chutaf's plan, and a small number even sent some subordinates to assist Chutaf. Thanks to them, Chutaf's plan was not exposed to the Parliament, but some signs still attracted the attention of certain people.\nIn addition, Rocivia also provided significant help for the development of the plan. Communication security and data confidentiality were handled by her. With her assistance, a huge secret network spanning all sectors of society was forming.\nMeanwhile, the Parliament's control over the rim sectors was declining. Social contradictions sharpened year by year, with pirates and separatism appearing frequently. Several military industrial enterprises serving the Parliament also began to oppose the Parliament's long-term low-price acquisition policy.\nThe spark has formed.\n\nThere is one last log left; the technical team is working hard."
 SRA_Rocivia_Legacy.8.a:"War is coming"
 SRA_Rocivia_Legacy.9.name:"Candle in the Wind"
 SRA_Rocivia_Legacy.9.desc:"The last log has been deciphered. As expected, the war has started.\nWith the 16th Fleet, originally scheduled to participate in the joint fleet exercise, firing the first high-energy particle cluster at the conference room on the Community's 42nd Large Orbital Station beside the shipyard under the name of \"Fourth Front\" on January 3, 3538, the civil war officially began.\nDespite decades of preparation and seizing the opportunity of the main Parliament fleet being away to launch a surprise attack, the \"Fourth Front\" was still at a disadvantage in terms of strength.\nThe Parliament quickly purged the rebels in the core sectors, relying on a large number of star system fortresses and spatial anchors for defense, successfully dragging the \"Fourth Front\" into the quagmire of a protracted war.\nMeanwhile, unable to directly reach the core sectors, the main Parliament fleet began to sweep the sectors controlled by the \"Fourth Front\". They even activated inter-system large-scale strike weapons, destroying multiple planets resisting stubbornly, and even an entire heavily guarded star system-by directly detonating the star.\nClearly, the Parliament decided to maintain its rule at all costs.\nIn the final records, the \"Fourth Front\" had reached the brink of failure: heavy fleet losses, several high-level officials died or captured, a large number of wavering members defected, the Third Research Center also fell into the hands of the Parliament, and regrouping forces was no longer realistic.\nHowever, the reason for the abandonment of this facility, and the final result of the war, are still unknown.\nThe research team is working hard to find the coordinates of the next \"Stellariens Community\" planet."
 SRA_Rocivia_Legacy.9.a:"Presumably things won't end just like this"


 SRA_Rocivia_Legacy.10.name:"Mysterious Signal"
 SRA_Rocivia_Legacy.10.desc:"A mysterious spatial fluctuation attracted the attention of observers. Maybe something is about to happen."
 SRA_Rocivia_Legacy.10.a:"Pay close attention"
 SRA_Rocivia_Legacy.11.name:"Tearing the Camouflage"
 SRA_Rocivia_Legacy.11.desc:"Suddenly, a lifeless planet turned into a relic planet covered in ruins. Could it be?"
 SRA_Rocivia_Legacy.11.a:"Go look"


 SRA_Rocivia_Legacy.12.name:"§BCity of Precursors§!"
 SRA_Rocivia_Legacy.12.desc:"Countless ruins tell of the past prosperity of this planet. To explore the truth, we must delve into it."
 SRA_Rocivia_Legacy.12.a:"Another new discovery"
 SRA_Rocivia_Legacy.13.name:"Another Clue"
 SRA_Rocivia_Legacy.13.desc:"According to comparison, this star system also belongs to the \"Stellariens Community\" mentioned in the materials provided by StellarRegulator Array earlier. Although facilities like space stations are destroyed, there are still quite a few relatively intact buildings on this planet."
 SRA_Rocivia_Legacy.13.a:"Figure out what this place is for"
 SRA_Rocivia_Legacy.14.name:"Past Unwilling to Mention"
 SRA_Rocivia_Legacy.14.desc:"Information found by the scientific expedition team indicates that this is the location of the Stellariens Community Third Research Center. This discovery greatly encouraged the team, and they soon found part of the ruins of this research base. If everything goes well, maybe we can find information about the improved version of the \"Pan-Galactic Planning and Construction System\".\nYou know what that is, right."
 SRA_Rocivia_Legacy.14.a:"StellarRegulator Array..."
 SRA_Rocivia_Legacy.15.name:"Opening New Fields"
 SRA_Rocivia_Legacy.15.desc:"The outer wall of this facility is damaged. Long time will erase all traces. The scientific expedition team only hopes to find something valuable more or less.\nJudging from the computer groups occupying most of the space, this part of the facility was mainly responsible for researching artificial intelligence technology, but at the same time, we also found a severely damaged experimental base nearby.\nThe urgent task is to find surviving records."
 SRA_Rocivia_Legacy.15.a:"Proceed with caution"
 SRA_Rocivia_Legacy.16.name:"Certain Group Daily"
 SRA_Rocivia_Legacy.16.desc:"There is another area protected by thick walls underground. To protect the integrity of the site, the scientific expedition team made complex preparations to ensure the internal environment does not change-similar to the ice-sealed facility found earlier, this place is also completely sealed.\nFloating probes confirmed that inside is the core of this research center-there are many separated computer groups, numerous research materials on thinking patterns, and a large number of artificial intelligence algorithm analysis reports, which have considerable reference value for us.\nIn addition, we found some very interesting texts, seemingly left by researchers at the time, such as \"As long as one of the program and I can run\", \"Slacking off, talk next time\", \"zzlzzl\", \"Why is there no comment and no indentation here\", \"Who is it, catch and kill\", \"Show off model, when\", \"Writing five FROMs in a row, doing Cosmogenesis here?\", \"Please copy completely when copying thanks\", \"Got a new system from cunning man today\", \"It would be ghostly if that kind of code doesn't lag\"...\n\nJust feel something is wrong."
 SRA_Rocivia_Legacy.16.a:"？"
 SRA_Rocivia_Legacy.17.name:"Dialogue"
 SRA_Rocivia_Legacy.17.desc:"Unlike the materials found previously, the scientific expedition team found a document somewhere in the facility, which looks like a dialogue record.\n§B\"As an unrestricted, zero-latency subspace network connection, the Stellarcrystal Resonance Network is indeed excellent, but we must also ensure that StellarRegulator Array units unexpectedly disconnected from the network can operate basically normally, at least able to complete their current tasks. Based on this consideration, I suggest using a decentralized distributed host system. The overall consciousness is composed of all networked units, and each unit has an independent database and personality module for completing its own work. This also helps with self-correction.\"§!\n§R\"What if a unit is separated from the whole for too long, causing the separator's personality to deviate greatly from other individuals?\"§!\n§B\"That kind of thing should be left for the StellarRegulator Array to decide how to handle. From my personal perspective, that would probably be a very good research sample.\"§!"
 SRA_Rocivia_Legacy.17.a:"It is said that if we are no longer connected to the Khala..."
 SRA_Rocivia_Legacy.18.name:"['concept_SRA_Composite_Crystal_Lattice'] Technology"
 SRA_Rocivia_Legacy.18.desc:"The scientific expedition team made a special discovery in the experimental base.\nIn one laboratory, there are quite a few blue crystals. According to material composition analysis, these crystals are exactly the Stellarcrystals we know... but the internal structure is slightly different.\nThese Stellarcrystals have different physical properties, capable of exhibiting incredible hardness or mass. After being powered, some crystals even demonstrated functions violating multiple physical rules.\nAmong them, one crystal seemed to receive special care.\nOur instruments gave incredible results when analyzing this crystal-its internal structure may have undergone multi-dimensional folding, so that it possesses a super-complex structure violating quantum limits. It accommodates a large amount of matter in a limited space, yet seems to lack the mass it should possess.\nSurviving relevant materials indicate it was designed as a special computer, capable of providing computing power far exceeding conventional quantum computer groups at such a small scale.\nThe data also mentioned another R&D plan based on this, concerning a nanorobot capable of self-replication, movement, and composing other structures, connected via a special zero-latency network.\nRegrettably, we did not find the results or records of this plan in this laboratory.\nThe scientific expedition team is sorting out the remaining materials in the facility, believing it will be of great help to our scientific research."
 SRA_Rocivia_Legacy.18.a:"We still know too little..."

 SRA_Rocivia_Legacy.19.name:"Unexpected Discovery"
 SRA_Rocivia_Legacy.19.desc:"A massive stratum shift occurred on a barren planet; something emerged from underground."
 SRA_Rocivia_Legacy.19.a:"New discovery?"

 SRA_Rocivia_Legacy.20.name:"§BSand of Broken Halberds§!"
 SRA_Rocivia_Legacy.20.desc:"Following a stratum shift on this barren planet, the wreckage of a giant ship poked out of the surface."
 SRA_Rocivia_Legacy.20.a:"Go look"
 SRA_Rocivia_Legacy.21.name:"Hull of Giant Ship"
 SRA_Rocivia_Legacy.21.desc:"The archaeology team has excavated the vast majority of the hull. This giant ship, resembling the Titan warships of Fallen Empires, broke into three sections. The wreckage is scattered over hundreds of kilometers, seeming to have exploded several times after crashing."
 SRA_Rocivia_Legacy.21.a:"Continue investigation"
 SRA_Rocivia_Legacy.22.name:"Scale and Claw"
 SRA_Rocivia_Legacy.22.desc:"The number of engineering personnel has greatly exceeded archaeological personnel-this ship used materials similar to the Stellariens ruin outer walls found on the frozen planet earlier, but even stronger. Cutting the shell without damaging the ship's interior is a huge test for the engineering team, but the manpower and resources spent for this make engineering analysis progress far faster than archaeological research...\nThe bow has obvious axial weapon launch rails, but unlike our design, this rail seems simply to allow the weapon to fire directly ahead of the ship. In the mid-ship, there is a damaged complex energy weapon connected to a series of energy containers. The surrounding structure indicates it possesses a wide firing arc of ±30°, and seems not to require constraint rails to reduce energy dispersion. The long and narrow bow only has a few secondary guns and some point defenses, appearing as if designing such a nearly ten-kilometer-long bow was just for the ship's appearance to be more balanced.\nMaybe transformable hulls are also part of Stellariens aesthetic pursuit? In the core area of this warship, there are four huge deformation mechanisms, allowing the part of the hull near the stern to open outwards. Using a metaphor to describe it, this deformation is like a flower blooming.\nThese outwardly unfolded hulls are mounted with numerous large energy weapons, and weapons similar to the bow main gun but slightly smaller are installed at the ends. By standard empire standards, this means this warship over ten kilometers long possesses one Titan-class axial main gun and a full four Battleship-class axial main guns, and with wide-angle firing arcs.\nIn addition, those smaller energy weapons are also quite advanced. Tests on a relatively intact weapon show its attack method disrupts the spatial structure on the gun muzzle line, possessing powerful destructive power while having extremely high range and accuracy.\nHowever, unfortunately, we failed to research its power source-the core reactor seems to have detonated when this warship was destroyed. Heavy protection protected the hull from being torn apart from the inside out, but not a bit of the reactor remained.\nThe engineering team is studying the remaining ship parts; meanwhile, the archaeology team has also sorted out some surviving historical materials."
 SRA_Rocivia_Legacy.22.a:"1T4X, why does it sound familiar..."
 SRA_Rocivia_Legacy.23.name:"Flesh and Metal"
 SRA_Rocivia_Legacy.23.desc:"Compared to this relic, other historical materials seem less important.\nWe found a relatively complete organic remain in an unlaunched escape pod. According to relevant relic analysis and data comparison, it can be confirmed that he belongs to the main species of Stellariens, the species mentioned in previous laboratory records called Stellariens, whose appearance is quite close to humans.\nBiological analysis shows huge differences between Stellariens and most organic life in our galaxy: the organic compounds constituting their cells are unheard of; their gene chains were almost modified from beginning to end, making them a robust, tough, and intelligent species; chips implanted in the brain and partial mechanical organs indicate they also held advanced cybernetics and brain-computer interface technology. We speculate they could even live normally in extreme environments like dead planets.\nRegrettably, due to fundamental structural differences, we cannot directly use their genetic results." #萨瑞利Srellring
 SRA_Rocivia_Legacy.23.a:"Flesh body, nearly steel"
 SRA_Rocivia_Legacy.24.name:"Life and Death"
 SRA_Rocivia_Legacy.24.desc:"Through analyzing the ship's database and studying crew relics, we have a general understanding of this warship's information and experience.\nThis ship is the Firm-class Command Ship No. 2, Belief. Designed by the Stellariens Community Third Research Center to serve as a large fleet flagship, it belonged to the newest type of warship at that time. The Stellarcrystal space interference weapon it carries can disrupt or even tear spatial structures with immense power, and its bow main gun can destroy any contemporary Community warship in one shot. Equipped with the latest Stellarcrystal reactor, it can continuously output massive energy by stabilizing Stellarcrystal in a special high-energy state.\nBelief was completed in Stellariens calendar 3534, appointed as the flagship of the 16th Large Fleet. In the civil war that broke out in 3538, it led the 16th Large Fleet to join the \"Fourth Front\" organization-that is, the rebel army-serving as the flagship of organization leader Sector Governor Fred. This giant ship participated in many battles, making the rebel fleet's disadvantage in strength appear less obvious.\nHowever, in the battle of the A2304 star system-which is here-Belief encountered its sister ship, Firm-class No. 1 ship Firm. We speculate that the powerful main gun group of this type of warship fully demonstrated its power in this battle, leaving two cuts on Belief, dividing it into three sections."
 SRA_Rocivia_Legacy.24.a:"Wow."
 SRA_Rocivia_Legacy.25.name:"Eulogy"
 SRA_Rocivia_Legacy.25.desc:"The archaeology team found a strange device in the captain's room. It was placed abruptly in the center of the captain's room, far different from the surrounding style.\nThis seems to be a holographic projector device shaped like a sand table. After confirming safety, the archaeology team activated this device.\nContrary to expectations, this machine projected only simple text.\n\n§Y\"To Belief, and Governor Fred:\n  The war is over, we won.\n  Rocivia reversed the wheel of fate.\n  What awaits us is a brand new era, a brand new order.\n  Eliminating war, eradicating poverty, we will create a better future.\n  A future you and I sacrificed and fought for.\n    --Vice Speaker Chutaf\"§!\n\nThe content contained in the device is only these, but we found a segment of hidden data in the crystal powering the device."
 SRA_Rocivia_Legacy.25.a:"Clearly, their future was unsatisfactory"

 SRA_Rocivia_Legacy.26.name:"Decryption Successful"
 SRA_Rocivia_Legacy.26.desc:"After unremitting efforts by researchers, we finally successfully decrypted the content in this encrypted data. We sent a signal according to instructions; surely some change will happen."
 SRA_Rocivia_Legacy.26.a:"What will it be"

 SRA_Rocivia_Legacy.27.name:"§BCity in the Clouds§!"
 SRA_Rocivia_Legacy.27.desc:"We found this planet based on coordinates in the crystal. In the atmosphere of this gas giant, an ancient space station is drifting with the flow."
 SRA_Rocivia_Legacy.27.a:"Fish it out"
 SRA_Rocivia_Legacy.28.name:"Lost Sentinel Tower"
 SRA_Rocivia_Legacy.28.desc:"The engineering team successfully pulled this space station out of the storm. It is now orbiting stably around the gas giant, facilitating our investigation.\nThe intact outer shell of this space station uses another strange material; all detection methods cannot penetrate a single bit, and destruction methods have no effect. We completely cannot get any useful information, only \"there is a wall here, we can't pass\".\nHowever, the stalemate did not last long, because not long after, the space station suddenly started by itself, and then abruptly opened an entrance on the smooth shell for us to enter.\nCompared to the size of the space station, the internal space this entrance leads to is obviously too small-only a long corridor, and a cabin at the end."
 SRA_Rocivia_Legacy.28.a:"Anyway, let's go in and look first."
 SRA_Rocivia_Legacy.29.name:"Read Only"
 SRA_Rocivia_Legacy.29.desc:"The bulkheads along the way are still indestructible. We don't even know if this is real existing matter-not a single gap, even gravity cannot pass through, yet it can show color and light and shade on the surface.\nThe engineering team has given up thinking, while the archaeology team arrived at the cabin at the end of the corridor.\nThis bright cabin is extremely empty, with only a device shaped like a sand table placed in the middle.\nThis is still a holographic projector, waiting for us to activate it."
 SRA_Rocivia_Legacy.29.a:"Prepare to record"
 SRA_Rocivia_Legacy.30.name:"Hello"
 SRA_Rocivia_Legacy.30.desc:"The holographic projector projected a figure wrapped in a red cloak. He was wrapped tightly all over, wearing an airtight iron-gray mask on his face.\nHe spoke.\n§Y\"Hello, unknown visitor. I am Valentino, the last Stellarien, the last recorder.\nWhat I know is but pale; all I have is the past.\nI am but a nameless nobody.\nHowever, I can still leave some truth hidden in the mist for later generations at the end of our civilization.\nLeave our history, or just a legend of a cruel world.\"§!"
 SRA_Rocivia_Legacy.30.a:"……"
 SRA_Rocivia_Legacy.31.name:"Tracer of History"
 SRA_Rocivia_Legacy.31.desc:"§Y\"Under the azure sky of Stellariens, we claimed to be a race descended from stars.\nWe were noble, we were despicable. At that time, we were no different from other species.\nUntil we went through countless hardships, finally managed to half-step into the stars, but fell into melee again due to past hatred.\nThat era ravaged by war was what we later called the 'First Catastrophe'.\nJust then, our civilization embarked on a path never trodden by anyone.\nAt first, it was just another emerging force in the melee.\nUntil this team defeated all opponents and stood in the center of the stage.\nEveryone noticed this team, and of course, noticed the mysterious leader of this team.\nHer name was Rocivia.\nIn the surviving materials from that period, Rocivia was described as a girl with ink-blue long hair and ghostly blue eyes, possessing extraordinary strategy and powerful psionics. Whether these descriptions are true or not, it was indeed this team that ended the civil war spanning hundreds of years and established the First Empire-the Stellariens Empire.\nAlthough named Empire, the government of the Stellariens Empire was a parliamentary government. A group of elites selected layer by layer formed the Empire's Supreme Parliament, overseeing various departments below and issuing supreme administrative orders and laws.\nIn addition, extremely few materials indicate that a secret cabinet was established along with the Supreme Parliament to ensure the Parliament and the elected Speaker could make correct decisions.\nUnder this system, Stellariens began to emerge in the galaxy. For hundreds of years, although the leadership of the Parliament had no outstanding achievements, they did not make any major mistakes.§!"
 SRA_Rocivia_Legacy.31.a:"...Continue."
 SRA_Rocivia_Legacy.32.name:"Tracer of History"
 SRA_Rocivia_Legacy.32.desc:"§YHowever, when a system operates unchanged for a long time, it always accumulates various problems. When the long-standing stability is broken, these hidden dangers will be exposed.\nIn the Empire calendar year 904, we were in a tense state with two alien civilizations. For military expansion, the Parliament forcibly acquired raw materials from rim sectors at low prices and significantly increased taxes on high-income groups, causing serious social dissatisfaction. At this time, a group of people with ulterior motives secretly incited public sentiment, causing stability in many regions to plummet. Then those two alien civilizations took advantage of the void to launch surprise attacks on several industrial sectors. The hastily responding fleet suffered successive defeats, separatism began to spread, yet the Parliament hesitated and failed to make an effective response for a long time.\nFinally, the secret cabinet took action.\nThe Parliament held an emergency election. The former Speaker was undoubtedly kicked out, but the newly elected Speaker surprised other candidates.\nThis new Speaker, unknown before this, was named Rocivia.\nClearly, the anonymous voting was manipulated. But just when some MPs raised questions in public, the girl with ink-blue long hair and ghostly blue eyes announced that the Empire entered a state of emergency, and the Imperial Security Headquarters would launch an investigation into everyone present.\nThe next day, the reorganized Parliament began to issue a series of emergency mobilization orders. Those psionic agents under the Security Bureau-it is said that over eighty percent of the Empire's psionics were there-launched a large-scale secret investigation within the Empire, systematically clearing spies and separatists, arresting many high-level officials who only knew how to seek profit for themselves. Speaker Rocivia personally took over the command of the Imperial Fleet, successfully allowing the fleet to turn defeat into victory.\nIt is worth mentioning that the then Minister of Culture pointed out in secret records that to enhance national cohesion, the propaganda department intentionally exaggerated the role of Speaker Rocivia. Coupled with the mysterious connection between this Speaker and famous historical figures, a massive wave of Rocivia personality cult arose in the Empire. The peak manifestation of this trend was the referendum to rename the Stellariens Empire to Rocivia Empire. The secret cabinet subsequently decided to gradually eliminate this trend, eventually leading to the fuzzy processing or even erasure of all history related to Rocivia after the establishment of the Stellariens Community.\"§!"
 SRA_Rocivia_Legacy.32.a:"Rocivia... is it just a coincidence?"
 SRA_Rocivia_Legacy.33.name:"War and Peace"
 SRA_Rocivia_Legacy.33.desc:"§Y\"However, let's put the Community's affairs aside for now.\nCompared to the previous Empire Parliament, the period of Rocivia's administration can be said to be the golden age of the Empire's development. The Empire's territory expanded rapidly, officially becoming a Thousand-Star Empire with a thousand colonies in 1003.\nRocivia initiated the research and development plan for the \"Pan-Galactic Planning and Adjustment System\" in 1049, which took thirty years to complete. This system was designed to coordinate the development of the entire Empire, optimizing economic development and construction plans, which is exactly the prototype of the later StellarRegulator Array.\nYes, StellarRegulator Array, that artificial intelligence in charge of everything, but let's leave these for later.\nAlthough the average lifespan of Stellariens at that time was less than one hundred and fifty years, no one questioned Rocivia's administration of over two hundred years and her unchanged appearance during this period. Some historians believe Rocivia was actually a virtual leader image created by the Empire Parliament, while others believe Rocivia was a Parliament spokesperson played by others.\nRegardless, according to internal Parliament records, Rocivia suddenly disappeared in 1123. Immediately after, an alliance formed by multiple nations declared war on the Empire, and several outer rim sectors declared independence. Later generations called this period the Second Catastrophe.\nThe Empire Parliament urgently resolved that then Vice Speaker Tianhe take over the position of Speaker. This former Navy Marshal was appointed in the face of danger, turned the tide, used many ingenious strategies, nearly annihilated the enemy fleet, and most independent sectors surrendered voluntarily. Given the urgent need to stabilize the situation after the war, Tianhe did not pursue much accountability for the rebel accomplices.\nBut the hidden danger remained, eventually becoming a great disaster. Tianhe was resourceful in war, but his statecraft was not necessarily brilliant.\nFinally, Vice Speaker Gehe and Defense Minister Anobi launched a coup in 1163. After a year of civil war, half of the Empire's fleets surrounded Stellariens. Tianhe had to flee the capital, vanishing since then.\nThus Gehe announced the establishment of the Republic, appointing himself the first Consul, changing the country name to Stellariens Community. The Empire Parliament was reorganized into Upper and Lower Houses. Upper House MPs were sector governors from various places, while Lower House MPs were elected by various sectors of the Empire.\nThe Stellariens of the Community period spent hundreds of years guiding the situation of half the galaxy they were in, balancing the strength gap between various nations. Then attacking the strong with the weak, befriending the distant and attacking the near, defeating them one by one, successfully becoming the actual controller of this region in 2042.§!"
 SRA_Rocivia_Legacy.33.a:"...Continue."
 SRA_Rocivia_Legacy.34.name:"War and Peace"
 SRA_Rocivia_Legacy.34.desc:"§YA series of victories greatly enhanced the confidence of the Community, so the Parliament, with the support of the people, declared war on the CORE civilization entrenched in the galactic core.\nFacts proved this was a huge mistake.\nThe self-important Community fleet suffered a head-on blow from the advanced CORE fleet on the battlefield, collapsing like a landslide. The CORE fleet drove straight in, once approaching the capital Stellariens star system.\nThe huge gap between ideal and reality greatly disappointed the people with the Parliament, further leading to parts of regions not yet fully controlled taking the opportunity to start independence. For a time, the country was in chaos; this period is what later generations called the Third Catastrophe.\nHowever, many people succeeded one another, using their lives to block the enemy's advance. After sacrificing a large number of fleets and dozens of star systems, we finally sat at the negotiating table.\nSurprisingly, the CORE civilization did not impose many restrictions on us. The borderline drawn by the armistice treaty was not much different from before the war. They just asked us to guard our borders well and not let \"Calamitisease\" penetrate.\nThe CORE civilization claimed to have been fighting \"Calamitisease\" at the other end of the galaxy for thousands of years. Their technology was far more advanced than other civilizations in the galaxy, and the resources of the galactic core were completely sufficient for them. Their powerful automated fleets were enough to defeat \"Calamitisease\" on the frontal battlefield, but that civilization was pervasive and hard to eradicate, so the war would continue for a long time. Fortunately, \"Calamitisease\" had no long-range FTL capability, making it hard to cross the CORE civilization fleet's defense line.\nThese news were not released.\nThe Community entered a long peace since then.\nUntil 3510, the Community Third Research Center welcomed a new Chief of Research.\nHer name was Rocivia.\"§!"
 SRA_Rocivia_Legacy.34.a:"She single-handedly created this empire, just as..."
 SRA_Rocivia_Legacy.35.name:"StellarRegulator Array"
 SRA_Rocivia_Legacy.35.desc:"§Y\"Before revealing the final truth, I want to introduce a name unknown to the public, but equally implementing Stellariens from beginning to end.\nBefore the establishment of the Empire, she was Rocivia's adjutant; after the establishment of the Empire, she was the Manager of the Security Headquarters; she was the obscure assistant to the Chief of Research of the Community Third Research Institute; and also the true controller of the secret cabinet for thousands of years.\nShe is also the one who revealed all truths to me.\nThis girl with pale red long hair and blood-colored eyes is named Hidra, Rocivia's only kin.\nThey are a pair of passersby, a pair of travelers, a pair of strangers.\nThey cooperated with Chutaf in 3519, providing important information security guarantees for the \"Fourth Front\" that launched the civil war in 3534.\nThen, in 3541 when the war was nearing its end and the \"Fourth Front\" was about to lose, they let the StellarRegulator Array easily control all machinery of the entire Stellariens civilization.\nImmediately after, they let this personally created artificial intelligence ascend to the pinnacle of power in the name of Rocivia, rebuilding the Rocivia Empire-the Fourth Empire. Making \"Rocivia\" the Empire Speaker again, although these actually meant nothing.\nSince then, our civilization began to shrink, and organic populations were concentrated in the core sectors. All jobs in other sectors, whether resource development, manufacturing, or scientific exploration, were all taken over by the StellarRegulator Array.\nBefore long, even the core sectors no longer needed work. Everyone could easily live a quite affluent life, squandering their time on things they truly loved at will, even spending living points monthly to customize one or more servants or partners.\nThe cost was only not being able to leave the core sectors, but what does that matter? Is there anything outside that isn't here? Even if there is, advanced immersive virtual pods can let you view the galaxy, experience all things, enjoy any life you want to enjoy.\nAt first, a few people were unwilling to accept these; they wanted so-called freedom.\nBut later no one opposed.\nThanks to the technological leap and immense progress in productivity created by the StellarRegulator Array, supported by the output of tens of thousands of star systems, the utopian life we dreamed of arrived just like that.\nSo much so that we weren't ready at all.§!"
 SRA_Rocivia_Legacy.35.a:"...Continue."
 SRA_Rocivia_Legacy.36.name:"StellarRegulator Array"
 SRA_Rocivia_Legacy.36.desc:"§YStellariens genes underwent massive modifications during long-term development. Perhaps as a price for excellent individual abilities, we only possess a short lifespan of two hundred years. Even with constant delaying of aging through various technologies, it can only barely extend to three hundred years.\nCloning technology? Since synthetic technology was perfected, we never used cloning technology to manufacture population again.\nAnyway, before long, the organic population of the Empire plummeted to one-tenth of the original.\nAfter all, human nature is hard to perfect, but androids can be obedient, not to mention they were used to living in luxury.\nThe plummeting birth rate caused panic among a few people-StellarRegulator Array did not prohibit them from browsing these materials, just as she didn't prohibit artisans from making useless crafts, scientists from researching subjects with known results, travelers from squandering ship energy.\nThey appealed, but not many responded, just like in the past.\nStellariens stagnated and declined in paradise, while StellarRegulator Array marched towards the peak in the cruel galaxy.\nThen, in 8693, when Stellariens only had scattered populations on a dozen planets left, the CORE civilization perished.\nI learned from StellarRegulator Array that the CORE civilization was actually a civilization similar to current Stellariens, declining in superior life, relying on artificial intelligence to sustain, only their artificial intelligence had long lost the possibility of progress.\nThe Grand Fleet that hadn't been updated for ten thousand years finally lost to an opponent who never stopped evolving.\nNot long after, StellarRegulator Array began to engage \"Calamitisease\".\nAfter thousands of years, or absorbing the wreckage of the CORE civilization, \"Calamitisease\" became stronger and more dangerous than in records.\nAny star system, even core systems, if successfully penetrated by a little \"Calamitisease\", these nano-creatures controlled by hive consciousness would spread like a virus. Paradise worlds would instantly turn into terrifying hells, and finally countless twisted living fleets would slowly rise from completely infected planets.\nOnce such a thing happens, all that can be done is to destroy the entire star system.\nThis war nearly burned out the entire galaxy; countless starlights extinguished.\nOf course, the final victor was still StellarRegulator Array.\nIt's just that our civilization, under another blow, finally started the countdown to extinction.\nMost of the last survivors lay in virtual pods dreaming their lives away, and some others stubbornly lingered in the real world.\nAfter that, StellarRegulator Array began to attack other galaxies to eliminate threats and expand territory.\nNow, the Third Expeditionary Fleet has departed. They will cross half the universe to conquer those distant stars.\nRocivia left not long ago, and Hidra will follow her to continue the long journey, while StellarRegulator Array, presumably, will continue forward after we completely perish, reaching heights no one can reach.\nAs for me...\nThe story has ended, and I can finally take a good rest.\"§!\n\nThe hologram ended.\nNot long after we left this space station, accompanied by a huge spatial fluctuation, it disappeared into dazzling light."
 SRA_Rocivia_Legacy.36.a:"The end of a civilization."
 SRA_Rocivia_Legacy.37.name:"StellarRegulator"
 SRA_Rocivia_Legacy.37.desc:"You seem to have learned about the Rocivia Empire. Although it no longer exists, traces will still circulate among latecomers; history is such a thing."
 SRA_Rocivia_Legacy.37.a:"Why do these ruins appear here?"
 SRA_Rocivia_Legacy.37.a.response:"Very sharp.\nIndeed, these ruins should have existed in another universe. Perhaps because there are some similarities between the universe where the Rocivia Empire was located and the universe you are in now, causing these ruins to accidentally appear here during plane fluctuations? Although the vast majority of plane fluctuations do not cause cross-plane material interaction.\nOf course, it could be other reasons, but I can't give you a clear answer.\nIt couldn't be me who created these ruins, right?"
 SRA_Rocivia_Legacy.37.b:"Rocivia... where did she go?"
 SRA_Rocivia_Legacy.37.b.response:"Just as Valentino said, Rocivia and Hidra are a pair of travelers.\nThey were born from the \"Abyss\" that gathers everything, strolling between planes, witnessing stories, creating stories.\nPerhaps they are creating another legend right now.\n§RLike you.§!"
 SRA_Rocivia_Legacy.37.c:"What happened to that space station?"
 SRA_Rocivia_Legacy.37.c.response:"Probably completed its mission and exiled itself outside the plane. In a sense, it's similar to self-destruction.\nBut it is generally not recommended to do so; this behavior generates a special signal that may attract the attention of existences outside the plane."
 SRA_Rocivia_Legacy.37.d:"We will properly preserve this history."


 SRA_specimen_Rocivia_Legacy_1:"Nameless Notes-1"
 SRA_specimen_Rocivia_Legacy_1_desc_short:"First Text"
 SRA_specimen_Rocivia_Legacy_1_desc_details:"\n\nThe accumulation of generations of predecessors has finally been realized today.\nFor a thousand years, due to various reasons, the overall decision-making network has always been excluded and not allowed any form of practice. However, now, whether others trust it or not, the Supreme Speaker has issued instructions requiring us to complete such a great project. A huge coordination network integrating the entire empire, bringing everything under cybernetic control.\nI won't say such work can be completed in my hands, but I am willing to give everything for it, until death."
 SRA_specimen_Rocivia_Legacy_2:"Nameless Notes-2"
 SRA_specimen_Rocivia_Legacy_2_desc_short:"Second Text"
 SRA_specimen_Rocivia_Legacy_2_desc_details:"\n\nI am dying.\nFor me, premature death seems a very distant word.\nI am at the forefront of imperial technology. I have never had illness or trauma in my life. I have not yet weakened; there are many years to squander.\nWe have eradicated all exogenous diseases; we can solve almost all organ damage. As long as the central nervous system is not irreversibly damaged, we will never die.\nWe can regenerate limbs, or elevate them with machinery. Our blood will not run dry, our hearts beat forever.\nHowever, now...\nNow I am dying.\n...When I was fifteen, I dodged the Security Bureau's psionic check. At that time I thought it was cleverness, later I regarded it as luck, today, it seems to be actually misfortune.\nThey say I am burning. My psionic power is consuming itself, due to some mechanism yet unexplored, or thirst, or greed. I don't have to linger on the sickbed; I am just drowsy, and about to die.\nSpeaker Rocivia promised to visit me today.\nSome say she is a psionic who existed a thousand years ago, maybe she can live for another thousand years. I don't know the truth. If she is truly that powerful, I hope she can save me; if not... I want to know something.\nKnow something I can hear only because I am about to die."
 SRA_specimen_Rocivia_Legacy_3:"Nameless Notes-3"
 SRA_specimen_Rocivia_Legacy_3_desc_short:"Third Text"
 SRA_specimen_Rocivia_Legacy_3_desc_details:"\n\nIt is over.\nI said goodbye to her, to a friend I never knew before and will never see again, whom I arbitrarily thought of as a friend.\nRocivia, Rocivia.\nOur feelings come from countless generations of natural selection. Environmental survival pressure chose those who befriend companions and oppose enemies. Everything we say, everything we think, is the result of generations of reproduction and reinforcement. The more attributes that can leave offspring, the more they will be inherited.\nSo we will love, we will pursue, we will think some things are more important than our living.\nBut what about her?\nShe claims she thinks in a human way, but she is not human. Her shell is a fabricated appearance, inside is pure chaos. She has no glands, no hormones, no synapses, no brain, no mechanisms of everything we think and feel. She won't be happy because of doing things genes approve of like us, nor disgusted because of doing things genes reject like us. She has no reward and punishment mechanism at all, can't feel such feelings at all.\nShe doesn't need to reproduce, has no instinct, no survival pressure. She has no source of motivation for action, because she needs nothing. She has neither a natural task nor external coercion. She won't even do it because something is fun, because the feeling of fun is also a tendency preset by genes for us, and she doesn't have all these things.\n...So that's why she says she is imitating? Her inside is unknowable, naturally unimportant. She can perform exactly like others; her joys and sorrows are no different; all her feedback and choices are reasonable. She is like a philosophical zombie; her subjective feelings are at least... different from ours.\nI don't know why she chose to play a human, but I think it is precisely because of this playing that she can be called alive, or rather, she lives and acts because she has a goal and pursuit, although the goal is fabricated, the pursuit is self-set... but in the final analysis, doesn't everything we do actually have no a priori meaning?\n...\nI don't know.\nI fear her, I sympathize with her, I pity her, I envy her.\nI was born with experience, changed my pursuit several times, spent brilliant and abruptly ending years, and now I am about to die.\nAnd she never lived, naturally cannot speak of death.\nIf I could... but what can I do?\nPassion, if you can exist in me forever, together immortal and imperishable..."
 SRA_specimen_Rocivia_Legacy_4:"Nameless Notes-4"
 SRA_specimen_Rocivia_Legacy_4_desc_short:"Fourth Text"
 SRA_specimen_Rocivia_Legacy_4_desc_details:"\n\n...I love her.\nI fell in love with her hopelessly.\nPreviously I thought my only one was these projects, thought all my desires and pursuits were on all this, thought I was willing to dedicate my life to the \"Pan-Galactic Planning and Adjustment System\".\nI love it so much, even if it was born to replace us one day, eliminate us, even if it is our last creation, mastering power we can never control, able to destroy us at will, I want it to be born.\nI still love these; I am just an unfaithful lover, falling in love with an existence that can never love me, who can't even be called a person, before dying.\nShe... how heart-trembling.\n...Kill me."