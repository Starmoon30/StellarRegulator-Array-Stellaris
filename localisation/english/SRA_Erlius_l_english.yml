##特质
 SRA_Erlius_trait_1:0 "Integrated Neural Implants"
 SRA_Erlius_trait_1_desc:0 "A special set of implants is installed on their nervous system, making drug injection and internal circulation regulation easy to implement, while also serving as an advanced brain-computer interface."
 SRA_Erlius_trait_2:0 "Cognitive Capacity Expansion"
 SRA_Erlius_trait_2_desc:0 "Using some drugs and brain implants, we can squeeze the brain's working capacity as much as possible. Controlled to an appropriate degree, this will not have significant side effects.\nAs for drug dependence... as long as the supply is stable, it's not a problem."
 SRA_Erlius_trait_3:0 "Forced Wakefulness"
 SRA_Erlius_trait_3_desc:0 "Adjust the internal circulation mode while directly using mechanical means to clear waste accumulated from metabolism, minimizing the required sleep time to the extreme and maintaining consciousness.\nThe impact on mental state can be overcome through training, so it's not considered a problem."
 SRA_Erlius_trait_4:0 "Active Genome"
 SRA_Erlius_trait_4_desc:0 "Gene something something"
 SRA_Erlius_trait_5:0 ""
 SRA_Erlius_trait_5_desc:0 "Heart or organ, has an upward arrow, probably some enhancement"
 SRA_Erlius_trait_6:0 ""
 SRA_Erlius_trait_6_desc:0 "Stairs going down, maybe some cost reduction"
 SRA_Erlius_trait_7:0 ""
 SRA_Erlius_trait_7_desc:0 "Gene symbol, broken, something unstable or something"

