 SRA_RE_Hidra.500.desc: "§H虚境§!的流动骤然狂暴，将我们席卷到了一处此前我们从未发现过的领域之中。\n模糊而狰狞的树杈在这里无处不在，在§H虚境§!的每一个表面滋长，穿刺，§R虚境正在流血。§!而直面这一切的我们也被§H虚境§!的痛苦所压倒，我们的灵能尖啸着碎裂，发出垂死的嘶嚎。\n就当我们绝望之时，§R某个存在§!向我们投下了目光。\n\n压力骤然减缓，消亡，无影无踪，我们又能在§H虚境§!中自由的活动了。然而，这处§H虚境§!的伤痕仍然存在，它是如此的令人悚骇，就好像无边无际的§H虚境§!会因此而衰弱死去。\n§R那个存在§!没有对我们言说什么，但祂表现出的似乎是一种模糊的善意？我们不知道祂和这道伤痕有什么关系，但祂也带着同样的令人不安的感觉。\n\n我们正在脱离§H虚境§!，暂且称§R这个存在§!为§R$code_name_SRA_patron_Hidra$§!吧，我们也许很快就能再会了。"
 SRA_RE_Hidra.500.a:0 "令人不安。"

 SRA_RE_Hidra.501.name:0 "§R$code_name_SRA_patron_Hidra$§!"
 SRA_RE_Hidra.501.desc:0 "§Y我们循着此前留下的灵能印记重新找到了我们称之为§R$code_name_SRA_patron_Hidra$§!的§H虚境§!存在，此刻祂并不身处那个可怖的伤痕之旁，而是在§H虚境§!的某个新的领域。那些猩红的树杈在祂的身旁缓缓生长，但还没有在§H虚境§!上撕开新的伤口。\n§R$code_name_SRA_patron_Hidra$§!看向我们，祂的注目令我们感到深切的不安。§!\n\n你好啊，外来者。"
 SRA_RE_Hidra.501.a:0 "你是？"
 SRA_RE_Hidra.502.name:0 "§R$SRA_patron_Hidra$§!"
 SRA_RE_Hidra.502.desc:0 "§Y§R$code_name_SRA_patron_Hidra$§!似乎轻笑了一声，随后笼罩着祂的迷雾逐渐散去，露出了一个你相当熟悉的身影。§!\n\n在这里的话，嗯，其他§H虚境§!存在称我为§R$SRA_patron_Hidra$§!，我们就暂且借用这个称谓吧。\n\n§Y$Name_SRA_RE_leader_Hidra$，或者按她的说法，§R$SRA_patron_Hidra$§!露出了一个不怀好意的笑容。§!\n\n这个宇宙真有意思，有这么多千奇百怪而又广阔的位面，可以随意旅行，不像有些孤岛，连一点上级位面都没有。\n§H虚境§!映照出了我的一些侧面，或者说，我影响的其中一部分在这里被放大了，我仅仅只是轻轻触碰了一下，就留下了这样的一道创伤。\n对宽广的§H虚境§!来说这小小的一处并不算什么，但它既然挑选了这样的性质，也许哪天会有很有意思的场面也说不定？\n不过眼下，我们可以当做无事发生，你可以继续享受你的§H虚境§!探索，不用在意我。"
 SRA_RE_Hidra.502.a:0 "害怕……"
