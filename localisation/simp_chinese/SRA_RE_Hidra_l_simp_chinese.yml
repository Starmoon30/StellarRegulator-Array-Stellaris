 SRA_patron_Hidra: "猩红之创痕"
 SRA_patron_Hidra_article: "$SRA_patron_Hidra$"
 SRA_patron_Hidra_article_cap: "$SRA_patron_Hidra$"
 SRA_patron_Hidra_color: "§L$SRA_patron_Hidra$§!"
 SRA_patron_Hidra_color_article: "§R$SRA_patron_Hidra$§!"
 SRA_patron_Hidra_color_article_cap: "R$SRA_patron_Hidra$§!"
 SRA_patron_Hidra_desc: "一次触碰在§H虚境§!中留下的令人悚骇的伤痕，血棘滋长，创伤蔓延。也许有朝一日，§H虚境§!将因此§R干枯死去§!。"
 code_name_SRA_patron_Hidra: "悚骇之物"
 SRA_patron_Hidra_passive_accord_effect: "§R荣耀的时刻即将到来。§!"
 SRA_patron_Hidra_passive_accord_modifier: "§R彷徨与无措已然结束。§!"

 SRA_patron_Hidra_project_desc_end:0 "在知道这个实体的真名之前，我们会称之为§H$code_name_SRA_patron_Hidra$§!。"
 SRA_patron_Hidra_project:0 "与$code_name_SRA_patron_Hidra$通灵"
 SRA_patron_Hidra_project_DESC:0 "$MINOR_PATRON_FC_PROJECT_DESC$\n\n$SRA_patron_Hidra_project_desc_end$"
 SRA_patron_Hidra_project_hive:0 "与$code_name_SRA_patron_Hidra$通灵"
 SRA_patron_Hidra_project_hive_DESC:0 "$MINOR_PATRON_FC_PROJECT_HIVE_DESC$\n\n$SRA_patron_Hidra_project_desc_end$"
 SRA_patron_Hidra_project_machine:0 "与$code_name_SRA_patron_Hidra$通灵"
