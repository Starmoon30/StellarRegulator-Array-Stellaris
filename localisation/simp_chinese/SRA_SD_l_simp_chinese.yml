 ###遗珍
 SRA_SD_First_Murder:0 "§R初戮之血§!"
 SRA_SD_First_Murder_desc:0 "这枚血石在久远到不可知的年代，被一个人拿起，刺向另一个人。\n那是第一次掠夺，第一次征戮，第一次谋杀。\n它狩猎过山岳般庞大的巨兽，也屠宰过云群般温顺的牲畜，它一次又一次被遗失，又被掘起，成为无数长杆的矛头，浸润无数生灵的鲜血，染红，染黑，被破碎被磨砺，直到彻底失去它曾作为一枚石头的一切，转为由纯粹的血债所凝，不可磨灭。\n\n打造为箭时，所造成的伤口被恨意浸透，力量皆如鲜血流淌而出，直至凋亡。\n打造为矛时，所造成的伤口被杀意浸透，血肉皆化利刃破体而出，直至枯死。\n若持有者将其浸润在屠戮所知一切后狂喜与绝望之泪中，此物立即毁灭。"
 SRA_SD_First_Murder_modifier:0 "§R这枚血石闪烁着，渴望下一次屠戮。§!\n\n§Y持有这件遗珍使你得以做出§R选择§!。§!"
 SRA_SD_First_Murder_effect:0 "§R初戮之血呼唤杀戮。§!\n\n所有与你§R敌对§!的国家：\n统治者§R立即死亡§!\n$MOD_PLANET_STABILITY_ADD$：§R-100%§!\n持续3600.00£time£\n\n§Y这并非明智之举。§!"
 SRA_SD_First_Murder_debuff:0 "§R杀戮诅咒§!"
 SRA_SD_First_Murder_debuff_desc:0 "这个国家被初戮之血侵蚀，混乱将无处不在。"

 SRA_SD_Fire_of_Lightkeeper:0 "§Y逐雾之火§!"
 SRA_SD_Fire_of_Lightkeeper_desc:0 "“掌灯者”诺兰登过去使用的提灯，既是他的火源，也是他的照明物。\n传说在他登上孤山之前，他为自己的部落管理灯火，驱散夜幕与迷雾。\n后来他走向孤山，提灯引火，驱散了深渊的阴影，将诸神的指引带给人类。\n\n此物中的火苗永不熄灭，发出的光亮能抑制深渊的活动，恍惚之人注视此物能重拾本心。\n若持有者在一个被绝望浸没的世界亲手掐灭火苗，此物立即毁灭。"
 SRA_SD_Fire_of_Lightkeeper_modifier:0 "§Y这盏提灯对今日不置可否。§!"
 SRA_SD_Fire_of_Lightkeeper_effect:0 "§Y逐雾之火点燃信仰。§!\n\n"
 SRA_SD_Fire_of_Lightkeeper_effect_2:0 "深渊的负面影响§G降低§!\n\n§Y这并非明智之举。§!"
 SRA_SD_Fire_of_Lightkeeper_buff:0 "§Y逐雾之火§!"
 SRA_SD_Fire_of_Lightkeeper_buff_desc:0 "掌灯者用此火照出诸神之形，也在远方投下阴影。"

 SRA_SD_Annihilating_Growl:0 "§R歼灭轰鸣§!"
 SRA_SD_Annihilating_Growl_desc:0 "某种相对可控的可重复使用的毁灭性武器。\n歼灭轰鸣是数个地代前的造物，它很可能彻底修改过萨塔瑞兹的地貌，乃至清洗过整个世界上的生命。\n当被激活时，它发射一种调制脉冲束，裂解符合指定标准的物质，释放的大部分能量将转化为同类脉冲并向周围扩散，扩散速度依照使用者的意愿而决定。\n“指定标准”的范围仍然不明，现有记录给出了一些案例。\n\n可用标准至少包含如下内容：\n物件类型，物件主要用途，物件主要构成，与命中目标的直线距离，物件当前相对速度，物件生命有无。\n\n无效标准至少包含以下内容：\n物件归属，物件的物质状态，物件体积，与命中目标相连情况，物件的“好坏”，物件的颜色。\n\n以上标准皆基于使用者的认知。\n\n当使用者下达与未知标准冲突的指令时，此物立即尝试摧毁使用者，若失败，则此物立即毁灭。\n目前已知，未定义与命中目标的直线距离的指令都会导致与标准冲突，但最大距离仍然未被测试得出。"
 SRA_SD_Annihilating_Growl_modifier:0 "§R这件遗物正在等待你。§!"
 SRA_SD_Annihilating_Growl_effect:0 "§R启动歼灭轰鸣§!"


 SRA_SD_Arcane_relic:0 "§B枢衡山奥术投射系统§!"
 SRA_SD_Arcane_relic_desc:0 "这座架设在枢衡山遗址上的庞大奥术结构用于为所有在['concept_SRA_SD_barren_space']活动的我方舰船提供奥术施法增幅效果。\n\n枢衡山曾经只是一处无名的小丘陵，但从塔拉领主在此地开始征服大业，这里便开启了一段纷争的历史。枢衡山领的征服霸权被龙火毁灭，枢衡山上层层叠叠的奥术设施也被熔做废石，但这些痕迹交叠在一起，又引出了新的力量，进而在此后一步步成为了如今的奥术能量焦点。\n['concept_SRA_SD_The_Rips']后，翡翠塔学会回收了这片土地并净化了其上笼罩的['concept_SRA_SD_Abyss_Erosion']，将回荡于此的无尽奥术能量引入结晶簇的共鸣之中，传递到每一枚自枢衡山阵列上取下的晶体单元，为无数孤悬['concept_SRA_SD_barren_space']之中的游船赠出礼物。"
 SRA_SD_Arcane_relic_modifier:0 "§B提供等于 能量武器修正*50% + 爆破武器修正*50% 的['concept_SRA_SD_Arcane']武器修正，因此乃塑造之现象。§!\n\n"
 SRA_SD_Arcane_relic_effect:0 "§B在1800.00£time£内使你的['concept_SRA_SD_Arcane']武器修正提升等同于此刻修正的数值，作为超载阵列的代价，你舰船的维护成本也将同比上升。§!"
 SRA_SD_Arcane_relic_buff_A:0 "§B奥术过载§!"
 SRA_SD_Arcane_relic_buff_B:0 "§B奥术过载§!"

 SRA_SD_Divine_relic:0 "§Y诺兰登手稿§!"
 SRA_SD_Divine_relic_desc:0 "这件来自我们纪元开端的神话遗物与我们的神术阵列共鸣以强化所有在['concept_SRA_SD_barren_space']活动的我方舰船的神术施法效果。\n\n这份由“掌灯者”诺兰登写就的书卷记载了他在各地游历的所见所闻，传说他就是这样踏上了神话道途，这份手稿也因此凝结了自他而起的诸神的影响力，进而能够扩展作为所有神术施法的象征物。\n一些研究者认为，这些文字之下其实用密语记录了一个将会震惊世界的秘辛，解开它的人能够得到神话力量真正的起源和规则，从而掌控乃至创造诸神，这才是这份手稿有着如此强大力量的原因。无论如何，还没有人真的如他们所说那样解开这个秘密。"
 SRA_SD_Divine_relic_modifier:0 "§Y提供等于 舰载机武器修正*25% + 动能武器修正*50% 的['concept_SRA_SD_Divine']武器修正，因此乃重铸之事物。§!\n\n"
 SRA_SD_Divine_relic_effect:0 "§Y在1800.00£time£内使你的['concept_SRA_SD_Divine']武器修正提升等同于此刻修正的数值，作为超限仪式的代价，你舰船的维护成本也将同比上升。§!"
 SRA_SD_Divine_relic_buff_A:0 "§Y超限仪式§!"
 SRA_SD_Divine_relic_buff_B:0 "§Y超限仪式§!"

