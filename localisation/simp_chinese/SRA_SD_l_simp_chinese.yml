 SRA_BoM_stat_a_tooltip:0 "['concept_SRA_SD_element_forge']代表着你创造的能力，或者说，你的力量。\n\n此数值的提升能强化你塑造事物的能力，譬如将你的目标塑造为原材料，也即让你麾下的部队毁灭敌人。"
