 job_SRA_SD_chaos_explorer_effect_desc:0 "£job_SRA_SD_chaos_explorer£ $job_SRA_SD_chaos_explorer_plural$ 探索深渊，获取宝贵的见解与记录，并产出£unity£ §Y$unity$§!与少量£astral_threads£ §Y$astral_threads$§!。"
 job_SRA_SD_chaos_explorer_desc:0 "战士，学者，探险家。在深渊中行走，绘制过往的脚步，探寻文明的前路，不畏苦暗。\n\n§Y每180.00£time£，§R树海残枝§!会检测当前的£job_SRA_SD_chaos_explorer£ $job_SRA_SD_chaos_explorer_plural$ 并在此岗位已满时消耗所有就任此岗位的人口，以提升§R树海残枝§!的区划上限。§!"
