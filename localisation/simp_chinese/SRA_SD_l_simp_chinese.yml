 SRA_BoM_stat_b_triggered_desc:0 "因你的['concept_SRA_SD_element_edge']:§Y[this.SRA_SD_element_edge_value]§!，你得到："

 SRA_BoM_stat_c:0 "石:§Y[From.SRA_SD_element_stone_value]§!"
