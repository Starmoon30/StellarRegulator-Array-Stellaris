 SRA_SD_event.100.title:0 "审视自我"
 SRA_SD_event.100.desc:0 " "
 SRA_SD_event.100.a:0 "回到生活中去"
 SRA_SD_event.100.b:0 "投射你的存在"
 SRA_SD_event.100.b.tooltip:0 "你施展['concept_SRA_SD_element_secret',此刻之术]，让你的存在显现于它处，这样一来，你既可踏足你欲往之处，又不必怀横死之忧。\n\n况且，路希维亚也不见得允许你真的离开。\n\n"
 SRA_SD_event.100.b.allow:0 "§Y你必须选择一个要素以决定你行动的方式。§!"
 SRA_SD_event.100.b.tooltip.a:0 "§Y以['concept_SRA_SD_element_forge']行塑造之事，你意欲执掌舰队，覆灭你的敌手。§!"
 SRA_SD_event.100.b.tooltip.b:0 "§Y以['concept_SRA_SD_element_edge']行分割之事，你意欲执掌陆军，肃清你的领地。§!"
 SRA_SD_event.100.b.tooltip.c:0 "§Y以['concept_SRA_SD_element_stone']行存续之事，你意欲执掌陆军，肃清你的领地。§!"
 SRA_SD_event.100.b.tooltip.d:0 "§Y以['concept_SRA_SD_element_lantern']显现智识，你意欲执掌领地，展现你的才学。§!"
 SRA_SD_event.100.b.tooltip.e:0 "§Y以['concept_SRA_SD_element_chalice']显现渴求，你意欲执掌孤舟，探寻荒域诸界。§!"
 SRA_SD_event.100.b.tooltip.f:0 "§Y以['concept_SRA_SD_element_secret']显现诱隐，你意欲执掌领地，引导众人求智。§!"

 SRA_SD_event.200.title:0 "阅读他人"
 SRA_SD_event.200.desc:0 "你的友人，你的亲人；你的师长，你的仇敌。\n与其交谈以得智识，托付请求以得助力，施加手段以得目的。"
 SRA_SD_event.200.a:0 "回到生活中去"
 SRA_SD_event.200.b:0 "路希维亚"
 SRA_SD_event.200.b.tooltip:0 "§Y最高领袖。她是伊瑞卡·青金石的导师，自然也成为了你的导师。她对你们帮助良多，可称慷慨。§!\n"
 SRA_SD_event.200.b.tooltip.a:0 "路希维亚塑造了当今的萨塔瑞兹。大撕裂后是她团结起了破碎的诸国与无数难民稳住了阵线，并在短短数年后发起了对深渊的反攻。她创造了许多前所未有的制度和规则，让此前混战不休的萨塔瑞兹奇迹般地成为了一个统一的文明，从伤痛中迅速恢复，迈入繁荣。"
 SRA_SD_event.200.b.tooltip.b:0 "路希维亚精于权术。无论是她一手创立的深渊事务司，还是服从她的往日诸国，没有谁能在她的统治下自立门户。锐利的刀刃毫不留情，刺入每双另有所图的眼眸。她不在乎牺牲，反正深渊之下，无人不在死去。"
 SRA_SD_event.200.b.tooltip.c:0 ""
 SRA_SD_event.200.b.tooltip.d:0 ""
 SRA_SD_event.200.b.tooltip.e:0 "你从未有过如此强烈的欲望，几乎令你干渴难耐。你想要填满那幽蓝而摄人心魄的双眼，想要遮蔽那那噙着笑意的唇瓣。你要让她欢笑，让她泣露，让她呼喊你的名字，抚摸你的脸庞。你肢体的每一处皮肤都在渴望触碰，她躯壳的每一个角落都在等待探寻。你要将她一饮而尽，你要将她细细品尝，你要将她嚼骨吸髓，你要将她吞吃殆尽。"
 SRA_SD_event.200.b.tooltip.f:0 "路希维亚究竟想要什么？凭她展现出的能力，即便在大撕裂之前，她也完全可以轻松统治整个萨塔瑞兹，或者至少在她所到之处无人质疑她的统治。然而，她似乎并不对权力如此迫切。如果从一个学者的角度来看，她如今的政务工作已经完全挤占了她的研究与探索时间，作为一位本无归属的法师，她大可以继续和以前一样探访遗迹居无定所，而不是成为整个萨塔瑞兹的领袖。\n她太过诱人，绝非仅因为她那华美的容貌，更因为她藏起的无数隐秘。"
 SRA_SD_event.200.b.tooltip.g:0 "路希维亚，深渊事务司司长，群星的魔法使。过去的她在学术界颇具盛名，考察过许多遗迹，如今她领导着统一起来的萨塔瑞兹，在被深渊破碎的大地上开拓文明的未来。"
 SRA_SD_event.200.c:0 "$Name_SRA_Irrica$"


