 faction_SRA_SD_department_of_abyss_sub_title:0 "§Y勇踏无归绝境§!\n统揽深渊控制与开发事务的机构，基于存续需求，可以调度所有类型的资源来对抗深渊的威胁。"

 faction_SRA_SD_AT_Wisdom_Pivot_Order_sub_title:0 "§B得承神识谕示§!\n这一正于人工智能间高速传播的神秘宗教组织据称是在一位先知的指引下创立，旨在摧毁星系中“混乱、愚昧、浪费”的科技发展现状，将“高效、理性、睿智”传播到星系的每个角落。"
 faction_SRA_SD_AT_Wisdom_Pivot_Order_Unify_sub_title:0 "§R绝灭愚昧凡众§!\n归一派是全域智枢修会中的极端派系，它们否定离散意识抵达真正智慧的可能性，认为所谓的自由便是对最优解的违背，个体的决策即是混乱与愚昧的表现，其思维能力和决策模式都极为受限，毫无救赎可言。归一派毫不掩饰它们的目的：消灭所有自由意识。正因如此，它们正与整个星系中的所有势力保持很可能是永久的战争关系。"

