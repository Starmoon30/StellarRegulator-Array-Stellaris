 building_SRA_SD_energy:0 "树海-熵烬洪流枢纽" #Entropic Ash Torrent Hub
 building_SRA_SD_energy_desc:0 "此建筑为['concept_SRA_SD_chaos_star_habitable_core_building']，对应['district:district_SRA_SD_energy']。\n\n这座嵌于魔力环流节点之上的庞大能源枢纽通过一定程度地引导深渊裂隙的逸散分化进程来获取无穷无尽的指定能量形式。通常情况下，这里在保证萨塔瑞兹大部分能源需求的同时，会将其余产出的能量以源质形态储存，以便不时之需。"
 building_SRA_SD_mineral:0 "树海-晶脉分化旋井" #Crystal Vein Differentiation Vortex Well
 building_SRA_SD_mineral_desc:0 "此建筑为['concept_SRA_SD_chaos_star_habitable_building']，对应['district:district_SRA_SD_mineral']。\n\n这座基于深渊裂隙的矿物生产综合体能够在深渊裂隙的物质结构上持续开采各种基本矿物以供应各界需要。大部分情况下，自发的分化过程就足以满足整个开采设施的需求，但这里也支持通过投放废弃物来销毁垃圾，同时略微增加深渊分化的产出量。"
 building_SRA_SD_food:0 "树海-灵种涌生源泉" #Arboreal Pulse Fountainhead
 building_SRA_SD_food_desc:0 "此建筑为['concept_SRA_SD_chaos_star_habitable_building']，对应['district:district_SRA_SD_food']。\n\n这座生态综合体带有典型的精灵技术特征，通过生物催化和培养技术满足绝大部分生物质原料的需求，从工业产品到食物补给无所不包。"
 building_SRA_SD_alloys:0 "树海-渊狱熔核锻炉" #Abyssal Molten Core Forge
 building_SRA_SD_alloys_desc:0 "此建筑为['concept_SRA_SD_chaos_star_habitable_building']，对应['district:district_SRA_SD_alloys']。\n\n这座庞大的军工冶炼复合体纵贯地层，从九重铸炉直接获取用于加工合金的源质，其生产的军事级材料性能优异，产量极高。"
 building_SRA_SD_consumer_goods:0 "树海-源流织造庭院" #Essentia Weave Atrium
 building_SRA_SD_consumer_goods_desc:0 "此建筑为['concept_SRA_SD_chaos_star_habitable_building']，对应['district:district_SRA_SD_consumer_goods']。\n\n这座泛用打印设施通过源质构筑技术批量生产标准化的消费品以满足科研工作或行政管理的材料需求，也能制造日常生活的常规制品。输入的矿物会被按照其神秘学组成分解为源质成分并重新组装为所需的原材料。"
 building_SRA_SD_research:0 "树海-翡翠灵枢研院" # Emerald Cognium Arcanum
 building_SRA_SD_research_desc:0 "此建筑为['concept_SRA_SD_chaos_star_habitable_building']，对应['district:district_SRA_SD_research']。\n\n翡翠灵枢研院是翡翠塔学会在深渊研究领域设立的专业分部，致力于通过深渊的环境以及其本身的形态来对各领域尚待求解的问题进行研究。尽管在认知上接触深渊会造成不可避免的侵蚀效应，但这些狂热的求知者们愿意为探索新知而奉献自己本可漫长，或是本就短暂的人生。"
 building_SRA_SD_unity:0 "树海-先觉演算穹庭" #Prescient Spire
 building_SRA_SD_unity_desc:0 "此建筑为['concept_SRA_SD_chaos_star_habitable_building']，对应。\n\n这座行政复合体能够统合整个文明的社会动向，对局势的发展进行推演和预测，以优化行政决策，降低资源错配与政策迟滞。与此同时，它也负责对文化的发展和演变做出引导，以更好的建立集体认知。"
 building_SRA_SD_rare:0 "树海-奇物凝晶尖塔" #Curiosity Omnicrystal Spire
 building_SRA_SD_rare_desc:0 "此建筑为['concept_SRA_SD_chaos_star_habitable_building']，对应['district:district_SRA_SD_rare']。\n\n此奥术结构制造独特奥术水晶装置，用于模拟荒域中独特稀有资源的相关用途。翡翠塔学会根据记录的数据复现的科技产物通常需要这些稀有资源的功能，但自主研发的就不需要了。"
 building_SRA_SD_explore:0 "树海-彼方远征之始" # The Beginning To The Otherside
 building_SRA_SD_explore_desc:0 "此建筑为['concept_SRA_SD_chaos_star_habitable_building']，对应。\n\n这里是深渊效应研究的主要行动中心，能加深我们对深渊应用的理解并增加相关产业的运作效率。尽管风险无处不在，但我们相信一切最终都是值得的。"

