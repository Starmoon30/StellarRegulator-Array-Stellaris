 ###########深渊事务司



 SRA_SD_event.19.name:0 "翡翠塔文献还原"
 SRA_SD_event.19.desc:0 "我们可以基于翡翠塔内的文献，对已知的古代太空技术体系进行本土化复现，基于萨塔瑞兹独特规则和作用体系，运用特有材料还原大多数技术要求的各项参数。\n以此方法能轻易获取常规星际文明的大多数技术，但在此基础上做出新的进展则需要更多的努力和积累。\n如果如此选择，预计需要数十年的时间来建立完善的科技理论体系。"
 SRA_SD_event.19.a:0 "这将会让我们获得巨大的优势。"
 SRA_SD_event.19.a.tooltip:0 "§E效果：§!\n§Y立即获得绝大多数科技。§!\n\n§P惩罚：§!\n$MOD_COUNTRY_ALL_TECH_RESEARCH_SPEED$：§R-400%§!，持续§Y40.00年§!。"
 SRA_SD_event.19.b:0 "还是脚踏实地吧。"
 SRA_SD_event_19_buff:0 "翡翠塔文献还原"
 SRA_SD_event_19_buff_desc:0 "我们需要重新建立科研体系。"


 SRA_SD_event.20.name:0 "§B深渊事务司§!"
 SRA_SD_event.20.desc:0 "「我们求索，我们斗争，我们是文明的边际，我们是生灵的防线。」\n\n深渊事务司是统揽深渊控制与开发事务的机构，基于存续需求，可以调度所有类型的资源来对抗深渊的威胁。你可以在这里发布相关决策。"
 SRA_SD_event.20.a:0 "开始探索深渊"
 SRA_SD_event.20.a.tooltip:0 "每次探索需要消耗 §Y5个人口§! 才能开始，这些勇士们会英勇无畏地迈向未知，哪怕结局可能是一去不还。\n探索需要花费数年的时间，在此期间，探索队会多次反馈结果，也许是收获，也许是灾难，这一切基于探索的投资、['concept_SRA_SD_chaos_star_habitable_vitality']、我们的技术水平，以及归根结底，命运的安排。\n\n失落祭司的存在和其能力，以及深渊之龙的态度，会对探索产生不可知的影响。"
 SRA_SD_event.20.b:0 "开始狩猎深渊"
 SRA_SD_event.20.b.tooltip:0 "这将导致一场地面战斗发生，深渊的造物会与我们的防御陆军正面对抗，这可以使得['concept_SRA_SD_chaos_star_habitable_vitality']一定程度地下降，前提是我们能活下来。\n深渊入侵的强度主要基于当前的['concept_SRA_SD_chaos_star_habitable_vitality']，并不幸地与我们的技术一同增长，尽管它们不会完全追上我们的发展，但我们也只能遵从命运的决断。\n狩猎会创造一段时间的安全期，在此期间，不会自然发生深渊入侵。\n\n§R一定要小心，我们承受不起失败的代价。§!"
 SRA_SD_event.20.c:0 "催化深渊"
 SRA_SD_event.20.c.tooltip:0 "执行一系列§R高度危险§!的仪式来§Y提高§!['concept_SRA_SD_chaos_star_habitable_vitality']，可以使得['concept_SRA_SD_chaos_star_habitable_vitality']§Y直接翻倍§!，但会带来一系列§R危险的次生效应§!，主持仪式的$councilor_SRA_SD_lost_presbyter$有可能因此§R丧命§!。"
 SRA_SD_event.20.d:0 "紧急泄压"
 SRA_SD_event.20.d.tooltip:0 "执行一系列§R高度危险§!的仪式来§Y降低§!['concept_SRA_SD_chaos_star_habitable_vitality']，可以使得['concept_SRA_SD_chaos_star_habitable_vitality']§Y直接减半§!，但会带来一系列§R危险的次生效应，并造成广泛的破坏§!。"
 SRA_SD_event_20_d_buff:0 "灾厄洪流"
 SRA_SD_event_20_d_buff_desc:0 "为了削弱深渊之中翻涌的混沌，我们以自己的家园承受了它的侵蚀。"



 SRA_SD_event.21.name:0 "踏行深渊"
 SRA_SD_event.21.desc:0 "的确，深渊是我们所生活的世界的扭曲，将一应色彩涂抹成黑，让一切被磨蚀。\n但正因如此，它是那样的丰饶，无所不有无穷无尽。\n「夜空中的每一颗星辰都镶嵌在深渊里。」\n即便仅仅只是登上孤山，也能摘下星海的珠宝……\n我们踏行深渊，我们探索深渊，我们从深渊中汲取对抗深渊的力量，我们凭昨日创造明天。"
 SRA_SD_event.21.a:0 "我们一往无前"
 SRA_SD_event.22.name:0 "狩猎深渊"
 SRA_SD_event.22.desc:0 "深渊弥散，张扬它的存在，宣泄它的权能。\n那红与黑的迷雾在孤山上下蔓延，一刻不停地前进，磨灭一切文明或自然的痕迹。\n「风雪涂抹战士的面目，迷雾吞噬英雄的名讳。」\n无论侵蚀的是生灵还是死物，深渊都会延伸它的影响力，并威胁到我们的存续。因此，我们必须狩猎深渊，狩猎无序的造物，与无序本身。"
 SRA_SD_event.22.a:0 "我们无所畏惧"


 SRA_SD_event.23.name:0 "§R戛然而止§!"
 SRA_SD_event.23.desc:0 "一场混乱终止了故事，讲述者缄默不言。\n\n\n或者？"
 SRA_SD_event.23.a:0 "§R就此结束。§!"
 SRA_SD_event.23.b:0 "§Y仍有未来。§!"
 SRA_SD_event.23.b.tooltip:0 "你不愿让故事潦草地断在此处，即便要加上一些不太令人赞许的情节，它也应当延续下去。\n\n\n§Y清空星球上所有的陆军并添加一些诡异的守卫。§!"

 SRA_SD_event.95.name:0 "§R风雪蔽目§!"
 SRA_SD_event.95.desc:0 "[Root.GetName]见到了§R无法逾越的深邃黑暗§!。\n\n深渊低语着抹去一切不同，将现实熔铸为均一的混沌。[Root.GetName]的形体消弭，面目模糊，言语息声，意志凋亡，沦为深渊侵蚀下的一具空壳，一道阴影。"
 SRA_SD_event.95.a:0 "§R[Root.GetName]不复存在。§!"
 SRA_SD_event.96.name:0 "§R浅海轻唱§!"
 SRA_SD_event.96.desc:0 "§R你§!和他们是不一样的。\n§R你§!能听懂那迷雾中传出的每一个词句，§R你§!能感受深渊中明灭的每一次脉动。§R它§!不曾伤害过§R你§!，§R它§!聆听§R你§!的意愿，§R它§!回应§R你§!的请求，§R它§!对§R你§!施以别样的慷慨。"
 SRA_SD_event.96.a:0 "§R你§!也许会有所收获。"
 SRA_SD_event.97.name:0 "§R灯火将熄§!"
 SRA_SD_event.97.desc:0 "命运自尽头而来，降下它的帷幕，[Root.GetName]疲惫不堪，伤痕累累。深渊的侵蚀扭曲了[Root.GetHeShe]的躯体，磨灭着[Root.GetHeShe]的意志。此刻，[Root.GetName]尚未倒下；但彼时，就无人知晓了。"
 SRA_SD_event.97.a:0 "§R[Root.GetName]的意志正遭受考验！§!"
 SRA_SD_event.98.name:0 "§Y灯火不灭§!"
 SRA_SD_event.98.desc:0 "尽管一度被深渊的险恶诅咒逼入绝境，但是[Root.GetName]的故事并没有就此结束。凭着决心与意志，[Root.GetName]在风暴中屹立不倒，愈发强大。"
 SRA_SD_event.98.a:0 "§Y[Root.GetName]战胜了深渊的侵蚀！§!"


 SRA_SD_event.507.name:0 "§R策展人城邦§!"
 SRA_SD_event.507.desc:0 "那些目前仍未注意到我们的存在的人，我们代表着一个称作策展人的组织。我们之前的任务都是围绕着收容与研究异常物体、实体以及其它各种各样的现象展开的。五个银河周期以来以来，这些任务一直都是我们组织的工作重点。\n\n§R由于出现了超出我们控制的情况，此指令现已更改。我们的新任务将为灭除所有意识体。§!\n\n§Y此后将不会有进一步的通讯。§!"
 SRA_SD_event.507.a:0 "§R为什么？§!"

 SRA_powerword_death:0 "绝杀术"
 SRA_powerword_death_desc:0 "你以强大的意志迫使你的目标屈从于死亡。"
 SRA_powerword_death_2:0 "腐化魔法"
 SRA_powerword_death_2_desc:0 "扣你豁免"
