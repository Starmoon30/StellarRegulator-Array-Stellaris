 d_SRA_SD_star_chaos:0 "§R深渊§!"
 d_SRA_SD_star_chaos_desc:0 "孤山、荒泉、大地之眼……我们有无数个名字用来称呼那个地点，那个深渊。\n这道山原之上的创痕终日被黑雾与血色笼罩，游荡着晶体的造物和失序的生灵，隐藏着无穷无尽的秘密。\n从历史的起源，到如今的时代。\n我们行至此日，没有一刻不曾斗争。\n战士的血被冰封，士兵的骨被焚尽，英雄的魂被寂灭。\n我们走到现在，没有一刻不曾牺牲。\n我们自荒凉寒冷的边陲来到如今的环带，登上通天的高塔，冲破缥缈的星空，我们已经历许多。\n但我们从未揭开帷幕，从未真正认识过深渊。\n\n§Y此稀有特征提供的£job_SRA_SD_chaos_explorer£ $job_SRA_SD_chaos_explorer_plural$ 岗位会随着 $d_SRA_SD_star_babel$ 提供的£mod_planet_max_districts_add£ $MOD_PLANET_MAX_DISTRICTS_ADD$ 的提升而提升。"
 d_SRA_SD_star_babel:0 "§Y天穹之塔§!"
 d_SRA_SD_star_babel_desc:0 "通天之塔。\n在['concept_SRA_SD_The_Rips']后悄然出现的高塔，直接坐落在孤山之上，深渊的正中央。庞大的基座跨过无底深坑，在山峦上架起。\n巨塔由无法理解的材料筑起，镶嵌翻滚着迷雾的血色水晶。\n不知为何，深渊不会侵蚀这座高塔，也正因如此，它在如今的文明世界中有着无与伦比的地位。\n它刺破了天穹。\n在其余任何地方都无法接近的星空，自塔攀登却能直接抵达。\n我们沿塔而上，迈入银河。\n\n如今，巨塔之中是庞大的航天基地，借助独特的重力环境与得天独厚的地域优势，肩负起开拓天空之外世界的伟大征途。\n\n§Y此稀有特征提供的£mod_planet_max_districts_add£ $MOD_PLANET_MAX_DISTRICTS_ADD$等修正可以无限提升，但每次提升都需要填满£job_SRA_SD_chaos_explorer£ $job_SRA_SD_chaos_explorer_plural$ 岗位并消耗所有就任人口。§!"
 d_SRA_SD_star_department_of_abyss:0 "§B深渊事务司§!"
 d_SRA_SD_star_department_of_abyss_desc:0 "深渊事务司全权处理有关深渊探索，开发，及其相关危害控制的一切指挥与调动。\n为了在这个时代存续，文明世界将权力交托给智者与战士，这是明智的选择，无论对于天穹之下的住民，还是星海之上的帝国。\n\n\n\n§B如果文明愚蠢到将被深渊毁灭，那事务司也不介意代劳。§!"
 d_SRA_SD_star_lapis_lazuli:0 "§C青金石商会§!"
 d_SRA_SD_star_lapis_lazuli_desc:0 "一张庞大的支配之网，以商会为名渗透进每个角落。\n贩卖商品，贩卖情报，贩卖有与无，贩卖文明与秩序。它扩张，它演化。\n但最终，这一切都只不过是为了在一位古怪的、非人般冷漠的画家皱眉时，为她献上她所需要的一切。"
 d_SRA_SD_star_emerald_tower:0 "§E翡翠塔学会§!"
 d_SRA_SD_star_emerald_tower_desc:0 "以翡翠塔图书馆为中心建立起的庞大学术集群与组织。求知者在此越过往日的群山，重绘智与识的边界。\n「除却图书馆的秩序，此地只允真理。」\n\n起初，这里只有一座溪边的高塔。\n一群年轻人寻觅知识来到这里，又因为忘我的聒噪被塔主逐出。\n于是他们在塔前建起自己的居所，对着借来的书籍日夜探讨。\n一座学者之城便在此地诞生。"
 d_SRA_SD_star_forest_of_moon_shadow:0 "§G月影之林§!"
 d_SRA_SD_star_forest_of_moon_shadow_desc:0 "由月华与清风创生，行走于荆棘草木之上的自然之子们。\n最矫健的猎手，最敏锐的向导，最勤恳的农夫。\n精灵们为月影奉上忠诚，而月影之锋为你效力。\n\n§G大地的灵性无法穿越天穹，因而愿为出笼的孩子们守望山峦。§!"
 d_SRA_SD_star_isolated_island:0 "§g孤岛§!"
 d_SRA_SD_star_isolated_island_desc:0 "荒芜，死寂。\n「不再有悲伤，也不再有梦。」\n这座孤岛拒绝生灵，拒绝演变，拒绝命运的波澜。\n自从黑龙承下那剥夺一切色彩的力量，自缚于此地，这个曾经有自命为神的不速之客降临的地方就再也没有任何未来可言。\n终曲之龙为一应变数画上句点，在这个始源之地宣告终结，让此世与诸世诀别。\n\n即便今日此地龙影不再，这个世界也不会再承受无妄的苦难。"
 d_SRA_SD_star_the_borderland:0 "§g边境之地§!"
 d_SRA_SD_star_the_borderland_desc:0 "层层堆叠，扭曲皱起的庞大山峦，延绵不绝，高耸入云。\n数十公里高的环状山脉群围绕着我们的大地，其宽度超越了其他任何地理事物的规模。\n一种推测是在某个时代曾经发生了一场超乎想象的大陆扩张事件，以可能数万乃至数亿倍的速度从深渊中增生出了陆地板块，导致原有的大陆结构被推动挤压，最终堆叠成了如今我们所见的边境之地。但显然，我们的地表构成不太有可能承受这样的压力，整个世界更应该随这一事件熔化成岩浆之海，而不是仅仅发生超大规模的造山运动。\n无论如何，边境之地圈定了我们文明中心区的范围，边境之外的世界少有提及。\n以及它提供了几乎取之不尽的矿产资源。"
 d_SRA_SD_star_the_under_furnaces:0 "§R九重铸炉§!"
 d_SRA_SD_star_the_under_furnaces_desc:0 "熔窟，地狱，九狱，下界，地底世界，或者其他称呼，对这个位于地底的恶魔世界来说都很正常。\n萨塔瑞兹地表下平均20千米深度的庞大空腔层，充斥着流动的岩浆。地表的山体在这里是庞大的石柱，和其他魔法力量一同支撑这个庞大的地下世界。\n充斥着硫磺气息的空气维持在50到60度，这可能是由于当地广泛生长的寒光花等植物吸收热能生长的特性，也可能是部分较薄的海底地层热量交换的结果。\n岩浆在这里的山体中上涌，再从上方的地层缝隙中流下，形成了独特的岩浆瀑布景观。在这种特殊环境下极为活跃的永燃矿在九重铸炉顶端成片结晶，并发出在某些高度范围较小的地区足以充当照明的高强度光芒。冰蓝色的嗜热植物在这里广泛生长，多种多样的魔法生物在岩浆湖和地表上活跃。这里充裕的能量使上下级捕食关系较为淡薄，互相争斗则成为了制约种群规模的主要原因。\n本就拥有极为丰富的矿产和取之不尽的能源，在崇尚武力的社会思潮下，九重铸炉拥有发达的军工产业和技术，在锻造和冶炼上具有得天独厚的优势。工匠阶层是不想参与无处不在的争斗的恶魔的首选，除此之外也有部分选择了研究自身法术能力的学者另外建立的社区。\n如今，对岩浆热能的提取已经成为整个萨塔瑞兹最主要的能源来源，九重铸炉生产的高质量材料也在对应领域占据巨大份额。"



 planet_SRA_SD_old_home_planet:0 "失落前哨"
 planet_SRA_SD_old_home_planet_desc:0 "第一批探索队在混乱的时空中降落在这个星球，建立了我们在['concept_SRA_SD_barren_space']之中的第一个落脚点。\n似乎许多外来者会认为这里是我们的母星？"
 planet_SRA_SD_1_start_system_2:0 "繁花树海"
 planet_SRA_SD_1_start_system_2_desc:0 "这颗星球表现的相当奇怪，似乎并没有受到星系中可怖力量的负面影响，保持着勃勃生机。\n这是一个吉兆吗？"
 planet_SRA_SD_1_start_system_3:0 "浩劫先兆"
 planet_SRA_SD_1_start_system_3_desc:0 "这颗星球很可能曾是其他文明的殖民地，但已经连带着其上的巨型传感设施一同毁灭了。\n它很可能是我们降临这个宇宙时的第一个牺牲者。"
 planet_SRA_SD_1_start_system_4:0 "破碎群岛"
 planet_SRA_SD_1_start_system_4_desc:0 "['concept_SRA_SD_The_Rips']时被抛出我们家园的大陆结构在星空中飘荡，毁灭了它的力量将它重塑为了新的形态。"
 d_planet_SRA_SD_1_start_system_4_1:0 "§R破碎铸炉§!"
 d_planet_SRA_SD_1_start_system_4_1_desc:0 "被恐怖的深渊力量直接放逐出萨塔瑞兹的这块陆地时至今日仍笼罩在令人窒息的猩红浓雾之中，无时无刻不被侵蚀的现实正与其上的每一个意志共鸣，揭示着认知边疆之外的奥秘。\n\n§Y此稀有特征的产出和维护费，以及提供的$mod_planet_researchers_produces_mult$和$mod_planet_researchers_upkeep_mult$随此星球£pop£人口数量的提升而提升。§!" #\n§R此星球在£pop£人口数量大于20时会发生随机恶性事件，恶性事件的频率和危害会随人口数量的提升而提升。§!
 d_planet_SRA_SD_1_start_system_4_2:0 "§R斑岩之城§!"
 d_planet_SRA_SD_1_start_system_4_2_desc:0 "千年之前建立于$d_SRA_SD_star_the_under_furnaces$深处的庞大城市，在地底世界层叠起流淌着熔岩的都会。尽管已经彻底毁于['concept_SRA_SD_Abyss_Erosion']，残留其上的意志仍然驱斥着深渊的影响。\n\n§Y此稀有特征会抵消$d_planet_SRA_SD_1_start_system_4_1$稀有特征的$mod_planet_researchers_produces_mult$和$mod_planet_researchers_upkeep_mult$修正。§!"


