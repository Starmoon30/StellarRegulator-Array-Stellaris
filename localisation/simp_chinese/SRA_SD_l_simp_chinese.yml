 SRA_SD_event.1.name:0 "§Y升华之刻§!"
 SRA_SD_event.1.desc:0 "瞬息之间，好似一簇火星落在薪柴之上，[this.GetName]一路走来所经历的一切化作了无穷无尽的力量源泉。[this.GetHimHer]自凡尘之中踏出，焕然一新，将光辉历程铸为传奇，将神话伟力集于一身。\n§Y[this.GetName]§!超越了自己的命运，成为了一位§Y神话存在§!。\n\n§Y[this.GetHimHer]将如何选择自己的第一份权能呢？§!"
 SRA_SD_event.2.name:0 "§Y攀升§!"
 SRA_SD_event.2.desc:0 "灯火愈发明亮，传奇愈发闪耀，[this.GetName]力克深渊，其神话力量更进一步。"
 SRA_SD_event.2.a:0 "伟大的一刻。"
 SRA_SD_event.3.name:0 "§Y升格§!"
 SRA_SD_event.3.desc:0 "灯火愈发明亮，传奇愈发闪耀，[this.GetName]力克深渊，其神话力量更进一步，[this.GetHimHer]意识到，自己能触及到新的领域的力量。\n\n§Y[this.GetHimHer]将如何选择自己新的权能呢？§!"
 SRA_SD_event.4.name:0 "§Y巅峰已至§!"
 SRA_SD_event.4.desc:0 "终于，[this.GetName]走到了[this.GetHimHer]§Y神话道途§!的最后一步，[this.GetHimHer]的伟力已达圆满，[this.GetHimHer]的伟业举世无双。纵览历史长河，又有多少人能抵达这样的境地，见到这样的风景呢？\n\n[this.GetName]此刻身心完化，超然物上。[this.GetHimHer]的意志强韧，它可驱使万物，它将塑造万物；[this.GetHimHer]的躯体精妙，它已成为一体，它将永为一体。\n\n此刻，[this.GetHimHer]将注目于自己最后一份权能，§Y[this.GetHimHer]将作何选择？§!"



