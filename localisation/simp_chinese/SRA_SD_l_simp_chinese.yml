 SRA_BoM_stat_c_triggered_desc:0 "因你的['concept_SRA_SD_element_stone']:§Y[this.SRA_SD_element_stone_value]§!，你得到："

 SRA_BoM_stat_d:0 "灯:§Y[From.SRA_SD_element_lantern_value]§!"
 SRA_BoM_stat_d_tooltip:0 "['concept_SRA_SD_element_lantern']代表着你的理解力与知识面，或者说，你的智识。"

