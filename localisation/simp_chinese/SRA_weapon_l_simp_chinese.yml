#龙翼之影

 SRA_SD_weapon_L_Laser:0 "噬心狂欲"
 SRA_SD_weapon_L_Laser_DESC:0 "此法术阵列释放浩瀚污邪能量洪流，崩解命中目标并抽取其源质成分，用于在受损舰体上构筑临时保护层，形成类似自我修复的效果。"

 SRA_SD_weapon_L_accuracy:0 "反偏斜阵列"
 SRA_SD_weapon_L_accuracy_DESC:0 "此法术阵列引导所有类型的攻击，修正其弹道以确保能够准确命中目标，能与偏斜效应场对抗。\n法术阵列本身也能释放较弱的攻击。\n\n§Y复数反偏斜阵列的效应可以叠加，以对抗更高强度的偏斜效应场。§!"

 SRA_SD_weapon_L_Repair:0 "熔融重构"
 SRA_SD_weapon_L_Repair_DESC:0 "此法术阵列在舰船交战状态下工作，修复舰船装甲与船体受到的损伤并随机逸散会造成少量伤害的能量弧。\n\n§Y在舰船命中能力受到严重干扰时，此法术阵列的运作效率会下降。§!"

 SRA_SD_Abyss_Hostile_Ship_main_weapon:0 "§R深源-深渊召选§!"
 SRA_SD_Abyss_Hostile_Ship_main_weapon_DESC:0 "伤害：§R约 6400000.00§!\n冷却：§Y约 32.00£time£§!\n命中后：对目标所在舰队施加32.00£time£的§R宿命终结§!，使其免疫§R荒谬英雄§!的所有效果。\n\n"
