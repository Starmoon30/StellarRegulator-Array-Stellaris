#科尔先驱
 SRA_RE_Core_weapon_L_Particle_Launcher:0 "先驱根除者"
 SRA_RE_Core_weapon_L_Particle_Launcher_DESC:0 "应用空间撕裂技术的强大武器，它投射的能量团对命中的目标产生毁灭性的空间撕裂效应。"
 SRA_RE_Core_weapon_L_Laser:0 "先驱解离者"
 SRA_RE_Core_weapon_L_Laser_DESC:0 "应用空间撕裂技术的强大武器，它撕扯其指向上的空间结构，进而摧毁其上的所有实体。"

 SRA_RE_Core_weapon_X_Cannon:0 "先驱撕裂者"
 SRA_RE_Core_weapon_X_Cannon_DESC:0 "庞大而先进的动能武器，尽管看似寻常，但它的能级能直接过载大多数护盾并击穿装甲和船体。"

 SRA_RE_Core_weapon_T_Laser:0 "先驱歼灭炮"
 SRA_RE_Core_weapon_T_Laser_DESC:0 "传奇般的舰船主炮，为击穿和摧毁任何类型的目标而设计，它的每一次开火都意味着毁灭，而它的开火永不停歇。"

 SRA_RE_Core_weapon_H:0 "先驱哨卫"
 SRA_RE_Core_weapon_H_DESC:0 "舰载无人机，用于维护和近防任务，也可以干扰乃至压制敌对舰船。"

 SRA_RE_Core_weapon_G:0 "先驱风暴鱼雷"
 SRA_RE_Core_weapon_G_DESC:0 "使用空间扭曲技术的能量鱼雷，能造成大范围的连锁破坏。"

 SRA_RE_Core_weapon_P:0 "先驱短剑"
 SRA_RE_Core_weapon_P_DESC:0 "性能优异的点防御系统。"


 SRA_starbase_SRA_RE_Calamitisease_weapon_T:0 "灾疫耀斑"
