 SRA_T3_weapon_X_Laser:0 "§Y晶格-湮流载波炮§!"
 SRA_T3_weapon_X_Laser_DESC:0 "§YCSC-07-X晶格撕裂光束\n使用['concept_SRA_Composite_Crystal_Lattice']技术构建的大型光束武器，能够使弹道上发生能级跌落，使得命中的物质结构崩解并释放出大量能量，造成严重的二次损伤。§!"

