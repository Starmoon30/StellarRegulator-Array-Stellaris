l_simp_chinese:
###############################
###特殊武器###
 SRA_T_weapon_supreme:0 "§B星规-寰宇溃灭§!"
 SRA_T_weapon_supreme_DESC:0 "§B星穹之矛的主炮，毁灭性的歼星级位面撕裂武器的直击将「放逐」命中的存在并制造一枚耀眼的新星，其能量释放足以撼动周围的天体，乃至击碎一定范围内的空间结构。§!\n"
 SRA_T_weapon_supreme_on_hit:0 "-伤害提升§R100.00§!倍，持续 1.00£time£ 。\n-若目标所在舰队的$MOD_SHIP_DAMAGE_REDUCTION_MULT$大于 §Y0.00%§! ，则将其['concept_SRA_clear_ship_damage_reduction_mult',§R清空§!]，持续 1.00£time£ 。\n-对目标所在舰队施加 8.00£time£ 的['modifier:SRA_T_weapon_supreme_buff']。\n-此效果每§Y16.00£time£§!只能触发一次。"

 SRA_Crisis_G_weapon_collision:0 "§B撞击§!"
 SRA_Crisis_G_weapon_collision_DESC:0 "\n§B高度活跃的['concept_SRA_Stellarcrystal_Fractal']会解离接触的物质并将其吸收。§!"

 SRA_Crisis_G_weapon_kind_laser:0 "§B星规-湮灭千星§!"
 SRA_Crisis_G_weapon_kind_laser_DESC:0 "§B特化型歼灭主炮，直接对接储能阵列，一次开火就能耗光接近全部的能量储备，这种毁灭性的歼星级位面撕裂武器的直击将「放逐」命中的存在并制造一枚耀眼的新星，其能量释放足以撼动周围的天体，乃至击碎一定范围内的空间结构。§!\n"
 SRA_Crisis_G_weapon_kind_laser_on_hit:0 "-伤害提升§R100.00§!倍，持续 1.00£time£ 。\n-若目标的$MOD_SHIP_DAMAGE_REDUCTION_MULT$大于 §Y0.00%§! ，则将其['concept_SRA_clear_ship_damage_reduction_mult',§R清空§!]，持续 1.00£time£ 。\n-对目标施加 8.00£time£ 的['modifier:SRA_T_weapon_supreme_buff']。\n-此效果每§Y32.00£time£§!只能触发一次。"
 SRA_T_weapon_supreme_buff:0 "§B相位崩解§!"
 SRA_T_weapon_supreme_buff_desc:0 "§B混乱的相位能量会撕扯物质乃至现实。§!"


 SRA_T4_weapon_G_supreme:0 "§B星规-渺远星辰§!"
 SRA_T4_weapon_G_supreme_DESC:0 "§B这种特化武器系统设计用于提供周期性的防御能力强化，通过捕捉目标的相位特征并建立通道，来保证在舰船进入相位偏移状态时仍然能正常展开攻击。§!"
 SRA_T4_weapon_G_supreme_on_hit:0 "使自身获得§Y4.00£time£§!的['modifier:SRA_T4_weapon_G_supreme_buff']。\n-此效果每§Y8.00£time£§!只能触发一次。"
 SRA_T4_weapon_G_supreme_buff:0 "§B相位偏移§!"
 SRA_T4_weapon_G_supreme_buff_desc:0 "§B这个单位将自己的相位与其他单位偏移开来，免受大部分攻击的影响。§!"

 #歼星

 SRA_T4_weapon_planet_killer:0 "§B星规-新星终结§!"
 SRA_T4_weapon_planet_killer_DESC:0 "§B这件武器可以使用定向位面撕裂摧毁目标所在坐标的位面本身，被直接命中的目标将被「放逐」，而与此同时释放出的巨量能量则将严重摧毁附近的时空并撕碎任何宏观结构。§!§Y会根据目标的不同调整出力。其歼星级攻击可以彻底击碎行星与环形世界,抹去气态巨行星的外层大气，完全摧毁轨道居住站。若将恒星作为目标，那么受引导的能量爆发将摧毁整个恒星系，恒星本身将在耀眼的超新星爆发中坍缩为黑洞。§!"
 SRA_T4_weapon_planet_killer_ACTION:0 "使用§B「新星终结」§!攻击"
 SRA_T4_weapon_planet_killer_ACTION_DESC:0 "使用歼星级位面撕裂武器§B「新星终结」§!攻击目标，对目标的伤害效果取决于目标类型。"
 MESSAGE_DESC_FOR_SRA_T4_weapon_planet_killer:0 "被摧毁"
 FLEETORDER_DESTROY_PLANET_WITH_SRA_T4_weapon_planet_killer:0 "使用歼星级位面撕裂武器§B「新星终结」§!攻击$PLANET|Y$"
 message_SRA_T4_weapon_pk_weapon_killed_star_desc:0 "$SRA_target_planet|Y$因遭受$SRA_attacker|Y$的$SRA_attacker_ship|Y$的歼星级位面撕裂武器的攻击而被彻底摧毁，$SRA_target_system|Y$恒星系在耀眼的超新星爆发中被毁灭。"
 message_SRA_T4_weapon_pk_weapon_killed_planet_desc:0 "$SRA_target_planet|Y$因遭受$SRA_attacker|Y$的$SRA_attacker_ship|Y$的歼星级位面撕裂武器的攻击而被彻底摧毁。"
 message_SRA_T4_weapon_pk_weapon_swept_planet_desc:0 "$SRA_target_planet|Y$上的智慧生命因遭受$SRA_attacker|Y$的$SRA_attacker_ship|Y$的歼星级位面撕裂武器的攻击而被全部消灭。"

 SRA_T4_weapon_planet_killer_L_Laser:0 "§B星规-新星终结§!"
 SRA_T4_weapon_planet_killer_L_Laserr_DESC:0 "这道毁灭性的位面撕裂束来源于已启动的歼星级位面撕裂武器§B「新星终结」§!，由时空相位引擎构造的相位空间投影能发射极为强大的攻击，迅速抹杀范围内的所有目标。"


 SRA_planet_killer.11.name:0 "湮灭星辰"
 SRA_planet_killer.11.desc:0 "随着§H[From.From.GetName]§!上的歼星级位面撕裂武器完成了它湮灭星辰的任务，§H[From.GetName]§!的亮度瞬间提升了数百倍，随后逐渐暗淡下去，传感器表明这个天体已经塌缩成了一个奇点。位面裂隙中溢出的大部分能量将§H[From.GetName]§!彻底摧毁，其余的则将§H[From.solar_system.GetName]§!恒星系内的其他天体一并毁灭。"
 SRA_planet_killer.11.a:0 "它寂静了。"
 SRA_planet_killer.11.b:0 "又一个丰碑！"

 SRA_planet_killer.12.name:0 "摧毁星球"
 SRA_planet_killer.12.desc:0 "随着§H[From.From.GetName]§!上的歼星级位面撕裂武器完成了它摧毁星球的任务，§H[From.GetName]§!也在剧烈的爆炸中四分五裂，成为了漂浮在星海中无数无法支持智慧生命生存的天体之一，无论其曾经拥有着怎样的财富，它们也都随着§H[From.GetName]§!的毁灭而灰飞烟灭了。"
 SRA_planet_killer.12.a:0 "绽放，然后终结。"
 SRA_planet_killer.12.b:0 "那么，下一个在哪里呢？"

 SRA_planet_killer.13.name:0 "清扫世界"
 SRA_planet_killer.13.desc:0 "随着§H[From.From.GetName]§!上的歼星级位面撕裂武器完成了它清扫世界的任务，我们的生命传感器已无法在§H[From.GetName]§!捕捉到任何智慧生命的信号了，无论是有机生物，还是岩石，抑或是钢铁铸造的机械，它们都已在位面撕裂武器的轻轻一抹中永远的消失了。"
 SRA_planet_killer.13.a:0 "真安静啊。"
 SRA_planet_killer.13.b:0 "这下它们终于闭嘴了。"

 SRA_requires_no_compact_star_star_killer:0 "§R目标不能是致密的天体。§!"
 SRA_requires_outside_border_star_killer:0 "§R目标不能位于己方境内。§!"
 SRA_requires_a_star_star_killer:0 "§R目标必须与配置的攻击模式相对应。§!"
 SRA_requires_declares_war_star_killer:0 "§R我们需要首先配置武器模式。§!"
 SRA_requires_no_pacifist_star_killer:0 "§R我们的§Y$ethic_pacifist$§!执政道德理念不允许我们使用这种武器。§!"
 SRA_requires_no_ancient_system:0 "§R古代防御系统阻止了我们攻击这个恒星系。§!"
 SRA_requires_no_zeta_crisis_system:0 "§R虚境侵军的灵能活动阻止了我们攻击这个恒星系。§!"
 SRA_requires_no_exd_system:0 "§R高维入侵者的灵能活动阻止了我们攻击这个恒星系。§!"
 SRA_requires_no_contingency_system:0 "§R肃正协议的防御系统阻止了我们攻击这个恒星系。§!"
 SRA_requires_no_special_system:0 "§R出于一些未知的原因，我们无法攻击这个目标。§!"
 SRA_requires_no_is_cloaked:0 "§R我们需要解除隐形才能使用歼星武器。§!"



 SRA_Rokia_dragon_weapon_planet_killer_ACTION:0 "使用§R「荒芜驱驰」§!攻击"
 SRA_Rokia_dragon_weapon_planet_killer_ACTION_DESC:0 "使用歼星级武器§R「荒芜驱驰」§!攻击目标，摧毁整个世界的反抗意志，让它们直接臣服于我们。"
 FLEETORDER_SRA_Rokia_dragon_weapon_planet_killer_ACTION_DESC:0 "使用歼星级武器§R「荒芜驱驰」§!攻击目标，摧毁整个世界的反抗意志，让它们直接臣服于我们。"
 MESSAGE_DESC_FOR_SRA_Rokia_dragon_weapon_planet_killer:0 "被支配"
 FLEETORDER_DESTROY_PLANET_WITH_SRA_Rokia_dragon_weapon_planet_killer:0 "使用歼星级武器§R「荒芜驱驰」§!直接支配$PLANET|Y$"
 message_SRA_Rokia_dragon_weapon_planet_killer_desc:0 "$SRA_target_planet|Y$上的智慧生命因遭受$SRA_attacker|Y$的$SRA_attacker_ship|Y$的§R「荒芜驱驰」§!的攻击而被摧毁了反抗意志。"

 SRA_planet_killer.14.name:0 "支配世界"
 SRA_planet_killer.14.desc:0 "随着§H[From.From.GetName]§!上的§R「荒芜驱驰」§!完成了它的任务，我们的已经接收到了§H[From.GetName]§!被纳入支配的消息，无论是有机生物，还是岩石，抑或是钢铁铸造的机械，它们的反抗意识都已经在可怖力量的轻轻一抹中永远的消失了。"
 SRA_planet_killer.14.a:0 "有趣。"
 SRA_planet_killer.14.b:0 "它们幸运的免于死去。"
