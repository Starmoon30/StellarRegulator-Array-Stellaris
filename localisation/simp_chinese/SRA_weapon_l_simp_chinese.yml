 SRA_T3_weapon_H:0 "§Y晶格-衍耀天刃§!"
 SRA_T3_weapon_H_DESC:0 "§YCSC-117-H晶格舰载机组\n使用['concept_SRA_Composite_Crystal_Lattice']技术构建的舰载机组，使用小型化结构扰乱束进攻敌人船体的弱点。§!"

 SRA_T3_weapon_G:0 "§Y晶格-陨日光伏§!"
 SRA_T3_weapon_G_DESC:0 "§YCSC-38-G§Y晶格粒子导弹系统§\n使用['concept_SRA_Composite_Crystal_Lattice']技术构建的导弹系统，发射由高能粒子团构成的导弹，命中后造成严重的空间扰乱效果来破坏敌对舰船。§!"

 SRA_T3_weapon_P:0 "§Y晶格-光子裂袭§!"
 SRA_T3_weapon_P_DESC:0 "§YCSC-1130-P晶格点防御系统\n使用['concept_SRA_Composite_Crystal_Lattice']技术构建的点防御系统，使用小型化结构扰乱束精准地拦截来袭的导弹与舰载机。§!"

