#####T4
 SRA_T4_weapon_SML_Mass_Drivers:0 "§B星规-星弧破碎§!"
 SRA_T4_weapon_SML_Mass_Drivers_DESC:0 "§B这一型拥有高度泛用性的双联装速射炮灵活而精准，能够胜任几乎所有用途。其发射的短促能量束拥有强大的贯彻力，难以被护盾或装甲阻挡。§!"
 SMALL_SRA_T4_weapon_SML_Mass_Drivers:0 "§B星规-星弧破碎§!"
 SMALL_SRA_T4_weapon_SML_Mass_Drivers_DESC:0 "$SRA_T4_weapon_SML_Mass_Drivers_DESC$"
 MEDIUM_SRA_T4_weapon_SML_Mass_Drivers:0 "§B星规-星弧破碎§!" 
 MEDIUM_SRA_T4_weapon_SML_Mass_Drivers_DESC:0 "$SRA_T4_weapon_SML_Mass_Drivers_DESC$"
 LARGE_SRA_T4_weapon_SML_Mass_Drivers:0 "§B星规-星弧破碎§!" 
 LARGE_SRA_T4_weapon_SML_Mass_Drivers_DESC:0 "$SRA_T4_weapon_SML_Mass_Drivers_DESC$"

 SRA_T4_weapon_L_Particle_Launcher:0 "§B星规-虚空撕裂§!"
 SRA_T4_weapon_L_Particle_Launcher_DESC:0 "§B这一型重型粒子团火炮势大力沉，其射弹能造成拥有卓越穿透力的物质抹除效果并引发威力庞大的二次毁伤，甚至会短暂影响空间结构本身的稳定性。§!\n\n§Y此类武器是特化的大型武器，通过尽可能发挥大型武器槽位的潜力来实现相较于常规大型武器更为优秀的性能，代价是没有中小型款式且成本高昂。§!"
 SRA_T4_weapon_L_Laser:0 "§B星规-命运之枪§!"
 SRA_T4_weapon_L_Laser_DESC:0 "§B这种重型空间撕裂武器发射极为精准的死亡射线，在开火的瞬间破坏沿线的空间结构，即刻摧毁任何被命中的有序结构并制造耀眼的光爆。§!\n\n§Y此类武器是特化的大型武器，通过尽可能发挥大型武器槽位的潜力来实现相较于常规大型武器更为优秀的性能，代价是没有中小型款式且成本高昂。§!"

 SRA_T4_weapon_X_Laser:0 "§B星规-归虚之光§!"
 SRA_T4_weapon_X_Laser_DESC:0 "§B这件武器能破坏目标方向上的时空结构，沿线的物质将被直接转换为纯能量并对周围造成二次毁伤，未被直接命中的物质则将在时空乱流中被撕成碎片。§!"

 SRA_T4_weapon_T_Laser:0 "§B星规-破晓之星§!"
 SRA_T4_weapon_T_Laser_DESC:0 "§B这件武器会在位面上撕开一道狭缝，沿途的物质将消失在位面外的混沌空间中，与此同时涌入的庞大能量则会对周围造成巨大的破坏。由于位面自身的自稳性，这道狭缝会迅速关闭，因此不会造成长久性的位面结构损伤。§!"

 SRA_T4_weapon_H:0 "§B星规-渊宇之狩§!"
 SRA_T4_weapon_H_DESC:0 "§B这些游曳的猎手穿行于星间，以粒子射流与能量导弹武装自己。身为战舰的戍卫，它们是从敌舰薄弱点进攻的杀手，更是敌方导弹与舰载机的梦魇。§!"

 SRA_T4_weapon_G:0 "§B星规-寰宇追迹之火§!"
 SRA_T4_weapon_G_DESC:0 "§B星规阵列所使用的导弹系统，这一型能量鱼雷命中目标后发生的复杂效应将导致小范围内的空间结构扭曲乃至撕裂，对各种类型的目标都有相当强大的毁伤能力，并且难以被拦截。§!"

 SRA_T4_weapon_P:0 "§B星规-光辉之冠§!"
 SRA_T4_weapon_P_DESC:0 "§B这套先进的点防御系统警惕着任何来犯之敌，脉冲光束连射能轻松摧毁来袭的导弹或舰载机，甚至对战舰也有可观的威胁能力。§!"

######T3
 SRA_T3_weapon_SML_Plasma:0 "§Y晶格-晶源劫裂者§!"
