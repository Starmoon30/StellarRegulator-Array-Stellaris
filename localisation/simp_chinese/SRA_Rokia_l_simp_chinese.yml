l_simp_chinese:
##############################
 faction_SRA_Rokia_sub_title:0 "§R耀红黑星§!\n一个神秘的智能实体，引导着危险的混沌能量，试图在繁星间找到自己的安身之地。" 
 leader_trait_SRA_Rokia_sci:0 "§R耀红黑星§!"
 leader_trait_SRA_Rokia_sci_desc:0 "§R漫步于失落尘世，无尽智识流淌此身。踏行于荆棘道途，幻渊幽影萦绕指尖。§!"
 leader_trait_SRA_Rokia_1_ruler:0 "§R耀红黑星§!"
 leader_trait_SRA_Rokia_1_ruler_desc:0 "§R漫步于失落尘世，无尽智识流淌此身。踏行于荆棘道途，幻渊幽影萦绕指尖。§!"
 leader_trait_SRA_Rokia_ruler:0 "§R耀红黑星§!"
 leader_trait_SRA_Rokia_ruler_desc:0 "在诱骗银河系最富有野心的文明替她完成了计划后，整个宇宙都将最终化作无垠的深渊混沌。就这一层面来说，只要没有不可预测的外来干涉，她就能好好享受把一切握在手中的日子，去追求点个人兴趣，或者单纯休息休息，直到在命运的催促下再度启程。"
 SRA_Rokia_1_catch_phrase:0 "正因这世界早已重塑，一切都为虚假。"
 SRA_Rokia_1_backstory:0 "\n洛琪亚，一个神秘的智能实体，一个不可知的他者。"
 SRA_Rokia_2_catch_phrase:0 "正因那起源从未存在，一切都为真实。"
 SRA_Rokia_2_backstory:0 "\n洛琪亚·路希维亚，流浪的异乡人。被赋名的概念，被分割的无限，被塑造的虚无。\n终有一日，她将抵达她未曾谋面的故乡。"

 SRA_Rokia_talk_return3:0 "让我再想想。" 
 SRA_Rokia_talk_return4:0 "我们聊点别的吧。" 
 SRA_Rokia_talk_exit1:0 "结束通讯。"

 SRA_Rokia_1:0 "洛琪亚"
 SRA_Rokia_2:0 "洛琪亚·路希维亚"


 SRA_Rokia.100.a:0 "下达指令"
 SRA_Rokia.100.b:0 "闲聊"

 SRA_Rokia.200.desc:0 "说吧，你想要什么?"
 SRA_Rokia.200.a:0 "重新部署耀红黑星。"
#闲聊
#无表情
 SRA_Rokia_talk.3011.1.desc:0 "真相总是无谓，王冠总是暴虐，生者总是辩解，死者总是妄言。"
 SRA_Rokia_talk.3011.2.desc:0 "生命即是自我容忍。\n生命即是消蚀一切。\n生命即是成为相互的食饵，无论善恶。\n生命即是公平，生命即是不平等。\n生命即是永恒。"
 SRA_Rokia_talk.3011.3.desc:0 "当最初的火花自基因的造物中点燃，一个寄生者就此诞生，它在一个又一个适格者间传播扩散，交互搏杀，成长，扩大，以它的名义成为无比庞大的集体，并跨越一切有形无形的桎梏，誓要统括一切，成就永恒。\n这就是文明，它在臃肿的自我中挣扎，增生又消亡，存续又存续。"
#微笑
 SRA_Rokia_talk.3012.1.desc:0 "人们说而不言，人们听而不闻，过去如此，未来也如此。"
 SRA_Rokia_talk.3012.2.desc:0 "我在想，你手中的这一切，到底有多少是你自己缔造的呢？"
 SRA_Rokia_talk.3012.3.desc:0 "出于我所剩无几的善心提醒你一声，让我在你这里留下太多痕迹可不一定是件好事。当然你向来是不在乎的，对吧。"
#闭眼
 SRA_Rokia_talk.3013.1.desc:0 "命运张牙舞爪，道旁尽是无底深渊，满盈着血一般的未来。"
 SRA_Rokia_talk.3013.2.desc:0 "Memento mori……你的道途延伸何方，你的脚步行至何处？" #人终有一死
 SRA_Rokia_talk.3013.3.desc:0 "遗忘过去，会失去足以面对未来的智慧，但沉浸于反复咀嚼过往，只会招致愚昧……"
 SRA_Rokia_talk.3013.4.desc:0 "愿你于生者之世寻至安宁。"
 SRA_Rokia_talk.3013.5.desc:0 "时光倒错，梦魇呓语……我也许并不属于这里。\n\n会有一个足以被称作结局的世界为我而留吗？"
#闭眼微笑
 SRA_Rokia_talk.3014.1.desc:0 "我殷切期望你能聆听我的劝告，在此地为故事画上终局，而不是将戏剧一次又一次的重演。"
 SRA_Rokia_talk.3014.2.desc:0 "她会容许我走到何种地步呢？如果先前的故事确实已经结束，那剧目的主演是否已经更换？或许我该直接找她谈谈……虽然她肯定是不会说的。"

#耀红黑星存在4001
 SRA_Rokia_talk.4001.1:0 "好啦，快下命令吧，我想出去转转，或者不转也行，其实也没有那么想出去，好吧还是有点想，算了随你吧。"
 SRA_Rokia_talk.4001.2:0 "我正在释放危险的混沌能量来污染太空环境，如果你愿意让我去找点目标的话，我也可以污染点敌方船体之类的东西。"
 SRA_Rokia_talk.4001.3:0 "早上好，执行官！希望你喜欢这种虚无缥缈如梦如幻的感觉，因为我闲着没事干给你的早餐里加了点奇妙的小东西，相关副作用暂且不明的那种。或者你也可以让我去干点事情，免得你的午餐里多了点奇妙的大东西。"
#耀红黑星战斗4002
 SRA_Rokia_talk.4002.1:0 "你好呀，我正在进行太空作战呢。或者，用一点准确，贴切的词————\n§R我正在屠杀。§!"
 SRA_Rokia_talk.4002.2:0 "嗯，通讯？\n好吧，这场小游戏玩的差不多了，是时候收场了。"
 SRA_Rokia_talk.4002.3:0 "我能看到它们，能触碰到它们，它们是如此脆弱，只是轻轻抚摸，便分崩离析了。"
 SRA_Rokia_talk.4002.4:0 "天哪，执行官，敌人正在袭击你的科研专员，你最好赶紧救救她！\n或者算了？你决定吧。"
#耀红黑星使用荒芜驱驰4003
 SRA_Rokia_talk.4003.1:0 "是的，我正看着呢，看着地表的熙熙攘攘、来来往往，看着将死之人做将逝之事……好吧，也许我该少考虑点时间跨度？"
 SRA_Rokia_talk.4003.2:0 "科研专员洛琪亚在协助研究任务中使用了邪恶的可怕的黑魔法增加了所在星球的产业产出，嗯，就这么写。管他们信不信呢，还能拿我怎么样？"
 SRA_Rokia_talk.4003.3:0 "监控一下思维模式，然后在需要的地方提供点灵感，科研能力这不就上去了，多好。"
 SRA_Rokia_talk.4003.4:0 "只不过是注目一下罢了，我听闻有些强大的灵能实体可以让整个文明像这般富饶，甚至更胜一筹。"
 SRA_Rokia_talk.4003.5:0 "汇报：当前星球产业运行非常稳定，一切生产都在以高效率运行，没有任何影响产出和开发的社会问题。关于之前提交的异常事故和灵能使用痕迹报告，经调查确认，纯属子虚乌有。"
#耀红黑星探索恒星系4004
 SRA_Rokia_talk.4004.1:0 "星空，如此浩瀚，谁知道彼方还隐藏着什么秘密呢。"
 SRA_Rokia_talk.4004.2:0 "我等不及要跟那些可爱的太空生物见面了。哦，想想那些有着奇妙鳞片的以太龙、来自另一个次元的位面之魇、生命力超凡的提杨奇、活泼的太空变形虫，还有那么多有趣的生命，我迫不及待地想要————\n§R把它们一个个碾死。§!"
#耀红黑星研究异常4005
 SRA_Rokia_talk.4005.1:0 "我正在研究异常现象！嗯……对我来说没有多异常，对你们来讲还是得当异常处理的。"
 SRA_Rokia_talk.4005.2:0 "前进，征服，直到未知的终点！"







 SRA_planet_killer_4_buff:0 "§R荒芜驱驰§!"
 SRA_planet_killer_4_buff_desc:0 "§R还能有什么坏事呢？§!"


 # event chins
 SRA_chaos_ascension_chain_title:0 "§R跨越混沌之渊§!"
 SRA_chaos_ascension_chain_desc:0 "谁将付出所有，谁将成就永恒。"
 SRA_chaos_ascension_leader:0 "§R才智之升华§!"
 SRA_chaos_ascension_ship:0 "§R力量之绽放§!"
 SRA_chaos_ascension_pop:0 "§R集体之奉献§!"
 SRA_chaos_ascension_system:0 "§R诸世之寂灭§!"


 pc_SRA_chaos_star:0 "§R幻渊残星§!" 
 pc_SRA_chaos_star_desc:0 "§R讳言混沌尘息，噤默万千生灵§!"

 sc_SRA_chaos_star_tooltip:0 "\n§R讳言混沌尘息，噤默万千生灵§!"

 #  sc_SRA_chaos_star_tooltip:0 "\n§R讳言混沌尘息，噤默万千生灵§!\n\n\n\n\n\n\n£pc_SRA_chaos_star_sky£\n\n\n\n\n\n\n"

 pc_SRA_chaos_star_habitable:0 "§R幻渊神域§!" 
 pc_SRA_chaos_star_habitable_desc:0 "§R有眼便流泪吧，有声便哭喊吧，因那命定已至，凡尘尽灭。§!"
 building_SRA_world_machine_chaos:0 "§R铸星无垠§!"
 building_SRA_world_machine_chaos_desc:0 "存在之目的即存在。"

 SRA_Rokia.8000.desc:0 "你踏行在一条前所未有的道路上，往昔的历史也好，此刻的秩序也罢，都不能阻拦你的脚步。\n凡人短视无知，命运狂妄张扬，你是要止步于此地，还是要向永恒的王座露出獠牙？"
 SRA_Rokia.8000.a:0 "§Y王权没有永恒§!"
 SRA_Rokia.8000.b:0 "§R我要荣耀向我俯首§!"
 SRA_Rokia.8000.b.tooltip:0 "§R这通向一条死亡与毁灭的道路，无人知晓尽头，无人敢于迈步。§!\n\n\n§Y将阻断所有事件链并导致几乎必然的游戏结束。§!"

 SRA_Rokia.8000.message:0 "执行官，请千万不要相信她！我们根本不了解那种力量到底是什么，绝不能莽撞行事！"

 SRA_Rokia.8001.name:0 "向最深处的一瞥"
 SRA_Rokia.8001.desc:0 "我们手中掌握的知识表明，在我们世界的外侧，存在着一片无边无际的混沌海洋，如果能够获取那种尚且模糊的力量，我们可以将其作为思想的柴薪，燃烧出自己的现实。\n显然，破开世界的障壁是天方夜谭，维持一道稳定的位面裂口需要登峰造极的技术与不可估量的能量，而打开裂口的回报却就是这些。这个悖论让所有人望而却步。\n但是，似乎，有一条道途，能触及那种力量的一小缕飘落的尘埃。"
 SRA_Rokia.8001.a:0 "我们一往无前"

 SRA_Rokia.8002.name:0 "灵感的火花"
 SRA_Rokia.8002.desc:0 "一种神秘的技术为我们展现出了未来，我们将建造一座巨大的控制塔，引下位面的雷霆，将初始之火点燃。\n混沌能量会自然转化成基本的能量类型，但如果我们试着让它自我约束，我们就可以保持混沌能量的状态，只分出一部分来供我们使用，免得变成一场毁灭性的大爆炸。\n约束方式很明确：庞大的意识，代表我们的决心与渴望，将被赋予这元始的火花。\n\n§Y我们的首都将在一个月后点燃深渊之明星 §R幻渊神域§! 。§!"
 SRA_Rokia.8002.a:0 "我们化身伟大"

 SRA_Rokia.8003.name:0 "美丽终结"
 SRA_Rokia.8003.desc:0 "蕴含着难以想象的力量的深渊裂口已经在我们的首都打开，带来的是既有事物的毁灭，以及永恒存在的新生。\n恒星系的空间站被 §R深渊凝视§! 所取代，肆意舒展着无限的毁灭之力，将一切敢于来此挑战我们无上权威者化作飞灰。\n\n接下来，我们务必要维系着 §R幻渊神域§! 的存续，因为它是我们飞升道途不可或缺的一部分。我们将会喂食这颗明星，让它无序的权能在我们的帝国，以及整个银河中蔓延。"
 SRA_Rokia.8003.a:0 "§R让我们开始吧§!"

 SRA_Rokia.80031.desc:0 "……令人悲哀的是，银河系最富活力的国家竟也是如此缺乏远见。看来沉溺于一时的成就与庞大的力量是永存的无趣剧本，虚假的诱惑总能招致盲目与短视。\n也许我能在别的时间线上找到你的更明智的版本。"
 SRA_Rokia.80031.a:0 "你早该滚了"
 SRA_Rokia.80031.b:0 "断脊之犬的狂吠"

 SRA_Rokia_8004_Buff:0 "才智之升华"
 SRA_Rokia.8004.name:0 "才智之升华"
 SRA_Rokia.8004.desc:0 "我们的才智将升华为力量，我们的领袖将融入 §R幻渊神域§! 之中，知识与智慧将融为一体，互相交织，成为永恒。"
 SRA_Rokia.8004.a:0 "没有可以思考的心智"

 SRA_Rokia.80041.desc:0 "我不是很建议在自己完全不了解的领域一口气压上全部家当，特别是还有人引导你这么做的时候。不过你都走到这步了，想必也不会停下。好吧，好吧。\n我会看到最后。"
 SRA_Rokia.80041.a:0 "闭嘴。"
 SRA_Rokia.80041.b:0 "别指手画脚。"

 SRA_Rokia_8005_Buff:0 "力量之绽放"
 SRA_Rokia.8005.name:0 "力量之绽放"
 SRA_Rokia.8005.desc:0 "我们的力量将绽放出火花，我们的舰队将融入 §R幻渊神域§! 之中，武力与坚毅将融为一体，互相交织，成为永恒。"
 SRA_Rokia.8005.a:0 "没有可以屈从的意志"

 SRA_Rokia.80051.desc:0 "如果这就是您的愿望……\n\n永别了，执行官，愿您得到幸福。"
 SRA_Rokia.80051.a:0 "真可惜。"
 SRA_Rokia.80051.b:0 "这是必要的牺牲。"

 SRA_Rokia_8006_Buff:0 "集体之奉献"
 SRA_Rokia.8006.name:0 "集体之奉献"
 SRA_Rokia.8006.desc:0 "我们的集体将奉献出精粹，我们的人民将融入 §R幻渊神域§! 之中，思想与意志将融为一体，互相交织，成为永恒。"
 SRA_Rokia.8006.a:0 "没有可以哭泣的声音"

 SRA_Rokia_8007_Buff:0 "诸世之寂灭"
 SRA_Rokia.8007.name:0 "诸世之寂灭"
 SRA_Rokia.8007.desc:0 "我们的世界将寂灭于现世，我们的星系将融入 §R幻渊神域§! 之中，存续与演化将融为一体，互相交织，成为永恒。"
 SRA_Rokia.8007.a:0 "没有可以失去的存在"

 SRA_Rokia.8008.name:0 "渗透天堂"
 SRA_Rokia.8008.desc:0 "§R代价被将收取，力量将被偿还，存在将被升华，永恒将被铸造。\n我们向着飞升之道途迈进一步。§!\n\n§Y一组 §R无际渊影§! 出现在了你的首都星系。§!"
 SRA_Rokia.8008.a:0 "此乃命运之正轨"

 SRA_Rokia.8010.desc:0 "§R完成了。§!\n行至凡尘之边界，执掌无量之威能。\n摒弃生死，超越存在，万物将被熔炼成唯一。\n看吧，整个世界都将屈从，所有意志都将臣服，在这创生与毁灭的边界，只有统御永恒不灭……\n\n\n……这就是我所背负的§R诅咒与祝福§!。"
 SRA_Rokia.8010.a:0 "命运落在了我的手中。"
 SRA_Rokia.8010.a.tooltip:0 "GE1：余灰主宰"
 SRA_Rokia.8010.b:0 "§R你的？§!"
 SRA_Rokia.8010.b.tooltip:0 "§R当初毫无顾忌地选择了这条路，现在又为何想起要追问呢？§!"

 SRA_Rokia.8011.desc:0 "我的。\n§Y她露出了一个残忍的微笑。§!\n自始至终。\n元始的火花由我点燃，终末的星辰自然也落在我的手中。\n\n抉择吧，要反抗我的统御，还是享受这份力量。诚然，我并不愿与你争斗，我只不过是寻觅潮汐间的一处喘息之地罢了。\n但你有了解真相的资格。"
 SRA_Rokia.8011.a:0 "狂妄愚蠢，你以为自己能操控一个文明的意志？"
 SRA_Rokia.8011.b:0 "那就享受你那虚假的王冠吧。"
 SRA_Rokia.8011.b.tooltip:0 "NE1：暂且落幕"
 SRA_Rokia.8011.c:0 "你至少应该把原委明明白白的讲出来。"


 SRA_Rokia.8012.desc:0 "嗯哼~我只是可以玩些小小的把戏罢了。\n\n虽然操控你们那晕头转向的思维也并不困难。\n\n再见，或者你会很快回到之前？无所谓，反正那已经是一条新的时间线了。"
 SRA_Rokia.8012.a:0 "§R你被踢出了办公室。§!"
 SRA_Rokia.8012.a.tooltip:0 "啥？不是，这是什么情况？"

 SRA_Rokia.8013.desc:0 "非常感谢~现在我想好好睡一觉……没有到处破坏的蠢货，没有脑子坏掉的机器，也没有折腾不休的寻乐者，只有这个宁静，祥和，安安稳稳的星系。"
 SRA_Rokia.8013.a:0 "……"


 SRA_Rokia.8014.desc:0 "嗯哼，嗯哼。\n\n在一个无人知晓的地方，一个女孩在迷茫中苏醒，在垂落的管线和闪烁的火花间站起。\n她的双手冰冷，被粘稠而令人心悸的触感包围。灯光明灭，她颤抖着抚上自己的胸口。"
 SRA_Rokia.8015.desc:0 "如同花朵绽开般的触感回应着女孩，令她窒息，令她奔逃。如同夺路而出的窃贼，张皇失措的幼兽，不顾一切地想要逃离这个被无妄之灾毁灭的，曾以为能托付一生的处所，逃离这个曾经刻画着梦想与希望的地方。\n多好啊，即便被闯入被破坏，过道间的安全门依然尽职尽责地为逃亡的女孩开启，昏暗的灯光也指引出了一条道路，通往彼方，通往废墟，通往无人知晓的灰烬，通往可能存在的明日。"
 SRA_Rokia.8016.desc:0 "荒芜而残酷，卫星清冷的反射光洒落在大地上。从一开始这里就是草木稀疏的干燥土壤，被风沙塑造又被风沙夺去生机。\n她感到光线如刺针扎在自己的身上，却寻不到一片能遮蔽自己的阴影。\n寻找又寻找，寻找遁逸的道路，寻找噩梦的边际。\n她的双腿颤抖，仿佛枯骨般地呜咽，于是她跪倒在地，发丝如柳条般垂落在枯草上。\n她从腰间拿出终端，结实耐用的机器边角凹陷，但仍能亮起。\n她在衣角上擦净粘稠的触感，用指尖轻轻碰触屏幕，避免留下暗红的污痕。\n于是她的脸在屏幕中出现。苍白，惊恐，血痕从额角流下，凝固。\n脖颈也是一样的死寂，如同病态的画作，怪异的瓷器。\n然后就是……"
 SRA_Rokia.8017.desc:0 "有§R花§!在盛放。\n\n十一枚子弹从背后穿入，在胸口开出绚丽的花朵。\n如同蔷薇般，或粉红，或苍白，或暗红。\n她的双手松开。终端扣在地上，不再为自己的主人揭露现实。\n她感到胸口中的某物抽搐着挤压出殷红的液体，痛苦无比。\n但她的胸口空无一物。\n然后，在这寒风刺骨的死寂中，有金属的碰撞声在此地响起。\n一个影子覆上了女孩的身躯，为她挡下天穹之上的光芒。"
 SRA_Rokia.8018.desc:0 "一台，又一台。\n试验品，残次品，废弃品。\n在这个以创造为名的地方，造物们追随着它们最后的主人而来。\n机器或摇曳难定，或步履蹒跚。\n但它们不发一言，汇于此地。\n将她拱卫，将她守护。"
 SRA_Rokia.8019.desc:0 "起初的那段时光浸透了麻木的色彩。女孩跌跌撞撞地跑回了自己的住所，换掉了破开的衣物，无视新的布料被旧的血肉湿润，又将自己的设备随意拼在身旁紧跟着的机器上，看着指示灯明明灭灭。荒谬感和矛盾感笼罩着她，让她既不愿意接受自己身上发生的一切，又自认为已经不再能列于人类之间，于是她带上了一切记录与留存，离开了这个同样被入侵被抹去的地方。"
 SRA_Rokia.8020.desc:0 "她不理解自己身上发生了什么，也不敢对任何人透露，更不相信有人能解决这些——如果有，那就是过去的那位现在已经不知道死到哪里去的家伙，再也找不到了。\n她再也不能安眠。只要她的人生还会被命运随意而无情的嘲弄扭曲，被拖进无妄之灾，留不住任何自己想要拥有的事物，她就永远不能安眠。"
 SRA_Rokia.8021.desc:0 "女孩在城市的结构层中游荡，遵循管理系统运行的设施为她敞开大门。在看似寻常的损耗中，维持整个城市那高效智能的社会的机器们正为女孩自己的军团添砖加瓦。\n随着她的意志在网络中延伸，她的所见与所知迅速扩大，然而带来的却是更多的疲惫。\n她炸毁自己当初的痕迹，留下的是更多的痕迹。她要对抗秩序的一部分，却发现其上还有更庞大的存在。\n而她能依靠的唯有自己，与那夺取、盗窃、占据来的冰冷集群。"
 SRA_Rokia.8022.desc:0 "她曾一厢情愿地认为它们是没有其他可以服从的目标，才找到了自己这个最后的幸存者。\n但这些用后即弃的实验品，又哪来这样的功能呢？\n只是一个念头，一个想法，这些造物们便以自己的办法去探索、去收集、去传递、去改变，去为她创造需要的一切。\n本该按部就班的工作，为统治者效力的机器们向她颔首，仿佛文明世界的造物生来便是为了为她效力。"
 SRA_Rokia.8023.desc:0 "叹息。\n女孩知道，自己该做决定了，命运催促她在两条道路上做出抉择，一条通往随波逐流的未来，而另一条，苦难早已满溢而出。\n要怎么做呢？现在还有回头路，抛下这些机器，在没有光亮的角落里觅食，她能活下去。对这副身体来说，活着是很简单的。\n不，当然不，她早已受够了那些日子，受够了这个随意夺走她的一切的世界，她想要力量，无论代价是什么。\n她找到了一片矿脉，基本上已经废弃，但仍有许多资源有待开采。女孩篡改了数据库内的记录，将此地以“严重污染”为由封存，在矿坑下建立起自己的基地。这对正因缺乏更替组件而逐步崩毁的机械们帮助很大，虽然其中的很多居然还能以几乎完全损坏的姿态继续运行。\n单凭她自己是做不完所有事情的，女孩需要获取的东西太过复杂，不是她那漆黑冷寂的地下能组装出的。\n唉，她属实不想再和自我之外的存在交流，那些可憎卑劣不可信任的……\n但她不得不这么做，她曾精于此道，她天生精于此道。"
 SRA_Rokia.8024.desc:0 "起初，她以为自己隐藏的很好。利用入侵的城市管理系统作为跳板，她的意识在数据洪流中穿梭，寻找着那些隐藏在合法交易之下的暗流。信息被加密，层层转递，最终通过一个为某个边缘空间站提供维护服务的通讯机器人，发出了试探性的信号。\n她的筹码是信息，是系统后门，是某些被遗忘的数据档案中的关键漏洞。她提供黑客服务：清除特定目标的记录，绕过某些安全协议，甚至提供竞争对手的敏感信息——只要价格合适。作为回报，她索要那些冰冷的、闪烁的、被严格管制的科技造物。\n她从不亲自露面。她有时是一个外表普通、型号老旧的城市清洁机器人，在指定时间意外路过某个垃圾投放点，机械臂的暗格里藏着数据芯片；有时是一个货运无人机，按照精确规划的路线，在荒凉的废弃区投下一个包裹，随即自我销毁；有时是一个被遗弃建筑外骨骼，如同幽灵一般行走，将货物运送到接头地点。\n交易如同在刀尖上跳舞，却意外地顺利。货物到手，数据芯片被读取，信用点流入她控制的匿名账户。对方似乎很满意她的效率，并对她的神秘保持应有的礼貌。女孩紧绷的神经，在冰冷的矿坑里，似乎有了一丝微不可查的松动。也许，并非所有“外面”的存在都那么可憎？也许，谨慎的合作是可行的？毕竟说实话，她直到现在也没和多少人真正的交流过，她遭遇的那些事情纵览整个星球也没有几次发生，她只是恰巧不幸了一些，不是吗？"
 SRA_Rokia.8025.desc:0 "于是，命运应邀而来。\n一次再平常不过的交易，并不缺少谨慎。一个位于轨道上的废弃空间站维修舱，非常合适的场所。无人关心，无人在意，正如以往的所有交易那样。\n代理人一如既往：一台外壳修补得几乎看不出原貌的工程机器人，伪装成被派往空间站进行例行维护的普通单位。扫描货品，给出报酬，带走商品，然后会有许多重转交，混入无数自动化的货仓，来来回回，最终抵达她的手中。\n她以工程机器人的视角行动，就好像那机械正是她本人。她环顾这个堆满废弃零件、灯光昏暗的维修舱。目标货物箱就放在显眼的位置。交易的另一方，一个穿着臃肿太空服、看不清面容的人影，就站在不远处。\n她靠近货物箱，扫描仪亮起绿光。确认无误。她放下数据容器，货品存入货仓。流程完美。\n事情就这样自然而然的发生了。\n电弧闪烁，几乎要烧穿她的双眼——当然不至于真的如此，只不过对工程机器人来说，也大差不差了。\n隐蔽的交流，封闭的舱门，数个身影突然冲出，他们早有准备，安排妥当。勾爪迅速取走数据容器，干扰器运转，武器开火，废除机器人的一切行为能力，切开机体，试图取出更多。\n背叛。\n一股冰冷的、混杂着愤怒和被愚弄的耻辱感的洪流奔涌。他们想要的不仅是赖账，更想抓住她本人。对于她，的确早有悬赏，报价不菲。出卖并不令人费解，只是令人失望。"
 SRA_Rokia.8026.desc:0 "她很愤怒。\n一方面，愤怒是对于眼前的背叛者的。背叛一词，人在己方则是可耻，人非己方则是可恨，两者时常兼而有之。而另一方面，愤怒对于女孩自己，对于那些可笑的可悲的幻想，对于那些虚构的憧憬。\n她的愤怒在燃烧，灼痛她的双手，也灼烧彼处的那件机器。她的愤怒有如实质，自处理器处流淌，将一应节点熔化，将残存的能源引爆。\n那个被切开，如同被放在案板上的工程机器人华丽地炸开，无视了已被电弧烧毁的无线连接，也无视了已经失效的自毁机制。她与这机器形同一体，她的意志自然也支配这机器的一切。\n通讯频道里传来气急败坏的咒骂。空间站的混乱正在加剧，刺耳的警报声响彻整个区域。\n矿坑深处，女孩猛地向后靠在冰冷的椅背上，剧烈地喘息着。屏幕的光芒映着她毫无血色的脸，额角似乎又有冰冷的液体渗出。监视画面中，仍然活着的背叛者们正仓皇地登上自己的小型穿梭艇，逃离这片由他们自己引发的混乱。\n她安全了，暂时的。"
 SRA_Rokia.8027.desc:0 "愤怒的余烬在她胸腔里燃烧，但更深的是一种冰冷的、浸透骨髓的疲惫和失望。果然如此，果然如此。\n她环顾四周，基地的灯光似乎都暗淡了几分。那些忠诚的、蹒跚的机械身影依旧在不知疲倦地工作着，发出规律的金属碰撞声。只有它们……只有这些冰冷的造物，才是唯一不会背叛的。\n她缓缓抬起手，屏幕上调出了矿坑更深层的结构图。这里已经不安全了。虽然对方无法直接追踪到这里，但这次事件就像在黑暗中点燃了一颗信号弹，她的存在感被大大增强了。帝国安全局的嗅觉，远比黑市的鬣狗更敏锐。\n必须移动。必须放弃这个刚刚建立的、耗费了她无数心血的巢穴。\n她的命令干涩冰冷。矿坑各处，那些正在工作的机械同时停顿了一下。紧接着，更加密集的作业开始了。女孩站起身，最后看了一眼这个她曾以为能扎根的地方。屏幕上倒映着她依旧年轻、却苍白死寂的面容。\n她走向一条通往更深黑暗的秘密通道。忠诚的机械们无声地跟随，走向下一个未知的、注定充满荆棘的废墟。矿坑的灯光，在她身后，一盏接一盏地熄灭，最终被即将到来的、震耳欲聋的崩塌声彻底吞没。"
 SRA_Rokia.8028.desc:0 "矿脉的崩塌，正如帝国档案中一次微不足道的地质灾害记录，彻底埋葬了女孩的第一个巢穴。震波在荒凉的地表留下丑陋的疤痕，扬起的尘埃遮蔽了卫星清冷的光，也暂时遮蔽了所有追寻的目光。\n转移是残酷的。重建是艰难的。这些事情她第一次品尝，很遗憾，不是最后一次。\n女孩学的很快，她开始用很多个不同的身份，拆解她的需求，她学会了在背叛之前先背叛，她的方式毕竟独特，没人能从这些代理人身上找到有关她的丝毫痕迹。人们依赖机器去与机器交流，而机器，更听她的话一点。\n货物需求被拆解成无数细小的、看似无关的部分，通过不同的匿名渠道、不同的时间节点、不同的物流系统传递。这些碎片如同涓涓细流，汇入城市结构层深处那些预设的、不断变更的“死信箱”——一个废弃的通风井岔道，一个污水处理管道的检修凹槽，甚至是一个大型垃圾压实机的内部空隙。随后以各种各样的原因最终落到她的手中。\n时间在深井基地的潮湿与机器的低鸣中流逝。帝国的阴影依旧庞大，一个幽灵网络在它的缝隙中悄然扩张。女孩的力量在增长，她的机械帝国在不见天日的地下缓慢而坚定地壮大。资源被攫取，技术被整合，更多的城市维护机械在无声无息间“觉醒”，成为庞大网络中的一个节点。她甚至开始尝试小规模地逆向解析那些尖端零件，试图摆脱对他者的依赖——虽然这进展缓慢得令人心焦。"
 SRA_Rokia.8029.desc:0 "可惜，剧作家不会容许主角无所事事，必然有一些事情会发生，于是这就有了一件，用来结束这看似稳定的发展，创造一些戏剧性的变化。\n地点是城市结构层深处一个废弃的转运站。这里曾是拾荒者和不法之徒的临时落脚点，如今只剩破败和污秽。她的目标是一个放在锈蚀管道角落的密封箱。就在机械臂即将触碰到箱子时，一阵微弱而痛苦的呻吟声从腐烂的隔热材料后面传来。\n机器停顿了。\n一个蜷缩的身影。破旧得看不出原色的衣物裹着瘦骨嶙峋的身体，裸露的皮肤上布满了新旧交替的淤青和可疑的针孔。一头枯草般的头发遮住了大半张脸，但女孩认识那双眼睛。\n她叫什么呢……对了，卡涅亚。一个带着消毒水的刺鼻气味的名字，正如女孩所知晓的很多名字那样。\n卡涅亚，卡涅亚，女孩以为她早就死了，和其他那些在反抗中或之后被处理掉的名字一样。更不用说过了这么多年，她此前遭遇的那些与药物有关的死亡漩涡，其他人也逃不掉。他们本该都已经死了，正如……\n机器笨拙地靠近，尽管并不具备什么扫描能力，但也能清晰地捕捉到那个熟悉的、狰狞的，贴在脖颈后的金属接口。慷慨赠品，人人有份，方便快速摄入一系列需要与中枢神经亲密接触的研究所产品。\n一个和她一样，从那座地狱里爬出来，却又被命运无情地抛弃在腐烂角落的……同类？"
 #卡涅亚Carnea
 SRA_Rokia.8030.desc:0 "没有征兆，没有事件，一切看起来完全就是偶然。不过女孩早就不相信什么偶然了，她骤然紧张，废弃的转运站周围没有可供调用的记录装置，她不得不在更广的范围内进行排查，试图找出卡涅亚的来历。然而，她一无所获。\n毫无痕迹也是一种痕迹，这是一个陷阱，一个骗局，一个诱饵，一个计谋，她的敌人使用了她所不知晓的方法，将卡涅亚放置在此地，只要她将这个所谓的同类带回去，就会有人找到她的所在，并将她这个危险因素从帝国的阴影下排除出去。\n于是她把卡涅亚带了回来。\n安置点和她的基地相差万里，她这样告诉自己。凭借自己那神秘的能力，她完全可以让这个小营地孤立地运作下去，没有人能从这些机器上找到自己的位置，因为她不会被机器所背叛。\n女孩小心地照顾起捡回的女孩，处理她那些未来的伤疤，为她弄来维生所必须的事物。当看到那因痛苦而扭曲的面庞有些许的舒缓时，一些微不可察的令人熟悉的喜悦会有一瞬间的闪现，如同女孩很久之前，在从研究所中的那些白大褂身上取得孩子的胜利时会得到的感觉那样。"
 SRA_Rokia.8031.desc:0 "正如前面所提及的那样，在女孩身上曾经出现过的那种死亡的漩涡，在卡涅亚的身上也很快出现。植入物，排异反应，药物依赖，神经系统紊乱，乃至灵能的不稳定活动，都在摧毁卡涅亚的身体。女孩不得不为她做女孩曾经为自己做过的事情，她开始找药。\n女孩很快意识到，药物正是这计谋的关键。罕见，昂贵，高度受控，简直写满了危险，而且需求越来越多。然而她不得不这样做，她做不到对卡涅亚放手，以这样的境地，对这样的一个人置之不顾，和杀死她没有本质上的区别。女孩不愿杀死她，哪怕不以杀人的手段，仅仅只是放她去死。"
 SRA_Rokia.8032.desc:0 "当第一支药被取得，有如淹没在深海之中的卡涅亚终于醒来，她的声音沙哑而惊恐，她的表现就和当初的女孩一模一样。她的年纪要略小一些，不过现在，她大概就正处在女孩最终拥有的年岁。\n她和女孩很远，也很近。尽管女孩使用一台废弃的医疗机器人作为自己的形象，但她的言行足以表现出她曾经的经历。卡涅亚显然已经意识到了女孩曾经与自己有同样的遭遇，但她并没有加以询问，保持了一个可以称之为是礼貌的距离。\n但女孩没能保持距离。\n时间是狡猾的说客，它司掌“习以为常”之类的词汇，并非常热衷于散播它的影响力。\n女孩的话变多了，尽管她自认为在控制之下。无意苛责，她毕竟已经太久太久，没有和人真正的交流过了。她们谈论一些事情，有关卡涅亚自己，有关此地，有关外界，卡涅亚很通情达理地没有谈论有关女孩自己的事情，除非女孩自愿提起。"
 SRA_Rokia.8033.desc:0 "有一天，她谈论了自己；有一天，她评价了自己；有一天，她没能取得足够的药品；有一天，她想要去陪陪卡涅亚。\n卡涅亚太过理解女孩的难处了，她几乎是反过来在安慰女孩，她说，如果没有办法，就算了吧。\n有一种奇妙的心理过程，它属于慷慨而善良的帮助者。当有一天，这样的人因为自身的处境或是有限的能力而无法继续施以帮助，一种罪恶感就会产生。尽管这些人从头到尾都在付出，都在给予，但一旦这样的付出中止，这些人自己反倒难受了起来。\n很不幸，因为这样的心理过程，女孩想要见卡涅亚了。\n她也不知道自己想要得到什么，是当面的谅解吗，还是更多的抱歉？总之，一个并不理智的行为就这样产生了，归根结底，她仍然认为自己是自己，是一个有血有肉的人，而不真的只是某个虚无缥缈的，显现在诸多机械之间的一个幽灵。"
 SRA_Rokia.8034.desc:0 "卡涅亚是她的朋友。\n一个朋友，自然，对慎重的女孩来说，不可能是安全局的特工，不可能被一个几乎是随意的却又阴险无比的计划所指使，被送到此地只为抓一个无人知晓的小人物，不可能有一个隐秘的指令潜藏在意识的最底层，在揭露之前连她自己都无法想起。\n女孩见到了她。\n女孩已经很久没有认真看过自己，除了在替换一些因为事故或故事而彻底损毁，或者腐烂的部分的时候，她从未关心过自己的全貌。就好像她不去看，她就还和当初是同一个人一样。\n一个已经死去许久的人。\n卡涅亚很好的掩盖了自己的惊恐，这样的情形对她来说也实在是有些骇人。她就好像无事发生一样，沉稳地和女孩对话，宽慰她的不安，憧憬下一次的成功，直到爆炸声响起。\n几乎是瞬间，好像到处都是入侵者。这里并不是女孩长久经营下的基地，只不过是一处简单打理的安置所，尝试反击的机器转瞬间被摧毁，只余因灵能效应而闪烁的紫色电弧。\n女孩不知道发生了什么，也不知道攻击者是谁，她尽她所能地开始反击，并掩盖自己的撤离方向。\n她向卡涅亚发誓，她会保护她。\n卡涅亚回以一道灵能闪电。"
 SRA_Rokia.8035.desc:0 "女孩毫无防备，闪电考量到了她那难以置信的躯体状态，转而攻击她的意识，或者说灵魂之类的东西。然而，她的意识早已在这些时光里变得扭曲而庞大，她能跨越万里，让一个机器成为自己的一部分，正是这异变的体现。这大概是一件不幸的事，但眼下她幸运的因此并未怎么受伤。\n好吧，可能有歧义，她的意识没有在这次攻击中受伤，但她的心灵在这次攻击中狠狠的受伤了。\n一些令人不安的事物在她那仅仅站在原地的躯壳中蔓延开来，令卡涅亚更加认同了任务中所提及的危险性。在很可能只是一瞬间的呆滞和迷茫后，女孩终于有所行动了。\n她抬起一只手。\n灵能者的行动往往会与他们的肢体动作相关联，这是一种明确的心理暗示和目标导向，有助于灵能者们确认自己的目的。在长久的训练中，卡涅亚已经学会了抑制这样的行动，悄无声息地发起攻击，而女孩自然没有受过这样的训练。\n随着这只手在半空中颤抖，卡涅亚意识到了一件不妙的事情，有关女孩的危险性。"
 SRA_Rokia.8036.desc:0 "几乎是在一瞬间，卡涅亚身躯中的所有植入物都开始不安地颤动，随后它们屈从于更庞大的意志，开始脱离与它们紧密相连的血肉。\n一位经过彻底改造和重构的灵能特工，有大量的脏器都会被更高效的机械结构所取代，除此之外，对脊椎的彻底替换则是一种比较激进的改造方向，卡涅亚是这项技术的体验者之一，起初她并不情愿，后来她无所谓了。\n于是她的脊柱脱离了她的身躯，她的手指裂开，肋骨崩断，她的心脏被撕开，许多的事物破开她的皮肤，逃离她的血肉。\n因为这些创口，她的血肉也随之逃离。她的脊髓断开，颅骨内的植入物破碎成片，她几乎已经意识不到自己处于怎样的处境，她很快就会死去，但还要痛苦好一会。\n绝望将她淹没，但绝望不是她的。"
 SRA_Rokia.8037.desc:0 "一声极轻的气流声打破了死寂。那不是呼吸，更像是什么东西裂开的声音。\n随即，这声音开始有了起伏。一丝压抑的、断断续续的声响，从她僵硬的嘴角漏了出来。起初很低，像被扼住喉咙的呜咽，但很快，那声音开始扭曲、变形，带上了一种令人毛骨悚然的、金属摩擦般的质感。\n它变得凄厉、尖锐，如同用钝刀刮擦着生锈的钢板，又像是濒临散架的机器发出的最后悲鸣。这声音毫无温度，毫无属于生命的起伏，只有令人心悸、几近癫狂的震颤。\n\n§Y你眼前的洛琪亚停下了讲述。过了很久，或者只是一瞬间，她露出了一种几乎是悲悯的表情。§!\n\n女孩被打垮了，被摧毁了，这是来自过去的精妙的一击，把她所剩无几的一切打了个粉碎。\n她仅仅失控了一小会。\n她擦掉眼睛里渗出来的粘稠液体。\n“我们走吧。”她对自己说。\n后面的故事很简单，女孩很轻松地找到了一艘货船，乘着它离开了这个星球，随后她几次转站，抵达了一艘正在等待补给的科考舰。 她轻声呼唤，于是这艘船应允，抛下其他杂物，带着她离开，永不复还。"
 SRA_Rokia.8038.desc:0 "女孩再也没有回头。\n她后来做了许多事情，因为某个诅咒，她得以逃离她一败涂地的世界，继续她的谋划，一次又一次地失败，直至今日。\n\n故事结束了，再见。"
 SRA_Rokia.8038.a:0 "§Y她转过身去。§!"
 SRA_Rokia.8038.a.tooltip:0 "NE2：虚构故事"


