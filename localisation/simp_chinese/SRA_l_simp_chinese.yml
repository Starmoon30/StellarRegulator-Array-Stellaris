###############################
 SRA_version:0 "1.4.99 「浪迹星涯」"
 SRA_version_date:0 "2026.7.30"
 SRA_latest_update_info:0 "修复编码错误导致的事件触发不正常问题。\n神秘测试内容更新。\n"
 SRA_history_update_info:0 "在让星规出任领袖时，领袖的肖像会与星规当前的换装匹配。\n修复了时空相位偏移器没有正常生成的问题。\n修复了星穹之矛在方舟舰状态下新星终结远程打击无法工作的问题。\n改进了渺远星辰的稳定性。\n部分bug修复。\n星穹之矛方舟舰对恒星使用新星终结时不会再摧毁自己。\n为星规寰宇区划组添加了生态区类型。\n修复了星穹之矛方舟舰的停用相关机制工作不正常的问题。\n修复了星穹之矛在使用跨星系打击时会失去方舟舰状态的问题。\n修复了作战电脑在普通方舟上可用的问题\n适配4.4\n星穹之矛现在可以切换为方舟舰\n"
 SRA_settings.title:0 "星规阵列-设置面板"
 SRA_settings.desc:0 "本界面提供对 星规阵列MOD 的设置调整功能，你可以随时在法令内重新打开此界面。\n\n§E当前版本：$SRA_version$§!\n§E正式更新时间：$SRA_version_date$§!\n\n§Y更新内容：§!\n§L$SRA_latest_update_info$§!§Y\n此版本历史更新内容：§!\n§L$SRA_history_update_info$§!"
 SRA_settings.exit:0 "关闭设置面板"

 SRA_settings_box:0 "这是当前生效的设置"
 SRA_settings_page_1:0 "切换到全局设置界面"
 SRA_settings_page_2:0 "切换到国家设置界面"

 SRA_settings_crisis_text:0 "星规阵列-难度设置"
 SRA_settings_crisis_tooltip:0 "['civic:civic_SRAtechnology'] 的专属危机将在完成“路希维亚遗痕”考古事件链后发生，考虑到不同宇宙之间的战斗力等级可能相差甚远，星规阵列三类行动单元编号14-3092将为您提供世界线调整服务。"\n§Y“第三远征舰队”危机将于“终无未来之航标”考古遗址完成后的5年准时触发，请在开启“路希维亚遗痕”考古事件链之前做好一切准备。§!"
 SRA_settings_crisis_a:0 "调谐"
 SRA_settings_crisis_a.tooltip:0 "与今日之远征舰队对抗。漫长的流浪使其锋蚀刃销，然而，这支舰队对于这个银河来说依然是一场危机。与其调谐，磨砺自我，展示积累的一切。\n\n§Y远征舰队拥有约 100% 的属性提升。§!"
 SRA_settings_crisis_b:0 "§H进升§!"
 SRA_settings_crisis_b.tooltip:0 "与昔日之远征舰队对抗。启航之时的舰队自信能荡平一切，而历史的记载的确如此。与其对抗，与其争斗，与其一同踏上进升之道。\n\n§Y远征舰队拥有约 400% 的属性提升，并且获得一系列额外加成。\n远征舰队的增援频率提升，并且更庞大的舰队的占比会上升。§!"
 SRA_settings_crisis_c:0 "§Y辐辉§!"
 SRA_settings_crisis_c.tooltip:0 "与纯粹之远征舰队对抗。苍白至极。\n\n§Y远征舰队拥有约 §R3200%§! 的属性提升，并且获得极为全面的额外提升。\n远征舰队的进攻与防御舰队数量§R翻倍§!，增援频率极大提升，并且更倾向于使用庞大的舰队。\n远征舰队移动的更快，侵略性更强。§!"
 SRA_settings_crisis_d:0 "禁止危机发生"
 SRA_settings_crisis_d.tooltip:0 "每发生一次第三远征舰队入侵，就有一个03-34惨遭迫害。\n§Y没有跨位面波动信号，就没有伤害。保护03-34，从你我身边做起。§!"
 SRA_invasion_happened:0 "§R第三远征舰队已经抵达。§!"
 SRA_settings_crisis_isRE:0 "§B这命运不属于你。§!"


 SRA_settings_crisis_other_text:0 "危机其他属性管理"
 SRA_settings_crisis_other_tooltip:0 "本mod的部分危机具有全局的背景音乐，可以在这里决定是否启用。\n本mod的部分危机具有特殊的强化机制，可以在这里决定是否启用。"
 SRA_settings_crisis_other_a:0 "启用背景音乐"
 SRA_settings_crisis_other_a.tooltip:0 "§Y“一阵强劲的音乐响起。”§!"
 SRA_settings_crisis_other_b:0 "禁用背景音乐"
 SRA_settings_crisis_other_b.tooltip:0 "§Y“在和音乐播放器的搏斗中死去了。”\n此选项也会立即停用当前的危机背景音乐。§!"
 SRA_settings_crisis_other_c:0 "星规技术-突变模式"
 SRA_settings_crisis_other_c.tooltip:0 "§Y突变是一种对危机 第三远征舰队 的特殊强化机制。\n突变默认不启用。§!"

 SRA_settings_AI_tech_text:0 "星辉水晶技术权限管理"
 SRA_settings_AI_tech_tooltip:0 "如果有AI国家使用「星规技术」国民理念，可以在此管理选择了此国民理念的AI国家是否能够研究星辉水晶相关技术。\n如果可以研究，AI国家将与玩家一样在§Y游戏末期年份§!之后可以自行研究部分['concept_SRA_T4_tech']。\n有相应科技的AI国家将会建造星规舰船。"
 SRA_settings_AI_tech_a:0 "允许AI研究"
 SRA_settings_AI_tech_a.tooltip:0 "§YAI将解锁['concept_SRA_Stellarcrystal_industry']，并能和玩家一样研究星辉水晶相关技术。§!"
 SRA_settings_AI_tech_b:0 "§B启动铸星神械AI§!"
 SRA_settings_AI_tech_b.tooltip:0 "§Y在允许研究星辉水晶相关技术的基础上，AI将获得使用 §B铸星神械§! 的能力，并对所有殖民地执行。这会为其带来巨大的经济增强。\n平衡起见玩家也不再需要铸星神械飞升，选择飞升则会在殖民时弹出事件以供快捷选择。§!"
 SRA_settings_AI_tech_c:0 "§R铸星神械-湮灭§!"
 SRA_settings_AI_tech_c.tooltip:0 "§Y统合开始，解除科技限制，全面战争启动。\n在允许研究星辉水晶相关技术和使用 §B铸星神械§! 的基础上，解除['concept_SRA_T4_tech']的时期限制。这这会导致AI迅速开始使用['concept_SRA_T4_tech']的军备，并获得极度危险的舰队力量。§!"
 SRA_settings_AI_tech_d:0 "禁止AI研究"
 SRA_settings_AI_tech_d.tooltip:0 "§Y“我们的科学家完全搞不懂这些东西。”§!"



 SRA_settings_stellarcrystal_industry_text:0 "星辉产业管理"
 SRA_settings_stellarcrystal_industry_tooltip:0 "['concept_SRA_Stellarcrystal_industry']是不需要科研就能靠['civic:civic_SRAtechnology']或['civic:civic_SRARociviaEmpire']理念获取的建筑和殖民地规划。"
 SRA_settings_stellarcrystal_industry_a:0 "显示星辉产业"
 SRA_settings_stellarcrystal_industry_a.tooltip:0 "显示['concept_SRA_Stellarcrystal_industry']相关的建筑和殖民地规划。\n\n本MOD的标准难度基于这个情况设计。"
 SRA_settings_stellarcrystal_industry_b:0 "隐藏星辉产业"
 SRA_settings_stellarcrystal_industry_b.tooltip:0 "如果你拥有产能更高的产业，你可以隐藏['concept_SRA_Stellarcrystal_industry']相关的建筑和殖民地规划，已有的建筑会保留，但殖民地规划将不可用。"
 SRA_settings_stellarcrystal_industry_c:0 "启用自动铸星"
 SRA_settings_stellarcrystal_industry_c.tooltip:0 "在殖民时弹出自动铸星菜单，允许能使用 §B铸星神械§! 的玩家快捷开启相关决议。"
 SRA_settings_stellarcrystal_industry_d:0 "隐藏自动铸星"
 SRA_settings_stellarcrystal_industry_d.tooltip:0 "单纯的不再弹出自动铸星菜单。"

 SRA_continue:0 "继续"
 SRA_skip:0 "跳过此剧情"

 FLAG_CATEGORY_SRA_flags:0 "星规阵列旗帜"
 name_list_SRA_Rocivia_Empire:0 "路希维亚帝国"

 faction_SRA_StellarRegulator_sub_title:0 "§Y星辉智能§!\n一个由星辉水晶网络所承载的智能实体，掌握着神秘的技术和未知的力量。"
 faction_SRA_RE_StellarRegulator_sub_title:0 "§Y星辉智能§!\n一个由星辉水晶网络所承载的智能实体，背负着神秘的过去。"
 faction_SRA_RE_Rocivia_sub_title:0 "§Y诡谲奇变之渊§!\n一位「深渊之锚点」，某种我们尚不了解的上层位面存在。辉煌的编织者，星海的设计师。"
 faction_SRA_RE_Hidra_sub_title:0 "§Y无垠混沌之影§!\n一位「深渊之锚点」，某种我们尚不了解的上层位面存在。命运的引导者，无尽的收藏家。"


