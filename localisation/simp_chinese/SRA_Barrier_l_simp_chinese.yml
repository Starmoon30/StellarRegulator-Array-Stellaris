 decision_SRA_Barrier_Guard_fleet:0 "重新部署防御阵列"
 decision_SRA_Barrier_Guard_fleet_desc:0 "重新部署防御阵列。注意，流天星阵战斗要塞在收到致命伤害时会被瘫痪，并在180天后完成自我修复。但如果你在那时丢失了流天星阵寰宇中枢，那么战斗要塞会自毁，或者转交所有权给新的星系控制者。"
 decision_SRA_Barrier_Guard_fleet_flag:0 "防御阵列再部署冷却中"

 pc_SRA_Barrier_Main_Station:0 "流天星阵寰宇中枢"
 pc_SRA_Barrier_Main_Station_adj:0 "流天星阵寰宇中枢"
 pc_SRA_Barrier_Main_Station_desc:0 "流天星阵的生产中枢，拥有全面的生产能力，从资源生成，军工制造到科学研究无所不包，同时还负责控制战斗要塞及附属防御阵列。"
 mod_pc_SRA_Barrier_Main_Station_habitability:0 "流天星阵寰宇中枢宜居性"
 trait_pc_SRA_Barrier_Main_Station_preference:0 "流天星阵寰宇中枢偏好"
 trait_pc_SRA_Barrier_Main_Station_preference_desc:0 "$trait_pc_arctic_preference_desc$\n但目前来看，这可能是一场严重事故。显然不应该有物种被设计为适应这种高度人工化且可变的环境，也许有某种非善意的力量定义了这些物种所宜居的环境类型。"

 pc_SRA_Barrier_ringworld_habitable:0 "流天星阵寰宇环世界"
 pc_SRA_Barrier_ringworld_habitable_adj:0 "流天星阵寰宇环世界"
 pc_SRA_Barrier_ringworld_habitable_desc:0 "流天星阵的附属环世界，拥有与中枢无异的生产能力，不过不能控制战斗要塞。"
 mod_pc_SRA_Barrier_ringworld_habitable_habitability:0 "流天星阵寰宇环世界宜居性"
 trait_pc_SRA_Barrier_ringworld_habitable_preference:0 "流天星阵寰宇环世界偏好"
 trait_pc_SRA_Barrier_ringworld_habitable_preference_desc:0 "$trait_pc_arctic_preference_desc$\n但目前来看，这可能是一场严重事故。显然不应该有物种被设计为适应这种高度人工化且可变的环境，也许有某种非善意的力量定义了这些物种所宜居的环境类型。"
 SRA_Barrier_megastructure_0:0 "§B流天星阵§!"
 SRA_Barrier_megastructure_0_MEGASTRUCTURE_DETAILS:0 "庞大的恒星系要塞，将清空整个恒星系来建造。"
 SRA_Barrier_megastructure_0_DESC:0 "流天星阵恒星系要塞，设计用于在战争前线提供舰队补给，收集周围的资源并加工，快速组建船只，以及直接参与正面战斗，为舰队提供强有力的火力支援和战斗系统支持。§B这座超级恒星系巨构能提供难以想象的产出，并自行维持一系列高度先进的防御设施。§!§R将清空恒星系内所有星球并抽干恒星。§!"
 SRA_Barrier_megastructure_1:0 "流天星阵建设启动"
 SRA_Barrier_megastructure_1_DESC:0 "预先安排好的自动化建设系统在建造整个流天星阵恒星系要塞的同时，还会自动殖民建设出来的殖民地，并部署防御阵列。"
 SRA_Barrier_megastructure_2:0 "流天星阵环世界区段"
 SRA_Barrier_megastructure_2_DESC:0 "流天星阵的环世界区段。"
 SRA_Barrier_megastructure_3:0 "流天星阵环世界区段"
 SRA_Barrier_megastructure_3_DESC:0 "流天星阵的环世界区段。"
 SRA_Barrier_megastructure_4:0 "流天星阵"
 SRA_Barrier_megastructure_4_DESC:0 "流天星阵能维持庞大的海军，并提供大量资源，它还拥有巨大的船坞，能成建制的建造星舰。"
 SRA_Barrier_megastructure_ruined:0 "被毁的流天星阵"
 SRA_Barrier_megastructure_ruined_DESC:0 "这座流天星阵战斗要塞在一场战斗中被摧毁了，但还有修复的可能。"
 SRA_Barrier_megastructure_repair:0 "修复流天星阵"
 SRA_Barrier_megastructure_repair_DESC:0 "修复流天星阵战斗要塞并重置所有殖民地。"

 SRA_Barrier_Guard_Station_megastructure_0:0 "§B星宇圣卫§!"
 SRA_Barrier_Guard_Station_megastructure_0_MEGASTRUCTURE_DETAILS:0 "星宇圣卫卫戍要塞,附带一支防卫舰队。"
 SRA_Barrier_Guard_Station_megastructure_0_DESC:0 "星宇圣卫卫戍要塞，设计用于为流天星阵提供额外战斗能力，可以指挥一支卫戍舰队协同作战。"
