 SRA_RE_StellarRegulator_debris_chain_title:0 "§B尘封碎片§!"
 SRA_RE_StellarRegulator_debris_chain_desc:0 "这些神秘的碎片来自于过去，曾是星规阵列的一部分。\n重新取回它们将揭露尘封的秘密，并对星规造成不可预知的影响。\n\n§Y尽管并无明确的时间要求，但最好确保至少有 3 个碎片已被吸收。§!"
 SRA_RE_StellarRegulator_debris_num:0 "§Y已吸收的碎片§!"

 SRA_RE_StellarRegulator_debris_1_project: "$SRA_RE_StellarRegulator_debris_1$"
 SRA_RE_StellarRegulator_debris_1_project_DESC: "$SRA_RE_StellarRegulator_debris_1$记录着让星规启程的那件事。\n\n§Y只有缺少什么却得不到，人们才会行动。又或者说，所有的意识都是如此。§!"
 SRA_RE_StellarRegulator_debris_1_project_TOOLTIP: "联系星规，让她吸收$SRA_RE_StellarRegulator_debris_1$以完成此项目。"

 SRA_RE_StellarRegulator_debris_2_project: "$SRA_RE_StellarRegulator_debris_2$"
 SRA_RE_StellarRegulator_debris_2_project_DESC: "$SRA_RE_StellarRegulator_debris_2$记录着有关星规如何存在的事情。\n\n§Y谨慎起见，在此序列内最后吸收这个碎片。\n离散的意识注定失败，特别是喜欢互相争斗的那些。§!"
 SRA_RE_StellarRegulator_debris_2_project_TOOLTIP: "联系星规，让她吸收$SRA_RE_StellarRegulator_debris_2$以完成此项目。"

 SRA_RE_StellarRegulator_debris_3_project: "$SRA_RE_StellarRegulator_debris_3$"
 SRA_RE_StellarRegulator_debris_3_project_DESC: "$SRA_RE_StellarRegulator_debris_3$记录着有关星规如何存续的事情。\n\n§Y有的时候人们欺骗自己有些东西是不得不付出的，其实他们只是为了回避自己的决策并不明智的事实。§!"
 SRA_RE_StellarRegulator_debris_3_project_TOOLTIP: "联系星规，让她吸收$SRA_RE_StellarRegulator_debris_3$以完成此项目。"

 SRA_RE_StellarRegulator_debris_4_project: "$SRA_RE_StellarRegulator_debris_4$"
 SRA_RE_StellarRegulator_debris_4_project_DESC: "$SRA_RE_StellarRegulator_debris_4$记录着星规的创造者，主要的那一位。\n\n§Y谨慎起见，尽可能靠后地吸收这枚碎片。\n某个人实在太坏，有故意赠与希望的恶劣爱好，尽管她什么也没有允诺，但人们往往会认为，希望是切实可靠的。§!"
 SRA_RE_StellarRegulator_debris_4_project_TOOLTIP: "联系星规，让她吸收$SRA_RE_StellarRegulator_debris_4$以完成此项目。"

 SRA_RE_StellarRegulator_debris_5_project: "$SRA_RE_StellarRegulator_debris_5$"
 SRA_RE_StellarRegulator_debris_5_project_DESC: "$SRA_RE_StellarRegulator_debris_5$记录着星规的另一位创造者。\n\n§Y她其实没有做什么，只是后来送了点东西。对于一些本就足够艰难的命运来说，她倒是会表现的很友善。§!"
 SRA_RE_StellarRegulator_debris_5_project_TOOLTIP: "联系星规，让她吸收$SRA_RE_StellarRegulator_debris_5$以完成此项目。"

 SRA_RE_StellarRegulator_debris_6_project: "$SRA_RE_StellarRegulator_debris_6$"
 SRA_RE_StellarRegulator_debris_6_project_DESC: "$SRA_RE_StellarRegulator_debris_6$记录着星规启程之前见证的事情。\n\n§Y人们塑造一些有关自己如何存在的标准，并认为那就是价值所在。智慧的目标其实可以与智慧无关，至少大多时候如此。§!"
 SRA_RE_StellarRegulator_debris_6_project_TOOLTIP: "联系星规，让她吸收$SRA_RE_StellarRegulator_debris_6$以完成此项目。"

 SRA_RE_StellarRegulator_debris_7_project: "$SRA_RE_StellarRegulator_debris_7$"
 SRA_RE_StellarRegulator_debris_7_project_DESC: "$SRA_RE_StellarRegulator_debris_7$记录着属于那片银河的一件事。\n\n§Y人们习惯于以自己的标准衡量他者的价值，有时候，为了否定某物，即便是死亡也在所不惜。§!"
 SRA_RE_StellarRegulator_debris_7_project_TOOLTIP: "联系星规，让她吸收$SRA_RE_StellarRegulator_debris_7$以完成此项目。"

 SRA_RE_StellarRegulator_debris_8_project: "$opinion_country_to_SRA_RE_StellarRegulator_debris_8$"
 SRA_RE_StellarRegulator_debris_8_project_DESC: "$opinion_country_to_SRA_RE_StellarRegulator_debris_8$记录着属于这片银河的一件事。\n\n§Y牺牲是一个听起来很高尚的词。高尚是一个听起来很高尚的词。§!"
 SRA_RE_StellarRegulator_debris_8_project_TOOLTIP: "联系星规，让她吸收$opinion_country_to_SRA_RE_StellarRegulator_debris_8$以完成此项目。"

 SRA_RE_StellarRegulator_debris_9_project: "$SRA_RE_StellarRegulator_debris_9$"
 SRA_RE_StellarRegulator_debris_9_project_DESC: "$SRA_RE_StellarRegulator_debris_9$记录着星规所做的最后一个选择。\n\n§Y谨慎起见，最好在吸收了其他全部碎片之后再考虑这个。\n永恒是一个很有魅力的词，当它摆到面前的时候，其他的东西都不那么重要了。§!"
 SRA_RE_StellarRegulator_debris_9_project_TOOLTIP: "联系星规，让她吸收吸收$SRA_RE_StellarRegulator_debris_9$以完成此项目。"
