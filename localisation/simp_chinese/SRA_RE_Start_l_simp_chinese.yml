l_simp_chinese:
##############################
 #修复星穹之矛
 SRA_RE_SOGZ_repair_chain_title:0 "§B陨落星辰§!"
 SRA_RE_SOGZ_repair_chain_desc:0 "星穹之矛，一艘庞大的星舰，凝聚着难以想象的科技。\n我们不知道它是什么时候坠毁在我们的母星上的，但时光并没能在它光滑的外表上留下些许痕迹。\n它本将永远沉睡，但我们，能让它再度启航。"

 SRA_RE_Start_SP1:0 "§B分析现存资料库§!"
 SRA_RE_Start_SP1_DESC:0 "整个舰体内部几乎都被某种可怕的力量撕碎了，但至少还有一些部件是可以使用的。如果能获取所有现存的记录，我们就能在修复星穹之矛的道路上更进一步。"
 SRA_RE_Start.3:0 "现存数据库分析完成"
 SRA_RE_Start.3.desc:0 "在研究团队的努力和星规的协助下，我们成功在那些散落的存储水晶中复原了一些宝贵的数据。当然，我们还需要更进一步的研究。"
 SRA_RE_Start.3.a:0 "做得好。"
 SRA_RE_Start.4.desc:0 "早上好，中午好，以及晚上好，朋友。\n今天我是来跟你讲讲有关小星规的事的。\n如你所见，她与你所熟知的那个星规不一样，她是残缺的，不完整的，脆弱的。\n她失去了太多，力量、知识、记忆。这既是不幸，也是机遇。\n她忘却了所有悲伤，重拾了梦与幻想。\n她可以走上一条崭新的，未曾设想的道路。"
 SRA_RE_Start.5.desc:0 "但是，过去不会因为被忘却就不复存在。\n这片银河并不像表面上一样宁静。\n过去终将到来。\n但如何迎接它的到来，由你决定。"
 SRA_RE_Start.6.desc:0 "不过呢，你不必太过心急。\n我们还有充足的时间，可以享受阳光、微风、以及一切美好的事物。\n你也有充足的时间，去探索，去征服，去逐鹿星河。\n去开拓未来，创造辉煌。\n我很期待。"
 SRA_RE_Start.7.desc:0 "执行官，你不必睁开眼睛，我是星规阵列，是来自路希维亚帝国的人工智能。\n咳咳，好吧，其实我是来向您汇报最新研究成果的。\n我成功从那些资料中获取了一段特别的信息，有关于星辉水晶之间互相感应的奇特现象。\n如果能进行更进一步的研究，或许我就能借此发现其他的星规阵列遗迹。\n但我需要你们的一些科研资源支持，如果您觉得是时候了，那就去特殊项目界面开启下一阶段吧。"
 SRA_RE_Start_SP2:0 "§B研究水晶共鸣§!"
 SRA_RE_Start_SP2_DESC:0 "星辉水晶，一种神秘的可编程物质，藉由特殊的手段改变其内部结构后，便可展现出各种各样不同的性质。\n经过相关处理之后的星辉水晶之间可以形成独特的超距网络，无视距离无延迟地传递能量与信息。而目前的研究表明，未经过处理的星辉水晶之间，也存在着微弱的类似联系。\n在这一方面深入研究，也许就能发现其他的星规阵列遗迹。"

 SRA_RE_Start.8:0 "水晶共鸣研究结束"
 SRA_RE_Start.8.desc:0 "在我们的科研资源的支持下，星规完成了对星辉水晶之间共鸣现象的研究。\n星辉水晶网络需要特殊的结构与持续的能量输入来维持，但事实上，其他的水晶也拥有着连接网络的能力，只是过于微弱，无法使用。\n不过，若是使用一组特殊的星辉水晶激发目标星辉水晶的反馈信号，我们就至少能够定位目标的大致位置。\n§Y功能解锁：水晶共鸣定位\n与星规通讯以下达此指令，揭示下一个星规阵列遗迹位置。§!"
 SRA_RE_Start.8.a:0 "已收到。"


 SRA_RE_Start.9:0 "探测成功"
 SRA_RE_Start.9.desc:0 "经过不断的矫正与分析，我们成功定位了一组星辉水晶所在的位置，是时候展开考古工作了。"
 SRA_RE_Start.9.a:0 "已确认。"

 SRA_RE_archaeological_1:"§B折损之翼§!"
 SRA_RE_archaeological_Text_1:"第一坐标：冰封的折翼之地"

 SRA_RE_Start.11.name:"冰封大地"
 SRA_RE_Start.11.desc:"乍一看，这只是一颗普通的冰封星球。然而深度探测表明，在厚厚的冰层下，有一枚修长的文明造物。"
 SRA_RE_Start.11.a:"开始发掘！"
 SRA_RE_Start.12.name:"开挖"
 SRA_RE_Start.12.desc:"庞大的工程团队紧随其后，在冰面上架设了一系列庞大机械。\n热熔钻机在短短几周内就挖出了一个五公里宽的深洞，并在十一公里深处找到了目标：一枚棱角分明的星穹之矛浮翼。\n然而，如何把它弄上来却成了一个巨大的难题。\n毕竟这枚浮翼有整整四十五公里长，斜插在冰层深处与地壳内。"
 SRA_RE_Start.12.a:"要不我们把它转个向吊上来？"
 SRA_RE_Start.13.name:"安全第一"
 SRA_RE_Start.13.desc:"花了相当漫长的时间，我们成功在洞底把这枚浮翼竖了起来以让它可以通过洞口。然而，当我们试图展开吊装工作时，意外发生了。\n即便有反重力系统的支撑，表层的冰面还是没能承受浮翼的重量，塌陷了。\n工程现场顿时一片混乱，好在大家都严格执行了戴好安全帽的要求，没有受伤。\n下一个吊装方案正在讨论中。"
 SRA_RE_Start.13.a:"你这安全帽……能加陆军生命值吗？"
 SRA_RE_Start.14.name:"力大砖飞"
 SRA_RE_Start.14.desc:"鉴于目前施工环境较差，工程团队提出了一个新的方案：在浮翼周围搭建吊装框架，然后抽调一批拖船直接把整个框架拉出星球的引力圈。\n尽管这一方案显得十分浪费，但我们确实也没有别的好方法把这个大玩意拖出去了。\n不过，当一切准备妥当，拖船刚刚开动的时候。\n星规意外地通过星辉水晶网络激活了浮翼内的引力阻断器。\n于是庞大的浮翼腾空而起，掀飞了一大块地表。\n然后因为残余能源耗尽引力阻断器关闭狠狠地扯了拖船一下，差点把牵引机构扯断。"
 SRA_RE_Start.14.a:"比泰坦战舰还大的巨型结构像悠悠球一样被扯飞起来……"
 SRA_RE_Start.15.name:"收尾检查"
 SRA_RE_Start.15.desc:"庞大的浮翼正在被运往星穹之矛遗迹所在的位置，我们由衷地希望一路平安。\n这枚浮翼将被放置在与星穹之矛上相应位置对应的地方，为此工程团队已经将半埋在地层里星穹之矛的周围全部清空。\n科考团队检查了浮翼原来的位置，并没有发现其他异常。\n总之，这件事算是告一段落了。"
 SRA_RE_Start.15.a:"我怀疑工程队里混进了绿皮。"

 SRA_RE_Start.16.desc:"库图，我的库图，你终于回来了。\n啊，执行官……呃，您找回来的这片浮翼叫做库图卡诺斯……总之非常感谢。\n本来这些浮翼都是有空间稳定器可以稳定在我的舰体周围的，但我坠毁之前那段时间可能已经不能很好的维持它们的状态了，所以库图才会落到另一个星球上。\n那么现在四片浮翼又重新完整了，预计修复舰体所需的能量下降到了原指标的2%——不过还是很多就是了……\n那么执行官，您可以随时进行下一次定位。"
 SRA_RE_Start.16.a:"嗯。"
 SRA_RE_Start.16.b:"……那么其他浮翼有名字吗？"
 SRA_RE_Start.17.desc:"啊……呃……有的……\n……\n从一号到四号分别是……艾琳伊丝、萨诺里安、库图卡诺斯、埃泽纳尔。\n好了您已经知道的够多了不用再问了谢谢您下次再见——\n\n§Y她红着脸跑掉了。§!"
 SRA_RE_Start.17.MESSAGE_SRA_RE_Rocivia:"呵……这些名字倒是有些令人怀念。"


 SRA_RE_Start.18:0 "探测成功"
 SRA_RE_Start.18.desc:0 "经过不断的矫正与分析，我们成功定位了一组星辉水晶所在的位置，是时候展开考古工作了。"
 SRA_RE_Start.18.a:0 "已确认。"

 SRA_RE_archaeological_2:"§B燃尽于战火§!"
 SRA_RE_archaeological_Text_2:"第二坐标：死寂的昔日沃土"

 SRA_RE_Start.20.name:"辐射废土"
 SRA_RE_Start.20.desc:"这颗死寂星球上仍残留着可怕的伤痕，那些幽邃的裂隙正是战火留下的痕迹。而在飘散的辐尘中，一丝微不可查的线索正在呼唤着我们。"
 SRA_RE_Start.20.a:"探索，然后发现。"
 SRA_RE_Start.21.name:"建立基地"
 SRA_RE_Start.21.desc:"强烈的辐射能够摧毁血肉与机械，要在其间穿行，我们必须做好万全的准备。\n一个小型前哨站已经被建立了起来。在做了严密的防护工作后，我们部署了一组大型地层探测仪，试图寻找一些过去的遗迹。\n探测结果显示，地层中有明显的开挖痕迹，对岩浆岩带的分析则表明这颗星球上曾经有过穿透地壳的大型钻孔工程。在周围的地层中，我们发现了许多性质大不相同的异常部分。"
 SRA_RE_Start.21.a:"去挖一挖看看。"
 SRA_RE_Start.22.name:"辐射地幔"
 SRA_RE_Start.22.desc:"在吸取了上一次工程的教训后，工程团队预先布设了面积庞大的支撑结构，随后才开始在这一地区执行挖掘工作。\n值得注意的是，这些岩浆岩的辐射强度比周围的岩石要高上不止一个等级。我们有理由推测这颗行星的厚重地壳下的岩浆拥有较高的放射性元素含量。\n有不少白黑色的建筑残骸被挖了出来。这些建筑的外墙由一系列几乎被“冻结”的粒子组成，许多微小的星辉水晶夹杂其间，形成了一个薄弱的维持立场。即便在缺少供能的情况下经历了相当长的时间，这些材料依然拥有着难以置信的强度。\n挖掘工作仍在继续，我们热切地希望了解这些设施遗迹的秘密。"
 SRA_RE_Start.22.a:"令人期待。"
 SRA_RE_Start.23.name:"水晶工厂"
 SRA_RE_Start.23.desc:"更多的收获使我们能够从大量残骸中找到往事留下的蛛丝马迹，在大海捞针般的搜寻后，我们成功通过残存的数据拼凑出了这个基地的历史。\n这是一座工厂，一座庞大的，为一支星际舰队提供星辉水晶的工厂。\n特定模式下的星辉水晶能够同化周围的物质，而这座工厂，则在加速这一过程。\n大量的资源被折越到这座设施内，然后被转化为星辉水晶，补充给那些受损的星规阵列舰船。\n但是……发生了什么？"
 SRA_RE_Start.23.a:"一支舰队……"
 SRA_RE_Start.24.name:"灭顶之灾"
 SRA_RE_Start.24.desc:"这座设施内并没有保存太多的资料。\n那场战争的一切仍然是个谜，我们只能推测那时有一支星规阵列舰队正在与某个势力交战。战争结果如何无人知晓，只是如今的银河中它们的痕迹已所剩无几。\n这座工厂是在战争中被摧毁的。某种威力巨大的武器自上而下摧毁了整个设施，击穿了地壳与地幔，近乎将地核击碎。\n这颗星球没有爆炸，但星核内部的放射性元素被散播到了各地，将这里变成了死寂的废土。"
 SRA_RE_Start.24.a:"嚯。"
 SRA_RE_Start.25.name:"神秘水晶"
 SRA_RE_Start.25.desc:"在工程团队整理发现的那些设备的时候，前来巡视的星规偶然发现了一枚与众不同的星辉水晶。\n与其他那些引导能量或制造力场的星辉水晶不同，这枚水晶带有一丝令人琢磨不透的力量。\n它被复杂的能量场保护着，屏蔽了内外之间的联系，但星规表明其中可能隐藏着一些重要的信息。\n她需要我们的支援来展开破解工作。"
 SRA_RE_Start.25.a:"先把水晶运回来吧。"

 SRA_RE_Start_SP3:0 "破解水晶"
 SRA_RE_Start_SP3_DESC:0"从水晶工厂的残骸中找回的水晶中隐藏着不为人知的秘密，为了破解屏障，星规需要我们科研设施的支持。"
 SRA_RE_Start.26.desc:"执行官，对存储水晶的破译工作已经完成了，里面的确有许多有价值的信息。\n我找到了许多有关星辉水晶调整方式的资料，在这些数据的支持下，我找到了一种消耗少量能量就可以修复星穹之矛的办法。\n我的储能水晶并非全部耗尽，实际上，有几组水晶因为内部结构受损，并没有输出能量。\n现在我可以稳定这些水晶并修复内部的结构，这样我就有了足够的能源启动修复程序。\n如果有了足够的能量，您可以联系我执行修复程序。\n§Y修复选项在“下达指令”界面内。§!"
 SRA_RE_Start_SP4:0 "启动修复程序"
 SRA_RE_Start_SP4_DESC:0"让星穹之矛再度启航。"



 SRA_RE_Start.27.name:"探测成功"
 SRA_RE_Start.27.desc:"经过不断的矫正与分析，我们成功定位了一组星辉水晶所在的位置，是时候展开考古工作了。"
 SRA_RE_Start.27.a:"已确认。"

 SRA_RE_archaeological_3:"§B尚未消逝的电波§!"
 SRA_RE_archaeological_Text_3:"第三坐标：荒芜的坠毁中继"

 SRA_RE_Start.29.name:"寂静大地"
 SRA_RE_Start.29.desc:"这颗荒芜的星球上常年寂静无声，但在大地深处，有什么正回应着我们的呼唤。"
 SRA_RE_Start.29.a:"准备登陆。"
 SRA_RE_Start.30.name:"岩浆岩带"
 SRA_RE_Start.30.desc:"一番调查之后，我们很快发现了地表上的异常。\n在其中一个半球上，地表的构造与普通的荒芜星球并没有多少差别；但在另一个半球上，有许多竖直的岩浆岩带以较高的密度分布着。\n参考上一次的发现，部分考古学家推测这里也发生了一场对地轰炸，认为这些岩浆岩带是轨道轰炸造成的深坑被熔融岩石重新填补的结果。\n反馈信号似乎就是从这片岩浆岩区域中发出的。"
 SRA_RE_Start.30.a:"继续调查。"
 SRA_RE_Start.31.name:"“只剩方向盘的大和”"
 SRA_RE_Start.31.desc:"工程团队已经习惯了打洞了。在找到目标区域之后，大规模的开挖作业随即展开，没过多久，我们就找到了那个一直在发出信号的东西。\n这也许曾是一座小型空间站，但它的基本结构已经完全被摧毁了。大量细小的壳体残骸表明它在之前受到了毁灭性的打击，在测试了这些碎片的强度之后，我们甚至怀疑星球上的痕迹只是这次攻击的余波。\n但是，在这样的损毁情况下，它的核心仍在运行。"
 SRA_RE_Start.31.a:"修好只需要造价的四分之一……我在说什么？"
 SRA_RE_Start.32.name:"解铃还须系铃人"
 SRA_RE_Start.32.desc:"它接收到了什么，又在传达些什么？星辉水晶网络的超距作用原理决定了其通讯几乎不可能被截获，如果我们想知道它在做什么，我们必须侵入它。\n但是，贸然入侵带来的结果是无法预料的，没人知道破坏外壳会不会触发某些反制机制，侵入获取数据又会不会导致防泄露自毁系统触发。\n我们一致认为，这种事情应该让更专业的人出手。"
 SRA_RE_Start.32.a:"星规，轮到你出场了。"
 SRA_RE_Start.33.name:"可悲的孤注一掷"
 SRA_RE_Start.33.desc:"§Y「正在受理接入请求……确认编号：03-34……错误：标识库不完整……重新验证……确认编号：03-34-21-626……权限已赋予……」§!\n“……”\n“……星规？”\n仿佛从梦中惊醒，她一边道歉一边汇报起她的成果。\n在获取了操作权限之后，星规对这一中继站的用途和经历有了大致的了解。\n作为一个独特的小型通讯中继，它负责在一种被称作“空间结构撕裂”的极端状况下传递星辉水晶共鸣信号。记录显示，一支强大的自动舰队为了阻断这座中继站所从属的舰队的指挥，制造了横跨数十个恒星系的空间结构撕裂带，但随着这座中继站的部署，那样的抵抗也显得苍白无力。最终，自动舰队以巨大的损失强行摧毁了这座中继站，然而第二座、第三座……早已抵达。\n作为佐证，我们的确在周围发现了一些细微的反常空间褶皱，这也许就是那时留下的痕迹。"
 SRA_RE_Start.33.a:"……"
 SRA_RE_Start.34.name:"存储水晶"
 SRA_RE_Start.34.desc:"在小心翼翼的拆解后，星规在中继站的核心里发现了一个不应该存在的东西。\n一枚小巧的存储水晶，被一种完全不同的加密方式保护着。\n在中继站的设计中，并没有这样的一枚水晶存在。经过比对，它所处的位置是内部结构间形成的空位，并非特意预留的位置。\n就好像它是被什么人塞进去的一样。\n然而在不破坏外部结构前提下，这枚水晶要么在制造时就塞进去了，要么就是通过某种极为精确的折越进入到了里面。"
 SRA_RE_Start.34.a:"把它带回来看看吧。"
 SRA_RE_Start.35.name:"水晶就位"
 SRA_RE_Start.35.desc:"中继站的核心被整个运了回来，相关设施已经准备完毕，星规随时可以主持开展研究工作。"
 SRA_RE_Start.35.a:"已确认。"
 SRA_RE_Start_SP6:0 "研究中继站水晶"
 SRA_RE_Start_SP6_DESC:0 "在坠毁中继站核心中发现的神秘水晶正等待着我们去一探究竟。"
 SRA_RE_Start.36.name:"研究完成"
 SRA_RE_Start.36.desc:"对坠毁的中继站核心中的神秘水晶的研究已经圆满完成。在一系列复杂的工作之后，星规得到了一串信号序列。\n水晶内部的相关资料显示，这串信号可以呼叫一座被称作「星穹枢纽」的巨型空间站，命令其折越到目标位置。这座庞大的太空结构集军工、科研、生产、指挥于一体，能提供无穷无尽的资源，极大地增强我们的实力。"
 SRA_RE_Start.36.a:"真不错。"
 SRA_RE_Start.37.desc:"啊，执行官，想必您已经收到星穹枢纽的相关消息了吧。\n即使以我们星规阵列的标准来看，这也是一座非同一般的巨型建筑。先进的时空技术赋予了它几乎无限的内部空间，使得仅仅一座星穹枢纽就能支撑起一整支……舰队。"
 SRA_RE_Start.38.desc:"不过，我要通知您的，是水晶里找到的另一个东西，确切的说，三个。\n\n§Y她展示着三枚“碎片”，其颜色分别为青色，绿色与橙色。§!"
 SRA_RE_Start.39.desc:"这是「意识碎片」，一种凝聚着情感、知识、力量、智慧的东西。\n这三枚意识碎片是由「星规阵列」所留下来的：可能是过去的我自己，也可能是别的星规。\n在进行唯一的解读方式——也就是直接吸收碎片前，意识碎片中的内容都是不可知的。\n因此，只能通过浮在表面的一些……特质……来推断它们的内容。"
 SRA_RE_Start.40.desc:"吸收这些碎片所带来的影响是未知的……我不知道它能带来什么样的收获，也不知道在那之后我还是否会是我……\n执行官……\n我相信您的选择，所以，请您做出决断吧。"
 SRA_RE_Start.40.a:"吸收一个碎片。"
 SRA_RE_Start.40.b:"还是先等等吧。"
 SRA_RE_Start.41.desc:"明白了。如果您想要改变想法，您可以找我“下达指令”。"
 SRA_RE_Start.41.a:"嗯"


 SRA_RE_Start_SP7:0 "部署星穹枢纽"
 SRA_RE_Start_SP7_DESC:0 "发送信号序列，将星穹枢纽部署至母星系附近。"

 SRA_RE_Start.42.name:"星穹枢纽抵达"
 SRA_RE_Start.42.desc:"被称为星穹枢纽的庞大太空结构已经抵达了我们母星系的附近，并自行搭建了一条超空间航道。\n麻烦的是，星穹枢纽似乎正处于休眠状态，希望星规会有办法重新启动它吧。"
 SRA_RE_Start.42.a:"决定就是你了，上吧，科研船！"


 SRA_RE_Start_SP8:0 "第一阶段：系统对接"
 SRA_RE_Start_SP8_DESC:0 "与星穹枢纽的系统对接，解除宜居段上的护盾。"
 SRA_RE_Start.43.name:"护盾解除"
 SRA_RE_Start.43.desc:"在获得了系统授权后，我们成功解除了星穹枢纽环世界宜居段上的护盾，现在我们随时可以殖民这个区段了。\n不过要注意的是，由于调谐星核的能量回路尚未激活，这座设施的生产能力受到了极大的影响。"
 SRA_RE_Start.43.a:"准备进行下一步工作。"
 SRA_RE_Start_SP9:0 "第二阶段：回路激活"
 SRA_RE_Start_SP9_DESC:0 "激活调谐星核的能量循环回路，将星穹枢纽恢复到正常状态。"
 SRA_RE_Start.44.name:"调谐星核回路激活"
 SRA_RE_Start.44.desc:"调谐星核的能量回路已经激活，时空相位引擎所产生的庞大能量现在开始供应给整座星穹枢纽，宜居段的产出已经恢复正常。"
 SRA_RE_Start.44.a:"非常好。"
 SRA_RE_Start.44.MESSAGE_SRA_RE_Rocivia:"啊，我喜欢这个设计，在结构内部拓展额外的空间来增加产业密度，只要小心维持设施不被破坏就行了。"





 SRA_RE_Start.60.name:"探测成功"
 SRA_RE_Start.60.desc:"经过不断的矫正与分析，我们成功定位了一组星辉水晶所在的位置，这是一个先前一直没有被注意到的恒星系。\n\n等等……\n似乎有什么不太妙的东西因为我们的探测信号而重新启动了。"
 SRA_RE_Start.60.a:"准备战斗！"
 SRA_RE_Start.60.MESSAGE_SRA_RE_Rocivia:"终于有点东西打了，一直风平浪静的太不像话了。"

 SRA_RE_archaeological_4:"§B早已失落的守护§!"
 SRA_RE_archaeological_Text_4:"第四坐标：熔融的坚盾遗骸"

 SRA_RE_Start.61.name:"熔岩地狱"
 SRA_RE_Start.61.desc:"防御站的残骸化作陨星，将棕黑色的岩石地面击得四分五裂。显而易见，在这样一片熔岩地狱中开展考古行动是极度不合理的。\n最终，我们的科研团队决定将残骸带离地表。\n在将其拖曳至轨道高度后，我们终于可以好好的研究研究这块残骸了。"
 SRA_RE_Start.61.a:"啊这。"
 SRA_RE_Start.62.name:"一体化设计"
 SRA_RE_Start.62.desc:"仅仅是这样的一块残骸就能让我们的工程学家们赞不绝口。\n不能拆解星穹之矛——哪怕只是极小的一部分——来研究其内部构造一直让这些工程学狂热者耿耿于怀，如今他们终于有机会一窥星规阵列的设计了。\n这座防御站的结构几乎是一体化的，换句话说，它的内部结构浑然一体，紧密结合、不留空隙。借助于其材料优异的性质与性能，相关设备可以被制造成各种形状与大小，尽可能地减少冗余的空间。大量的分区和隔墙强化了安全性和生存能力，微观机械群的使用则在废除了检修通道的同时保证了维护和损管能力。再加上星辉水晶那超乎想象的泛用性，这些造物甚至可以在几乎被完全摧毁时仍保持基本功能的运作。\n尽管受限于技术和材料水平我们能做的相当有限，但我们依然受益匪浅。"
 SRA_RE_Start.62.a:"很好。"
 SRA_RE_Buff_1:0 "星规阵列一体化设计理念"
 SRA_RE_Start.63.name:"揭露"
 SRA_RE_Start.63.desc:"情报表明，星规阵列有相当可靠的防泄密机制，现有的任何对核心区进行拆解或入侵的行为都会导致其启动防泄密机制，抹除所有数据或摧毁数据核心本身。\n所幸，我们并非只能以外人的身份开展破解工作。\n在“权限人员”的帮助下，我们很快取得了数据核心内部的资料。\n这些只言片语的记录讲述了一场……不应该发生的战争。\n这座防御站从属于星规阵列03-34-21方面军，其所属舰队当时正在执行一场名为“第三远征”的军事行动，并且，正处于迷航状态。\n它们在这里遭遇了一支被标记为“科尔文明”的庞大自动舰队，这一发现似乎在它们的意料之外。\n它们似乎熟悉这些自动舰队，并认为它们不该出现在这里。\n无论如何，远征舰队对自动舰队发起了攻击，并迅速演变为旷日持久的星系级战争。\n实际上，战局几乎从一开始就是一边倒的局面。自动舰队的技术水平难以与对手匹敌，战术更是被完全针对，战损往往是五比一甚至十比一，只能靠着庞大的数量支撑。\n随着数量的迅速减少，自动舰队也越来越向某一个恒星系集中。最终，最后的决战在那个恒星系的临近展开，并以自动舰队的几乎全灭而告终。\n然而，在封锁解除后，远征舰队似乎意识到了这支自动舰队正在看守什么。它们最终没有进入那个恒星系，并且，开始全面撤离这个银河。"
 SRA_RE_Start.63.a:"是的，不应该发生的战争……"
 SRA_RE_Start.64.name:"逃过一劫"
 SRA_RE_Start.64.desc:"也许我们应该庆幸，我们的银河曾与死神擦肩而过，但最终逃过了一劫。\n剩余的记录包含了一条关于一种被称为“死域湮灭引擎”的设备被部署的报告。根据描述，它使用一种特殊的技术引爆星系中央的黑洞，撕开一道混沌的位面大裂隙。这一裂隙极不稳定因而几乎不会有位面外的入侵产生，但整个星系都将被毁灭性的空间结构崩塌摧毁，并在数千万年内难以恢复。\n然而其启动进程被一条来自于“钥匙”的指令终止了。\n在那以后，舰队再也没有回到这里，这座防御站也进入了休眠状态。"
 SRA_RE_Start.64.a:"如果银河系毁灭了，我们也不会有机会哀悼。"
 SRA_RE_Start.65.name:"加密数据包"
 SRA_RE_Start.65.desc:"在记录之外，我们还发现了一个独特的加密数据包。\n有趣的是，它的备注文件包含了许多个问题，并且标明解开问题就能得到数据包的密码。\n其中一个问题如下：\n这里有两颗行星，其中一颗带有多种恶劣特征的死寂星球上有五十亿兽耳娘，另一颗堪称完美的盖亚星球上则有十亿非常美味的海星。\n现在，一艘璀璨星河级星穹之矛正在准备对死寂星球发射「新星终结」，而且有一个不愿透露姓名的议长规定必须对这两个星球中的一个开火。\n而你——\n\n\n\n\n\n可以选择开火模式。\n你是否要为了保留一颗殖民球而舍弃炫酷的爆星动画，将「新星终结」从毁灭模式切换为净化模式？"
 SRA_RE_Start.65.a:"蛤？"
 SRA_RE_Start.65.MESSAGE_SRA_RE_Rocivia:"嗯哼，你会选哪个呢？"
 SRA_RE_Start.66.name:"细节决定成败（确信）"
 SRA_RE_Start.66.desc:"在漫长的冥思苦想，反复尝试之后，我们的科学家已经走到了放弃的边缘——从这些该死的电车难题狡猾变种以及其他各种各样的离谱问题找到一个答案大概是不可能的事情吧。\n就在这时，其中一位研究员发现了文档第一页的一个标着问号的按钮。\n“欢迎浏览帮助文档。”\n其中的第一个问题示例是“数据包的密码是什么？”\n我们难以置信地输入了答案提供的密码。\n然后成功打开了数据包。"
 SRA_RE_Start.66.a:"我星际玩家，看不见这些（恼）"
 SRA_RE_Start.67.name:"《我在群星修飞船》"
 SRA_RE_Start.67.desc:"数据包中包含了大量我们科学家难以理解的文件，星规浏览后，称这些文件是与星穹之矛有关的一系列蓝图和说明，对星穹之矛的修复工作很有帮助。\n考古工作自此告一段落，剩余的残骸被搬运回去以进行深度研究。"
 SRA_RE_Start.67.a:"终于……"

 SRA_RE_Start.68.desc:"“我们是汹涌潮汐，而敌人，只是浮萍。”\n执行官，我怀着激动的心情向您汇报：星穹之矛内部系统的第一次修复工程已经可以开始了。\n首次修复的目标暂定为空间操纵系统，这一系统涉及到一系列复杂的空间调整器，提供空间定位与结构弯曲，虫洞构建等功能。修复完成后，星穹之矛将恢复折越引导和跨星系打击能力。"
 SRA_RE_Start.69.desc:"我需要一些材料以及科学院的计算资源支持，因此您可以在有空闲的时候再开始修复工程。等您准备好了资源，就来联系我下达指令吧。\n嗯？\n最高议长向您发起了通讯，我这就接进来。"
 SRA_RE_Start.70.desc:"啊，执行官，我现在正在科学院。\n\n§Y嘈杂的背景，隐约还能听见“我好兴奋啊！”的声音。§!\n\n开了隐身。\n就是，呃，科学院在研究那堆残骸的时候尤里卡了一下。\n第一篇有关“['concept_SRA_Composite_Crystal_Lattice']技术”的论文已经出来了，现在这帮人跟疯了一样，在这么几天里烧完了全部的科研经费。\n我刚才已经接了四十二个要经费的通讯了。"
 SRA_RE_Start.71.desc:"就是说呢，也不是一定要答应，放置play一会他们就安静了。\n不过这个技术确实是比较有划时代的意义的，我这边建议还是早点把资源拨一点过去。\n当然，如何决策还是交给你。"

 SRA_RE_end_game_chain_project: "§B暴风雨前的宁静§!"
 SRA_RE_end_game_chain_project_DESC: "事情似乎告一段落了，至少，在你完全准备好之前，被尘封的秘密不会找上你。"
 SRA_RE_end_game_chain_project_TOOLTIP: "§Y完全修复星穹之矛§! 或 §Y等待时间进入游戏末期年份§! 以将§B陨落之矛§!§Y事件链§!推进到下一个阶段。"

 SRA_RE_Start.81.desc:"执行官，你看到了吗？\n埋藏在时光之沙下的，被尘封的秘密。\n它正呼唤着你去探寻，去收获。\n因为长夜将至，利剑当铸，我们必须面对过去，才能拥抱未来。"
 SRA_RE_Start.82.desc:"谜语就到此为止了！"
 SRA_RE_Start.83.desc:"诶？"
 SRA_RE_Start.84.desc:"你的观测部门在一次例行检查中在一颗星球上发现了一些舰队残骸，上面所使用的装甲材料是你们闻所未闻的，因此发掘工作已经初步展开。\n星规数据库的比对结果表明这些残骸有极大可能来自古老的科尔先驱舰队，我想你的科学家们已经在抢着向你提出考古申请了。"
 SRA_RE_Start.85.desc:"是向我。"
 SRA_RE_Start.86.desc:"啊，忘记了，你还是领导人来着。\n可能是这些天你在我这摸鱼摸太久了吧，我茶叶都给你喝没一箱了。"
 SRA_RE_Start.87.desc:"没这回事！\n……大概。\n我可是每个月上班整整162000秒的，加上各种会议这个数字还能再翻个两三倍。"
 SRA_RE_Start.88.desc:"你这自豪感是以前攒下来的吗？"
 SRA_RE_Start.89.desc:"嗯哼~\n好了，执行官，去发布考古命令吧。"

 SRA_RE_archaeological_5:"§B阿玛达——白金的大舰队§!"
 SRA_RE_archaeological_Text_5:"第五坐标：山间的沉寂舰队"

 SRA_RE_Start.92.name:"群峦之间"
 SRA_RE_Start.92.desc:"连绵的山峦间笼罩着缥缈的云雾，山巅白雪皑皑，与其间裸露的黑色山岩相称有度。\n然而我们的考古学家们并不是来欣赏风景写两篇文章发到不知道啥杂志上赚几点稿费的。\n当我们踏入山谷之中，一块巨大的断裂甲片便矗立在我们面前，宛如一块路牌，指引着我们踏入这片秘境，这片……墓场。"
 SRA_RE_Start.92.a:"开始吧。"
 SRA_RE_Start.93.name:"巨人骸骨"
 SRA_RE_Start.93.desc:"这颗星球的生态完好性让人惊讶，毕竟这座山谷里的残骸无论是数量还是大小都远远超出了我们的预期。\n巨大的白金色半截星舰斜插在地表上，顶端刺入云间，其上的装甲大量剥落，炮塔基座上爆炸的痕迹仍清晰可辨。\n而这只是冰山一角。\n报告显示，整个山谷中都散落着类似的残骸，其中大部分被埋在地层或山体中，只有少数裸露在外。\n考古队自舰身的裂口上鱼贯而入，已然黯淡的先驱装甲依然保持着超乎想象的强度。"
 SRA_RE_Start.93.a:"增派人员。"
 SRA_RE_Start.94.name:"先驱战舰"
 SRA_RE_Start.94.desc:"基础调查已经告一段落，这些战舰的外形与堕落帝国的战列巡洋舰有些类似，但内在却并非如此。\n就目前主要研究的那半截舰船而言，如果其设计为对称型，那么这些战舰安装了一座——以我们的标准来说——泰坦级主炮、两座战列舰级主炮、十六组大型武器集群，以及一系列投射武器和近防武器。\n值得注意的是，我们并没有在这艘估计高度为十二千米的庞大星舰上找到任何反应堆，全舰的能量回路汇集于数个奇怪的装置，也许它使用了我们所不知道的一种供能技术。\n进一步的调查正在展开，我们的团队正在尝试摸清楚其内部构成并找到存储单元之类的东西以获取更多资料。"
 SRA_RE_Start.94.a:"总不可能是用电池的吧……"
 SRA_RE_Start.95.name:"深入调查"
 SRA_RE_Start.95.desc:"大量的分区扫描结果正在汇总，我们对这艘星舰的了解正在进一步提升。\n扫描和拆解表明，这艘战舰使用了多种多样的武器系统。其主炮，也即我们所说的泰坦级主炮，是一种独特的能量武器，拥有让我们难以理解的充能机构；次级主炮则是相对而言较为常规的类动能武器，其弹药也被找到——一种主要由与这艘战舰的装甲类似的材料构成的实心弹丸，但内部的物质组成似有不同；其余的武器则以能量团和能量束武器为主，还有数个类似导弹的武器被设置在舰体侧后方的小开口处。\n其装甲材料的解析仍在进行中，现有结果表明其拥有一种极为复杂的拓扑结构，但物质组成依然不明。似乎这些装甲在正常运行时会受到额外的充能，其内部蕴藏的能量会强化材料的强度，即便是现在，残存的能量也让这些材料的强度凌驾于几乎所有装甲之上。\n另外，我们在能量回路汇聚处附近找到了数个小隔舱，其中储存着许多发着金色微光的立方体，探测表明其能量级数高到难以置信，也许……"
 SRA_RE_Start.95.a:"真是用电池的？"
 SRA_RE_Start.95.MESSAGE_SRA_RE_Rocivia:"用正常反应堆不就是因为储能能力上不去只能用其他形式等着转换，要是储能能力上去了，一步到位不是更好？"
 SRA_RE_Start.96.name:"科尔先驱"
 SRA_RE_Start.96.desc:"我们对舰船的残存武器、推进系统、超光速引擎等部件做了物理分隔，随后试验性地将一个金色立方体置入了看起来十分对应的那些设施的内部。\n下一瞬间，沉寂了不知多少岁月的舰体内部再度亮起。\n正如仪器表明的那样，源源不断的能量自那个压缩能量块中流出，抵达舰船各处。\n待命多时的破译团队立即在星规的支援下展开对正在重启的处理器的骇入工作。\n嗯，确切的说，在骇入的开始，星规就已经接管了全部的我方计算机组，毕竟我们的技术人员毫不意外的对眼前完全陌生的数据架构束手无策了。\n而当破译工作完成之后，星规突然开始在这艘舰船内漫步，触碰着舱壁，低声说着一些我们所不知道的语言。\n不过，她事先就已经把所有的破译结果上传了。\n这艘舰船属于——\n科尔文明。"
 SRA_RE_Start.96.a:"！"
 SRA_RE_Start.97.name:"遗落的舰队"
 SRA_RE_Start.97.desc:"/星际作战单元贰型284-24601，隶属于科尔文明「大舰队」编号3484，于第三周期368银河年服役，当前巡航时间：「数据损坏」/\n/于「数据损坏」遭遇隶属于「数据损坏」的舰队，设计未记载，与其交战/\n/于「数据损坏」遭遇隶属于「数据损坏」的舰队，设计未记载，与其交战/\n/于「数据损坏」遭遇隶属于「数据损坏」的舰队，设计未记载，与其交战，二号次级主炮被击穿，处理器损损损损「错误」「错误」/\n/「错误」「错误」————启动备用机组，自检程序启动「警告：能源不足」——/\n/————「数据丢失」————/\n/自检程序重启/\n/第407723次自检开始/\n/当前能量：0.0032%/\n/舰体完整度：13%；护盾系统「错误：对象不存在」/\n/当前任务：保护「静谧钟塔」——「错误」/\n/自检程序重启/\n/自检程序重启/\n/自检程序重启/\n/第410147次自检开始/\n/————/\n/自检程序中止/\n/「错误」当前执行的指令「错误」「错误」此覆盖「错误」完整性&#%%#&??「错误」————/\n/「能源不足」/\n在这些记录下面，星规留了几行备注：\n「科尔文明，又称科尔先驱，于943年发现于银心星域。\n标签：先驱者、停滞文明、高度先进、人口稀少、人工智能为主、人工智能受限、银河卫士\n科尔自动舰队，即「大舰队」，与大多数科尔先驱造物一样完全由人工智能控制，主要负责对抗——\n我的数据库中缺失了后续内容，与以往的情况不同，这是唯一一个令我感到“不安”的缺失。\n而且，这个银河中不存在科尔先驱，这支舰队也不应该存在。\n我感觉我需要在这里再找一遍，用我自己的方法。」"
 SRA_RE_Start.97.a:"科尔先驱的宿敌……"
 SRA_RE_Start.98.name:"铸造芯片"
 SRA_RE_Start.98.desc:"事实上，不是仅仅把这艘船里面翻一遍，而是把整个山谷翻一遍。\n散落在地表的、插在山体里的、深埋在地层中的，全部的残骸被挨个找出，然后便是细致入微的检查，整理，分析。\n这样浩大的工作花费了相当长的时间，但回报是值得的。\n通过汇总所有存储单元的记录，我们拼凑出了更多的信息。\n这支舰队并非普通的舰队，至少在它们被击毁时不是。\n它们肩负着一个重要的任务。\n出于某种我们不知道的原因，科尔先驱没有使用任何“全能”型的人工智能。每一个科尔先驱的人工智能在被制造时就被设定好了职责和思维模式，甚至是能力范围：战舰的AI只会战斗，船坞的AI只会造船，指挥的AI也只能做到指挥而做不到任何实际操作。\n而这支舰队，则正运载着一个船坞AI，或者说它的数据芯片。\n借助战舰AI的缓存数据，我们成功找到了携带芯片的战舰——的残骸。\n所幸，芯片并未受损，我们把每一块碎片拆解搜索，终于找到了被隐藏起来的芯片。\n对芯片的解密工作有待将其运回后再进行，我们也联系了一批运输船，将所有的科尔先驱舰队残骸带回，等待进一步研究或是拆解。\n另外，星规报告称有可能根据碎片数据恢复这支舰队的目的地的坐标，相关工作正在进行中。\n就所见到的科尔先驱造物的科技水平来看，对其的进一步研究将会给我们带来巨大的收获。"
 SRA_RE_Start.98.a:"收队。"

 SRA_RE_Start.99.desc:"……\n呼……执行官。"
 SRA_RE_Start.100.desc:"「科尔文明是一个极度先进的古老文明，掌握着远远凌驾于银河系其他智慧生命之上的技术。他们能近乎无中生有，轻易颠倒物理规则，任意转换质能，在星系尺度上干涉空间结构。」\n……这是我的数据库中的记录。\n您知道吗，他们曾经创造过一道横贯整个银河的超光速屏障，配合他们的舰队，把银河系一分为二上万年之久。\n他们比这个银河的堕落帝国最鼎盛的时期还要强大无数倍，他们没有向银心之外扩张，没有成为一个跨星系文明只是因为他们不想，他们不需要。\n我不怀疑他们有能力把舰队送到别的宇宙，但是，为什么？"
 SRA_RE_Start.101.desc:"一支运载着铸造芯片的舰队代表着什么？\n先前的船坞运作了多久？有几个这样的船坞？当初抵达的有多少舰队？它们又在这里建造了多少？\n堕落帝国不知道，策展人不知道，先驱者们不知道。\n我们只能从先前的记录推断，这只舰队曾经庞大到了能与星规阵列的远征舰队打上数十年的地步，让“遮天蔽日”这个词显得苍白无力了的地步。\n建造了那样庞大的舰队，它们原本在做什么？星规阵列的舰队最后离开，又是因为看到了什么？"
 SRA_RE_Start.102.desc:"还有……"
 SRA_RE_Start.103.desc:"科尔先驱的铸造芯片里……为什么会有这些？\n\n§Y她摊开手，手心里赫然躺着三枚”碎片”。\n金色流转，紫色闪烁，漆黑的碎片则如浓雾翻腾。§!\n\n是谁留下了这些碎片，而目的又是什么？"
 SRA_RE_Start.104.desc:"执行官……\n如果真的有人在暗中谋划着这一切……\n千万，千万小心。"
 SRA_RE_Start.105.name:"C.O.R.E.铸造芯片"
 SRA_RE_Start.105.desc:"我们完成了对芯片的解密工作，收获颇丰。\n尽管我们无法复制科尔先驱原本使用的船坞，但幸运的是，星穹枢纽的船坞区段出乎意料的兼容科尔先驱的建造模式。只要将芯片接入星穹枢纽之中，我们就能让星穹枢纽从制造材料开始将建造过程一手包办。\n很快，我们就能建造归属我们指挥的科尔先驱战舰了。\n§Y在星穹枢纽宜居段处的决议面板建造科尔先驱战舰§!"
 SRA_RE_Start.105.a:"非常好。"
 SRA_RE_Start.105.MESSAGE_SRA_RE_Rocivia:"记住了，§Y在星穹枢纽宜居段处的决议面板建造科尔先驱战舰§!哦，可别怪我没提醒你。\n\n向上兼容这习惯挺好，我还以为星规把科尔的技术吃透后就扔掉了呢。"

 SRA_RE_Core_relic:0 "C.O.R.E.铸造芯片"
 SRA_RE_Core_relic_desc:0 "这枚曾属于科尔先驱文明的数据芯片中储存着与科尔先驱庞大自动巡航舰队有关的一系列建造程序，能够指导我们从无到有地建造那些强大的战舰。"

 #90天后
 SRA_RE_Start.106.desc:"执行官，对科尔先驱舰队的目的地的定位已经完成了。我们观测到目标位置有一些科尔先驱的防御舰队存在，考虑到它们目前的状况，您可能需要首先派遣足够的舰队去击败它们，然后才能开始考古工作。"
 SRA_RE_Start.107.desc:"另外，有关之前的意识碎片。\n您可以做出抉择了。"
 SRA_RE_Start.107.a:"吸收一个碎片"
 SRA_RE_Start.107.b:"还是先等等吧"

 SRA_RE_Start.108.desc:"明白了。如果您想要改变想法，您可以找我“下达指令”。"
 SRA_RE_Start.108.a:"嗯"

#第六个坟头
 planet_SRA_RE_Core_1:0 "先驱叁型衰退反应堆"
 planet_SRA_RE_Core_1_desc:0 "科尔先驱的伟大技术。衰退反应堆将普通物质转化为奇物质并释放出大量能量。这些反应堆曾为整个星球供能。"
 planet_SRA_RE_Core_2:0 "科尔先驱星球塑造"
 planet_SRA_RE_Core_2_desc:0 "每一处建筑都是极效的表达，每一个角落都是设计的结晶。"

 
 SRA_RE_archaeological_6:"§B宇宙恶疾§!"
 SRA_RE_archaeological_Text_6:"第六坐标：遗落的灾难之匣"

 SRA_RE_Start.120.name:"辉煌残响"
 SRA_RE_Start.120.desc:"庞大的、高耸入云的、蕴含着冰冷的高效美学的、数之不尽的建筑物，覆盖了整个星球的表面。\n它们被理性与秩序所规划，紧密相连、处处相接。其结构巧妙而精确，钩心斗角、鳞次栉比。\n科尔先驱的自动舰队以其人工智能的至高逻辑设计并建造了这座城市，重塑了这颗星球，将其化为一体，如齿轮般紧紧咬合，贯彻着对纯粹实用主义的永恒追求。\n即便被久远到残酷的时光无情销蚀，它依然是一件工程学的伟大杰作，唯物主义的辉煌艺术品。"
 SRA_RE_Start.120.a:"这就是……科尔先驱。"
 SRA_RE_Start.120.MESSAGE_SRA_RE_Rocivia:"怎么说呢，这种情况其实挺奇怪的，科尔的人工智能职责和能力是被严格分割的，战争舰队做这种城市建设理论上是不可能的事情，也许有其他的工程队伍和舰队一同出现在这里。"
 SRA_RE_Start.121.name:"踏寻往昔"
 SRA_RE_Start.121.desc:"我们的调查队于一处残损的接驳口处着陆，开始对整个星球进行初步调查。\n尽管多数设施已经老化失效，但还有数量可观的机械正在运作，调查队遭遇了许多仍在运行的守卫，其强大的火力造成了不小的伤亡。\n在增派了数批支援队后，我们肃清出了一块区域，并发现了一处可用的数据接口。\n结合之前的经验和星规的帮助，调查队认为我们有能力从中获取我们需要的信息。"
 SRA_RE_Start.121.a:"很好。"
 SRA_RE_Start.122.name:"埋葬"
 SRA_RE_Start.122.desc:"破译工作进展顺利。我们小心翼翼地在这些设施的控制系统中寻找我们需要的情报，努力避免我们的渗透行为被发现。\n这些古老的智能系统高度发达，即便在如此长久的维护缺失下依然十分强大，换做其他文明，恐怕都无法突破它们的严防死守。\n好在我们有一位专业人士能提供强有力的支持。\n很快，我们就取得了第一份资料。\n数据表明，这颗星球被塑造成为一个巨大的囚牢，用于将某件事物永远埋葬。"
 SRA_RE_Start.122.a:"继续。"
 SRA_RE_Start.123.name:"疫心恶殖"
 SRA_RE_Start.123.desc:"星球外层是复杂而完备——尽管如今已经停止运行——的防御系统，用于隔绝一应外界干扰。\n在这之下则是无数游荡的战争机器，用于清扫可能的漏网之鱼。\n随后，厚重的装甲层和时刻运转的护盾系统能够抵抗强大的贯穿型攻击，以免其下的反应堆阵列受到哪怕一丝一毫的损伤。\n在这样的严防死守之下，一套高度先进的静滞场被维系，用以永久冻结位于星球内核的危险结构，将其从整个宇宙中隔离开来。\n简略的描述形容这一结构“拥有将整个银河系的智慧生命抹去”的极高威胁，由一种特殊的微生物及其控制的机械和生物结构组成，任何破坏其结构稳定的行为都会导致星系级别的生物灾难。\n也许我们应该迅速离开这里以防意外发生？"
 SRA_RE_Start.123.a:"就此离开反而更危险，我们必须获取更多信息。"
 SRA_RE_Start.124.name:"噬魂演进"
 SRA_RE_Start.124.desc:"此处的存储单元没有包含更多信息，也许这里本就不是为了存储信息而存在。这颗星球的塑造者只需要这里被永远封闭。\n但我们需要更多资料，即便这里的封锁措施只有亿分之一的可能失效。\n坐以待毙不可容忍。\n更多的增援抵达，开始对整颗星球进行搜索。我们尽可能地避免了对设施的破坏行为，但与剩余的防御机械的交火难免会造成一些影响，希望这不会带来难以承受的后果。\n资料汇总表明，这座监牢中封锁着一种聚合微生物智能，被称作「灾疫」。\n这种特殊的微生物能聚集在一起形成宏观结构，进而表现出类似蜂巢意识的智能。\n它们会吞噬能吞噬的一切，并且能够模仿那些东西；它们还能吸收电子数据乃至生物记忆，并且加以应用。\n这种生物在长久的战争状态下已经掌握了大量先进的科技，放任微乎其微的「灾疫」发展，都会迅速产生一支能威胁整个星系的庞大军事力量。"
 SRA_RE_Start.124.a:"令人不寒而栗。"
 SRA_RE_Start.125.name:"渗入骨髓"
 SRA_RE_Start.125.desc:"「灾疫」表现出超乎想象的生存能力：它们可以通过其他物质、光照或者热源获取能量，同时也能较低限度的吸收背景辐射；「灾疫」的个体至少可以在近0K到2000K的温度下保持活性，在极端高压与大剂量伽马射线下存活。\n它就像一种宇宙病毒：一旦被带入新的恒星系，「灾疫」就会主动散布在尘埃云和小行星带中并依靠其中的物质大量复制自身，被带到行星表面上的个体则会在尽可能隐藏自身的同时向地下行进，在深层繁殖。仅仅是少量「灾疫」就能迅速“感染”整个恒星系，渗透进各种天体乃至固态行星的地幔，而且即便是引爆恒星也无法根除这些依靠宇宙尘埃就能繁殖的生物。\n「灾疫」能够吸收与利用几乎所有常规元素——通过操纵核子与电子的方式。\n它们也可以通过使用吸收到的技术操纵其它它们不能直接操纵的物质，例如奇物质，暗物质，快子这一类的非常规元素。不过，值得庆幸的是，这需要它们首先模拟出用于操控这些物质的装置。\n这也是「灾疫」为何仍然需要据点的原因——它们所使用的技术没有小型化，而它们自己又由于没有明确科研体系而无法独自发展技术。\n「灾疫」所能直接制造的活体战舰由于材料的局限性而在性能上难以提升，而模仿其他文明建造战舰的产能又没有那么高，因此「灾疫」的主要威胁还是在其传播能力上。\n但即便如此，这样的存在也是银河系难以承受的天灾。"
 SRA_RE_Start.125.a:"那么，明明都能把「灾疫」锁在这里，为什么不根除它们？"
 SRA_RE_Start.126.name:"埃列什基伽勒之手"
 SRA_RE_Start.126.desc:"进一步的调查揭露了某些被隐藏的历史。\n根据对舰队日志的分析，这颗星球原本被标注为“被「灾疫」彻底控制的星球”，在科尔舰队对灾疫的清扫几近尾声时，舰队才开始了对这座要塞的进攻。\n然而，当科尔舰队开始系统性毁灭这颗星球时，却遭遇了一个两难的选择。\n这个巨大的「灾疫」实体在自己的体内构建了一座独特的跃迁设施。记录显示，它被维持在一个特殊的高能级状态，一旦有攻击突破防壁，破坏了它的稳定，整个结构就会被失控能量“弹射”出去——以碎片形式随机被撒在银河中。\n这是一个赤裸裸的威胁：一旦它受到攻击，灾疫就会再一次在全银河的范围内蔓延开来，科尔舰队的努力将全部白费。\n超光速壁和空间风暴都做不到完全阻止“弹射”，因此科尔舰队只得使用静滞场将其永久封闭，并在这里建设起了庞大的供能与维护设施，在漫长到难以言喻的时间中隔离起这里，直到时间的尽头。\n这一情况已经超出了我们的处理能力，科考队强烈建议在造成更多不稳定因素前离开并封锁这个星球。"
 SRA_RE_Start.126.a:"取消那个命令，我们得试着修复这些设施，这样才能避免意外发生。"
 SRA_RE_Start.126.MESSAGE_SRA_RE_Rocivia:"灾疫为什么不直接弹射自己呢，明明这个选项百利而无一害……还是说，它也不确定是否能做到？"

 SRA_RE_Start_SP10:0 "修复静谧钟塔"
 SRA_RE_Start_SP10_DESC:0 "我们得试着修复这些设施，至少把表层防御设施修补好。"
 SRA_RE_Start.127.name:"修复完成"
 SRA_RE_Start.127.desc:"对静谧钟塔的修复宣告成功，想来「灾疫」不会再有逃离的可能了。"
 SRA_RE_Start.127.a:"接下来还是不要殖民这颗星球比较好。"


 SRA_RE_Start.200.name:"科尔先驱守望者"
 SRA_RE_Start.200.desc:"收到通讯请求，正在调用回应……\n\n§Y<你正在与科尔对话。>\n\n<通知：规划区域C-0076，通称“静谧钟塔”，正处于完全管制中，任何实体的访问都将被视为对科尔的直接宣战，请与此恒星系保持安全距离以避免不必要的损失。>§!"


 SRA_RE_Start.200.a:"科尔？"
 SRA_RE_Start.200.a.response:"收到询问请求，正在计算回应……计算完毕。\n\n§Y<回应：科尔文明为星系之监护者，文明之守护者，力求保障尔等之演化与发展，创造此自动舰队以遏制外界威胁。>§!"
 SRA_RE_Start.200.b:"为什么要封锁这里？"
 SRA_RE_Start.200.b.response:"收到询问请求，正在计算回应……计算完毕。\n\n§Y<回应：规划区域C-0076为星系生物威胁「灾疫」的星系投送设施，已被维系在稳定静滞状态，此状态必须永久维持。>\n\n<补充：「灾疫」为拥有先进技术能力庞大微生物集群，其扩散与增殖高度隐秘而危险，此星系不具备任何处理能力。>§!"
 SRA_RE_Start.200.c:"既然这样为什么不彻底摧毁它们？"
 SRA_RE_Start.200.c.response:"收到询问请求，正在计算回应……计算完毕。\n\n§Y<回应：规划区域C-0076中存在「灾疫」投送设施，已处于完全充能状态，其运行将立即散播「灾疫」分散至整个星系，现阶段除时间静滞外无妥善处置方案。>§!"
 SRA_RE_Start.200.d:"我们才不会听你指手画脚。"
 SRA_RE_Start.200.d.response:"收到通讯，正在计算回应……计算完毕。\n\n§Y<回应：哦。>§!"
 SRA_RE_Start.200.e:"无魂之邪物。"
 SRA_RE_Start.200.e.response:"收到通讯，正在计算回应……计算完毕。\n\n§Y<回应：真可悲。>§!"
 #科尔Core 克尔Kuur
 SRA_RE_Start.200.x:"科尔？你们和克尔先驱有什么关系？"
 SRA_RE_Start.200.x.response:"收到询问请求，正在计算回应……「克尔」相关信息获取中……计算完毕。\n\n§Y<整理记录：克尔，已消亡文明，大型集体机器意识「赛博勒克斯」的创造者，相关信息归档完毕。>\n\n<回应：科尔与克尔无关。>§!"
 SRA_RE_Start.200.z:"结束通讯"
