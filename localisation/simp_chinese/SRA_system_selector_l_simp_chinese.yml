 SRA_system_selector.2.SRA_T4_weapon_planet_killer.desc:0 "星穹之矛的跨星系打击系统已经锁定了候选目标，我们需要从它们中选出我们真正需要攻击的目标恒星系。\n\n由于我们无法让§B「新星终结」§!的调谐系统在短时间内引导更多的能量，因此我们一次能够攻击的目标数量有限，当前我们最多同时攻击§Y5§!个目标。\n\n§Y攻击将预计在十天后到达§!"

