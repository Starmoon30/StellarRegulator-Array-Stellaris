 SRA_system_selector.1.SRA_T4_weapon_planet_killer.desc:0 "为了使用§B「新星终结」§!远程攻击位于其他恒星系内的目标，我们需要在星穹之矛的跨星系打击系统中设定目标星系的坐标。\n\n使用星系选择器允许我们通过向星穹之矛的跨星系打击系统提供目标恒星系的特征来大致确定候选的目标，然后再从这些候选目标中找到我们真正需要攻击的目标恒星系。\n\n使用右边的按钮可以选定目标恒星系的一些特征，将鼠标移动到部分按钮上可以显示相关描述。"

