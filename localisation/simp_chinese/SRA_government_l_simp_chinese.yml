 civic_SRARociviaEmpire:0 "§B路希维亚帝国§!"
 civic_SRARociviaEmpire_desc:0 "§Y本国策效果为“路希维亚帝国”剧情模式，不包含['civic:civic_SRAtechnology']的绝大部分内容。§!\n\n相较于与某个闲来无事的机械智能签订协议的那些坐享其成的文明，被路希维亚本人选中则是一种“命运的恩宠”——苦难将孜孜不倦的奔袭而来，只为见证奋力抗争的历史，以及终将抵达的末路。\n\n§RBeta测试中，欢迎游玩和反馈§!"
 civic_SRARociviaEmpire_effects:0 "-通过开局选项解锁§Y不同故事线§!\n-按流程阶段性解锁§B星辉水晶§!相关技术"
 civic_SRARociviaEmpire_negative_effects:0 "-§R还能有什么坏处呢？§!"


 civic_SRARociviaEmpire_0_desc:0 "§Y本国策效果为“路希维亚帝国”剧情模式，不包含['civic:civic_SRAtechnology']的绝大部分内容。§!\n\n相较于与某个闲来无事的机械智能签订协议的那些坐享其成的文明，被路希维亚本人选中则是一种“命运的恩宠”——苦难将孜孜不倦的奔袭而来，只为见证奋力抗争的历史，以及终将抵达的末路。\n\n§RBeta测试中，欢迎游玩和反馈§!"
 civic_SRARociviaEmpire_0_effects:0 "-通过开局选项解锁§Y不同故事线§!\n-按流程阶段性解锁§B星辉水晶§!相关技术"

 civic_SRARociviaEmpire_a_desc:0 "这个文明曾半步踏入群星之间，却又为同族相残的战乱所困，往昔的盛世毁于一旦。\n所幸，一支势力在一座古老的遗迹中找到了一条可以免于灭亡的道路。\n来自异界的存在降临于这片大地上，终结了一切纷争，让这个文明得以再度着眼于群星。\n如今，这个文明突破了光速的壁垒，进升为星海间的一员。\n然而，没有人知道，这条本不存在的道路，究竟会通往何方。"
 civic_SRARociviaEmpire_a_effects:0 "-与§B路希维亚§!、§R希德拉§!、§B星规§!建立通讯\n-§B路希维亚§!将成为领导人\n-解锁['concept_SRA_Stellarcrystal_industry']\n-母星上有一艘坠毁的星穹之矛等待发掘\n-历史的尘埃飘落在星海间""
 civic_SRARociviaEmpire_b_desc:0 "这一文明从上古时代就战栗于一双龙翼的阴影之下，奉上一切来换取苟延残喘。\n也许是一时兴起，我们被允许航向无尽银河来敛取更多，如果我们可以将星辰的力量凝于指尖，能撕破那片阴影吗？"
 civic_SRARociviaEmpire_b_effects:0 "-母星变为 §R树海残枝§! ，一个有着无尽潜能的特殊天体类型\n-母星的恒星基地将被替换为  §R不可更改§! 且 §R没有船坞§! 的特殊星基\n-狞桀恣睢的 §R失落之龙§! 将笼罩在你的文明之上，从古至今，只有屈从才能免于毁灭\n-失落之龙索取§R任何形式的财富§!，特别是最珍贵的那些……§R无论是生灵还是死物§!\n-彻底臣服于龙影之下，或是以剑刃呼唤自由"

#  civic_SRARociviaEmpire_desc:0 "§Y本国策效果为“路希维亚帝国”起源，该起源为剧情模式，不包含「星规技术」的绝大部分内容。§!\n《路希维亚帝国：域外异闻》\n这个文明曾半步踏入群星之间，却又为同族相残的战乱所困，往昔的盛世毁于一旦。\n所幸，一支势力在一座古老的遗迹中找到了一条可以免于灭亡的道路。\n来自异界的存在降临于这片大地上，终结了一切纷争，让这个文明得以再度着眼于群星。\n如今，这个文明突破了光速的壁垒，进升为星海间的一员。\n然而，没有人知道，这条本不存在的道路，究竟会通往何方。\n§B不建议使用会经常更换领导人的政体，那样会很不方便，你知道的。§!\n§RBeta测试中，欢迎游玩和反馈§!"
