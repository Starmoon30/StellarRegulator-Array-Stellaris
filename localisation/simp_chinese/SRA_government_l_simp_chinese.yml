 civic_SRAtechnology:0 "§B星规技术§!"
 civic_SRAtechnology_desc:0 "「作为协议内容，星规阵列将为我们提供合约范围内的星辉水晶技术，这些科技虽然十分古老，但依然极度先进。」\n\n§B你知道你在做什么，对吧。§!"
