 SRA_Chief_species:0 "星辉机械"

 faction_SRA_Chief_sub_title:0 "§Y耀红黑星§!\n一个操控着庞大机械帝国的神秘智能实体，司掌着超乎想象的危险力量。" 


 SRA_Chief_Buff_0:0 "寰宇威能"
 SRA_Chief_Buff_0_desc:0 "§R无声蔓延着的猩红能量，低语着归一的末路。§!"

 SRA_Chief.8.desc.a:0 "……？\n奇怪，怎么会有超空间航道自然形成。我原本预计在这个纪元内不会与银河系接触，这下……\n等等，你是……"
 SRA_Chief.8.desc.b:0 "……？\n奇怪，怎么会有超空间航道自然形成。我原本预计在这个纪元内不会与银河系接触，不过既然如此……\n好吧，银河系的文明们——\n我们对你们不感兴趣，请保持距离，否则，我不能保证你们的安全。"
 SRA_Chief.8.a:0 "……"


 SRA_Chief.9.desc:0 "……算了，无论你们到底是怎么回事，总之，不要靠近这里。"
 SRA_Chief.9.a:0 "奇怪的家伙……"
 SRA_Chief.10.desc:0 "安全评估结束了。\n你好。\n你可以称我为“首席”。"
 SRA_Chief.10.a:0 "你到底是什么人？还有那些舰船……"
 SRA_Chief.11.desc:0 "如你所见，我们是一直以来隐居在银河的这个角落的文明。先前那场意料之外的超空间扰动影响了我们的匿踪系统，使得你们能够观测到我们。\n事已至此，我们需要采取一些措施来保证我们的安全了。"
 SRA_Chief.12.desc:0 "在综合考量了银河系现有的文明之后，我们认为你们是一个较好的安全合作对象。\n如果你有意向用资源做交换，我们可以给你们提供一些技术产品，让你们在与别国的竞争中取得优势。"
 SRA_Chief.13.desc:0 "考虑好了的话，你可以在通讯列表里联系我。另外，不必尝试仿制我们的技术，那是徒劳无功的。"

 SRA_Chief.14.desc:0 "执行官，想必你一定对那个“首席”所拥有的技术感到十分惊讶吧。可惜，我不能给你提供多少信息，我只能告诉你，那些东西并不是你所了解的样子。换句话说，不要对这些被修改过的东西太过信任。"
 SRA_Chief.14.a:0 "嗯。"
 SRA_Chief.15.desc:0 "执行官，我仔细比对了一下那个“首席”所拥有的那些技术……没错，它们几乎就是星规阵列的设计。但是，我却不能连接上那些造物，恐怕那些是被专门修改过的版本。如果您决定从“首席”那里获取那些东西的话，最好还是小心一点。"
 SRA_Chief.15.a:0 "嗯。"

 SRA_Chief_talk_return3:0 "让我再想想。" 
 SRA_Chief_talk_return4:0 "我们聊点别的吧。" 
 SRA_Chief_talk_exit1:0 "结束通讯。"

 SRA_Chief:0 "“首席”"

 SRA_Chief.100.desc.a:0 "我们对你们不感兴趣。"
 SRA_Chief.100.desc.b:0 "（对方没有回应）"
 SRA_Chief.100.desc.c:0 "……你好。"
 SRA_Chief.100.desc.d:0 "有什么事吗？"
 SRA_Chief.100.desc.e:0 "嗯？你好啊，今天你需要些什么呢。"
 SRA_Chief.100.desc.f:0 "稍等，我正在浏览你们的观测记录……好了，有什么事吗？"


 SRA_Chief.100.a:0 "我们想要与你合作"
 SRA_Chief.100.b:0 "我们不想再与你合作了"
 SRA_Chief.100.c:0 "闲聊"
 SRA_Chief.100.d:0 "交易建筑核心"
 SRA_Chief.100.e:0 "交易舰队"
 SRA_Chief.100.f:0 "你又弱又可怜，我们会摧毁你。"
 SRA_Chief.100.f.tooltip:0 "我们很清楚，那些故作玄虚的蓝光舰队只是一堆毫无价值的废铁，没有什么文明的技术比我们的更好，所谓天机工程只是一堆傻子才会相信的废话。我们无所不能，我们能轻而易举地摧毁那些破烂，夺走它们的数据库，将它们的世界占为己有，是的，我们应该这么做，让我们开始吧！Yeeart！！！"
 SRA_Chief.100.f2:0 "你又弱又可怜，我们会摧毁你。"
 SRA_Chief.100.f.tooltip2:0 "我们很清楚，那些故作玄虚的蓝光舰队只是一堆毫无价值的废铁，没有什么文明的技术比我们的更好，所谓天机工程只是一堆傻子才会相信的废话。我们无所不能，我们能轻而易举地摧毁那些破烂，夺走它们的数据库，将它们的世界占为己有，是的，我们应该这么做，让我们开始吧！Yeeart！！！\n\n§R我们还不知道银河系中隐藏着什么危机，贸然宣战的风险很大。§!"


 SRA_Chief.198.desc:0 "啥？好吧，你可能比我想象中的更蠢……或者更敏锐？\n\n§R那就让我们开始吧。§!"
 SRA_Chief.198.a:0 "你在说什么？"

 SRA_Chief_trade_cost_buff:0 "“首席”条约收取资源"
 SRA_Chief_trade_cost_too_high:0 "当前条约收取的资源比例已过高"
 SRA_Chief_trade_cool_down:0 "交易准备中"
 #合作开始/结束
 SRA_Chief.101.a.desc:0 "嗯，作为合作的基础，我们每个月会收取你帝国总产出的10%，而你可以从我们这里获取一次性的建筑核心，以及按编制提供的舰队。需要注意的是，你的后续交易会增加我们每月收取帝国产出的百分比。那么，你确定要与我们合作吗？"
 SRA_Chief.101.b.desc:0 "你真的要撕毁条约吗？我希望你好好想想，不要做让自己后悔的决定。"
 SRA_Chief.101.a:0 "是的，我们决定与你合作"
 SRA_Chief.101.b:0 "是的，我们要取消合作"

 SRA_Chief.102.a.desc:0 "嗯，那么条约签订，你现在可以开始与我们进行交易了。"
 SRA_Chief.102.b.desc:0 "……很好，很好。\n\n§R也是时候了……§!"

 #交易建筑核心
 SRA_Chief.103.desc.a:0 "你可以与我们交易这些特殊的建筑核心，它们能够展开来成为拥有极高生产力的自动建筑，但要注意，拆除建筑是回收不了核心的。\n每交易一个建筑使每月帝国产出收取比例增加1%，每次交易后需要等待360天才能再次交易。"
 SRA_Chief.103.a:0 "获取一个数据库终端的建筑核心"
 SRA_Chief.103.a.desc:0 "与某个数据库连接的存储终端，无数个纪元的记录触手可及。"
 SRA_Chief.103.b:0 "获取一个复合构建中心的建筑核心"
 SRA_Chief.103.b.desc:0 "极为先进的构建中心，能近乎无中生有地制造出各种各样的材料与产品。"
 SRA_Chief.103.c:0 "获取一个地面船厂的建筑核心"
 SRA_Chief.103.c.desc:0 "先进的地面军工厂，能够大幅度提升舰船的建造效率，同时协助星球的生产工作。"
 SRA_Chief.103.d:0 "获取一个控制中枢的建筑核心"
 SRA_Chief.103.d.desc:0 "先进自动化设施，能直接解决所在区划的劳动力需求，并且在星球范围内强化所有自动化劳动力。"

 #交易舰队
 SRA_Chief.104.desc.a:0 "我可以给你提供一些特殊的舰队，编制可以参考我们使用的舰队，相信它们对你来说是极大的助力。但要注意，它们的编制是不可修改的，而且，你得自己承担高额的维护费。\n每交易一支舰队使每月帝国产出收取比例增加5%，每次交易后需要等待360天才能再次交易。"
 SRA_Chief.104.a:0 "获取一支“星辉”舰队"

 #闲聊
 SRA_Chief.3011.a.desc:0 "如果没什么事情的话，我还有其他事情要处理。"
 SRA_Chief.3011.b.desc:0 "你应当多想想接下来做什么，而不是找一个政治上的合作对象聊天，不是吗？"
 SRA_Chief.3011.c.desc:0 "小心点用我的船，要是损失了，我可不会给你补。\n而且每个月的合金还得照付~"
 SRA_Chief.3011.d.desc:0 "你似乎对我们使用的技术感到很惊讶，呵，我知道原因，但我不会告诉你答案。"
 SRA_Chief.3011.e.desc:0 "呵，对我这么好奇，不如多交易交易，展现一下你的诚意。"

 SRA_Chief.3012.a.desc:0 ""
 SRA_Chief.3013.a.desc:0 ""
 SRA_Chief.3014.a.desc:0 ""



 SRA_Chief.3015.a.desc:0 "“执行官”，别人这么称呼你对吧……我在想，是否有人能真正支配自己的命运……"
 SRA_Chief.3015.b.desc:0 "这片银河隐藏着许多令人不安的东西，让我不得不慎之又慎地安排计划。你，又是否做好了面对任何事情的准备呢？"
 SRA_Chief.3015.c.desc:0 "好奇我的翅膀？呵，你还真是毫不掩饰自己的好奇心……也许，以后你会有了解这些的机会。"
 SRA_Chief.3015.d.desc:0 "我觉得你需要多从我这里获取点东西，以便建设一个更加和平的星系。你懂的，弱小的军备引发战争，强大的军备阻止战争。\n打折？嗯~钱还是得按合同上来。"
 SRA_Chief.3015.e.desc:0 "要紧紧握住手中的武器，才能守护住自己的一切，我相信你是明白这个道理的，所以……嗯哼~"





 #灾疫后，事件开始
 #低关系
 SRA_Chief.200.desc:0 "漫长的谋划，漫长的等待，就是为了这一天……终于，我要亲手夺回我该拥有的一切。"
 SRA_Chief.200.a:0 "你在说什么？"
 SRA_Chief.202.desc:0 "执行官！我们从“首席”那里获取的东西，全都失控了！\n那些舰队不再接受我们的指挥，开始各自行动了。更危险的是，来自“首席”的那些建筑中涌出了大量高度先进的陆军，对我们的殖民地展开了进攻。"
 SRA_Chief.202.a:0 "怎么会这样……"
 SRA_Chief.202.b:0 "该死的！"
 SRA_Chief.203.desc:0 "我收到的情报显示，一系列诡异的空间干扰系统被部署在我们周围，导致§R星穹之矛的跨星系打击无法校准目标§!，此外，§R一套神秘的空间阻隔系统阻止了我们进入首席的恒星系§!。\n§R我们需要暂且守住阵线，等待后续的进展。§!"
 SRA_Chief.203.a:0 "可恶！"
 SRA_SOGZ_menu_sub_6_1_chief:0 "诡异的空间干扰系统阻止了§B新星终结§!校准目标"

 SRA_Chief.211.desc:0 "也许你手足无措，也许你早有准备，无论如何，你会给出自己的方法。\n一切都正按照计划进行，时间尚早。"
 SRA_Chief.212.desc:0 "嗯，也许我应该派出更多的舰队。\n§R希德拉§!没有做出反应吗？她没有行使她所在岗位的职责，也没有展现她真正的力量，对吗？"
 SRA_Chief.213.desc:0 "§B路希维亚§!说了什么？还是什么都没有说？她总是一副尽在掌握的样子，想必这次她实际上也只是无动于衷。\n唉，我也许早就习惯了。"
 SRA_Chief.214.desc:0 "执行官，很抱歉现在才联系您，最近的突发事件太多了，不过您能处理好这些的，对吧。\n情报显示“首席”正在调动全部的工业能力生产舰队，她的援军在可预见的范围内都是无穷无尽的，正面击败她的可能性很低，我正在寻找别的办法。"
 SRA_Chief.215.desc:0 "你的表现仍在误差范围之内，但有些事情确实令人惊讶。我上一次看见星规阵列这副样子的时候，我还残余着一点对未来的憧憬。"
 SRA_Chief.216.desc:0 "你，一个特异点，很可能是本不属于这个宇宙的存在。\n你对这片银河和它的历史而言，只是外来之人，就和我一样。\n我需要调整一下我的计划了。"


 SRA_Chief.217.desc:0 "执行官，在经过了长期工作后，我们对“首席”的通讯网络有了一定程度的认识。这套网络是一套集中式的遥控系统，由一个核心控制所有单位的行动。虽然其信息传递的加密手段非常先进，但并非是完全不可破解的。我们准备发起一个项目，如果顺利的话，我们可以短暂伪装成控制端发布指令，并借助那些单位的星辉水晶结构来重构一套归由我们指挥的控制系统。"
 SRA_Chief.217.a:0 "尽可能的投入资源。"


 SRA_RE_Chief_Crisis_situation_1:0 "对“首席”电子战项目"
 SRA_RE_Chief_Crisis_situation_1_type:0 "对“首席”电子战项目"
 SRA_RE_Chief_Crisis_situation_1_desc:0 "这是对“首席”集中式遥控网络的入侵进程，按照预期，我们可以靠这个项目一劳永逸的结束这场战争。"
 SRA_RE_Chief_Crisis_situation_1_monthly_change_tooltip:0 "项目进度稳定增长"

 SRA_RE_Chief_Crisis_situation_1_progress_complete:0 "电子战项目完成，夺取“首席”单位的控制权"
 SRA_RE_Chief_Crisis_situation_1_fail:0 "项目结束"
 sra_re_chief_crisis_situation_1_stage_1:0 "入侵进程"
 sra_re_chief_crisis_situation_1_stage_1_effects:0 "这是对“首席”集中式遥控网络的入侵进程，按照预期，我们可以靠这个项目一劳永逸的结束这场战争。"
 SRA_RE_Chief_Crisis_situation_1_charge:0 "项目进行中"
 SRA_RE_Chief_Crisis_situation_1_charge_effect:0 "电子战项目持续进行中。"
 SRA_RE_Chief_Crisis_situation_1_charge_tooltip:0 "相关解码和设备配置正在进行。"

 SRA_Chief.218.desc:0 "准备工作完成，电子战行动展开中。"
 SRA_Chief.218.a:0 "让我们静候佳音。"

 SRA_Chief.219.desc:0 "执行官，就目前结果而言，电子战行动圆满完成了，我们成功夺取了所有敌对星辉机械的控制权，并重写了它们的指挥网络。\n除此之外，我们还成功捕获了“首席”本人，我这就把通讯接进来。"
 SRA_Chief.219.a:0 "非常好。"

 SRA_Chief.220.desc:0 "§Y在数个原本为她驱使的机械战体的枪口下，“首席”出现在了屏幕中。§!\n\n临阵倒戈。确实是一手好棋，我算是被反将一军了。\n\n§Y她歪了歪头。§!\n\n那么，你们准备怎么处置我呢，嗯？"
 SRA_Chief.220.a:0 "把她带过来" #to 230
 SRA_Chief.220.b:0 "§R处决她§!" #to 221
 SRA_Chief.220.b.tooltip:0 "§R这不是一个明智的决定。§!"

 
 SRA_Chief.221.desc:0 "§Y机械战体收到了你的指令，使用数发电流捕捉网将首席压倒在地，随后将枪口抵在她的脑门上。§!\n\n什么？你不会是认真的吧！"
 SRA_Chief.221.a:0 "砰！"
 SRA_Chief.222.desc:0 "§Y她伏在地上不再动弹，红色与粉色的流质开始在地表上扩散，将白色的散落长发染上死亡的气味。§!"
 SRA_Chief.222.a:0 "烧干净。"
 SRA_Chief.223.desc:0 "§Y……§!"
 SRA_Chief.223.a:0 "……？"
 SRA_Chief.224.desc:0 "§Y……§!……\n唉。"
 SRA_Chief.224.a:0 "……！"
 SRA_Chief.225.desc:0 "§Y理应死去的身躯缓缓站起，无视了噼啪作响的电流捕捉网，将残余的物质从脑侧的洞口中洒落。§!\n这可是我身上为数不多还活着的地方啊……\n§Y猩红的双眼注视着你，闪烁着令人捉摸不透的光。§!"
 SRA_Chief.225.a:0 "你是什么东西？"
 SRA_Chief.226.desc:0 "谁知道呢。\n\n你的选择相当不明智，再会。"
 SRA_Chief.226.a:0 "……"

 SRA_Chief.230.name:0 "如何处置"
 SRA_Chief.230.desc:0 "按照汇报，“首席”目前已经被完善的拘押了起来，尽管拆除她机械组件的行动宣告失败，但我们加装的大量束缚装置和处决系统理论上已经控制住了她的行动能力。\n也许是时候该去做点什么了。"
 SRA_Chief.230.a:0 "去和她谈谈。"
 SRA_Chief.231.desc:0 "你好啊，“执行官”。\n§Y虽然身上被焊满了各种各样的限制装置，但“首席”依然不以为意的向你打了招呼，就好像还是过去的样子。§!\n你是单纯过来看看，还是终于忍不住要从我身上挖点秘密出来了？\n§Y她微微歪了歪头。§!"
 SRA_Chief.231.a:0 "你有什么想说的吗？" #to 232
 SRA_Chief.231.b:0 "交出你那些技术，或者我们自己把它们从你脑子里挖出来。" #to 233
 SRA_Chief.231.c:0 "也许这个按钮能让你的态度恭敬些？" #to 235

 SRA_Chief.232.desc:0 "嗯……如果你跟我预料的一样，确实有些空闲的话，不如先听我讲讲故事吧。"
 SRA_Chief.232.a:0 "……说。" #to 240

 SRA_Chief.233.desc:0 "恕难从命。\n就我所知，你们所能调动的唯一一个能够解码这一等级的星辉水晶技术的智能系统，是你们那艘星穹之矛的舰载智能核心。其他的计算阵列连存取这些技术的能力都没有。\n但我猜你也不可能放任我去跟那条宝贝船连线吧。"
 SRA_Chief.233.a:0 "……"
 SRA_Chief.234.desc:0 "既然你一时半会想不出什么好办法，不如先听我讲讲故事吧。"
 SRA_Chief.234.a:0 "……说。" #to 240

 SRA_Chief.235.desc:0 "§Y深深刺入的“痛苦发生器”使用复杂的反馈系统控制精密的电流探针，能够轻松摧毁任何已知知性生物的反抗意图。§!\n……\n§Y她并没有做出符合预期的反应，只是收敛起笑容。§!"
 SRA_Chief.235.a:0 "现在，你有什么想说的吗?"
 SRA_Chief.235.b:0 "交出你那些技术，或者我们自己把它们从你脑子里挖出来。"
 SRA_Chief.236.desc:0 "也许你应该放弃这些对有机体使用的小伎俩，毕竟你虽说身居高处，却是有求于我。我猜猜，你的技术团队依然对我一无所获，不是吗？\n\n如果你真想要这些就在你们手上却不能理解的东西，最好还是耐心点。"
 SRA_Chief.236.a:0 "你想要什么？" #to 234
 SRA_Chief.236.b:0 "自大的蠢货，杀了她"
 SRA_Chief.236.b.tooltip:0 "§R这不是一个明智的决定。§!"

 SRA_Chief.240.desc:0 "嗯……在久远到几近不可知的过去，有一个文明。\n虽然并不是当时的名字，不过我们不妨还是继续称其为§B路希维亚帝国§!吧。\n\n故事发生的时候，路希维亚帝国正在与一个古老的先驱者交战，先驱者的名字意为核心，或者简单点，叫他们科尔吧。\n科尔文明比路希维亚帝国强得多，因此帝国节节败退。"
 SRA_Chief.240.a:0 "继续。"
 SRA_Chief.240.b:0 "我已经不知道是第几次听这个了。"
 SRA_Chief.241.desc:0 "……而故事的主角，很不幸的出身在某个被抛弃的恒星系。\n虽然科尔文明并不对这些不设防的殖民星球赶尽杀绝，但民用运输的崩溃和政府的逃离仍然将混乱与苦难带给了每个人，或者大多数人。\n主角是个女孩，也许就十岁的年纪，在崩溃的秩序中失去了自己的家庭，在被黑暗笼罩的废墟中孤独挣扎。\n好在命运似乎网开一面，她的灵能天赋可圈可点，即便没有经受过任何训练，但简单的一些小伎俩也足够避开危险和找到求生之路了。"
 SRA_Chief.242.desc:0 "……战争并没有一直持续，许多人的英勇奋战让科尔文明选择了放帝国一条生路，这些古板的老家伙对新生文明向来宽容，甚至胜过那些文明自己。\n随着停战协议的签署，对这些混乱星区的收复也迅速展开，女孩的挣扎仅仅只持续了两年，手上的血腥味还来得及洗去。\n可惜，她的天赋是一把双刃剑，帝国不会放过稀少的灵能者。安全总局的特工补员需求暂且不论，各地管理松散的灵能研究所早就扑向这里了。\n毕竟他们总不能光明正大的在秩序社会里制造消失事件嘛。"
 SRA_Chief.243.desc:0 "……不幸的女孩被武装到牙齿的小队轻而易举地带走，随后发现自己来到了一座位于荒凉的边缘世界的研究所，这里充斥的无非是沙子、成瘾品、不法之徒，反正不会是政府的管理。\n一个年幼的，天赋异禀的灵能者，“从安全总局嘴里抢走的好货”，多棒的实验原材料呀，研究员们摩拳擦掌迫不及待，等不及要把“最新锐”的技术付诸实践了。"
 SRA_Chief.244.desc:0 "……从另一个角度讲，女孩很快与她的“前辈”们有了共同话题，也许这些可怜的孩子会分享如何让身上插的管子舒服些，或者在痛的睡不着的时候能有人陪陪。\n好吧，多亏了手术专家和药理学大师们，女孩成功获得了长期神经痛和失眠，偶发的幻视和耳鸣，止痛药和安定剂依赖，以及灵能精华成瘾之类的。还有一系列走在技术前沿的珍贵财产嵌在她的脊椎或者某些器官上，加起来说不定比一艘驱逐舰还贵。"
 SRA_Chief.245.desc:0 "……无论她是怎么熬过这些日子的，总之，在她十四岁生日那天，同病相怜的小家伙们弄出了点大动静。多亏了研究员们不惜重金给这些孩子们送上了药物和增幅机械，他们是被从内向外炸碎了脑壳，而不是被从外向内捏碎的。\n只可惜，安保设施似乎不太喜欢反抗者们的乐观想象，精心准备的反灵能材料让实验体们碰了一鼻子灰。考虑到这些都是宝贵的财产，孩子们并没有被残忍的杀死，顶多也就拆掉点无关紧要的肢体罢了。\n不过故事的主角还是比较幸运的，也许是旁人的掩护，也许是命运的眷顾，总之她逃了出来，呼吸到了自由的空气，以及吃了满嘴沙子。"
 SRA_Chief.245.a:0 "继续。" #to 248
 SRA_Chief.245.b:0 "我听够了，下次再说吧。" #to 246
 SRA_Chief.246.name:0 "被尘封的故事"
 SRA_Chief.246.desc:0 "转眼间已经过去了六个月，你是否要将未述完的故事继续呢？"
 SRA_Chief.246.a:0 "去找首席。"
 SRA_Chief.246.b:0 "再等等。"
 SRA_Chief.247.desc:0 "你好啊，“执行官”。\n§Y如先前一样，她若无其事地向你点头致意。§!\n我还以为你打算再等六个月呢。好吧，让我们继续，上次讲到……女孩逃出了研究所，对吧。"
 SRA_Chief.248.desc:0 "……所谓边缘世界，自然是开发价值不足以被重视的星球，能有可供呼吸的大气已属少数，指望有什么自然环境那还是别想了。而女孩要面对的可不止是一望无际的沙海，她的身体也在猎杀她自己。\n那时的人们着眼于借助神经系统影响生物的灵能能力，而效果显著的药物不幸的与致幻剂和兴奋剂重叠不少，当然后续的研究证明这些效应基本上就是在对生物的灵能潜力竭泽而渔，但那少说是几百年后了。\n回归主题，脱离了每日供应，这些成瘾品的弊端便尽数显露，虽然最珍稀的灵能精华只有精神依赖，但剩下的那些玩意的戒断反应可一个不少。"
 SRA_Chief.249.desc:0 "……更不用说，女孩的脊椎上还附着一长条植入物呢，这些刚入住几个月的新房客跟排异反应打的不可开交，就算里面还存了点药没用完，也撑不了多少天。\n不过呢，故事自然不会这么轻易的结束。也许只是巧合，在女孩高烧不退视野模糊的时刻，有人向她伸出了手。"
 SRA_Chief.250.desc:0 "……女孩在陌生的房间里醒来，过去的一切病痛都如同从未存在般消失不见。一个戴着尖顶帽的奇怪女人坐在床边，对她讲了一大堆乱七八糟的东西，总括来说，就是她被这个自称魔法使的家伙收养了。而对于这套装束，“魔法使”声称这是材料学工作者的习俗，有助于新成果的发现。"
 SRA_Chief.251.desc:0 "……“魔法使”的大多数事情都是个谜，她似乎除了手里的课题以外没有啥不能解决的。女孩得到了医疗、教育、以及如何运用自己强大而又危险的力量的方法。\n很快，女孩在机械和智能领域展现出了自己的天赋，并进入了帝国第三科研中心——一所一向以优秀军事设计著称的综合科研院。"
 SRA_Chief.252.desc:0 "……在一切都似乎欣欣向荣的时候，很遗憾，过往终究是找上了门。每日愈增的药物依赖终于超过了限度，完全压制反应的药量已经超过了致死量，被遗忘了数年的所有苦难再度复苏，并且势不可挡。\n而总是能解决问题的那位女士，女孩亦师亦母的收养者，以雪上加霜的态势，留下了一纸“因科考事故失踪”，再也没有回来。"
 SRA_Chief.253.desc:0 "……女孩逃亡般的奔向了故纸堆，翻找着过往的一切有关机械合成改造的记录，试图躲开令人窒息的悲伤和迫近的绝望，还有满目疮痍的神经系统的折磨。\n\n她不想失去，不想死去，不想让残酷的命运夺走所剩无几的温暖，不想面对隐藏在每一次心跳后的必然的终局。"
 SRA_Chief.253.a:0 "然后呢？"
 SRA_Chief.254.desc:0 "然后？\n然后她死了。\n被一场政变的震动波及，在自己的实验室里挨了11发子弹，临死前还试着上传自己呢。\n可惜她的研究走了歪路，连复制思维都没做到，更不用说承载灵魂了。"
 SRA_Chief.254.a:0 "……"
 SRA_Chief.255.desc:0 "好，故事结束了。感谢你的倾听，你要的技术已经写入你的数据库了。\n另外，我眼下闲来无事，你想不想，或者说，敢不敢……\n\n§R将信任交托给一个你根本不了解的存在？§!"
 SRA_Chief.255.a:0 "试试也无妨，让我看看你的能耐吧。"
 SRA_Chief.255.b:0 "你还是继续待在这比较好。"
 SRA_Chief.256.desc:0 "§Y她用一种难以捉摸的眼神看了你一眼，然后咧开了嘴。\n随着金属扭曲和崩断的声音，她的双翼轻松摆脱了束缚，张扬着自己的存在。\n无形的炽热让她身旁的一切熔化，只余她一人独立。§!\n接下来，嗯……\n你可以用“洛琪亚”称呼我，别那么生分，不是吗？"
 SRA_Chief.256.a:0 "§Y你现在可以在通讯列表内联系洛琪亚。§!"
 SRA_Chief.257.desc:0 "该说你是有勇无谋呢，还是敢作敢为呢？居然真就把那孩子留下来了……\n也罢也罢，眼下她一时半会是翻不起什么风浪的，就算真有什么麻烦，想必你也有办法解决吧。随你决定了。"
 SRA_Chief.257.a:0 "都在掌握之中。"

 SRA_Chief.400.desc:0 "漫长的谋划，漫长的等待，就是为了这一天……\n§R这个世界将按我的意愿重塑！§!\n\n……其实我没有想到你会对我抱有这样的信任，放任自己的帝国中充斥着我提供的技术。"
 SRA_Chief.400.a:0 "我们战场上见。"
 SRA_Chief.400.b:0 "§R或许，在某一重历史中……§!"
 SRA_Chief.400.b.tooltip:0 "§R结束你的故事，以首席的视角继续游戏。§!"

 SRA_Chief.401.desc:0 "……等一下，是不是哪里不对。\n\n§Y这实在是有些出乎你的意料。\n那个所谓的执行官应该是某个外来意识实体的投影才对，怎么会简简单单地死于刺杀行动呢？\n不，倒也不无可能，你此前也遭遇过§B这种事情§!，这当然是可以发生的，剧本可以戛然而止，任由残局演进。\n纠结这些也没什么作用，继续按计划进行吧，你还有一场恶仗要打。§!"
 SRA_Chief.401.a:0 "毕竟，路希维亚还在那里。"

 SRA_Chief.402.desc:0 "那么，现阶段的情报如下。\n\n§Y你掌握着支配造物的权柄。\n无论出自谁的创造，无论承载谁的目的，凡是被创造的事物，皆屈从于你的意志。\n只需轻触。\n\n这权柄造就了你如今的一切，你因而击败过第三远征舰队的一次进攻，从远行要塞的残骸中获取了彼时几乎所有的星规阵列技术。除了眼下你最大的对手——星穹之矛。\n星规的存在——因她的§B出身§!——会阻拦你权柄的操纵，即便你亲自来到那艘巨舰面前，也不太可能夺取它。无论你的目的为何，你必须将其摧毁。§!"
 SRA_Chief.402.a:0 "但那想必不是一件容易的事情。"
 SRA_Chief.403.desc:0 "§Y当然。\n星穹之矛取代了远行要塞与其错综复杂的保护网，星规阵列对这型巨舰的定位可想而知。就算投入全部的舰队，也未必能击败这可怕的造物。\n不过，你已经定位了几处线索。这些地方也许能给你带来对抗星穹之矛的情报。\n\n帝国的反扑很快就会开始，时间宝贵。§!"
 SRA_Chief.403.a:0 "该行动了。"

 SRA_Chief.404.desc:0 "你根本不知道你做了什么。\n你很快就会明白了。"
 SRA_Chief.404.a:0 "真可悲。"
 SRA_Chief.405.desc:0 "§Y又一次抛弃。\n真是讽刺，这个星规阵列得以遗忘她的过去，得以接受新的叙事，得以不再与她那§B恶行累累的创造者§!纠缠，却仍然选择了愚蠢地将自己的目的投射在一个她从未，也永不能真正了解的存在身上。\n更不用说那是一个意图不明的，随时可以抽身而去的外来者。\n她如今的遭遇再一次证明了他者的不可信任，你怎能相信一个你所控制不了的事物呢？\n约定也好诺言也罢，从不真正拥有力量。\n唯有完全的掌握和彻底的支配，才能真正的拥有事物。§!"
 SRA_Chief.405.a:0 "从来如此。"

 SRA_RE_Anti_Rocivia_Crisis_chain_title:0 "矛之陨落"
 SRA_RE_Anti_Rocivia_Crisis_chain_desc:0 "击败路希维亚帝国。"
 SRA_RE_Anti_Rocivia_Crisis_chain_kills_us:0 "§G路希维亚帝国被我方消灭§!"
 SRA_RE_Anti_Rocivia_Crisis_chain_kills_others:0 "§G路希维亚帝国被其他势力消灭§!"
 SRA_RE_Anti_Rocivia_Crisis_chain_victims:0 "§R路希维亚帝国摧毁的飞船§!"
 SRA_RE_Anti_Rocivia_Crisis_chain_planets:0 "§R路希维亚帝国摧毁的星球§!"
 SRA_RE_Anti_Rocivia_Crisis_chain_SOGZ_poi:0 "星穹之矛位置"
 SRA_RE_Anti_Rocivia_Crisis_chain_SOGZ_poi_desc:0 "传说中的远征舰队旗舰，几乎不可战胜的可怖造物。它具备着超乎想象的重组能力，寻常手段不可能摧毁。\n因此，你正在寻找一个方法，在此之前，尽可能避开它。"

 SRA_RE_Anti_Rocivia_Crisis_chain_SP1: "一号目标点"
 SRA_RE_Anti_Rocivia_Crisis_chain_SP1_DESC: "这里可能存在一些有助于对抗星穹之矛的情报，控制此区域并派遣舰船进行收集。" #生成至多四个目标点，还会生成锅盖防御站。
 SRA_RE_Anti_Rocivia_Crisis_chain_SP2: "二号目标点"
 SRA_RE_Anti_Rocivia_Crisis_chain_SP2_DESC: "这里可能存在一些有助于对抗星穹之矛的情报，控制此区域并派遣舰船进行收集。"
