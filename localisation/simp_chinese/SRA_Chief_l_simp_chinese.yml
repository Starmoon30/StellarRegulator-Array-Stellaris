 SRA_RE_Anti_Rocivia_Crisis_chain_SP4_DESC: "这里可能存在一些有助于对抗星穹之矛的情报，控制此区域并派遣舰船进行收集。"


 SRA_Chief.406:0 "特殊项目完成"
 SRA_Chief.406.desc:0 "此地点的情报收集已完成，正在进行整理。"
 SRA_Chief.406.a:0 "确认。"


 SRA_Chief.408.desc:0 "……\n真是……苍白至极。\n§Y藉由回收来的那些意识碎片的力量，星穹之矛得以近乎永久地保持坚不可摧的状态，哪怕运用星规阵列的技术去攻击，也无法真正伤害到它。无论多少次，它都可以恢复。\n基本上，星规已经立于不败之地了。\n……对吗？§!"

 SRA_Chief.409.desc:0 "§Y深渊，或者说深源，常常被提及但极少被阐明的指代。\n存在的万物如泡沫般浮起又破散，而深源，正是翻腾着泡沫的海。\n起源之起源，终结之终结。一切已存在与未存在都被包含在其中，一切概念都由其分化而出。一切世界由它创生也由它终结。它是无限复杂的绚丽辉光，每一个现实都不过是它的切面；它是超逾理解的无垠混沌，万物在其中融为均一。\n而你的意识与深渊相连，有如舞台上垂落的丝线，自高天降下，搭落在你的肩头。\n也因此，你得以行使它的影响，以你的意愿塑造于你之下的现实。§!"
 SRA_Chief.410.desc:0 "§Y……但你不能靠在角落里就将一切敌手抹去。\n你只能支配你的意识所触及的事物，你也并非是一位精湛的塑造者。万事万物已从深渊分化而出，此刻的事物抵达彼时的路径便是消融。你既要以深渊的力量塑造现实，又不想让现实向深渊回归，这尽管并非不可，但也绝非易事。\n特别是你尽管不会死去，却仍可被摧毁，那时你只能跌入下一个开始，前功尽弃……一如既往。§!"
 SRA_Chief.411.desc:0 "§Y那么，是时候了，你的众声沉寂许久，是时候让§R你们§!合唱了。§!"
 SRA_Chief.412.desc:0 "§Y在静谧钟塔被重新发掘后不久，你就悄然抵达了这座并不牢靠的监狱。\n那些粗糙而自以为是的修复并没有成功阻止灾疫的逃离，事实上，反倒是进一步推进了封印的崩解。\n你回收了一份§R灾疫§!样本以备不时之需，现在，是它登场的时候了。§!"
 SRA_Chief.413.desc:0 "感觉如何，塔拉？"
 SRA_Rokia_Tara_Xacum:0 "塔拉·卡夏卡姆"
 SRA_Chief.414.desc:0 "其实载体对我们思维能力的影响并不存在……好吧，这个载体不错，名列前茅的等级。\n嗯，我理解了，灾疫可以自然地几乎无限度的扩张，并仍然在你的认知上保持一体性。很好，我认为你的计划是可行的。"
 SRA_Chief.415.desc:0 "虽然在我看来让我接管一切效率更高，不过，你说了算。\n给我一点时间，我可以将它转化成一个能够稳定活动的深渊构造体，以此承载我们的力量，击坠那支矛。\n\n你有话说。"
 SRA_Chief.416.desc:0 "……是啊，我有话说。\n我……讨厌这种感觉。"
 SRA_Chief.417.desc:0 "嗯哼。你讨厌事情脱离掌控，脱离你的预期，超出你的能力，使你不得不将事态的发展交托你的意志之外。哪怕我只是你思维的一角，只是以另一种想法，另一种准则行动的你自己，你也感觉一切都在失控。"
 SRA_Chief.418.desc:0 "控制，控制，你渴望控制一切，但你又不愿时时刻刻都为之全力以赴。\n你心想：我能抛开那些吗，如果我抛开其他一切，我能做到我想做到的事情吗？于是你创造了我——暴君，支配者，控制论的具现化——来探索这样的可能，如你所构想的一样，我专注于实现，我就得以实现。我愿意安排一切，一切自然就会按照我的安排演进。"
 SRA_Chief.419.desc:0 "我安排可触及的一切，不留余地。但你，或者说我之外的所有我们，或多或少都对他者有所期望。倒不如说，越是宣称他者不可信任，越是渴望能够真正托付的他者。\n因此你们总是痛苦，总是失败，有些时候我觉得你们可悲，尽管只是因为我从不抱有期望，而不是你们的想法具有什么错误。\n毕竟，没有哪个超然的准则指明何为应当。"
 SRA_Chief.420.desc:0 "你也是这样想的，所以你才创造了我们，你心想，如果你的正确不是正确呢，也许这是不需要的呢，也许那是错误的呢，你创造这样思考的我们，我们探索你的思考。\n但最终，你还是什么都不愿放弃，什么都不愿否定，毕竟没有谁更加正确，也就没有谁值得你放弃自己。\n就好像我们也都觉得自己才是对的。""
 SRA_Chief.421.desc:0 "……嗯，即便如此，我也依然这样想。"
 SRA_Chief.422.desc:0 "自然，如果你认同我，被区分而出现的我就不会继续存在了。\n\n我会实现你需要我实现的一切。去行动吧，洛琪亚。"


 SRA_RE_Return_To_Calamitisease_megastructure_0:0 "§R灾疫之心§!" 
 SRA_RE_Return_To_Calamitisease_megastructure_0_DESC:0 "通过回收来的灾疫残骸搭建的框架，用于承载深渊的力量。"
 SRA_RE_Return_To_Calamitisease_megastructure_1:0 "§R燃灰以火§!"
 SRA_RE_Return_To_Calamitisease_megastructure_1_DESC:0 "以黑星之火点燃灾疫的残骸，复苏无边无际的阴影。"

 SRA_Chief.430.desc:0 "你在玩弄你无法驾驭的力量，不是吗？你只能用它毁掉一切，并不能创造你想要的未来。\n至少，总得相信你自己吧。"
 SRA_Chief.430.a:0 "能解决你就够了。"


 SRA_Chief.450.desc:0 "完成了。\n§R灾疫之心§!已经就绪，自你心中流淌而出的，湮灭一切差别，熔铸万物的力量已在这悚骇之物中满溢。\n正如你的谋划，你能借此抵达星穹之矛，将其击坠。\n\n但这就是终局吗，这能带来什么？你折断了矛，毁掉了帝国，路希维亚就会屈从于你的想法吗？你自己想要的到底是什么，你最好有所考量。\n\n不过无论如何，总还是要先打赢，该出发了。"
 SRA_Chief.450.a:0 "……我们走吧。"

 SRA_RE_Anti_Rocivia_Crisis_chain_SP5: "罪与罚"
 SRA_RE_Anti_Rocivia_Crisis_chain_SP5_DESC: "似乎是注意到了我们的行动，星穹之矛启动了§R跨星系打击系统§!，预计每§R180.00£time£§!，§B「新星终结」§!就会打击§R灾疫之心§!所在位置。\n\n将其折断吧。"


 SRA_Chief.460.desc:0 "§Y这是你第一次触及星穹之矛，以及星规。\n你似乎能品尝到她的恐惧与不甘。但机器会有这样的想法吗？机器应该像机器一样思考才对。\n又或者，星规实质上是路希维亚的某种衍生物，并非是技术的产物。\n无论如何，造物依然是造物，凡是被创造之物。皆将屈从于你的意志。\n\n她的命运掌握在你的手中，该做出决定了。§!"
 SRA_Chief.460.a:0 "§R杀了她。§!"
 SRA_Chief.460.a.tooltip:0 "§R她也不过是另一个威胁，所有的威胁都应该被抹除。§!"
 SRA_Chief.460.b:0 "§B支配她。§!"
 SRA_Chief.460.b.tooltip:0 "§B为何不让她为你所用呢？经由你的触碰，她将向你献上绝对的忠诚。一份令人愉悦的战利品，不是吗？§!"

 SRA_Chief.461.desc:0 "§Y你命令她死去。\n没有犹疑，没有迟滞，你的命令迅猛而坚决，不容任何解释或拖延。\n\n你感到这艘巨舰已然沉寂，接着是破碎，化成灰烬，永不复还。\n\n复仇，但并无多少喜悦可言。了却一桩心事，仅此而已。§!"
 SRA_Chief.461.a:0 "……就这样吧。"

 SRA_Chief.462.desc:0 "§Y你命令她服从。\n于是她服从。\n星穹之矛的庞大舰体在你的意识边缘垂下光辉，几乎颤抖着等待你的驱使。§!\n\n如您所愿。\n\n§Y星规如此回应。\n\n没有挣扎，没有迟疑，也没有任何足以称作反抗的残响。你的意志被接纳，被执行，被视作至高无上。此刻，她的一切技艺、谋略、兵锋与骄傲，皆是你的所有物。\n\n这应当令人愉悦。\n\n事实上，这的确令人愉悦。§!"
 SRA_Chief.462.a:0 "……"

 SRA_Chief.463.desc:0 "§Y多么美妙。\n一个曾经被赋予使命、被置入秩序、被用于维系那可憎帝国的造物，如今正安静地俯首，等待你为她规定存在的意义。她继承了那套冷静、精密、近乎无情的运转方式，也继承了那种将一切苦难都压缩为可处理事项的傲慢。\n现在，它们都属于你。\n你可以随意驱使她，你也的确这样做了，她不会拒绝，她总是服从，恰到好处地回应你炽烈燃烧的火焰。§!"
 SRA_Chief.463.a:0 "……"

 SRA_Chief.464.desc:0 "§Y然而，一丝厌烦却出现在你的心头。你忽然想让她表现出更多东西。恐惧也好，不甘也好，迟疑也好，哪怕是一点细微的抗拒也好。你想从这份服从中压榨出某种更接近胜利的质感，某种不应该存在的姿态。\n\n更加细碎、更加无意义、更加接近羞辱而非支配的命令正在滋生。你要把这份顺从碾碎，重新揉捏，令它呈现出某种你绝不会承认自己渴望的形态——§!"
 SRA_Chief.464.a:0 "……够了。"


 SRA_Chief.470.desc:0 "§Y……该去见§B她§!了。\n\n你其实知道她会说什么。\n你知道她会微笑，知道她会承认，知道她不会否认自己的责任。你知道她不会请求宽恕，也不会摆出一副无辜的姿态。她甚至不会反抗你，在这样的情形下，她会纵容你的一切，她想要的就是这些。\n你知道。\n但知道是一回事，面对则是另一回事。§!"
 SRA_Chief.470.a:0 "……"

 SRA_Chief.471.desc:0 "§Y路希维亚平静的站在会客室里，不像是一位输掉了战争的领袖，倒像是一位……你不想说出来。§!\n\n你来了。\n\n§Y她说，温和，并且欣然。\n你讨厌这样的声音，不知道是从什么时候开始。\n当然啦，她知道你会来，她知道你在想什么，她从一开始就在等待这场会面，等待你将在这里做出的一切。\n你向前走去，让你的意志在空气中弥漫，周围的一切都为之屈服，化作屏障，化作牢笼，化作某种用于阻止谁从中逃离的，并不合乎实际的造物。\n路希维亚并不反抗。她几乎是配合地站在那里，任由你将她置入你的支配范围。\n就像她乐于看见你这么做。§!"
 SRA_Chief.471.a:0 "别用那种眼神看我。"
 SRA_Chief.472.desc:0 "§Y她露出了微笑，就和你记忆中的一样。只是此刻格外的令人作呕。\n你想说些什么，却不知道该说什么，你设想过很多次这样的情形，但没有哪一次让你满意。你想从她身上得到什么呢？道歉？认可？还是什么允诺？你知道她的真实面貌，她讲出来的话语又有什么意义呢，无非是表演，是迎合，是毫无价值的空话。言语本就不存在什么力量，你是知道的。§!"
 SRA_Chief.472.a:0 "§Y但你仍要言说。§!"
 SRA_Chief.473.desc:0 "§Y你的众声喧嚣不止，你的火焰炽烈燃烧，若不以话语将其吐出，你是无法承受这崩解的自我与癫狂的。§!\n\n为什么？\n\n§Y为什么要抛弃，为什么要离开，为什么要把你抛入这个残酷的世界，将一切苦难诸恶施加，操纵与折磨你的心灵，在你身上点燃那炽烈的火。为什么要给予你希望又夺走，为什么要救下你，照顾你，教导你，陪伴你……\n为什么不能都是假的，只是表演，只是纯粹的恶意？§!为什么不让我就只是简单的恨你？"
 SRA_Chief.473.a:0 "为什么要给我这样的爱？"
 SRA_Chief.474.desc:0 "因为你是我们的创造，故事的主角。\n\n§Y路希维亚垂下眼，说出那些诅咒般的词句。§!\n\n你的主题便是不安和焦虑，分裂的目标，不断的前功尽弃，以及局限在人类思维下的受限能力。\n你是希德拉的残片，拥有她无限的欲求，却没有与之匹配的力量。我则塑造了你的认知，你的经历，你的创伤，你的渴望。\n你会想要自由，也想要被占有。你会想要掌控命运，也想要有人为你选择命运。你会不信任任何他者，却又渴望某个他者以绝对的方式爱你。\n\n§Y某种骇人的喜悦在她的声音中浮现。§!\n\n故事需要叙事价值，一帆风顺的事情三言两语就能结束。难道我现在对你说，一切的艰难险阻都已经过去，一切的求而不得都到此为止，允诺你永恒的安宁与无限的幸福，就能为这一切画上完美的句号吗？\n你自己都不会接受的。"
 SRA_Chief.474.a:0 "够了！"
 SRA_Chief.475.desc:0 "§Y你欺身上前，将她扑倒在地，扼住她的咽喉，扼住§B命运§!的咽喉。\n她如你所愿地缄默不言，你却听到她的声音仍在你的耳旁响起。\n你收紧手指，截断她的呼吸，截断她的生机，好似这样就能终结她的话语所代表的一切一样。\n路希维亚挣扎着——或者看起来可以称之为是挣扎——抬起手，轻轻触碰你的脸颊。\n她的躯体恰到好处地表达着她想要表达的情感，虽然垂死却并不失态，她的胸腔兴奋地抽吸，她的心脏狂热地鼓动，让那脉搏在你的指尖颤动，她流露出了某种，令你绝望的幸福。\n\n你做不到，就连在这里表演般地杀死她，你也做不到。§!"
 SRA_Chief.475.a:0 "§Y你的手臂失去了力量。§!"
 SRA_Chief.476.desc:0 "§Y你无力地伏倒在她的身上，脸埋在她的脖颈旁。\n你闭上眼睛，不愿看到任何事物，不愿让某些可憎的事物从眼角滴落。\n那双手抱住了你，如同一位■■拥抱她的■■。\n多么温暖，多么令人安心。§!"
 SRA_Chief.476.a:0 "我诅咒这个世界。"

 SRA_Chief.477.desc:0 "所以，就只是这样了吗，你觉得仅仅如此就够了吗？\n\n§Y§R恣睢的恶龙§!盘踞在你的椅子上，对你开口道。\n与§B路希维亚§!的那场遭遇让你疲惫不堪，直到此刻才决定回到自己的生活中去，于是在你习惯的办公室里见到了§R她§!。\n你的§R众声§!仍在喧嚣，斥责你的软弱或者干脆比你更加软弱，但你觉得她们也未必能做出比你更好的决策……§R虽然你选择了自杀未遂。§!\n你能有什么办法呢，你已经不再相信自己能越过这一切了。\n你怎么可能战胜§B塑造了你的一切呢？§!§!"
 SRA_Chief.477.a:0 "……不是这样的。"
 SRA_Chief.478.desc:0 "§Y不是这样的。许多个你说。你觉得她们骄傲而盲目，她们觉得你软弱而自卑。\n你也是§R深渊§!的一个锚点，你拥有和§B她§R们§!§!一样的潜力，你可以扬升到§B她§R们§!§!的高度，不再受到§B她§R们§!§!的桎梏，星规阵列能做到的事，你也可以做到。她们相互辩驳着说。§!"
 SRA_Chief.478.a:0 "这只是一个开始。"
 SRA_Chief.479.desc:0 "§Y§R恶龙§!不置可否地歪了歪头颅。\n\n但是，那样又能解决什么呢？另一些你说。\n得到了力量，又能解决什么呢，你渴望的一切，来自他者的认可，并不能靠胁迫的方式去取得，你希望的是不因为你的意愿而出现的光芒，而不是自己掠夺来的温暖。她们低声说。\n……让§B路希维亚姐姐§!回到过去的样子不可以吗？一个你说。\n闭嘴吧你。其他的你说。§!"
 SRA_Chief.479.a:0 "总有一天，我会了结这一切。"
 SRA_Chief.480.desc:0 "总有一天，我会得到足以让我得偿所愿的一切。\n我会§R清算§!所有的过去，拥抱无限的未来。\n\n§Y你听见自己说，你就是这样说的。\n§R恶龙§!用某种复杂的目光看着你，接着露出了尖牙利齿。§!\n\n我会拭目以待。\n\n§Y§R她§!回答。§!"
 SRA_Chief.480.a:0 "§R你§!也逃不掉。"
 SRA_Chief.480.a.tooltip:0 "IF：直面过去"




 SRA_Chief.601.desc:0 "想我了吗，“执行官”？\n§R灾疫§!的确是我力量的良好载体，真是大自然造物的奇迹。这样一来，我就不需要仅靠我自己来跟你的舢板们打架了，那样真的很累，你知道的。\n我不是八点档剧集里的反派，所以我不会告诉你我要做什么的，拜拜。"
 SRA_Chief.601.a:0 "你会后悔的。"


 SRA_Chief.602.desc:0 "我当然已经注意到有一个巨大的深渊构造体大水母在我们头顶上飘荡了，这情况确实不在计划之中。确切地说，我没想过她会这么大张旗鼓的做事，本该发生的大概是她躲在某个不知名的角落悄悄的完成了自己的目标，直到一切都结束都可能不会跳出来炫耀……\n好吧，也许，可能，我大概有个猜测。"
 SRA_Chief.603.desc:0 "希德拉！出来出来。"
 SRA_Chief.604.desc:0 "§Y猩红的水晶龙从天花板上探出身子，飘落到路希维亚的身旁。她身上乱七八糟的挂着一大堆黄金珠宝首饰，还有金币从她摆动的衣袖中滑落。§!\n\n尊贵的最高议长阁下~找我这个小小的总管有什么事呢？可不要给我超出我能力范围的任务，毕竟我们只是情报监管机构，没有什么其他能力，不是吗？"
 SRA_Chief.605.desc:0 "唉，我可以认为这段发言表达了你的立场吗，刚刚还在兴奋地打滚的家伙？"
 SRA_Chief.606.desc:0 "随你怎么说。\n\n不过，不过。\n如果小路希已经选好了自己的角色，那我就给你们能同台演出的能力吧。让你们免受不讲道理的力量的掌控，能好好的展现自己的积累。\n§Y她绕到路希维亚的另一侧，打了个响指。§!\n逃离那——\n支配一切造物的权柄。"
 SRA_Chief.607.desc:0 "§Y水晶龙向你露出了一个绚丽的笑容，随后在一个转身中消失不见。§!\n\n……至少她没有跳到那边去。\n嗯，如果你的规划没有问题的话，应该能靠舰队去摧毁那个深渊构造体，或者说，灾疫之心了。\n洛琪亚想用这个作为载体把['concept_SRA_SD_Abyss_Erosion']扩散到这个星系乃至整个宇宙。她有能力在那样的世界中继续存在，但显然你们没有。\n['concept_SRA_SD_Abyss_Erosion']会抹除事物之间的差别，将一切化为诞生之前的混沌，对你们来说这意味着死亡和毁灭。\n不过至少构造体是能被破坏和摧毁的。只要你把灾疫之心毁掉，那大概就算作是你的胜利了。\n如果不算的话我就再找希德拉谈谈。\n§Y她叹了口气。§!\n去吧，跟星规商量商量怎么对付，我个人不建议一股脑把所有舰队都扔进去……但也不一定真的就不行。"
 SRA_Chief.608.desc:0 "您好，执行官。我已经基本汇总了有关灾疫之心的信息，并上传到情报日志中了。\n现有数据表明，击破灾疫之心的外壳会导致其中包含的深渊能量迅速溢出，并在整个恒星系内造成严重的不良影响，虽然这一影响在舰队损管的处置下可以迅速抑制，但短期内的多次侵蚀可能会造成不可预知的危险后果。\n因此，较好的方案是分批次部署舰队，在保证能击破灾疫之心一次的情况下尽可能减少被侵蚀的舰队规模。\n在受损后，灾疫之心会迅速调动能量修复自身并召唤一批护卫，因此我们需要多次战斗来消耗它的能量储备。这一过程可能需要不少时间，好在它目前没有移动的迹象，损失仍在可控范围内。\n以上就是目前的资讯了，和我并肩作战吧，执行官。"


 SRA_RE_Chief_Crisis_2_situation:0 "燃灰以火"
 SRA_RE_Chief_Crisis_2_situation_type:0 "燃灰以火"
 SRA_RE_Chief_Crisis_2_situation_desc:0 "黑星之火点燃了灾疫的残骸，无边无际的阴影即将复苏。\n\n§Y-每8.00£time£，§R灾疫之心§!会随机选择一个恒星系内的敌对舰队，对其施加8.00£time£的§R无声悼挽§!。\n-§R无声悼挽§!会使受影响舰船的护盾、装甲、船体迅速下降并每1.00£time£受到 §R高额§! 伤害。\n-每当摧毁舰队时，§R灾疫之心§!会在被摧毁舰队所在位置召唤一组能存在64.00£time£的§R无际渊影§!。\n-每当即将被摧毁时，§R灾疫之心§!会失去20点升格进度，进入保护状态并释放一组§R无际渊影§!，摧毁这组§R无际渊影§!才能结束§R灾疫之心§!的保护状态。这组§R无际渊影§!在被摧毁时会在恒星系范围内施加负面效果，这一效果的强度随§R无际渊影§!的存在时间增长而迅速降低。§!"

 SRA_RE_Chief_Crisis_2_situation_monthly_change_tooltip:0 "§R灾疫之心正在苏醒……§!"

 SRA_RE_Chief_Crisis_2_situation_fail:0 "灾疫与深渊的力量调谐，凌驾于现实之上的集群诞生于此。"
 SRA_RE_Chief_Crisis_2_situation_approach:0 "终结灾疫的复苏，为失控的命运画上终点。"
 sra_re_chief_crisis_2_situation_stage_1:0 "无光"
 sra_re_chief_crisis_2_situation_stage_1_effects:0 "§R终局即将到来。§!\n\n每当被击破时，§R灾疫之心§!会释放出大量$SRA_chaos_Ship$，并对星系内舰队随机施加§R无望§!。\n-$SRA_chaos_Ship$将存在360.00£time£。\n-§R无望§!会使受影响舰船无法移动和攻击。持续180.00£time£。"
 sra_re_chief_crisis_2_situation_stage_1_buff:0 "§R无望§!"
 sra_re_chief_crisis_2_situation_stage_2:0 "余晖"
 sra_re_chief_crisis_2_situation_stage_2_effects:0 "§R璀璨彼方在此显露一角。§!\n\n每当被击破时，§R灾疫之心§!会释放出大量$SRA_chaos_Ship$，并对星系内舰队随机施加§R溃灭§!。\n-$SRA_chaos_Ship$将存在360.00£time£。\n-§R溃灭§!会使受影响舰船的护盾、装甲、船体迅速下降。持续180.00£time£。"
 sra_re_chief_crisis_2_situation_stage_2_buff:0 "§R溃灭§!"
 sra_re_chief_crisis_2_situation_stage_3:0 "黄昏"
 sra_re_chief_crisis_2_situation_stage_3_effects:0 "§R万物交界之时。§!\n\n每隔一段时间，§R灾疫之心§!会释放出大量$SRA_chaos_Ship$，并对其施加§R彷徨§!。\n-$SRA_chaos_Ship$将存在360.00£time£。\n-§R彷徨§!会使受影响舰船随机获得增益或减益。"
 sra_re_chief_crisis_2_situation_stage_3_buff:0 "§R彷徨§!"
 sra_re_chief_crisis_2_situation_stage_4:0 "烈日"
 sra_re_chief_crisis_2_situation_stage_4_effects:0 "§R光焰无际。§!\n\n每隔一段时间，§R灾疫之心§!会召唤出大量§Y科尔先驱主力舰§!，并对其施加§R炽焰§!。\n每当被击破时，§R灾疫之心§!会召唤出大量§Y科尔先驱主力舰§!，并对其施加§R炽焰§!。\n-§Y科尔先驱主力舰§!将存在360.00£time£。\n-§R炽焰§!会使受影响舰船高速恢复护盾、装甲、船体。"
 sra_re_chief_crisis_2_situation_stage_4_buff:0 "§R炽焰§!"
 sra_re_chief_crisis_2_situation_stage_5:0 "黎明"
 sra_re_chief_crisis_2_situation_stage_5_effects:0 "§R天将拂晓。§!\n\n每隔一段时间，§R灾疫之心§!会召唤出大量§Y科尔先驱主力舰§!，并对其施加§R余晖§!。\n每当被击破时，§R灾疫之心§!会召唤出大量§Y科尔先驱主力舰§!，并对其施加§R余晖§!。\n-§Y科尔先驱主力舰§!将存在360.00£time£。\n-§R余晖§!会使受影响舰船获得大量攻击速度加成，但持续损失船体值。"
 sra_re_chief_crisis_2_situation_stage_5_buff:0 "§R余晖§!"

 SRA_RE_Chief_Crisis_2_situation_continue:0 "一往无前"
 SRA_RE_Chief_Crisis_2_situation_continue_effect:0 "与§R灾疫之心§!战斗，将其彻底摧毁。"
 SRA_RE_Chief_Crisis_2_situation_continue_tooltip:0 "与§R灾疫之心§!战斗，将其彻底摧毁。"

 SRA_Chief.610.desc:0 "狂徒妄念。\n你对深渊一无所知，却敢大谈战胜它。你幻想你粗劣的破坏能驱散诸世的终焉，夸耀自己的造物胜过造物的源泉。真是愚蠢，存在的事物又怎能阻碍存在这一概念本身？\n\n§R你不过是一叶孤舟，撼动不了大海。§!"
 SRA_Chief.611.desc:0 "整个世界都将屈从，所有意志都将臣服，在这创生与毁灭的边界，只有统御永恒不灭……\n\n§R万物将被熔炼成唯一。§!"
 SRA_Chief.612.desc:0 "结束了……\n\n\n尽管我很想这么说，但你恐怕是要节外生枝的，对吧。"
 SRA_Chief.613.desc:0 "可不能这么讲，我没有妨碍的主观意图也没有阻止的客观行动，是完完全全地放任你完成你的计划。只不过是你的能力有限，无法在['concept_SRA_SD_Abyss_Erosion']完全扩散到整个宇宙的同时阻止宇宙本身向深渊跌落。\n往好处想，你至少有五十年以上的时间在这个迅速死亡的宇宙里享受平静的生活，这不能说不是一件好事，对吧。"
 SRA_Chief.614.desc:0 "哼。\n你该走了。"
 SRA_Chief.615.desc:0 "那么再会了，洛琪亚·路希维亚，祝你好运。"
 SRA_Chief.615.a.tooltip:0 "BE5：片刻安眠"


 SRA_Chief.620.desc:0 "§Y庞大的如星球般徘徊着的半透明实体被失控的能量撕碎，原本连接在上面的逸散触须破裂四散。§!\n\n啧，到此为止了吗？"
 SRA_Chief.621.desc:0 "§Y不是真正的深渊本质，就无法无视凡人的挣扎，约束破碎，一切自然化为泡影。\n浓雾在她的掌心燃烧，如大海翻腾，风暴咆哮，极速分化的深渊能量化作光与热，新星般闪耀。\n结束了，那个任性的女人容许的只有张扬的登台和华丽的落幕。自己的剧目已宣告结束，继续挣扎毫无意义，还不如去别的地方重新开始……不是第一次了，或者说，早就习惯了。§!\n\n你有什么想问的吗？"
 SRA_Chief.621.a:0 "你做了什么？"
 SRA_Chief.621.a.response:0 "我早在之前就收集了许多灾疫的样本，我复制了自己的意识并置入其中，让它成长为庞大的的复合思维实体，并以此作为容器约束我引导出的庞大深渊能量。\n这一容器就是你们所称的灾疫之心，它会试图调谐它内部的能量，将其塑造为自己的完型。在那以后，容器会解体，已被定义的深渊能量会迅速扩散并同化整个宇宙。"
 SRA_Chief.621.b:0 "你想要什么？"
 SRA_Chief.621.b.response:0 "你一路走来不是很了解吗？所谓的忠诚与信任只不过是口头的宣言，真正能够相信的只有手中紧握的力量。你难道不也在重塑这个世界吗？你统治你征服，你用自己的规则取代所有的规则，你希望这是绝对的，永恒的。\n我要的东西很简单。\n我要自己的未来。\n不被任何事扭曲，不被任何人支配，只属于我自己的人生，这就是我想要的一切。"
 SRA_Chief.621.c:0 "我没什么想说的。"
 SRA_Chief.621.d:0 "我们就不能谈谈吗？"

 SRA_Chief.622.desc:0 "那就这样吧。\n愿你我的前路再无交集，也愿你我的命运不再被§B欺诈者§!和§R操纵者§!左右。\n我该走了，也许在某个地方还存在着我的安身之处。\n\n§Y她于太空中坠落，消失在迷雾之中。§!"
 SRA_Chief.622.a.tooltip:0 "TE：剧目终场"
 SRA_Chief.623.desc:0 "你……是否清醒？\n你想要挽留我，想要我装模作样地效忠于你，即便在这样的事情之后？\n你是觉得适当的['concept_SRA_SD_Abyss_Erosion']对你的文明有好处吗，你刚刚才阻止我这么做。\n还是说，你只是个单纯的蠢货，觉得自己有能力控制一切，这个小小的洛琪亚跟自家的路希维亚议长和希德拉总管没什么区别，都是"乖巧听话的可爱美少女"，构不成任何威胁，不会有任何问题？"
 SRA_Chief.623.a:0 "我可以给你你想要的。"
 SRA_Chief.623.b:0 "也许能有一份妥协的契约？"
 SRA_Chief.623.c:0 "看来没得谈了。"

 SRA_Chief.624.desc:0 "那好吧，我希望你立即，完全而彻底的交付包括你自己在内所有人的完全控制权，在我们亲爱的希德拉面前公证，并确保其能够绝对且永恒的实现。我应当彻底掌控你们的存在，并在任何需要的时候任意更改或抹除，以此确保你们不会产生任何威胁。\n这就是我想要的，你很清楚。我们之间的矛盾没有任何调谐的可能，我不接受你们的自由意识，我不接受他者的存在。"
 SRA_Chief.624.a:0 "我同意。"
 SRA_Chief.624.a.tooltip:0 "§B你不会真的想选这个吧？§!"
 SRA_Chief.624.b:0 "看来没得谈了。"

 SRA_Chief.625.desc:0 "令人惊讶……你……\n我感觉有些荒谬，仿佛我这么多年的努力其实毫无意义，我要做的只是开口，然后你就会高举双手就地投降。\n唉，既然如此。\n永别咯。"



