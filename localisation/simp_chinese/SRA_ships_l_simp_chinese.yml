l_simp_chinese:
 SRA_Cruiser:0 "星规巡航单元"
 SRA_Cruiser_cap: "$SRA_Cruiser$"
 SRA_Cruiser_plural:0 "星规巡航单元"
 SRA_Cruiser_desc:0 "§B护卫舰，驱逐舰，巡洋舰，所谓的非主力舰，一切不需要巨炮和重甲的任务都由巡航单元负责。§!\n这型五千米长的战舰作为先锋和斥候，以及护卫行动。低消耗和高灵活性，配合恰到好处的火力，使大量分散部署的巡航单元能迅速扫清反抗能力较差的目标。无论何处，巡航单元总是最多的。"
 SHIP_GRAPHICS_SRA_CRUISER_DESC: "$SRA_Cruiser_desc$"
 SRA_Cruiser_MID:0 "星规巡航单元"
 #SRA_Cruiser_BOW:0 "审判执行阵列"
 #SRA_Cruiser_MID:0 "联合攻击模块"
 #SRA_Cruiser_STERN:0 "核心拦截系统"
 SRA_Executor:0 "星规执行单元"
 SRA_Executor_cap: "$SRA_Executor$"
 SRA_Executor_plural:0 "星规执行单元"
 SRA_Executor_desc:0 "§B重炮主力舰，火力平台。§!\n十五千米的舰体全副武装，特别补充的储能阵列配合中轴设置的特化型歼灭主炮力求抹杀任何规模的敌对目标，在重要战线上投入的执行单元集群往往所向披靡。"
 SHIP_GRAPHICS_SRA_EXECUTOR_DESC: "$SRA_Executor_desc$"
 SRA_Executor_MID:0 "星规执行单元"
 #SRA_Executor_BOW:0 "审判执行阵列"
