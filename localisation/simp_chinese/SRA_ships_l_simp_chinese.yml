 SRA_Spear_Of_Galaxy_Zenith_desc:0 "§B于第三远征后期设计的舰队支援母舰，作战火力平台，超级旗舰。用于大型舰队战，攻坚战，长程火力支援和单舰突进。\n唯一一种搭载了时空相位引擎的星规阵列舰船，这使得有着星穹之矛支持的舰队不再需要远行要塞和远行信标的供能。同时时空相位引擎也能为星穹之矛提供额外支持，在战斗中创造巨大的优势。§!"
