 SRA_Adjudicator_cap: "$SRA_Adjudicator$"
 SRA_Adjudicator_plural:0 "星规裁决单元"
 SRA_Adjudicator_desc:0 "§B基于一定程度的分布式主机部署和战地指挥需求，综合支援舰和舰队旗舰融合的产物。§!\n长达四十五千米的巨舰搭载了大规模的机组，在可能存在连接中断的复杂空间环境下能完成战斗任务并进行下一步决策的演算。除此之外，其武器配置也相当慷慨。"
