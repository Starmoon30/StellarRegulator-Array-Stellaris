 SRA_RE_Government.2.name:0 "幕前准备"
 SRA_RE_Government.2.desc:0 "你好，墙外的干涉者，你可以在这里选择接下来要参与的 §R剧本§! 。\n滑条在对话框右边，不用谢。\n请确保全程有且仅有你的文明拥有“路希维亚帝国”国民理念，免得出现什么Bug。（本国策AI禁用，请注意回避强制改变国策的事件。）\n§Y确认您已经足够了解您当前使用的Mod合集中的其他Mod，并已阅读过“星规技术”国民理念相关的故事文本，这对你了解故事背景很有帮助。\n注意，首次游玩请尽量避免点击Skip，我可不知道会出什么事，而且你不就是为了剧情而来的嘛。§!\n。"
 SRA_RE_Government.2.a:0 "陨落之矛"
 SRA_RE_Government.2.a.custom_tooltip:0 "这个文明曾半步踏入群星之间，却又为同族相残的战乱所困，往昔的盛世毁于一旦。\n所幸，一支势力在一座古老的遗迹中找到了一条可以免于灭亡的道路。\n来自异界的存在降临于这片大地上，终结了一切纷争，让这个文明得以再度着眼于群星。\n如今，这个文明突破了光速的壁垒，进升为星海间的一员。\n然而，没有人知道，这条本不存在的道路，究竟会通往何方。\n\n-与§B路希维亚§!、§R希德拉§!、§B星规§!建立通讯\n-§B路希维亚§!将成为领导人\n-母星上有一艘坠毁的星穹之矛等待发掘\n-历史的尘埃飘落在星海间"
 SRA_RE_Government.2.b:0 "龙翼之影"
 SRA_RE_Government.2.b.custom_tooltip:0 "这一文明从上古时代就战栗于一双龙翼的阴影之下，与深渊的呢喃和扭曲的倒影斗争，竭尽全力只图片刻喘息。\n尽管未曾踏遍大地，却仍向着天穹启航。\n如果可以将星辰的力量凝于指尖，能撕破那片阴影吗？\n\n-母星变为 §R树海残枝§! ，一个有着无尽潜能的特殊天体类型。然而，不可捉摸的 §R['concept_SRA_SD_Abyss_Erosion']§! 一直以来都是挥之不去的梦魇。\n-一旦失去了母星的控制权，你的国家就会 §R毁灭§! 。\n-立即使你的所有物种获得['trait:trait_pc_SRA_SD_chaos_star_habitable_preference']。\n-狞桀恣睢的 §R深渊之龙§! 将笼罩在你的文明之上，从古至今，只有屈从才能免于毁灭。\n-§R深渊之龙§!索取§R任何形式的财富§!，特别是最珍贵的那些……§R无论是生灵还是死物§!。\n-彻底臣服于龙影的生杀予夺之下，或是以剑与杖呼唤属于自己的命运。\n\n§Y根本没做§!"


 SRA_RE_Government.3.desc:0 "嗯……在本剧本中，我，路希维亚，将成为你国家的领导人，如果你的政体不允许连任或因为其他原因导致领导人发生了改变，你可以在特殊菜单中让我重新就任。\n接下来，你将与我和希德拉一道，带领着这个新兴文明走向星海，面对这片隐藏着无数秘密的银河。\n让我们开始吧。"

 SRA_RE_Government.4.desc:0 "你好，新任的执行官。\n我是路希维亚，最高议会议长，也就是这个国家的最高领导人。"
 SRA_RE_Government.5.desc:0 "希德拉，帝国安全总局总管，同时也负责统辖秘密理事会。\n你好啊,外来者。"
 SRA_RE_Government.6.desc:0 "你从32767个候选人中脱颖而出，证明了你是最适合这个位置的人，欢迎来到权力的顶峰。\n你瞧，自我们的文明踏出了迈向星海的第一步，我就感到有必要找一个人来帮忙处理这无穷无尽的事务了。希望你可以不负众望，做出正确的抉择，让这个国家迈向繁荣。"
 SRA_RE_Government.7.desc:0 "执行官这个岗位类似于最高议长的代理人，兼顾了低调和高权限的特点，你想去哪就能去哪。\n另外，路希给了你充足的权力去规划这个国家,制定它的路线，虽然表面上你只是一个顾问或者参谋，但只要你把你的想法提交给路希，她就会调动相关部门去执行。\n无论你的决定有多么荒唐。"
 SRA_RE_Government.8.desc:0 "嘛，适度摸鱼有益身心健康。\n而且这次也没什么思路……没有什么特别想走的路线，不如交给你好了。\n嗯……这句话是第几次说了……"
 SRA_RE_Government.9.desc:0 "每次我们都会这么说吧……\n习惯就好。\n明天早上记得去办公室，你的秘书会来报道，别让她等太久了。"

 SRA_RE_Government.10.desc:0 "当你操纵着这副身躯走进办公室时，你发现你的那位助手正凝望着宽阔的落地窗外的天空。\n意外的是，那个身影你是如此地熟悉。\n但在你说出她的名字之前，她转过了身。\n淡蓝色的长发轻轻飘起，然后垂落。\n她注视着你。\n用一种陌生的眼神。"
 SRA_RE_Government.11.desc:0 "很高兴能为您效劳，执行官。我是您的秘书和助手，星规阵列，您可以简单一点，就叫我星规吧。"
 SRA_RE_Government.12.desc:0 "我是来自这个文明所称的“遗迹”——也就是一艘坠毁的星穹之矛中的人工智能。在被唤醒后，我遵循路希维亚议长的命令，为这个文明提供力所能及的帮助。\n不过现在我也就只能做做文书工作啦，我的数据库严重受损，时空相位引擎也完全损坏了，没有外界的供能，我连正常行动都做不到。"
 SRA_RE_Government.13.desc:0 "但是呢，如果您可以找到其他的星规阵列相关的遗迹，我就可以尝试通过那些遗留下来的水晶恢复一些数据库内容，到时候把船体修好，重新飞起来，乃至修复时空相位引擎，都是有可能的。\n不过我们还是从探索这个银河系开始吧，做事情要一步一步来，不是吗？\n§B你可以在法令和通讯界面联系星规或者我，不用谢。§!"
 SRA_RE_Government.13.a:0 "来吧，好戏开场了。"
 SRA_RE_Government.13.b:0 "银河的权柄属于我们。"
 SRA_RE_Government.13.c:0 "我会让你再度启航。"

