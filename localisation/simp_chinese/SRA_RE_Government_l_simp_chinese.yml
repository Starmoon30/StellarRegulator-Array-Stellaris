 MESSAGE_SRA_RE_Rocivia_TITLE:0 "§B路希维亚§!"
 SRA_RE_Rocivia.2019.desc:0 "这地方基本上只能塞四五十个字，不过鼠标放上去可以显示完整内容。\n\n嘿我试试贴个图进来\n\n\n\n\n\n\n£pc_SRA_chaos_star_sky£\n\n\n\n\n\n\n\n我去还真能"

 MESSAGE_SRA_RE_StellarRegulator_TITLE:0 "§B星规§!"

 SRA_RE_Rocivia_catch_phrase:0 "“骑上银龙的背脊,去吧,前往生命的荒漠;骑上银龙的背脊,去吧,穿过云雨的漩涡——”"
 SRA_RE_Rocivia_backstory:0 "\n§B路希维亚§!，最高议长，帝国的领导人。据称她在这个文明的前太空时代领导起了一支队伍，并最终征服其他势力统一了整个文明。不过如今她似乎失去了热情，选择把帝国规划交给§Y你§!，自己每天只是花几分钟把你的想法写成能用的方案。\n\n§B星光渺远，闪烁着捏造而成的形象，其后掩盖的仍是冰冷的虚空。§!"
 job_SRA_RE_Rocivia_job:0 "§B九环至尊星辉魔法使§!"
 job_SRA_RE_Rocivia_job_desc:0 "至少她是这么说的。\n那么唯物主义魔法使会用面向对象语言写卷轴吗？"


 councilor_SRA_RE_minister_of_security:0 "帝国安全总管"
 councilor_SRA_RE_minister_of_security_female:0 "$councilor_SRA_RE_minister_of_security$"
 councilor_SRA_RE_minister_of_security_desc:1 "§R此席位只能由 希德拉 就任。§!\n$TITLE$全权负责安全局的工作，下辖多支灵能特工部队与复杂情报网，仅受最高议长的管辖。不过§R希德拉§!似乎并不怎么关心这个岗位，倒是经常去别的地方闲逛。"


 SRA_RE_Hidra_catch_phrase:0 "一切始于无际之树海，也将终于混沌深渊中。"
 SRA_RE_Hidra_backstory:0 "\n§R希德拉§!，帝国安全总局总管，秘密理事会统辖。习惯于擅离职守，总是从容不迫。她盘踞在云巅之峰，俯瞰着芸芸众生，肆意播撒着祝福与诅咒。\n\n§R暗影翻腾，凝聚出徒有其表的外形，其下深藏的仍是无序的深渊。§!"
 job_SRA_RE_Hidra_job:0 "§R无所事事骗吃骗喝§!"
 job_SRA_RE_Hidra_job_desc:0 "真的，找了很多理由来摸鱼。\n你不会想看到她活跃起来的样子的。"


