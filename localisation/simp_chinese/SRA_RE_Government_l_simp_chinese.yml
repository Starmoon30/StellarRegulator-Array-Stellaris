 leader_trait_SRA_RE_ruler1:0 "§B最高议长路希维亚§!"
 leader_trait_SRA_RE_ruler1_desc:0 "§B“她终结了过去，开启了未来。她的传奇将被永世传颂，直到时间的尽头。”§!"
 leader_trait_SRA_RE_ruler2:0 "§B深渊的智识§!"
 leader_trait_SRA_RE_ruler2_desc:0 "§B“掌握着诸界焦点中的无限智慧，她洞悉过去与未来，对一切了然于心。”§!"
 leader_trait_SRA_RE_Hidra_gov:0 "§R希德拉-绝赞摸鱼中§!"
 leader_trait_SRA_RE_Hidra_gov_desc:0 "§R反正是摸鱼，描述什么的也先摸了好了。§!"
 leader_trait_SRA_RE_Hidra_sci:0 "§R希德拉-漫步星海§!"
 leader_trait_SRA_RE_Hidra_sci_desc:0 "§R古老而神秘的存在，在真实帷幕的彼方漫步。她只言片语中流露宝贵的知识，闲庭信步中踏行真理的道途。即便只是随意的消遣与娱乐，她展现出的能力也依然令人叹为观止。§!"
