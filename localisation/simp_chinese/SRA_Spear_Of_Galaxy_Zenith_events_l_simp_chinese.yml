 SRA_mini_menu_choose_button_duplicate_target:0 "不可选中重复的目标"

 SRA_Spear_Of_Galaxy_Zenith.51:0 "新星终结-目标锁定"
 SRA_Spear_Of_Galaxy_Zenith.51.desc:0 "§B「星穹之矛跨星系打击系统已锁定目标」§!\n当前目标\n「§H[SRA_mini_menu_choose_button_target.GetName]§!」\n您可以在这里选择攻击目标的方式。\n§R警告：摧毁某些包含特殊事件的恒星系，或者摧毁拥有特殊机制的舰队，都有可能造成事件链中断，危机无法结束等严重问题。请妥善使用这件强大的武器，避免造成星系级别的逻辑错误。§!"
 SRA_Spear_Of_Galaxy_Zenith.51.a:0 "星系毁灭模式"
 SRA_Spear_Of_Galaxy_Zenith.51.a.desc:0 "使用§B「新星终结」§!直接摧毁目标所在恒星系，此后跨星系打击系统进入360天的冷却时间。"
 SRA_Spear_Of_Galaxy_Zenith.51.b:0 "舰队肃清模式"
 SRA_Spear_Of_Galaxy_Zenith.51.b.desc:0 "使用反集群打击模式，在目标位置投射一个存在15天的相位空间投影并攻击目标恒星系内的所有敌人，此后跨星系打击系统进入360天的冷却时间。"
 SRA_Spear_Of_Galaxy_Zenith.51.c:0 "选择下一个目标"
 SRA_Spear_Of_Galaxy_Zenith.51.c.desc:0 "这将保存当前的目标标记，并回退至选择器界面。"
