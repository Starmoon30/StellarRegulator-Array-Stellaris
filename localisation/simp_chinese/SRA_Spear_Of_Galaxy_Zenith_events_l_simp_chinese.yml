l_simp_chinese:
###############################
 #操作所需的能量币和星界丝缕其实是星规收取的手续费，因为她帮你套了一层操作系统，实际控制还是由星规完成的。
 #全长135千米。星穹之矛，所向无敌！
 #项目中不包含随舰狂热者军团，你也不是大主教，尽管你同样也缺少高质量AOE。
 #这艘船不是星梭号或者悖论引擎！保修不包含任何因撞击造成的损坏。

 #远行要塞的互锁机制是不完善的，它成本高昂且存在弱点。如果有人能发掘这一保护的链条，他就有可能摧毁整个体系。因此星穹之矛被设计出来，用来取代远行要塞和航标，担任舰队的核心，并为整个舰队提供能量。
 #它既可以被投入到任何焦灼的正面战场上，作为一张王牌，主宰战局。也可以逃过任何追杀和捕捉，将自己隐藏在没人知道的角落。它的时空相位引擎为一整只远征军供能，失去了星穹之矛，远征军只能持续战斗不长的时间——大约几千年。
 #它如同其他星规舰船一样，由星辉分形打造，这种令人惊骇的材料能够在质能间流转，任意切换形态和功能。因此星穹之矛可以随意改变它的构造，并以超乎想象的速度修复自己，只要能量足够。它几乎不存在弱点，即便被孤立，它也能独自重建整个舰队。
 #每个星穹之矛同时还是星规的载体，一个远征军通常有成百上千艘星穹之矛，它们共同承载一个星规个体的意识，完型意识。可以说，星穹之矛承载文明本身，因为它是星规的分形，包含基本要素。星穹之矛是一个完型意识的最小单位，其他舰船没有能力承载也不准备承载这样的意识，其他舰船只是被遥控的自律机械。

 ###### 局势 ######
 
 SRA_SOGZ_main_situation:0 "星穹之矛状态"
 SRA_SOGZ_main_situation_type:0 "星穹之矛状态"
 SRA_SOGZ_main_situation_desc:0 "这里显示的是星穹之矛当前的§B相位能量§!水平，§B相位能量§!是星穹之矛的储备能源，可以用于激活各种主动效果。\n你可以在这里打开星穹之矛的控制面板。"
 SRA_SOGZ_main_situation_monthly_change_tooltip:0 "星穹之矛的§B相位能量§!储备会以一个稳定的速度增长，它可以因为某些原因而加速增长，也可以被某些功能持续消耗。"

 SRA_SOGZ_main_situation_progress_complete:0 "星穹之矛完全充能，无法继续储备§B相位能量§!。"
 SRA_SOGZ_main_situation_fail:0 "星穹之矛储能耗尽，无法激活任何需要§B相位能量§!的功能。"
 sra_sogz_main_situation_stage_1:0 "相位能量水平低"
 sra_sogz_main_situation_stage_1_effects:0 "当前能量水平较低，需要慎重的使用能量。"
 sra_sogz_main_situation_stage_2:0 "相位能量水平中"
 sra_sogz_main_situation_stage_2_effects:0 "当前能量水平中等，拥有相对可靠的能量储备来应对各种情况。"
 sra_sogz_main_situation_stage_3:0 "相位能量水平高"
 sra_sogz_main_situation_stage_3_effects:0 "当前能量水平较高，是时候火力全开了。"
 sra_sogz_main_situation_stage_4:0 "相位能量水平满"
 sra_sogz_main_situation_stage_4_effects:0 "当前能量水平已满，无法继续充能。"
 SRA_SOGZ_main_situation_open_menu:0 "打开菜单"
 SRA_SOGZ_main_situation_open_menu_effect:0 "打开星穹之矛的控制菜单。"
 SRA_SOGZ_main_situation_open_menu_tooltip:0 "打开星穹之矛的控制菜单"
 SRA_SOGZ_main_situation_charge:0 "运行中"
 SRA_SOGZ_main_situation_charge_effect:0 "星穹之矛持续充能中。"
 SRA_SOGZ_main_situation_charge_tooltip:0 "运行中的星穹之矛会持续储备相位能量以备后用。"
 SRA_SOGZ_main_situation_charge_stop:0 "星穹之矛当前能量水平已满，无法继续充能"
 SRA_SOGZ_menu_sub_5_3_charge_stop:0 "星穹之矛当前激活了§B飘落传说§!，因此无法充能"
 SRA_SOGZ_menu_sub_5_2_charge:0 "星穹之矛当前激活了§B末世浩劫§!，因此充能速度加倍"


 SRA_mini_menu_choose_button:0 ""

 casus_belli_cb_SRA_SOGZ:0 "星穹之矛"
 war_goal_wg_SRA_SOGZ:0 "$war_goal_wg_colossus$"
 war_goal_wg_SRA_SOGZ_desc:0 "星穹之矛统御星海，执掌命运。矛尖所指之处，即为帝国边疆。"
 
 casus_belli_cb_SRA_stop_SOGZ:0 "$casus_belli_cb_SRA_SOGZ$"
 war_goal_wg_SRA_stop_SOGZ:0 "$war_goal_wg_end_threat$"
 war_goal_wg_SRA_stop_SOGZ_desc:0 "这个拥有未知的先进技术和匪夷所思的战舰的文明是整个银河系的威胁，为了星海的安定，必须将其消灭。"

 SRA_SPEAR_OF_GALAXY_ZENITH:0 "理解如何操纵星穹之矛"
 SRA_SPEAR_OF_GALAXY_ZENITH_DESC:0 "尽管折越程序已经就绪，但我们对这艘超级战舰还几乎一无所知。在它正式抵达并成为我们舰队的强大助力之前，我们必须掌握星穹之矛的各项性能，并理解如何操纵这一庞然大物。"

 SRA_Spear_Of_Galaxy_Zenith.1:0 "星穹之矛"
 SRA_Spear_Of_Galaxy_Zenith.1.desc:0 "星穹之矛已经抵达您的首都上空并归属您指挥，这是一件无比强大的武器，远超任何常规舰船。"
 SRA_Spear_Of_Galaxy_Zenith.1.a:0 "很好。"
 SRA_Spear_Of_Galaxy_Zenith.2:0 "星穹之矛"
 SRA_Spear_Of_Galaxy_Zenith.2.desc:0 "§B「星穹之矛控制系统已启动」§!\n您可以在这里配置星穹之矛的各项功能，调用它的各项系统。如果星穹之矛被摧毁而紧急折越逃脱，您可以在这里重新部署它。"
 SRA_Spear_Of_Galaxy_Zenith.2.a:0 "打开配置面板"
 SRA_Spear_Of_Galaxy_Zenith.2.2_1:0 "激活寰宇之帜"
 SRA_Spear_Of_Galaxy_Zenith.2.2_1.desc:0 "配置舰首引导航标，为整个星系的舰队计算航线并指定机动逻辑，优化其相关性能。与此同时，启动折跃投送系统，使我们的所有舰船可以跃迁。\n\n消耗：§Y25 相位能量§!\n冷却时间：180.00£time£\n持续时间：180.00£time£\n帝国内的友方舰船:\n跃迁能力：§G解锁§!\n$MOD_SHIP_SPEED_MULT$：§G+200%§!\n$MOD_SHIP_EVASION_MULT$：§G+100%§!\n$MOD_SHIP_WINDUP_MULT$：§G-200%§!\n$MOD_SHIP_FTL_JUMPDRIVE_RANGE_MULT$：§G+800%§!\n$MOD_SHIP_JUMPDRIVE_COOLDOWN_MULT$：§G-200%§!"
 SRA_Spear_Of_Galaxy_Zenith.2.2_2:0 "激活彗耀迫临"
 SRA_Spear_Of_Galaxy_Zenith.2.2_2.desc:0 "配置舰首引导航标，引导一支预先准备的舰队立即增援到星穹之矛所在位置，存在多种舰队类型以供选择，舰队类型会影响所需支付的资源和后续的冷却时间。\n\n消耗：§Y25 相位能量§!\n冷却时间：不定"
 SRA_Spear_Of_Galaxy_Zenith.2.2_3:0 "激活星阵卫戍"
 SRA_Spear_Of_Galaxy_Zenith.2.2_3.desc:0 "配置舰首引导航标，将时空相位引擎的内部空间中储备的星阵卫戍舰队及要塞立即部署到星穹之矛所在位置，下一批舰队需要 360.00£time£ 来重新准备。\n\n消耗：§Y200 相位能量§!\n冷却时间：360.00£time£"
 SRA_Spear_Of_Galaxy_Zenith.2.4_1:0 "激活爆华绽放"
 SRA_Spear_Of_Galaxy_Zenith.2.4_1.desc:0 "配置打击压制模块，使星穹之矛对敌方舰队进行覆盖式打击，对恒星系内所有敌人造成大量伤害。\n\n消耗：§Y50 相位能量§!\n冷却时间：30.00£time£\n持续时间：10.00£time£\n恒星系内的敌方舰船:\n每1.00£time£受到 §R5000§! 伤害"
 SRA_Spear_Of_Galaxy_Zenith.2.4_2:0 "激活溟乎远响"
 SRA_Spear_Of_Galaxy_Zenith.2.4_2.desc:0 "配置打击压制模块，使星穹之矛对恒星系进行爆发性能量压制，弱化所有敌方舰船的防御结构并破坏其穿透抗性。\n\n消耗：§Y50 相位能量§!\n冷却时间：180.00£time£\n持续时间：30.00£time£\n恒星系内的敌方舰船:\n$MOD_SHIP_SHIELD_REDUCTION$：§R80%§!\n$MOD_SHIP_ARMOR_REDUCTION$：§R80%§!\n$MOD_SHIP_SHIELD_HARDENING_ADD$：§R-200%§!\n$MOD_SHIP_ARMOR_HARDENING_ADD$：§R-200%§!"
 SRA_Spear_Of_Galaxy_Zenith.2.4_3:0 "激活苍星陨灭"
 SRA_Spear_Of_Galaxy_Zenith.2.4_3.desc:0 "配置打击压制模块，使星穹之矛在恒星系中央放置一颗高度压缩的相位能量星体，并在短暂延迟后爆发，对整个恒星系内的一切敌对舰队造成毁灭性的打击。\n\n消耗：§Y50 相位能量§!\n冷却时间：180.00£time£\n延迟：5.00£time£\n持续时间：30.00£time£\n恒星系内的敌方舰船:\n每1.00£time£受到 §R无法估量的§! 伤害"
 SRA_Spear_Of_Galaxy_Zenith.2.6_1:0 "激活新星终结"
 SRA_Spear_Of_Galaxy_Zenith.2.6_1.desc:0 "配置时空相位引擎，使用星穹之矛的强大武器藉由时空相位引擎的协助向目标恒星系发起攻击。使用反集群打击模式时，将在目标恒星系投射一个存在15天的相位空间投影并攻击目标恒星系内的所有敌人；使用星系摧毁模式时，将使用§B「新星终结」§!直接摧毁目标恒星系。\n\n消耗：§Y50 相位能量§!\n冷却时间：360.00£time£"
 SRA_Spear_Of_Galaxy_Zenith.2.6_2:0 "激活奇点爆发"
 SRA_Spear_Of_Galaxy_Zenith.2.6_2.desc:0 "配置时空相位引擎，重定向时空相位引擎能量输出，激活大部分能量储备，充能['concept_SRA_Stellarcrystal_Fractal']使其进入半能化，极大幅度地增强武器的输出密度，并使得接近能量化的舰体能够迅速修复几乎任何类型的损伤。\n\n消耗：§Y100 相位能量§!\n冷却时间：360.00£time£\n持续时间：60.00£time£\n星穹之矛:\n§Y不会被摧毁§!\n§B寰宇溃灭§!：§G四倍射速§!\n$MOD_SHIP_SHIELD_DAMAGE_MULT$：§G+200%§!\n$MOD_SHIP_ARMOR_DAMAGE_MULT$：§G+200%§!\n$MOD_SHIP_HULL_DAMAGE_MULT$：§G+200%§!\n$MOD_SHIP_SHIELD_PENETRATION_MULT$：§G+2000%§!\n$MOD_SHIP_ARMOR_PENETRATION_MULT$：§G+2000%§!\n$MOD_SHIP_DAMAGE_REDUCTION_MULT$：§G+200%§!\n$mod_mod_SRA_clear_ship_damage_reduction_mult_resistance$：§G+1§!\n$MOD_SHIP_TARGET_WEIGHT_MULT$：§Y+800%§!"
 SRA_Spear_Of_Galaxy_Zenith.2.6_3:0 "激活事件视界"
 SRA_Spear_Of_Galaxy_Zenith.2.6_3.desc:0 "配置时空相位引擎，使时空相位引擎抽取能量储备以完成充能，随后消耗巨量能量扩大其作用范围至整个星系，极大幅度地减缓所有敌对舰队的攻击和移动速度，构成类似于时间静止的效果。\n\n消耗：§Y100 相位能量§!\n冷却时间：360.00£time£\n持续时间：20.00£time£\n星系内的敌方舰船:\n$MOD_SHIP_DISENGAGE_CHANCE_REDUCTION$：§R1000%§!\n$MOD_SHIP_SPEED_MULT$：§R-4000%§!\n$MOD_SHIP_WEAPON_RANGE_MULT$：§R-4000%§!\n$MOD_SHIP_EVASION_MULT$：§R-4000%§!\n$MOD_SHIP_ACCURACY_MULT$：§R-4000%§!\n$MOD_SHIP_TRACKING_MULT$：§R-4000%§!\n\n§Y对拥有动态调整系统的舰队无效§!"

 SRA_Spear_Of_Galaxy_Zenith.2.e:0 "重新部署星穹之矛"
 SRA_Spear_Of_Galaxy_Zenith.2.e.desc:0 "修复严重受损的星穹之矛并将其重新部署至您的首都。"


 SRA_Spear_Of_Galaxy_Zenith.10:0 "次级控制面板"
 SRA_Spear_Of_Galaxy_Zenith.10.desc:0 "§B「星穹之矛次级控制面板已就绪」§!\n您可以在这里配置星穹之矛的各项功能。"
 SRA_Spear_Of_Galaxy_Zenith.10.a:0 "激活增压超频"
 SRA_Spear_Of_Galaxy_Zenith.10.a.desc:0 "开启后所有系统的资源消耗提升至四倍，舰队折越系统和跨星系打击系统冷却时间极大幅度缩短，奇点爆发模式冷却时间缩短至一半。\n§Y舰队折越系统折越舰队所需要的合金不会增加。§!\n§Y时间冻结系统不受其影响。§!"
 SRA_Spear_Of_Galaxy_Zenith.10.b:0 "关闭增压超频"
 SRA_Spear_Of_Galaxy_Zenith.10.b.desc:0 "增压超频已激活，点击关闭。"
 SRA_Spear_Of_Galaxy_Zenith.10.c:0 "激活不朽协议"
 SRA_Spear_Of_Galaxy_Zenith.10.c.desc:0 "即将被摧毁时将不再直接紧急折越，可选择消耗160000能量币320000合金64000星界丝缕原地瞬间修复至完整状态。"
 SRA_Spear_Of_Galaxy_Zenith.10.d:0 "关闭不朽协议"
 SRA_Spear_Of_Galaxy_Zenith.10.d.desc:0 "不朽协议已激活，点击关闭。"
 SRA_Spear_Of_Galaxy_Zenith.10.e:0 "§B「新星终结」§!切换至净化模式"
 SRA_Spear_Of_Galaxy_Zenith.10.e.desc:0 "调整歼星级位面撕裂武器§B「新星终结」§!的能量输出水平，将武器转化为清扫行星上所有智慧生命的净化模式。"
 SRA_Spear_Of_Galaxy_Zenith.10.f:0 "§B「新星终结」§!切换至毁灭模式"
 SRA_Spear_Of_Galaxy_Zenith.10.f.desc:0 "调整歼星级位面撕裂武器§B「新星终结」§!的能量输出水平，将武器转化为直接摧毁行星的毁灭模式。"
 SRA_Spear_Of_Galaxy_Zenith.10.g:0 "将武器系统切换至可调整模式"
 SRA_Spear_Of_Galaxy_Zenith.10.g.desc:0 "将武器配置切换至可调整模式（即使用§B「星规武器」§!标签的武器）。"
 SRA_Spear_Of_Galaxy_Zenith.10.h:0 "将武器系统切换回常规模式"
 SRA_Spear_Of_Galaxy_Zenith.10.h.desc:0 "将武器配置切换回常规模式。"


 SRA_Spear_Of_Galaxy_Zenith.20:0 "舰队折越系统"
 SRA_Spear_Of_Galaxy_Zenith.20.desc:0 "§B「星穹之矛舰队折越系统已就绪」§!\n您可以在这里选择您要部署的舰队类型。"
 SRA_Spear_Of_Galaxy_Zenith.20.a:0 "折越歼灭执行舰队"
 SRA_Spear_Of_Galaxy_Zenith.20.a.desc:0 "立即在星穹之矛位置折越一支歼灭执行舰队，包含2艘星规裁决单元和46艘星规执行单元，此后舰船折越系统进入240天的冷却时间。§Y具体设计取决于您舰船设计器中的设计，请确保您至少拥有一个设计。§!"
 SRA_Spear_Of_Galaxy_Zenith.20.b:0 "折越战列舰队"
 SRA_Spear_Of_Galaxy_Zenith.20.b.desc:0 "立即在星穹之矛位置折越一支战列舰队，包含2艘泰坦和32艘战列舰，此后舰船折越系统进入240天的冷却时间。§Y具体设计取决于您舰船设计器中的设计，请确保您至少拥有一个设计。§!"
 SRA_Spear_Of_Galaxy_Zenith.20.c:0 "折越裁决舰队"
 SRA_Spear_Of_Galaxy_Zenith.20.c.desc:0 "立即在星穹之矛位置折越一支裁决舰队，包含2艘星规裁决单元、16艘星规执行单元和32艘星规巡航单元，此后舰船折越系统进入240天的冷却时间。"


 SRA_Spear_Of_Galaxy_Zenith.32:0 "星穹之矛-不朽协议"
 SRA_Spear_Of_Galaxy_Zenith.32.desc:0 "§B「检测到不朽协议已激活」§!\n当前星穹之矛已严重受损，您可以启动不朽协议以瞬间完全修复星穹之矛的损伤，或者启用静滞系统来隔离星穹之矛，等待30天后再进行选择。"
 SRA_Spear_Of_Galaxy_Zenith.32.a:0 "启动不朽协议"
 SRA_Spear_Of_Galaxy_Zenith.32.b:0 "启动静滞系统"
 SRA_Spear_Of_Galaxy_Zenith.32.c:0 "启动紧急跃迁"


 SRA_Spear_Of_Galaxy_Zenith.40:0 "跨星系打击系统"
 SRA_Spear_Of_Galaxy_Zenith.40.desc:0 "§B「星穹之矛跨星系打击系统已就绪」§!\n您可以在这里选择瞄准目标恒星系的方式。"
 SRA_Spear_Of_Galaxy_Zenith.40.a:0 "信标锁定模式"
 SRA_Spear_Of_Galaxy_Zenith.40.a.desc:0 "一个跨星系打击信标将出现在星穹之矛旁，将其折越到目标恒星系以定位。"
 SRA_Spear_Of_Galaxy_Zenith.40.b:0 "星系选择器模式"
 SRA_Spear_Of_Galaxy_Zenith.40.b.desc:0 "打开星系选择器界面，可以最多瞄准五个目标。"
 SRA_Spear_Of_Galaxy_Zenith.40.c:0 "目标选择器模式"
 SRA_Spear_Of_Galaxy_Zenith.40.c.desc:0 "选择器开启后，在目标所在恒星系用鼠标选中目标，然后点击按钮锁定此目标，然后进入下一步确认目标并选择攻击模式。"


 SRA_Spear_Of_Galaxy_Zenith.43:0 "新星终结-目标锁定"
 SRA_Spear_Of_Galaxy_Zenith.43.desc:0 "§B「星穹之矛跨星系打击系统已锁定目标」§!\n您可以在这里选择攻击目标星系的方式。\n§R警告：摧毁某些包含特殊事件的恒星系或危机刷新点等位置，摧毁拥有特殊机制或击杀事件的舰队，都可能造成事件链中断，危机无法结束等严重问题。请妥善使用这件强大的武器，避免造成星系级别的逻辑错误。§!"
 SRA_Spear_Of_Galaxy_Zenith.43.a:0 "星系毁灭模式"
 SRA_Spear_Of_Galaxy_Zenith.43.a.desc:0 "使用§B「新星终结」§!直接摧毁目标恒星系，此后跨星系打击系统进入180天的冷却时间。"
 SRA_Spear_Of_Galaxy_Zenith.43.b:0 "舰队肃清模式§!"
 SRA_Spear_Of_Galaxy_Zenith.43.b.desc:0 "使用反集群打击模式，在目标恒星系投射一个存在15天的相位空间投影并攻击目标恒星系内的所有敌人，此后跨星系打击系统进入90天的冷却时间。"
 SRA_Spear_Of_Galaxy_Zenith.43.c:0 "取消命令"


 SRA_Spear_Of_Galaxy_Zenith.50:0 "新星终结-目标选择"
 SRA_Spear_Of_Galaxy_Zenith.50.desc:0 "§B「星穹之矛跨星系打击系统选定目标中」§!\n您可以在这里选择攻击的目标。\n§K在目标所在恒星系内用鼠标选中目标，保持选中状态并点击此面板上的锁定按钮来锁定此目标，然后点击确定目标按钮并选择攻击模式。§!"
 SRA_Spear_Of_Galaxy_Zenith.50.a:0 "确定目标"
 SRA_Spear_Of_Galaxy_Zenith.50.a.desc:0 "点击以将「§H[SRA_mini_menu_choose_button_target.GetName]§!」锁定为目标。"
