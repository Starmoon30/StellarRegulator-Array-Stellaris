 SRA_SOGZ_menu_energy_effect_custom_tooltip:0 "§Y星穹之矛当前配置下的剩余系统能量§!"
 SRA_SOGZ_menu_energy_no_enough:0 "§Y星穹之矛当前相位能量不足§!"
# 船尾水晶 防御系统 被动
 SRA_SOGZ_menu_sub_1_1_custom_tooltip:0 "§B潜时沉寂§!\n\n§C防御阵列 被动§!\n§Y系统能量配置消耗0§!\n\n配置水晶投射阵列，调谐恒星系内舰队的防护系统，将星辉能量导入至护盾和装甲内，大幅度强化其特种性能，增强其对削弱和穿透效果的抵抗能力。\n\n恒星系内的友方舰船:\n$MOD_SHIP_SHIELD_REDUCTION$：§G-100%§!\n$MOD_SHIP_ARMOR_REDUCTION$：§G-100%§!\n$MOD_SHIP_SHIELD_HARDENING_ADD$：§G+800%§!\n$MOD_SHIP_ARMOR_HARDENING_ADD$：§G+800%§!"
 SRA_SOGZ_menu_sub_1_2_custom_tooltip:0 "§B流时无尽§!\n\n§C防御阵列 被动§!\n§Y系统能量配置消耗100§!\n\n配置水晶投射阵列，将相位能量渗透进星穹之矛舰体各处，在即将被摧毁时将不再直接紧急折越，可选择消耗10点相位能量原地瞬间修复至完整状态，并在5.00£time£内不会被再次摧毁，或者可以选择暂时进入静滞状态，30.00£time£后再做决定。"
 SRA_SOGZ_menu_sub_1_3_custom_tooltip:0 "§B永时流转§!\n\n§C防御阵列 被动§!\n§Y系统能量配置消耗200§!\n\n配置水晶投射阵列，充能恒星系内舰队的舰体，使其部分进入半能化，接近能量化的装甲和舰体结构能够迅速修复绝大多数损伤，与此同时护盾场也能高速恢复。\n\n恒星系内的友方舰船:\n$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$：§G+256000§!\n$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$：§G+256000§!\n$MOD_SHIP_HULL_REGEN_ADD_STATIC$：§G+256000§!\n\n此外，星穹之矛每当即将被摧毁时，会进入静滞状态10.00£time£并释放数队流天戍卫，流天戍卫将作战180.00£time£。星穹之矛脱离静滞状态后5.00£time£内无法再次激活此效果。"
#船头:投送模块 主动
 SRA_SOGZ_menu_sub_2_1_custom_tooltip:0 "§B寰宇之帜§!\n\n§C投送模块 主动§!\n§Y系统能量配置消耗0§!\n\n配置舰首引导航标，为整个星系的舰队计算航线并指定机动逻辑，优化其相关性能。与此同时，启动折跃投送系统，使我们的所有舰船可以跃迁。\n\n消耗：§Y25 相位能量§!\n冷却时间：180.00£time£\n持续时间：180.00£time£\n帝国内的友方舰船:\n跃迁能力：§G解锁§!\n$MOD_SHIP_SPEED_MULT$：§G+200%§!\n$MOD_SHIP_EVASION_MULT$：§G+100%§!\n$MOD_SHIP_WINDUP_MULT$：§G-200%§!\n$MOD_SHIP_FTL_JUMPDRIVE_RANGE_MULT$：§G+800%§!\n$MOD_SHIP_JUMPDRIVE_COOLDOWN_MULT$：§G-200%§!"
 SRA_SOGZ_menu_sub_2_1_Buff:0 "§B寰宇之帜§!"
 SRA_SOGZ_menu_sub_2_2_custom_tooltip:0 "§B彗耀迫临§!\n\n§C投送模块 主动§!\n§Y系统能量配置消耗100§!\n\n配置舰首引导航标，引导一支预先准备的舰队立即增援到星穹之矛所在位置，存在多种舰队类型以供选择，舰队类型会影响所需支付的资源和后续的冷却时间。\n\n消耗：§Y25 相位能量§!\n冷却时间：不定"
 SRA_SOGZ_menu_sub_2_3_custom_tooltip:0 "§B星阵卫戍§!\n\n§C投送模块 主动§!\n§Y系统能量配置消耗200§!\n\n配置舰首引导航标，将时空相位引擎的内部空间中储备的星阵卫戍舰队及要塞立即部署到星穹之矛所在位置。\n\n消耗：§Y200 相位能量§!\n冷却时间：360.00£time£"
# 前浮翼 进攻系统 被动
 SRA_SOGZ_menu_sub_3_1_custom_tooltip:0 "§B诸世尽灭§!\n\n§C联合攻击 被动§!\n§Y系统能量配置消耗0§!\n\n配置浮翼进攻矩阵，增幅恒星系内舰队的武器系统，强化其对各种目标的毁伤能力。\n\n恒星系内的友方舰船:\n$MOD_SHIP_SHIELD_DAMAGE_MULT$：§G+50%§!\n$MOD_SHIP_ARMOR_DAMAGE_MULT$：§G+50%§!\n$MOD_SHIP_HULL_DAMAGE_MULT$：§G+50%§!"
 SRA_SOGZ_menu_sub_3_2_custom_tooltip:0 "§B冥海引航§!\n\n§C联合攻击 被动§!\n§Y系统能量配置消耗100§!\n\n配置浮翼进攻矩阵，调谐恒星系内舰队的武器系统，使其向船体结构破坏方面特化，作为代价，对护盾和装甲的伤害效果将基本消失，需要配合穿透武器使用。\n\n恒星系内的友方舰船:\n$MOD_SHIP_SHIELD_DAMAGE_MULT$：§R-200%§!\n$MOD_SHIP_ARMOR_DAMAGE_MULT$：§R-200%§!\n$MOD_SHIP_HULL_DAMAGE_MULT$：§G+400%§!"
 SRA_SOGZ_menu_sub_3_3_custom_tooltip:0 "§B破晓凯旋§!\n\n§C联合攻击 被动§!\n§Y系统能量配置消耗200§!\n\n配置浮翼进攻矩阵，额外星辉水晶能量会导入星穹之矛武器系统，重新编码武器阵列弹道逻辑，使所有武器在命中敌人的瞬间强行跌落维度，在跌落时释放的庞大能量将越过舰船的护盾装甲直击船体本身。\n\n恒星系内的友方舰船:\n$MOD_SHIP_SHIELD_PENETRATION_MULT$：§G+800%§!\n$MOD_SHIP_ARMOR_PENETRATION_MULT$：§G+800%§!"
#后浮翼：打击模块 主动
 SRA_SOGZ_menu_sub_4_1_custom_tooltip:0 "§B爆华绽放§!\n\n§C火力支援 主动§!\n§Y系统能量配置消耗0§!\n\n配置打击压制模块，允许星穹之矛对敌方舰队进行覆盖式打击，对恒星系内所有敌人造成大量伤害。\n\n消耗：§Y50 相位能量§!\n冷却时间：120.00£time£\n持续时间：25.00£time£\n恒星系内的敌方舰船:\n每1.00£time£受到 §R8000§! 伤害"
 SRA_SOGZ_menu_sub_4_2_custom_tooltip:0 "§B溟乎远响§!\n\n§C火力支援 主动§!\n§Y系统能量配置消耗100§!\n\n配置打击压制模块，允许星穹之矛对恒星系进行爆发性能量压制，弱化所有敌方舰船的防御结构并破坏其穿透抗性。\n\n消耗：§Y50 相位能量§!\n冷却时间：180.00£time£\n持续时间：30.00£time£\n恒星系内的敌方舰船:\n$MOD_SHIP_SHIELD_REDUCTION$：§R80%§!\n$MOD_SHIP_ARMOR_REDUCTION$：§R80%§!\n$MOD_SHIP_SHIELD_HARDENING_ADD$：§R-200%§!\n$MOD_SHIP_ARMOR_HARDENING_ADD$：§R-200%§!"
 SRA_SOGZ_menu_sub_4_3_custom_tooltip:0 "§B苍星陨灭§!\n\n§C火力支援 主动§!\n§Y系统能量配置消耗200§!\n\n配置打击压制模块，允许星穹之矛在恒星系中央放置一颗高度压缩的相位能量星体，并在短暂延迟后爆发，对整个恒星系内的一切敌对舰队造成毁灭性的打击。\n\n消耗：§Y50 相位能量§!\n冷却时间：180.00£time£\n延迟：5.00£time£\n持续时间：30.00£time£\n恒星系内的敌方舰船:\n每1.00£time£受到 §R无法估量的§! 伤害"
#歼星框架  能量调谐系统 被动
 SRA_SOGZ_menu_sub_5_1_custom_tooltip:0 "§B星核超载§!\n\n§C能量调谐 被动§!\n§Y系统能量配置消耗0§!\n\n配置能量调谐系统，优化系统配置，提升效能与整备速度。\n\n§B投送模块§! 系统冷却时间：§G-100%§!\n§B火力支援§! 系统冷却时间：§G-75%§!\n§B时空相位§! 系统冷却时间：§G-50%§!"
 SRA_SOGZ_menu_sub_5_2_custom_tooltip:0 "§B末世浩劫§!\n\n§C能量调谐 被动§!\n§Y系统能量配置消耗100§!\n\n配置能量调谐系统，重定向武器能量分配，大幅度提升恢弘军备效能，增强对单个目标的毁灭能力。与此同时，调整后的能量涨落回路将使星穹之矛相位能量的充能速度加倍。\n\n§Y相位能量§!产出：§G+100%§!\n星穹之矛:\n$mod_weapon_type_SRA_supreme_weapon_fire_rate_mult$：§G+300%§!\n§B寰宇溃灭§!：§Y命中效果触发的冷却时间：§G-75%§!§!"
 SRA_SOGZ_menu_sub_5_3_custom_tooltip:0 "§B飘落传说§!\n\n§C能量调谐 被动§!\n§Y系统能量配置消耗200§!\n\n配置能量调谐系统，转换能量供应模式，将所有相位能量产出全部转向至星穹之矛本身的强化，极大幅度的加强其各项属性。\n\n§Y相位能量§!产出：§R-100%§!\n星穹之矛:\n$MOD_SHIP_SHIELD_MULT$：§G+3200%§!\n$MOD_SHIP_ARMOR_MULT$：§G+3200%§!\n$MOD_SHIP_HULL_MULT$：§G+3200%§!\n$MOD_SHIP_SHIELD_DAMAGE_MULT$：§G+200%§!\n$MOD_SHIP_ARMOR_DAMAGE_MULT$：§G+200%§!\n$MOD_SHIP_HULL_DAMAGE_MULT$：§G+200%§!\n$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$：§G+64000000§!\n$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$：§G+64000000§!\n$MOD_SHIP_HULL_REGEN_ADD_STATIC$：§G+64000000§!\n\n§Y§B永时流转§!释放的星阵戍卫将享受此强化10.00£time£。§!"
#核心水晶 时空相位核心 主动
 SRA_SOGZ_menu_sub_6_1_custom_tooltip:0 "§B新星终结§!\n\n§C时空相位 主动§!\n§Y系统能量配置消耗0§!\n\n配置时空相位引擎，允许使用星穹之矛的强大武器藉由时空相位引擎的协助向目标恒星系发起攻击。使用反集群打击模式时，将在目标恒星系投射一个存在15天的相位空间投影并攻击目标恒星系内的所有敌人；使用星系摧毁模式时，将使用§B「新星终结」§!直接摧毁目标恒星系。\n\n消耗：§Y50 相位能量§!\n冷却时间：360.00£time£"
 SRA_SOGZ_menu_sub_6_2_custom_tooltip:0 "§B奇点爆发§!\n\n§C时空相位 主动§!\n§Y系统能量配置消耗100§!\n\n$SRA_Spear_Of_Galaxy_Zenith.2.6_2.desc$"
 SRA_SOGZ_menu_sub_6_3_custom_tooltip:0 "§B事件视界§!\n\n§C时空相位 主动§!\n§Y系统能量配置消耗200§!\n\n配置时空相位引擎，授权时空相位引擎抽取能量储备以完成充能，随后消耗巨量能量扩大其作用范围至整个星系，极大幅度地减缓所有敌对舰队的攻击和移动速度，构成类似于时间静止的效果。\n\n消耗：§Y100 相位能量§!\n冷却时间：360.00£time£\n持续时间：20.00£time£\n星系内的敌方舰船:\n$MOD_SHIP_DISENGAGE_CHANCE_REDUCTION$：§R1000%§!\n$MOD_SHIP_SPEED_MULT$：§R-4000%§!\n$MOD_SHIP_WEAPON_RANGE_MULT$：§R-4000%§!\n$MOD_SHIP_EVASION_MULT$：§R-4000%§!\n$MOD_SHIP_ACCURACY_MULT$：§R-4000%§!\n$MOD_SHIP_TRACKING_MULT$：§R-4000%§!\n\n§Y对拥有动态调整系统的舰队无效§!"


