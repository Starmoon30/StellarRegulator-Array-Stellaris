l_simp_chinese:
###############################

 SRA_SD_Story_event.1.desc:0 "……也就是说，本将流失的过往被发掘了，五十年前的「大撕裂」并没有为她的故事画上终点。\n嗯，真是不得了的消息，还好只有我们俩知道，可以按照需要来安排什么信息应该公开。"
 SRA_SD_Story_event.2.desc:0 "您准备怎么处置她。"
 SRA_SD_Story_event.3.desc:0 "“处置”，这个措辞似乎有些不那么友好的倾向。\n也许我们应该小心评判我们这位小睡美人目前……到底是谁。\n然后再分门别类的做出安排。"
 SRA_SD_Story_event.4.desc:0 "我猜您要擅自评判她“仍在可控范围之内，其能力价值巨大，应在妥善监管下利用”。"
 SRA_SD_Story_event.5.desc:0 "我总不能给小伊瑞卡的老相好判死刑吧，除非她醒过来的第一件事是要给我判死刑，我衷心希望这不要发生。\n姑且假设她还是我们比较喜欢的那个样子，如果真的如此，我觉得可以由她来指挥一下我们今后的发展了。"
 SRA_SD_Story_event.6.desc:0 "听起来不是什么好方案。"
 SRA_SD_Story_event.7.desc:0 "我们都住在这座塔上了，还有更烂的方案吗。\n换到五十年前这里还是公认的死地，有去无回的绝境，谁能想到今天我们是靠着这座高塔去探索别的世界呢？"
 SRA_SD_Story_event.8.desc:0 "您高兴就好，我没什么意见。\n不过您最好先准备一下如何把您的方案改编成能让库图接受的样子，不然那孩子的反对意见可能不是一点点大。"
 SRA_SD_Story_event.9.desc:0 "哼，我早有准备。\n我们的这位「树海的诗人」小姐会作为我的“特派专员”活动，我只不过是“适当的参考”她的观点。毕竟哪怕库图也无法否认，诗人阁下那独特的视角的确独一无二。"
 SRA_SD_Story_event.10.desc:0 "您已经下了决定，那我不多嘴了。不过……\n\n她好像要醒了。"
 SRA_SD_Story_event.11.desc:0 "什么？\n咳咳，那我来问问她。\n\n§Y这个穿着白色裙装的少女整了整衣服，变了张椅子出来坐下，对你施以热切的目光。§!\n\n还记得我是谁吗？"
 SRA_SD_Story_event.11.a:0 "……我们认识吗？"
 SRA_SD_Story_event.11.b:0 "……你是……魔法使小姐？"
 SRA_SD_Story_event.11.c:0 "§R路希维亚！！！§!"
 SRA_SD_Story_event.12.desc:0 "哦，哦，这可真是。\n我想我们应该是认识的，不过看来需要重新介绍一下了。\n你好，「树海的诗人」，我是魔法使路希维亚，深渊事务司现任司长，你以前以及将来的引导者。"
 SRA_SD_Story_event.13.desc:0 "真是令人怀念的称谓呢，很高兴你回来了。\n不过我最好还是重新介绍一下，毕竟你不在的时候发生了不少事情。\n你好，「树海的诗人」，我是魔法使路希维亚，深渊事务司现任司长，你以前以及将来的引导者。"
 SRA_SD_Story_event.14.desc:0 "一语成谶！\n\n§Y她躲开你的攻击。§!\n\n这条时间线不对，切了切了！"
 SRA_SD_Story_event.15.desc:0 "你注意到，这位自称路希维亚的少女身旁还站着另一人。\n那是一位恬静温和的女孩，她披着破旧的衣物，身后的双翼残缺不全。扭曲的双角和相比之下还算完好的尾巴暗示着她的身份。\n寒彻骨髓的死亡气息紧紧缠绕在她的身上，但你却意外的对此并不陌生。\n她是……\n你隐隐约约快要抓到那个名字，它却又如羽毛般从你手中飘走了。"
 SRA_SD_Story_event.16.desc:0 "§Y她似乎察觉到了你的所思所想。§!\n\n您好，诗人阁下。\n埃泽纳尔只是您过去的一位并不相熟的友人，不必在意。"
 SRA_SD_Story_event.17.desc:0 "埃泽纳尔，失去色彩的巨龙，黑龙的骨骸，「终曲之龙」。\n传说中最古老的失落之龙，自数百年前起就驻守在孤山下，独自面对那狰狞的裂口。\n你回想起了这些词句，你回想起了她曾经在无光的夜晚轻声歌唱，教导你如何唤起逝者的余灰。\n……\n但除此之外，你再无任何记忆，仿佛一本被粗暴撕毁的笔记，只留下些许残页。\n\n但她为何会站在这里，离群索居的巨龙为何出现在文明的领地。\n也许路希维亚小姐会有答案。"
 SRA_SD_Story_event.18.desc:0 "埃泽纳尔只是出于个人原因为我提供一些帮助而已，并不属于深渊事务司。\n她在一次深渊探索任务中发现了你，将你带了回来。\n\n§Y她注意到你疑惑的表情，露出微笑。§!\n\n是的，探索深渊。这些年来事情变得大不一样了，你我现在就在深渊的正上方，一座仍然令人毫无头绪的高塔里。\n自从「大撕裂」发生，整个文明的结构都被打碎重组了，现在，分裂的诸国团结在了一个统一的旗帜下，重新开拓和建设破碎的核心环带，将孤山本身也纳入版图。\n这座悄然出现的高塔既是向下探索深渊的根据地，也是向上探索异界的门扉。\n听起来难以置信，但事实就是这样，五十年前人们还在深渊的威能下战栗，如今深渊本身都已经被纳入计划之中。\n但这也是有代价的。"
 SRA_SD_Story_event.19.desc:0 "这座塔倒是安全，它的内部几乎没有侵蚀现象。但在其他地方，仅仅只是呼吸空气，都可能遭到深渊的影响，更不用说在那些伤痕旁边工作，乃至与深渊的造物搏杀了。\n\n……具体情况我会在之后给你发汇总，总而言之，所有人都在死。"
 SRA_SD_Story_event.20.desc:0 "但你也许可以改变这一切。\n\n我上次好像也这么跟你说来着。咳咳，总之，你会作为我的直属人员，处理一些棘手的深渊问题，像你过去那样。\n不准拒绝，不然我就要使用一些不那么适合广而告之的手段来让你听话了。"
 SRA_SD_Story_event.20.a:0 "听起来我要力挽狂澜了，尽管实际上一无所知。"
 SRA_SD_Story_event.20.b:0 "希望我做的是好事。"
 SRA_SD_Story_event.20.c:0 "什么手段？"
 SRA_SD_Story_event.21.desc:0 "洗脑啊认知修改啊药物操纵啊之类的，或者我一天到晚让你听将死未死的人的哭嚎然后说都是你的错。\n哦，还可以找你当年的队友来求你，不然我就折磨她们，以及折磨你。\n\n总之是很刻板印象的坏操作，你想体验吗？"
 SRA_SD_Story_event.21.a:0 "……免了。"
 SRA_SD_Story_event.22.desc:0 "很高兴我们达成了一致，迄今为止我还没做过什么坏事呢，希望以后也不用。"
 SRA_SD_Story_event.23.desc:0 "你会有时间慢慢了解的，反正不急，还没到人死完了的时候。\n你可以到处逛逛，找找过去的感觉，练习一下掌握的技能，享受一下三个月的假期，然后再来陪我加班。\n但注意一下，先不要透露自己的身份。埃泽会陪着你，对吧埃泽？"
 SRA_SD_Story_event.24.desc:0 "§Y埃泽纳尔一脸无奈的点了点头。§!"
 SRA_SD_Story_event.25.desc:0 "那就这样，我要上班了，再会。"


 SRA_SD_Story_event.26.desc:0 "被称作“树海的诗人”的女孩在迷茫中苏醒，她身处陌生的时代，又辨不清自己的过往。但即便如此，诗人仍然选择了见证，思考，与行动。\n在终曲之龙的协助下，诗人尽可能地找回了过往旅途中自己所积累起的经验与见解，这些或平凡或珍奇的技艺曾帮助她立下了无数功绩，也曾帮助她直面过深渊泯灭万物的伟力。"
 SRA_SD_Story_event.27.desc:0 "正如诗人所知的那样，这里是萨塔瑞兹，古代诗篇记叙这里乃是树海之残枝，十分巧妙的照应了这个世界的本质。\n与其他已然飘落的叶片不同，这个世界尚未脱离塑造它的深渊——这是一个尚未定型的世界，一个模糊而混沌的世界，大地平坦而无垠，天空虚假而无尽。各不相同的生灵被深渊创造，弱小如地精也能生存，强大如巨龙也将死去。\n因为深渊如此平等，它是万物尚未分化时的唯一，它是世界抵达尽头时的终点，它消弭所有不同，抹去所有独特，将绚丽诗篇化作只言片语，再也寻不回踪迹。"
 SRA_SD_Story_event.28.desc:0 "在诗人尚且活跃的日子，或者说她记忆里的那些时光，深渊还只是这座高原上的裂口，一道恰如其名的深坑，只是偶尔释放它的影响，将其中混沌的迷雾随意地点缀在大地上。\n受到迷雾侵蚀的人就如同融化的色彩，原本明确的一切都逐渐融为一体。起初可能是肢体的异化，水晶的生长，或者盔甲融进血肉，随着肉体的扭曲，人们的思想也随之模糊，消亡，并最终化为一片浑浊。\n好在深渊的侵蚀只是偶尔发生，只不过是无数天灾中的某一种，也许一生都没有机会遇见。\n但如今不一样了。"
 SRA_SD_Story_event.29.desc:0 "“大撕裂”，一场前所未有的灾难。就好像火山喷发一般，深渊在呼吸间释放出了远超过去千年总和的庞大能量，将自己的影响泼洒。山脉开裂，海洋翻腾，整片大地被无数裂隙撕碎，如同一颗老树的根须在土壤里蔓延。\n这场无人预知的浩劫毁灭了过去称为核心环带的广阔土地上的大多数文明，留下了无数脉动着的伤痕，无时无刻地散播深渊的影响。\n但短短数年后，统合诸国而建立起的深渊事务司，便宣布了重返核心环带的计划。\n不愿意逃往边缘环带的萨塔瑞兹的生灵们前所未有地团结在了一起，向着深渊仍在蔓延的土地进军。"
 SRA_SD_Story_event.30.desc:0 "在一位钟爱书卷的巨龙的倾囊相助下，短短数十年间，人们的技术发生了翻天覆地的变化。如群山般绵延的工厂在大撕裂造就的裂隙旁建起，激进地利用着那些足以扭曲现实的力量。人们在伤痕累累的土地上建立起崭新的城市，重建了核心环带，乃至更进一步。\n如今，人们已攀上巨塔，触碰天空，探索浩瀚的异界，也探索无尽的深渊。\n勇踏未知，令人心潮澎湃的大远征，创造与超越。\n即便代价是无休止的牺牲。\n但也正是因为牺牲已成定局，前进的脚步才如此无畏。"
 SRA_SD_Story_event.31.desc:0 "过去就与诗人相识的魔法使路希维亚，以深渊事务司司长的身份任命诗人为自己的副手，意在建立一支能处理最棘手的深渊危害的队伍。\n诗人会作何想法呢？她如同一位异乡人，曾经知晓的一切模糊不清，曾经身处的世界沧海桑田。她仍然执掌着自己那神秘的能左右深渊影响的力量，但这力量究竟该怎样使用？路希维亚令诗人感到熟悉又陌生，她似乎从未真正认识过这位魔法使，她的目的为何，又是否值得信任？\n故事才刚刚开始。"


 SRA_SD_Story_event.32.desc:0 "§R你§!被呼啸的风唤醒，发现自己正身处一片废墟之中。\n古老的石料坍圮，宏伟的殿堂破碎，赝作的阳光自不远处洒落，照亮那些刻着文字的石碑。\n\n你当然不是一无所知。"
 SRA_SD_Story_event.33.desc:0 "这里，虽然不敢说毫无疑问，但多半就是深渊。确切地说，这里大概是表层深渊的第一个或第二个层级，复现层与捏造层。\n作为现阶段接触最多，或者说现阶段唯二能正常抵达的层级，这两个区域的构造几乎等同于深渊之外的常规世界。这里是分化的末期阶段，深渊在这两个层级与外界信息交融，进而演化出无数转瞬即逝的外界复制品。\n捏造层仅仅将一系列事物堆砌在一起，而复现层则往往以一些影响深远的事件作为蓝本，不完全地复现出当时的情景。"
 SRA_SD_Story_event.34.desc:0 "你不紧不慢地敲了敲腰间的权杖，确认了一下挂在外衣上的小袋子。尽管你很确定睡觉的时候并没有傻乎乎地穿着一整套外出服，但现在的你确实一袭正装，连材料包都带上了。\n倒也算是好事，你低语着舞动手指，将脑海中搭建起的法术架构补全，让它们如受触的骨牌塔一样垮塌，进而将准备好的术式展现出来。\n仔仔细细地备好防御与增幅的法术效应，让自己在魔法层面也全副武装起来，你这才走向不远处的石碑，开始打量上面残损的文字。\n这似乎并不是什么重要的信息，一篇由精灵语创作的故事片段，讲述着一位渴望力量的法师求得了强大的武器却也因此而死。"
 SRA_SD_Story_event.34.a:0 "探求其上的奥术痕迹。"
 SRA_SD_Story_event.34.b:0 "回忆这篇故事的隐喻。"
 SRA_SD_Story_event.35.desc:0 "你施展法术，让得以窥探最细微魔法痕迹的力量显现在你的眼瞳，自寓言般的文字下找出了另一份记录。\n所谓“法师的武器”，就埋藏在这座神殿之下，若是有朝一日大敌当前，军团可自行调用。"
 SRA_SD_Story_event.36.desc:0 "你搜索记忆，想起精灵的古老习俗之一便是在保存重要的魔法道具时，留下一系列讲述性的文字。意在提醒能够理解这些象征的到访者可以取用保存在此地的物品，以防不测的['concept_SRA_SD_Abyss_Erosion']。"
 SRA_SD_Story_event.37.desc:0 "你轻眨眼眸，为所见的一切染上淡蓝的色彩，建造之出便埋下的法术脉络如同叶脉般在整座遗迹中穿行，哪怕已经过去许多岁月，也依然残留着痕迹。\n顺着灰白视野中点亮的蓝色细线，你走下了阶梯。\n复现层的场景往往基于一件相对完整的事件，将其完成会使得这份泡影破碎，进而让深渊的浪潮再次涌动在此地，使得被困其中的探索者们有模糊存在，跳回现世的机会。\n你总得去看看的。"
 SRA_SD_Story_event.38.desc:0 "你自半空中抽出如同污血浇筑而成的迅捷剑，劈开汹涌的深渊浪潮，将碎石拼凑的蹒跚怪物斩断，将水晶雕琢的浮空构体击碎。\n捏造的现实随着你的深入而破碎，涌动的深渊能量塑造出一个又一个无识无念的构造体，意图以无形本质搭建的有形躯壳解放被束缚在有形血肉中的无形本质。\n你不去想那些对这种现象的各种猜测，专注于摧毁眼前的确存在的敌人，并进一步深入这片废墟。\n这些构造体并非是什么强大的对手，充其量只算得上是着甲的古典步兵，既没有远程攻击的手段也没有什么战斗技巧，仅仅挥舞着自己锋利的晶态肢体罢了。\n你继续前行，古老废墟中的大部分构造都已经失效，你不得不切开一些堵死的门扉，或是飞跃崩塌的走廊。\n终于，在斩杀了不知多少个从墙壁或干脆从空气中浮现的构造体后，你抵达了一个大概是终点的小房间。\n里面摆着一个小巧的魔法装置，恒定着静滞的法术效果，很明显用于在极其漫长的时间内保存物件。\n这里本该有一些校验与防备的手段，但现在只有裂痕与碎片，你走上前去，打开盒子。\n里面是一件难以形容的奇特造物，一个固定着数个透镜的金属架，完全看不出有什么作用。"
 SRA_SD_Story_event.38.a:0 "拿起它。"
 SRA_SD_Story_event.39.desc:0 "就在你拿起这个物件的那一刻，一丝微乎其微的破裂声在你耳旁响起。\n你下意识地躲开，看到裂痕在半空中蔓延。\n紧接着，一根相当标志性的水晶三棱锥长枪，或者说法杖，从裂痕中刺出，连带着一只握着它的手臂，然后是肩膀，身躯，一整个魔法使。\n路希维亚自空无一物之中钻了出来。\n碎裂的透明存在漂浮在半空中，闪烁着彩色的散射光，像碎冰一样很快地消融不见了。你意识到这并不真的是空间的碎片，只是某种传送手段的魔力副产物，虽然并无证据，但你有种感觉，这是有意为之的。"
 SRA_SD_Story_event.39.desc:0 "找到你了。\n\n§Y你的司长一如既往地挂着微笑说。§!\n\n虽然早在你刚刚消失的时候就展开搜索了，不过到现在才捕获到你的位置。看起来是你的行动破坏了深渊构造的复现场景的封闭性。\n\n§Y她看向你手中的造物。§!\n\n……歼灭轰鸣。你又一次拿到了它。\n这恐怕并非巧合，深渊正在复现你的旅途，以某种方式重塑你的存在。\n最终目标不得而知，但你应该已经意识到了，你在这片幻境中每前进一步，都变得愈发完整。你曾支配的力量再度任你驱使，你曾得到的事物……也再度回到你的手中。\n这似乎是件好事。"
 SRA_SD_Story_event.39.a:0 "听起来不错。"
 SRA_SD_Story_event.39.b:0 "听起来令人不安。"
 SRA_SD_Story_event.40.desc:0 "嗯哼，谁知道呢？我们不妨保留猜测，先从这里脱身，回到更为熟悉也更为稳固的世界。\n这里的现实相当薄弱，你可以试试自己打开通路，或者让我来使用一些稳定的手段。"
 SRA_SD_Story_event.40.a:0 "还是由你出手吧。"
 SRA_SD_Story_event.40.b:0 "施展§R深渊祈愿§!"
 SRA_SD_Story_event.41.desc:0 "§Y路希维亚挥动手中的权杖，在半空中刻出棱角分明的通路，然后将其击碎。\n看起来就像是在玻璃上画痕然后打破。\n你看不出施法的踪迹，你只能看到一道裂口出现在眼前，彼方便是你熟悉的现实。\n你迈入其中。§!\n\n欢迎回到现实，我可爱的小诗人。\n\n§Y她相当夸张的行了个礼。§!"
 SRA_SD_Story_event.42.desc:0 "§Y你构想出自己的愿望，随后将其编织为一道号令。\n深渊的织构在你的意志中扭转，舒展它的脉络，宣示它的威能。然后，就如你所祈愿的那样，在思绪闪动的片刻中，你们回到了踏实可靠的现实世界。§!\n\n哦，这可真是……\n\n§Y她似乎要说什么，但并没有说出来。§!"
 SRA_SD_Story_event.43.desc:0 "对这次计划外的旅途感觉如何？虽然看你的样子能猜到这里的东西处理起来并不困难，过去的你也以擅长解决['concept_SRA_SD_Abyss_Erosion']危害闻名，但毕竟你上一次对付深渊构造体还是在五十年前。"



