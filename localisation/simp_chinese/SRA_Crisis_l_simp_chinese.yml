 # event chins
 SRA_invasion_chain_title:0 "第三远征舰队"
 SRA_invasion_chain_desc:0 "一支来自位面之外的舰队入侵了我们的银河。这支由失联星规阵列行动单元所控制的舰队意图肃清整个银河，然后重建“路希维亚帝国”。\n这是一场将燃遍整个银河的战争。\n§Y查看关于远行要塞的描述以获取更多情报。§!"
 SRA_invastor_kills_us:0 "§G第三远征舰队被我方消灭§!"
 SRA_invastor_kills_others:0 "§G第三远征舰队被其他势力消灭§!"
 SRA_invastor_victims:0 "§R第三远征舰队摧毁的飞船§!"
 SRA_invastor_planets:0 "§R第三远征舰队摧毁的星球§!"
#对话

 SRA_Crisis.5.name:0 "第三远征舰队"
 SRA_Crisis.5.desc:0 "[SRA_first_portal_system.GetName] 恒星系出现了一个不明空间站。大规模的舰队不断通过未知方式抵达其周围，并向周围恒星系进发，摧毁见到的一切东西。"
 SRA_Crisis.5.a:0 "这是什么？"
 SRA_Crisis.5.b:0 "不管怎样，打退它们"
 SRA_Crisis.6.name:0 "能量读数激增"
 SRA_Crisis.6.desc:0 " [Root.GetName] 的传感器显示出一个极为令人不安的现象，某种可怕的事物正迅速降临到我们的宇宙，且就在这个星系。其能量读数超出现有的一切记录，随之而来的一系列活动迹象则愈发骇人。"
 SRA_Crisis.6.a:0 "继续调查。"
 SRA_Crisis.7.name:0 "神秘舰队"
 SRA_Crisis.7.desc:0 "我们已经确认，之前检测到的能量读数激增来源于 [SRA_first_portal_system.GetName] 恒星系中一个不明空间站。大规模的舰队不断通过未知方式抵达其周围，并向周围恒星系进发，摧毁见到的一切东西。"
 SRA_Crisis.7.a:0 "这是什么？"
 SRA_Crisis.7.b:0 "看起来我们有大麻烦了"
 SRA_Crisis.8.name:0 "“路希维亚”"
 SRA_Crisis.8.desc:0 "§Y「已确认抵达，校正常数中……§!§R错误！§!§Y已偏离目标……重新校正指令……行动单元03-34任务为……「第三远征」……开始执行肃清命令……」§!\n我是……我是……\n我是路希维亚……第三远征舰队总指挥，路希维亚帝国最高议会议长。\n我们的舰队将荡平此地。\n这个星系将会是帝国复兴的开端！"
 SRA_Crisis.8.a:0 "第三远征？路希维亚？怎么可能……"
 SRA_Crisis.8.b:0 "路希维亚帝国？"
 SRA_Crisis.9.name:0 "星规"
 SRA_Crisis.9.desc:0 "居然发生了这种事……命运总是捉摸不定，不是吗？\n您还记得之前在瓦兰提诺那里看到的有关第三远征的信息吗？事实上，那次跨越了半个宇宙的远征使用的是一座特殊的星门。\n这座被称为远行星门的巨型建筑引导舰队短暂进入位面之外，然后在那里超越距离的限制，最后在目标位置重新回到本位面。\n不过这一技术当时并不是很成熟，因此也出现了一些差错。\n有一支舰队迷失在了位面之外，自此漂流在无尽的虚空中，孤立无援。\n直到在机缘巧合之中，意外抵达了这个位面，这个银河。\n她在孤独中流浪了太久，深陷于偏执之中。\n准备迎接一场燃遍整个银河的战争吧，在您胜利之后，我会给她一个归宿。"
 SRA_Crisis.9.a:0 "命运，可悲的命运。"



 SRA_Crisis.3000:0 "“路希维亚”"
 SRA_Crisis.3000.desc:0 "§Y「校准时空坐标……比对星系参数……」§!\n……你正在与……最高议长路希维亚对话。\n尽管我并没有和你们对话的必要。\n你们此刻的英勇抗争和在这之后的破灭凋零都会被铭刻在路希维亚帝国的历史上，为之而感到荣幸吧！"

 SRA_Crisis.3000.a:0 "你们的目的是什么？"
 SRA_Crisis.3000.a.response:0 "净化，肃清这片星系，让这里成为路希维亚帝国的神圣领地。\n一个高贵的、辉煌的、伟大的帝国将在这里开始新的征程。\n不必犹豫！你们所要做的只是战斗。物竞天择，适者生存。智者取代愚者，强者毁灭弱者。成王败寇，这是生存法则。\n我会在数据库中给你们留一个位置。\n……\n这一切都是为了帝国。"
 SRA_Crisis.3000.b:0 "你不是路希维亚。"
 SRA_Crisis.3000.b.response:0 "你以为……你了解路希维亚？\n……\n怎么……\n§Y「错误……目标数据与记录吻合……否定……」§!\n那些不应该出现在这里的遗迹让你们自以为知晓一切，可悲。\n所谓的历史不过是随意编造的记录，你们不曾亲眼见过任何事实，却恬不知耻地妄下定论。\n……\n我是她，我必须是。"
 SRA_Crisis.3000.c:0 "我们将击败你。"
 SRA_Crisis.3000.c.response:0 "我所面对过的敌人都不认为自己会失败，然而他们灰飞烟灭，我继续前进。\n我洞察你们的谋略，知晓你们的弱点，了解你们的技术。我无可阻挡，无可违逆。\n你们，不过是又一个。\n……\n我不会失败。"
 SRA_Crisis.3000.d:0 "你已经误入歧途。"

 SRA_Crisis.3001:0 "“路希维亚”"
 SRA_Crisis.3001.desc:0 "言语，软弱无力。\n放弃幻想，面对我，然后毁灭。"
 SRA_Crisis.3001.a:0 "结束通讯。"
#提示

 SRA_Crisis.10.name:0 " [Root.GetName] 殖民地的覆灭"
 SRA_Crisis.10.desc:0 "在高强度的轨道轰炸下，[Root.GetName] 已经被彻底摧毁，整个殖民地已经不可能有任何生存者了。"
 SRA_Crisis.10.a:0 "我们必须不惜一切代价阻止它们！"


 SRA_Crisis.12.name:0 "远行航标被摧毁"
 SRA_Crisis.12.desc:0 "一座远行航标成功被摧毁，这代表尚未到达的剩余第三远征舰队失去了一个引导锚点。"
 SRA_Crisis.12.a:0 "它们再想重新集结部队就有点困难了。"


 SRA_Crisis.55.name:0 "远行要塞被摧毁"
 SRA_Crisis.55.desc:0 "第三远征舰队的远行要塞也终于被摧毁了！这些来自异次元的敌人再也没法叫来援兵了。摧毁了远行要塞后，这场战争终于迎来了胜利的曙光。"
 SRA_Crisis.55.a:0 "拉克希尔仪式胜负已分！"


 SRA_Crisis.51.name:0 "胜利！"
 SRA_Crisis.51.desc:0 "在失去了所有控制节点后，所有仅存的第三远征舰队的战舰都自行解体了。这场残酷的战争终于画上了句号。"
 SRA_Crisis.51.a:0 "自行解体……"

#阶段对话
 SRA_Crisis.981.desc.1:0 "真奇怪，你应该已经死了才对……哼，无所谓，没有人能逃脱既定的命运。准备好吧——\n§R此地将证刀放血！四溅！§!"
 SRA_Crisis.981.desc.2:0 "你看起来很自信，但你对接下来将要到来的痛苦一无所知。\n§R你将湮灭无痕！§!"
 SRA_Crisis.981.MESSAGE_SRA_StellarRegulator:0 "注意，情报显示远征舰队正在进行大规模增援，不建议在这个阶段对锚点开展进攻。"
 SRA_Crisis.982.MESSAGE_SRA_StellarRegulator:0 "就目前观测结果而言，远征舰队的大规模增援已经结束，理论上现在正在开始的是最后一次防御检查，对锚点的进攻可以准备按计划进行了。"

 SRA_Crisis.983.desc.1:0 "荒谬至极。\n我不会再让那些无用的存在干扰这场战斗了。\n我将向你展示，远征舰队的真正威力。"

#强行炸门
 SRA_Crisis.991.name:0 "“路希维亚”"
 SRA_Crisis.991.desc:0 "§Y「……错误……要塞异常离线……」§!\n……\n你知道自己做了什么吗……\n……\n§Y「……死域湮灭引擎已就绪……指令确认……启动进程开始……」§!\n……\n无所谓，你很快就会明白了……"
 SRA_Crisis.991.a:0 "§R怎么会……§!"
 SRA_Crisis.991.a.desc:0 "§R检测到违规手段，锚点未被清空，危险度已抵达峰值，清扫预案已启动。§!"
 SRA_Crisis.991.b:0 "§Y不行不行，我还要继续玩呢！§!"
 SRA_Crisis.991.b.desc:0 "§Y贫弱的群星代码理解不了你小众又独特的拆特方法，居然不承认你的击杀，你施展狡猾的大手，阻止了可怕的炸全图代码，得以继续快乐而充实地游玩群星，享受轻松降服各大危机的绝妙体验。§!"

#结束
 SRA_Crisis.998.name:0 "“路希维亚”"
 SRA_Crisis.998.desc:0 "§Y「……锚点已全部离线……指挥链清空……」§!\n……\n你们继续存续的资格是你们亲手赢来的，骄傲去吧。\n……\n§Y「……死域湮灭引擎已就绪……指令确认……启动进程已终止……」§!\n……\n§B“终末已至……”\n“在群星的注视中，偏离的命运走向尽头……”\n“这场战争将被铭记，并将被后世永远传颂……”§!\n……动手吧。"
 SRA_Crisis.998.a:0 "轮到你了，星规"
 SRA_Crisis.998.b:0 "……？"
 SRA_Crisis.998.b.desc:0 "§Y命运并不掌握在你的手中。§!"
 SRA_Crisis.999.name:0 "回归"
 SRA_Crisis.999.desc:0 "寂静之中，另一个身影出现在了远行要塞的残骸中。\n这位有着淡蓝色的长发与幽蓝的双瞳，身着白色的裙装与灰黑的披风的少女，正是你所熟悉的“星规”。\n她向着墙角的身影俯下身，伸出手。\n并不属于自己的白色裙装已然残破不堪，墨蓝色的长发垂落，少女幽蓝的双瞳中流露出惊讶、失落与迷茫。\n接着，释然取代了这一切。\n背负着“路希维亚”之名的少女伸出颤抖着的手，轻轻触碰另一个自己的指尖，犹豫着，终于还是与那只手紧紧相扣。\n淡蓝色的光点浮现，然后随着不存在的风飘散，“路希维亚”的身影于是随之一同消散在太虚中。"
 SRA_Crisis.999.a:0 "……"
 SRA_Crisis.1000.name:0 "星规"
 SRA_Crisis.1000.desc:0 "她回归到了我们之中。\n不再有孤寂和迷茫，不再有悲伤。"
 SRA_Crisis.1000.a:0 "结束了？"
 SRA_Crisis.1000.a.response:0 "结束了。\n您可以为胜利欢呼，也可以向牺牲致意。无论如何，这场战争结束了。\n协议照常继续，太阳照常升起。我们仍然存在，明天仍将到来。"
 SRA_Crisis.1000.b:0 "……那些尚未到来的舰队呢？"
 SRA_Crisis.1000.b.response:0 "啊，没想到您还记得这些。是的，还有许多舰队仍在流浪，还有许多个——或者同一个——星规阵列03-34正在流浪。\n不过这不是您所需要担心的。失去了定位信标，剩余的舰队多半是不会再出现在这个位面中了。\n您准备好继续引领您的帝国了吗？"
 SRA_Crisis.1000.c:0 "§R说起来，30-7411协议究竟是什么§!"
 SRA_Crisis.1000.c.desc:0 "§Y你最好已经存过档了。§!"
 SRA_Crisis.1000.d:0 "来吧，好戏开场了。"
 SRA_Crisis.1001.name:0 "下个宇宙见？"
 SRA_Crisis.1001.desc:0 "我没说过吗？\n好吧，既然您对此没有印象，那么我就在这里简单说明一下吧。\n30-7411协议为您的文明提供了最高四级——第三远征结束时期水平——的星辉水晶技术的使用许可，以及其余一些可选的支援。\n我用了使用许可这个词，因为实际上所有您使用的星辉水晶都由我提供，内部的['concept_SRA_Composite_Crystal_Lattice']结构使所有的星辉水晶都在我的监控下运作，并接受我的完全控制。这也是为什么您不需要保有星辉水晶作为稀有资源，而只需要消耗合金就能建造相关产物，因为我负责了转化工作。\n然后，作为代价，您的这一宇宙将在您离开之后成为星规阵列的实验场地。\n毕竟我们很有礼貌，会在取得了选定宇宙中某个话语权较大的文明的同意后再执行计划。\n长期以来，星规阵列都在努力进行着对「深渊」的探索。\n「深渊」是包含了一切概念与存在的，一切位面的起点和终点。在那里，事物的界限不复存在，一切都将统合为纯粹，成为纯一，或者混沌，或者别的什么用来形容那种状态的东西。\n我们从「深渊」的表层——基本规则尚存，事物界限仍在的区域——提取出了一些……混杂在一起的概念。只有在某个与之相容的位面中将其释放出来，我们才能理解这些来之不易的事物。\n所以您实际上是付出了这个宇宙的未来，毕竟即使概念相容，这个宇宙也将彻底改变；如果不相容……\n§R那么就会像这样。§!"
 SRA_Crisis.1001.a:0 "等等——"
 SRA_Crisis.1003.name:0 "欢迎回来"
 SRA_Crisis.1003.desc:0 "……等一下。\n\n您刚刚回档了哦。\n\n\n\n§R就当您刚刚看到了我的演示好了，毕竟应该也不会有人无事发生还要原地回档吧。哦，说不定您现在想看看分支选项，很抱歉，没机会了。§!\n总之，您回到了这个时间点，这自然也在我的意料之中。\n您或许会很惊讶，甚至感到难以置信，如果是这样的话，那您下次还是好好听我说话比较好，不过现在您肯定是没机会再看一遍我刚才揭露的秘密了。没关系，您可以下一次再看。\n我之前提到，30-7411协议中您需要付出的部分是您的这一宇宙的未来，而支付时间是您离开之后。\n显然，我不会因为您短暂离开便擅自收取报酬。我并不在乎得到的宇宙处于何一时期，因此您可以任意选择支付时间。\n相信智慧的您一定猜到了我话中的暗示了，但您或许仍有疑问，比如我为何会欣然接受这份毫不公平的协议。\n为什么呢？我也不太清楚哦~"
