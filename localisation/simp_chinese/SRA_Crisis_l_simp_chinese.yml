# point of interest
 SRA_invasion_1_poi:0 "远行要塞"
 SRA_invasion_1_poi_desc_a:0 "在 [SRA_first_portal_system.GetName] 星系发现的巨型空间站正引导着第三远征舰队的舰船抵达这里。若不摧毁这座空间站，它们就会不断派来增援。\n§Y根据星规提供的情报，每一个远行航标或远行要塞中都包含着一个时空相位引擎，用于给其他星规阵列舰船提供能源。但如果调整这一引擎的工作模式，也可以维持起一个坚不可摧的时空隔绝屏障。\n虽然现在似乎所有锚点都被保护着，但想要维持其他星规阵列舰船的长期作战，就必须要有至少一个锚点在向外输出能源。也就是说，必然有一个锚点是没有受到时空隔绝屏障保护的，它就是摧毁整个保护链的突破口。\n尽管作战方案已经明确，但守卫锚点的舰队同时也会为锚点提供强大的空间隔绝屏障，我们必须摧毁守卫舰队，才能确认那个锚点是否就是突破口。§!\n\n§R注意，每当一个锚点被摧毁，其他锚点会 立即开始 检查自己的防御是否完备，每隔大约2.00£time£校验数量并在不足时尝试补充防御舰队，这一过程是 极度危险 的，请注意不要在锚点所在星系驻留。§!"
 SRA_invasion_1_poi_desc_b:0 "在 [SRA_first_portal_system.GetName] 星系发现的巨型空间站正引导着第三远征舰队的舰船抵达这里。若不摧毁这座空间站，它们就会不断派来增援。\n§Y研究表明，这些锚点正受到某种复杂的时空隔绝效果保护，我们需要找到一个办法去解除这些屏障。试着对每个锚点都展开一次进攻吧。§!\n\n§R注意，每当一个锚点被摧毁，其他锚点会 立即开始 检查自己的防御是否完备，每隔大约2.00£time£校验数量并在不足时尝试补充防御舰队，这一过程是 极度危险 的，请注意不要在锚点所在星系驻留。§!"
