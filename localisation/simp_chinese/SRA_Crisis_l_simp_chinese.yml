 SRA_Crisis_Metabyss_File:0 "§R狂人的手稿-13§!"
 SRA_Crisis_Metabyss_File_desc:0 "……此前的推测结果已经在■■■■中涉及孤山的相关文件中有所讨论，但在最新的结论中，我可能要一定程度推翻前面的结论。\n我和■■■■■■■■进行了充分交流，获取了许多重要信息，得出了以下结论：\n首先，直到目前为止，我们从未接触过深渊。孤山中心的并非原始的深渊，而是一种分化后的状态，它所表现出的稳定规律，引导方法，存在形式，都是■■■■■■■■塑造的结果。\n就我看来，这一事实是令人振奋的，此前对深渊本质的判断都导向一种令人失望的结局——我们所做的任何应对都可能随机失效，深渊是完全不可定义的。但现在我们可以相对自信的判断：我们需要应对的深渊是被塑造为这个状态的，不存在演化过程或后续发展，会在可预知的未来内继续保持这一状态，因为■■■■■■■■的意愿如此。\n也即，先前的结论可以继续使用，可靠的应对方案会继续可靠。\n\n下面，我要探讨更深层次的内容，可能与我们的生活并无交集，但我希望探求这些。\n古代■■■■■■■■神话不约而同地包含了同一个元素：存在一片无垠的林海，其中的每一片树叶都是一个完整的世界，这些叶片飘入时光之河，事物随即开始发展。而我们的世界不太相同，并非树叶，而是一段枝条，尚且未到脱离树干的时候，在意外中落入时间。\n这段内容从比喻角度来说是相对贴切的，它指出了我们的世界是与众不同的，尚未定型的，并且被外力影响的。\n在和外界的接触中我们能明显发现，其他世界的规则和我们并不完全相同，但我们的事物在外面仍然能按照我们自己的规则运行，或多或少地表明我们的规则是高于外界的规则的，也即树枝高于树叶——目前我们还没见过整棵树倒进河流。\n除此之外，我们可以发现我们的规则没有太硬性的限制，无处不在的深渊影响导致了个体在一定程度上可以无视基本逻辑来影响现实，很多旧时代的集体认知在大多数使用情况下表现出良好的可用性，甚至可以生造出新的规则。\n那么，树海是什么呢？\n深渊这个词并不贴切，我倾向于换一个词，深源。\n起源之起源，终结之终结。一切已存在与未存在都被包含在其中，一切概念都由其分化而出。一切世界由它创生也由它终结，就像大海蒸腾出的水汽终将回归大海。它是无限复杂的绚丽辉光，每一个现实都不过是它的切面；它是超逾理解的无垠混沌，万物在其中融为均一。\n深源是唯一的海，除此之外只是泡沫。"
  ###Abyss is not the right word, I prefer to use another word, Metabyss.
