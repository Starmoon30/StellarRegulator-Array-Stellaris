 SRA_orbital_ring_cap:0 "§B苍宇辉虹§!"
 planet_SRA_orbital_ring_Buff_1:0 "§B苍宇辉虹星环基地§!"
 planet_SRA_orbital_ring_Buff_1_desc:0 "§B一座苍宇辉虹星环基地的存在能将整个星球的产业体系和太空对接，在运输和协调方面提供巨大帮助，并扩展产业的分布模式§!"

 pc_SRA_city:0 "§B流光星界§!"
 pc_SRA_city_adj:0 "§B流光星界§!"
 pc_SRA_city_desc:0 "与§B苍宇辉虹星环基地§!浑然一体的星球，被精心打造的复杂结构层层覆盖，如齿轮般紧紧咬合。整个星球被理性与秩序所规划，紧密相连、处处相接，每一处建筑都是极效的表达，每一个角落都是设计的结晶。"
