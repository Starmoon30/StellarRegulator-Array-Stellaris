 decision_SRA_city_project:0 "§B流光星界工程§!"
 decision_SRA_city_project_desc:0 "将天上的明珠摘下，镶嵌在山与海之上。"
 decision_SRA_city_project_effects:0 "将星球变成§Y$pc_SRA_city$§!，大幅度增加§Y资源生产§!和§Y星球效果§!并解锁特殊的 £district£ §Y流光星界区划§!，提供高质量的 £job_SRA_world_machine_job£ §Y流光星界岗位§!。作为代价，星球的天然资源将§R无法被开发§!。"

 SRA_buildjobs.200.name:0 "§B流光星界§!：已重塑[Root.GetName]"
 SRA_buildjobs.200.desc:0 "层层叠加的先进结构终于完全覆盖了星球的地表，乃至深入地心。\n\n自从这一宏大计划开始实施以来仅仅过了数年，但已经很难回想起[Root.GetName]从前的面貌。无论是引力的简单堆砌还是所谓大自然的鬼斧神工，都已经成为历史。现在放眼望去，唯有绵延万里的星辉构型。\n\n这里曾经被盲目痴愚的可悲法则所统治许久，但现在，它将以被我们千锤百炼的无上设计之身延续亿万年。"
 SRA_buildjobs.200.a:0 "荣光永存。"

