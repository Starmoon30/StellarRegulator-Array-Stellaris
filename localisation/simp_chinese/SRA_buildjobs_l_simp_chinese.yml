 #Astronomical Fabrications
 ap_SRA_world_machine:0 "§B铸星神械§!"
 ap_SRA_world_machine_desc:0 "§B登峰造极的科技和精益求精的成果，将星海铸造成纯粹的毁灭机器§!\n"
 ap_SRA_world_machine_custom_tooltip:0 "解锁§B铸星神械改造§!星球决议，基本取代整个星球的规划内容，按照星球大小降低区划上限并提供自动化产出。\n§Y铸星神械需要7200.00£time£来抵达最高产能。§!"
 building_SRA_world_machine:0 "§B铸星神械-无尽§!"
 building_SRA_world_machine_desc:0 "这一中枢表明整个世界都被星辉机械所控制，自动化的生产线遍布其中，一切都为了最高效率的生产和发展。军工产业被重点划分，对应着远征的庞大需求。\n§Y按照星球大小提供产出，且被视为 $job_foundry$ 岗位享受相关修正。§!"
 building_SRA_world_machine_A:0 "§B铸星神械-流转§!"
 building_SRA_world_machine_A_desc:0 "铸星神械的基础资源产出统筹系统，几乎所有资源都在这里被规划，以便适配各式各样的维护需求。\n§Y按照星球大小提供产出，且被视为 $job_technician$ 岗位享受相关修正。§!"
 building_SRA_world_machine_B:0 "§B铸星神械-永恒§!"
 building_SRA_world_machine_B_desc:0 "铸星神械的科研能力产出统筹系统，科研和管理需求被单独处理，消耗了绝大部分的算力。\n§Y按照星球大小提供产出，且被视为 $job_researcher$ 岗位享受相关修正。§!"
 decision_SRA_world_machine:0 "启动§B铸星神械§!改造"
 decision_SRA_world_machine_desc:0 "启动§B铸星神械§!改造，基本取代整个星球的规划内容，按照星球大小降低区划上限并提供自动化产出。\n§Y铸星神械需要7200.00£time£来抵达最高产能。§!"
 decision_SRA_world_machine_cancel:0 "摧毁§B铸星神械§!"
 decision_SRA_world_machine_cancel_desc:0 "摧毁§B铸星神械§!，使得你可以继续以常规方式规划星球，无论出于什么动机。"

 job_SRA_world_machine_job:0 "星辉停滞者"
 mod_job_SRA_world_machine_job_add:0 "星辉停滞者岗位"
 job_SRA_world_machine_job_plural:0 "星辉停滞者岗位"
 job_SRA_world_machine_job_effect_desc:0 "£job_SRA_world_machine_job£ $job_SRA_world_machine_job_plural$ 唯一要做的事情就是生活。"
 job_SRA_world_machine_job_desc:0 "庞大生产力海洋中的一滴水就能满足一切生活的所需，至于头顶的星空，瞥一眼明灭与变迁便足够了，毕竟那些已经与他们无关了。"
 job_SRA_world_machine_drone:0 "星辉停滞子个体"
 mod_job_SRA_world_machine_drone_add:0 "星辉停滞子个体岗位"
 job_SRA_world_machine_drone_plural:0 "星辉停滞子个体岗位"
 job_SRA_world_machine_drone_effect_desc:0 "£job_SRA_world_machine_drone£ $job_SRA_world_machine_drone_plural$ 唯一要做的事情就是生存。"
 job_SRA_world_machine_drone_desc:0 "格式塔的存续已经被更可靠地保证，格式塔的发展是对保证存续的生产力的浪费，因此格式塔选择存续而非发展，而存续便是——停滞。"
 col_SRA_world_machine:0 "§B铸星神械§!"
 col_SRA_world_machine_desc:0 "整个世界都被星辉机械所控制，自动化的生产线遍布其中，一切都为了最高效率的生产和发展。\n§Y按照星球大小提供产出，且享受岗位产出修正。§!"
 col_SRA_world_machine_tt:0 "$col_SRA_world_machine_desc$"

 d_SRA_world_machine:0 "$building_SRA_world_machine$"
 d_SRA_world_machine_desc:0 "$building_SRA_world_machine_desc$"
 d_SRA_world_machine_A:0 "$building_SRA_world_machine_A$"
 d_SRA_world_machine_A_desc:0 "$building_SRA_world_machine_A_desc$"
 d_SRA_world_machine_B:0 "$building_SRA_world_machine_B$"
