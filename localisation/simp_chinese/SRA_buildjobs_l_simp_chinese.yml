 mod_job_SRA_RE_alloys_specialist_add:0 "星辉锻造者职业"
 job_SRA_RE_alloys_specialist_plural:0 "星辉锻造者职业"
 job_SRA_RE_alloys_specialist_effect_desc:0 "£job_SRA_RE_alloys_specialist£ $job_SRA_RE_alloys_specialist_plural$ 将£minerals£ §Y$minerals$§! 转化为 £alloys£ §Y$alloys$§!。"
 job_SRA_RE_alloys_specialist_desc:0 "将星辉水晶锻造成对应性质的材料可是一项技术活……虽然实际上只需要操作一下设备就是了。"
