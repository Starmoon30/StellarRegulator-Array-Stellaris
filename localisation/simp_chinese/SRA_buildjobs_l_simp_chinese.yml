 building_SRA_RE_research_institute:0 "星辉研究基地"
 building_SRA_RE_research_institute_desc:0 "这里拥有大量由星辉水晶构成的超级计算机，其计算能力远高于我们所研发的任何计算设备。帝国的科学家可以借此解决计算能力对科学研究的桎梏。同时，这些计算阵列的冗余算力还可以起到协助内政管理的作用。\n\n其具体规则如下：\n星球上每有一个£district£§Y区划§!，此建筑提供：\n$mod_job_SRA_RE_research_institute_specialist_add$/$mod_job_SRA_RE_research_institute_drone_add$：§G+20§!\n$mod_pop_SRA_RE_research_institute_specialist_bonus_workforce_mult$/$mod_pop_SRA_RE_research_institute_drone_bonus_workforce_mult$：§G+0.4%§!\n\n在完成对['technology:tech_SRA_T3_Composite_Crystal_Lattice']的研发后：\n$mod_job_SRA_RE_research_institute_specialist_add$/$mod_job_SRA_RE_research_institute_drone_add$：§G+20§!"
