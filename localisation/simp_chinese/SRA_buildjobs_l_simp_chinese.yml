 SRA_requires_orbital_ring:0 "§Y需要存在的星环基地§!"
 SRA_orbital_ring_megastructure_0:0 "§B苍宇辉虹星环基地§!"
 SRA_orbital_ring_megastructure_0_MEGASTRUCTURE_DETAILS:0 "先进型星环基地，提供行星防御和扩展功能，将替换常规星环基地。"
