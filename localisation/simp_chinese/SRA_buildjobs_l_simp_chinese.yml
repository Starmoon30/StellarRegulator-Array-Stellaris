 building_SRA_RE_alloys:0 "星辉锻造厂"
 building_SRA_RE_alloys_desc:0 "这些铸造设施将矿物转化为星辉水晶再进行进一步加工，构成性能优异的军工材料，以便于满足海量的合金需求。\n\n其具体规则如下：\n星球上每有一个£district£§Y区划§!，此建筑提供：\n$mod_job_SRA_RE_alloys_specialist_add$/$mod_job_SRA_RE_alloys_drone_add$：§G+20§!\n$mod_pop_SRA_RE_alloys_specialist_bonus_workforce_mult$/$mod_pop_SRA_RE_alloys_drone_bonus_workforce_mult$：§G+0.4%§!\n\n在完成对['technology:tech_SRA_T3_Composite_Crystal_Lattice']的研发后：\n$mod_job_SRA_RE_alloys_specialist_add$/$mod_job_SRA_RE_alloys_drone_add$：§G+20§!"
