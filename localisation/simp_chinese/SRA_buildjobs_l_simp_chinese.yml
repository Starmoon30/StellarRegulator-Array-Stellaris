 mod_job_SRA_RE_research_institute_specialist_add:0 "星辉研究员职业"
 job_SRA_RE_research_institute_specialist_plural:0 "星辉研究员职业"
 job_SRA_RE_research_institute_specialist_effect_desc:0 "£job_SRA_RE_research_institute_specialist£ $job_SRA_RE_research_institute_specialist_plural$ 消耗 £energy£ §Y$energy$§!£consumer_goods£ §Y$consumer_goods$§! 产出 £physics£ §Y$physics_research$§! £society£ §Y$society_research$§! £engineering£ §Y$engineering_research$§! £unity£ §Y$unity$§!用于我们国家的进步。"
 job_SRA_RE_research_institute_specialist_desc:0 "这些工作人员必须保持时刻有亟待解答的问题和需要演算的项目，毕竟这些计算阵列的算力实在是有点强。"
