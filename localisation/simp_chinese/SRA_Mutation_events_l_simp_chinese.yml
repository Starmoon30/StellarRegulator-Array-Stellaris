 SRA_Mutation.1.name:0 "星规阵列-选择突变等级"
 SRA_Mutation.1.desc:0 "突变是一种对危机 第三远征舰队 的特殊强化机制。\n突变默认不启用。\n危机难度会影响突变的效果与触发概率。\n随机突变选择每一个突变的概率为20%，选择随机突变不会移除先前选择的突变。\n请注意：某些突变可能会对性能产生影响。\n§YBeta测试中。§!"
 SRA_Mutation.1.a:0 "保存当前设置"
 SRA_Mutation.1.b.1:0 "启动突变"
 SRA_Mutation.1.b.1.desc:0 "点击此按钮以启动突变，开始相关触发器的后续判断。\n§Y请在危机开始之前激活。§!"
 SRA_Mutation.1.b.2:0 "关闭突变"
 SRA_Mutation.1.b.2.desc:0 "点击此按钮以关闭突变，相关触发器将不再进行后续判断。"
 SRA_Mutation.1.c:0 "浏览当前设置"
 SRA_Mutation.1.d:0 "自定义突变"
 SRA_Mutation.1.e:0 "随机突变：复仇"
 SRA_Mutation.1.e.desc:0 "我的利刃渴求鲜血。\n随机启用突变，范围包括即时正义、时空涌动、复仇协议、镜像对手、阴魂不散、时空陷阱、乘胜追击、向我集结、星海大盗、金属疲劳、因果报应、步步为营。"
 SRA_Mutation.1.f:0 "随机突变：死亡"
 SRA_Mutation.1.f.desc:0 "万物终将臣服。\n随机启用突变，范围在「复仇」基础上增加拿钱办事、后方紧吃、黑暗收获、力量展示、绝对仇恨、相位变换、荣耀协议、适者生存、危机四伏、顷刻新生。"
 SRA_Mutation.1.g:0 "随机突变：灾厄"
 SRA_Mutation.1.g.desc:0 "可曾享受地狱之旅？\n随机启用突变，范围在「死亡」基础上增加战争赔款、时空冻结、星穹之矛、斩首行动、空间裂痕、航道堵塞、天界轰炸、星界封锁、发配边疆、消极怠工、暗影突袭、命定对手、天罚之剑、罪业连锁、出必见血、完型崩解。"
 SRA_Mutation.1.h:0 "后勤危机"
 SRA_Mutation.1.h.desc:0 "兵马未动，粮草先……我粮草呢？\n启用以下突变：星海大盗、金属疲劳、拿钱办事、后方紧吃、战争赔款、消极怠工。"
 SRA_Mutation.1.i:0 "末世浩劫"
 SRA_Mutation.1.i.desc:0 "纯粹的强大。\n启用以下突变：即时正义、时空涌动、复仇协议、镜像对手、阴魂不散、乘胜追击、向我集结、因果报应、黑暗收获、力量展示、绝对仇恨、相位变换、适者生存、步步为营、顷刻新生。"
 SRA_Mutation.1.j:0 "天幕杀机"
 SRA_Mutation.1.j.desc:0 "世间纷乱，难留一丝喘息。\n启用以下突变：时空陷阱、危机四伏、时空冻结、星穹之矛、航道堵塞、天界轰炸、星界封锁、暗影突袭、天罚之剑。"
 SRA_Mutation.1.z:0 "究极黑暗"
 SRA_Mutation.1.z.desc:0 "登临深渊。\n启用以下突变：即时正义、时空涌动、复仇协议、镜像对手、阴魂不散、时空陷阱、乘胜追击、向我集结、星海大盗、金属疲劳、因果报应、拿钱办事、后方紧吃、黑暗收获、力量展示、绝对仇恨、相位变换、荣耀协议、适者生存、危机四伏、战争赔款、时空冻结、星穹之矛、斩首行动、空间裂痕、航道堵塞、天界轰炸、星界封锁、发配边疆、消极怠工、暗影突袭、命定对手、天罚之剑、罪业连锁、步步为营、出必见血、顷刻新生、完型崩解。"

 #1xx编号的事件为预设

 SRA_Mutation.2.name:0 "浏览当前设置"
 SRA_Mutation.2.desc:0 "点击以移除对应突变。"
 SRA_Mutation.2.a:0 "返回主界面"
 SRA_Mutation.2.b:0 "即时正义"
 SRA_Mutation.2.b.desc:0 "在进入战斗时，远征舰队有概率获得舰队增援。"
 SRA_Mutation.2.c:0 "时空涌动"
 SRA_Mutation.2.c.desc:0 "在进入战斗时，远征舰队有概率获得大幅度攻击速度加成。"
 SRA_Mutation.2.d:0 "复仇协议"
 SRA_Mutation.2.d.desc:0 "每一支被摧毁的远征舰队都会使所有远征舰队获得一段时间的战斗增益。"
 SRA_Mutation.2.e:0 "镜像对手"
 SRA_Mutation.2.e.desc:0 "在进入战斗时，远征舰队有概率复制对方的舰队司令。"
 SRA_Mutation.2.f:0 "阴魂不散"
 SRA_Mutation.2.f.desc:0 "任何一支远征舰队在被摧毁后都有概率在原地召唤一支援军。"
 SRA_Mutation.2.g:0 "时空陷阱"
 SRA_Mutation.2.g.desc:0 "远征舰队存在时，所有敌对势力的舰队在进入恒星系时有概率被大幅度减速一段时间。"
 SRA_Mutation.2.h:0 "乘胜追击"
 SRA_Mutation.2.h.desc:0 "任何一支远征舰队在战斗胜利后都有概率获得一段时间的战斗增益。"
 SRA_Mutation.2.i:0 "向我集结"
 SRA_Mutation.2.i.desc:0 "任何一支远征舰队在战斗胜利后都有概率召唤一支援军。"
 SRA_Mutation.2.j:0 "星海大盗"
 SRA_Mutation.2.j.desc:0 "每隔随机的一段时间，远征舰队将窃走玩家的一部分资源。"
 SRA_Mutation.2.k:0 "金属疲劳"
 SRA_Mutation.2.k.desc:0 "与远征舰队交战过的玩家舰队有概率大幅度增加自身维护费一段时间。"
 SRA_Mutation.2.l:0 "拿钱办事"
 SRA_Mutation.2.l.desc:0 "远征舰队存在时，玩家舰队每次进入恒星系和进入战斗都有概率消耗资源。"
 SRA_Mutation.2.m:0 "后方紧吃"
 SRA_Mutation.2.m.desc:0 "远征舰队存在时，玩家的造船费用将每隔随机的一段时间随机提升一段时间。"
 SRA_Mutation.2.n:0 "战争赔款"
 SRA_Mutation.2.n.desc:0 "玩家摧毁任何一个远行航标都将被扣除巨量资源，且所有产出减少一段时间。"
 SRA_Mutation.2.o:0 "黑暗收获"
 SRA_Mutation.2.o.desc:0 "每当远征舰队摧毁一个星球，使所有远征舰队获得一段时间的战斗增益，并且有概率使远征舰队获得增援。"
 SRA_Mutation.2.p:0 "力量展示"
 SRA_Mutation.2.p.desc:0 "玩家舰队被远征舰队摧毁时，有概率使玩家受到一段时间的战斗减益。\n§Y此修正每隔5.00£time£更新一次。§!"
 SRA_Mutation.2.q:0 "绝对仇恨"
 SRA_Mutation.2.q.desc:0 "每当一个远行航标被摧毁，所有远征舰队获得永久战斗增益。"
 SRA_Mutation.2.r:0 "时空冻结"
 SRA_Mutation.2.r.desc:0 "每隔随机的一段时间，远征舰队将对所有玩家释放时空冻结。"
 SRA_Mutation.2.s:0 "星穹之矛"
 SRA_Mutation.2.s.desc:0 "远征舰队获得一艘星穹之矛。\n\n-星穹之矛拥有被动子系统 §B「潜时沉寂」§! §B「永时流转」§! §B「诸世尽灭」§! §B「破晓凯旋」§! §B「星核超载」§! §B「末世浩劫」§! §B「飘落传说」§!。\n-星穹之矛将每隔一段时间释放 §B「彗耀迫临」§! §B「星阵卫戍」§! §B「事件视界」§!，并折跃至下一个目标恒星系。\n-星穹之矛将在交战时释放 §B「爆华绽放」§! §B「溟乎远响」§! §B「苍星陨灭」§! §B「奇点爆发」§!。\n-星穹之矛被摧毁后将在一段时间后重新部署。\n\n§R星穹之矛存在时，远行航标和要塞的空间隔绝屏障不会解除！§!"
 SRA_Mutation.2.t:0 "相位变换"
 SRA_Mutation.2.t.desc:0 "在进入战斗时，远征舰队有概率完全压制对方的命中能力，持续一段时间。"
 SRA_Mutation.2.u:0 "斩首行动"
 SRA_Mutation.2.u.desc:0 "在进入战斗时，远征舰队有概率直接杀死对方的舰队司令。"
 SRA_Mutation.2.v:0 "荣耀协议"
 SRA_Mutation.2.v.desc:0 "任何一支远征舰队在被摧毁后都有概率发生具有群体伤害的爆炸。"
 SRA_Mutation.2.w:0 "因果报应"
 SRA_Mutation.2.w.desc:0 "摧毁远征舰队的舰队将随机受到减益，持续一段时间。"
 SRA_Mutation.2.x:0 "空间裂痕"
 SRA_Mutation.2.x.desc:0 "任何一支远征舰队在被摧毁后都有概率在原地产生一个空间风暴，对其中的所有舰队造成极高伤害，持续一段时间。"
 SRA_Mutation.2.y:0 "适者生存"
 SRA_Mutation.2.y.desc:0 "每摧毁一支远征舰队，玩家对远征舰队的伤害都有概率下降一段时间。\n§Y此修正每隔5.00£time£更新一次。§!"
 SRA_Mutation.2.z:0 "航道堵塞"
 SRA_Mutation.2.z.desc:0 "远征舰队存在时，玩家舰队的超空间航速大幅度减缓，进入超空间的时间大幅度延长。"
 SRA_Mutation.2.aa:0 "天界轰炸"
 SRA_Mutation.2.aa.desc:0 "远征舰队将在玩家舰队的周围随机部署信标，一段时间后将在信标位置打开一个跨星系打击虫洞进行对舰队打击。"
 SRA_Mutation.2.ab:0 "危机四伏"
 SRA_Mutation.2.ab.desc:0 "远征舰队存在时，玩家舰队在进入恒星系时有概率遭遇埋伏的远征舰队。"
 SRA_Mutation.2.ac:0 "星界封锁"
 SRA_Mutation.2.ac.desc:0 "远征舰队存在时，玩家舰队将无法跃迁。"
 SRA_Mutation.2.ad:0 "发配边疆"
 SRA_Mutation.2.ad.desc:0 "摧毁远征舰队的玩家舰队有概率被传送到随机位置。"
 SRA_Mutation.2.ae:0 "消极怠工"
 SRA_Mutation.2.ae.desc:0 "远征舰队存在时，玩家的造船速度将每隔随机的一段时间随机减少一段时间。"
 SRA_Mutation.2.af:0 "暗影突袭"
 SRA_Mutation.2.af.desc:0 "每隔一段时间，一批远征舰队会直接折越抵达你的首都。"
 SRA_Mutation.2.ag:0 "命定对手"
 SRA_Mutation.2.ag.desc:0 "所有非玩家势力与远征舰队交战时会遭受毁灭性的打击"
 SRA_Mutation.2.ah:0 "天罚之剑"
 SRA_Mutation.2.ah.desc:0 "每隔一段时间，一批远征舰队会直接折越抵达你的随机一支舰队附近。"
 SRA_Mutation.2.ai:0 "疫心恶殖"
 SRA_Mutation.2.ai.desc:0 "摧毁远征舰队的玩家舰队有概率被感染，在极长的时间内不断流失生命值。"
 SRA_Mutation.2.aj:0 "罪业连锁"
 SRA_Mutation.2.aj.desc:0 "在2.00£time£内摧毁远征舰队的舰队将会失踪，回归时间取决于难度。"
 SRA_Mutation.2.ak:0 "步步为营"
 SRA_Mutation.2.ak.desc:0 "远征舰队摧毁目标后有概率在此位置建立一座防御站"
 SRA_Mutation.2.al:0 "出必见血"
 SRA_Mutation.2.al.desc:0 "某些远征舰队只有在摧毁过敌方舰队后才能被真正摧毁。"
 SRA_Mutation.2.am:0 "时光易逝"
 SRA_Mutation.2.am.desc:0 "远征舰队存在时，若在暂停时为舰队下达指令，则会受到惩罚。\n§Y试验性技术，并不能稳定触发。§!"
 SRA_Mutation.2.an:0 "掩息闭目"
 SRA_Mutation.2.an.desc:0 "远征舰队存在时，若在星系视图为舰队下达指令，则会受到惩罚。"
 SRA_Mutation.2.ao:0 "进化霸主"
 SRA_Mutation.2.ao.desc:0 "摧毁远征舰队的舰队将有概率退化为更低级的形态。"
 SRA_Mutation.2.ap:0 "顷刻新生"
 SRA_Mutation.2.ap.desc:0 "远征舰队获得极高的每日再生能力。"
 SRA_Mutation.2.aq:0 "完型崩解"
 SRA_Mutation.2.aq.desc:0 "每隔一段时间，你的随机一个可设计舰船的设计将被标记，远征舰队会生成一支 仅包含一艘使用此设计的舰船 的舰队活动720.00£time£，并在倒计时结束时自毁，清除标记。\n一旦任何一个被标记的舰船被摧毁，其他所有设计被标记的舰船立即被摧毁。"


 SRA_Mutation.3.name:0 "自定义突变"
 SRA_Mutation.3.desc:0 "点击以开启对应突变，稍后可在「浏览当前设置」处取消所选择的突变。"

 SRA_Mutation_Boom:0 "范围伤害"
 SRA_Mutation_Boom_mid_1:0 "空间风暴"
 SRA_Mutation_Boom_mid_2:0 "荣耀爆炸"
 SRA_Mutation_Boom_mid_3:0 "苍星陨灭"
 SRA_Mutation_Boom_mid_4:0 "苍星陨灭"

 SRA_Mutation_Aura_1:0 "§B空间风暴§!"
 SRA_Mutation_Aura_1_DESC:0 "§B一场可怕的空间风暴正在发生，扭曲撕裂的空间结构将把几乎一切湮灭。§!"
 SRA_Mutation_Aura_2:0 "§B荣耀爆炸§!"
 SRA_Mutation_Aura_2_DESC:0 "§B一场剧烈的爆炸对整个恒星系造成了冲击。§!"
 SRA_SOGZ_menu_sub_4_3_Aura:0 "§B苍星陨灭§!"
 SRA_SOGZ_menu_sub_4_3_Aura_DESC:0 "§B毁灭性的庞大能量对整个恒星系造成了冲击。§!"
 SRA_SOGZ_menu_sub_6_1_Aura:0 "§B新星终结§!"
 SRA_SOGZ_menu_sub_6_1_Aura_DESC:0 "§B毁灭性的庞大能量对整个恒星系造成了冲击。§!"


 SRA_Mutation_1301_message_desc:0 "$SRA_Mutation_1301_fleet|Y$的$admiral$$SRA_Mutation_1301_leader|Y$在指挥舰队交战时，因一场斩首行动而§R阵亡§!。"

 SRA_Mutation.23012.name:0 "空间裂痕"
 SRA_Mutation.23012.desc:0 "因为击毁了一支远征舰队，现在 [SRA_Mutation_23011_system.GetName] 中已经形成了一道空间裂痕，紊乱的空间风暴正在形成，预计30天后将会撕碎恒星系内的一切舰队，只有做了针对处理的远征舰队能够不受影响。"
 SRA_Mutation.23012.a:0 "立即撤出这个恒星系。"

 SRA_Mutation.4309.MESSAGE_SRA_StellarRegulator:0 "舰船设计 $SRA_Mutation_4309_target|Y$ 被设为了 完型崩解 的目标。"

 SRA_Mutation.53022.name:0 "时光易逝"
 SRA_Mutation.53022.desc:0 "你在暂停时为舰队下达了一次指令，因此受到了惩罚。"
 SRA_Mutation.53022.a:0 "一个殖民地被宣判终结。"
 SRA_Mutation.53022.b:0 "一个殖民地恒星系被宣判终结。"
 SRA_Mutation.53022.c:0 "一个星区被宣判终结。"
 SRA_Mutation.53032.name:0 "掩息闭目"
 SRA_Mutation.53032.desc:0 "你在星系视图为舰队下达了一次指令，因此受到了惩罚。"
 SRA_Mutation.53032.a:0 "一个殖民地被宣判终结。"
 SRA_Mutation.53032.b:0 "一个殖民地恒星系被宣判终结。"
 SRA_Mutation.53032.c:0 "一个星区被宣判终结。"
# 突变列表
#################相关数值有更改，请参阅代码内的实际数值
# 1101即时正义：在进入战斗时，远征舰队有概率获得舰队增援。（1%，难度递增1%）
# 1102时空涌动：在进入战斗时，远征舰队有概率获得大幅度攻击速度加成。（5%概率，200%攻速，10天，难度递增5%，200%，5天）
# 2101复仇协议：每一支被摧毁的远征舰队都会使所有远征舰队获得一段时间的战斗增益。（10%伤害，90天，难度递增10%，45天）
