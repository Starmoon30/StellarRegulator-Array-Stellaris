 LARGE_SRA_RE_Core_ship_Part_Armor:0 "§Y先驱装甲§!"
 LARGE_SRA_RE_Core_ship_Part_Armor_DESC:0 "§Y这种神秘的装甲由被“冻结”的奇物质和光子组成，在充能状态下几乎无懈可击。§!"

 SRA_RE_Core_SHIP_Thruster:0 "§Y先驱机动系统§!"
 SRA_RE_Core_SHIP_Thruster_DESC:0 "§Y科尔先驱基于其先进的时空动力学技术，通过与时空结构之间进行动量交换来移动舰船。§!"

