 SRA_T4_ship_Part:0 "§B星规-叹息之墙§!"
 SRA_T4_ship_Part_DESC:0 "§B这套先进的舰船防御系统基于['concept_SRA_Stellarcrystal_Fractal']材料，动态地构建船体结构并随需求流转，削弱、偏移、阻挡和抵抗一应损伤，并以匪夷所思的速度自我修复。§!"
