 SRA_SD_ship_Part_Shield:0 "解离屏障"
 SRA_SD_ship_Part_Shield_DESC:0 "此法术装置为舰船投射一道常态不可见的护盾以保护其在所有形式的攻击中不受伤害。\n解离屏障会阻截任何将物体或法术射入屏障的尝试，并将触碰其外表面的物体解离为可用于补强舰体的源质，故此组件被视为能够加强装甲与船体。"
