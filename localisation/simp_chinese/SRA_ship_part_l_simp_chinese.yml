 LARGE_SRA_T3_ship_Part_Reactor_DESC:0 "§YCSC-97-R['concept_SRA_Composite_Crystal_Lattice']能量容器\n借助星辉水晶的独特性质，我们得以制造出这些安全稳定的超级能量容器。既然战舰并非每时每刻都在交战，其上的设备并非每时每刻都在全功率运转，那么用能量容器取代部分反应堆的功能完全是可行的。§!"

 SRA_T3_SHIP_Thruster:0 "§Y晶格-辉流天引§!"
 SRA_T3_SHIP_Thruster_DESC:0 "§YCSC-63-CT['concept_SRA_Composite_Crystal_Lattice']虚引力推进器\n通过对全舰施加相同的动力来完成机动，使得内部不再受惯性的影响，可以做出更大幅度的机动动作。§!"

 SRA_T3_Sensor:0 "§Y晶格-星神之狩§!"
 SRA_T3_Sensor_DESC:0 "§YCSC-79-CS['concept_SRA_Composite_Crystal_Lattice']波动探测器\n这一探测器通过探测分析周围的空间波动来发现和锁定一切。§!"

 SRA_T3_Aura_1:0 "§Y晶格-星霆流宇之威能§!"
 SRA_T3_Aura_1_DESC:0 "§YCSC-763-A-1['concept_SRA_Composite_Crystal_Lattice']压制系统\n借助['concept_SRA_Composite_Crystal_Lattice']技术，我们能对敌方的作战系统进行强有力的干扰，而且还能针对性地压制敌方武器对于护盾与装甲的穿透能力。§!"
 SRA_T3_Aura_1_1:0 "§Y「掌心的纯光」§!"

