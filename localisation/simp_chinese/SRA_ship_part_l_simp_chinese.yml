 SRA_T3_Armor_Intensifier_DESC:0 "§YCSC-2048-AI['concept_SRA_Composite_Crystal_Lattice']防御协同\n藉由['concept_SRA_Composite_Crystal_Lattice']技术，以星辉水晶网络调整防御系统，合理分配护盾能源，优化自适应装甲结构，从而增加舰船护盾和装甲的承受上限，并提升对穿透武器的抵抗力。§!"
 SRA_T3_Weapon_Intensifier:0 "§Y晶格-星辉谐振仪§!"
 SRA_T3_Weapon_Intensifier_DESC:0 "§YCSC-7096-WI['concept_SRA_Composite_Crystal_Lattice']战术互联\n藉由['concept_SRA_Composite_Crystal_Lattice']技术，以星辉水晶网络优化战术互联系统，减少数据传输延迟，高效处理战斗数据，提升武器毁伤效果。§!"

