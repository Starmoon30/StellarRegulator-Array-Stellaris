 SRA_T3_ship_Part_Reactor:0 "§Y晶格-源生星能晶§!"
 SRA_T3_ship_Part_Reactor_DESC:0 "§YCSC-97-R['concept_SRA_Composite_Crystal_Lattice']能量容器\n借助星辉水晶的独特性质，我们得以制造出这些安全稳定的超级能量容器。既然战舰并非每时每刻都在交战，其上的设备并非每时每刻都在全功率运转，那么用能量容器取代部分反应堆的功能完全是可行的。§!"
 SMALL_SRA_T3_ship_Part_Reactor:0 "§Y晶格-源生星能晶§!"
 SMALL_SRA_T3_ship_Part_Reactor_DESC:0 "§YCSC-97-R['concept_SRA_Composite_Crystal_Lattice']能量容器\n借助星辉水晶的独特性质，我们得以制造出这些安全稳定的超级能量容器。既然战舰并非每时每刻都在交战，其上的设备并非每时每刻都在全功率运转，那么用能量容器取代部分反应堆的功能完全是可行的。§!"
