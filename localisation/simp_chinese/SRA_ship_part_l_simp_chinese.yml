 SRA_SD_Abyss_Hostile_Ship_Aura_DESC:0 "§R哪怕故事已成定局，它仍要你展现更多。§!\n\n§Y-被此舰船的武器 §R深渊召选§! 命中的舰船的所在舰队会获得32.00£time£的 §R宿命终结§! ，使其免疫 §R荒谬英雄§! 的所有效果。\n-§Y-§R深渊召选§! 每32.00£time£开火一次。\n-§ R荒谬英雄§! 光环会将不具有§R宿命终结§!的舰队驱逐出战斗。§!"
 SRA_SD_Abyss_Hostile_Ship_Aura_1:0 "§R荒谬英雄§!"