 SRA_T4_SHIP_Thruster:0 "§B星规-星河纵横§!"
 SRA_T4_SHIP_Thruster_DESC:0 "§B这套驱动系统通过先进的时空动力学原理，实现了与时空结构之间的动量交换，从而精准调控舰船的运动状态§!"
 SRA_T4_Sensor:0 "§B星规-阵列之眼§!"
 SRA_T4_Sensor_DESC:0 "§B这套传感阵列在构造出的现实映射中获取目标位置与状态，得以摆脱在真实环境中受到的各种干扰，实现更加精妙的信息获取。§!"
 SRA_T4_Reactor:0 "§B星规-星辉焦点§!"
 SRA_T4_Reactor_DESC:0 "§B这座复杂的水晶结构是一种独特的超距能量网络的一个接收终端。庞大的能量会在转瞬之间跨越难以想象的距离灌注进水晶之中，并为整艘舰船提供充足的能源。§!"
 SRA_T4_Reactor_Core:0 "§B星规-时空相位引擎§!"
 SRA_T4_Reactor_Core_DESC:0 "§B可能是一种用于输出能源并在作用范围内产生一系列时空效应的装置。§!"
 SRA_ship_damage_reduction_001:0 "§Y超然构造：§!此舰船具有相当于其 §Y当前船体上限 1%§! 的 §G$MOD_SHIP_DAMAGE_REDUCTION_ADD$§!"
 SRA_ship_damage_reduction_armor:0 "§Y先进装甲镀层：§!此舰船具有相当于其 §Y当前装甲值 10%§! 的 §G$MOD_SHIP_DAMAGE_REDUCTION_ADD$§! §!"
 SRA_ship_damage_reduction_shield:0 "§Y阻尼立场：§!此舰船具有相当于其 §Y当前护盾值 10%§! 的 §G$MOD_SHIP_DAMAGE_REDUCTION_ADD$§! §!"
#  SRA_T4_Reactor_Core_DESC:0 "§B在中子星星系自由移动的能力。暂时免疫环境效果的能力。\n敌人死亡时有几率为你恢复生命。极大提高生命恢复速度。当你位于中子星星系时额外增加生命恢复速度和防御。击中一个生命值低于50%的敌人恢复生命，这个效果有冷却时间。\n允许你进行冲刺。被冲刺撞到的敌人会受到极高的碰撞伤害。在冲刺过程中你免疫绝大多数减益。\n如果掉到0血，会获得始源林海无敌增益，使其在8£time£内不能死亡。此效果每300£time£仅会生效一次。\n受到伤害时有25%的几率获得2£time£的生命涌流增益，增加生命恢复。\n动能攻击击中时治疗你。\n每15次动能攻击，给予自身鲜血狂怒增益。这个效果有30£time£的冷却。\n受到超过80000点伤害会放出8个高伤害的弑神飞镖。飞镖造成无类型伤害，受动能伤害加成。飞镖会造成3£time£的神弑者之怒焰减益。\n敌人碰到你时反弹相当于其每日伤害的2.5倍的伤害。\n如果一次攻击对你造成少于80000点伤害，则它改为对你造成1点伤害。\n所有射弹在击中敌人后产生2枚叶片，再分裂为2个生命能量。叶片造成伤害量为此次攻击25%的无类型伤害。生命能量造成伤害量为此次攻击33%的无类型伤害。这个效果有1£time£的冷却。\n释放16个血炎灵魂伤害敌人。血炎灵魂造成无类型伤害，受所有伤害加成。这个效果有30£time£的冷却。\n所有武器每2.5£time£发射一个爆炸血炎珠。爆炸造成的伤害相当于触发此效果的武器伤害的80%。\n使用所有武器时，每2.5£time£会发射一枚弑神榴霰弹。弑神榴霰弹造成的伤害相当于触发此效果的射弹伤害的100%。在击中敌人后碎成4-6个造成相当于本次榴霰弹伤害30%伤害的弹片。\n每造成5次伤害，就能够发射一片扇形的由8-10个叶片组成的射弹。叶片造成的伤害相当于触发此效果的攻击的伤害的20%。\n能量射弹有50%的几率治疗自身，这个效果有1.5£time£的内置冷却。\n能量武器每1.67£time£发射一个灵魂射弹。灵魂射弹造成相当于触发这个效果的攻击的130%伤害。\n能量武器伤害每2£time£产生一次火焰爆炸。爆炸造成3次伤害，每次的伤害量相当于触发这个效果的攻击的50%。可击中次数耗尽或即将消失的能量射弹击中敌人时每5£time£会产生大爆炸。\n召唤生命光环围绕自身，对附近的敌人持续造成伤害。生命光环受舰载机伤害加成。\n召唤3个噬魂地雷环绕自身，击中敌人时爆炸。噬魂地雷受舰载机伤害加成，刷新时间为15£time£。\n如果自身的血量在90%及以上，增加10%舰载机伤害。如果自身的血量在50%及以下，增加防御和生命恢复。\n召唤始源林海水晶悬浮于自身头顶，向敌人发射生命能量，受舰载机伤害加成。\n当自身处于被减益影响的状态时，每种减益都会增加10%爆破伤害。\n自身每造成25次爆破伤害就会获得3£time£龙蒿无敌增益。这个效果有30£time£的冷却。\n爆破武器伤害有50%的概率治疗你。\n如果自身的血量在80%以上，增加防御和6%爆破伤害。如果自身的血量在80%及以下，增加10%爆破伤害。\n满血时获得10%的爆破伤害、伤害率和射弹速度加成。\n如果一次攻击对你造成高于80000点伤害，你会获得0.5£time£无敌\n射弹击中敌人时生成圣金源光球治疗自身§!"

 SRA_T4_Jump:0 "§B星规-众星领航§!"
 SRA_T4_Jump_DESC:0 "§B星规阵列所使用的这套超光速引擎通过对自身相位坐标的变换完成超光速旅行，可以在一次机动中跨越任意距离。§!"
 SRA_Aura_1:0 "§B星规-「法之书」装置§!"
 SRA_Aura_1_DESC:0 "§BAC-LOTT「法之书」现实约束系统是用于在不稳定环境下强制规定作用范围内基本规则的星规技术装置，旨在尽可能地保持基本行为能力。\n这一改装版本扩大了作用范围以取得一定程度的优势。§!"
 SRA_Aura_1_1:0 "§B“如你所愿”§!"
 SRA_Aura_2:0 "§B星规-复合压制系统§!"
 SRA_Aura_2_DESC:0 "§B复杂的系统由无数技术堆砌，这套压制系统分析并对策敌人的每一个基本技术，从所有角度对舰船的运行造成毁灭性的打击。§!"
 SRA_Aura_2_1:0 "§B命运「Miserable Fate」§!"
 SRA_Aura_3:0 "§B星规-分析歼灭系统§!"
 SRA_Aura_3_DESC:0 "§B这套系统能将整个舰队联合起来，分析和共享敌方舰队的交互特征，进而提升每艘舰船的毁伤能力。§!"
 SRA_Aura_3_1:0 "§B表象「射弹Paranoia」§!"
 SRA_Aura_4:0 "§B星规-广域防护立场§!"
 SRA_Aura_4_DESC:0 "§B这套系统能将整个舰队联合起来，重分配能源到交互部分，进而提升每艘舰船的防御能力。§!"
 SRA_Aura_4_1:0 "§B抑制「Super Ego」§!"

 SRA_Aura_6:0 "§B星规-时空调谐系统§!"
 SRA_Aura_6_DESC:0 "§B这一作战系统能干涉整个恒星系的时空结构，展现出多种多样的效果。§!\n\n§Y对敌方舰队的效果总是生效，对盟友舰船的效果则按照当前选择的星穹之矛模块分配激活。"
 SRA_Aura_6_1:0 "§B潜时沉寂§!"
 SRA_Aura_6_3:0 "§B永时流转§!"
 SRA_Aura_6_4:0 "§B诸世尽灭§!"
 SRA_Aura_6_5:0 "§B冥海引航§!"
 SRA_Aura_6_6:0 "§B破晓凯旋§!"


 SRA_T4_Armor_Intensifier:0 "§B星规-铁御核心§!"
 SRA_T4_Armor_Intensifier_DESC:0 "§B这套设备建立全面的主动防御机制，以多种方式削弱来袭攻击的强度，变相增加舰船护盾和装甲的承受上限，并提升对穿透武器的抵抗力。§!"
 SRA_T4_Weapon_Intensifier:0 "§B星规-聚焦星核§!"
 SRA_T4_Weapon_Intensifier_DESC:0 "§B这件装置协调来自反应堆的能量，按特定模式注入进舰船武器中以增强其能量密度与运作效率，有效提升舰船火力。§!"
 SRA_T4_Auxiliarm_Motor:0 "§B星规-疾风引擎§!"
 SRA_T4_Auxiliarm_Motor_DESC:0 "§B这套辅助运动系统通过动量变换技术大幅度提升舰船的机动性，超乎常理的机动常常能闪避依赖常规预测模式的攻击。§!"

