 SRA_RE_Core_Reactor:0 "§Y先驱能源核心§!"
 SRA_RE_Core_Reactor_DESC:0 "§Y这一套神奇的供能体系不是某种反应堆，而是一组拥有极高能量密度的储能单元。§!"

 SRA_RE_Core_Jump:0 "§Y先驱空间引擎§!"
 SRA_RE_Core_Jump_DESC:0 "§Y科尔先驱通过对时空结构的调整来实现点对点的折跃机动。§!"

 SRA_RE_Core_Computer:0 "§Y先驱战争程序§!"
