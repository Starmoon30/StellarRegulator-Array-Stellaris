 edict_SRA_Diplomacy_1:0 "星规外交协议"
 edict_SRA_Diplomacy_1_desc:0 "“朝贡是结盟的高级形式。”\n所有国家的£opinion£§Y评价增加§!§G+1000§!\n\n此外，激活时立即使你对所有国家的§Y当前情报§!§G+100§!，你所在的联邦立即获得§G+20000§!经验。\n§Y作弊法令§!"
