 SRA_RE_Rocivia_talk_exit1:0 "结束通讯。"
 SRA_RE_Rocivia_talk_exit3:0 "终止研究"
 SRA_RE_Rocivia_talk_return2:0 "很好，让我想想还有什么事。" 
 SRA_RE_Rocivia_talk_return3:0 "还是算了。" 
 SRA_RE_Rocivia_talk_return4:0 "我们聊点别的吧。" 
 

 SRA_RE_Rocivia.2.desc:0 "欢迎，执行官，跟小星规深入交流过了吗？还没有？果然……\n咳咳，如你所见，身为最高议长的我，统领着帝国最高议会，执掌着这个国家的最高权力……这最高怎么这么多……\n呃，我同时还直接管辖帝国科学院，监管这群科学家的大体研究方向。\n如果你想在议会上提出几个议案，或者让科学院搞点大项目，那就来找我吧。"
 SRA_RE_Rocivia.1.desc:0 "你好啊，今天想要点什么？"
 SRA_RE_Rocivia.1.desc.b:0 "Ciallo～(∠・ω< )⌒★"
 SRA_RE_Rocivia.1.a:0 "提供帮助"
 SRA_RE_Rocivia.1.b:0 "向科学院发布项目"
 SRA_RE_Rocivia.1.c:0 "闲聊"
 SRA_RE_Rocivia.1.d:0 "让路希维亚回归领袖之位"


 SRA_RE_Rocivia.3011.a.desc:0 "这些带有愚蠢舰桥的楔形舰船的技术并没有那么深不可测，尽管其独特的作战系统无论在面对什么敌人时都能稳定运行……显然是有某种狡猾的东西在影响。"
 SRA_RE_Rocivia.3011.b.desc:0 "恒星基地并不可靠：绝大多数舰船都会把这一醒目的太空建筑视为首要的攻击目标，而一旦恒星基地被攻占，依附其上的防御平台便会临阵倒戈。\n另外，当恒星基地被摧毁时，周围的防御平台也会随之自毁。\n所以说，堆砌静态防御还不如多准备几支守备舰队。"
 SRA_RE_Rocivia.3011.c.desc:0 "孤立的星团并没有大多数人想象中那么安全，有些恒星系你们无法依靠跃迁进入，某些危机势力却可以。\n保留一条常规通道，反而能控制住它们的行为模式。"
 SRA_RE_Rocivia.3011.d.desc:0 "那些红黑色的环形世界属于一个一度极为繁盛的古代文明，其中某些技术即便是你们也无法复原。\n需要注意的是，你们获取的古代战舰在大部分方面与它们在敌对时的强度相差无几：面对的敌人越强，收获自然也越丰盛。"
 SRA_RE_Rocivia.3011.e.desc:0 "按设定来说我有在工作，你的大多数指令都是由我来发布的。而且领袖加成也就代表我的工作能够让国家机构之类的东西以更高的效率运转……总不可能是所有人都带着我的照片，累个半死的时候拿出来看一眼就能精神焕发再度投身于工作吧。"
 SRA_RE_Rocivia.3011.f.desc:0 "我在想要不要在头顶上加一对猫耳朵……或者狐狸耳朵之类的，我总觉得我的人设里有什么东西被删掉了。"
 SRA_RE_Rocivia.3011.g.desc:0 "别让怜悯的锁链缠住了你，别让敌人的眼泪蒙蔽了你自己的双眼。"
 SRA_RE_Rocivia.3011.h.desc:0 "不要对敌人浪费你的同情心，施展雷霆手腕方显仁慈心肠。"
 SRA_RE_Rocivia.3011.i.desc:0 "某个致力于回收质能的奇怪文明正在活动……很难想象在这样一个四面漏风的物质宇宙中还有人担心质能的损失。"
 SRA_RE_Rocivia.3011.j.desc:0 "看起来这片星区存在一些喜欢分享技术的人工智能，或者说，数据库管理系统？\n\n我大概会看到所有人都在用同一套数据包的场景了，而且还有某些老东西连数据包都不会用。"
 SRA_RE_Rocivia.3011.k.desc:0 "测试，又是测试，一番考验后给获胜者送力量是什么流传在文明之间的热门项目吗？\n\n我建议你在完成大部分目标后再去碰那些发金光的星门。"
 SRA_RE_Rocivia.3011.l.desc:0 "天哪，舰娘，这太二次元了。\n\n我大概会看到一大堆海船上天的场景。"
 SRA_RE_Rocivia.3011.m.desc:0 "超古代，超古代，超古代，怎么满大街都是这个前缀，这里是什么考古中心吗？"
 SRA_RE_Rocivia.3011.n.desc:0 "难道这些半有机机械就一定要在每个舰船组件上都设计特殊机制吗？"
 SRA_RE_Rocivia.3011.o.desc:0 "你的技术体系为何在对银河中心的开发中迟滞不前？明明另一套类似的巨型结构体系早就在对中心天体动手动脚了。\n\n总不可能是因为缺少合适的外形设计方案吧。"
 SRA_RE_Rocivia.3011.p.desc:0 "是什么让那些舰船一次又一次的复原？不，我不知道什么弹幕游戏，也没听说过什么车万。"



 SRA_RE_Rocivia.3012.a.desc:0 "我游历过许多世界，引导过许多文明，其中有不少都给自己冠上了我的名字，但要说印象最深刻的，还是你所知道的那个“路希维亚帝国”。至于为什么……大概是因为某个小家伙吧。"
 SRA_RE_Rocivia.3012.b.desc:0 "能够毫无风险度过的时间只有“昨天”，已经变成过去式、无法改变的事情总归很无聊。预想一下今后将会发生的事情，一切都相互牵连，轻轻拨动就能搅动潮汐……想一想就让人心潮澎湃！"

 SRA_RE_Rocivia.3013.a.desc:0 "历史既重复自身又各不相同，既已然终结又无穷无尽。"
 SRA_RE_Rocivia.3013.b.desc:0 "我想，有件事情我们都会同意，暴力催生暴力，且最终它只能如此。\n不过呢，当鲜血洒落大地，毁灭之轮倾轧而过后，也许，变化的种子终会萌发。"

 SRA_RE_Rocivia.3014.a.desc:0 "有没有一种可能，只是一种猜测啊，就是说，我的对话其实是设计好的，只要你按下enter或者鼠标轻轻点一下就能看我在这里自言自语。"

 SRA_RE_Rocivia.100.desc:0 "啊，我可以为你提供一些帮助，不过目前还没几个帮助可以选就是了。"
 SRA_RE_Rocivia.100.a:0 "施展法术"

 SRA_RE_Rocivia.101.desc:0 "好，让我们看看今天的法术位轮出来了啥法术。\n魔法，是的，魔法，很奇怪吗？我好歹也是一个享誉诸界的传奇法师啊。只要你提供一下施法材料，我就能施展一些能够影响很大范围的法术，增强我方或者削弱敌方，很简明易懂吧。\n如果你不想要的话，通常情况下呢，我的法术位要三个月才能更新一次，嗯，施法冷却也是三个月。\n什么，蓝条施法？没有没有，怎么会有那种事嘛，我可是从来——都没有听说过呢~。"
 SRA_RE_Rocivia.101.a:0 "真实之视"
 SRA_RE_Rocivia.101.a.desc:0 "这个法术使得受作用者在进行某些行为时能预知到操作所带来的结果，因此你舰队的命中率将会极大的提升，在大多数情况下实现百发百中。这个效果持续90天。"
 SRA_RE_Rocivia.101.b:0 "灵感迸发"
 SRA_RE_Rocivia.101.b.desc:0 "这个法术使得受作用者能够更好的总结自己的所知并进行创造性活动，这使得我们所有科学研究者对新科技的研发速度提升。这个效果持续90天。"
 SRA_RE_Rocivia.101.c:0 "疾风之速"
 SRA_RE_Rocivia.101.c.desc:0 "这个法术使得受作用者能够在移动上获得神奇的增幅，这使我们的舰队的机动性提升。这个效果持续90天。"
 SRA_RE_Rocivia.101.d:0 "剑火之祝"
 SRA_RE_Rocivia.101.d.desc:0 "这个法术使得受作用者能够在战斗中制造更大的伤害，并变得更加强大。这个效果持续90天。"
 SRA_RE_Rocivia.101.e:0 "山川之序"
 SRA_RE_Rocivia.101.e.desc:0 "这个法术使得既有的秩序更加稳固，社会的凝聚力更强。这个效果持续90天。"


 SRA_RE_Rocivia.102.desc:0 "好，那么施法已经完成了。\n嗯？无咏唱无引导施法难道不是每个法师都应该掌握的技巧吗？\n诶，这很难吗？"
 SRA_RE_Rocivia_Magic_cool_down:0 "法术冷却中"
 SRA_RE_Rocivia_Magic_1:0 "真实之视"
 SRA_RE_Rocivia_Magic_1_desc:0 "这个法术使得受作用者在进行某些行为时能预知到操作所带来的结果，因此你舰队的命中率将会极大的提升，在大多数情况下实现百发百中。"
 SRA_RE_Rocivia_Magic_2:0 "灵感迸发"
 SRA_RE_Rocivia_Magic_2_desc:0 "这个法术使得受作用者能够更好的总结自己的所知并进行创造性活动，这使得我们所有科学研究者对新科技的研发速度提升。"
 SRA_RE_Rocivia_Magic_3:0 "疾风之速"
 SRA_RE_Rocivia_Magic_3_desc:0 "这个法术使得受作用者能够在移动上获得神奇的增幅，这使我们的舰队的机动性提升。"
 SRA_RE_Rocivia_Magic_4:0 "剑火之祝"
 SRA_RE_Rocivia_Magic_4_desc:0 "这个法术使得受作用者能够在战斗中制造更大的伤害，并变得更加强大。"
 SRA_RE_Rocivia_Magic_5:0 "山川之序"
 SRA_RE_Rocivia_Magic_5_desc:0 "这个法术使得既有的秩序更加稳固，社会的凝聚力更强。"



 SRA_RE_Rocivia.401.desc:0 "嗯，你瞧，要是有啥选举或者事件杀之类的事情使我不幸从领袖位上消失了，你可以在这里让我回去。\n或者就让我在家里放假？也可以。"
 SRA_RE_Rocivia.401.a:0 "赶紧如闪电般归来（）"
 SRA_RE_Rocivia.401.b:0 "好吧，就让你先多摸几天"


 SRA_RE_Rocivia.3:0 "科学院"
 SRA_RE_Rocivia.3.desc:0 "欢迎来到科学院，这里是帝国科研探索的最前沿，我们最优秀的头脑云集此地，只为揭开这个世界神秘的面纱。\n你可以在这里发布§Y科研项目§!。\n§Y科研项目§!是一系列复杂而耗资巨大的研究，要想在那些领域取得进步，你必须在正确的方向上投入大量资源与努力，而且有时即便方向正确，失败也在所难免。\n无论如何，在项目开始前，请确保国库里有充足的资源储备。"
 SRA_RE_Rocivia.3.a:0 "星辉水晶运用研究"

 #星辉水晶Stellarcrystal
 SRA_RE_Rocivia.3001:0 "星辉水晶运用研究"
 SRA_RE_Rocivia.3001.desc:0 "星辉水晶，一种像是从科幻小说里走出来的可编辑物质。这些构成方式与常规物质截然不同的晶体能根据一种特殊的“指令”改变自身的结构与性质。\n然而，直到今日，我们对这种神奇物质的了解还仅限于星规的只言片语。仅有的几次应用，也都得依赖星规对这些水晶的连接能力。\n是时候了，我们必须攻克这一难关，将星辉水晶的奥秘亲手掌握。"
 SRA_RE_Rocivia.3001.a:0 "开始研究"

 SRA_RE_Rocivia.3002:0 "第一阶段：场地准备"
 SRA_RE_Rocivia.3002.desc:0 "对星辉水晶的研究可不是一件在实验室里就能搞定的工作，我们必须建设足够庞大，设施齐全的实验场地。"
 SRA_RE_Rocivia.3002.a:0 "指派物理学团队"
 SRA_RE_Rocivia.3002.b:0 "指派社会学团队"
 SRA_RE_Rocivia.3002.c:0 "指派工程学团队"

 SRA_RE_Rocivia_SP1:0 "第一阶段：场地准备"
 SRA_RE_Rocivia_SP1_DESC:0 "对星辉水晶的研究可不是一件在实验室里就能搞定的工作，我们必须建设足够庞大，设施齐全的实验场地。"
 SRA_RE_Rocivia_SP2:0 "第一阶段：场地准备"
 SRA_RE_Rocivia_SP2_DESC:0 "对星辉水晶的研究可不是一件在实验室里就能搞定的工作，我们必须建设足够庞大，设施齐全的实验场地。"
 SRA_RE_Rocivia_SP3:0 "第一阶段：场地准备"
 SRA_RE_Rocivia_SP3_DESC:0 "对星辉水晶的研究可不是一件在实验室里就能搞定的工作，我们必须建设足够庞大，设施齐全的实验场地。"


 SRA_RE_Rocivia.3003:0 "物理学成功"
 SRA_RE_Rocivia.3003.desc:0 "完备的研究场地已经准备完毕，各式各样的设备都已经备齐，我们可以开始下一步研究了。"
 SRA_RE_Rocivia.3003.a:0 "非常好"
 SRA_RE_Rocivia.3004:0 "物理学失败"
 SRA_RE_Rocivia.3004.desc:0 "我们的物理学团队的判断出现了失误，那些加速器和反应器显然不适合用来开展此类研究，我们得重新筹备了。"
 SRA_RE_Rocivia.3004.a:0 "也许应该再试试"
 SRA_RE_Rocivia.3005:0 "社会学成功"
 SRA_RE_Rocivia.3005.desc:0 "很难想象，我们的社会学团队真的完成了任务。这座“借来”的实验场地相当合适，我们可以开始下一步研究了。"
 SRA_RE_Rocivia.3005.a:0 "神奇……"
 SRA_RE_Rocivia.3006:0 "社会学失败"
 SRA_RE_Rocivia.3006.desc:0 "果不其然，我们不应该指望这些专家能完成其能力范围之外的任务。我们怀疑这个任务跟带薪假期没什么区别，还是重新选择方向比较好。"
 SRA_RE_Rocivia.3006.a:0 "确实如此"
 SRA_RE_Rocivia.3007:0 "工程学成功"
 SRA_RE_Rocivia.3007.desc:0 "一个设施完备，防护严密的实验场地已经准备完毕，有了这样一个安全而优秀的实验环境，我们可以开始下一步研究了。"
 SRA_RE_Rocivia.3007.a:0 "很好"
 SRA_RE_Rocivia.3008:0 "工程学失败"
 SRA_RE_Rocivia.3008.desc:0 "我们的工程学团队可能没有完全理解任务的需求，现在这个场地连反物质武器实验都可以承受，却没有为我们的研究项目准备多少。我们得重新筹备了。"
 SRA_RE_Rocivia.3008.a:0 "也许该再想想"

 SRA_RE_Rocivia.3009:0 "第二阶段：性质研究"
 SRA_RE_Rocivia.3009.desc:0 "场地已经准备完毕，是时候对星辉水晶的各项性质展开完整的研究了。"
 SRA_RE_Rocivia.3009.a:0 "指派物理学团队"
 SRA_RE_Rocivia.3009.b:0 "指派社会学团队"
 SRA_RE_Rocivia.3009.c:0 "指派工程学团队"

 SRA_RE_Rocivia_SP4:0 "第二阶段：性质研究"
 SRA_RE_Rocivia_SP4_DESC:0 "场地已经准备完毕，是时候对星辉水晶的各项性质展开完整的研究了。"
 SRA_RE_Rocivia_SP5:0 "第二阶段：性质研究"
 SRA_RE_Rocivia_SP5_DESC:0 "场地已经准备完毕，是时候对星辉水晶的各项性质展开完整的研究了。"
 SRA_RE_Rocivia_SP6:0 "第二阶段：性质研究"
 SRA_RE_Rocivia_SP6_DESC:0 "场地已经准备完毕，是时候对星辉水晶的各项性质展开完整的研究了。"

 SRA_RE_Rocivia.3010:0 "物理学成功"
 SRA_RE_Rocivia.3010.desc:0 "一系列复杂的性质测试和分析已经完成，相关数据整理完毕。报告陈述了这一物质与常规物质完全不同的本质：构成星辉水晶不是任何目前已经发现或有理论预测的微观粒子，它是某种相较常规物质而言似是而非的东西。"
 SRA_RE_Rocivia.3010.a:0 "有趣"
 SRA_RE_Rocivia.3011:0 "物理学失败"
 SRA_RE_Rocivia.3011.desc:0 "这简直就是一场灾难，没有任何一种理论能解释这种诡异的物质，它不是波、不是粒子、不是弦或者膜或者别的什么东西。它是一只点了逝者军势的猫，一个在玩自动门的恶魔，一个围绕地球旋转的银河系，一种不负责任的创造者编出来用来解释不科学的科技的玩意。\n我想我该喝点zun啤好好睡一觉。"
 SRA_RE_Rocivia.3011.a:0 "魔法群星？"
 SRA_RE_Rocivia.3012:0 "社会学成功"
 SRA_RE_Rocivia.3012.desc:0 "在干掉了两箱烤串和一车啤酒之后，一位又大又绿的社会学专家从两个正在摔跤的模糊身影之中窥探到了星辉水晶的奥秘。\n这玩意似乎会回应灵能或者原力之类的玄学力量，然后我们需要的资料就像有人查了百科一样被寻思出来了。"
 SRA_RE_Rocivia.3012.a:0 "哦，梅林的胡子啊"
 SRA_RE_Rocivia.3013:0 "社会学失败"
 SRA_RE_Rocivia.3013.desc:0 "香肠、啤酒、奶酪以及破洞的旧长袍都没有起到什么作用，完全不适合这类工作的社会学专家们只得到了一个结论：\n一个假巫师是不能靠着一根绑着水晶的木棍把人变成青蛙的。"
 SRA_RE_Rocivia.3013.a:0 "看来魔法是不存在的……我的回溯卷轴放哪了？"
 SRA_RE_Rocivia.3014:0 "工程学成功"
 SRA_RE_Rocivia.3014.desc:0 "实验圆满结束，相关资料已汇总。各项测试表明，当星辉水晶的微观结构发生细微改变时，其表现出的性质就会发生巨大的变化。但同时，它的微观结构又表现出一种特殊的稳定状态，无论是冲击，高温还是强射线，都不能改变它的性质。"
 SRA_RE_Rocivia.3014.a:0 "真是神奇……"
 SRA_RE_Rocivia.3015:0 "工程学失败"
 SRA_RE_Rocivia.3015.desc:0 "大失败。\n我们完全没有搞懂这玩意到底是怎么回事。\n这些星辉水晶……有的坚不可摧，有的一碰就碎；有的密度像星核，有的在空气中就能飘起来；有的会被电场推来推去，有的对引力都不理不睬……\n果然，科学的力量是有极限的——"
 SRA_RE_Rocivia.3015.a:0 "停停停……"

 SRA_RE_Rocivia.3016:0 "第三阶段：应用探索"
 SRA_RE_Rocivia.3016.desc:0 "星辉水晶的各项性质已经归档，根据这些资料，我们可以尝试着运用星辉水晶。\n我们已经知道，星辉水晶的性质会因为某种原因发生改变，而星规则向我们揭示了其性质的多样性与复杂性——从能量容器到计算机组，从力场操纵到空间扭曲，星辉水晶中蕴含着无数可能。"
 SRA_RE_Rocivia.3016.a:0 "指派物理学团队"
 SRA_RE_Rocivia.3016.b:0 "指派社会学团队"
 SRA_RE_Rocivia.3016.c:0 "指派工程学团队"

