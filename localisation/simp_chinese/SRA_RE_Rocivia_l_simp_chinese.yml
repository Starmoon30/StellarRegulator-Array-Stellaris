 SRA_RE_Rocivia_SP_1_desc:0 "§B星辉水晶运用研究§!\n\n星辉水晶，一种像是从科幻小说里走出来的可编辑物质。这些构成方式与常规物质截然不同的晶体能根据一种特殊的“指令”改变自身的结构与性质。\n然而，直到今日，我们对这种神奇物质的了解还仅限于星规的只言片语。仅有的几次应用，也都得依赖星规对这些水晶的连接能力。\n是时候了，我们必须攻克这一难关，将星辉水晶的奥秘亲手掌握。"
 SRA_RE_research_situation_monthly_change_tooltip:0 "该§Y局势§!的进展依赖于我国的科研点数产出、有关科技的研究，并因为所选的方案而不稳定地推进。"
