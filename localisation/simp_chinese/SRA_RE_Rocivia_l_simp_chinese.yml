 SRA_RE_Rocivia.3017:0 "物理学成功"
 SRA_RE_Rocivia.3017.desc:0 "无数的失败铸就成功的基石，终于，我们掌握了未来。\n星辉水晶，它是一种“可编程”的材料。原生的星辉水晶会接受一种特殊的能量波动，并遵循这种波动改变自身。\n这一变化包含具有超乎想象的复杂机制，允许我们改变它的几乎所有内容：从修改物理性质，到创造拥有独特效果的结构，乃至改变此后响应的输入形式——就像给你的电脑设置密码。\n一个崭新的时代已经到来。"
 SRA_RE_Rocivia.3017.a:0 "庆贺吧"
 SRA_RE_Rocivia.3018:0 "物理学失败"
 SRA_RE_Rocivia.3018.desc:0 "成功不是一蹴而就的，在这样的尖端领域探索，失败再正常不过了。\n星辉水晶的奥秘依然隐藏在面纱之后，但我们坚信，我们正走在正确的道路上。"
 SRA_RE_Rocivia.3018.a:0 "再试一次吧"
 SRA_RE_Rocivia.3019:0 "社会学成功"
 SRA_RE_Rocivia.3019.desc:0 "你相信引力吗？\n我认为宇宙中是存在这样一种人的：银河之星一发出，L门把把是灰风，虚境一眼见圆神，神机永远大成功。\n所谓随机，所谓概率，所谓random_list，所谓mtth，都是不过是掌中玩物罢了。\n正如今日，星辉水晶的秘密被一个梦游人记了下来。"
 SRA_RE_Rocivia.3019.a:0 "§R如果是一次成功，你可以去买彩票了。§!"
 SRA_RE_Rocivia.3020:0 "社会学失败"
 SRA_RE_Rocivia.3020.desc:0 "这是一场无意义的挣扎吗？\n恍惚中，我见到神秘的光屏桎梏着银河，单线程的代码构建着宇宙，不可名状的存在操纵着我们的文明……难道自由意识只是谎言，这个世界不过是一场游戏？\n当我醒来时，一个答案于混沌中浮现。\n社会学家不适合研究这个。"
 SRA_RE_Rocivia.3020.a:0 "好吧……"
 SRA_RE_Rocivia.3021:0 "工程学成功"
 SRA_RE_Rocivia.3021.desc:0 "一次又一次的尝试终会带来胜利的曙光，我们正在书写传奇。\n当一枚星辉水晶真的如我们所希望的那样汇聚起光束时，语言是不可能描述我们的喜悦的。\n一直以来的努力，全部都没有白费。\n我们的指令终于能被星辉水晶所接收，如同计算机开始运行初学者简陋的代码。\n它展现出的能力如同一台精妙的机械，其中无穷的潜力等待着我们去发掘。"
 SRA_RE_Rocivia.3021.a:0 "很好"
 SRA_RE_Rocivia.3022:0 "工程学失败"
 SRA_RE_Rocivia.3022.desc:0 "星辉水晶的内部机制依然隐藏在迷雾之中，我们所做的努力还远远不够。\n先前的大部分实验都走了歪路，也许我们应该换一种思路？"
 SRA_RE_Rocivia.3022.a:0 "继续努力"
 SRA_RE_Rocivia.3023:0 "总结"
 SRA_RE_Rocivia.3023.desc:0 "星辉水晶的初步研究已经圆满落幕，基础的理论框架已经打下，所需要的便是加以运用了。\n我们的科学家敏锐地注意到其在军事技术上的强大潜力，也许第一批星辉水晶军备的设计图很快就会出现了。"
 SRA_RE_Rocivia.3023.a:0 "一场辉煌的胜利"



