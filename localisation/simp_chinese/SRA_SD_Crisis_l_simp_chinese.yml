 # event chins
 SRA_SD_Crisis_2_chain_title:0 "无序片影-灾疫战争"
 SRA_SD_Crisis_2_chain_desc:0 "历史，无数的历史，被歼灭轰鸣撕碎的无数文明，被深渊扩张抹去的无数时代，被无数个萨塔瑞兹的过去，重演无数次。\n\n正如此刻，两支被从历史碎片中再铸的力量现身于此，将往日的战争带到这片星海。\n"