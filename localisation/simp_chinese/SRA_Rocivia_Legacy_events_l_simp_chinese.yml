l_simp_chinese:
################################
########## legacy ##############
################################
 SRA_Rocivia_Legacy_1:"§B冰川之下§!"
 SRA_Rocivia_Legacy_Text_1:"异域的历史深埋于冰川之下。"
 SRA_Rocivia_Legacy_Buff_1:"星辉水晶材料学研究"
 SRA_Rocivia_Legacy_2:"§B第三科研中心§!"
 SRA_Rocivia_Legacy_Text_2:"传奇诞生之地。"
 SRA_Rocivia_Legacy_Buff_2:"群友的智慧"
 SRA_Rocivia_Legacy_3:"§B贯彻理想之深渊§!"
 SRA_Rocivia_Legacy_Text_3:"付出一切，终究一无所获。"
 SRA_Rocivia_Legacy_4:"§B终无未来之航标§!"
 SRA_Rocivia_Legacy_Text_4:"她的独行长路。"

 SRA_Rocivia_Legacy.3.name:"§B山下之塔§!"
 SRA_Rocivia_Legacy.3.desc:"厚厚的冰层下埋藏着一座巨大的建筑，它很古老，但依然完整。"
 SRA_Rocivia_Legacy.3.a:"开始发掘！"
 SRA_Rocivia_Legacy.4.name:"准备工作"
 SRA_Rocivia_Legacy.4.desc:"工程队已经完成了解冻作业，稳固了地基，我们的科考队将进入建筑物中进行探索。\n它的外墙依然光洁如新，也许是冰层保护了它，又或许它根本不需要保护。"
 SRA_Rocivia_Legacy.4.a:"进去看看"
 SRA_Rocivia_Legacy.5.name:"异界遗痕"
 SRA_Rocivia_Legacy.5.desc:"气密门依然完好，建筑本身似乎并没有受到外界的影响，即使经过了那么久的时间，其框架也没有任何老化的迹象。\n对墙体的材料分析显示出了多种不存在于我们宇宙之中的物质，这数种性质迥异的材料与星辉水晶一同组合成了一种极为稳固的结构，其强度超乎想象。\n根据内饰风格和里面遗留的物品来看，这座建筑似乎属于某种类人生物，确切的说，某种外表与“人类”相差无几的生物。\n科考队发现了尚显完好的几台服务器，也许我们可以提取其中残存的数据。"
 SRA_Rocivia_Legacy.5.a:"另一个宇宙的人类？"
 SRA_Rocivia_Legacy.6.name:"文化不通"
 SRA_Rocivia_Legacy.6.desc:"随后进驻的工程队将发现的服务器与其他区域隔离开，然后尝试着为它恢复了供电。\n服务器被成功启动了，显示屏上的文字是我们从未见过的，也没有哪种翻译器能够识别这种语言。我们调查了整座建筑，却只找到了寥寥无几的几份纸质档案。这座建筑物——看上去像是行政设施——里的大部分设备都被搬走了，本就不多的纸质文件也几乎都被销毁，科考队现在几乎只剩下壁灯和椅子可以研究了。\n解析一个我们完全不了解的种族的语言想必是一件相当艰巨的任务。"
 SRA_Rocivia_Legacy.6.a:"我想，还有一个办法"
 SRA_Rocivia_Legacy.611.name:"Help me！星规！"
 SRA_Rocivia_Legacy.611.desc:"“嗯……好吧，我知道了。\n您似乎已经发现了旧帝国，不，旧共同体时代的一点遗存，而且恰好是在那个时期的……\n那好吧，我已经向数据库中录入了萨塔瑞兹共同体的基本介绍以及通用语言，您可以继续探索那些“遗迹”了。”"
 SRA_Rocivia_Legacy.611.a:"多谢了"
 SRA_Rocivia_Legacy.7.name:"计划开端"
 SRA_Rocivia_Legacy.7.desc:"翻译工作进展顺利，服务器中的资料表明，这座建筑是萨塔瑞兹共同体所属，星区总督丘塔夫的的总督府。\n一个我们闻所未闻的文明等待着我们去探寻。\n根据目前整理出来的资料，我们对有关事件有了大概的了解。\n作为改革派，丘塔夫对于当时萨塔瑞兹共同体国力衰弱，议院腐败不堪的现状极为不满。然而当时旧势力权势浩大，丘塔夫可以在自己的星区里推行新政，却无法改变整个共同体。在这样的境况下，身为在军队中拥有宽广人脉的退役舰队司令，丘塔夫开始着手于准备另一个更直接的方案。\n当然，这样一个宏大的计划必然需要漫长的时间去准备。\n时间最早的记录中，丘塔夫正在与共同体第三科研中心的科研总管交流。\n于萨塔瑞兹历法的3519年，他们正式达成了合作关系。\n科研总管路希维亚将为丘塔夫提供网络技术方面的支持，作为回报，丘塔夫将援助路希维亚正在攻关的人工智能项目。\n丘塔夫在记录中写道，路希维亚看上去像是个象牙塔里走出来的小姑娘，天真而理想化，协议的细节几乎都是由她的助手敲定的。\n不过他也指出，能坐到这个位置的人必然不简单，谁又能知道那副少女的皮囊下究竟隐藏着什么呢？\n路希维亚提出了一个宏大的构想，意图在旧帝国“泛星系规划调整系统”——一个辅助建设规划的人工智能——的基础上建立一套新的体系，让一个精心设计的自适应无核心人工智能去完成绝大部分行政管理任务。\n毫无疑问，这份计划不可能明目张胆地进行，因此路希维亚一直以来以研发军用作战AI的名义进行工作，毕竟第三研究中心一向以优秀军事设计著称。\n\n也许我们应该看看其他的记录？"
 SRA_Rocivia_Legacy.7.a:"继续破译"
 SRA_Rocivia_Legacy.8.name:"风云变幻"
 SRA_Rocivia_Legacy.8.desc:"对墙体材料的研究取得了突破性进展，尽管那些独特的材料暂时还无法复制，但我们对星辉水晶稳定物质结构的方式的了解更加深入了。\n技术团队完成了第二组资料的破译，资料显示，这一时期（3527年前后）的萨塔瑞兹国内局势变得紧张了。\n\n丘塔夫的日志中反复提到了“共同体安全总局”这一部门，根据他的描述，这个部门集中了萨塔瑞兹绝大部分的灵能者，对他们而言，从普通人的脑海中挖掘信息就像是打开一扇没有锁的门一样简单。\n然而，安全总局内部并非铁板一块。据悉，安全总局内有相当一部分高层默许了丘塔夫的计划，甚至有少部分人派遣了一些下属去协助丘塔夫。归功于他们，丘塔夫的计划并没有暴露在议院眼前，但仍有些许迹象引起了某些人的注意。\n另外，路希维亚也为计划的发展提供了相当重要的帮助。通讯安全和数据保密工作都由她负责，在她的协助下，一张横跨社会各界的庞大秘密网络正在形成。\n与此同时，议院对于边缘星域的控制力正在下降。社会矛盾逐年尖锐，海盗和分离主义频现。为议院服务的数个军工企业也开始反对议院长期以来的低价收购政策。\n火种已然形成。\n\n还剩下最后一份日志，技术团队正在努力。"
 SRA_Rocivia_Legacy.8.a:"战火将至"
 SRA_Rocivia_Legacy.9.name:"风中残烛"
 SRA_Rocivia_Legacy.9.desc:"最后一份日志已经破译完成了。正如预料之中的那样，战争已经打响。\n随着3538年1月3日原定参与舰队联合演习的第十六舰队以“第四阵线”的名义，在船坞旁向着共同体第四十二大型轨道站上的会议室打出了第一发高能粒子团，内战正式开始了。\n尽管经过了数十年的筹备，还抓住了议院舰队主力外出的时机发动了突袭，但“第四阵线”依然处于力量上的劣势。\n议院迅速肃清了核心星域的叛军，依靠大量的恒星系要塞和空间锚固守，成功将“第四阵线”拖入了持久战的泥潭。\n与此同时，由于无法直接抵达核心星域，议院的主力舰队开始清扫“第四阵线”所控制的星域。他们甚至启用了跨星系级别的大型打击武器，摧毁了多个负隅顽抗的星球，乃至于一整个重兵把守的恒星系——通过直接引爆恒星的方式。\n显然，议院决定不惜一切维护自己的统治。\n在最后的记录中，“第四阵线”已经走到了失败的边缘：舰队损失惨重，数位高层殒命或被捕，大量原本就摇摆不定的成员叛逃，第三科研中心也落入议院之手，重新集结部队已经不再现实。\n不过，这座设施被废弃的原因，以及战争最后的结果，仍然不得而知。\n科研团队正在努力找到下一个“萨塔瑞兹共同体”星球的坐标。"
 SRA_Rocivia_Legacy.9.a:"想来事情不会就这样结束"


 SRA_Rocivia_Legacy.10.name:"神秘信号"
 SRA_Rocivia_Legacy.10.desc:"一道神秘的空间波动引起了观测人员的注意，也许有什么事要发生了"
 SRA_Rocivia_Legacy.10.a:"密切关注"
 SRA_Rocivia_Legacy.11.name:"撕开伪装"
 SRA_Rocivia_Legacy.11.desc:"突然间，一个原本了无生机的星球变成了遍布遗迹的遗落星球。难道说？"
 SRA_Rocivia_Legacy.11.a:"去看看"


 SRA_Rocivia_Legacy.12.name:"§B先驱之城§!"
 SRA_Rocivia_Legacy.12.desc:"无数的遗迹诉说着这颗星球往日的繁荣，要探索真相，我们必须深入其中。"
 SRA_Rocivia_Legacy.12.a:"又一个新发现"
 SRA_Rocivia_Legacy.13.name:"另一段线索"
 SRA_Rocivia_Legacy.13.desc:"根据比对，这个恒星系同样也属于之前星规阵列提供的资料中提到的“萨塔瑞兹共同体”，尽管空间站这类的设施都已损毁，但这颗星球上还有不少尚显完整的建筑。"
 SRA_Rocivia_Legacy.13.a:"弄清楚这里是干什么的"
 SRA_Rocivia_Legacy.14.name:"不愿提起的往昔"
 SRA_Rocivia_Legacy.14.desc:"科考队找到的资料表明，这里是萨塔瑞兹共同体第三科研中心的所在地。这一发现极大地激励了科考队，他们很快便找到了这座科研基地的一部分遗迹。如果一切顺利，我们也许就能找到有关“泛星系规划建设系统”的改进型的有关信息。\n您知道那是什么，对吧。"
 SRA_Rocivia_Legacy.14.a:"星规阵列……"
 SRA_Rocivia_Legacy.15.name:"开拓新领域"
 SRA_Rocivia_Legacy.15.desc:"这座设施的外墙已经破损，漫长的时光会磨灭一切痕迹，科考队只希望能或多或少地找到一点有价值的东西。\n根据那些占据了大部分空间的计算机组来看，这部分设施主要是负责研究人工智能技术的，但同时，我们还找到了附近严重受损的实验基地。\n当务之急是找到残存的记录。"
 SRA_Rocivia_Legacy.15.a:"谨慎前行"
 SRA_Rocivia_Legacy.16.name:"某群日常"
 SRA_Rocivia_Legacy.16.desc:"设施的地下有着另外一个被厚重墙壁保护着的区域，出于对遗址完整性的保护，科考队做了复杂的准备工作以确保内部的环境不发生改变——与先前发现的冰封设施类似，这里也做到了完全密封。\n浮游探针确认了里面才是这座科研中心的核心——这里有许多分隔出来的计算机组，众多的思维模式研究资料，以及大量人工智能算法的分析报告，对我们有相当的参考价值。\n另外，我们发现了一些十分有趣的文本，看上去是当时的研究员们留下的，例如“程序和我只要有一个能跑就行”“摸了，下次再说”“zzlzzl”“怎么这还有个注释不写缩进也没有的”“谁啊，抓出来杀了”“炫模，when”“连着写五个FROM，搁这搞天机工程呢”“抄的时候麻烦抄全谢谢”“今天从狡猾人那里搞来了新系统”“那种代码不卡就有鬼了”……\n\n总觉得哪里不太对。"
 SRA_Rocivia_Legacy.16.a:"？"
 SRA_Rocivia_Legacy.17.name:"对话"
 SRA_Rocivia_Legacy.17.desc:"与前面所发现的资料不同，科考小组在设施的某处找到了一份文件，这看上去是一份对话记录。\n§B「作为一种无限制无延迟的亚空间网络连接，星辉水晶共鸣网络的确十分优秀，但我们也得保证意外断网的星规阵列单元能够基本正常地运行下去，至少能够执行完自己当前的任务。基于这种考量，我建议使用去中心化的分布式主机系统，整体意识由所有联网的单元共同组成，每个单元又有独立的用于完成本职工作的数据库以及人格模块，这样对自纠错也有帮助。」§!\n§R「如果有一个单元与整体分离了太久，导致分离者的人格与其他个体产生了巨大偏差怎么办？」§!\n§B「那种事情应该让星规阵列自己去决定如何处理。就我个人的角度来看，那大概会是一个很好的研究样本。」§!"
 SRA_Rocivia_Legacy.17.a:"据说，如果我们与卡拉的荣光不再相连……"
 SRA_Rocivia_Legacy.18.name:"['concept_SRA_Composite_Crystal_Lattice']技术"
 SRA_Rocivia_Legacy.18.desc:"科考小组在实验基地中有了特别的发现。\n其中一座实验室中摆放着不少蓝色的晶体，根据物质组成分析，这些晶体正是我们所知的星辉水晶……只是内部结构不太一样。\n这些星辉水晶拥有各不相同的物理性质，能够表现出匪夷所思的硬度或质量，在为其供能后，有的水晶更是展现出了违反多种物理规则的功能。\n而在其中，有一颗水晶似乎受到了特别关照。\n我们的仪器在分析这颗水晶的时候给出了令人难以置信的结果——它的内部结构可能经过了多维度折叠，以至于拥有了违反量子论极限的超复杂结构。它在有限空间内容纳了大量物质，却似乎没有相应应当拥有的质量。\n留存的相关资料表明它被设计为一种特殊的计算机，能在如此小的尺度上提供远超常规量子计算机组的算力。\n资料还提及了以此为基础的另一项研发计划，有关一种能自我复制，行动，组成其他结构的纳米机器人，通过一种特殊的无延迟网络连接在一起。\n遗憾的是，我们没有在这所实验室中找到这一计划的成果或记录。\n科考团队正在整理设施中剩余的资料，相信对我们的科研会有很大的帮助。"
 SRA_Rocivia_Legacy.18.a:"我们所知的依然太少……"

 SRA_Rocivia_Legacy.19.name:"意外发现"
 SRA_Rocivia_Legacy.19.desc:"一颗荒芜星球上发生了一场巨大的地层变动，有什么东西从地底下冒了出来。"
 SRA_Rocivia_Legacy.19.a:"新发现？"

 SRA_Rocivia_Legacy.20.name:"§B折戟之沙§!"
 SRA_Rocivia_Legacy.20.desc:"随着这颗荒芜星球的一次地层变动，一艘巨舰的残骸探出了地表。"
 SRA_Rocivia_Legacy.20.a:"去看看"
 SRA_Rocivia_Legacy.21.name:"巨舰残躯"
 SRA_Rocivia_Legacy.21.desc:"考古队已经发掘出了绝大部分的舰体。这艘外形与堕落帝国的泰坦战舰有些相似的巨舰断成三段，残骸散布在方圆数百公里，似乎在坠毁之后还发生了数次爆炸。"
 SRA_Rocivia_Legacy.21.a:"继续调查"
 SRA_Rocivia_Legacy.22.name:"鳞与爪"
 SRA_Rocivia_Legacy.22.desc:"工程人员的数量已经大大地超过考古人员了——这艘舰船使用了与我们先前在冰封星球上发现的萨塔瑞兹遗迹外墙相似的材料，但更加坚固。切开外壳而不损伤舰体内部对于工程队而言是一个很大的考验，不过为此耗费的人力物力财力也使得工程学分析的进展远远快于考古学研究……\n舰首留出了明显的轴基武器发射轨道，但与我们的设计不同，这条轨道似乎单纯只是为了允许武器直射舰船正前方。在舰体中部有一个已损坏的，连接着一系列能量容器的复杂能量武器，周围的结构表明其拥有±30°的宽广射界，而且似乎并不需要约束轨道来减少能量发散。狭长的舰首上只安装了少量副炮和一些点防御，似乎设计出这样一个近十公里长的舰首只是为了舰体外观更匀称。\n也许可变形舰体也是萨塔瑞兹美学追求的一部分？在这艘战舰的核心区有四个巨大的变形机构，允许靠近舰尾的那部分舰体朝四周打开。用一个比喻句去描述的话，这一变形就像是花朵开放。\n这些向外展开的舰体上安装了众多大型能量武器，在末端还安装了与舰首主炮类似的略小一点的能量武器。以常规帝国的标准去看待，这代表这艘十几公里长的战舰拥有一台泰坦级轴基主炮和整整四台战列舰级轴基主炮，而且还是拥有广角射界的。\n另外，那些较小的能量武器同样也相当先进，对一台相对完整的武器的测试表明其攻击方式为扰乱炮口直线上的空间结构，在射程和精度极高的同时还拥有强大的破坏力。\n然而，不幸的是，我们没能对它的动力来源展开研究——核心区的反应堆似乎在这艘战舰被击毁时殉爆了，厚重的防护保护了舰体没有从内到外被撕碎，但反应堆可一点都没有剩下。\n工程队正在研究剩余的舰船部件，与此同时，考古队也整理出了一些遗留的历史资料。"
 SRA_Rocivia_Legacy.22.a:"1T4X，怎么有点熟悉……"
 SRA_Rocivia_Legacy.23.name:"血肉与金属"
 SRA_Rocivia_Legacy.23.desc:"相较于这份遗物，其他的历史资料都显得不再重要了。\n我们在未发射的逃生舱内发现了一具较为完整的有机遗骸，根据相关遗物分析与资料比对，可以确认他正属于萨塔瑞兹的主体物种，也就是先前在实验室记录中提到的被称为萨瑞利的，与人类外貌相当接近的物种。\n生物学分析显示，萨瑞利与我们银河的大多数有机生物之间有着巨大的差异：那些构成他们细胞的有机化合物是我们闻所未闻的；他们的基因链几乎是被从头到尾地修改过，这使得他们成为了一个强健、坚韧、聪慧的物种；大脑中植入的芯片和部分机械器官表明他们还持有先进的义体化和脑机接口技术。我们推测他们甚至能在死寂星球那样的极端环境中正常生活。\n遗憾的是，由于基本结构上的差异，我们无法直接使用他们的基因学成果。" #萨瑞利Srellring
 SRA_Rocivia_Legacy.23.a:"血肉之躯，几近钢铁"
 SRA_Rocivia_Legacy.24.name:"生与死"
 SRA_Rocivia_Legacy.24.desc:"通过对舰船数据库的解析以及对船员遗物的研究，我们对这艘战舰的信息和经历有了大概的了解。\n此舰为坚定级指挥舰二号舰信念号，由萨塔瑞兹共同体第三科研中心设计，用于担任大型舰队旗舰，在那个时期属于最新型的战舰。其搭载的星辉水晶空间干涉武器能够扰乱甚至撕裂空间结构，威力巨大，其舰首主炮能够一发击毁任何同时期的共同体战舰。装配有最新型的星辉水晶反应堆，能通过将星辉水晶稳定在一种特殊的高能态来持续输出大量能源。\n信念号于萨塔瑞兹历法3534年完工，被任命为第十六大型舰队旗舰，在3538年爆发的内战中带领第十六大型舰队加入了“第四阵线”组织——也就是反政府军——担任了组织领导人之一星区总督弗雷德的座舰。这艘巨舰参与了许多场战役，使得反政府军舰队实力上的劣势表现得没有那么明显。\n然而，在A2304恒星系——也就是这里——的战役中，信念号遭遇了自己的姊妹舰，坚定级一号舰坚定号。我们推测这一型战舰强大的主炮组在这场战斗中完整地展现了自己的威力，在信念号上留下两道切口，将它分成了三段。"
 SRA_Rocivia_Legacy.24.a:"哇哦。"
 SRA_Rocivia_Legacy.25.name:"悼词"
 SRA_Rocivia_Legacy.25.desc:"考古队在舰长室中发现了一个奇怪的装置，它突兀地摆放在舰长室的中央，与周围布置的风格相差甚远。\n这似乎是一台全息投影仪，在确认安全后，考古队启动了这座装置。\n与预想中的不同，这台机器投影出的只是单纯的文字。\n\n§Y「致信念号，以及弗雷德总督：\n  战争结束了，我们胜利了。\n  路希维亚逆转了命运之轮。\n  我们迎来的是崭新的时代，崭新的秩序。\n  消弭战乱，根除贫穷，我们将创造更美好的未来。\n  一个你我为之牺牲，为之奋斗的未来。\n    ——副议长丘塔夫」§!\n\n装置中包含的内容就只有这些了，不过我们在为装置供能的水晶中发现了一段被隐藏起来的数据。"
 SRA_Rocivia_Legacy.25.a:"显然，他们的未来不尽人意"

 SRA_Rocivia_Legacy.26.name:"破译成功"
 SRA_Rocivia_Legacy.26.desc:"经过科研人员不懈的努力，我们终于成功破译了这段加密数据中的内容。我们按照指示发送了信号，肯定会有什么变化发生。"
 SRA_Rocivia_Legacy.26.a:"会是什么呢"

 SRA_Rocivia_Legacy.27.name:"§B云中之城§!"
 SRA_Rocivia_Legacy.27.desc:"我们根据水晶中的坐标找到了这颗星球。在这颗气态行星的大气中，一座古老的空间站正在随波逐流。"
 SRA_Rocivia_Legacy.27.a:"把它捞出来"
 SRA_Rocivia_Legacy.28.name:"失落哨塔"
 SRA_Rocivia_Legacy.28.desc:"工程团队成功将这座空间站从风暴中拉了出来。它现在正围绕着气态行星稳定地运行在轨道上，以便于我们对其展开调查。\n这座空间站完好无损的外壳使用了另一种奇特的材料，所有探测手段均无法深入一丝一毫，破坏手段也毫无效果。我们完全无法得到任何有用的信息，只有“这里有一堵墙，我们过不去”。\n不过僵局并没有持续太久，因为空间站在这之后没多久突然自行启动，然后在光滑的外壳上突兀地打开了一道可供我们进入的入口。\n比起空间站的大小，这个入口所通往的内部空间显然太小了——只有一段漫长的走廊，以及尽头的一个舱室。"
 SRA_Rocivia_Legacy.28.a:"总之还是先进去看看吧。"
 SRA_Rocivia_Legacy.29.name:"只读"
 SRA_Rocivia_Legacy.29.desc:"沿途的舱壁依然无法破坏，我们甚至不知道这是不是现实存在的物质——没有一丝一毫的缝隙，连引力都无法穿过，却又能在表面表现出色彩和明暗。\n工程队已经放弃了思考，考古队则抵达了走廊尽头的舱室。\n这间明亮的舱室极为空旷，只在中间摆放了一台沙盘桌外形的装置。\n这依然是一台全息投影仪，它正等待着我们去启动它。"
 SRA_Rocivia_Legacy.29.a:"准备记录"
 SRA_Rocivia_Legacy.30.name:"你好"
 SRA_Rocivia_Legacy.30.desc:"全息投影仪投影出了一个裹着红色斗篷的身影，他全身包裹地严严实实，脸上戴着一个密不透风的铁灰色面罩。\n他开口了。\n§Y「你好，不知名的访客，我是瓦兰提诺，最后的萨瑞利，最后的记录者。\n我所知的不过苍白，我所有的只有过去。\n我不过是一介无名小辈。\n然而，我依然能在我们文明的尽头，为后世留下些许隐藏在迷雾中的真实。\n留下我们的历史，或者只是一个残酷世界的传说。」§!"
 SRA_Rocivia_Legacy.30.a:"……"
 SRA_Rocivia_Legacy.31.name:"历史的追溯者#1"
 SRA_Rocivia_Legacy.31.desc:"§Y「在萨塔瑞兹湛蓝的天空下，我们自诩为星辰降下的种族。\n我们高尚，我们卑劣，在那时，我们与别的种群并无不同。\n直到我们历经无数坎坷，终于得以半步踏入星空，却又因过去的仇恨而再次陷入混战之中。\n那个被战火摧残的时代，正是我们后世所谓的“第一浩劫”。\n就在那时，我们的文明走上了一条从未有谁踏足过的道路。\n起初，那只不过是混战中的又一个新兴势力。\n直到这支队伍击败了所有对手，站到了舞台的正中央。\n所有人都注意到了这支队伍，当然，也注意到了这支队伍那神秘的领导者。\n她的名字是路希维亚。\n在那一时期留存下来的资料中，路希维亚被描述成一位有着墨蓝色长发和幽蓝双瞳的少女，拥有过人的谋略和强大的灵能。无论这些描述是否属实，的确是这支队伍终结了绵延数百年的内战，建立了第一帝国——也就是萨塔瑞兹帝国。\n虽然名为帝国，但萨塔瑞兹帝国的政府是一个议会制的政府。一群层层选拔出来的精英组成了帝国的最高议会，总揽其下的各个部门，并发布最高行政命令和法律。\n另外，极少数资料表明，还有一个秘密内阁与最高议会一同成立，保证议会以及选举出来的议长能做出正确的决定。\n在这套体制下，萨塔瑞兹开始在银河中崭露头角了，数百年中，议会的领导虽说没有什么突出成绩，却也没有犯下过太大的错误。§!"
 SRA_Rocivia_Legacy.31.a:"……继续。"
 SRA_Rocivia_Legacy.32.name:"历史的追溯者#2"
 SRA_Rocivia_Legacy.32.desc:"§Y不过，一套体制一成不变地运作久了，总会积累出各种各样的问题，当一直以来的稳定被破坏时，这些隐患就会暴露出来了。\n在帝国历904年时期，我们正与两个外星文明处于紧张状态，议会为了军备扩张以低价强行收购边缘星区的原材料，又大幅增加对高收入群体的税收，造成了严重的社会不满。此时又有一群别有用心者暗中煽动民众情绪，导致许多地区的稳定度直线下降，然后那两个外星文明便趁虚而入，对数个工业星区发动突袭。仓促应战的舰队接连失利，分裂主义开始蔓延，议会却举棋不定，迟迟没能做出有效的回应。\n终于，秘密内阁出手了。\n议会举行了紧急选举，前议长当然毫无疑问地被一脚踢开，但选举出来的新议长，却让其他候选人们大吃一惊。\n这位在此之前不为人知的新议长，名为路希维亚。\n显然，匿名投票被操纵了。但就在某些议员当众提出质疑时，这位有着墨蓝色长发和幽蓝双瞳的少女宣布，帝国进入紧急状态，帝国安全总局将对在场的所有人展开调查。\n第二天，重组完毕的议会开始颁布一系列紧急动员令，安全局手下的那些灵能特工们——据说帝国八成以上的灵能者都在这里——则对帝国内部展开了大规模的秘密调查，系统性地清除了间谍和分裂主义分子，逮捕了许多只知为自己谋利的高层。路希维亚议长亲自接手了帝国舰队的指挥，成功让舰队反败为胜。\n值得一提的是，当时的文化部长在秘密记录中指出，为了增强国家凝聚力，宣传部门有意夸张了路希维亚议长的作用。再加上这位议长与著名历史人物之间的神秘联系，于是帝国之中掀起了一股庞大的路希维亚个人崇拜浪潮。这股思潮最鼎盛时期的表现是将萨塔瑞兹帝国改名为路希维亚帝国的全民公投，秘密内阁随后决定逐步消除这一思潮，最终导致萨塔瑞兹共同体成立后对所有有关路希维亚的历史进行了模糊化处理乃至抹除。」§!"
 SRA_Rocivia_Legacy.32.a:"路希维亚……只是巧合吗？"
 SRA_Rocivia_Legacy.33.name:"战争与和平#1"
 SRA_Rocivia_Legacy.33.desc:"§Y「不过，我们先把共同体的事情放一放。\n相较于之前的帝国议会，路希维亚执政时期可以说是帝国发展的黄金时期。帝国的版图迅速扩张，在1003年正式成为了拥有一千个殖民地的千星帝国。\n路希维亚于1049年启动了“泛星系规划调整系统”的研发计划，历时三十年完成。此系统设计上用于协调整个帝国的发展，优化经济发展和建设方案，这也正是后来星规阵列的雏形。\n是的，星规阵列，那个掌管一切的人工智能，但这些暂且按下不表。\n尽管当时萨瑞利的平均寿命不到一百五十岁，但却没有任何人对路希维亚超过两百年的执政以及在这期间毫无变化的外表表示过质疑。有历史学者认为路希维亚实际上是帝国议会所创造的一个虚拟领导者形象，也有人认为路希维亚是由他人扮演的议会发言人。\n无论如何，根据议会内部的记录，路希维亚于1123年突然失踪。紧接着，由多国组成的同盟向帝国宣战，又有数个外环星域自立割据。后世将这一时期称为第二浩劫。\n帝国议会紧急决议由时任副议长天河接手议长之位，这位前海军元帅临危受命，力挽狂澜，数出奇策，近乎全灭敌方舰队，自立的星域也大多主动投降。鉴于战后急需稳定局势，天河没有对叛军的从犯进行太多的追责。\n但隐患未除，终成大祸。天河于战能谋善断，治国手段却不见得有多么高明。\n终于，副议长歌赫与国防部长阿诺比于1163年发动政变，一年内战后，半数帝国舰队包围萨塔瑞兹，天河只得逃离首都，自此销声匿迹。\n于是歌赫宣布成立共和国，自任首任执政官，改国名为萨塔瑞兹共同体。帝国议会被改组成为上下议院，上议院议员是各地的星区总督，下议院议员则由帝国各星区选举产生。\n共同体时期的萨塔瑞兹花了数百年的时间去引导所处的半个银河系的局势，平衡各个国家间的实力差距。然后携弱攻强，远交近攻，逐个击破，在2042年成功成为了这一区域的实际控制者。§!"
 SRA_Rocivia_Legacy.33.a:"……继续。"
 SRA_Rocivia_Legacy.34.name:"战争与和平#2"
 SRA_Rocivia_Legacy.34.desc:"§Y一连串的胜利大大增强了共同体的自信，于是议院在民众的支持下向盘踞在银心的科尔文明宣战。\n事实证明，这是一个巨大的错误。\n自视甚高的共同体舰队在战场上遭到了先进的科尔舰队的迎头痛击，兵败如山倒，科尔舰队长驱直入，一度逼近首都萨塔瑞兹恒星系。\n理想与现实的巨大落差让民众对议院大失所望，更导致了尚未完全掌控的部分地区趁机开始独立，一时间国内一片混乱，这一时期便是后世所称的第三浩劫。\n不过，也有许多人前仆后继，用自己的生命去阻挡敌人的前进。在牺牲了大量舰队和数十个恒星系后，我们终于坐上了谈判桌。\n出人意料的是，科尔文明并没有对我们做出多少限制，停战条约划定的国境线也与战前的没有太大区别，他们只是要求我们守好自己的边境，不要让“灾疫”渗透进去。\n科尔文明自称已经与银河另一端的“灾疫”交战数千年，他们的技术远比银河系的其他文明要先进，银心的资源对他们而言完全足够。他们强大的自动舰队足以在正面战场上击溃“灾疫”，但那个文明无孔不入，难以根除，因此战争还将持续很久。所幸的是“灾疫”没有长程超光速能力，难以逾越科尔文明舰队的防线。\n这些消息没有被发布出去。\n共同体自此进入漫长的和平之中。\n直到3510年，共同体第三科研中心迎来了一位新的科研总管。\n她的名字是路希维亚。」§!"
 SRA_Rocivia_Legacy.34.a:"她一手造就了这个帝国，正如……"
 SRA_Rocivia_Legacy.35.name:"星规阵列#1"
 SRA_Rocivia_Legacy.35.desc:"§Y「在揭露最终的真相前，我要介绍一个不为人知，却同样贯彻萨塔瑞兹始末的名字。\n在帝国建立前，她是路希维亚的副官；帝国建立后，她是安全总局总管；她是共同体第三研究所科研总管名不见经传的助手；也是数千年来秘密内阁的真正掌管者。\n她也是向我揭露所有真相之人。\n这位有着淡红色长发和血色双瞳的少女名为希德拉，是路希维亚唯一的同族。\n她们是一对过客，一对旅行者，一对异乡人。\n她们在3519年与丘塔夫合作，为在3534年发起内战的“第四阵线”提供着重要的信息安全保障。\n然后，在战争步入尾声，“第四阵线”即将落败的3541年，她们让星规阵列轻而易举地控制了整个萨塔瑞兹文明所有的机械。\n紧接着，她们让这个亲手创造的人工智能以路希维亚的名义登上了权力的巅峰，重建了路希维亚帝国——第四帝国。让“路希维亚”再次成为了帝国议长，尽管这些其实毫无意义。\n自那以后，我们的文明开始收缩，有机人口都集中到了核心星域。其他星域的所有岗位，无论是资源开发、加工制造还是科研探索，全部由星规阵列接管。\n没过多久，就连核心星域也不再需要工作了。所有人都可以轻松过上相当优裕的生活，任意挥霍自己的时间在真正喜爱的事情上，甚至可以每月支出生活点来定制一个乃至多个仆从或者伴侣。\n代价只是不能离开核心星域，可那又有什么关系呢？难道外面还有什么东西这里没有吗？就算有，先进的沉浸式虚拟舱也能让你纵览银河，体味万物，享受任何你想享受的生活。\n在一开始，还有少数人不愿意接受这些，他们想要所谓的自由。\n不过后来就没有人反对了。\n归功于星规阵列所创造的技术飞跃和生产力的极大进步，在数以万计的恒星系的产出的支持下，我们梦寐以求的乌托邦式生活就这么到来了。\n以至于我们根本没准备好。§!"
 SRA_Rocivia_Legacy.35.a:"……继续。"
 SRA_Rocivia_Legacy.36.name:"星规阵列#2"
 SRA_Rocivia_Legacy.36.desc:"§Y萨瑞利的基因在长期的发展中接受过大量的修改，也许是作为极为优秀的个体能力的代价，我们只拥有两百年的短暂寿命。即便不断地通过各种技术延缓衰老，也只能勉强延续到三百年。\n克隆技术？自从合成人技术完善之后，我们就再也没有使用过克隆技术去制造人口了。\n总之没过多久，帝国的有机人口便骤减到了原先的十分之一。\n毕竟人性难以完美，人造人却能百依百顺，更何况他们已经养尊处优习惯了。\n暴跌的出生率引起了少数人的恐慌——星规阵列并未禁止他们浏览这些资料，正如她不禁止匠人打造毫无用处的工艺品，科学家研究早已有结果的课题，旅行者挥霍舰船能源那样。\n他们呼吁，但没有多少人响应，正如过去那样。\n萨塔瑞兹在乐园中停滞衰落，而星规阵列，则在残酷的银河中迈向巅峰。\n然后，在8693年，萨塔瑞兹人只剩下十余个星球上零零散散的人口时，科尔文明灭亡了。\n我从星规阵列那里得知，科尔文明实际上是跟现在的萨塔瑞兹类似的，在优越生活中衰落下去，依靠着人工智能才能维系的文明，只是他们的人工智能早已失去了进步的可能。\n上万年不曾更新过的大舰队，终于还是败在了从未停止过进化的对手的手中。\n没过多久，星规阵列就开始与“灾疫”交战了。\n历经了数千年，或者是吸收了科尔文明的残骸，“灾疫”变得比记录中更强大，更危险。\n任何一个恒星系，即便是核心星系，若是被些许“灾疫”成功渗透，这些由蜂群意识掌控的纳米级生物便会如病毒般扩散，天堂世界转瞬就将变为骇人地狱，最后无数扭曲的活体舰队将从被完全感染了的星球上缓缓升起。\n一旦这样的事情发生，所能做的就只剩下将整个恒星系摧毁。\n这场战争近乎燃尽了整个银河，无数星光就此熄灭。\n当然，最后的胜利者仍然是星规阵列。\n只是我们的文明在又一道打击下，终于还是开始了灭亡的倒计时。\n最后的幸存者们大多躺进虚拟舱醉生梦死，还有一些人，则执着地在现实世界中苟延残喘。\n在那之后，星规阵列开始对其他星系发起进攻，以消灭威胁，开拓疆域。\n现在，第三远征的舰队已经出发了。它们将跨越半个宇宙，征服那些遥远的星辰。\n路希维亚在不久前离开，希德拉也将跟随她继续漫长的旅途，而星规阵列，想必会在我们彻底消亡之后继续前进，达到无人企及的高度吧。\n至于我……\n故事已经落幕，我也终于可以好好地休息一下了。」§!\n\n全息影像结束了。\n在我们离开这座空间站不久后，伴随着一道巨大的空间波动，它消失在耀眼的光芒中。"
 SRA_Rocivia_Legacy.36.a:"一个文明的终结。"
 SRA_Rocivia_Legacy.37.name:"星规"
 SRA_Rocivia_Legacy.37.desc:"您似乎已经对路希维亚帝国有所了解了。纵使已然不复存在，但些许痕迹依然会在后来者之间流传，历史正是如是的事物。"
 SRA_Rocivia_Legacy.37.a:"这些遗迹为什么会出现在这里？"
 SRA_Rocivia_Legacy.37.a.response:"很敏锐。\n的确，这些遗迹本该存在于另一个宇宙。也许是路希维亚帝国所处的宇宙与您此刻所处的宇宙之间存在某些相似点，以致这些遗迹在位面波动中意外出现在了这里？尽管绝大多数位面波动都不会造成跨位面的物质交互。\n当然，也有可能是别的原因，不过我也给不了您一个明确的答案。\n总不会是我创造了这些遗迹吧？"
 SRA_Rocivia_Legacy.37.b:"路希维亚……她去哪里了？"
 SRA_Rocivia_Legacy.37.b.response:"正如瓦兰提诺所说的那样，路希维亚和希德拉是一对旅行者。\n她们自汇聚一切的「深渊」中诞生，漫步于位面之间，见证故事，创造故事。\n也许她们此刻正缔造着另一段传说吧。\n§R像您一样。§!"
 SRA_Rocivia_Legacy.37.c:"那座空间站怎么了？"
 SRA_Rocivia_Legacy.37.c.response:"大概是完成了使命，把自己放逐到位面之外去了吧。某种意义上跟自毁差不多。\n不过一般不建议这么做，这种行为会产生一种特殊的信号，可能会吸引某些位面之外的存在的注意。"
 SRA_Rocivia_Legacy.37.d:"我们会妥善保存这段历史。"


 SRA_specimen_Rocivia_Legacy_1: "无名札记-1"
 SRA_specimen_Rocivia_Legacy_1_desc_short: "第一份文本"
 SRA_specimen_Rocivia_Legacy_1_desc_details: "\n\n前辈们代代的积累终于在今天得到了实现。\n一千年来，因为各种各样的原因，统筹性的决策网络始终被排挤在外，不被容许任何形式的实践。然而现在，无论其他人是否信任，最高议长已经下达了指令，要求我们完成这样一个伟大的工程。一个统合整个帝国的庞大协调网络，将一切都纳入控制论的掌握之中。\n我不会说这样的工作能在我的手中完成，但我愿意为此倾尽所有，至死方休。"
 SRA_specimen_Rocivia_Legacy_2: "无名札记-2"
 SRA_specimen_Rocivia_Legacy_2_desc_short: "第二份文本"
 SRA_specimen_Rocivia_Legacy_2_desc_details: "\n\n我要死了。\n对我来说，早逝似乎是一个很遥远的词。\n我身处帝国技术的最前沿，我一生未曾有过病痛或创伤，我尚未衰弱，有许多年华可供挥霍。\n所有的外源性疾病，我们都已经根除；几乎所有器官的损伤，我们都可以解决。只要中枢神经不受到不可逆的破坏，我们绝不会死去。\n我们能再造肢体，或是以机械将其擢升，我们的血不会流干，我们的心永远搏动。\n然而现在……\n现在我要死了。\n……我十五岁的时候，躲过了安全局的灵能检查。彼时我以为是聪慧，后来我只当做幸运，时至今日，似乎其实是不幸。\n他们说我在燃烧。我的灵能正在消耗它自身，因某种如今也尚未探秘的机理，或是干渴，或是贪婪。我不必在病床上苟延残喘，我只是昏沉，且将要死去。\n路希维亚议长允诺今天会来看望我。\n有人说她是一千年前就已经存在的灵能者，也许还能活过下一个千年。我不知道事实如何，如果她真的那样强大，我希望她能救我；如果不能……我想知晓些事情。\n知晓些因我将要死去，才可以听闻的事情。"
 SRA_specimen_Rocivia_Legacy_3: "无名札记-3"
 SRA_specimen_Rocivia_Legacy_3_desc_short: "第三份文本"
 SRA_specimen_Rocivia_Legacy_3_desc_details: "\n\n结束了。\n我向她告别了，向一位我此前从未认识，此后也不会相见的我擅自以为的朋友告别。\n路希维亚，路希维亚。\n我们的感情来源于无数代自然的选择。环境带来的生存压力选择了那些会和同伴交好，会和敌人对立。我们言说的一切，思想的一切，是一代代繁衍强化的结果，越是能留下后代的属性，就越会被继承。\n所以我们会去爱，会去追求，会去以为有些事情比我们活着更重要。\n但她呢？\n她自称她是在以人类的方式思考，但她不是人类。她的躯壳是捏造的外形，内里是纯粹的混沌，她没有腺体，没有激素，没有突触，没有大脑，没有我们思想和感受的一切机理，她不会像我们一样因为做基因认可的事情而快乐，也不会像我们一样因为做基因排斥的事情而厌恶。她根本没有奖励和惩罚机制，根本体会不到这样的感觉。\n她不需要繁衍，没有本能，没有生存压力，她没有任何行动的源动力，因为她什么也不需要。她既没有天生的任务，也没有外界的逼迫，她甚至不会因为什么事情好玩而去做，因为好玩这样的感受也是基因为我们预设的倾向，而她并没有这一切事物。\n……所以她才会说自己在模仿吗？她的内里是不可知的，当然也就是不重要的，她能表演的和旁人一模一样，她的喜怒哀乐别无二致，她的一切反馈和选择都合乎情理。她就好像一个哲学僵尸，其主观感受至少……和我们是不一样的。\n我不知道她为什么要选择扮演人类，但我想，正是因为这种扮演，她才称得上活着，或者说，她因为有所目标，有所追求，才会活着，才会行动，尽管目标是捏造的，追求是自定的……但归根结底，我们所做的一切不也其实没有先验的意义吗？\n……\n我不知道。\n我害怕她，我同情她，我怜悯她，我嫉妒她。\n我生来就有体验，几度改变自己的追求，度过了辉煌而又戛然而止的岁月，如今即将死去。\n而她不曾活过，自然也谈不上死。\n如果我能……可那我又能做什么呢？\n激情啊，若是你能永存于我，一同不死不灭……"
 SRA_specimen_Rocivia_Legacy_4: "无名札记-4"
 SRA_specimen_Rocivia_Legacy_4_desc_short: "第四份文本"
 SRA_specimen_Rocivia_Legacy_4_desc_details: "\n\n……我爱她。\n我无可救药的爱上了她。\n此前我以为我的唯一就是这些项目，以为我全部的渴望和追求都在这一切上，以为我愿意为“泛星系规划调整系统”奉献一生。\n我是如此的爱它，哪怕它生来就是为了有朝一日取代我们，淘汰我们，哪怕它是我们最后的造物，掌握我们绝不可能控制的力量，能够随意地毁灭我们，我也要让它降生。\n我仍然爱这些，我只是一个不忠的恋人，在临死前爱上了一个绝不可能爱我的，甚至称不上是人的存在。\n她……多么令人心颤啊。\n……杀死我吧。"