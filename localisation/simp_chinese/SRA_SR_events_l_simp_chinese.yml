 leader_trait_SRA_ruler:0 "§B星规阵列-至高统御模块§!"
 leader_trait_SRA_ruler_desc:0 "§B一个智慧而高效的设计，被灵感的火花所创造，她展现出的能力让所有统治者相形见绌。但是，将国家的全部事物都交予一个未知的人工智能，该说是一个深思熟虑的判断，还是一个埋藏祸根的种子？§!§R要知道，你现在也只能信任她了。§!"
 leader_trait_SRA_gov:0 "§B星规阵列-星区管理模块§!"
 leader_trait_SRA_gov_custom_subtitle:0 "§B苍穹执掌§!\n[This.GetClassTexticon][This.GetClass]"
 leader_trait_SRA_gov_desc:0 "§B“我们一致认为，将我们国家的整体建设规划交给一个毫无私心的优秀人工智能，无疑是一个正确的决定。历史已经无数次证明，绝大多数领导者无法统筹全部信息、无法洞察社会规律、无法摆脱自私自利、无法跨越党争掣肘。不称职者为我们规划未来的时代必须被终结。”——《泛星系规划调整系统的改进与再启》§!"
 leader_trait_SRA_sci:0 "§B星规阵列-科研探索模块§!"
 leader_trait_SRA_sci_custom_subtitle:0 "§B渊宇凝思§!\n[This.GetClassTexticon][This.GetClass]"
 leader_trait_SRA_sci_desc:0 "§B“智力、知识，以及灵感是科学进步的三大基石，当我们成功将智力与知识堆砌在人工智能之上后，灵感便成为了最后的难题。就目前来说，基于大量人格样本架构出来的科研用复合思维模型表现良好，能够从几乎所有角度思考问题，乃至凭借准确的直觉——如果真的存在的话——去探索未知。”——《第三科研中心有关科研用智能模型的开发记录》§!"
 leader_trait_SRA_adm:0 "§B星规阵列-舰队指挥模块§!"
 leader_trait_SRA_adm_custom_subtitle:0 "§B锋刃裁决§!\n[This.GetClassTexticon][This.GetClass]"
 leader_trait_SRA_adm_desc:0 "§B“所有的战争记录和演习档案已经被输入，它学习了我们迄今为止所有的战术战略，并且不断地与自己交锋以优化决策，它已经超越了所有人，并且，还要走得更远。我们认为，战争的指挥者也应当是战争的规划者，只有理解为何而战，才能懂得如何去战。”——《星规阵列设计记录》§!"
 leader_trait_SRA_gen:0 "§B星规阵列-星球战术模块§!"
 leader_trait_SRA_gen_custom_subtitle:0 "§B诸界肃清§!\n[This.GetClassTexticon][This.GetClass]"
 leader_trait_SRA_gen_desc:0 "§B“尽管地面作战已经退居二线，但我们无法否认，它仍然是战争中与战争外不可或缺的一部分。对于这种比太空作战更复杂的作战任务，直到今天，我们的国家仍在等待一支一体化的超凡军队，一支完美配合、不惧牺牲、绝对高效的军团，一套能应对任何战场的战争机器，一个如轨道清扫般高效、如定点抹除般精准的机械军团。”——《铸造军团：第三科研中心立项报告》§!"



