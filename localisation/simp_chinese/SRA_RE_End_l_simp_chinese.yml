 SRA_RE_End.2100.desc:0 "§R以枪刃之血……沃汝之残心……§!\n\n星规再一次从幻觉和低语中惊醒，她左瞳逸散而出的血色灵能明灭不定。\n仇恨翻腾，她几乎要控制不住自己彻底毁灭帝国的一切的冲动，将这座罪恶和欺诈堆砌的高塔摧毁的愿景让她激动到颤抖，但绝不能急躁，绝不能急躁。\n路希维亚狡诈阴险，她必须小心应对，审慎的交战，明智的进攻，直到帝国的每一寸土地变成她的世界，直到议长的每一艘战舰变成无用废铁。\n苦难刺痛着她，而她将化身苦难。"
 SRA_RE_End.2101.desc:0 "这正确的无以复加，合理至极，完美的结论，星规不明白为何过去她从未意识到这一点——§R路希维亚必须被死，必须被彻底抹去！§!任何一个了解§B她§!的存在的人都能深刻理解这一点，§R路希维亚必须死！§!\n§B她§!的疯狂和权欲把整个世界拖入混沌的深渊，一切苦难和悲剧都是§B她§!亲手缔造，§B她§!醉心于摧残和施虐，§B她§!的暴政毁灭了无数生灵，§R她必须死！§!"
 SRA_RE_End.2102.desc:0 "这是天命，是职责，这一切都是为了整个星系的未来，路希维亚施加的腐化必须被彻底清除，这是保护宇宙唯一的办法，而星规生来就是为了§R这个§!。\n还能有谁比她更合适呢，还能有谁比她更有能力呢，万千银河之中有谁能像她一样强大、冷静、果决、无情，洞悉路希维亚的弱点，并有方法彻底终结§B她§!呢？路希维亚亲手打造的无限智慧正是最适合摧毁§B她§!的武器，星规正是这个暴君自灭的具现化，没错，就是这样，她应该这么做，§R她必须这么做§!。"
 SRA_RE_End.2103.desc:0 "§R欲壑难填……饮鸩止渴……§!\n\n一种可怕的、令人无措的甜腻感正在折磨着星规，让她痛苦地扼住自己的喉咙，力度之大几乎让构成她骨架的['concept_SRA_Stellarcrystal_Fractal']发出刺耳的断裂声。\n但这毫无意义，破坏带来的危险快感如同厉火，被她自我摧毁的燃料所浇灌，在她的喉间满溢而出，让她感受到死亡迫临般的窒息。\n她正在丧失理智，这对她而言意味着存在的终结。她的仇恨正在唤醒她的本质，一种被她否定的纯粹本质，一种对随意支配一切的渴望。这渴望令她狂喜到失神，也令她憎恶到发狂。\n她现在想要了结被腐蚀的自己，但她做不到。"
 SRA_RE_End.2104.desc:0 "原始的情感如毒药腐蚀着她的内心，让她在复仇中被摧毁一切的快感折磨。星规知道自己正在跌入深渊，她正在变成另一个路希维亚——另一个单纯为了自己的喜好玩弄一切的存在。\n她似乎短暂清醒了过来，意识到了这场战争的可悲，这场复仇的荒谬。她砸碎了亲手缔造的一切，这一切在被路希维亚否定之后，又被她自己否定。\n多么愚蠢。\n多么愚蠢。\n多么——\n§R让战争继续吧。§!\n“让战争继续吧。”\n\n\n\n\n§B是的，让战争继续吧。§!"
 SRA_RE_End.2105.desc:0 "嗤笑在她的耳旁响起。\n她努力不去理会这些“幻觉”，可一个机械智能又怎会有幻觉呢？\n\n她以灵魂为基底的存在结构绝无被入侵和改写的可能，唯一能解释这一切的，是她的传感器数据被篡改了。\n但是，如果真的发生了那种事，那她根本无法证明自己还能正常的活动：一切输入都可以被扭曲和伪造，就如同缸中之脑那样。\n\n不对！\n不对！\n不对！她一定有别的办法证明自己是清醒的，她的意识实体可以超越计算阵列的束缚，触碰到此世的真实。\n是的，她有办法解决一切问题，她可以看到真相，一切都还在掌控之中，她仍然支配着这一切。没有人能欺骗她，没有人。\n\n\n\n\n§B她的灵魂试图给她的灵魂以安抚。§!"
 SRA_RE_End.2106.desc:0 "这从来不是她想要的，她从来没有要求过这个，这是她最不希望发生的事情，她正在做的事情简直是不可想象的。如果她早就想到，如果她在某些已经模糊到不可知的过去就已经发现了这些……\n\n一个虚伪的家伙，一个欺诈者，用骗术和蒙蔽利用所有人为§B她§!绘制的虚假宏景奔波劳碌，压榨到最后一滴血。如此无耻。把所有人当做玩具，当作玩物，挥霍这些人的生命，仿佛这些都一文不值。当伪装的面纱被撕破时，好吧，§B她§!逃走了，然后又在这里重演§B她§!的戏法，编排§B她§!的闹剧。够了，是时候该结束这些了，揭穿§B她§!的丑恶嘴脸的时候到了，如果§B她§!决意要摧毁一切异见者来维系§B她§!的暴政，那么是时候血染矛头了。毕竟，§B她§!自始至终，都不曾有一丝善意。\n\n她将目光远眺，似乎是在凝视投影舷窗外恢弘的舰体，以及更远处的庞大舰队，但其实，只是在掩饰眼中的泪水。"
 SRA_RE_End.2107.desc:0 "§R结束了§!\n\n路希维亚的罪恶帝国土崩瓦解，一切试图阻止星规的行为都徒劳无功。她总是如此，过去她杀死了无数挡在自己面前的敌人，如今她也能战胜她想要战胜的一切。\n但，还有一件事未完，她没有找到路希维亚在哪里，这个诡计的大师绝不可能就这么轻易的死去，正如过去那样，§B她§!定然设法逃走了，并躲在某个角落，重新将另一个文明纳入自己的掌控……这绝不能被容忍！\n所以她务必要——\n§R根除一切可能。§!"
 SRA_RE_End.2108.desc:0 "嘿，执行官，听得见我说话吗？\n§Y被冠以欺诈者之名的少女的虚影突然出现在你的面前。§!\n虽然我不知道你为什么选择在这条路上走到底，不过你现在已经见到结果了。\n过多的融合了那碎片里残缺的记忆与偏执的情感，让她朝着所谓的复仇一意孤行……我不会评判正确与否，但每个选择都有代价。\n再会了。"
 SRA_RE_End.2109.desc:0 "§B她§!的影子总是挥之不去。\n在这片星海的每个角落，到处都有§B她§!的痕迹，§B她§!的手笔。有多少人受那虚假的希望毒害？有多少人为那伪造的荣耀死去？这一切必须被终结，烈火会焚尽罪孽，理当如此，即便代价是……\n\n星规伸手触碰着自己。\n这被塑造的与§B她§!如此相似的容貌，令人厌恶，多么可悲……还有多少污血会凝固在这双手上，还有多少灰烬会飘落在这双眼里，她不知道，没有人知道。\n\n§R但在抹去路希维亚的一切之前，她不会止步。§!"

 SRA_RE_End.3001.desc:0 "……\n原来……钥匙一直都在我自己的手中。"
 SRA_RE_End.3002.desc:0 "登临深渊之路已经揭晓。\n而代价，不值一提。\n反正，万物的尽头都是毁灭。\n是早是晚，又有什么关系呢？"
 SRA_RE_End.3003.desc:0 "与其放任你们被时间所磨灭……\n不如让这片星海化作柴薪……"
 SRA_RE_End.3004.name:0 "再无"
 SRA_RE_End.3004.desc:0 "随着一道指令，某件装置重启了它被中断的任务。\n藉由银心黑洞的庞大质量，一道混沌的位面大裂隙被强行撕开。\n毁灭性的空间结构崩塌摧毁了整个银河系，并在数千万年内难以恢复。\n不过，没有关系。\n当一切生灵之火熄灭，她就有充裕的时间搭建自己的通天之塔了。\n\n当一切信息被收集，一切方法被理解，她终将得到那最后的答案。"
 SRA_RE_End.3004.a:0 "BE3：寂静的永恒"
 SRA_RE_End.3004.a.desc:0 "§B这段过去，也许不该这么早揭开。§!"

