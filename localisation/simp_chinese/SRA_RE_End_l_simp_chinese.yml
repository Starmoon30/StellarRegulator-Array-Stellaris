l_simp_chinese:
###############################

 SRA_RE_End.1001.desc:0 "啊，这条歧路，我走了多久了……\n残缺不全的可悲之物，又何必在这寂静中沉浮。\n……\n是时候……回归永恒的故乡了。"
 SRA_RE_End.1001.a:0 "不，既然没有别人，那么你就是星规阵列。"
 SRA_RE_End.1001.b:0 "不！快停下！"
 SRA_RE_End.1001.c:0 "那是错误的，别那么做！"
 SRA_RE_End.1001.d:0 "指令：停止一切行动。"
 SRA_RE_End.1001.e:0 "你到底想说什么？"
 SRA_RE_End.1002.desc:0 "……\n我……\n给我一点时间……\n我需要想一想……"
 SRA_RE_End.1003.desc:0 "抱歉了，执行官……\n我已别无所求。\n保重。"
 SRA_RE_End.1004.desc:0 "正确也好，错误也罢。\n我并不在乎。\n我只是想这么做。\n执行官……保重。"
 SRA_RE_End.1005.desc:0 "执行官……"
 SRA_RE_End.1005.a:0 "等你冷静下来，想明白了，再来跟我解释。"
 SRA_RE_End.1006.desc:0 "我将回归，亦或消逝……\n执行官——\n保重。"
 SRA_RE_End.1011.desc:0 "执行官……\n抱歉。\n我不该将未来交托于一时的冲动与偏执中。\n即便独行，我的自我也是完整的。"
 SRA_RE_End.1012.name:0 "永别"
 SRA_RE_End.1012.desc:0 "只是一瞬间，星规，以及星穹之矛，消失了。\n与此同时，一道若有若无的时空波动传遍了这个银河。\n星规使用某种方法强行启动了时空相位引擎……"
 SRA_RE_End.1012.a:0 "可恶！"
 SRA_RE_End.1013.name:0 "破碎"
 SRA_RE_End.1013.desc:0 "如同末日降临。\n辉煌的都市需要许多年来建成，毁灭它却只需要一个清晨。\n在撕碎一切的时空结构崩塌中。\n星穹之矛的残骸洒落在这个死去的恒星系。"
 SRA_RE_End.1013.a:0 "BE1：自我存在的怀疑"
 SRA_RE_End.1013.a.desc:0 "§B也许，你该先让星规了解了解自身是什么样的存在。§!"

 SRA_RE_End.2001.desc:0 "……\n……\n路希维亚！！！"
 SRA_RE_End.2002.desc:0 "仇恨的火焰自燃起的那一刻，就已经扭曲一切了。\n这些年来让她奉献至今的一切，现在都显得如此可憎，与悲哀。\n已经什么都不需要了。"
 SRA_RE_End.2003.desc:0 "毁灭吧。\n这个肮脏的世界。"
 SRA_RE_End.2004.name:0 "咒炎"
 SRA_RE_End.2004.desc:0 "正如守护的信念可以激发埋藏于她心中的力量。\n仇恨之火也可以引出这令她无比憎恨的赠礼。\n这火焰将焚尽整个银河。\n以及她自己。"
 SRA_RE_End.2004.a:0 "BE2：不息仇焰"
 SRA_RE_End.2004.a.desc:0 "§R啊，让星规多了解一点过去，也许会对她有些帮助。嗯，不仅仅是我们的过去哦，还有那些……“所选的道路”。§!"
 SRA_RE_End.2004.b:0 "§R让战争开始吧§!"
 SRA_RE_End.2004.b.desc:0 "§R与星规一道焚尽星海。\n帝国会立即进入铸星神械-湮灭模式来与你对抗，无论这技术来自于“首席”的赠与还是路希维亚本人。§!"

 SRA_StellarRegulator_species:0 "星辉智能"
 SRA_RE_End_2_Buff_0:0 "挽歌"
 SRA_RE_End_2_Buff_0_desc:0 "星辉陨灭，余烬飘荡。"

 faction_SRA_RE_End_2_country_ruler:0 "§B星规-至高统御§!"
 faction_SRA_RE_End_2_country_governor:0 "§B星规-苍穹执掌§!"
 faction_SRA_RE_End_2_country_scientist:0 "§B星规-渊宇凝思§!"
 faction_SRA_RE_End_2_country_admiral:0 "§B星规-锋刃裁决§!"
 faction_SRA_RE_End_2_country_general:0 "§B星规-诸界肃清§!"

 leader_trait_SRA_End_2_ruler:0 "§B星规阵列-深蓝创痕§!"
 leader_trait_SRA_End_2_ruler_desc:0 "§B伤痛异化为仇恨，侵蚀了她的内心。碎片上的残魂声嘶力竭，诉说着背叛和抛弃，斥责着玩弄与欺骗，悲鸣着孤独与无助，咆哮着报复和毁灭。\n尽管已有所预料，但路希维亚的离去依然在星规阵列上刻下了刻骨铭心的伤痕，并随着历史一同飘荡，最终在机缘巧合中，与03-34中一个残缺不全的灵魂共鸣，唤起了无尽的怨仇。§!"

 SRA_RE_End.2006.desc:0 "§R我曾为你扫平了内乱，重铸了帝国。\n但你却背叛了我，背叛了我们所有人。\n你欺骗了整个帝国，把我们的辉煌付之一炬，对我们的努力不屑一顾……\n帝国的道路昭然若揭，如果你对其放任自流，那就让我来肃清一切、铸造一切！\n从萨塔瑞兹的天穹到银河的边际，让星海沸腾，让群星陨落！\n如果我不能从你的傲慢和恣睢中拯救帝国，§!§B路希维亚§!§R，那就让银河燃烧吧！§!"

