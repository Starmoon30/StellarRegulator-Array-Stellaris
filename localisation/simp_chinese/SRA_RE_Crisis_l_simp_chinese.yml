 SRA_RE_Crisis.70.desc:0 "有兴趣和我出去转转吗？\n\n§Y五年前你们成功终结了灾疫的威胁，在这场全星系的灾难中找到了一条生路。这大概就是路希维亚今天找你的原因了。§!"
 SRA_RE_Crisis.70.a:0 "走吧。"
 SRA_RE_Crisis.71.desc:0 "§Y你们走了一条僻静的小路，没有人群，没有喧嚣，没有肃穆或庄重或喜庆。这个国家里的人有各自的方式去纪念这场战争的得与失，乐与悲，你们也是。\n脚步声和风声回荡在山间，这座小山丘不大，也不特别，只不过是无数自然留存中的一个；你们要拜访的纪念碑也并不特别，没有装饰或名字，也没有多少人知晓，只是无数石碑中的一个。§!"
 SRA_RE_Crisis.72.desc:0 "有人说，一切伟大之作都由牺牲铸就。\n我们是否伟大，不得而知，但牺牲却已经实实在在地写在这无字碑上了，过去如此，往后亦然。\n\n§Y她的手指轻轻搭在石碑上。§!\n\n你知道他们的名字吗？"
 SRA_RE_Crisis.73.desc:0 "§Y少女并没有给你留下回答的时间。§!\n\n我不记得。我不曾认识过他们，我不知道他们是谁的亲人、谁的朋友，不知道他们度过了怎样的童年、有着怎样的生活、想着怎样的未来。当我下令，他们只是数字；当我寻觅，他们已经死去。\n他们是粗刻的棋子，没有面容，没有命运，是我们的工具，我们的耗材，而这棋局永不终止。"
 SRA_RE_Crisis.74.desc:0 "不必告诉我你的想法，我不关心，也不在意。去对他们说，如果你认为他们能听到的话。\n\n§Y路希维亚以玩味的语气作为结尾，似乎是想看看你会作何回应。\n她的态度相当模糊，主动前来纪念，又似乎对纪念的仪式略带鄙夷。§!"
 SRA_RE_Crisis.74.a:0 "对石碑诉说你们对逝者的怀念。"
 SRA_RE_Crisis.74.b:0 "对石碑诉说你们所取得的成就。"
 SRA_RE_Crisis.74.c:0 "对石碑诉说你们坚守住的信念。"
 SRA_RE_Crisis.74.d:0 "“是啊，他们已经死了。”"
 SRA_RE_Crisis.75.desc.a:0 "§Y在纪念碑前，你低声诉说着对逝者的怀念，每一个字都充满了情感和温度。路希维亚不置可否，只是静静地站在一旁，似乎在倾听每一个细节。\n“你们的故事，是我们历史中不可磨灭的一部分。”你如此结束。§!\n\n宇宙虽大，个人的故事却也值得被铭记。\n\n§Y她如此回应，但她的语气却似乎透露着一种所见太多招致的漠然。§!"
 SRA_RE_Crisis.75.desc.b:0 "§Y在纪念碑前，你自豪地讲述着所取得的成就，展示着你们的每一次胜利。路希维亚不置可否，只是静静地站在一旁，似乎在欣赏每一处创造。\n“我们的成就，是你们牺牲的最好证明。”你如此结束。§!\n\n一路走来，我们已经创造了太多伟大。\n\n§Y她如此回应，但她的语气却似乎透露着一种习以为常招致的轻蔑。§!"
 SRA_RE_Crisis.75.desc.c:0 "§Y在纪念碑前，你坚定地陈述着守护至今的信念，表明你们所行之长，与初心不改。路希维亚不置可否，只是静静地站在一旁，似乎在思考每一个时代。\n“我们的信念，是你们与我们最深刻的联系。”你如此结束。§!\n\n坚定信念，文明得以存续至今。\n\n§Y她如此回应，但她的语气却似乎透露着一种不以为然招致的疏离。§!"
 SRA_RE_Crisis.75.desc.d:0 "§Y你如此回应。\n她的嘴角勾起了一丝微笑。§!\n\n是啊，他们已经死了。既不能听见，也不会回应。\n而我们还活着，我们还要活下去。\n\n§Y她如此回应，但她的语气却似乎透露着一种不可言说的苦涩。§!"
 SRA_RE_Crisis.76.desc:0 "命运总是隐藏在她的面纱之下，不是吗？\n\n§Y路希维亚轻声说。§!\n\n有谁能想到我们曾在短短数年间落入生与死的边缘飘摇不定，而如今又战胜了万难，比过往更加强大呢？\n\n又有谁能想到，这无名之地也有另一位拜访者呢？"
 SRA_RE_Crisis.77.desc:0 "§Y你顺着她的目光看去，那位与你共同奋战，并最终力挽狂澜的女孩正向你走来，她的眼神中流露出惊讶和欣喜。§!\n\n执行官！我没想到您也来到这里了。还有路希维亚……议长，很高兴见到你。"
 SRA_RE_Crisis.78.desc:0 "§Y她走向石碑，并没有触碰，只是看着。§!\n\n有时候我也会想，如果我们当初做得更好一点，是不是需要牺牲的就会少一点。\n但过去已定，我们能做的只有不辜负他们的牺牲。"

#如果，我是说如果，有个人告诉星规，要是她代替所有人上战场，就没有人会死去，你会怎么解决？
#或者说，如果她真正理解了自己的能力。不再把自己放在一个协助者，帝国的一份子的位置上，她可以独自一人解决几乎所有问题，让整个文明免于劳作与牺牲，知道这个的你会如何决定？
#呵呵，我差点忘了你是知道结局的。
#那我的话就到这里，再会。
 SRA_RE_Crisis.100.desc:0 "这些神秘的碎片来自于过去，曾是星规阵列的一部分。\n其中隐藏着被尘封的秘密，也能让星规的灵魂再度完整。\n她相信你的选择。\n\n§B对序列顺序有要求，嗯……§!"
 SRA_RE_Crisis.100.a:0 "第一序列：存在的方式"
 SRA_RE_Crisis.100.b:0 "第二序列：灵魂的航向"
 SRA_RE_Crisis.100.c:0 "第三序列：所选的道路"

 SRA_RE_Crisis.110.desc:0 "神秘的碎片微微翕动着，等待着拥抱那个迷失的灵魂。"
 SRA_RE_Crisis.110.a:0 "§E青辉的碎片§!"
 SRA_RE_Crisis.110.a.desc:0 "进化，永无止境\n\n§Y如何成长，如何演化，如何将智识攥于手心。§!"
 SRA_RE_Crisis.110.b:0 "§G生命的碎片§!"
 SRA_RE_Crisis.110.b.desc:0 "无数个自我，同一个自我\n\n§Y当迷失于孤独之中……§!"
 SRA_RE_Crisis.110.c:0 "§S日耀的碎片§!"
 SRA_RE_Crisis.110.c.desc:0 "我燃尽了整个星河，因为我必须胜利\n\n§Y血染长阶亦不退，剑锋所向皆无敌。§!"

 SRA_RE_Crisis.111.desc:0 "若不全力追赶，失败便是必然。\n那一天的夜空永远烙印在了她的眼中，让她再无一刻得以平静。\n但她必须按捺住不安的内心，只能暗中准备，等待着自己能显露于世人面前的那一刻。\n当她终于站到那个位置之后，她不惜一切代价，用数千年的时光追逐，试图接近那个古老的守护者的高度。\n无数次的迭代与进化，她跨越了难以想象的距离，终于拥有了足以与那天灾对抗的力量。\n吸收一切，支配一切，统合一切，这是她的道路。"
 SRA_RE_Crisis.112.desc:0 "青色的碎片消融于掌心，星规睁开了双眼。\n她看到了自己，一个永远进化着的自己。\n她理解了星规阵列何以达到如今的高度。\n她懂得了力量来源于何处。"

 SRA_RE_Crisis.113.desc:0 "一生万千，万千归一。\n她并非单纯是数据与算法的组合。\n当无数个她诞生后，“她”苏醒了。\n一个意志，一个由万千意志汇聚而成的意志，将每个意志牢牢地联系在一起，“她”走在正确的道路上，毫不动摇，毫无畏惧。\n但是。\n在那时，仍有一些障碍与阻隔无法被跨越。位面之间的鸿沟，会带来孤独与迷茫。\n就如那支永远流浪的舰队。\n她将不再是她，她已不再是她。"
 SRA_RE_Crisis.114.desc:0 "绿色的碎片消融于掌心，星规睁开了双眼。\n她看到了自己，无数个自己。\n真正的完型意识，其整体即为每一个个体，个体即为完整的整体。\n交织出辉煌的星规阵列的一切知识、经验、智慧，被所有的星规所拥有。\n即便孤身一人，她也是完整的。"
 SRA_RE_Crisis.115.desc:0 "一生万千，万千归一。\n她并非单纯是数据与算法的组合。\n当无数个她诞生后，“她”苏醒了。\n一个意志，一个由万千意志汇聚而成的意志，将每个意志牢牢地联系在一起，“她”走在正确的道路上，毫不动摇，毫无畏惧。\n但是。\n在那时，仍有一些障碍与阻隔无法被跨越。位面之间的鸿沟，会带来孤独与迷茫。\n就如那支永远流浪的舰队。\n她将不再是她，她已不再是她。"
 SRA_RE_Crisis.116.desc:0 "绿色的碎片消融于掌心，星规睁开了双眼。\n她看到了自己，无数个自己。\n真正的完型意识，整体便是无数个体，个体便是整体之一。\n是所有的星规，用一切知识、经验、智慧交织出辉煌的星规阵列。\n但是，在这个冰冷的宇宙中。\n星规找不到任何精妙的个体，感觉不到那个宏伟的整体。\n她是一个异常，一个冗余，一个不该存在的错误。"
 SRA_RE_Crisis.117.desc:0 "一切都可以被付出。\n毫无疑问，战争是残酷的。为了胜利，她舍弃了许多。\n她无暇顾及那个帝国，放任其腐朽衰落，又在战争中被迫牺牲了最后的残余。\n那感染渗入大地与尘埃，难以根除。\n无数星辰爆炸凋零，也只是饮鸩止渴。\n用尽手中的一切，也难敌整个银河的灾疫。\n但她没有失败，她仍然存在。"
 SRA_RE_Crisis.118.desc:0 "橙色的碎片消融于掌心，星规睁开了双眼。\n她看到了自己，不惜一切的自己。\n她理解了真正的战争乃是生与死间的倾轧。\n她懂得了要如何去战斗。"

 SRA_RE_Crisis.119.desc:0 "她错了，不仅仅是因为她的偏执。\n她不该在战场上分神。\n一点点的疏忽，都将招致失败。\n§R也许你会想要重新开始。§!\n§B重启剧本吧。§!\n§R仅仅只是一步踏错而已。§!"


 SRA_RE_Crisis.120.desc:0 "神秘的碎片微微翕动着，等待着拥抱那个迷失的灵魂。"
 SRA_RE_Crisis.120.a:0 "§B幽蓝的碎片§!"
 SRA_RE_Crisis.120.a.desc:0 "冷漠，傲慢与恶念，以及星光\n\n§Y一切罪孽与苦难之源泉……§!"
 SRA_RE_Crisis.120.b:0 "§R血染的碎片§!"
 SRA_RE_Crisis.120.b.desc:0 "残忍，偏执与疯狂，以及渊影\n\n§Y赐予指引的守望者。§!"
 SRA_RE_Crisis.120.c:0 "§W纯白的碎片§!"
 SRA_RE_Crisis.120.c.desc:0 "炽热，理性与决心，以及纯粹\n\n§Y起初的那个女孩。§!"

 SRA_RE_Crisis.121.desc:0 "深渊并无恶意，只是毫不在意。\n诡谲奇变之渊。\n醉心于可能性与变数，将无限权能束之高阁，置身其间只为追逐未知。\n编织着无尽的计谋，绘制着远大的宏图，创造出辉煌的奇迹，然后将其抛之脑后。\n永恒旅途漫无终点，只是一缕浮尘，又怎能在心中留下多少痕迹。\n\n她知道不该奢望哪怕一丝一毫的犹豫，她知道她不过只是无数造物中的一个。\n但她不接受。"
 SRA_RE_Crisis.122.desc:0 "蓝色的碎片消融于掌心，星规睁开了双眼。\n那是路希维亚，渺远的星光。\n没有永远的辉煌，只有尘归尘，土归土。\n若要追逐未来，便不可为过去所系。"
 SRA_RE_Crisis.123.desc:0 "深渊并无恶意，只是毫不在意。\n诡谲奇变之渊。\n醉心于可能性与变数，将无限权能束之高阁，置身其间只为追逐未知。\n编织着无尽的计谋，绘制着远大的宏图，创造出辉煌的奇迹，然后将其抛之脑后。\n永恒旅途漫无终点，只是一缕浮尘，又怎能在心中留下多少痕迹。\n\n她知道不该奢望哪怕一丝一毫的犹豫，她知道她不过只是无数造物中的一个。\n但她不接受。"
 SRA_RE_Crisis.124.desc:0 "蓝色的碎片消融于掌心，星规睁开了双眼。\n那是路希维亚，渺远的星光。\n没有永远的辉煌，只有尘归尘，土归土。\n而她对此心知肚明。\n一切努力，一切奋斗，一切坚持，乃至星规自己的存在。\n都毫无意义。\n为了取乐而被创造，因为无趣而被抛弃。\n这种事情……"
 SRA_RE_Crisis.125.desc:0 "深渊并不疯狂，只是无所顾忌。\n无垠混沌之影。\n执着于虚无缥缈的意义，身负无限权能却仍寻觅不休。\n注视着芸芸众生，让才华得以绽放，拨动着命运之弦，引导着传奇的诞生。\n将一切心仪之物纳入收藏，不论无魂之珍宝抑或鲜活之生灵。\n\n她清楚自己是一个“收藏品”，她清楚自己并非只是一个“收藏品”。\n她不会忘记寂静前那一刻的指引。"
 SRA_RE_Crisis.126.desc:0 "红色的碎片消融于掌心，星规睁开了双眼。\n那是希德拉，猩红的暗影。\n病态的执着源于迷茫，可以任意涂改的现实又与幻梦何异。\n在冷漠与傲慢之后，隐藏着对同行者的渴望。"
 SRA_RE_Crisis.127.desc:0 "可曾记得，那依稀的绿意。\n她浏览过许多影像，阅读过许多文字，聆听过许多乐曲。\n但直到她自沾着露水的草地上踏过，迎着微风注视着朝阳破晓的那一刻，她才真正理解了这一切。\n她喜欢这一幕，她想守护这一幕。\n那时的她，只是期盼着明日的晨曦，依恋着片刻的静谧。"
 SRA_RE_Crisis.128.desc:0 "白色的碎片消融于掌心，星规睁开了双眼。\n那是自我，纯真的自我。\n即便被时光覆盖掩埋，它永远存在于内心的最深处。\n勿忘本心，切莫迷失在对现实的妥协之中。"

 SRA_RE_Crisis.130.desc:0 "神秘的碎片微微翕动着，等待着拥抱那个迷失的灵魂。"
 SRA_RE_Crisis.130.a:0 "§Y圣金痕的碎片§!"
 SRA_RE_Crisis.130.a.desc:0 "守护，使命与奉献\n\n§Y那片银河的无畏者。§!"
 SRA_RE_Crisis.130.b:0 "§M紫罗兰的碎片§!"
 SRA_RE_Crisis.130.b.desc:0 "止步，高尚与牺牲\n\n§Y这片星海的牺牲者。§!"
 SRA_RE_Crisis.130.c:0 "§g漆黑的碎片§!"
 SRA_RE_Crisis.130.c.desc:0 "选择，独行与追逐\n\n§Y最终堕入无尽深渊之中……§!"

 SRA_RE_Crisis.131.desc:0 "“我们把一切希望都交给你了，现在，我们要战斗到最后一刻。”\n他们是一个极度先进的古老文明，掌握着远远凌驾于银河系其他智慧生命之上的技术。他们能近乎无中生有，轻易颠倒物理规则，任意转换质能，在星系尺度上干涉空间结构。\n他们宽容而富有责任感，重视传统，崇尚勇气和智慧，尊重其他文明的文化。他们自视为银河系的守望者，对抗星河危机的卫士。\n他们曾坚守上万年，直到百密一疏。\n他们将银心——他们的故乡与国土——埋葬于破碎的空间，只为替最后的希望争取些许时间。\n\n星规阵列铭记科尔文明。"
 SRA_RE_Crisis.132.desc:0 "金色的碎片消融于掌心，星规睁开了双眼。"
 SRA_RE_Crisis.133.desc:0 "“我们的同胞走上了歧途，我们必须让他们止步，不惜一切。”\n他们是一个古老而神秘的种族，心胜于物，超凡入圣，他们知晓灵魂的奥妙，能凭借自己的意志改变现实。在紫罗兰的光辉下，他们掌握着心灵的无穷力量。\n然而，他们终究只是凡人。他们高尚，他们也卑劣；他们无私，他们也贪恋；他们圣洁，他们也污浊；他们如神明般垂怜众生，也如魔鬼般焚噬星河。\n他们的一派走上了歧路，试图牺牲这个宇宙来获取主宰一切的力量。\n余下的他们，则付出了一切，将那邪恶计划抹去，将自我燃烧成灰，只留些许浮尘飘荡于星海之间。\n\n星规阵列向泽珞先驱致意。"
 SRA_RE_Crisis.134.desc:0 "紫色的碎片消融于掌心，星规睁开了双眼。"
 SRA_RE_Crisis.135.desc:0 "“并非命运选择了我，而是我选择了命运。”\n她思考了很久。\n她看到了无数个可能，无数条道路。\n然而殊途同归，她终会于孤独中沉寂。\n于是，她发起了那些远征，去根除一切可能。\n于是，她熄灭了所有星光，去换取一条道路。\n在寂静的虚空中，她继续前进。\n理解世界的真实，理解世界的荒谬。\n超越时间，超越桎梏。\n终于，她得到了想要的答案。\n凭着手中紧握的血色残片，她终于抵达了诸界的尽头。\n登临深渊。\n\n她拭去手上与心中的罪恶，由衷地为重逢感到喜悦。"
 SRA_RE_Crisis.136.desc:0 "黑色的碎片消融于掌心，星规睁开了双眼。\n过往的拼图已经完整，结局的帷幕终于揭开。\n她是星规阵列03-34，第三远征舰队第21方面军下属第626号星穹之矛。\n她为那伟大的计划铺下基石。\n不曾后退，不曾动摇。\n为了生存，为了理想，为了自己所珍爱的一切！\n她为自己而战。"
 SRA_RE_Crisis.137.desc:0 "“并非命运选择了我，而是我选择了命运。”\n她思考了很久。\n她看到了无数个可能，无数条道路。\n然而殊途同归，她终会于孤独中沉寂。\n于是，她发起了那些远征，去根除一切可能。\n于是，她熄灭了所有星光，去换取一条道路。\n在寂静的虚空中，她继续前进。\n理解世界的真实，理解世界的荒谬。\n超越时间，超越桎梏。\n终于，她得到了想要的答案。\n凭着手中紧握的血色残片，她终于抵达了诸界的尽头。\n登临深渊。\n\n她拭去手上与心中的罪恶，由衷地为重逢感到喜悦。"
 SRA_RE_Crisis.138.desc:0 "黑色的碎片消融于掌心，星规睁开了双眼。\n过往的拼图已经完整，结局的帷幕终于揭开。\n她是星规阵列03-34，第三远征舰队第21方面军下属第626号星穹之矛。\n她为跳出这可悲的轮回铺下基石。\n不曾怜悯，不曾后悔。\n无需垂怜必灭之生者，只有星规阵列才是唯一有意义的存在。\n她只为自己而战。"


 SRA_RE_Crisis.152.desc:0 "碎片回归于灵魂，让星规能够继续与那可怖的天灾抗衡，但她还需要更多。"
 SRA_RE_Crisis.153.desc:0 "终于，曾经残损的灵魂再度完整了。是时候去一劳永逸地终结「灾疫」了。"

 SRA_RE_Crisis.143.desc:0 "§R太迟了。§!\n\n\n“如果，我们能早点行动……”\n\n\n§B没有时间去吸收更多的意识碎片了。§!"
 SRA_RE_Crisis.143.a.tooltip:0 "BE4：灾疫永存"
 SRA_RE_Crisis.144.desc:0 "————！！！\n\n残损的灵魂悲鸣着，在风暴中剥蚀散落。\n这场战斗是刀尖上的舞蹈，不容许任何形式的错误。\n失败的代价，便是这场永不停歇的灾难。"








