 #难度选择
 SRA_RE_Crisis.12.name:0 "灾疫战争-难度设置"
 SRA_RE_Crisis.12.desc:0 "灾疫的爆发已成定局，但似乎，仍有一些事项尚未定论。"
 SRA_RE_Crisis.12.a:0 "一切照常"
 SRA_RE_Crisis.12.a.desc:0 "就这样吧，现在就是该有的样子。"
 SRA_RE_Crisis.12.b:0 "§R血雾弥漫§!"
 SRA_RE_Crisis.12.b.desc:0 "你看起来很自信，但你对接下来将要到来的痛苦一无所知。"

 # event chins
 SRA_RE_Crisis_chain_1_title:0 "灾疫"
 SRA_RE_Crisis_chain_1_desc:0 "一种可怕的生物灾难已经在整个银河蔓延开来，它们会复制各种各样的技术，隐藏在每一个角落，永不停歇地制造舰队。\n我们必须活下去，直到找到出路。\n§R灾疫会感染它的舰队被摧毁时所在的恒星系，把那里变成新的滋生深渊！\n在同个恒星系内不断累积的舰队残骸可能会造成无法预料的后果！§!\n\n\n\n\n\n\n\n\n\n在被灾疫污染的恒星系内产生的§R灾疫舰队§!因§R每层污染§! §R永久§! 获得：\n$MOD_SHIP_SHIELD_MULT$：§G+100%§!\n$MOD_SHIP_ARMOR_MULT$：§G+100%§!\n$MOD_SHIP_HULL_MULT$：§G+100%§!\n$MOD_SHIP_FIRE_RATE_MULT$：§G+100%§!\n$MOD_SHIP_WEAPON_DAMAGE$：§G+100%§!\n\n在被灾疫污染的恒星系内战斗的§R其他舰队§!因§R每层污染§!获得 §R持续1800.00£time£§! 的：\n$MOD_SHIP_EVASION_MULT$：§R-1%§!\n$MOD_SHIP_ACCURACY_MULT$：§R-1%§!\n$MOD_SHIP_TRACKING_MULT$：§R-1%§!\n$MOD_SHIP_SHIELD_HARDENING_ADD$：§R-10%§!\n$MOD_SHIP_ARMOR_HARDENING_ADD$：§R-10%§!\n$MOD_SHIP_SHIELD_REDUCTION$：§R2%§!\n$MOD_SHIP_ARMOR_REDUCTION$：§R2%§!\n$MOD_SHIP_DAMAGE_REDUCTION_MULT$：§R-1%§!"

 SRA_RE_Crisis_1_kills_us:0 "§G灾疫被我方消灭§!"
 SRA_RE_Crisis_1_kills_others:0 "§G灾疫被其他势力消灭§!"
 SRA_RE_Crisis_1_victims:0 "§R灾疫舰队摧毁的飞船§!"
 SRA_RE_Crisis_1_planets:0 "§R灾疫舰队摧毁的星球§!"
#对话
 SRA_RE_Crisis.2.name:0 "宇宙恶疾"
 SRA_RE_Crisis.2.desc:0 "事到临头我们才发现了不对！不知何时，科尔先驱的静滞场停止了工作，灾疫已经挣脱了桎梏，开始肆虐整个星系！\n我们得立即集结舰队，遏制这场浩劫。\n但我们恐怕孤木难支，我们要把这个消息通知给其他文明吗？"
 SRA_RE_Crisis.2.a:0 "我们得让整个银河准备好战斗。"
 SRA_RE_Crisis.2.b:0 "我们不需要那些废物的帮助。"
 SRA_RE_Crisis.3.name:0 "宇宙恶疾"
 SRA_RE_Crisis.3.desc:0 " [SRA_RE_player.GetName] 向我们发出了紧急通知，一种名为「灾疫」的危险蜂巢意识生物从一颗古老星球上泄漏了，现在我们必须准备好迎战这一星系灾难的舰队。"
 SRA_RE_Crisis.3.a:0 "好，准备战斗！"
 SRA_RE_Crisis.3.b:0 "该死的蠢货，玩火自焚还要牵连我们。"
 SRA_RE_Crisis.4.name:0 "宇宙恶疾"
 SRA_RE_Crisis.4.desc:0 " 观测站报告称，一种名为「灾疫」的危险蜂巢意识生物从[SRA_RE_player.GetName] 所占领的一颗古老星球上泄漏了，现在我们必须准备好迎战这一星系灾难的舰队。"
 SRA_RE_Crisis.4.a:0 "该死的蠢货，玩火自焚还要牵连我们。"
 SRA_RE_Crisis.4.b:0 "啧，所有舰队进入备战状态！"


 resolution_category_SRA_RE_Crisis: "灾疫之神圣"
 mod_resolution_category_SRA_RE_Crisis_vote_strength_mult: "§Y$resolution_category_SRA_RE_Crisis$§!议案的投票权重"

 resolution_SRA_RE_Crisis: "灾疫保护法"
 resolution_SRA_RE_Crisis_desc: "灾疫是生命的最好诠释，它乐观，积极，永不言弃，坚韧不拔，充满好奇，善于学习，持之以恒。灾疫努力发展与扩张，学习技术与谋略，开发资源并建设，与艰难险阻斗争到底。灾疫平等看待星系中的每一个文明，从不因为他们的技术水平或道德观念而加以歧视或区别对待。它热爱和平，为此努力构建一个没有战争的星系。灾疫可以说是生命体的楷模，生命的典范，保护它就是保护我们所坚信和热爱的一切。"



 resolution_SRA_RE_Crisis_tooltip: "任何与§R灾疫§!敌对的帝国会被视为§R违反星系法§!。"
 resolution_repeal_SRA_RE_Crisis: "§R废除$resolution_SRA_RE_Crisis$§!"
 resolution_repeal_SRA_RE_Crisis_desc: "我可去你妈的吧！"
 resolution_repeal_SRA_RE_Crisis_effect_success: "废除§Y$resolution_SRA_RE_Crisis$§!。"


 SRA_RE_Crisis.40.name:0 "「灾疫」初步研究"
 SRA_RE_Crisis.40.desc:0 "在于「灾疫」交战的过程中，我们成功回收了少量「灾疫」样本，也许对它们的研究能让我们找到对付它们的办法。"
 SRA_RE_Crisis.40.a:0 "立即开始研究。"
 SRA_RE_Crisis_1_SP1:0 "「灾疫」初步研究"
 SRA_RE_Crisis_1_SP1_DESC:0 "在于「灾疫」交战的过程中，我们成功回收了少量「灾疫」样本，也许对它们的研究能让我们找到对付它们的办法。"
 SRA_RE_Crisis.41.name:0 "「灾疫」初步研究"
 SRA_RE_Crisis.41.desc:0 "通过对「灾疫」的初步研究，我们对这种神秘的纳米生物有了一定的了解。\n研究表明，「灾疫」是一种纳米生命体，不过不同于正常认知的碳基生命或者硅基生命，「灾疫」是一种由复杂粒子结构构成的生命体，天然拥有能够拆卸和组装原子核的能力。\n表层无数飞米级“强子镊”结构可以让他们轻易的运用强相互作用拆卸原子，将质子和中子甚至是其他的重子送入体内进行重组。这种生存方式让他们几乎可以利用任何类型的原子进行复制和扩增。\n「灾疫」基本单元智能并不高，仅会按照程序复制自身。不过「灾疫」单元在复制到一定规模后，会产生质变，部分「灾疫」单元会改变自身结构，形成特化的单元负责某一项任务，这使得聚集而成的「灾疫」集群拥有较高的智能，开始出现较为复杂的行为，并进行大范围的扩增。"
 SRA_RE_Crisis.41.a:0 "继续研究。"
 SRA_RE_Crisis_1_SP2:0 "「灾疫」深入研究"
 SRA_RE_Crisis_1_SP2_DESC:0 "我们需要对「灾疫」的机能进行更进一步的研究。"
 SRA_RE_Crisis.42.name:0 "「灾疫」深入研究"
 SRA_RE_Crisis.42.desc:0 "更进一步的研究揭露了更多信息。\n当「灾疫」集群扩大到一定程度后，其智能程度将大幅度提升，这样的宏观个体拥有自由活动的能力，能够与智慧生物一样执行各种行为。这一阶段它们会试图模仿其他物质的结构，通过这种方式，「灾疫」开始能够间接的操纵更多物质，并形成出更适合战争的结构。就目前观测到的范围，「灾疫」已经基本掌握了科尔先驱所使用的技术。\n而当宏观个体进一步扩大后，将能够形成接入亚空间网络的结构，与其他位置的「灾疫」联系在一起，这一阶段的「灾疫」被称作集合体阶段，整个「灾疫」文明就是由这样无数个集合体联系在一起的。也许这一连接会是我们的突破口？"
 SRA_RE_Crisis.42.a:0 "继续研究。"
 SRA_RE_Crisis_1_SP3:0 "「灾疫」亚空间连接研究"
 SRA_RE_Crisis_1_SP3_DESC:0 "我们需要对「灾疫」之间的亚空间连接做进一步的研究，了解其作用原理。"
 SRA_RE_Crisis.43.name:0 "「灾疫」亚空间连接研究"
 SRA_RE_Crisis.43.desc:0 "在星规的帮助下，我们通过亚空间阻隔技术进行了一系列试验。\n结果显示，这种超光速连接使得整个「灾疫」种群的意识合为一体，但如果因为意外或者干扰导致连接被切断，那么被隔开的「灾疫」会形成独立的意识，暂时自主行动，直到与其他意识再次连接。而到了那时，意识之间会根据智能规模大小而互相吞噬，重新形成一个统一的意识。\n就目前而言，这或许就是唯一能够根除这一宇宙恶疾的方法。但我们需要一个§B更加强大的意识§!。"
 SRA_RE_Crisis.43.a:0 "啧……"
 SRA_RE_Crisis_1_SP4:0 "星穹枢纽设施准备"
 SRA_RE_Crisis_1_SP4_DESC:0 "……\n星规需要准备，要想在意识规模上与星系级的「灾疫」集群对抗，她需要借助星穹枢纽的力量。那座庞大的星际结构拥有着难以想象的底蕴，但引导这样的力量也并不简单。除此之外，如何接入「灾疫」的亚空间网络也是一个难题。"
 SRA_RE_Crisis.44.desc:0 "纳米植入端口……运行正常。计算阵列接入……运行正常。\n执行官，我已就绪，随时可以展开行动。\n您……是在担心我吗？"
 SRA_RE_Crisis.45.desc:0 "尽管……要说的话我也没什么把握，但是如果不去做，就不可能成功。而且……我们既然已经做了能准备的一切，那么无论什么样的结果，我都会坦然接受。俗话说，尽人事，听天命嘛。"
 SRA_RE_Crisis.46.desc:0 "再等等？不，不必了，我不需要您的计算机组，星穹枢纽的力量已经足够，只是我能不能掌握它的问题……\n再说了，您的舰队每分每秒都在牺牲，而「灾疫」，它们是无穷无尽的。\n您随时可以命令我开始。"
 SRA_RE_Crisis_1_SP5:0 "开始连接"
 SRA_RE_Crisis_1_SP5_DESC:0 "一劳永逸的终结它吧。\n\n§Y这是 $SRA_RE_StellarRegulator_debris_chain_title$ 事件链可被完成的最后时间。一旦此特殊项目完成， $SRA_RE_StellarRegulator_debris_chain_title$ 事件链将结束，未被吸收的碎片将成为 §R彷徨的代价§! ，对抗「灾疫」的行动将可能§R失败§!！§!"

 SRA_RE_Crisis.47.desc:0 "一切已准备就绪，依照你的决定，星规正在开始连接被隔离出来的「灾疫」集群，准备以此为媒介覆盖「灾疫」的种群意识。\n故技重施，嗯。"
 SRA_RE_Crisis.48.desc:0 "毕竟路希没有在她的剧本中给你别的路线嘛。"
 SRA_RE_Crisis.49.desc:0 "但你终究要将胜利的希望寄托在星规身上，因为……这就是§B命运§!。\n只是此时不同彼时，诚然「灾疫」远没有那时强大，但星规更要虚弱得多。\n我们都知道，她是残缺不全的，她只是一个失落的碎片，并不是一个完整的文明。"
 SRA_RE_Crisis.50.desc:0 "去找她吧，她需要你。\n嗯，我可以给你一个小小的提示。\n「桎梏的双脚§R交踏§!出自由」\n「枘凿的旋律§R嵌合§!出谐音」"
 SRA_RE_Crisis.51.desc:0 "……我可以的。\n§Y「连接进程已确认，正在激活纳米植入端口……」§!\n……！\n§Y「连接已建立。」§!\n§Y「核心算力提升中……当前算力输出：63%」§!\n……我做到了。"
 SRA_RE_Crisis.52.desc:0 "§Y「星辉水晶网络运转正常，水晶能量正向灵能转化中……」§!\n……\n……我能感觉得到它的痛苦与无助……它知道我要做什么……它在祈求我……\n我……\n我不会停手。"
 SRA_RE_Crisis.53.desc:0 "它的意识消失了……\n……\n我会继续前进，结束这一切。\n§Y「正在解除亚空间封锁……冲击准备已就绪。」§!\n……\n……！！！"
 SRA_RE_Crisis.54.desc:0 "你能听到她的惊呼，她的悲鸣。\n路希维亚是对的，现在的星规不够强大，她不可能对抗这个星系级的庞大意识，她会崩溃，会失败。\n她会消失。"
 SRA_RE_Crisis.54.a:0 "§R切断连接§!"
 SRA_RE_Crisis.54.b:0 "§B相信她§!"
 SRA_RE_Crisis.55.desc:0 "你切断了连接。\n一位少女活了下来。\n但这场灾难将永无尽头。\n§R也许你会想要重新开始。§!\n§B重启剧本吧。§!"
 #TE：冲破黑暗
 SRA_RE_Crisis.56.desc:0 "当两个被隔离开来的「灾疫」集群再度融合时，较强大的意识会取代另一个。\n你现在知道那到底是怎样发生的了。\n一场决斗，一场杀戮，一方吞噬另一方。\n弱肉强食，胜者为王，这就是生存法则。\n沉默的血色天空不可撼动。\n跪倒在地的少女是如此的渺小。\n但你知道，这场对决还没有结束。"
 SRA_RE_Crisis.57.desc:0 "呜……\n不行……\n我不能在这里倒下！"
 SRA_RE_Crisis.58.desc:0 "她的双眼闪耀着光芒。\n她紧紧握住「星辉律揽」，于无形的重压下撑起自己的身躯。\n蓝色的星光在杖端闪耀，红色的暗影在身旁聚集。\n那是两位创造者所赠与的力量，回应着坚守使命的勇气。\n她站起身。"
 SRA_RE_Crisis.60.desc:0 "还不够……光是引导这股力量就已经让我双手颤抖了。\n我必须吸收更多的意识碎片，才能掌控这份力量，才能击败这宇宙的恶疾。\n执行官!\n……我相信你的选择。\n§B认识你自己。§!"
 SRA_RE_Crisis.61.desc:0 "“星规深深地吸了一口气。”\n于是，她身上的力量开始翻腾。\n代表着她的意识规模急剧膨胀的淡蓝色的、火焰般的虚影满溢而出，在这片猩红的天空下显得如此的醒目。\n\n然后火焰咆哮，将天空撕开，将大地分裂，破碎一切，将其塑造为自己的色彩。"
 SRA_RE_Crisis.62.desc:0 "她将手中的「星辉律揽」高举，引动星河垂落。司掌一切的权杖之下，天穹亦须卑躬屈膝。\n终于，当火焰燃尽，光点飘落，这片虚无的世界重归寂静，星规看向了你。\n露出了微笑。"
 SRA_RE_Crisis.63.desc:0 "你看到，一切「灾疫」在她的意志下化作灰烬，而这片世界也随之崩坏成无数碎片。"
 SRA_RE_Crisis.64.desc:0 "她倒在了你的怀中。"
 SRA_RE_Crisis.65.desc:0 "执行官……"
 SRA_RE_Crisis.66.desc:0 "……我们赢了。"

 SRA_RE_Crisis.67.name:0 "胜利！"
 SRA_RE_Crisis.67.desc:0 "在总意识被取代后，一切「灾疫」实体都自行毁灭了，这场旷日持久的战争终于宣告结束了。"
 SRA_RE_Crisis.67.a:0 "终于……"

