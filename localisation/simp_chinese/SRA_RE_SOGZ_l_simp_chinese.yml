l_simp_chinese:
###############################

 SRA_RE_SOGZ_Upkeep:0 "星穹之矛维护费"


 SRA_RE_SOGZ.1.desc:0 "非常感谢，这份能量应该足够了。\n我现在就去恢复储能水晶。"
 SRA_RE_SOGZ.2.desc:0 "§Y「拟似静滞立场已展开。」§!\n§Y「警告：能源即将耗尽。」§!\n别担心，我能搞定。"
 SRA_RE_SOGZ.3.desc:0 "好，这是最后一步了。\n……\n§Y「警告：当前能源剩余5%。」§!\n恢复成功了！\n嗯，修复大概需要4%的能源。\n什么时候执行修复程序由您决定吧。\n呃，飞起来之后，可能还需要您提供一点能源支持……\n§Y“启动修复程序”特殊项目已发布。§!\n§Y警告：预计维护费每月400能量币。§!"
 SRA_RE_SOGZ.4.desc:0 "修复程序完成，将能量导向驱动系统。\n折越引擎就绪，相关数据已获取。\n是时候重返星空了。"
 SRA_RE_SOGZ.5:0 "启航"
 SRA_RE_SOGZ.5.desc:0 "蓝色的流光划过白黑的舰体，镌刻其间的纹路与水晶一同亮起。\n然后。\n耀眼的蓝色光芒闪过。\n星穹之矛自大地之上消失。\n出现在无尽的星空中。"
 SRA_RE_SOGZ.5.a:0 "折越离开地表……"
 SRA_RE_SOGZ.6.desc:0 "武器系统就绪，护盾系统就绪，跃迁引擎就绪，舰队作战系统就绪……\n执行官阁下！\n您眼前的正是路希维亚帝国的辉煌造物，星规阵列超凡技术的结晶，一艘足以左右战争局势的超级战舰。\n啊……这种力量再次回到手中的感觉——"
 SRA_RE_SOGZ.7.desc:0 "§Y「警告：能源即将耗尽。」§!\n诶诶诶？！等一下，不要啊……\n执行官！执行官大人！\n那个……我现在把能量传输终端折越到地表上，您懂我的意思吧。"
 SRA_RE_SOGZ.7.a:0 "嗯……噗嗤"
 SRA_RE_SOGZ.7.b:0 "不懂。"
 SRA_RE_SOGZ.8.desc:0 "别笑……不，不准笑……\n我会生气的哦，真的会生气的。\n执行官！"
 SRA_RE_SOGZ.9.desc:0 "（她切断了通讯。）"
 SRA_RE_SOGZ.10.desc:0 "哼……\n……\n……我也不知道会这样的啦……那个……麻烦您了……（小声）"
 SRA_RE_SOGZ.11.desc:0 "在这个时候不要装傻啊！会掉下来的啊，真的会掉下来的！\n不要错开视线啊……\n啧。"
 SRA_RE_SOGZ.11.a:0 "好啦好啦，给你就是了。"
 SRA_RE_SOGZ.11.b:0 "嗯哼？"
 SRA_RE_SOGZ.12.desc:0 "……\n那个……请您……给我一点能量……\n呜……"
 SRA_RE_SOGZ.12.a:0 "好啦，会给你的啦……"
 SRA_RE_SOGZ.13.desc:0 "执行官执行官，现在有空吗？\n嗯，我想向您汇报一下有关星穹之矛的情况。"
 SRA_RE_SOGZ.14.desc:0 "就目前状况而言，星穹之矛的大部分功能仍处于停用状态。尽管基本战斗能力正常，但各种特殊战斗系统都无法正常运行。\n不仅仅是时空相位引擎无法重启的缘故，主控系统的崩溃，也是我无法完全控制这艘巨舰的一个重要原因。"
 SRA_RE_SOGZ.15.desc:0 "……\n嘛，不过总会有希望的。即使现在还修复不了主控系统，等您找到更多遗迹的时候，我说不定就能找到重启这些功能的办法了。\n我正在调整探测系统以准备下一次的定位，等到准备完毕的时候，我会通知您的。"
 SRA_RE_SOGZ.16.desc:0 "Rua!\n没有被吓到吗……无所谓，反正我觉得也不太可能。\n近来可好？晃晃悠悠，要吃许多维护费的星穹之矛能让你满意吗，不能？我也觉得。\n嗯，你注意到它的武器有点有气无力了？是这样，毕竟靠着外部输入的能源很难维持星穹之矛这种超级旗舰的正常运转。常年靠着时空相位引擎提供近乎无限能量的星规阵列舰船不怎么考虑低耗能运行能力。"
 SRA_RE_SOGZ.17.desc:0 "不过，就算是在这种状态下，拿它去欺负那些刚上天不久的新文明或者不思进取的老文明还是没问题的。\n因为科技的差距摆在那里嘛。\n哦，说到科技，我要提醒你一下。\n如果你研发出了零点能技术，那么就可以考虑去科研院看看了。\n那些可爱的小家伙们虽然要起经费来毫不含糊，但在给新项目立项的时候却只敢悄悄贴出来几张小纸条。\n所以你闲着没事的时候就去看看吧。"


 SRA_RE_SOGZ.20.desc:0 "我正准备修复空间操纵系统，这一系统涉及到一系列复杂的空间调整器，提供空间定位与结构弯曲，虫洞构建等功能。修复完成后，星穹之矛将获得额外一组可分配的系统能量。\n嗯，原本需要的材料对于你们的技术水平来说太过遥远了，不过我找到了一个下位替代方案。"
 SRA_RE_SOGZ.21.desc:0 "有一种被称作恩雷斯素元生物的罕见物种，它们独特的生理结构允许它们从外界物质中提炼“翘曲素”并储存在自己体内。恩雷斯素元生物借助“翘曲素”制造空间陷阱来捕捉猎物，而我可以让“翘曲素”作为替代品参与修复工作。"
 SRA_RE_SOGZ.22.desc:0 "存在恩雷斯素元生物的星球已经为您标在星图上了，您需要派遣陆军捕杀它们，回收“翘曲素”。\n呃，数据库提到，最好准备一些额外的陆军。\n就是这样了。"
 SRA_RE_SOGZ_SP1:0 "收集“翘曲素”"
 SRA_RE_SOGZ_SP1_DESC:0 "这颗星球上有恩雷斯翻车……素元生物，为了进一步修复星穹之矛，我们需要从它们身上收集太阳……“翘曲素”。\n嗯，就是这样。"
 SRA_RE_SOGZ.23:0 "取回“翘曲素”"
 SRA_RE_SOGZ.23.desc:0 "我们成功击杀了那只恩雷斯素元生物，从它残破的躯体里回收了所需的“翘曲素”，这下可以继续进行星穹之矛的修复工作了。\n……“从外界物质中提炼”是不是指进食？那这些没有被消化吸收的“翘曲素”不就是……我什么都没说。"
 SRA_RE_SOGZ.23.a:0 "别多想……别多想。"
 SRA_RE_SOGZ_SP3:0 "修复空间操纵系统"
 SRA_RE_SOGZ_SP3_DESC:0 "“翘曲素”已经备齐，是时候开展修复工作了。"
 SRA_RE_SOGZ.24:0 "翻车了"
 SRA_RE_SOGZ.24.desc:0 "正当我们的军队以强大的火力轰炸恩雷斯素元生物时，意外突然出现。\n恩雷斯素元生物在短暂蓄能后临时放出了空间陷阱，将我们的部队困住了！\n现在这些不幸的家伙们无力脱身，恐怕我们需要派遣额外的部队来解决这一切了。"
 SRA_RE_SOGZ.24.a:0 "真该死。"
 SRA_RE_SOGZ_SP2:0 "处理恩雷斯素元生物"
 SRA_RE_SOGZ_SP2_DESC:0 "狡猾的恩雷斯素元生物用空间陷阱困住了我们的部队，我们得派额外的部队过去了。\n真是的，我明明告诉过那个指挥官打翻车生物的时候不要切屏……"
 SRA_RE_SOGZ.25.desc:0 "测试已完成，系统运行良好，期待实战的检验。\n您可以随时联系我以开始下一阶段的修复工作。"
 SRA_RE_SOGZ.26.desc:0 "另外，我在舰体里发现了这个。\n（她展示着三枚“碎片”，其颜色分别为蓝色，红色与白色。）\n很遗憾，我并不知道它们是怎么被放进我的舰体里面去的……也许有什么人暗中策划了这一切？\n与之前一样，我相信您的选择，所以，请您做出决断吧。"
 SRA_RE_SOGZ.26.a:0 "吸收一个碎片"
 SRA_RE_SOGZ.26.b:0 "还是先等等吧"

 SRA_RE_SOGZ.27.desc:0 "执行官，唔，这边的话，准备开始修复能量调制系统了。\n这一系统主要负责协调舰体内各个设备的能量循环，同时还保证在高强度运行环境下设备的安全稳定。修复完成后，星穹之矛将获得额外一组可分配的系统能量。\n这一部分的修复倒是不需要什么特殊的资源……不过我需要“一些”能量和星界丝缕来进行调试工作。"
 SRA_RE_SOGZ.27.a:0 "资源已经准备妥当了！"
 SRA_RE_SOGZ.27.b:0 "囊中羞涩.jpg"
 SRA_RE_SOGZ_SP4:0 "修复能量调制系统"
 SRA_RE_SOGZ_SP4_DESC:0 "我们为星规提供了充足的资源，修复工作即刻可以展开。\n希望一切顺利。"
 SRA_RE_SOGZ.28:0 "墨菲定律"
 SRA_RE_SOGZ.28.desc:0 "我们的观测站突然汇报称在星穹之矛方向检测到了巨大的能量波动，与星穹之矛的通讯也中断了。"
 SRA_RE_SOGZ.28.a:0 "真是好的不灵坏的灵……"
 SRA_RE_SOGZ.29.desc:0 "咳咳，执行官……\n在吗？"
 SRA_RE_SOGZ.29.a:0 "发生什么了？"
 SRA_RE_SOGZ.29.b:0 "没事吧？"
 SRA_RE_SOGZ.29.c:0 "又出啥问题了？"
 SRA_RE_SOGZ.30.desc:0 "嗯……该怎么说呢……\n修复过程前半段都比较顺利。\n只是……后面我进行测试的时候，有一个区域的能量循环出了点问题，我检查了好几遍也没发现到底是哪里没弄好。\n然后，又测试了几遍还是不行，我就……"
 SRA_RE_SOGZ.30.a:0 "你就？"
 SRA_RE_SOGZ.31.desc:0 "我就踢了两脚。"
 SRA_RE_SOGZ.31.a:0 "标准修复法是吧……"
 SRA_RE_SOGZ.32.desc:0 "然后就……炸了。\n嗯……至少问题不用找了，那一整个区域我估计都得重建了。\n我需要一艘科研船来帮帮忙，给我加一点算力，顺便……\n把大概卡在了墙里的我的素体挖回来……"
 SRA_RE_SOGZ.32.a:0 "可还行。"
 SRA_RE_SOGZ_SP5:0 "协助修复工作"
 SRA_RE_SOGZ_SP5_DESC:0 "星规使用了一些比较……绿皮的修复方式，果不其然，炸了。\n我们需要稍微帮助一下她。\n\n§Y建议从银河视图右键恒星系来执行特殊项目§!"
 SRA_RE_SOGZ.33.desc:0 "谢了……\n总之，能量调制系统的修复工作告一段落了。\n您可以随时联系我以开始下一阶段的修复工作。"


 SRA_RE_SOGZ.34.desc:0 "执行官，接下来要修复的是时空相位引擎了。\n不过，鉴于这项工程相当浩大，整个修复工作需要划分成三段进行。\n现在准备进行的是第一阶段，进行基本功能的恢复，恢复星穹之矛的自供能能力，同时，获得额外一组可分配的系统能量。\n嗯，这需要您在这个位置建立一座实验设施，以制取某些我需要的材料。"
 SRA_RE_SOGZ.34.a:0 "没问题。"
 SRA_RE_SOGZ.34.b:0 "嗯……可能需要再等等。"
 SRA_RE_SOGZ_SP6:0 "建造时空相位偏移器"
 SRA_RE_SOGZ_SP6_DESC:0 "为了修复星穹之矛，我们需要在这个位置建造一座平台，借助黑洞的引力环境制取一些需要的材料。"
 SRA_RE_SOGZ.35:0 "设施完工"
 SRA_RE_SOGZ.35.desc:0 "时空相位偏移器已经完工了，您随时可以下令开始制取工作。\n\n§Y升级巨构 时空相位偏移器 以进行下一步§!"
 SRA_RE_SOGZ.35.a:0 "收到。"
 SRA_RE_SOGZ.351.MESSAGE_SRA_RE_Rocivia:0 "请暂停一下， 我是来提醒你别忘了在侧边总览栏的巨型结构列表里升级时空相位偏移器的。"
 SRA_RE_SOGZ_Repair_1:0 "时空相位偏移器" 
 SRA_RE_SOGZ_Repair_1_DESC:0 "这座平台上搭载着星规提供的一些神秘设备，在黑洞的引力环境下，可以制取一些时空相位引擎需要的材料。"
 SRA_RE_SOGZ_Repair_2:0 "开始制取" 
 SRA_RE_SOGZ_Repair_2_DESC:0 "开始制取工作，完成后平台会被拆除。"
 SRA_RE_SOGZ.36:0 "制取完成"
 SRA_RE_SOGZ.36.desc:0 "材料已经制备，我们正在小心地将其运送到星穹之矛上。"
 SRA_RE_SOGZ.36.a:0 "希望一切顺利……这次可不要再出岔子了。"
 SRA_RE_SOGZ.37.desc:0 "执行官，时空相位引擎第一阶段修复工作已顺利结束，相关设备运行良好，检修进展顺利。\n星穹之矛现在已经可以自行供能，因此您不需要再持续提供能量用于舰体运行。\n此外，武器系统的供能也得到了保障，能量输出调整已完成，现在它们可以正常工作了。\n您可以随时联系我以进行下一阶段修复工作。"

 SRA_RE_SOGZ.38.desc:0 "本次要修复的是主控系统，用于实现时空相位引擎的拓展功能。\n嗯，包括现在，我都是通过行动单元的人格构建计算阵列来控制星穹之矛的，其本身的控制系统尚未得到修复。尽管这种覆盖原有系统的控制方式可以实现大部分功能，但少部分功能需要主控系统才能稳定运行。"
 SRA_RE_SOGZ.38.a:0 "希望一切顺利……这次可不要再出岔子了。"
 SRA_RE_SOGZ.39.desc:0 "啊，这个啊……\n嗯……您要知道，我们毕竟是机械智能。大多数有机开智生物的意识产生于它们的大脑，而我们的意识则产生于我们的计算阵列。\n星规阵列的每一艘战舰都有其自身的计算阵列以维持控制系统，这样一来在指挥时我们就不需要亲自为它们计算弹道或调整能量配比或改变推进器功率之类的，而只需要下达“去哪，用啥，打谁，的哪里”这样的指令。而星穹之矛则在此基础上额外搭载了用于构建人格的计算阵列，毕竟别的船没有那么多冗余空间和能量“带宽”。"
 SRA_RE_SOGZ.40.desc:0 "可以说，我们是搭载在星穹之矛上的指挥官。\n不过，实际上有一系列措施保护着我们的意识，比如说，为同一个人格配备复数的星穹之矛，还有，制造专门的人格承载用素体。\n我有许多素体，但只有一个是真正承载着我的人格的——与星穹之矛上的计算阵列一同。"
 SRA_RE_SOGZ.41.desc:0 "§Y她左手抚上自己的胸口。§!\n\n以['concept_SRA_Stellarcrystal_Fractal']所构建的这副躯体，拥有着如一整个舰载计算阵列般的计算能力，能够承载起完整的人格。同时，其内部的供能系统能维持长久的独立运行，微缩折越引擎能保证机动性，流转自如的['concept_SRA_Stellarcrystal_Fractal']和我的灵能则共同建立了基本的战斗力和生存能力。"
 SRA_RE_SOGZ.42.desc:0 "虽说一般情况下这套设计没什么用就是了……联网的情况下就算星穹之矛被全部击毁人格也能通过星辉水晶网络保存下来，更不要说还有基地里的那些计算阵列了……也就是现在这样可以提供一点保险了……"
 SRA_RE_SOGZ.43.desc:0 "说远了。关于修复主控系统，与之前一样，我需要一点额外的帮助。\n原有的那部分计算阵列在坠毁中整个烧结在一起了，为了重建系统，我不仅得重新制造计算阵列，还得从残骸中复原出系统架构——至少大部分架构。\n计算阵列的事好说，但复原系统这方面，我需要科学院的帮助。"
 SRA_RE_SOGZ.44.desc:0 "我会发布一系列特殊项目，您可以随时开始或中断工程。事先提醒您，我可不能保证一次成功。"

 SRA_RE_SOGZ_SP7:0 "星穹之矛主控系统修复：一"
 SRA_RE_SOGZ_SP7_DESC:0 "星规需要我们的帮助来复原星穹之矛的主控系统，现在要进行的是第一阶段。"
 SRA_RE_SOGZ.45:0 "第一阶段成功"
 SRA_RE_SOGZ.45.desc:0 "复原进展顺利，系统结构较为清晰，推测为正确结果，可以进行下一阶段。"
 SRA_RE_SOGZ.45.a:0 "确认。"
 SRA_RE_SOGZ.46:0 "第一阶段失败"
 SRA_RE_SOGZ.46.desc:0 "结构错误，适配失败，需要重新进行复原工作。"
 SRA_RE_SOGZ.46.a:0 "真不幸。"
 SRA_RE_SOGZ_SP8:0 "星穹之矛主控系统修复：二"
 SRA_RE_SOGZ_SP8_DESC:0 "星规需要我们的帮助来复原星穹之矛的主控系统，现在要进行的是第二阶段。"
 SRA_RE_SOGZ.47:0 "第二阶段成功"
 SRA_RE_SOGZ.47.desc:0 "结构衔接良好，内容补充合理，可以进行下一阶段工作。"
 SRA_RE_SOGZ.47.a:0 "确认。"
 SRA_RE_SOGZ.48:0 "第二阶段失败"
 SRA_RE_SOGZ.48.desc:0 "显然，数据结构与先前结果并不匹配，我们需要再次尝试。"
 SRA_RE_SOGZ.48.a:0 "好吧。"
 SRA_RE_SOGZ_SP9:0 "星穹之矛主控系统修复：三"
 SRA_RE_SOGZ_SP9_DESC:0 "星规需要我们的帮助来复原星穹之矛的主控系统，现在要进行的是第三阶段。"
 SRA_RE_SOGZ.49:0 "复原成功"
 SRA_RE_SOGZ.49.desc:0 "系统试运行正常，复原工作成功，任务完成。"
 SRA_RE_SOGZ.49.a:0 "非常好。"
 SRA_RE_SOGZ.50:0 "第三阶段失败"
 SRA_RE_SOGZ.50.desc:0 "运行失败，错误节点已确认，需要调整。"
 SRA_RE_SOGZ.50.a:0 "真麻烦。"
 SRA_RE_SOGZ.51:0 "严重错误"
 SRA_RE_SOGZ.51.desc:0 "“星规没有告诉过你测试的结果如何吧？”\n“星规告诉过我了，系统结构完整合理，我们是正确的。”\n“不，复原是完全错误的，事实上，测试结果是运行失败。”\n“不……这不是真的，这不可能！”\n“浏览一下测试记录吧，这是真的。”\n“不——”"
 SRA_RE_SOGZ.51.a:0 "这两个人是都断了手吗？（恼）"
 SRA_RE_SOGZ.52.desc:0 "能量导流正常，时空结构稳定，回溯周期在误差范围内，时间点正确……测试完成，奇点爆发运行正常。\n主控系统修复完毕，正在更新配置……\n执行官，您可以随时联系我进行下一步修复工作，或者说，最后一步。"

 SRA_RE_SOGZ.53.desc:0 "最后一次修复工作已经准备好开始了，本次的目标是能量容器组和相位增幅器。一旦完成，星穹之矛将再次获得额外一组可分配的系统能量。"
 SRA_RE_SOGZ.54.desc:0 "嗯，这并不需要您去银河系的某个角落搜集某种神奇的材料，需要的只是“一小点”资源，嗯……\n好吧，对以前的我来说，大概是个小资源。"
 SRA_RE_SOGZ.54.a:0 "买买买！这是军费，不能省啊你说是不是。"
 SRA_RE_SOGZ.54.b:0 "这“亿小点”一时半会我还真掏不出来……"
 SRA_RE_SOGZ.55.desc:0 "没关系没关系，也不急于一时嘛。您有足够资源后可以在来找我。\n说起来我之前都没感觉这些启动资源这么贵……"
 SRA_RE_SOGZ.56.desc:0 "其实这也是一种替代性操作……原本应该有一种专业性设备来减少损耗的，但我的数据库里没有相关蓝图……\n我会启动局部时间调整作为试运行，这同时也能帮助修复工作迅速完成。请稍等。"
 SRA_RE_SOGZ.57.desc:0 "“现在，时间站在我们这一边。”\n恭喜，执行官，星穹之矛的修复工作至此彻底完成了。希望这艘伟大的造物能与我一同为您带来胜利。"


