 #Annihilating Fabrications
 SRA_Eliminater:0 "§B肃星神械§!"
 SRA_Eliminater_desc:0 "肃星神械，或称星规行星肃清单元，是一系列由['concept_SRA_Stellarcrystal_Fractal']所打造的先进战争机械的总称，这一集合作为地表战争的最终解决方案，能以超乎想象的速度摧毁一切抵抗。\n大多数情况下，肃星神械表现为一座巨大的悬浮作战平台，主要搭载空间撕裂武器、抹除武器以及脉冲能量束。考虑到复杂的地表战况和外星生命形式，它同时还可以构建出电磁脉冲、中子羽流等特化武器以高效的清除任何抵抗者。如有需求，肃星神械也能重组成为任意大小的作战机械，系统性的肃清多样化的防御工事。"
 SRA_Eliminater_Attacker:0 "§B肃星神械-强袭§!"
 SRA_Eliminater_Attacker_desc:0 "肃星神械，或称星规行星肃清单元，是一系列由['concept_SRA_Stellarcrystal_Fractal']所打造的先进战争机械的总称，这一集合作为地表战争的最终解决方案，能以超乎想象的速度摧毁一切抵抗。\n大多数情况下，肃星神械表现为一座巨大的悬浮作战平台，主要搭载空间撕裂武器、抹除武器以及脉冲能量束。考虑到复杂的地表战况和外星生命形式，它同时还可以构建出电磁脉冲、中子羽流等特化武器以高效的清除任何抵抗者。如有需求，肃星神械也能重组成为任意大小的作战机械，系统性的肃清多样化的防御工事。\n而这一单位的肃星神械当前则正承担地表攻占任务。"
 SRA_Eliminater_Defender:0 "§B肃星神械-守御§!"
 SRA_Eliminater_Defender_desc:0 "肃星神械，或称星规行星肃清单元，是一系列由['concept_SRA_Stellarcrystal_Fractal']所打造的先进战争机械的总称，这一集合作为地表战争的最终解决方案，能以超乎想象的速度摧毁一切抵抗。\n大多数情况下，肃星神械表现为一座巨大的悬浮作战平台，主要搭载空间撕裂武器、抹除武器以及脉冲能量束。考虑到复杂的地表战况和外星生命形式，它同时还可以构建出电磁脉冲、中子羽流等特化武器以高效的清除任何抵抗者。如有需求，肃星神械也能重组成为任意大小的作战机械，系统性的肃清多样化的防御工事。\n而这一单位的肃星神械当前则正承担地表防御任务。"

 SRA_T3_Machine_Army:0 "星辉视界尖兵"
 SRA_T3_Machine_Army_desc:0 "由['concept_SRA_Composite_Crystal_Lattice']技术所打造的，拥有视界奇点核心的庞大战争机器，装载了无数毁灭性的武器。对引力与空间的掌控使它们能偏折一应攻击，轻松撕碎其所行道路上的一切。"
 SRA_T3_Machine_Army_Defender:0 "星辉视界尖兵-守御"
 SRA_T3_Machine_Army_Defender_desc:0 "由['concept_SRA_Composite_Crystal_Lattice']技术所打造的，拥有视界奇点核心的庞大战争机器，装载了无数毁灭性的武器。对引力与空间的掌控使它们能偏折一应攻击，轻松撕碎其所行道路上的一切。\n而这一单位的星辉视界尖兵当前则正承担地表防御任务。"

 SRA_Hunter_Of_Chaos:0 "§R深渊猎手§!"
 SRA_Hunter_Of_Chaos_desc:0 "战士与无际黑暗争斗，甘愿背负黑暗的一角。\n凭深渊之力狩猎深渊，以自我与存在对抗混沌的刻痕，屠戮无序，扼杀终结。\n赴死之人，踏上英雄之路。\n\n\n\n\n§R万物生发复归根，凡事从此始\n荆棘丛生枯骸骨，死亡亦归途§!"
 SRA_Solar_Knight_Defender:0 "§Y炎阳骑士§!"
 SRA_Solar_Knight_Defender_desc:0 "灿阳的剑刃永燃，誓要烧尽一切黑暗。\n作为早在前太空时代就成立的无国界深渊对策组织，炎阳骑士团在对抗构造体上有非凡的经验和见解。他们承担着整个萨塔瑞兹境内的深渊防卫工作，并时刻准备在第一线奋战到底。"
 SRA_Hunter_Of_Chaos_Attacker:0 "§R失序猎手§!"
 SRA_Hunter_Of_Chaos_Attacker_desc:0 "战士与无际黑暗争斗，终于也成为黑暗的一角。\n深渊永恒谈何狩猎，对抗混沌的刻痕必将磨灭自我与存在，扩散无序，蔓延终结。\n赴死之人，踏上苦痛之路。\n\n\n\n\n§R灾祸磨难降生大地，行路之人灵魂浑浊\n所为所作消散人世，所思所忧归向虚空§!"
 SRA_Machine_Army_Of_Chaos_Attacker:0 "§R构装晶骸§!"
 SRA_Machine_Army_Of_Chaos_Attacker_desc:0 "被一道意志自深渊创生，徘徊着，迷惘着，将所见的一切带入永恒。\n这样的造物踏出的每一步都是对现实的亵渎，吞噬万物只为更多，张扬无序与混沌，湮灭现实与真实。"

